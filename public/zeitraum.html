        aus; abzüglich des Netzbezugs wären ${zahl(Math.round(erwartet * 100) / 100)}
        kWh aus der eigenen Anlage zu erwarten.</span>`;
    }
  }
  const felder = bearbeitbar
    ? `<div class="sp-zeile">
        <input type="text" inputmode="decimal" data-strom-menge="${k.position_id}"
          value="${wert}" placeholder="kWh" aria-label="Verbrauch in kWh">
        <span class="sp-eh">kWh</span>
        ${knopf('extern', 'Netzbezug')}${knopf('eigen', 'eigene Anlage')}
      </div>`
    : `<div class="sp-zeile"><span class="sp-fest">${wert ? `${wert} kWh` : '—'}
        ${k.herkunft === 'eigen' ? '· eigene Anlage'
          : (k.herkunft === 'extern' ? '· Netzbezug' : '')}</span></div>`;
  return `<div class="strompos"><label>Verbrauch &amp; Herkunft</label>
    ${felder}${preis}${abgleich}</div>`;
}

/* Der runde Zähler-Chip vor dem Namen. Der Tooltip stellt klar, dass hier der
   abgelesene Verbrauch steht — nicht die Verteilungsgewichte der Position. */
function chipHtml(k) {
  // N122 — an den Strom-Positionen steht die erfasste Menge (extern/intern),
  // sobald eine gepflegt ist; sonst wie überall der abgelesene Verbrauch.
  if (istStromPos(k)) {
    const strom = stromChipsHtml(k);
    if (strom) return strom;
  }
  const c = chipMap.get(k.kostenart);
  if (!c) return '';
  return `<span class="mchip" title="Zählerstand · abgelesener Verbrauch im ` +
    `Zeitraum — nicht die Verteilungsgewichte">${chipZahl(c.verbrauch)}&nbsp;${
      esc(chipEinheit(c.messeinheit))}</span>`;
}

/* ---- N47: Wasser — Zähler-Erfassung + Detail-Sammelposition -------------- */

/* Anzeige-Titel je Wasser-Art in der Zählerübersicht. */
const WASSER_GRUPPE = { Kaltwasser: 'Kaltwasser', Warmwasser: 'Warmwasser',
  Waschmaschine: 'Waschmaschinen', Gartenwasser: 'Gartenwasser' };

/* Zu welcher Wasser-Art ein Zähler zählt — bevorzugt aus `art`, sonst aus dem
   Namen. Waschmaschine/Garten VOR Warm-/Kaltwasser prüfen (sonst schlucken die
   generischen Muster die spezielleren). '' = kein Wasser-Zähler (z. B. Gesamt/
   Rest oder Öl/Strom). */
function wasserArt(z) {
  for (const feld of [normUml(z.art || ''), normUml(z.name || '')]) {
    if (!feld) continue;
    if (feld.includes('waschmaschine')) return 'Waschmaschine';
    if (feld.includes('garten')) return 'Gartenwasser';
    if (feld.includes('warmwasser')) return 'Warmwasser';
    if (feld.includes('kaltwasser')) return 'Kaltwasser';
  }
  return '';
}

/* Die Kostenart, welche die drei Bestandteile (Frisch-/Schmutz-/Niederschlags-
   wasser) zusammenfasst — an ihr hängt der Detail-Knopf. Bewusst eng: nur die
   reine „Wasser"-Position, nicht Abwasser/Niederschlag/Kalt-/Warmwasser/Zähler. */
function istWasserSammel(k) {
  const n = normUml(k.kostenart);
  if (n.includes('zaehler') || n.includes('abwasser') || n.includes('schmutz')
      || n.includes('niederschlag') || n.includes('entwaesser')
      || n.includes('kaltwasser') || n.includes('warmwasser')) return false;
  return n === 'wasser' || n === 'frischwasser' || n === 'trinkwasser';
}

/* N142 — die Stromkette hängt an genau EINER Zeile: der obersten Strom-Position
   der Checkliste. Sonst stünde dieselbe Kette mehrfach da (Netzbezug und
   Eigenverbrauch sind zwei Positionen derselben Rechnung). */
function istStromKettePos(k) {
  return istStromPos(k) && (daten.checkliste || []).find(istStromPos) === k;
}

/* Das Panel, in das `fuelleStromketteInline` die drei Schritte lädt. */
const stromKetteHtml = k => istStromKettePos(k)
  ? `<div class="sk-inline" data-strom-kette="${zid}">
      <div class="wd-lade">Stromkette wird geladen …</div></div>` : '';

/* N89 — die Strom-Position: der Strombetrag je Einheit entsteht in der
   PV-/Strom-Rechnung (eigene Seite, je Objekt und Jahr) und fließt hier in die
   Nebenkostenabrechnung zurück. Beim Aufklappen zeigt sie die Positionen je
   Einheit; verteilt wird also nicht über einen Schlüssel, sondern über die
   dortige Zähler-/Quellen-Rechnung. */
function istStromPos(k) {
  const n = normUml(k.kostenart);
  if (n.includes('zaehler')) return false;
  // N122 — es gibt jetzt zwei Strom-Positionen (Netzbezug und Eigenverbrauch);
  // wie der Nutzer sie nennt, bestimmt er selbst. Darum jede Kostenart mit
  // „Strom" im Namen, nicht nur die beiden alten Schreibweisen.
  return n.includes('strom') || n.includes('beleucht');
}

/* N101 — die Gesamtsumme der drei Wasser-Bestandteile (Frisch-, Schmutz-,
   Niederschlagswasser). Sie stehen als eigene Kostenpositionen in der Liste,
   sichtbar ist aber nur die Sammelzeile — sie muss die ganze Rechnung zeigen. */
function wasserGesamtBetrag() {
  return (daten.checkliste || []).reduce((s, k) => {
    const n = normUml(k.kostenart);
    const dazu = istWasserSammel(k) || n.includes('abwasser')
      || n.includes('schmutzwasser') || n.includes('niederschlag');
    return dazu ? s + (k.betrag || 0) : s;
  }, 0);
}

/* N74 — die Wasser-Sammelposition trägt erst eine Rechnung, wenn ein Beleg mit
   Betrag hochgeladen wurde. Vorher gibt es nichts aufzuklappen (keine Detail-
   ebene), nur „Datei wählen". `erledigt` heißt: Betrag liegt vor (aus dem PDF). */
function wasserHatRechnung(k) {
  return !!(k.erledigt || (k.belege && k.belege.length));
}

/* N79 — die Heizöl-/Heizkosten-Sammelposition: beim Aufklappen erscheint der
   Öl-Manager (Lieferungen erfassen, FIFO-Bewertung), statt eines Handbetrags.
   Bewusst eng: nur die reine Heizung/Heizkosten-Position, nicht Warmwasser,
   nicht „Wartung Heizung". */
function istHeizoelSammel(k) {
  const n = normUml(k.kostenart);
  if (n.includes('wartung') || n.includes('warmwasser')) return false;
  // N91 — nur die ÖL-Position (Einkauf): Lieferungen + FIFO. „Heizung" trägt
  // jetzt die Heizkörper-Wärmemenge, nicht mehr den Öl-Manager.
  return n === 'heizkosten' || n.includes('heizoel') || n.includes('heizol');
}

/* N91 — die Warmwasser-Position: hier steht der §9-Split (wie viel des Öls in
   die Warmwassererzeugung geht) samt seiner Verteilung. */
function istWarmwasserPos(k) {
  const n = normUml(k.kostenart);
  return n === 'warmwasser' || n.includes('warmwassererzeug');
}

/* N91 — die Heizungs-Position: Heizkörper-Wärmemenge über die
   Heizkostenverteiler (Faktor × Einheiten). Nicht „Wartung Heizung". */
function istHeizwaermePos(k) {
  const n = normUml(k.kostenart);
  if (n.includes('wartung') || n.includes('warmwasser')) return false;
  return n === 'heizung' || n.includes('heizkoerper') || n.includes('waermemenge');
}

/* N68 — generische Anzeigenamen je Zähler-id: die spezifischen Namen treten in
   der Übersicht zurück, die Zugehörigkeit setzt der Nutzer über den Chooser.
   Nur Unterzähler (kein Hauptzähler, kein Rest) bekommen ein generisches Label
   nach Art; Waschmaschinen werden durchnummeriert. Hauptzähler/Rest behalten
   ihren Namen. Wird je Neuzeichnung aus der Zählerliste gefüllt. */
let zLabels = new Map();
function generischeLabels(zaehler) {
  const map = new Map();
  // N101 — „WG" ist überholt: das Haupthaus sind zwei Wohnungen. Alte
  // Zählernamen werden in der Anzeige entsprechend gelesen.
  for (const z of zaehler) {
    if (/\bWG\b/.test(z.name || '')) {
      map.set(z.id, (z.name || '').replace(/\bWG\b/g, 'Haupthaus'));
    }
  }
  let wm = 0;
  for (const z of zaehler) {
    if (!z.hauptzaehler_id || z.typ === 'rest') continue;
    const art = wasserArt(z);
    if (art === 'Waschmaschine') map.set(z.id, `Waschmaschine ${++wm}`);
    else if (art === 'Kaltwasser') map.set(z.id, 'Kaltwasserzähler');
    else if (art === 'Warmwasser') map.set(z.id, 'Warmwasserzähler');
    else if (art === 'Gartenwasser') map.set(z.id, 'Gartenwasser');
  }
  return map;
}

/* Wasser als m³ (deutsch, bis 2 Nachkommastellen). */
const m3 = n => `${(n ?? 0).toLocaleString('de-DE', { maximumFractionDigits: 2 })} m³`;

/* N57 — diese Wasser-Bestandteile leben nur noch im Detail-Popup und werden aus
   der Checkliste herausgefiltert: Abwasser/Schmutzwasser, Niederschlagswasser
   und der Kaltwasserzähler. Die reine „Wasser"-Sammelposition bleibt sichtbar. */
function istImDetailPopup(k) {
  if (istWasserSammel(k)) return false;
  const n = normUml(k.kostenart);
  if (n.includes('abwasser') || n.includes('schmutzwasser')) return true;
  if (n.includes('niederschlag') || n.includes('entwaesser')) return true;
  if (n.includes('kaltwasser') && n.includes('zaehler')) return true;
  return false;
}

/* ---- N58–N61: Zählerstände-Übersicht ------------------------------------
   Ein Einklapp-Panel, das ALLE Zähler nach Kostenblock (Wasser/Heizung/Strom/
   Sonstige) gruppiert; innerhalb Wasser nach Art, mit Kaltwasser als laufender
   Subtraktion vom Gesamtverbrauch. Jede Zeile: Anfang + Ende editierbar (mit
   Datum) und ein Mehrfach-Auswähler aller Einheiten des Objekts. */

const KOSTENBLOCK_ORDER = ['Wasser', 'Heizung', 'Strom', 'Sonstige'];

/* Der Kostenblock eines Zählers aus Kostenart/Name — ohne Kontext. Serverfeld
   `kostenblock` hat Vorrang (Backend-Vertrag). '' = aus dem Namen nicht ableitbar
   (z. B. ein Unterzähler „Büro"), dann erbt er später vom Hauptzähler. */
function zaehlerBlockBasis(z) {
  if (z.kostenblock && KOSTENBLOCK_ORDER.includes(z.kostenblock)) return z.kostenblock;
  const n = normUml(z.kostenart || z.name || '');
  if (n.includes('wasser') || n.includes('niederschlag') || n.includes('entwaesser'))
    return 'Wasser';
  if (n.includes('heiz') || n.includes('waerme') || n.includes('gas')
      || n.includes('oel') || n.includes('brennstoff')) return 'Heizung';
  if (n.includes('strom') || n.includes('beleucht')) return 'Strom';
  return '';
}

/* Kostenblock je Zähler-id, kontextbewusst: ein Unterzähler oder Rest ohne
   eigenes Stichwort erbt den Block seines Hauptzählers (so landet „Büro" als
   Kaltwasser-Unterzähler im Wasser-Block). Ohne Ableitung → „Sonstige". */
function zaehlerBloecke(zaehler) {
  const byId = new Map(zaehler.map(z => [z.id, z]));
  const cache = new Map();
  const block = (z, tiefe = 0) => {
    if (cache.has(z.id)) return cache.get(z.id);
    cache.set(z.id, 'Sonstige');                       // Zyklus-Schutz
    let b = zaehlerBlockBasis(z);
    if (!b && z.hauptzaehler_id && byId.has(z.hauptzaehler_id) && tiefe < 8) {
      b = block(byId.get(z.hauptzaehler_id), tiefe + 1);
    }
    b = KOSTENBLOCK_ORDER.includes(b) ? b : 'Sonstige';
    cache.set(z.id, b);
    return b;
  };
  const map = new Map();
  for (const z of zaehler) map.set(z.id, block(z));
  return map;
}

/* Die Einheiten-Zuordnung eines Zählers: das Serverfeld `einheiten`, sonst der
   einzelne `einheit_bezug` als Liste (Fallback laut Backend-Vertrag). */
function zaehlerEinheiten(z) {
  if (Array.isArray(z.einheiten) && z.einheiten.length) return z.einheiten;
  return z.einheit_bezug ? [z.einheit_bezug] : [];
}

/* N77b — im Chooser NUR die echten, an der NK teilnehmenden Immobilien-Einheiten
   (aus dem Objekt-Endpunkt, Garage/nk_abrechnung=false bereits herausgefiltert).
   Bewusst NICHT die Partei-Namen oder veralteten Zähler-Labels („Büro", „WG",
   „Roman & Alicia") — die stifteten nur Verwirrung; veraltete Zuordnungen
   korrigiert der Nutzer, indem er die richtige Einheit wählt. */
function alleEinheiten() {
  return [...new Set((objektEinheiten || []).filter(Boolean))];
}

/* N58 — kompakter Mehrfach-Auswähler aller Einheiten für einen Zähler. Gewählte
   Einheiten sind gefüllt (teal), die übrigen als Umriss-Chip. Ein Tipp schaltet
   um und speichert sofort via PATCH /zaehler/{id} {einheiten:[…]}. */
function einheitChooserHtml(z) {
  const alle = alleEinheiten();
  if (!alle.length) return '';
  const gewaehlt = new Set(zaehlerEinheiten(z));
  const chips = alle.map(e => `<button type="button"
      class="zu-eh${gewaehlt.has(e) ? ' an' : ''}"
      data-einheit-toggle="${z.id}" data-einheit="${esc(e)}"
      aria-pressed="${gewaehlt.has(e)}">${esc(e)}</button>`).join('');
  return `<div class="zu-ehwahl"><span class="zu-ehl">Zählt auf</span>
    <div class="zu-ehchips">${chips}</div></div>`;
}

/* N88 — die Umrechnung eines Zählers sichtbar machen: der Ablesewert gilt zu
   SEINEM Datum, die Abrechnung braucht ihn zur Periodengrenze. Der Randwert zur
   Grenze ist genau `vorwert.stand + verbrauch` (so bildet ihn `ablesung.py`:
   randwert_neu = randwert_alt + interpolierter Verbrauch). Liegt das Ablesedatum
   auf der Grenze, sind beide Werte identisch — dann gibt es nichts zu zeigen.
   Gibt eine Liste fertiger Sätze zurück (leer = kein Hinweis). */
function interpolationsHinweise(z, eh) {
  const start = ablesungMaske?.zeitraum?.start || daten.start || '';
  const ende = ablesungMaske?.zeitraum?.ende || daten.ende || '';
  // Der Anfangs-Randwert gehört zum Ende der Vorperiode; bei lückenlosen
  // Perioden ist das der Tag vor dem Start — beide zählen als „auf der Grenze".
  const grenzenAnfang = [ablesungMaske?.vorheriges_ende, start].filter(Boolean);
  const saetze = [];
  if (z.vorwert?.datum && !grenzenAnfang.includes(z.vorwert.datum)) {
    saetze.push(`<b>Anfang</b> abgelesen am ${_isoKurz(z.vorwert.datum)} ·
      auf ${_isoKurz(start)} gerechnet
      <strong>${zahl(z.vorwert.stand)}&nbsp;${eh}</strong>`);
  }
  if (z.ablesung?.datum && z.ablesung.datum !== ende) {
    const gerechnet = (z.vorwert && z.verbrauch != null)
      ? z.vorwert.stand + z.verbrauch : null;
    saetze.push(`<b>Ende</b> abgelesen ${zahl(z.ablesung.stand)}&nbsp;${eh} am
      ${_isoKurz(z.ablesung.datum)}` + (gerechnet == null
        ? ` · Startablesung, noch keine Umrechnung`
        : ` · auf ${_isoKurz(ende)} gerechnet
            <strong>${zahl(Math.round(gerechnet * 1000) / 1000)}&nbsp;${eh}</strong>`));
  }
  return saetze;
}

/* Eine Zähler-Zeile: Anfang + Ende mit Stand UND eigenem Ablesedatum (N88) und
   der Einheiten-Auswähler (N58). Das Datumsfeld speichert für sich allein
   NICHTS — es wird nur mitgeschickt, wenn der Stand gespeichert wird.
   `rest` = berechneter Rest (keine Eingabe), `minus` = im Kaltwasser-Block
   eingerückt als Abzug (N59), `label` überschreibt den Namen, `extra` hängt
   eigene Bedienelemente unter die Zeile (N120: Rolle + Entfernen). */
/* N135 — Umbenennen statt Loeschen-und-neu-Anlegen. Ein neuer Zaehler haette
   keine Vorwerte und keine Historie; bei mehreren Abrechnungsjahren waere das
   ein echter Datenverlust. Gilt fuer alle Zaehler, nicht nur Strom. */
const STIFT_ICON = `<svg viewBox="0 0 16 16" aria-hidden="true" width="13" height="13">
  <path d="M11.2 1.8a1.4 1.4 0 0 1 2 2l-.8.8-2-2 .8-.8Z" fill="currentColor"/>
  <path d="M9.7 3.3l2 2-6.3 6.3-2.6.6.6-2.6 6.3-6.3Z" fill="currentColor"/>
</svg>`;

async function zaehlerUmbenennen(zid) {
  const z = (ablesungMaske?.zaehler || []).find(x => String(x.id) === String(zid));
  const neu = prompt('Neuer Name für den Zähler:', z?.name || '');
  if (neu === null) return;                       // abgebrochen
  const name = neu.trim();
  if (!name || name === z?.name) return;
  try {
    await api(`/zaehler/${zid}`, { method: 'PATCH', body: { name } });
    if (z) z.name = name;                         // lokal nachziehen
    melde('Zähler umbenannt', 'pos');
    await laden();
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

function meterZeileHtml(z, { rest = false, minus = false, label = null,
                            keinChooser = false, extra = '', verbText = '' } = {}) {
  const bearbeitbar = daten.status === 'in Arbeit';
  const eh = esc(z.messeinheit || 'm³');
  // N120 — `direkt`: für diesen Verbrauch gibt es keine Zählerstände, sondern
  // den fertigen Wert der Periode (Gesamtverbrauch der Anlage, Ladestrom eines
  // Autos). Eine Eingabe, keine Interpolation.
  const direkt = !rest && z.typ === 'direkt';
  const fertig = z.verbrauch != null
    && (rest || direkt || (z.vorwert != null && z.ablesung != null));
  const startStand = z.vorwert ? zahl(z.vorwert.stand) : '';
  const endStand = z.ablesung ? zahl(z.ablesung.stand) : '';
  const anfangDatum = z.vorwert?.datum
    || ablesungMaske?.zeitraum?.start || daten.start || '';
  const endeDatum = z.ablesung?.datum
    || ablesungMaske?.zeitraum?.ende || daten.ende || '';
  // N88 — gibt es eine Vorperiode, ist der Anfang deren Endrandwert: abgeleitet,
  // nicht eingegeben. Er wird angezeigt statt zur Eingabe angeboten — ein Tippen
  // hier würde sonst den allerersten Stand des Zählers umschreiben.
  const ausVorperiode = !!(z.vorwert && ablesungMaske?.vorheriges_ende);

  const feld = (kind, wert, standAttr, datumAttr, datum) => bearbeitbar
    ? `<div class="zu-feld"><label>${kind}</label>
        <div class="zu-paar">
          <input type="text" inputmode="decimal" ${standAttr}="${z.id}"
            value="${wert}" placeholder="Stand" aria-label="${kind}sstand ${esc(z.name)}">
          <input type="date" ${datumAttr}="${z.id}" value="${datum}"
            aria-label="Ablesedatum ${kind} ${esc(z.name)}">
        </div></div>`
    : `<div class="zu-feld"><label>${kind}</label>
        <div class="zu-paar"><span class="zu-anf">${wert ? `${wert}&nbsp;${eh}` : '—'}</span>
          <span class="zu-dat">${_isoKurz(datum)}</span></div></div>`;

  const nurAnzeige = (kind, wert, datum, note) => `<div class="zu-feld">
      <label>${kind}</label>
      <div class="zu-paar">
        <span class="zu-anf">${wert ? `${wert}&nbsp;${eh}` : '—'}</span>
        <span class="zu-uebernommen" title="Endstand der Vorperiode, abgelesen am ${
          _isoKurz(datum)}">${note}</span></div></div>`;

  // N120 — der Jahreswert: ein Feld, kein Datum. Der eingetragene Wert IST der
  // Verbrauch der Periode.
  const jahresFeld = bearbeitbar
    ? `<div class="zu-feld"><label>Jahreswert</label>
        <div class="zu-paar">
          <input type="text" inputmode="decimal" data-strom-jahr="${z.id}"
            value="${endStand}" placeholder="${eh}"
            aria-label="Jahresverbrauch ${esc(z.name)} in ${eh}">
          <span class="zu-dat">kein Zählerstand</span>
        </div></div>`
    : `<div class="zu-feld"><label>Jahreswert</label>
        <div class="zu-paar"><span class="zu-anf">${endStand
          ? `${endStand}&nbsp;${eh}` : '—'}</span></div></div>`;

  const startFeld = (rest || direkt) ? ''
    : (ausVorperiode
      ? nurAnzeige('Anfang', startStand, anfangDatum, 'aus Vorperiode')
      : feld('Anfang', startStand, 'data-anfangstand', 'data-anfangdatum', anfangDatum));
  const endFeld = rest ? '' : (direkt ? jahresFeld
    : feld('Ende', endStand, 'data-endstand', 'data-enddatum', endeDatum));

  const hinweise = (rest || direkt) ? [] : interpolationsHinweise(z, eh);
  const rechnung = hinweise.length
    ? `<div class="zu-rechnung">${hinweise.map(s => `<span class="zu-rz">${s}</span>`)
        .join('')}</div>` : '';
  // Der Knopf erscheint erst, wenn ein Datum von Hand geändert wurde (siehe
  // `datumGeaendert`) — ein Datum allein löst nie ein Speichern aus.
  const datumKnopf = bearbeitbar && !rest && !direkt
    ? `<button type="button" class="zu-dok" data-datum-uebernehmen="${z.id}"
        hidden>Geändertes Datum mit dem Stand speichern</button>` : '';

  // `verbText` ersetzt die Zahl, wo sie nicht stimmen kann (N120: ein negativer
  // Rest ist keine Menge, sondern ein Fehler in den Ständen).
  const verb = verbText
    || (z.verbrauch != null ? `${zahl(z.verbrauch)}&nbsp;${eh}` : '—');
  return `<div class="zu-zeile${fertig && !verbText ? ' fertig' : ''}${
      minus ? ' minus' : ''}${rest ? ' rest' : ''}${
      verbText ? ' unplausibel' : ''}" data-zid="${z.id}">
    <div class="zu-haupt">
      ${minus ? '<span class="zu-op" aria-hidden="true">−</span>' : ''}
      <span class="zu-name">${esc(label || zLabels.get(z.id) || z.name)}${
        bearbeitbar ? `<button class="zu-um" data-zaehler-umbenennen="${z.id}"
          title="Zähler umbenennen" aria-label="Zähler „${esc(z.name)}“ umbenennen"
          >${STIFT_ICON}</button>` : ''}</span>
      ${startFeld}${endFeld}
      <span class="zu-verb">${rest ? '<small>berechnet</small> ' : ''}${verb}</span>
    </div>
    ${rechnung}${datumKnopf}
    ${keinChooser ? '' : einheitChooserHtml(z)}${extra}
  </div>`;
}

/* Die Kaltwasser-Struktur über den Hauptzähler: der (kalte) Gesamtzähler, auf den
   andere via hauptzaehler_id zeigen, samt ALLEN seinen gemessenen Unterzählern
   (auch Waschmaschinen am Kaltwasser-Zähler gehören in den Abzug) und dem Rest.
   So bildet die Subtraktion die Rest-Rechnung vollständig ab. */
function kaltwasserStruktur(liste) {
  const istWarm = z => wasserArt(z) === 'Warmwasser'
    || normUml(z.name).includes('warmwasser');
  const hauptIds = new Set(liste.filter(z => z.hauptzaehler_id).map(z => z.hauptzaehler_id));
  const kandidaten = liste.filter(z => hauptIds.has(z.id) && z.typ !== 'rest' && !istWarm(z));
  const haupt = kandidaten.find(z => normUml(z.name).includes('kaltwasser')
      || normUml(z.name).includes('gesamt'))
    || kandidaten[0]
    || liste.find(z => normUml(z.name).includes('gesamt') && !istWarm(z));
  if (!haupt) return null;
  const subs = liste.filter(z => z.id !== haupt.id && z.typ !== 'rest'
    && z.hauptzaehler_id === haupt.id);
  const rest = liste.find(z => z.typ === 'rest' && z.hauptzaehler_id === haupt.id)
    || liste.find(z => z.typ === 'rest' && !istWarm(z));
  if (!subs.length && !rest) return null;
  return { haupt, subs, rest };
}

/* N59 — der Kaltwasser-Block: „Gesamt Kaltwasser" oben, darunter eingerückt alle
   Unterzähler als laufende Subtraktion (− Büro − Roman Bad − …), am Ende der
   Rest Haupthaus, der per Person·Mietdauer auf die Haupthaus-Einheiten geht. */
function kaltwasserBlockHtml(s) {
  // N77a — alle Waschmaschinen zusammen ans Ende der Abzugskette (stabile Sortierung
  // hält Kaltwasserzähler und die WM-Reihenfolge sonst unverändert).
  const sortiert = [...s.subs].sort((a, b) =>
    (wasserArt(a) === 'Waschmaschine' ? 1 : 0) - (wasserArt(b) === 'Waschmaschine' ? 1 : 0));
  const subZeilen = sortiert.map(z => meterZeileHtml(z, { minus: true })).join('');
  const restZeile = s.rest ? meterZeileHtml(s.rest, { rest: true, label: 'Rest Haupthaus' }) : '';
  return `<div class="zu-art zu-kalt"><div class="zu-at">Kaltwasser</div>
    ${meterZeileHtml(s.haupt, { keinChooser: true })}
    <div class="zu-kalt-abzug">${subZeilen || `<div class="zu-kein">Noch keine
      Unterzähler zugeordnet.</div>`}${restZeile}</div>
  </div>`;
}

/* Der Wasser-Block: Kaltwasser (mit vollständigem Abzug über den Hauptzähler)
   zuerst, dann die übrigen Wasser-Zähler nach Art (Warmwasser, Waschmaschinen,
   Gartenwasser, Weitere) als einfache Listen — jeder Zähler nur einmal. */
function wasserBlockHtml(liste) {
  const teile = [];
  const verbraucht = new Set();
  const s = kaltwasserStruktur(liste);
  if (s) {
    for (const z of [s.haupt, ...s.subs, s.rest]) if (z) verbraucht.add(z.id);
    teile.push(kaltwasserBlockHtml(s));
  }
  const rest = liste.filter(z => !verbraucht.has(z.id));
  const nachArt = [['Warmwasser', 'Warmwasser'], ['Waschmaschine', 'Waschmaschinen'],
    ['Gartenwasser', 'Gartenwasser']];
  for (const [art, titel] of nachArt) {
    const grp = rest.filter(z => wasserArt(z) === art);
    // N94 — Gartenwasser hat oft KEINEN Zähler: dann eine manuelle Zeile, in
    // die der Nutzer die m³ direkt einträgt. Technisch entsteht dabei ein Zähler
    // mit Anfangsstand 0 — der eingetragene Wert IST damit der Verbrauch; die
    // Einheit, die ihn trägt, wählt er über den vorhandenen Chooser.
    if (art === 'Gartenwasser' && !grp.length) {
      if (daten.status !== 'in Arbeit') continue;
      teile.push(`<div class="zu-art"><div class="zu-at">Gartenwasser</div>
        <div class="zu-kein">Ohne Zähler — die verbrauchten m³ hier eintragen.
          Sie werden vom Rest Haupthaus abgezogen und nur mit dem
          Frischwasser-Anteil berechnet.</div>
        <div class="ho-neu">
          <input type="number" step="0.1" data-garten-m3 placeholder="m³"
            aria-label="Gartenwasser in m³">
          <button class="btn" data-garten-anlegen>Gartenwasser eintragen</button>
        </div></div>`);
      continue;
    }
    if (grp.length) teile.push(`<div class="zu-art"><div class="zu-at">${esc(titel)}</div>
      ${grp.map(z => meterZeileHtml(z, { rest: z.typ === 'rest' })).join('')}</div>`);
  }
  const uebrig = rest.filter(z =>
    !['Warmwasser', 'Waschmaschine', 'Gartenwasser'].includes(wasserArt(z)));
  if (uebrig.length) teile.push(`<div class="zu-art"><div class="zu-at">Weitere</div>
    ${uebrig.map(z => meterZeileHtml(z, { rest: z.typ === 'rest' })).join('')}</div>`);
  return teile.join('');
}

/* N67 — das Zählerstände-Panel EINER Kategorie (Wasser/Heizung/Strom), als
   eigener Einklapper unter dem jeweiligen Kapitel. Wasser mit voller Abzugs-
   struktur (Gesamt Kaltwasser − Unterzähler = Rest), Heizung/Strom als Liste. */
function zaehlerPanelHtml(block, zaehler, blockVon) {
  const teil = zaehler.filter(z => blockVon.get(z.id) === block);
  // N120 — der Strom-Bereich steht auch dann da, wenn noch kein Zähler erfasst
  // ist: hier entstehen sie (Leerzustand + Anlegen), solange der Zeitraum offen
  // ist. Wasser und Heizung bleiben wie bisher stumm, wenn nichts da ist.
  const stromLeer = block === 'Strom' && daten.status === 'in Arbeit';
  if (!teil.length && !stromLeer) return '';
  // N96 — in Wasser und Heizung sind Zähler ohne eigenen Hauptzähler die BASIS
  // (Gesamt Kaltwasser, Boiler-Zulauf, Liter Öl): ihr Verbrauch wird über die
  // Unterzähler bzw. die §9-/HKV-Rechnung verteilt, nicht direkt einer Einheit
  // zugeschlagen. Sie bekommen deshalb keinen Einheiten-Chooser. Im Strom-Block
  // sind eigenständige Zähler dagegen sehr wohl einer Einheit zuzuordnen.
  const basisOhneChooser = block === 'Heizung';
  const inner = block === 'Wasser' ? wasserBlockHtml(teil)
    : block === 'Strom' ? stromBlockHtml(teil)
    : teil.map(z => meterZeileHtml(z, {
        rest: z.typ === 'rest',
        keinChooser: basisOhneChooser && !z.hauptzaehler_id })).join('');
  const offen = zaehlerOffen.has(block);
  // N88 — das gemeinsame Kategorie-Datum ist entfallen: das Ablesedatum steht
  // wieder an der Zeile, zu der es gehört. Ein zweiter Ort für dieselbe Angabe
  // wäre ohne eigenen Speicherweg ein totes Bedienelement — und genau diese
  // Kopplung hatte zuvor beim Tippen fremde Stände überschrieben.
  const abweichend = teil.filter(z => interpolationsHinweise(z, '').length).length;
  return `<div class="zu-panel${offen ? ' offen' : ''}" data-zu-block="${esc(block)}">
    <button type="button" class="zu-sum" data-zu-toggle aria-expanded="${offen}">
      <span class="zu-ikon">${ZAEHLER_ICON}</span>
      <span class="zu-st">Zählerstände</span>
      <span class="zu-meta">${teil.length
        ? `${teil.length} Zähler${abweichend ? ` · ${abweichend} umgerechnet` : ''}`
        : 'noch keine'}</span>
      <span class="zu-chev">${CHEV_ICON}</span>
    </button>
    <div class="zu-inhalt">${inner}</div>
  </div>`;
}

/* CCCLXII — die Kostenarten des Objekts (Katalog-Zeilen mit kostenart_id) als
   Optionen für den Umhäng-Wähler. Die eigene Art ist immer dabei, auch wenn sie
   (noch) keine Katalog-Art ist; zuletzt „＋ Neue Kostenart …" als Freitext-Weg. */
function artOptionen(aktuell) {
  const namen = new Set();
  for (const k of (daten.checkliste || [])) if (k.kostenart_id) namen.add(k.kostenart);
  namen.add(aktuell);
  const opts = [...namen].sort((a, b) => a.localeCompare(b, 'de'))
    .map(n => `<option value="${esc(n)}"${n === aktuell ? ' selected' : ''}>${esc(n)}</option>`)
    .join('');
  return opts + '<option value="__neu__">＋ Neue Kostenart …</option>';
}

/* Der Verteilungsschlüssel als ein ruhiges Wort an der Zeile. Bei „nur eine
   Einheit" steht dort „1 Einheit" statt eines Schlüssels. */
function schluesselWort(k) {
  if (!k.position_id) return '';
  if (k.nur_einheit) return '1 Einheit';
  if (!k.schluessel) return '';
  return schluesselMeta(k.schluessel)?.titel || k.schluessel;
}

/* Verteilungsschlüssel-Chip an der Zeile: kleines Symbol + „nach X"
   (z. B. „⬚ nach Fläche"). Bei einer Einzelzuordnung steht „1 Einheit"
   ohne „nach". Baut auf schluesselWort auf, damit die Wortlogik nur
   einmal existiert. */
function vkeyChip(k) {
  // N101 — Wasser wird über die ZÄHLER verteilt (gemessener Verbrauch je
  // Einheit, Rest per Person·Mietdauer), nicht nach dem Positions-Schlüssel.
  // „nach Fläche" wäre dort schlicht falsch.
  if (istWasserSammel(k) || istStromPos(k)) {
    return `<span class="vkey">${VKEY_IKON.verbrauch || VKEY_IKON.punkt}<span>nach Zählern</span></span>`;
  }
  const wort = schluesselWort(k);
  if (!wort) return '';
  const key = k.nur_einheit ? 'einheiten' : (k.schluessel || '');
  const ikon = VKEY_IKON[key] || VKEY_IKON.punkt;
  const text = k.nur_einheit ? wort : `nach ${wort}`;
  return `<span class="vkey">${ikon}<span>${esc(text)}</span></span>`;
}

/* Warum eine Einheit zweimal in der Verteilung steht: war sie nur einen Teil
   des Zeitraums vermietet, trägt der Mieter seine Wohndauer und der Eigentümer
   die leere Zeit. Ohne diesen Satz sieht das nach einer doppelten Zeile aus. */
function doppelteEinheit(namen) {
  const einheit = new Map(
    (schluessel?.parteien || []).map(p => [p.partei, p.einheit]));
  const doppelt = namen.filter(n => leerstaende.has(n) && einheit.get(n)
    && namen.some(m => m !== n && einheit.get(m) === einheit.get(n)));
  if (!doppelt.length) return '';
  return `<div class="hinweis">${doppelt.map(esc).join(', ')}: vermietete Zeit
    und Leerstand getrennt.</div>`;
}

/* Welche Schlüssel sich aus den Stammdaten ergeben (verteilung.py: ableitbar).
   Bei ihnen zeigt die Karte nur das €-Ergebnis; die Roh-Gewichte kommen erst
   hinter „Anpassen". Manuelle Schlüssel (Verbrauch/Prozent/Individuell) müssen
   direkt eingegeben werden. */
const ABGELEITET = new Set(['flaeche', 'personen', 'einheiten', 'bewohnermonate']);
/* Der Sonder-Eintrag am Ende der „Verteilen nach"-Auswahl. */
const NUR_EINHEIT_WAHL = '__nur_einheit__';

/* Die Einheit-Chips des Objekts für „Nur eine Einheit/Person" — dieselbe
   Datenquelle wie der frühere Sonderposten-Bereich. */
function einheitChips(pid, aktuell) {
  if (daten.status !== 'in Arbeit') return '';
  return sonderEinheiten().map(e => `
    <button type="button" class="ewahl${e.einheit === aktuell ? ' an' : ''}"
        data-einzel-pid="${pid}" data-einzel-einheit="${esc(e.einheit)}"
        aria-pressed="${e.einheit === aktuell}">
      <span class="ename">${esc(e.einheit)}</span>
      ${e.parteien.length
        ? `<span class="epartei">${esc(e.parteien.join(' · '))}</span>` : ''}
    </button>`).join('');
}

/* CCCLIX — der Vorab-Anteil ist nur dann wirksam (und wird nur dann von der
   Verteilung abgezogen), wenn ein Betrag > 0 UND eine Einheit gesetzt sind —
   genau wie es die Engine handhabt. */
const vorabAktiv = k => (k.vorab_betrag || 0) > 0 && !!(k.vorab_einheit || '');

/* Netto → Brutto: 19 % dazu, kaufmännisch auf den Cent gerundet — genau der
   Wert, der als vorab_betrag gespeichert wird und sich oben vom Gesamtbetrag
   abzieht. Der Nutzer gibt netto ein, brutto rechnet live daneben. */
const vorabBrutto = netto => Math.round((Number(netto) || 0) * 1.19 * 100) / 100;
const bruttoAnzeige = netto => (Number(netto) || 0) > 0
  ? `= ${eur(vorabBrutto(netto))} brutto (19 %)`
  : 'netto eingeben — Brutto rechnet 19 % dazu';

/* Die ruhige Extra-Zeile ganz oben in der Aufteilung: „Vorab → 1. OG · §35a"
   mit dem €-Betrag rechts. Nur wenn ein Teilbetrag wirklich abgezweigt wird. */
function vorabZeileHtml(k) {
  if (!vorabAktiv(k)) return '';
  return `<div class="rz vorab-zeile">
      <span>→ ${esc(k.vorab_einheit)}${k.vorab_s35
        ? '<span class="rzp"> · §35a</span>' : ''}</span>
      <span>− ${eur(k.vorab_betrag)}</span>
    </div>`;
}

/* Der zarte Zugang „Teilbetrag direkt auf eine Einheit" (nur bearbeitbar und
   nicht im Einzel-Modus). Geschlossen ein leiser Link; offen ein kleines
   Betragsfeld, der Einheit-Auswähler und der §35a-Schalter — alles
   auto-speichernd. Offen, sobald ein Vorab-Betrag gesetzt ist. */
function vorabHtml(k) {
  if (daten.status !== 'in Arbeit') return '';
  const offenJetzt = (k.vorab_betrag || 0) > 0 || (k.vorab_netto || 0) > 0
    || vorabOffen.has(k.position_id);
  if (!offenJetzt) {
    return `<button class="vorab-link" data-vorab-oeffnen="${k.position_id}"
      >＋ Teilbetrag direkt auf eine Einheit</button>`;
  }
  const chips = sonderEinheiten().map(e => `
    <button type="button" class="ewahl${e.einheit === k.vorab_einheit ? ' an' : ''}"
        data-vorab-einheit-pid="${k.position_id}" data-vorab-einheit="${esc(e.einheit)}"
        aria-pressed="${e.einheit === k.vorab_einheit}">
      <span class="ename">${esc(e.einheit)}</span>
      ${e.parteien.length
        ? `<span class="epartei">${esc(e.parteien.join(' · '))}</span>` : ''}
    </button>`).join('');
  const netto = k.vorab_netto || 0;
  const brutto = k.vorab_betrag || 0;
  const hat = netto > 0 || brutto > 0;
  return `<div class="vorab">
      <div class="vorab-kopf">
        <span class="vorab-t">Teilbetrag direkt auf eine Einheit</span>
        <button class="vorab-x" data-vorab-entfernen="${k.position_id}"
          data-hat="${hat ? '1' : ''}" aria-label="Teilbetrag entfernen">×</button>
      </div>
      <div class="vorab-betrag">
        <input type="number" step="0.01" min="0" inputmode="decimal"
               placeholder="Netto" value="${netto > 0 ? netto : ''}"
               data-vorab-netto="${k.position_id}"
               aria-label="Teilbetrag netto in Euro">
        <span class="vorab-eur">€ netto</span>
      </div>
      <div class="vorab-brutto" data-vorab-brutto="${k.position_id}"
        >${bruttoAnzeige(netto)}</div>
      <div class="einzel-wahl">${chips}</div>
      <label class="vorab-s35">
        <input type="checkbox" data-vorab-s35="${k.position_id}"
               ${k.vorab_s35 ? 'checked' : ''}>
        <span>§35a absetzbar</span>
      </label>
    </div>`;
}

/* Verteilung einer Position: „Verteilen nach" (Schlüssel oder „Nur eine
   Einheit/Person") und darunter die Aufteilung. */
function verteilungHtml(k) {
  if (!k.position_id) return '';
  const bearbeitbar = daten.status === 'in Arbeit';
  const einzelOffen = k.nur_einheit || einzelWahl === k.position_id;
  const wahlWert = einzelOffen ? NUR_EINHEIT_WAHL : (k.schluessel || '');
  const wahl = bearbeitbar
    ? `<div class="wahl" data-schluesselwahl="${k.position_id}"
         data-wert="${esc(wahlWert)}"></div>` : '';

  // „Nur eine Einheit/Person": kein Schlüssel, 100 % auf eine Einheit.
  if (einzelOffen) {
    const traeger = Object.keys(k.anteile || {});
    return `<div class="vt" data-pid="${k.position_id}">
        <div class="zk">Verteilen nach</div>
        ${wahl}
        <div class="einzel-wahl">${einheitChips(k.position_id, k.nur_einheit)}</div>
        ${k.nur_einheit ? `<div class="zsumme">Zu 100 % auf ${esc(k.nur_einheit)}${
          traeger.length ? ` · ${traeger.map(esc).join(' · ')}` : ''}</div>` : ''}
        ${k.nur_einheit && !traeger.length ? `<div class="warnung"><span>▲</span>
          <span><b>Keine Partei für ${esc(k.nur_einheit)}.</b></span></div>` : ''}
      </div>`;
  }

  const meta = schluesselMeta(k.schluessel);
  const eintraege = Object.entries(k.anteile || {});
  const summe = eintraege.reduce((s, [, w]) => s + Number(w || 0), 0);
  const einheit = k.anteile_einheit || meta?.einheit || '';
  // CDII — die Maßeinheit (z. B. m², Pers.) sichtbar am Eingabefeld, damit eine
  // nackte „40" als Fläche erkennbar ist statt bloß eine Zahl.
  const einheitTag = einheit ? `<span class="mini-einheit">${esc(einheit)}</span>` : '';
  // N28 — „Personen" sind ganze Zahlen: kein 0,0001, keine Nachkommastellen.
  // Ganzzahliges Feld (step 1, Ziffern-Tastatur) + gerundeter Anzeigewert.
  const ganzzahl = k.schluessel === 'personen';
  const schritt = ganzzahl ? '1' : '0.0001';
  const imode = ganzzahl ? 'numeric' : 'decimal';
  const wZahl = w => ganzzahl ? Math.round(Number(w) || 0) : (Number(w) || 0);
  const abzuleiten = meta?.moeglich ? Object.entries(meta.gewichte) : [];
  const gleich = abzuleiten.length === eintraege.length &&
    abzuleiten.every(([p, w]) => Number(k.anteile?.[p] ?? NaN) === Number(w));
  // Nicht ableitbar → Parteien mit 0 anbieten, damit man von Hand füllen kann.
  const felder = eintraege.length || !bearbeitbar ? eintraege
    : (schluessel?.parteien || []).map(p => [p.partei, 0]);
  // Die €-Beträge beziehen sich auf den Rest (Betrag − Vorab-Brutto, CCCLX),
  // damit Vorab-Zeile + Rest den vollen Positionsbetrag ergeben.
  const rest = (k.betrag || 0) - (vorabAktiv(k) ? k.vorab_betrag : 0);

  // N29 — Unterzeile je Aufteilungszeile: die Einheit (der Mieter steht schon als
  // Haupttext), bei unbelegter Zeit „Leerstand · Eigentümer", und wenn die Partei
  // den Zeitraum nur anteilig belegt, „7 von 12 Monaten".
  const anteilSub = p => {
    const d = (k.anteil_details || []).find(x => x.partei === p);
    const teile = [];
    if (d) {
      if (d.leerstand) teile.push('Leerstand · Eigentümer');
      else if (d.einheit) teile.push(esc(d.einheit));
      if (d.zeitraum_monate && d.monate < d.zeitraum_monate - 0.05)
        teile.push(`${monatText(d.monate)} von ${monatText(d.zeitraum_monate)} Monaten`);
    } else if (leerstaende.has(p)) {
      teile.push('Leerstand · Eigentümer');
    }
    return teile.length ? `<span class="gsub">${teile.join(' · ')}</span>` : '';
  };

  const gwRows = felder.map(([p, w]) => `
    <div class="gw">
      <span class="gn">${esc(p)}${anteilSub(p)}</span>
      <span class="mini-wrap">${bearbeitbar
        ? `<input type="number" step="${schritt}" min="0" inputmode="${imode}"
                 value="${wZahl(w)}" data-gewicht="${esc(p)}"
                 aria-label="Gewicht ${esc(p)}${einheit ? ` in ${esc(einheit)}` : ''}">`
        : `<span class="gv">${wZahl(w).toLocaleString('de-DE')}</span>`}${einheitTag}</span>
      <span class="gp" data-anteil>${prozentText(w, summe)}</span>
    </div>`).join('');

  // Ableiten bleibt als leiser Textlink erhalten (kein Umschalten mehr).
  const ableiten = bearbeitbar && abzuleiten.length && !gleich
    ? `<button class="minilink" data-ableiten="${k.position_id}"
        data-fuer="${esc(k.schluessel || '')}">${eintraege.length
          ? 'Aus Stammdaten neu ableiten' : 'Aus Stammdaten ableiten'}</button>` : '';

  const abgeleitet = ABGELEITET.has(k.schluessel);
  let aufteilung;
  if (abgeleitet && eintraege.length) {
    // Abgeleiteter Schlüssel: der €-Betrag je Partei bleibt die Leitzahl (samt
    // Prozent). Zusätzlich ein kleines, dezentes Anteil-Feld rechts, mit dem
    // sich einzelne Anteile überschreiben lassen (z. B. eine Partei auf 0) —
    // über denselben data-gewicht-Mechanismus wie die manuellen Schlüssel.
    const euroRows = felder.map(([p, w]) => {
      const euro = summe > 0 ? rest * (Number(w) || 0) / summe : 0;
      return `<div class="rz vt-abg"><span class="gn">${esc(p)}${anteilSub(p)}</span>
        <span class="vt-euro"><span class="euro-z" data-euro>${eur(euro)}</span>
          <span class="rzp" data-anteil>${prozentText(w, summe)}</span></span>
        ${bearbeitbar
          ? `<span class="mini-wrap"><input class="anteil-mini" type="number" step="${schritt}" min="0"
                    inputmode="${imode}" value="${wZahl(w)}" data-gewicht="${esc(p)}"
                    aria-label="Anteil ${esc(p)}${einheit ? ` in ${esc(einheit)}` : ''}">${einheitTag}</span>`
          : `<span class="mini-wrap"><span class="gv">${wZahl(w).toLocaleString('de-DE')}</span>${einheitTag}</span>`}
      </div>`;
    }).join('');
    aufteilung = `<div class="vt-ergebnis">${euroRows}</div>${
      bearbeitbar ? ableiten : ''}`;
  } else {
    // Manueller Schlüssel (Verbrauch/Prozent/Individuell): die Eingabefelder
    // direkt zeigen — die braucht man hier wirklich.
    aufteilung = `<div class="vt-gewichte">${gwRows}${ableiten}</div>`;
  }

  // Ausgangswerte für die Änderungserkennung beim Auto-Speichern.
  const basis = esc(JSON.stringify(Object.fromEntries(
    felder.map(([p, w]) => [p, Number(w) || 0]))));

  return `<div class="vt" data-pid="${k.position_id}" data-basis="${basis}"
      data-rest="${rest}">
      <div class="zk">Verteilen nach</div>
      ${wahl}
      ${k.ohne_verteilung ? `<div class="warnung"><span>▲</span>
        <span><b>Ohne Gewichte fließen die ${eur(k.betrag)} mit 0,00 € ein.</b>
        </span></div>` : ''}
      <div class="vt-aufteilung">
        <div class="zk">Aufteilung</div>
        ${vorabZeileHtml(k)}
        ${aufteilung}
        ${doppelteEinheit(felder.map(([p]) => p))}
      </div>
      ${vorabHtml(k)}
    </div>`;
}

function zeileHtml(k, i) {
  const [farbe, zeichen] = HAKEN[k.zustand] || HAKEN.fehlt;
  // N101 — die Wasser-Sammelzeile trägt die SUMME ihrer drei Bestandteile
  // (Frisch- + Schmutz- + Niederschlagswasser). Ihr eigener Betrag ist nur der
  // Frischwasser-Anteil; die anderen beiden sind eigene, ausgeblendete
  // Positionen — die Zeile stünde sonst mit einem Drittel der Rechnung da.
  const oelBetrag = istHeizoelSammel(k) && !k.betrag ? heizoelKosten
    : (istWarmwasserPos(k) && !k.betrag ? wwKosten
    : (istHeizwaermePos(k) && !k.betrag
       ? Math.round((heizoelKosten - wwKosten) * 100) / 100 : 0));
  const wert = eur(istWasserSammel(k) ? wasserGesamtBetrag()
    : (oelBetrag || k.betrag));
  const aufgeklappt = offen.has(i);

  // Nur ein kurzer Zustandshinweis, wo wirklich etwas fehlt — kein Sermon.
  const infos = [
    k.zustand === 'offen' ? 'Betrag fehlt' : null,
    k.ohne_verteilung ? 'Verteilung fehlt' : null,
    // N47 — Hinweis: die Wasser-Position fasst die drei Bestandteile zusammen.
    istWasserSammel(k)
      ? 'Fasst Frisch-, Schmutz- & Niederschlagswasser zusammen' : null,
  ].filter(Boolean).join(' · ');

  return zeileInner(k, i, aufgeklappt, infos, wert, farbe, zeichen);
}

// Fußzeile des Zeitraums: was hängt dran — und der ruhige Hinweis, dass ein
// leerer Zeitraum von selbst verschwindet (statt eines Löschknopfs).
function zeitraumFussHtml() {
  const v = daten.verknuepft || {};
  const chips = [
    ['Positionen', v.positionen || 0],
    ['Belege', v.belege || 0],
    ['Vorauszahlungen', v.vorauszahlungen || 0],
  ];
  const leer = chips.every(([, n]) => n === 0);
  return `<div class="zr-fuss">
    <div class="zeilen">${chips.map(([l, n]) =>
      `<span class="chip${n > 0 ? ' hat' : ''}">${n}&nbsp;${l}</span>`).join('')}</div>
    <div class="hinweis">${leer
      ? 'An diesem Zeitraum hängt nichts mehr — beim nächsten Aufräumen verschwindet er automatisch.'
      : 'Nimmst du die letzte Position und den letzten Beleg heraus, wird der dann leere Zeitraum von selbst entfernt. Einen Löschknopf gibt es bewusst nicht.'}</div>
  </div>`;
}

function zeileInner(k, i, aufgeklappt, infos, wert, farbe, zeichen) {
  // Eine vorläufige (orange) Position bleibt orange, bis sie bestätigt ist.
  const zustandKlasse = k.vorlaeufig ? ' entwurf' : (k.erledigt ? ' gefuellt' : '');
  const bearbeitbar = daten.status === 'in Arbeit';

  // N74 — die Wasser-Sammelposition: erst mit Rechnung aufklappbar, dann zeigt
  // das Aufklappen die Detailübersicht INLINE (kein Popup); nie ein Handbetrag.
  const wasserSammel = istWasserSammel(k);
  const wasserBill = wasserSammel && wasserHatRechnung(k);
  const heizoelSammel = istHeizoelSammel(k);
  // N114 — die Heizkosten kommen aus der FIFO-Bewertung, nicht als Positions-
  // betrag. `zeileHtml` rechnet dasselbe fuer die Anzeige; hier wird es fuer
  // Haken und „Datei waehlen" gebraucht.
  const oelBetrag = heizoelSammel && !k.betrag ? heizoelKosten
    : (istWarmwasserPos(k) && !k.betrag ? wwKosten
    : (istHeizwaermePos(k) && !k.betrag
       ? Math.round((heizoelKosten - wwKosten) * 100) / 100 : 0));
  // N91 — die drei Heizungs-Stufen: Öl (Einkauf) · Warmwassererzeugung · Heiz-
  // körper-Wärmemenge. Jede Position zeigt genau ihren Teil.
  const heizModus = heizoelSammel ? 'oel'
    : istWarmwasserPos(k) ? 'warmwasser'
    : istHeizwaermePos(k) ? 'waerme' : '';
  const kannAuf = !wasserSammel || wasserBill;
  const auf = aufgeklappt && kannAuf;

  let koerper = '';
  if (auf && wasserSammel) {
    const anbau = bearbeitbar
      ? `<button class="anh-anbau" data-anhaengen="${esc(k.kostenart)}"
          >${ANH_ICON} Beleg anhängen</button>` : '';
    koerper = `<div class="wd-inline" data-wasser-inline="${zid}">
        <div class="wd-lade">Detailübersicht wird geladen …</div></div>
      <div class="zk">Belege</div>${belegeHtml(k, anbau)}`;
  } else if (auf && heizModus) {
    // N79/N91 — je nach Stufe: Öl-Lieferungen+FIFO, Warmwasser-Split (§9) oder
    // Heizkörper-Wärmemenge (HKV); darunter die Belege der Position.
    const anbau = bearbeitbar
      ? `<button class="anh-anbau" data-anhaengen="${esc(k.kostenart)}"
          >${ANH_ICON} ${heizModus === 'oel' ? 'Öl-Rechnung' : 'Beleg'} anhängen</button>` : '';
    koerper = `<div class="ho-inline" data-heizoel-inline="${zid}"
        data-heiz-modus="${heizModus}">
        <div class="wd-lade">Wird geladen …</div></div>
      <div class="zk">Belege</div>${belegeHtml(k, anbau)}`;
  } else if (auf && k.position_id) {
    // Der Betrag steht jetzt oben im Kopf (kopf-betrag) — kein zweites Feld hier.
    // „Beleg anhängen" sitzt neben den Belegen in derselben Zeile.
    const anbau = bearbeitbar
      ? `<button class="anh-anbau" data-anhaengen="${esc(k.kostenart)}"
          >${ANH_ICON} Beleg anhängen</button>` : '';
    const belege = `<div class="zk">Belege</div>${belegeHtml(k, anbau)}`;
    // Unten Hauptaktion und dezenter Zweitweg nebeneinander.
    const fuss = k.vorlaeufig
      ? `<button class="hauptaktion ja" data-entwurf-ja="${k.position_id}"
          >✓ Bestätigen</button>
         <button class="minilink" data-entwurf-nein="${k.position_id}"
          data-art="${esc(k.kostenart)}">Zurück zum Prüfen</button>`
      : `<button class="hauptaktion" data-fertig="${i}">Fertig</button>
         ${bearbeitbar ? `<button class="minilink gefahr"
          data-entfernen="${k.position_id}"
          data-art="${esc(k.kostenart)}">Entfernen</button>` : ''}`;
    // CCCLXIII — Anbieter/Gewerk der Kostenart (WWK, Zweckverband, Firma …);
    // gilt über alle Zeiträume, erscheint als Tag in der Zeile.
    const anbieterFeld = (bearbeitbar && k.kostenart_id)
      ? `<div class="anbieterzeile"><label>Anbieter / Gewerk</label>
          <input type="text" data-anbieter="${k.kostenart_id}"
            value="${esc(k.anbieter || '')}" data-wert="${esc(k.anbieter || '')}"
            placeholder="z. B. WWK, Zweckverband, Firma …"></div>` : '';
    // CCCLXII — diese Position auf eine andere/spezifischere Kostenart setzen.
    const kostenartFeld = bearbeitbar
      ? `<div class="kostenartzeile"><label>Kostenart</label>
          <select data-kostenart-pos="${k.position_id}" data-wert="${esc(k.kostenart)}"
            aria-label="Kostenart dieser Position">${artOptionen(k.kostenart)}</select>
          <input class="ka-neu" data-kostenart-neu="${k.position_id}" hidden
            placeholder="Neue Kostenart …" aria-label="Neue Kostenart"></div>` : '';
    // CDII — logische Reihenfolge: erst die allgemeinen Infos (Kostenart,
    // Anbieter) oben, dann die Verteilung + Aufteilung (beide in verteilungHtml),
    // dann die Belege, zuletzt der Fuß.
    // N122 — an einer Strom-Position steht dazwischen, wie viele kWh der Betrag
    // deckt und woher der Strom kam (Netzbezug oder eigene Anlage).
    // N142 — an der obersten Strom-Position steht darunter die ganze Kette:
    // kWh → Euro → Abzug E-Tankstelle → Verteilung auf die Einheiten.
    koerper = `${kostenartFeld}${anbieterFeld}${stromPosFeldHtml(k)}
      ${stromKetteHtml(k)}${verteilungHtml(k)}${belege}
      <div class="kartenfuss">${fuss}</div>`;
  } else if (auf) {
    // Katalog-Kostenart ohne Position: hier entsteht sie (nicht bei Wasser —
    // die kann nur per PDF-Upload entstehen, N74). Beim Strom zeigt die Kette
    // schon hier, was noch fehlt, damit die Rechnung nicht blind entsteht.
    koerper = `${stromKetteHtml(k)}<div class="betragfeld">
        <input type="number" step="0.01" placeholder="Betrag (optional)"
               data-neubetrag="${i}" aria-label="Betrag für ${esc(k.kostenart)}"></div>
      <div class="kartenfuss">
        <button class="hauptaktion" data-anlegen="${esc(k.kostenart)}"
                data-index="${i}">Anlegen</button>
      </div>`;
  }

  // Der Betrag im Kopf: aufgeklappt ein schlankes Eingabefeld (speichert beim
  // Verlassen), sonst der lesbare Wert — so steht er nur einmal in der Karte.
  const betragEl = (auf && k.position_id && bearbeitbar && !wasserSammel && !heizoelSammel)
    ? `<span class="kopf-betrag-box"><input class="kopf-betrag" type="number" step="0.01"
         inputmode="decimal" placeholder="Betrag" value="${k.betrag ?? ''}"
         data-betrag="${k.position_id}" data-wert="${k.betrag ?? ''}"
         aria-label="Betrag für ${esc(k.kostenart)}"><span class="kbe">€</span></span>`
    : ((k.erledigt || oelBetrag) ? `<span class="wert">${wert}</span>` : '');
  // Quick-Capture nur an der geschlossenen, offenen Zeile — aufgeklappt macht
  // der Betrag im Kopf Platz, Belege kommen dann über „Beleg anhängen".
  // Ohne Kamera (Schreibtisch) genügt EIN neutraler Knopf — er öffnet über
  // data-scan das lokale #scanFeld (nimmt PDFs an), navigiert also NICHT bloß in
  // den Eingang. Mit Kamera bleiben beide Wege: erfassen (teal) und aus Ablage.
  // N114 — hat die Heizöl-Position ihre Kosten aus der FIFO-Bewertung, ist sie
  // nicht „leer": dann kein „Datei wählen"-Knopf, sondern der Betrag. Weitere
  // Lieferungen lassen sich jederzeit im aufgeklappten Öl-Manager erfassen.
  const quickScan = (!k.erledigt && !aufgeklappt && !oelBetrag)
    ? (KEINE_KAMERA
      ? `<button class="scanmini" data-scan="${esc(k.kostenart)}"
            title="Beleg-PDF von diesem Rechner wählen" aria-label="Beleg-Datei wählen">
            ${UPLOAD_ICON}<span class="st">Datei wählen</span>
          </button>`
      : `<button class="scanmini" data-scan="${esc(k.kostenart)}"
            title="Beleg für ${esc(k.kostenart)} abfotografieren" aria-label="Beleg abfotografieren">
            ${FOTO_ICON}<span class="st">Foto</span>
          </button>
          <button class="scanmini ablage" data-ablage="${esc(k.kostenart)}"
            title="Beleg aus der Ablage / Nextcloud wählen" aria-label="Beleg aus der Ablage wählen">
            ${WOLKE_ICON}<span class="st">Aus Ablage</span>
          </button>`) : '';

  return `<div class="pruef${zustandKlasse}" data-kostenart="${esc(k.kostenart)}">
      <div class="kopf">
        <button class="zeile" data-auf="${i}"${kannAuf ? '' : ' data-noexpand'} aria-expanded="${auf}">
          <span class="ikon ${k.erledigt ? 'fertig' : 'warte'}">${
            kostenIcon(k.kostenart)}</span>
          <!-- N104c - der Verbrauchs-Chip steht HINTER dem Titel: davor
               drängte er sich vor den Namen, obwohl er Beiwerk ist. -->
          <span class="name">${esc(kostenartAnzeige(k.kostenart))}${chipHtml(k)}${vkeyChip(k)}${
            k.vorlaeufig ? '<span class="entw-badge">Entwurf aus Beleg</span>' : ''}${
            (k.anbieter && !aufgeklappt && k.zustand !== 'fehlt')
              ? `<span class="anbieter-tag" title="Anbieter / Gewerk">${esc(k.anbieter)}</span>`
              : ''}${
            infos ? `<span class="unter">${esc(infos)}</span>` : ''}</span>
        </button>
        ${betragEl}
        ${quickScan}
        ${k.zustand !== 'fehlt'
          ? `<span class="haken ${farbe}">${zeichen}</span>` : ''}
      </div>
      ${auf ? `<div class="auf">${koerper}</div>` : ''}
    </div>`;
}

/* An wen die Abrechnung dieser Partei geht. Beim Leerstand an niemanden — er
   ist kein Empfänger, sondern der Anteil des Eigentümers. */
function empfaengerHtml(p) {
  if (!p) return '';
  if (p.leerstand) {
    return '<div class="wemgeht">Bleibt beim Eigentümer — kein Versand.</div>';
  }
  if (p.adressen?.length) {
    return `<div class="wemgeht">Geht an ${p.adressen.map(esc).join(' · ')}</div>`;
  }
  return `<div class="wemgeht fehlt">Keine Mailadresse hinterlegt —
    ausdrucken und mit der Post schicken.</div>`;
}

async function ergebnisHtml() {
  // Der Versandplan sagt, welche Zeile ein Leerstand ist und wer die
  // Abrechnung bekommt; ohne ihn bleibt das Ergebnis trotzdem lesbar.
  const [rechnung, versand] = await Promise.allSettled([
    api(`/zeitraeume/${zid}/abrechnung`),
    api(`/zeitraeume/${zid}/versand`),
  ]);
  if (rechnung.status !== 'fulfilled') {
    return '<div class="empty"><div class="big">Ergebnis nicht verfügbar</div></div>';
  }
  const a = rechnung.value;
  const wer = new Map((versand.value?.parteien || []).map(p => [p.partei, p]));

  // Die Abrechnung je Partei als PDF — dieselbe Datei, die beim Versand
  // angehängt wird. Vor dem Verschicken einmal ansehen zu können, ist der
  // Sinn der Vorschau.
  const zeilen = Object.entries(a.parteien || {}).map(([partei, w]) => `
    <div class="karte">
      <h3>${esc(partei)}${wer.get(partei)?.leerstand || leerstaende.has(partei)
        ? '<span class="marke">Leerstand</span>' : ''}</h3>
      ${empfaengerHtml(wer.get(partei))}
      <div class="summe"><span>Umlagefähige Kosten</span><b>${eur(w.kosten)}</b></div>
      <div class="summe"><span>Vorauszahlungen</span><b>${eur(w.vorauszahlungen)}</b></div>
      ${w.s35 ? `<div class="summe"><span>davon § 35a</span><b>${eur(w.s35)}</b></div>`
        : ''}
      <div class="summe gesamt"><span>Saldo</span>
        <b class="${(w.saldo ?? 0) >= 0 ? 'pos' : 'neg'}">${eur(w.saldo)}</b></div>
      <a class="pdflink" target="_blank" rel="noopener"
         href="/api/zeitraeume/${zid}/abrechnung.pdf?partei=${
           encodeURIComponent(partei)}">▤ Abrechnung als PDF ansehen</a>
    </div>`).join('');

  const g = a.gesamt || {};
  return `<div class="karte">
      <h3>Gesamt</h3>
      <div class="summe"><span>Auslagen</span><b>${eur(g.auslagen)}</b></div>
      <div class="summe"><span>Abschläge</span><b>${eur(g.abschlaege)}</b></div>
      <div class="summe gesamt"><span>Saldo</span>
        <b class="${(g.saldo ?? 0) >= 0 ? 'pos' : 'neg'}">${eur(g.saldo)}</b></div>
    </div>${zeilen}
    ${a.offen?.length ? `<div class="karte"><h3>Noch offen</h3>
      ${a.ohne_betrag?.length ? `<div class="summe">
        <span>Ohne Betrag</span><b>${a.ohne_betrag.map(esc).join(', ')}</b></div>` : ''}
      ${a.ohne_verteilung?.length ? `<div class="summe">
        <span>Ohne Verteilung</span>
        <b class="neg">${a.ohne_verteilung.map(esc).join(', ')}</b></div>` : ''}
      </div>` : ''}`;
}

/* Abschluss: erst wenn nichts mehr offen ist — oder du die Reste bewusst
   übergehst — wird der Versand freigegeben. */
function abschlussHtml() {
  if (daten.status !== 'in Arbeit') {
    // Zurückhaltend, aber vorhanden: ein versehentlicher Abschluss war bisher
    // unumkehrbar — samt der Fristen und Erinnerungen, die daran hängen.
    return `<div class="abschluss fertig">
        <div class="at">Abgeschlossen</div>
        <p>Dieser Zeitraum ist abgerechnet und versendet.</p>
        <button class="wiederauf" data-oeffnen="1">Wieder öffnen</button>
      </div>`;
  }
  const f = daten.fortschritt;
  const rest = f.gesamt - f.fertig;
  // Eine erledigte Position ohne Gewichte sieht fertig aus, fließt aber mit
  // 0,00 € ein. Sie gehört deshalb zu dem, was den Abschluss aufhält.
  const ohne = daten.checkliste.filter(k => k.ohne_verteilung)
    .map(k => k.kostenart);

  if (rest === 0 && !ohne.length) {
    return `<div class="abschluss bereit">
        <div class="at">✓ Alles erfasst</div>
        <p>${f.gesamt} Positionen vollständig · ${eur(f.summe)} umlagefähig.
           Die Abrechnungen können erstellt und verschickt werden.</p>
        <button class="losbutton" data-abschluss="1">Abrechnungen erstellen und versenden</button>
      </div>`;
  }
  const teile = [
    rest ? `${rest} ${rest === 1 ? 'Position' : 'Positionen'} ohne Betrag` : null,
    ohne.length ? `${ohne.length} ohne Verteilung` : null,
  ].filter(Boolean).join(' · ');

  return `<div class="abschluss offen">
      <div class="at">Noch nicht vollständig</div>
      <p>${teile}. Trage die fehlenden Angaben ein — oder bestätige, dass die
         restlichen Posten für diesen Zeitraum nicht anfallen.</p>
      ${ohne.length ? `<div class="warnung"><span>▲</span>
        <span><b>${esc(ohne.join(', '))}</b> ${ohne.length === 1 ? 'hat' : 'haben'}
        einen Betrag, aber keine Verteilungsgewichte — ${ohne.length === 1
          ? 'er zählt' : 'sie zählen'} in der Abrechnung mit 0,00 €.</span>
        </div>` : ''}
      <label class="uebergehen">
        <input type="checkbox" id="uebergehen">
        <span>Restliche Positionen fallen nicht an</span>
      </label>
      <button class="losbutton" data-abschluss="1" disabled
              id="abschlussKnopf">Abrechnungen erstellen und versenden</button>
    </div>`;
}

/* Die Einheiten des Objekts samt der Partei, die einen Sonderposten dort
   tragen würde. Grundlage ist die Schlüssel-Vorschau: dort steht je Bezug
   Partei und Einheit — und ausgeschlossene Einheiten (CXCIII) fehlen bereits,
   für sie käme ohnehin keine Verteilung zustande. */
function sonderEinheiten() {
  const map = new Map();
  for (const p of (schluessel?.parteien || [])) {
    if (!p.einheit) continue;
    if (!map.has(p.einheit)) map.set(p.einheit, new Set());
    map.get(p.einheit).add(p.partei);
  }
  return [...map.entries()].map(([einheit, parteien]) =>
    ({ einheit, parteien: [...parteien] }));
}

/* ---- CCVIII: Mieter-Direkteintrag für ein WEG-Objekt --------------------
   Ist die Wohnung Teil einer Wohnungseigentümergemeinschaft, verteilt die
   Hausverwaltung die Nebenkosten. ImmoCalc verteilt dann nicht selbst: der
   Nutzer trägt je Mieter die umlagefähige NK-Summe vom Zettel direkt ein. Das
   läuft über die vorhandene 100-%-je-Einheit-Mechanik (`nur_einheit`) — die
   Summe geht ganz auf die Partei der Einheit, ohne Verteilungsschlüssel, und
   die bestehende Abrechnungs-/Versandmaschinerie rechnet sie gegen die
   Vorauszahlung. */
const WEG_ART = einheit => `Nebenkosten (WEG) · ${einheit}`;

function wegDirektHtml() {
  if (!daten.weg) return '';
  const einheiten = sonderEinheiten();
  const bereit = daten.status === 'in Arbeit';
  const bestehende = new Map((daten.checkliste || []).map(k => [k.kostenart, k]));

  const zeilen = einheiten.map(e => {
    const vorhanden = bestehende.get(WEG_ART(e.einheit));
    const betrag = vorhanden && vorhanden.betrag != null ? vorhanden.betrag : '';
    return `<div class="gw">
        <span class="gn">${esc(e.einheit)}${e.parteien.length
          ? `<span class="gsub">${esc(e.parteien.join(' · '))}</span>` : ''}</span>
        ${bereit
          ? `<input type="number" step="0.01" min="0" value="${betrag}"
                   data-weg-betrag="${esc(e.einheit)}" placeholder="NK-Summe"
                   aria-label="Umlagefähige NK-Summe ${esc(e.einheit)}">`
          : `<span class="gv">${betrag !== '' ? eur(betrag) : '—'}</span>`}
      </div>`;
  }).join('');

  const koerper = einheiten.length
    ? zeilen + (bereit ? `<div class="nachtrag" style="margin-top:12px">
        <button data-weg-speichern="1">Werte je Mieter übernehmen</button>
      </div>` : '')
    : `<div class="belege"><span class="kein">Noch keine vermietete Einheit —
        lege auf der Objektseite Einheiten und Mieter an, dann steht hier je
        Mieter ein Feld für die NK-Summe.</span></div>`;

  return `<div class="karte sonder">
      <h3>Nebenkosten laut Hausverwaltung <span class="marke post">WEG</span></h3>
      <span class="erklaer">Diese Wohnung gehört zu einer WEG — die
        Hausverwaltung verteilt die Nebenkosten. Trage je Mieter die
        umlagefähige NK-Summe vom Abrechnungszettel direkt ein. ImmoCalc
        verteilt nichts, sondern rechnet sie gegen die Vorauszahlung und erstellt
        Saldo, PDF und Versand wie gewohnt.</span>
      ${koerper}</div>`;
}

async function zeichnen() {
  const f = daten.fortschritt;
  const anteil = f.gesamt ? Math.round((f.fertig / f.gesamt) * 100) : 0;

  const kopf = `
    <div class="fortschritt">
      <div class="kopf">
        <span class="gross">${f.fertig} von ${f.gesamt}</span>
        <span class="klein">Positionen vollständig</span>
      </div>
      <div class="bahn"><i style="width:${anteil}%"></i></div>
    </div>
    <div class="tabs" role="tablist">
      <button data-tab="pruef" aria-selected="${ansicht === 'pruef'}">Checkliste</button>
      <button data-tab="ergebnis" aria-selected="${ansicht === 'ergebnis'}">Ergebnis</button>
      <button data-tab="belege" aria-selected="${ansicht === 'belege'}">Belege</button>
    </div>`;

  let rumpf = '';
  if (ansicht === 'pruef') {
    const fluss = daten.sankey || { knoten: [], fluss: [] };
    const flussKarte = fluss.fluss.length
      ? `<div class="karte"><h3>Kostenfluss · erfasste Positionen</h3>
          ${sankey(fluss.knoten, fluss.fluss,
                   { format: eurKurz, breite: window.innerWidth < 520 ? 260 : 540 })}
          ${deckungHtml()}
         </div>`
      : '';

    const sortWahl = `<div class="sortleiste">
        <span>Sortieren</span>
        ${Object.entries({ status: 'Offene zuerst', betrag: 'Größe', name: 'Name' })
          .map(([k, l]) => `<button data-sort="${k}"
            aria-pressed="${sortierung === k}">${l}</button>`).join('')}
        <button class="pos-konfig" data-pos-konfig
          title="Positionen ein- oder ausblenden"
          aria-label="Positionen ein- oder ausblenden">${GEAR_ICON} Positionen</button>
      </div>`;

    // Jede Kostenart bleibt als Zeile — auch eine, die „Zähler" heißt (etwa die
    // umlagefähige Zählermiete): sie trägt einen Betrag und muss erfassbar
    // bleiben. Der abgelesene Verbrauch erscheint als Chip an der Position, nicht
    // als eigene Zeile. Sortiert, dann in Bereiche gruppiert; der echte Index i
    // aus dem Original-Array bleibt an der Zeile, damit data-auf/offen/index passen.
    // N57 — Abwasser/Niederschlag/Kaltwasserzähler leben nur noch im Wasser-
    // Detail-Popup; ihre Daten bleiben erhalten, nur die Zeilen entfallen hier.
    const sortiert = daten.checkliste
      .map((k, i) => ({ k, i }))
      .filter(({ k }) => !istImDetailPopup(k))
      .sort((a, b) => SORTIERUNG[sortierung](a.k, b.k));
    const bereiche = BEREICHE.map(() => []);
    for (const eintrag of sortiert) {
      bereiche[bereichIndex(eintrag.k.kostenart)].push(eintrag);
    }
    // N91 — im Heizungs-Kapitel zählt die fachliche Reihenfolge, nicht die
    // gewählte Sortierung: erst das Öl (Einkauf), dann die beiden Verbraucher,
    // die es aufteilen, zuletzt die Wartung.
    const heizRang = k => istHeizoelSammel(k) ? 0
      : istWarmwasserPos(k) ? 1 : istHeizwaermePos(k) ? 2
      : normUml(k.kostenart).includes('wartung') ? 4 : 3;
    bereiche[1].sort((a, b) => heizRang(a.k) - heizRang(b.k));
    // N67 — Zählerstände je Kapitel: Wasser-Zähler unter Wasser (bi 0), Heizung
    // unter Heizung (bi 1), Strom unter Strom (bi 2) — jeweils eigenes Panel.
    const zListe = ablesungMaske?.zaehler || [];
    if (zListe.length) zLabels = generischeLabels(zListe);   // N68 — einmal für alle
    const zBlock = zListe.length ? zaehlerBloecke(zListe) : new Map();
    const zeilen = bereiche.map((liste, bi) => {
      // N120 — der Strom-Bereich erscheint auch ohne Zähler (Leerzustand +
      // Anlegen); die Panels entscheiden das selbst.
      const wz = bi < 3 ? zaehlerPanelHtml(BEREICH_IKON[bi], zListe, zBlock) : '';
      if (!liste.length && !wz) return '';
      return `<div class="kat-kopf"><span class="kat-ikon">${
          kostenIcon(BEREICH_IKON[bi])}</span><span class="kat-t">${
          esc(BEREICHE[bi].titel)}</span></div>`
        + liste.map(({ k, i }) => zeileHtml(k, i)).join('') + wz;
    }).join('');

    // N66 — der globale „Ablesewerte eingeben"-Knopf + das Zahnrad sind raus:
    // die Zählerstände werden jetzt inline je Kategorie (Wasser/Heizung/Strom)
    // im aufklappbaren Panel erfasst.
    rumpf = wegDirektHtml() + flussKarte + sortWahl +
      zeilen + ablesenKnopfHtml() + abschlussHtml() + zeitraumFussHtml();
  } else if (ansicht === 'ergebnis') {
    rumpf = '<div class="karte"><h3>Wird gerechnet …</h3></div>';
  } else {
    // Nach Dokumentart gruppiert — so, wie die API sie liefert.
    const gruppen = Object.entries(daten.belege_je_art || {})
      .filter(([, liste]) => liste.length)
      .sort(([a], [b]) => a.localeCompare(b, 'de'));
    rumpf = daten.dokumente.length
      ? gruppen.map(([art, liste]) => `<div class="karte">
          <h3>${esc(art || 'Ohne Art')} · ${liste.length}</h3>
          ${belegLinks(liste)}</div>`).join('')
      : `<div class="empty"><div class="big">Noch keine Belege</div>
          <p>Fotografiere in der Checkliste einen Beleg zu einer Position ab —
             er wird in der Cloud abgelegt und erscheint dann hier.</p></div>`;
  }

  inhalt.innerHTML = kopf + rumpf;

  if (ansicht === 'ergebnis') {
    inhalt.innerHTML = kopf + await ergebnisHtml();
  } else if (ansicht === 'pruef') {
    montiereSchluessel();
    // N74 — eine aufgeklappte Wasser-Position lädt ihre Detailübersicht inline.
    // N108 (Fund 11) — es koennen mehrere Positionen gleichzeitig offen sein
    // (die drei Heizstufen!). querySelector fuellte nur die erste, die uebrigen
    // blieben dauerhaft auf „Wird geladen …".
    inhalt.querySelectorAll('[data-wasser-inline]').forEach(fuelleWasserInline);
    // N79 — die aufgeklappte Heizöl-Position lädt ihren Öl-Manager inline.
    inhalt.querySelectorAll('[data-heizoel-inline]').forEach(fuelleHeizoelInline);
    // N142 — die aufgeklappte Strom-Position lädt ihre Verrechnungskette.
    inhalt.querySelectorAll('[data-strom-kette]').forEach(fuelleStromketteInline);
  }
}

/* N82b — die Summe der NK-Vorauszahlungen des Zeitraums (aus der Abrechnung).
   Wird beim Laden geholt; null heißt „noch nicht bekannt". */
let deckungAbschlaege = null;
let heizoelKosten = 0;   // N114 - FIFO-Kosten des Oelverbrauchs
let wwKosten = 0;        // N118 - §9-Anteil des Oels fuer die Warmwassererzeugung
let wasserDetailCache = null;  // N118 - dieselbe Aufteilung wie in der Wassertabelle
let deckungUmgelegt = null;   // was tatsächlich verteilt ist (Abrechnung)

/* Kurzes deutsches Datum aus ISO (für die Öl-Lieferungsliste). */
const _isoKurz = iso => iso ? new Date(iso).toLocaleDateString('de-DE') : '';

/* N82b — Deckung am Kostenfluss: wie viel der erfassten Kosten durch die
   NK-Abschläge (Vorauszahlungen) gedeckt ist. Positiver Saldo = Guthaben für den
   Mieter, negativer = Nachzahlung (Deckungslücke). Ohne erfasste Abschläge ein
   ruhiger Hinweis statt einer Scheingenauigkeit. */
function deckungHtml() {
  const kosten = (daten.checkliste || []).reduce((s, k) => s + (k.betrag || 0), 0);
  // N82b — die Abschläge kommen aus der Abrechnung (die NK-Vorauszahlungen der
  // Mietverhältnisse im Zeitraum), nicht nur aus einzeln erfassten Zahlungen.
  const abschlaege = deckungAbschlaege != null ? deckungAbschlaege
    : (daten.vorauszahlungen || []).reduce((s, v) => s + (v.betrag || 0), 0);
  if (kosten <= 0) return '';
  if (abschlaege <= 0) {
    return `<div class="deckung"><div class="dstat"><span class="dl">Kosten erfasst</span>
        <span class="dv">${eur(kosten)}</span></div>
      <div class="dhinweis">Noch keine Abschläge erfasst — Deckung nicht bezifferbar.</div></div>`;
  }
  // Umgelegt wird nur, was auch verteilt ist — das ist die Zahl, gegen die die
  // Abschläge stehen. Die Sankey-Summe darüber zeigt ALLE erfassten Positionen
  // (auch nicht umlagefähige), deshalb beide getrennt beschriften.
  const umgelegt = deckungUmgelegt != null ? deckungUmgelegt : kosten;
  const saldo = abschlaege - umgelegt;               // + Guthaben · − Nachzahlung
  const quote = Math.round(umgelegt / abschlaege * 100);
  const nach = saldo < 0;
  const rest = Math.round((kosten - umgelegt) * 100) / 100;
  return `<div class="deckung ${nach ? 'neg' : 'pos'}">
    <div class="dstat"><span class="dl">Abschläge der Mieter</span>
      <span class="dv pos">${eur(abschlaege)}</span></div>
    <div class="dstat"><span class="dl">Umgelegt · Deckung</span>
      <span class="dv neg">${eur(umgelegt)} · ${quote}%</span></div>
    <div class="dstat"><span class="dl">${nach ? 'Nicht gedeckt · Nachzahlung' : 'Überdeckt · Guthaben'}</span>
      <span class="dv ${nach ? 'neg' : 'pos'}">${eur(Math.abs(saldo))}</span></div>
    ${rest > 0.01 ? `<div class="dhinweis">Von ${eur(kosten)} erfassten Kosten sind
      ${eur(rest)} noch nicht verteilt (fehlender Schlüssel oder nicht umlagefähig).</div>` : ''}
  </div>`;
}

/* N79 — eine Öl-Lieferung erfassen (Liter + Wert + Datum, optional Anfangs-
   bestand). Danach neu zeichnen → der Öl-Manager lädt frisch (FIFO aktualisiert). */
async function heizoelHinzufuegen(btn) {
  const box = btn.closest('.ho-neu');
  const datum = box?.querySelector('[data-ho-datum]')?.value;
  const liter = parseFloat(String(box?.querySelector('[data-ho-liter]')?.value || '').replace(',', '.'));
  const wert = parseFloat(String(box?.querySelector('[data-ho-wert]')?.value || '').replace(',', '.'));
  const anf = !!box?.querySelector('[data-ho-anf]')?.checked;
  if (!datum || !(liter > 0)) { melde('Datum und Liter angeben', 'neg'); return; }
  try {
    await api(`/objekte/${encodeURIComponent(daten.objekt)}/heizoel`, {
      method: 'POST',
      body: { datum, liter, wert: Number.isFinite(wert) ? wert : 0, ist_anfangsbestand: anf },
    });
    melde('Öl-Lieferung erfasst', 'pos');
    await zeichnen();
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

/* N79 — eine Öl-Lieferung wieder entfernen (Fehleingabe korrigieren). */
async function heizoelEntfernen(id) {
  try {
    await api(`/heizoel/${id}`, { method: 'DELETE' });
    melde('Lieferung entfernt', 'pos');
    await zeichnen();
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

/* N95 — einen Beleg aus seiner Kostenposition herausnehmen. Die Position bleibt
   und rechnet sich neu (ohne diesen Beleg); die Datei bleibt in der Ablage und
   lässt sich jederzeit wieder zuordnen. */
async function belegLoesen(id) {
  const dok = (daten.dokumente || []).find(d => String(d.id) === String(id));
  const wahl = await belegWegDialog(dok);
  if (!wahl) return;
  try {
    // Verbuchung lösen — ein nicht verbuchter Beleg ist kein Fehler (N96b).
    await api(`/dokumente/${id}/position`, { method: 'DELETE' }).catch(() => {});
    // Aus dem Zeitraum nehmen: erst dadurch verschwindet er aus der Abrechnung.
    await api(`/dokumente/${id}`, { method: 'PATCH', body: { zeitraum_id: null } });
    if (wahl === 'ablage') {
      // N97 — das Gegenstück suchen: byte-gleich (gleiche Größe) ODER inhaltlich
      // dasselbe Dokument (gleicher Betrag + Kostenart). Zwei Scans derselben
      // Unterlage sind nie byte-gleich — dafür bestätigt der Nutzer.
      const gleich = d => String(d.id) !== String(id)
        && (d.betrag ?? null) === (dok?.betrag ?? null)
        && (d.kostenart || '') === (dok?.kostenart || '');
      const zwilling = (daten.dokumente || []).find(d => gleich(d) && d.groesse === dok?.groesse)
        || (daten.dokumente || []).find(gleich);
      if (!zwilling) {
        melde('Herausgenommen. Kein zweiter Beleg mit gleichem Betrag und '
          + 'gleicher Kostenart gefunden — die Datei bleibt in der Ablage.', 'neg');
      } else {
        const a = await api(`/dokumente/${id}/duplikat-entfernen`,
          { method: 'POST', body: { behalten_id: zwilling.id, bestaetigt: true } });
        melde(a?.verschoben
          ? 'Doppel bestätigt — Datei nach „99_Duplikate" verschoben'
          : 'Doppelter Beleg entfernt — auch aus der Ablage', 'pos');
      }
    } else {
      melde('Beleg herausgenommen — die Datei bleibt in der Ablage', 'pos');
    }
    await laden();
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

/* N96b — was mit dem Beleg geschehen soll: nur aus der Abrechnung nehmen (die
   Datei bleibt) oder — bei einem verifizierten Doppel — auch aus der Ablage
   löschen. Die Löschung ist rot und braucht den zweiten, bewussten Klick. */
function belegWegDialog(dok) {
  return new Promise(fertig => {
    const dlg = document.createElement('dialog');
    dlg.className = 'immo-dlg';
    document.body.appendChild(dlg);
    let wahl = null;
    dlg.addEventListener('close', () => { dlg.remove(); fertig(wahl); }, { once: true });
    dlg.innerHTML = `
      <button class="immo-dlg-zu" data-nein aria-label="Schließen">×</button>
      <div class="dt">Beleg herausnehmen</div>
      <p style="font:400 13px var(--body);color:var(--soft);line-height:1.5">
        <b style="color:var(--ink)">${esc(dok?.dateiname || 'Beleg')}</b><br>
        Er wird aus dieser Abrechnung genommen; sein Betrag zählt nicht mehr mit.</p>
      <div class="kartenfuss" style="display:flex;flex-direction:column;gap:9px">
        <button class="hauptaktion" data-wahl="raus">Nur herausnehmen — Datei bleibt</button>
        <button class="minilink gefahr" data-wahl="ablage">Doppelt: auch aus der Ablage löschen</button>
      </div>`;
    dlg.querySelectorAll('[data-wahl]').forEach(b => (b.onclick = () => {
      wahl = b.dataset.wahl; dlg.close();
    }));
    dlg.querySelector('[data-nein]').onclick = () => dlg.close();
    dlg.showModal();
  });
}

/* ---- N120: Strom — Zähler im Zählerstände-Bereich ------------------------
   Der Strom wird nicht mehr nach einem festen Schlüssel geteilt, sondern
   abgelesen: der Gesamtverbrauch der Periode (Absolutwert der Anlage), darunter
   die Zwischenzähler als Abzug und zuletzt der errechnete Verbrauch Haus.
   Gerechnet wird im Backend (`ablesung.verbrauch_je_zaehler`) — hier steht nur
   die Erfassung, in derselben Zeilenform wie die Wasser- und Öl-Zähler. */

/* Die Strom-Zähler (alles in kWh) in fachlicher Ordnung. `gesamt` ist der
   Zähler, auf den die anderen zeigen (sonst der erste ohne eigenen Haupt-
   zähler), `unter` alle übrigen messenden, `rest` die errechnete Zeile. */
function stromStruktur(zaehler = null) {
  const liste = (zaehler || ablesungMaske?.zaehler || [])
    .filter(z => (z.messeinheit || '') === 'kWh');
  const hauptIds = new Set(liste.filter(z => z.hauptzaehler_id)
    .map(z => z.hauptzaehler_id));
  const gesamt = liste.find(z => z.typ !== 'rest' && hauptIds.has(z.id))
    || liste.find(z => z.typ !== 'rest' && !z.hauptzaehler_id) || null;
  const unter = liste.filter(z => z.typ !== 'rest' && z.id !== gesamt?.id);
  const rest = liste.find(z => z.typ === 'rest') || null;
  return { liste, gesamt, unter, rest };
}

const stromLabel = z => zLabels.get(z.id) || z.name;

/* Die vier Rollen einer Strom-Zeile — sie bestimmen Zählertyp, Bezug zum
   Gesamtzähler und die feste Reihenfolge (groß nach klein, wie in der Excel:
   Gesamt · Zwischenzähler · Jahreswerte · Haus). */
const STROM_ROLLEN = {
  gesamt: { titel: 'Gesamtverbrauch (absolut)', typ: 'direkt',
            haupt: false, reihenfolge: 1 },
  // Ein echter Hauptzähler mit zwei Ständen — für Anlagen, die keinen fertigen
  // Jahreswert ausweisen. Sonst dieselbe Rolle wie „Gesamtverbrauch".
  gesamt_stand: { titel: 'Gesamtverbrauch (2 Stände)', typ: 'gemessen',
                  haupt: false, reihenfolge: 1 },
  gemessen: { titel: 'Zwischenzähler (2 Stände)', typ: 'gemessen',
              haupt: true, reihenfolge: 5 },
  direkt: { titel: 'Jahreswert ohne Zähler', typ: 'direkt',
            haupt: true, reihenfolge: 6 },
  rest: { titel: 'Verbrauch Haus (Rest)', typ: 'rest',
          haupt: true, reihenfolge: 9 },
};

const stromRolle = (z, s) => z.typ === 'rest' ? 'rest'
  : (s.gesamt?.id === z.id ? (z.typ === 'direkt' ? 'gesamt' : 'gesamt_stand')
    : (z.typ === 'direkt' ? 'direkt' : 'gemessen'));

/* Was unter einer Strom-Zeile zusätzlich steht: ihre Rolle (umstellbar) und der
   Weg, den Zähler wieder zu entfernen. Nur im laufenden Zeitraum. */
function stromExtra(z, s) {
  if (daten.status !== 'in Arbeit') return '';
  const jetzt = stromRolle(z, s);
  const optionen = Object.entries(STROM_ROLLEN).map(([wert, r]) =>
    `<option value="${wert}"${wert === jetzt ? ' selected' : ''}>${r.titel}</option>`)
    .join('');
  return `<div class="zu-rolle"><span class="zu-ehl">Rolle</span>
      <select data-strom-rolle-set="${z.id}"
        aria-label="Rolle von ${esc(z.name)}">${optionen}</select>
      <button type="button" class="zu-weg" data-strom-weg="${z.id}"
        data-strom-titel="${esc(stromLabel(z))}">Entfernen</button></div>`;
}

/* Unter welcher Kostenart ein neuer Strom-Zähler hängt: die Strom-Position
   dieses Zeitraums, sonst schlicht „Strom". So zählt sein Verbrauch auf
   dieselbe Zeile wie die Kosten. */
const stromKostenart = () =>
  (daten.checkliste || []).find(istStromPos)?.kostenart || 'Strom';

/* Ein neuer Zähler: Name und Rolle. Der Gesamtverbrauch zuerst — die übrigen
   hängen sich an ihn. Bereits vergebene Einzelrollen fallen aus der Auswahl. */
function stromNeuForm(s) {
  const rollen = Object.entries(STROM_ROLLEN)
    .filter(([w]) => !(w.startsWith('gesamt') && s.gesamt)
      && !(w === 'rest' && s.rest));
  return `<div class="ho-neu st-neu">
      <input type="text" data-strom-name placeholder="Name des Zählers"
        aria-label="Name des neuen Zählers">
      <select data-strom-rolle aria-label="Rolle des neuen Zählers">${rollen
        .map(([w, r]) => `<option value="${w}">${r.titel}</option>`).join('')}</select>
      <button class="btn" data-strom-add>Zähler anlegen</button>
    </div>`;
}

/* Der Strom-Block im Zählerstände-Bereich: oben der Gesamtverbrauch, darunter
   eingerückt die Zwischenzähler als Abzug und der errechnete Verbrauch Haus —
   derselbe Aufbau wie beim Kaltwasser. */
function stromBlockHtml(liste) {
  const bearbeitbar = daten.status === 'in Arbeit';
  const s = stromStruktur(liste);
  const form = bearbeitbar ? stromNeuForm(s) : '';
  if (!s.liste.length) {
    return `<div class="zu-kein">Noch kein Stromzähler erfasst. Erwartet werden
      der <b>Gesamtverbrauch</b> der Periode als Absolutwert, darunter die
      <b>Zwischenzähler</b> mit ihren Ständen, Verbräuche <b>ohne Zähler</b> als
      Jahreswert (etwa das Elektroauto) und zuletzt der <b>Verbrauch Haus</b>,
      der sich daraus errechnet.</div>${form}`;
  }

  const zeile = (z, o) => meterZeileHtml(z, { ...o, extra: stromExtra(z, s) });
  const subZeilen = s.unter.map(z => zeile(z, { minus: true })).join('');
  const summeUnter = s.unter.reduce((sum, z) => sum + (z.verbrauch || 0), 0);
  const gesamtV = s.gesamt?.verbrauch ?? null;
  // Ein negativer Rest ist keine Menge — dort steht die Warnung statt der Zahl.
  const restNegativ = !!(s.rest && s.rest.verbrauch != null && s.rest.verbrauch < 0);
  const restZeile = s.rest
    ? zeile(s.rest, { rest: true, verbText: restNegativ ? 'nicht plausibel' : '' })
    : '';

  // Eine Zeile, die die Rechnung ausschreibt — dieselbe Sprache wie beim Öl.
  const rechnung = s.gesamt ? `<div class="ho-summe">Gesamt <b>${gesamtV != null
      ? `${zahl(gesamtV)} kWh` : '—'}</b> − Zwischenzähler <b>${
      zahl(summeUnter)} kWh</b> = Haus <b>${gesamtV != null
      ? `${zahl(Math.round((gesamtV - summeUnter) * 1000) / 1000)} kWh` : '—'}</b></div>` : '';

  // Nur, was wirklich hakt — und als ruhiger Hinweis, wo es nicht dringend ist.
  const warnungen = [];
  if (restNegativ) {
    warnungen.push(`Die Zwischenzähler ergeben zusammen <b>${zahl(summeUnter)} kWh</b>
      und damit mehr, als der Gesamtverbrauch mit <b>${zahl(gesamtV)} kWh</b>
      hergibt. Für das Haus bliebe nichts übrig — bitte die Stände prüfen.`);
  }
