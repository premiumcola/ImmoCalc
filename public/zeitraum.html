<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Abrechnung · ImmoCalc</title>
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F6E5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ImmoCalc">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/immo.css">
<style>
  /* N36a — der „Zurück"-Knopf trägt nur noch den Pfeil (Wort per aria-label
     für Screenreader). Kompakt, ohne die zwei Leerzeichen hinter dem Pfeil,
     die auf anderen Seiten den Abstand zum Wort halten. */
  #back{padding:8px 8px;margin:-8px 0 -8px -8px;font-size:20px}
  #back::before{content:"‹"}
  /* N36b — die Frist gehört nicht mehr als vollbreite Leiste über die Seite,
     sondern kompakt als Chip oben rechts in die Kopfzeile. Er sitzt oben rechts
     auf Höhe des Titels; der Untertitel darunter behält die volle Breite und
     bricht nicht um. In den Kopf-Block (barwrap) gesetzt, damit er auf jeder
     Breite auf der Titelzeile bleibt. */
  .barwrap{position:relative}
  .frist-chip{position:absolute;top:0;right:0;display:none;align-items:center;
    gap:6px;font:600 10.5px var(--mono);border-radius:999px;padding:5px 10px;
    white-space:nowrap;line-height:1.3;z-index:2}
  .frist-chip.an{display:inline-flex}
  .frist-chip .d{width:7px;height:7px;border-radius:50%;flex:none}
  /* Der Titel hält rechts Platz für den Chip frei (der Untertitel liegt darunter
     und braucht das nicht). */
  #titel{padding-right:132px}
  /* Auf schmalen Geräten fällt der Paragraph-Zusatz weg und der Titel bleibt
     einzeilig — die Frist bleibt als knapper Chip oben rechts. */
  @media(max-width:560px){
    .frist-chip .flabel{display:none}
    .frist-chip{font-size:10px;padding:4px 9px;gap:5px}
    #titel{font-size:15.5px;padding-right:98px}
  }
  .frist-chip.pos{background:var(--pos-bg);color:var(--pos)} .frist-chip.pos .d{background:var(--pos)}
  .frist-chip.amber{background:var(--amber-bg);color:var(--amber)} .frist-chip.amber .d{background:var(--amber)}
  .frist-chip.neg{background:var(--neg-bg);color:var(--neg)} .frist-chip.neg .d{background:var(--neg)}
  .frist-chip.fertig{background:#EEF2F1;color:var(--soft)} .frist-chip.fertig .d{background:var(--soft)}

  .fortschritt{background:var(--sheet);border-radius:14px;padding:15px 16px;margin-bottom:16px;
               box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .fortschritt .kopf{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .fortschritt .gross{font:700 19px var(--disp);letter-spacing:-.02em}
  .fortschritt .klein{font:500 12px var(--body);color:var(--soft)}
  .fortschritt .bahn{height:8px;border-radius:99px;background:#E4EAEA;overflow:hidden}
  .fortschritt .bahn i{display:block;height:100%;border-radius:99px;background:var(--teal)}

  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{flex:1;border:none;background:var(--sheet);color:var(--soft);border-radius:11px;
    padding:11px 8px;font:600 12.5px var(--disp);cursor:pointer;min-height:44px;
    box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .tabs button[aria-selected=true]{background:var(--teal-l);color:var(--teal-d)}

  /* Ablese-Wizard (CCXCIII) */
  .ablesebtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    border:1.5px solid #BFD9D1;background:var(--teal-l);color:var(--teal-d);border-radius:13px;
    padding:13px;min-height:48px;font:600 14px var(--disp);cursor:pointer;margin-bottom:14px}
  .ablesebtn:hover{background:#DCEDE7}
  .ablesebtn .si{font:400 18px var(--mono);line-height:1}
  .ablese-dlg{border:none;border-radius:18px;padding:0;max-width:440px;width:calc(100vw - 28px);
    background:var(--sheet);color:var(--ink);box-shadow:0 18px 50px rgba(22,38,44,.25)}
  .ablese-dlg::backdrop{background:rgba(22,38,44,.45)}
  .aw-kopf{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
  .aw-kopf .t{font:700 15px var(--disp);flex:1;min-width:0}
  .aw-x{border:none;background:var(--paper);width:32px;height:32px;border-radius:50%;
    font-size:18px;color:var(--ink);cursor:pointer;flex:none;line-height:1}
  .aw-bahn{height:6px;background:#E4EAEA;margin:0 18px;border-radius:99px;overflow:hidden}
  .aw-bahn i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .2s}
  .aw-schritt{font:600 11px var(--mono);color:var(--soft);padding:9px 18px 0}
  .aw-body{padding:4px 18px 14px}
  .aw-name{font:700 20px var(--disp);letter-spacing:-.01em;margin:4px 0 9px;line-height:1.15}
  .aw-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .aw-chips .c{font:600 11.5px var(--body);background:var(--paper);color:var(--soft);
    border-radius:99px;padding:4px 10px}
  .aw-vor{font:500 12.5px var(--body);color:var(--soft);margin-bottom:13px;line-height:1.5}
  .aw-vor strong{color:var(--ink)}
  .aw-feld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .aw-feld label{font:600 11px var(--mono);text-transform:uppercase;color:var(--soft);letter-spacing:.03em}
  .aw-feld input{border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;
    font:600 16px var(--body);background:var(--sheet);color:var(--ink);min-height:48px}
  .aw-feld input:focus{outline:none;border-color:var(--teal)}
  .aw-verb{font:600 12.5px var(--body);color:var(--teal-d);background:var(--teal-l);
    border-radius:11px;padding:10px 13px;margin-top:2px;line-height:1.45}
  .aw-fuss{display:flex;gap:10px;padding:12px 18px 18px}
  .aw-fuss button{flex:1;border-radius:12px;padding:13px;min-height:48px;
    font:600 14px var(--disp);cursor:pointer;border:none}
  .aw-zurueck{background:var(--paper);color:var(--ink)}
  .aw-zurueck[disabled]{opacity:.4;cursor:default}
  .aw-weiter{background:var(--teal);color:#fff}
  .aw-weiter[disabled]{opacity:.5;cursor:default}
  .aw-block{background:var(--paper);border-radius:13px;padding:12px 13px;margin-bottom:11px}
  .aw-bk{font:700 14px var(--disp);margin-bottom:8px}
  .aw-zeile{display:flex;justify-content:space-between;gap:10px;
    font:500 13px var(--body);padding:4px 0;border-top:1px solid var(--line)}
  .aw-zeile:first-of-type{border-top:none}
  .aw-zeile b{font-weight:700;white-space:nowrap}
  .aw-leer{font:500 12.5px var(--body);color:var(--soft);padding:2px 0}
  .aw-sk{display:flex;flex-direction:column;gap:6px;margin-top:10px;
    font:600 11px var(--mono);text-transform:uppercase;color:var(--soft);letter-spacing:.03em}
  .aw-select{border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;
    font:600 14px var(--body);background:var(--sheet);color:var(--ink);min-height:46px}
  .aw-select:focus{outline:none;border-color:var(--teal)}

  /* CCCLXXX — „Ablesewerte eingeben" und der Zahnrad-Knopf zum Konfigurieren
     stehen nebeneinander in einer Leiste. */
  .ablese-leiste{display:flex;gap:8px;margin-bottom:14px}
  .ablese-leiste .ablesebtn{flex:1;margin-bottom:0}
  /* N211 — nur noch der Konfig-Knopf, dezent rechts (kein prominenter Balken). */
  .ablese-leiste.nur-konfig{justify-content:flex-end;margin-bottom:12px}
  .zk-gear{flex:none;width:48px;min-height:48px;display:flex;align-items:center;
    justify-content:center;border:1.5px solid #BFD9D1;background:var(--teal-l);
    color:var(--teal-d);border-radius:13px;cursor:pointer}
  .zk-gear.breit{width:auto;gap:7px;padding:0 16px;min-height:44px;
    font:600 12.5px var(--disp)}
  .zk-gear.breit span{white-space:nowrap}
  .zk-gear:hover{background:#DCEDE7}
  .zk-gear svg{width:22px;height:22px;display:block}

  /* Zähler-Konfig-Maske (nutzt den Rahmen der Ablese-Maske: .ablese-dlg). */
  .zk-body{max-height:min(74dvh,620px);overflow:auto}
  .zk-intro{font:500 12.5px var(--body);color:var(--soft);line-height:1.5;
    margin:2px 0 12px}
  .zk-karte{background:var(--paper);border-radius:14px;padding:12px 12px 4px;
    margin-bottom:11px}
  .zk-kopf{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .zk-name{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;
    padding:10px 11px;font:700 14px var(--disp);background:var(--sheet);
    color:var(--ink);min-height:44px}
  .zk-name:focus{outline:none;border-color:var(--teal)}
  .zk-tools{display:flex;gap:4px;flex:none}
  .zk-ic{width:38px;height:38px;min-width:38px;border:none;border-radius:9px;
    background:var(--sheet);color:var(--soft);cursor:pointer;display:flex;
    align-items:center;justify-content:center;font:600 15px var(--body);line-height:1}
  .zk-ic:hover{background:#E1E8E6;color:var(--ink)}
  .zk-ic[disabled]{opacity:.35;cursor:default}
  .zk-ic.gefahr:hover{background:var(--neg-bg);color:var(--neg)}
  .zk-ic svg{width:16px;height:16px;display:block}
  .zk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:400px){ .zk-grid{grid-template-columns:1fr} }
  .zk-feld{display:flex;flex-direction:column;gap:5px;min-width:0;margin-bottom:9px}
  .zk-feld.voll{grid-column:1 / -1}
  .zk-feld label{font:600 9.5px var(--mono);text-transform:uppercase;
    letter-spacing:.05em;color:var(--soft)}
  .zk-feld select,.zk-feld input{border:1.5px solid var(--line);border-radius:10px;
    padding:9px 10px;font:600 13px var(--body);background:var(--sheet);
    color:var(--ink);min-height:44px;width:100%}
  .zk-feld select:focus,.zk-feld input:focus{outline:none;border-color:var(--teal)}
  .zk-anfang{display:flex;gap:8px;align-items:flex-end}
  .zk-anfang .zk-feld{flex:1;margin-bottom:9px}
  .zk-rest{font:500 11.5px var(--body);color:var(--teal-d);background:var(--teal-l);
    border-radius:9px;padding:8px 10px;margin:0 0 9px;line-height:1.45}
  .zk-add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    border:1.5px dashed var(--line);background:transparent;color:var(--teal-d);
    border-radius:13px;padding:12px;font:600 13px var(--disp);cursor:pointer;
    min-height:48px;margin-top:2px}
  .zk-add:hover{border-color:var(--teal);background:var(--teal-l)}
  .zk-leer{font:500 12.5px var(--body);color:var(--soft);line-height:1.5;
    padding:6px 2px 14px}

  .pruef{background:var(--sheet);border-radius:14px;margin-bottom:10px;overflow:hidden;
         box-shadow:0 1px 2px rgba(22,38,44,.05)}
  /* CCCLXXXVI — eine PDF aus dem Explorer über eine NK-Zeile ziehen: NUR die
     gerade überflogene Zeile bekommt eine Drop-Zone. Das Overlay liegt über der
     Zeile (pointer-events aus, damit die Zieh-Erkennung nicht flackert). */
  .pruef.dropziel{position:relative}
  .pruef.dropziel::after{content:"＋ Beleg hier ablegen";position:absolute;inset:0;
    z-index:6;display:flex;align-items:center;justify-content:center;
    background:rgba(15,110,92,.14);border:2px dashed var(--teal);border-radius:14px;
    color:var(--teal-d);font:600 13px var(--disp);letter-spacing:-.01em;
    pointer-events:none;-webkit-backdrop-filter:blur(1px);backdrop-filter:blur(1px)}
  /* CCCXCIV — großer Drop-Dialog am PC: Formular links, PDF-Vorschau rechts groß. */
  dialog.immo-dlg.beleg-drop-dlg{max-width:min(1060px,calc(100% - 32px));
    width:calc(100% - 32px)}
  /* Eyebrow über dem Dialogtitel: welche Immobilie, welcher Bereich (CD). */
  .bdd-eyebrow{display:block;font:600 11px var(--mono);letter-spacing:.06em;
    text-transform:uppercase;color:var(--teal-d);margin:0 0 3px}
  .bdd-body{display:flex;gap:18px;align-items:stretch}
  .bdd-links{flex:1 1 340px;min-width:0;display:flex;flex-direction:column}
  /* CD — die Vorschau bekommt A4-Hochformat, damit die erste Seite immer GANZ
     ohne Scrollen sichtbar ist; das PDF wird per view=Fit eingepasst. */
  .bdd-rechts{flex:1.5 1 460px;min-width:0;align-self:flex-start;
    aspect-ratio:1 / 1.414;max-height:min(86dvh,960px);
    background:var(--paper);border-radius:12px;
    overflow:hidden;display:flex;align-items:stretch}
  .bdd-embed{width:100%;height:100%;border:none}
  .bdd-img{width:100%;height:100%;object-fit:contain}
  .bdd-leer{margin:auto;color:var(--soft);font:500 13px var(--body)}
  .bdd-ki{font-style:italic;color:var(--soft)}
  .field.zwei{display:flex;gap:10px}
  .field.zwei > div{flex:1}
  /* N78 — die drei Wasser-Bereichsbeträge nebeneinander; auf schmalen Spalten
     dürfen sie umbrechen, damit nichts aus der Karte läuft. */
  .field.drei{display:flex;gap:10px;flex-wrap:wrap}
  .field.drei > div{flex:1 1 92px;min-width:0}
  .bdd-wasser-hint{font:400 12px var(--body);color:var(--soft);line-height:1.5;
    margin:0 0 12px}
  /* KI-neu-Knopf: dezent, animiert, während die KI liest. */
  .bdd-kibtn{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;
    border:1.5px solid #C7B8E0;background:#F1ECF9;color:#5B3E8F;border-radius:10px;
    padding:8px 12px;font:600 12px var(--disp);cursor:pointer;margin:2px 0 14px}
  .bdd-kibtn:hover{background:#E9E0F5}
  .bdd-kibtn[disabled]{cursor:default}
  .bdd-kibtn .funke{display:inline-block}
  .bdd-kibtn.laedt .funke{animation:bddspin .8s linear infinite}
  @keyframes bddspin{to{transform:rotate(360deg)}}
  .bdd-kibtn.laedt{background:#E9E0F5;color:#5B3E8F}
  .bdd-zus{font:400 12px var(--body);color:var(--soft);line-height:1.5;
    background:var(--paper);border-radius:10px;padding:9px 11px;margin:0 0 12px}
  .bdd-fuss{margin-top:auto}
  @media(max-width:720px){ .bdd-body{flex-direction:column-reverse}
    .bdd-rechts{aspect-ratio:auto;min-height:44dvh;max-height:64dvh} }
  /* CD — Ladeschleier zwischen Drop und Dialog: Prüfsumme + KI-Erkennung
     dauern kurz; ein Kringel zeigt „ich arbeite", statt dass nichts passiert. */
  .drop-lade{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:15px;
    background:rgba(22,38,44,.44);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .drop-lade .kringel{width:46px;height:46px;border-radius:50%;
    border:3px solid rgba(255,255,255,.32);border-top-color:#fff;
    animation:bddspin .8s linear infinite}
  .drop-lade .txt{color:#fff;font:600 13px var(--disp);letter-spacing:-.01em}
  /* N54 — Ladeanzeige DIREKT in der NK-Zeile, während ein abgelegter Beleg
     hochgeladen und verbucht wird: der Nutzer sieht am richtigen Ort „ich
     verarbeite das gerade", statt nur einen Toast. Solange sie läuft, treten
     „Datei wählen", Haken und Betragsfeld zurück. */
  .pruef.verarbeitet .scanmini,
  .pruef.verarbeitet .haken,
  .pruef.verarbeitet .kopf-betrag-box{display:none}
  .zeile-lade{display:inline-flex;align-items:center;gap:8px;flex:none;
    padding:6px 12px;border-radius:999px;background:var(--teal-l);color:var(--teal-d);
    font:600 12px var(--disp);letter-spacing:-.01em;white-space:nowrap}
  .zeile-lade .kringel{width:14px;height:14px;border-radius:50%;flex:none;
    border:2px solid rgba(15,110,92,.28);border-top-color:var(--teal);
    animation:bddspin .7s linear infinite}
  /* Hinweis in der Drop-Maske, wenn die Datei schon in der Ablage liegt. */
  .beleg-drop-dlg .dup-hinweis{background:var(--amber-bg);border-radius:12px;
    padding:11px 13px;margin:0 0 15px;font:400 12.5px var(--body);color:var(--ink);
    line-height:1.5}
  .beleg-drop-dlg .dup-hinweis strong{display:block;color:var(--amber);font-weight:600;
    margin-bottom:2px}
  .beleg-drop-dlg .dup-hinweis .pfad{display:block;font:500 11px var(--mono);
    color:var(--soft);margin:4px 0 3px;word-break:break-all}
  /* N54 — Inline-Fehler im Drop-Dialog (fehlender Betrag), sichtbar direkt über
     dem Knopf statt als Toast hinter dem Modal. */
  .beleg-drop-dlg .bdd-err{background:var(--neg);color:#fff;border-radius:11px;
    padding:9px 12px;margin:0 0 11px;font:600 12px var(--body);line-height:1.45}
  /* Gefüllte Zeile sanft grün herausheben: man sieht auf einen Blick, wo schon
     ein Betrag steht — und in welcher Höhe. Kein greller Block, sondern ein
     weicher Verlauf von links plus ein schmaler Akzent an der Kante. */
  .pruef.gefuellt{background:linear-gradient(100deg,var(--pos-bg) 0%,var(--sheet) 58%);
         box-shadow:inset 3px 0 0 var(--pos),0 1px 3px rgba(22,38,44,.07)}
  .pruef.gefuellt .wert{color:var(--pos)}
  /* CCLXXVIII — vorläufige (orange) Position aus einem Beleg: dieselbe Sprache
     wie die grüne „gefüllt"-Zeile, nur in Amber. Der Nutzer sieht auf einen
     Blick, dass hier noch eine Entscheidung aussteht — dezent, nicht grell.
     Amber übersticht Grün: eine bestätigte Position wird grün, hier ist noch
     nichts bestätigt. */
  .pruef.entwurf{background:linear-gradient(100deg,var(--amber-bg) 0%,var(--sheet) 60%);
         box-shadow:inset 3px 0 0 var(--amber),0 1px 3px rgba(22,38,44,.07)}
  .pruef.entwurf .wert{color:var(--amber)}
  .pruef.entwurf .ikon.fertig,.pruef.entwurf .ikon.warte{
         background:var(--amber-bg);color:var(--amber)}
  .pruef.entwurf .haken{background:var(--amber-bg);color:var(--amber)}
  /* Das kleine „Entwurf aus Beleg"-Etikett unter dem Namen — eine eigene Zeile,
     so breit wie sein Text, damit es nicht am Titel klebt. */
  .entw-badge{display:block;width:fit-content;max-width:100%;margin-top:6px;
    font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;
    color:var(--amber);background:var(--amber-bg);border-radius:7px;padding:4px 8px}
  /* Fuß der aufgeklappten Karte: primäre Aktion und der leise Zweitweg stehen
     nebeneinander in einer Zeile — „Fertig"/„Bestätigen" breit und teal, der
     Zweitweg dezent daneben. */
  .kartenfuss{display:flex;align-items:center;gap:10px;margin-top:18px}
  .hauptaktion{flex:1;min-width:0;border:none;border-radius:12px;padding:13px;
    font:600 14px var(--disp);cursor:pointer;min-height:48px;color:#fff;
    background:var(--teal)}
  .hauptaktion:hover{background:var(--teal-d)}
  .hauptaktion.ja{background:var(--pos)} .hauptaktion.ja:hover{background:#276b44}
  .hauptaktion[disabled]{opacity:.6;cursor:default}
  /* Zarte Textlinks: „Ableiten", „Zurück zum Prüfen", „Entfernen". Keine
     konkurrierenden Knöpfe, nur ruhige Zweitwege. Im Fuß mittig, nicht
     umbrechend, damit sie neben der breiten Hauptaktion sitzen. */
  .minilink{align-self:flex-start;border:none;background:transparent;
    color:var(--soft);text-decoration:underline;text-underline-offset:3px;
    cursor:pointer;font:600 12px var(--disp);padding:9px 2px;min-height:44px}
  .minilink:hover{color:var(--ink)}
  .minilink.gefahr:hover{color:var(--neg)}
  .kartenfuss .minilink{align-self:center;flex:none;white-space:nowrap;padding:9px 6px}
  /* Der Betrag lebt oben im Kopf: aufgeklappt ein schlankes Eingabefeld rechts
     (speichert beim Verlassen), sonst der lesbare Wert. Kein zweites, großes
     Feld mehr weiter unten. */
  /* CDII — Betrag im Kopf mit sichtbarem €-Zeichen; die Zahl ist rechtsbündig,
     das € sitzt ruhig dahinter. */
  .kopf-betrag-box{flex:none;position:relative;display:inline-flex;align-items:center}
  .kopf-betrag{width:126px;border:1.5px solid var(--line);
    border-radius:11px;padding:10px 30px 10px 11px;font:600 15px var(--body);min-height:44px;
    background:var(--sheet);color:var(--ink);text-align:right}
  .kopf-betrag:focus{outline:none;border-color:var(--teal)}
  .kbe{position:absolute;right:12px;pointer-events:none;font:600 13px var(--mono);
    color:var(--soft)}
  /* Das Anlege-Betragsfeld einer Katalog-Kostenart (nur beim Neuanlegen). */
  /* N157 — die Beleg-Ablage: erkennbar eine Fläche zum Fallenlassen, kein
     Knopf. Gestrichelter Rand, ruhiges Teal, der Dateidialog daneben als
     zweiter Weg. Beim Darüberziehen reagiert die ganze Karte (.dropziel). */
  .ablg{display:flex;flex-direction:column;align-items:center;text-align:center;
    gap:6px;margin:6px 0 4px;padding:20px 16px;border-radius:14px;
    border:2px dashed var(--line);background:var(--paper)}
  .ablg-ikon{display:flex;width:26px;height:26px;color:var(--teal);margin-bottom:2px}
  .ablg-ikon svg{width:26px;height:26px}
  .ablg-t{font:700 13.5px var(--disp);letter-spacing:-.01em;color:var(--ink)}
  .ablg-s{font:400 11.5px var(--body);color:var(--soft);line-height:1.5;
    max-width:34em}
  .ablg-k{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
  .ablg-knopf{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:44px;padding:10px 16px;border-radius:12px;cursor:pointer;
    border:1.5px solid #BBD4E5;background:#E8F1F7;color:#255676;
    font:600 12.5px var(--body)}
  .ablg-knopf:hover{background:#D8E8F2}
  .ablg-knopf svg{width:18px;height:18px;flex:none}
  .betragfeld{margin-top:2px}
  .betragfeld input{width:100%;border:1.5px solid var(--line);border-radius:12px;
    padding:13px 14px;font:600 17px var(--body);min-height:50px;
    background:var(--sheet);color:var(--ink)}
  .betragfeld input:focus{outline:none;border-color:var(--teal)}
  /* Aufteilung als €-Ergebnis je Partei; der Prozentanteil steht ruhig dahinter. */
  .rzp{color:var(--soft);font-weight:500;font-size:11px}
  .vt-gewichte{margin-top:4px}
  /* CCCLXI — Anteil je Zeile auch bei abgeleiteten Schlüsseln überschreibbar.
     Der €-Betrag bleibt die Leitzahl; das kleine Anteil-Feld sitzt ruhig und
     rechtsbündig daneben, ohne die Zahl von früher wiederzubeleben. */
  /* CDII — Aufteilungszeile entzerrt: Name links, €-Ergebnis + Prozent
     GESTAPELT (nicht zusammengequetscht) rechts daneben, dann das Anteil-Feld
     mit Maßeinheit. */
  .rz.vt-abg{align-items:center;gap:14px;padding:7px 0}
  .rz.vt-abg .gn{flex:1;min-width:0;font:500 13px var(--body);
    hyphens:auto;overflow-wrap:anywhere}
  .rz.vt-abg .gsub{display:block;font:400 11px var(--body);color:var(--soft);
    margin-top:2px;line-height:1.35}
  .rz.vt-abg .vt-euro{flex:none;display:flex;flex-direction:column;align-items:flex-end;
    line-height:1.3;min-width:74px}
  .rz.vt-abg .vt-euro .euro-z{font:600 13px var(--mono);color:var(--ink);white-space:nowrap}
  .rz.vt-abg .vt-euro .rzp{font:500 11px var(--mono);color:var(--soft)}
  /* N168 — 58px schnitten Flaechen mit zwei Nachkommastellen ab („76,97"
     wurde zu „76,97!"). Breiter, damit bis „9999,99" hineinpasst. */
  .anteil-mini{flex:none;width:76px;border:1.5px solid var(--line);border-radius:9px;
    padding:8px 9px;font:600 12px var(--mono);min-height:44px;background:var(--sheet);
    color:var(--soft);text-align:right}
  /* N17 — die kleinen Hoch/Runter-Pfeilchen der Zahlenfelder sind schwer zu
     treffen und überflüssig: der Wert wird eingetippt. Überall ausblenden. */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  .anteil-mini:focus{outline:none;border-color:var(--teal);color:var(--ink)}
  /* Einheit-Auswähler für „Nur eine Einheit/Person". */
  .einzel-wahl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  /* CCCLIX — Teilbetrag direkt auf eine Einheit. Zarter Zugang unter der
     Aufteilung; leiser Textlink, aufgeklappt Betrag · Einheit · §35a. */
  .vorab-link{align-self:flex-start;border:none;background:transparent;
    color:var(--soft);cursor:pointer;font:600 12px var(--disp);padding:9px 2px;
    min-height:44px;margin-top:6px;
    text-decoration:underline;text-underline-offset:3px}
  .vorab-link:hover{color:var(--teal-d)}
  .vorab{margin-top:10px;background:var(--paper);border-radius:12px;padding:12px 13px}
  .vorab-kopf{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .vorab-t{flex:1;min-width:0;font:600 10px var(--mono);letter-spacing:.06em;
    text-transform:uppercase;color:var(--soft)}
  .vorab-x{border:none;background:none;color:var(--soft);cursor:pointer;
    font:400 18px var(--body);line-height:1;padding:0;flex:none;
    width:32px;height:32px;border-radius:8px}
  .vorab-x:hover{color:var(--neg);background:rgba(178,66,41,.09)}
  .vorab-betrag{display:flex;align-items:center;gap:9px}
  .vorab-betrag input{flex:1;min-width:0;border:1.5px solid var(--line);
    border-radius:11px;padding:11px 12px;font:600 15px var(--body);min-height:46px;
    background:var(--sheet);color:var(--ink)}
  .vorab-betrag input:focus{outline:none;border-color:var(--teal)}
  .vorab-eur{font:600 11px var(--mono);color:var(--soft);flex:none;
    text-transform:uppercase;letter-spacing:.04em}
  /* Netto rein, Brutto (× 1,19) rechnet live daneben — ruhig teal, damit klar
     ist, welcher Betrag am Ende auf die Einheit geht. */
  .vorab-brutto{margin-top:8px;font:600 12.5px var(--body);color:var(--teal-d);
    background:var(--teal-l);border-radius:9px;padding:8px 11px;line-height:1.4}
  .vorab .einzel-wahl{margin-top:12px}
  .vorab-s35{display:flex;align-items:center;gap:10px;margin-top:12px;
    padding-top:10px;border-top:1px solid var(--line);
    font:500 12.5px var(--body);color:var(--ink);cursor:pointer;min-height:44px}
  .vorab-s35 input{width:20px;height:20px;flex:none}
  /* Die Vorab-Zeile ganz oben in der Aufteilung — ruhig, teal-getönt. */
  .vorab-zeile{color:var(--teal-d)}
  /* Fußzeile: was am Zeitraum hängt, und der ruhige Hinweis auf das
     automatische Entfernen — kein Löschknopf. */
  .zr-fuss{margin-top:18px;padding:14px 16px;border-radius:14px;
           background:var(--sheet);box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .zr-fuss .zeilen{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .zr-fuss .chip{font:600 11.5px var(--mono);padding:5px 10px;border-radius:999px;
                 background:#EDF1F0;color:var(--soft)}
  .zr-fuss .chip.hat{background:var(--pos-bg);color:var(--pos)}
  .zr-fuss .hinweis{font:400 12px var(--body);color:var(--soft);line-height:1.5}
  .pruef .zeile{display:flex;gap:12px;align-items:center;padding:13px 15px;
                width:100%;border:none;background:none;text-align:left;cursor:pointer;
                font-family:var(--body);color:inherit;min-height:44px}
  .haken{width:24px;height:24px;border-radius:50%;flex:none;display:flex;
         align-items:center;justify-content:center;font:600 12px var(--mono)}
  .haken.gruen{background:var(--pos-bg);color:var(--pos)}
  .haken.rot{background:var(--neg-bg);color:var(--neg)}
  .haken.grau{background:#EDF1F0;color:var(--soft)}
  .haken.amber{background:var(--amber-bg);color:var(--amber)}
  /* overflow-wrap: lange Begriffe wie "Gebäudeversicherung" schieben sonst
     den Betrag an sich heran, bis beides zusammenklebt. */
  /* hyphens vor overflow-wrap: so wird aus "Gebäudeversicherung" ein
     getrenntes "Gebäude-versicherung" statt eines Bruchs mitten im Wort.
     overflow-wrap bleibt als Notnagel fuer Woerter ohne Trennstelle. */
  .pruef .name{flex:1;min-width:0;font:600 14px var(--disp);letter-spacing:-.01em;
               hyphens:auto;overflow-wrap:break-word;padding-right:4px}
  .pruef .unter{display:block;font:400 11.5px var(--body);color:var(--soft);
                margin-top:3px;line-height:1.4;letter-spacing:0}
  .pruef .wert{flex:none;font:600 13px var(--mono);white-space:nowrap}
  /* Einheitliches Kategorie-Symbol; die Farbe traegt den Zustand. */
  .ikon{width:34px;height:34px;border-radius:10px;flex:none;display:flex;
        align-items:center;justify-content:center}
  .ikon svg{width:21px;height:21px;display:block}
  .ikon.fertig{background:var(--pos-bg);color:var(--pos)}
  .ikon.warte{background:#EDF1F0;color:var(--soft)}
  .pruef .wert.fehlt{color:var(--neg)}
  /* CDII — der aufgeklappte Körper wird links an der TITELZEILE ausgerichtet
     (Icon 34 + 15 Rand + 12 Abstand = 61 px), damit nicht „alles ganz links
     hängt", während der Titel eingerückt ist. Rechts ruhig Luft. */
  .pruef .auf{padding:4px 16px 18px 61px}
  .pruef .auf .zk{font:600 10px var(--mono);letter-spacing:.07em;text-transform:uppercase;
                  color:var(--soft);margin:16px 0 7px}
  .pruef .auf .zk:first-child{margin-top:6px}
  .pruef .auf .rz{display:flex;justify-content:space-between;gap:10px;
                  font:500 12.5px var(--body);padding:4px 0}
  .pruef .auf .rz span:last-child{font-family:var(--mono);font-weight:600}
  /* CDII — Maßeinheit (m², Pers. …) direkt am Eingabefeld; die Zahl allein
     sagt nicht, dass „40" eine Fläche ist. */
  .mini-wrap{flex:none;display:inline-flex;align-items:center;gap:6px}
  .mini-einheit{font:600 11px var(--mono);color:var(--soft);white-space:nowrap;min-width:16px}
  @media(max-width:520px){ .pruef .auf{padding-left:50px} }
  /* Scan direkt in der Zeile: einladend, aber nicht grell — gedecktes Grün
     auf hellem Grund statt eines vollflächigen Knopfes. Steht neben dem
     Zeilenknopf, nicht darin: Knöpfe lassen sich nicht schachteln. */
  .pruef .kopf{display:flex;align-items:center;gap:8px;padding-right:15px}
  .pruef .kopf > .zeile{flex:1;min-width:0;padding-right:2px}
  /* CCCLXXXVII — die zwei Beleg-Knöpfe: klare Icons (Kamera / Wolke bzw. Upload)
     in gedämpftem Blau statt Grün, damit sie sich vom teal-Rest abheben und
     eindeutig als „Beleg holen" lesen. Etwas größer, das Symbol trägt allein. */
  .scanmini{display:flex;align-items:center;justify-content:center;gap:8px;flex:none;
    border:1.5px solid #BBD4E5;background:#E8F1F7;color:#255676;
    border-radius:12px;padding:9px 12px;cursor:pointer;font-family:var(--body);
    min-height:46px;min-width:46px}
  .scanmini:hover{background:#D8E8F2}
  .scanmini[disabled]{opacity:.65;cursor:default}
  .scanmini svg{width:22px;height:22px;display:block;flex:none}
  .scanmini .st{font:600 11.5px var(--disp);letter-spacing:-.005em;
                white-space:nowrap}
  /* „Aus Ablage" steht neben der Kamera, aber ruhiger (weißer Grund, blauer
     Rahmen) — die zweite Art, einen Beleg an die Position zu holen. */
  .scanmini.ablage{border-color:#C4D6E4;background:var(--sheet);color:#2C6A93}
  .scanmini.ablage:hover{background:#EEF4F9}
  /* Auf dem Handy tragen die zwei Knöpfe nur ihr Symbol — sonst quetschen die
     Labels („Beleg erfassen" + „Aus Ablage") den Kostenart-Namen zeichenweise
     um. Erst ab Tablet-Breite ist Platz für die Beschriftung. */
  @media(max-width:560px){ .scanmini .st{display:none} }
  /* ---- NK-STRUKTUR: Bereiche, Zähler-Chip, Schlüsselwort ----------------- */
  /* Bereichs-Überschrift über einer Gruppe von Kostenzeilen: dezente
     Abtrennung, kleine gedeckte Mono-Marke — ordnet, ohne zu rufen. */
  .kat-kopf{display:flex;align-items:center;gap:9px;margin:20px 2px 8px}
  .kat-kopf .kat-t{font:600 10px var(--mono);letter-spacing:.09em;flex:none;
    text-transform:uppercase;color:var(--soft)}
  /* Bereichs-Symbol: dezent, gedeckt, mittig zur Marke — ordnet, ruft nicht. */
  .kat-kopf .kat-ikon{flex:none;display:inline-flex;align-items:center;
    justify-content:center;color:var(--soft)}
  .kat-kopf .kat-ikon svg{width:17px;height:17px;display:block}
  .kat-kopf::after{content:"";flex:1;height:1px;background:var(--line)}
  /* Zähler-Chip: der abgelesene Medienverbrauch an der Position — bewusst
     eigenständig (gedeckt-teal, mono, rund) und klar KEIN €-Betrag, damit er
     der Verteilung nicht widerspricht (Tooltip sagt es aus). */
  .mchip{display:inline-flex;align-items:center;vertical-align:middle;
    font:600 10.5px var(--mono);color:var(--teal-d);background:var(--teal-l);
    border-radius:999px;padding:2px 9px;margin:0 7px 0 8px;white-space:nowrap}
  /* N157 — die Aufschlüsselung der Strom-Position bekommt eine eigene Reihe
     unter dem Titel: nebeneinander klebte die Menge am Namen. */
  .mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .mchips .mchip{margin:0}
  /* Verteilungsschlüssel als ein ruhiges Wort an der Zeile. */
  .vkey{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;
    margin-left:7px;font:600 10px var(--mono);letter-spacing:.02em;color:var(--soft);
    background:#EDF1F0;border-radius:6px;padding:2px 8px;white-space:nowrap}
  .vkey svg{flex:none;width:12px;height:12px;display:block;opacity:.85}
  /* CCCLXIII — Anbieter/Gewerk: Tag in der Zeile + Setz-Feld in der Karte. */
  /* CCCXCV — Firma/Anbieter reichert die Zeile an: mittig, kursiv und
     zurückgesetzt (gedeckte Schrift), nicht als lauter Chip. */
  /* Anbieter/Gewerk als ruhige Unterzeile unter dem Namen — voll lesbar, bricht
     bei langen Behördennamen um, nimmt dem Namen aber keine Breite mehr weg
     (früher: rechts angeklemmt, abgeschnitten, quetschte den Namen zeichenweise). */
  .anbieter-tag{display:block;margin-top:4px;font:italic 500 11.5px var(--body);
    color:var(--soft);line-height:1.35;overflow-wrap:break-word}
  .anbieterzeile{margin-top:10px}
  .anbieterzeile label{display:block;font:600 10px var(--mono);letter-spacing:.06em;
    text-transform:uppercase;color:var(--soft);margin-bottom:4px}
  .anbieterzeile input{width:100%;border:1.5px solid var(--line);border-radius:11px;
    padding:10px 12px;font-size:16px;background:var(--sheet);color:var(--ink)}
  .anbieterzeile input:focus{outline:none;border-color:var(--teal)}
  /* CCCLXII — Kostenart der Position wechseln (Wähler + Freitext für eine neue). */
  .kostenartzeile{margin-top:10px}
  .kostenartzeile label{display:block;font:600 10px var(--mono);letter-spacing:.06em;
    text-transform:uppercase;color:var(--soft);margin-bottom:4px}
  .kostenartzeile select,.kostenartzeile .ka-neu{width:100%;border:1.5px solid var(--line);
    border-radius:11px;padding:10px 12px;font-size:16px;background:var(--sheet);color:var(--ink)}
  .kostenartzeile select:focus,.kostenartzeile .ka-neu:focus{outline:none;border-color:var(--teal)}
  .kostenartzeile .ka-neu{margin-top:6px}
  .nachtrag{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .nachtrag input{flex:1;min-width:130px;border:1.5px solid var(--line);
    border-radius:10px;padding:10px 12px;
    font:500 14px var(--body);min-height:44px;background:var(--sheet)}
  .nachtrag input:focus{outline:none;border-color:var(--teal)}
  .nachtrag button{border:none;border-radius:10px;padding:10px 16px;background:var(--teal);
    color:#fff;font:600 13px var(--disp);cursor:pointer;min-height:44px}
  /* Den Betrag einer bestehenden Position ändern ist eine leise Korrektur, kein
     Haupt-Aufruf — grau statt grün, damit nur „Anlegen"/„Bestätigen" grün rufen. */
  .nachtrag button.leise{background:#EDF1F0;color:var(--ink)}
  .nachtrag button.leise:hover{background:#E1E8E6}
  /* Eine Kostenart aus dem Katalog, zu der es noch keine Position gibt:
     hier entsteht sie. Der Betrag ist freiwillig — wer den Beleg noch sucht,
     legt die Position leer an und trägt ihn später nach. */
  .neu .text{display:block;font:400 11.5px var(--body);color:var(--soft);
             line-height:1.45;margin:10px 0 0}
  /* Entfernen steht bewusst am Ende und leise: es ist die seltenste Handlung
     an einer Position und darf nicht neben „Übernehmen" um Klicks buhlen. */
  .entfernen{margin-top:12px;border:none;background:transparent;color:var(--soft);
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;
    font:600 12px var(--disp);padding:10px 2px;min-height:44px}
  .entfernen:hover{color:var(--neg)}
  /* Verteilung: Schlüssel wählen, Gewichte lesen und überschreiben.
     Die Zahl allein („Büro 4.1398") sagt niemandem etwas — erst Maßeinheit
     und Prozentanteil machen sie lesbar. */
  .vt{margin-top:2px}
  .vt .wahl{margin:6px 0 4px}
  /* N7 — die Aufteilung hängt sichtbar unter dem „Verteilen nach"-Wähler:
     eine Stufe eingerückt, dezent vertieft („eingebrannt") und oben nah an
     den Chooser angedockt. */
  .vt-aufteilung{margin:3px 0 2px 14px;background:var(--paper);
    border-radius:12px;padding:6px 13px 12px;
    box-shadow:inset 0 1px 2px rgba(22,38,44,.06)}
  .vt-aufteilung > .zk:first-child{margin-top:6px}
  @media(max-width:520px){ .vt-aufteilung{margin-left:9px;padding:6px 10px 11px} }
  .vt .hinweis{font:400 11.5px var(--body);color:var(--soft);line-height:1.45;
               margin:8px 0 2px}
  .gw{display:flex;align-items:center;gap:8px;padding:5px 0}
  .gw .gn{flex:1;min-width:0;font:500 12.5px var(--body);
          hyphens:auto;overflow-wrap:anywhere}
  .gw input{width:92px;flex:none;border:1.5px solid var(--line);border-radius:10px;
    padding:9px 10px;font:600 12.5px var(--mono);min-height:44px;
    background:var(--sheet);text-align:right;color:inherit}
  .gw input:focus{outline:none;border-color:var(--teal)}
  /* Ein Leerstand heißt wie seine Einheit („EG") und sähe sonst aus wie ein
     Mieter. Die Beischrift sagt, wer ihn trägt. */
  .gw .gsub{display:block;font:400 11px var(--body);color:var(--soft);
            margin-top:2px;line-height:1.35}
  .gw .gv{width:92px;flex:none;text-align:right;font:600 12.5px var(--mono)}
  .gw .gp{width:48px;flex:none;text-align:right;
          font:600 11.5px var(--mono);color:var(--soft)}
  .vt .knopfzeile{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .vt .knopfzeile button{border:none;border-radius:10px;padding:10px 14px;
    font:600 12.5px var(--disp);cursor:pointer;min-height:44px}
  .vt .leise{background:#EDF1F0;color:var(--ink)}
  .vt .leise:hover{background:#E1E8E6}
  .warnung{display:flex;gap:9px;align-items:flex-start;background:var(--neg-bg);
    color:var(--neg);border-radius:11px;padding:11px 12px;margin:10px 0 2px;
    font:500 11.5px var(--body);line-height:1.45}
  .warnung b{font-weight:700}

  /* ---- N58–N61: Zählerstände-Übersicht (Einklapper) ---------------------
     N143 — die Zähler sind der Kostenposition darüber UNTERGEORDNET. Das zeigen
     drei Dinge zusammen: die Einrückung, die Linie an der linken Kante und das
     Zähler-Icon im Kopf. Auf schmalen Schirmen fällt die Einrückung kleiner aus
     (Eingabefelder brauchen die Breite) — Linie und Icon tragen sie dort. */
  .zu-panel{background:var(--sheet);border-radius:14px;margin:2px 0 12px 22px;
    box-shadow:0 1px 2px rgba(22,38,44,.05),inset 3px 0 0 var(--teal-l);
    overflow:hidden}
  .zu-sum{width:100%;display:flex;align-items:center;gap:10px;padding:14px 15px;
    background:none;border:none;cursor:pointer;text-align:left;min-height:52px}
  .zu-ikon{flex:none;display:flex;width:19px;height:19px;color:var(--teal)}
  .zu-ikon svg{width:19px;height:19px}
  .zu-st{font:700 13.5px var(--disp);letter-spacing:-.01em;color:var(--ink);flex:none}
  .zu-meta{flex:1;min-width:0;font:400 11px var(--body);color:var(--soft)}
  .zu-chev{flex:none;display:flex;color:var(--soft);transition:transform .18s}
  .zu-chev svg{width:18px;height:18px}
  .zu-panel.offen .zu-chev{transform:rotate(180deg)}
  .zu-inhalt{display:none;padding:0 15px 12px}
  .zu-panel.offen .zu-inhalt{display:block}
  @media(max-width:520px){ .zu-panel{margin-left:10px} .zu-sum{padding:13px 12px}
    .zu-inhalt{padding:0 12px 12px} }
  .zu-block{margin-top:14px}
  .zu-bt{display:flex;align-items:center;gap:8px;font:700 12.5px var(--disp);
    color:var(--ink);margin-bottom:8px}
  .zu-bi{flex:none;display:flex;width:22px;height:22px;color:var(--teal)}
  .zu-bi svg{width:22px;height:22px}
  .zu-art{margin:10px 0 4px}
  .zu-at{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;
    color:var(--soft);margin-bottom:6px}
  .zu-kein{font:400 11.5px var(--body);color:var(--soft);padding:4px 2px 6px}
  .zu-zeile{padding:9px 11px;margin-bottom:7px;background:var(--paper);
    border-radius:11px;box-shadow:inset 3px 0 0 transparent}
  .zu-zeile.fertig{box-shadow:inset 3px 0 0 var(--pos)}
  .zu-haupt{display:flex;align-items:flex-end;flex-wrap:wrap;gap:9px 12px}
  .zu-op{flex:none;align-self:center;font:700 16px var(--mono);color:var(--neg)}
  .zu-name-inp{width:100%;min-width:120px;box-sizing:border-box;
    border:1.5px solid var(--teal);border-radius:8px;padding:6px 8px;
    font:600 13px var(--disp);color:var(--ink);background:var(--sheet)}
  .zu-name-inp:focus{outline:none;box-shadow:0 0 0 3px var(--teal-l)}
  .zu-um{background:none;border:none;padding:4px;margin-left:6px;cursor:pointer;
    color:var(--muted);border-radius:6px;line-height:0;vertical-align:middle;
    min-width:26px;min-height:26px}
  .zu-um:hover{color:var(--teal);background:var(--paper)}
  .zu-um:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
  .zu-name{flex:1;min-width:110px;align-self:center;font:600 12.5px var(--body);
    color:var(--ink);overflow-wrap:anywhere}
  .zu-sub{display:block;font:400 10.5px var(--body);color:var(--soft);margin-top:1px}
  .zu-feld{flex:none;display:flex;flex-direction:column;gap:4px}
  .zu-feld label{font:600 8.5px var(--mono);letter-spacing:.05em;
    text-transform:uppercase;color:var(--soft)}
  .zu-feld input{box-sizing:border-box;border:1.5px solid var(--line);
    border-radius:9px;padding:9px 10px;font:600 12px var(--mono);
    background:var(--sheet);color:var(--ink)}
  .zu-feld input[type=text]{width:100px;min-height:44px;text-align:right}
  .zu-feld input:focus{outline:none;border-color:var(--teal)}
  .zu-anf{font:600 12px var(--mono);color:var(--ink);white-space:nowrap}
  /* N88 — Stand und Ablesedatum stehen wieder je Zähler nebeneinander; darunter
     die sichtbare Umrechnung auf die Periodengrenze. Die Paar-Zeile ist so hoch
     wie ein Eingabefeld, damit Anfang und Ende auf einer Linie sitzen. */
  .zu-paar{display:flex;align-items:center;gap:8px;min-height:44px}
  .zu-feld input[type=date]{width:134px;min-height:44px;font:500 11.5px var(--body)}
  .zu-dat,.zu-uebernommen{font:500 10.5px var(--body);color:var(--soft);
    white-space:nowrap}
  .zu-rechnung{display:flex;flex-direction:column;gap:3px;margin-top:8px;
    padding-top:7px;border-top:1px dashed var(--line)}
  .zu-rz{font:400 10.5px var(--body);color:var(--soft);line-height:1.5;
    overflow-wrap:anywhere}
  .zu-rz b{font:600 8.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;
    color:var(--soft);margin-right:5px}
  .zu-rz strong{font:700 11px var(--mono);color:var(--ink)}
  .zu-dok{margin-top:8px;min-height:44px;padding:9px 15px;border-radius:10px;
    border:1.5px solid var(--teal);background:var(--teal-l);color:var(--teal-d);
    font:600 11.5px var(--body);cursor:pointer}
  .zu-verb{flex:none;min-width:78px;align-self:center;text-align:right;
    font:700 12.5px var(--mono);color:var(--soft);white-space:nowrap}
  .zu-verb small{font:600 8.5px var(--mono);color:var(--soft);text-transform:uppercase}
  .zu-zeile.fertig .zu-verb{color:var(--pos)}
  .zu-ehwahl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:9px;
    padding-top:9px;border-top:1px dashed var(--line)}
  .zu-ehl{flex:none;font:600 8.5px var(--mono);letter-spacing:.05em;
    text-transform:uppercase;color:var(--soft)}
  .zu-ehchips{display:flex;flex-wrap:wrap;gap:6px}
  .zu-eh{min-height:40px;padding:6px 13px;border-radius:999px;
    border:1.5px solid var(--line);background:var(--sheet);color:var(--soft);
    font:600 11.5px var(--body);cursor:pointer}
  .zu-eh.an{border-color:var(--teal);background:var(--teal-l);color:var(--teal-d)}
  /* N157 — an der Ladestation steht statt des Einheiten-Auswählers, woher der
     Wert kommt und wer lädt. Ihr Strom geht VORAB ab und wird gerade nicht auf
     die Einheiten verteilt — ein Auswähler dort behauptete das Gegenteil.
     Dieselbe Trennlinie und dieselbe Label-Spalte wie beim Auswähler, damit die
     Zeile ohne ihn nicht wie abgeschnitten wirkt. */
  .zu-eauto{display:flex;flex-direction:column;gap:7px;margin-top:9px;
    padding-top:9px;border-top:1px dashed var(--line)}
  .zu-eq{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 8px}
  .zu-eq .zu-et{flex:1 1 220px;min-width:0;font:400 11px var(--body);
    color:var(--soft);line-height:1.55;overflow-wrap:anywhere}
  .zu-eq .zu-et b{font-weight:600;color:var(--ink)}
  .zu-eq .zu-et a{color:var(--teal-d);font-weight:600}
  .zu-eq.fehlt .zu-et{color:var(--amber)}
  .zu-kalt-abzug{margin:2px 0 6px 10px;padding-left:11px;
    border-left:2px solid var(--line)}
  .zu-zeile.minus{background:transparent;box-shadow:none;padding:6px 9px;margin-bottom:2px}
  .zu-zeile.rest{background:var(--teal-l);box-shadow:inset 3px 0 0 var(--teal);
    margin-top:6px}
  .zu-zeile.rest .zu-name{color:var(--teal-d)}
  .zu-zeile.rest .zu-verb{color:var(--teal-d)}
  /* N120 — bis 900 px (also auch auf dem iPad) bekommt jedes Feld seine eigene
     Reihe. Dazwischen brach die Zeile vorher an willkürlichen Stellen um: mal
     stand der Verbrauch neben dem Datum, mal allein darunter. */
  @media(max-width:900px){
    .zu-name{min-width:100%}
    /* N88 — je Zeile eine volle Reihe: Stand schmal, Datum füllt den Rest. */
    .zu-feld{flex:1 1 100%;min-width:0}
    .zu-feld input[type=text]{flex:none;width:96px}
    .zu-feld input[type=date]{flex:1 1 auto;width:auto;min-width:0}
    .zu-verb{min-width:0;flex:1 1 100%;text-align:right;margin-top:2px}
  }

  /* ---- N47/N74: Wasser-Detail — inline in der aufgeklappten Position ----- */
  /* N74 — Detail nicht mehr im Popup, sondern inline beim Aufklappen. Die
     .wd-*-Bausteine (Kostenboxen + Tabelle) sind bewusst global (nicht an ein
     Dialog gebunden), damit sie hier greifen. */
  .wd-inline{margin-bottom:14px}
  .wd-schl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
  .wd-schl-l{font:600 8.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;
    color:var(--soft)}
  .wd-sb{border:1.5px solid var(--line);background:var(--sheet);color:var(--soft);
    border-radius:999px;padding:8px 14px;min-height:38px;font:600 11.5px var(--disp);
    cursor:pointer}
  .wd-sb.an{border-color:var(--teal);background:var(--teal-l);color:var(--teal-d)}
  .wd-rm{width:92px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;
    min-height:38px;font:600 12px var(--mono);background:var(--sheet);text-align:right}
  .wd-rm:focus{outline:none;border-color:var(--teal)}
  .wd-lade{color:var(--soft);font:500 13px var(--body);padding:8px 2px}
  /* N79 — Heizöl-Manager (Lieferungen + FIFO) inline in der Heizkosten-Position. */
  .ho-inline{margin-bottom:14px}
  .ho-kpi{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .ho-kbox{flex:1 1 120px;background:var(--paper);border-radius:12px;padding:10px 12px}
  .ho-kbox.teal{background:var(--teal-l)}
  .ho-kbox.teal .ho-kv{color:var(--teal-d)}
  .ho-kl{display:block;font:600 8.5px var(--mono);letter-spacing:.05em;
    text-transform:uppercase;color:var(--soft)}
  .ho-kv{display:block;font:700 15px var(--disp);letter-spacing:-.02em;margin-top:5px;color:var(--ink)}
  .ho-warn{background:var(--amber-bg);color:var(--amber);border-radius:11px;
    padding:10px 12px;margin-bottom:10px;font:500 12px var(--body);line-height:1.45}
  .ho-liste{display:flex;flex-direction:column;gap:6px}
  .ho-zeile{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;
    background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .ho-dt{flex:1 1 130px;font:600 12px var(--body);color:var(--ink)}
  .ho-anf{font:600 9px var(--mono);color:var(--teal-d);background:var(--teal-l);
    border-radius:6px;padding:1px 6px}
  .ho-lit,.ho-wert{font:600 12px var(--mono);color:var(--ink)}
  .ho-pl{font:500 11px var(--mono);color:var(--soft)}
  .ho-x{border:none;background:var(--paper);width:30px;height:30px;border-radius:50%;
    color:var(--neg);font:700 15px var(--body);cursor:pointer;flex:none}
  .ho-summe{margin-top:8px;font:500 12px var(--body);color:var(--soft)}
  .ho-summe b{color:var(--ink);font-weight:700}
  .ho-neu{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;
    padding-top:12px;border-top:1px solid var(--line)}
  .ho-neu input[type=date],.ho-neu input[type=number]{border:1.5px solid var(--line);
    border-radius:10px;padding:9px 11px;min-height:44px;font:500 12px var(--body);
    background:var(--sheet)}
  .ho-neu input[type=number]{width:110px}
  .ho-neu input:focus{outline:none;border-color:var(--teal)}
  .ho-anfw{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--body);color:var(--ink)}
  /* N80/N81 — §9-Split + HKV als eigene Abschnitte im Öl-Manager. */
  .ho-sekt{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .ho-st{font:700 12px var(--disp);color:var(--ink);margin-bottom:8px}
  .ho-sh{font:500 10px var(--mono);color:var(--soft);margin-left:6px}
  .ho-neu select{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;
    min-height:44px;font:500 12px var(--body);background:var(--sheet)}
  .ho-neu input[type=text]{width:110px;border:1.5px solid var(--line);border-radius:10px;
    padding:9px 11px;min-height:44px;font:500 12px var(--body);background:var(--sheet)}
  .ho-neu input[type=text]:focus,.ho-neu select:focus{outline:none;border-color:var(--teal)}
  /* N82b — Deckung (Kosten vs. Abschläge) unter dem Kostenfluss. */
  .deckung{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;
    border-top:1px solid var(--line)}
  .deckung .dstat{flex:1 1 120px;background:var(--paper);border-radius:11px;padding:9px 12px}
  .deckung.neg .dstat:last-child{background:#F6E7E2}
  .deckung.pos .dstat:last-child{background:var(--teal-l)}
  .deckung .dl{display:block;font:600 8.5px var(--mono);letter-spacing:.05em;
    text-transform:uppercase;color:var(--soft)}
  .deckung .dv{display:block;font:700 15px var(--disp);color:var(--ink);margin-top:4px}
  .deckung .dv.neg{color:var(--neg)} .deckung .dv.pos{color:var(--pos)}
  .deckung .dhinweis{flex:1 1 100%;font:400 11.5px var(--body);color:var(--soft);align-self:center}
  .wd-hinweis{background:var(--amber-bg);color:var(--amber);border-radius:11px;
    padding:11px 13px;margin:0 0 14px;font:500 12.5px var(--body);line-height:1.5}
  .wd-laedt,.wd-leer{font:500 13px var(--body);color:var(--soft);padding:16px 2px;
    line-height:1.6}
  .wd-kosten{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .wd-kbox{flex:1 1 128px;background:var(--paper);border-radius:12px;padding:10px 12px;
    display:flex;flex-direction:column;gap:3px}
  .wd-kl{font:600 9.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;
    color:var(--soft)}
  .wd-kv{font:700 15px var(--disp);color:var(--ink);letter-spacing:-.01em}
  .wd-kbox.gesamt{background:var(--teal-l)}
  .wd-kbox.gesamt .wd-kv{color:var(--teal-d)}
  .wd-kbox.preis{background:var(--teal)}
  .wd-kbox.preis .wd-kl{color:rgba(255,255,255,.82)}
  .wd-kbox.preis .wd-kv{color:#fff}
  /* N57 — die drei Bestandteile im Popup als Eingabefelder. */
  .wd-kbox.wd-edit{gap:5px;background:var(--teal-l)}
  .wd-kin{display:flex;align-items:center;gap:6px}
  .wd-kin input{width:100%;min-width:0;border:1.5px solid #BFD9D1;border-radius:9px;
    padding:8px 10px;font:700 14px var(--disp);color:var(--ink);background:var(--sheet);
    min-height:44px}
  .wd-kin input:focus{outline:none;border-color:var(--teal)}
  .wd-kve{flex:none;font:600 13px var(--mono);color:var(--teal-d)}
  .wd-tabelle{overflow-x:auto;border-radius:12px;border:1px solid var(--line);
    max-width:100%;-webkit-overflow-scrolling:touch}
  .wd-tab{border-collapse:collapse;width:100%;min-width:0}
  /* N101 — Schutzriegel: die globalen Klassen .summe/.garten weiter unten
     setzen display:flex. Auf einer <tr> zerlegt das die Tabelle (die Zeile
     wird in eine anonyme Zelle gepackt und sprengt die erste Spalte). Die
     Zeilen heißen darum wd-summe/wd-garten — und die Zeilenrolle wird hier
     zusätzlich festgenagelt, falls je wieder eine fremde Klasse dazukommt. */
  .wd-tab tr{display:table-row}
  .wd-tab th,.wd-tab td{text-align:right;padding:9px 10px;vertical-align:top;
    border-bottom:1px solid var(--line)}
  .wd-tab thead th{position:sticky;top:0;background:var(--paper);
    font:600 10.5px var(--mono);letter-spacing:.03em;color:var(--soft);
    text-transform:uppercase;line-height:1.3;min-width:84px}
  /* Erste Spalte: schmal und fest, damit die Werte-Spalten den Platz bekommen;
     beim Querscrollen bleibt sie stehen. */
  .wd-tab th.wd-rowh,.wd-tab td.wd-rowh{text-align:left;font:600 12px var(--body);
    color:var(--ink);background:var(--sheet);line-height:1.3;
    width:124px;min-width:124px;max-width:124px;white-space:normal;
    overflow-wrap:anywhere;position:sticky;left:0;z-index:1;
    box-shadow:1px 0 0 var(--line)}
  .wd-tab thead th.wd-rowh{z-index:2;background:var(--paper)}
  .wd-tab td.wd-rowh small{display:block;color:var(--soft);font-weight:500;
    font-size:10.5px;margin-top:1px}
  .wd-m3{display:block;font:600 12px var(--mono);color:var(--ink);white-space:nowrap}
  .wd-eur{display:block;font:500 11px var(--mono);color:var(--soft);
    white-space:nowrap;margin-top:1px}
  .wd-q{display:inline-block;margin-top:4px;max-width:100%;font:600 8.5px var(--mono);
    letter-spacing:.02em;border-radius:6px;padding:2px 5px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .wd-q.gemessen{background:var(--pos-bg);color:var(--pos)}
  .wd-q.berechnet{background:var(--amber-bg);color:var(--amber)}
  .wd-tab td.wd-leerz{color:var(--soft);font:500 13px var(--body)}
  .wd-tab tr.wd-garten td{background:#F1F4F4}
  .wd-tab tr.wd-garten td.wd-rowh{background:#EDF1F0}
  .wd-tab tr.wd-summe td{border-top:2px solid var(--line);border-bottom:none;
    background:var(--paper)}
  .wd-tab tr.wd-summe td.wd-rowh{background:var(--paper);font-weight:700}
  .wd-tab tr.wd-summe .wd-m3{color:var(--teal-d);font-size:12.5px}
  .wd-fuss{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;
    margin-top:14px;font:500 12px var(--body);color:var(--soft)}
  .wd-fuss b{color:var(--ink);font-weight:700}
  .wd-kontroll{font:700 13px var(--disp);color:var(--teal-d)}
  /* N118 — die Warmwasser-Verteilungstabelle nutzt .wd-scroll als Rahmen; ohne
     eigene Regel lief sie auf schmalen Geräten aus der Karte heraus. */
  .wd-scroll{overflow-x:auto;max-width:100%;border-radius:12px;
    border:1px solid var(--line);-webkit-overflow-scrolling:touch}

  /* ---- N120: Strom im Zählerstände-Bereich -------------------------------
     Dieselbe Zeilenform wie bei Wasser und Öl (.zu-zeile). Dazu kommt je Zeile
     nur eine leise Fußleiste: welche Rolle sie spielt und der Weg, sie wieder
     zu entfernen. */
  .zu-rolle{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;
    margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
  .zu-rolle select{flex:0 1 260px;min-width:0;border:1.5px solid var(--line);
    border-radius:10px;padding:8px 10px;min-height:40px;background:var(--sheet);
    font:500 11.5px var(--body);color:var(--ink)}
  .zu-rolle select:focus{outline:none;border-color:var(--teal)}
  .zu-weg{flex:none;margin-left:auto;border:none;background:transparent;
    color:var(--neg);cursor:pointer;font:600 11.5px var(--disp);
    text-decoration:underline;text-underline-offset:3px;padding:10px 4px;
    min-height:44px}
  /* Der Abzugsblock unter dem Gesamtverbrauch — wie beim Kaltwasser. */
  .zu-abzug{margin:2px 0 6px 10px;padding-left:11px;
    border-left:2px solid var(--line)}
  .zu-zeile.unplausibel .zu-verb{color:var(--neg)}
  /* ---- N122: Verbrauch & Herkunft an der Strom-Kostenposition ------------ */
  .strompos{margin:0 0 14px}
  .strompos>label{display:block;font:600 8.5px var(--mono);letter-spacing:.05em;
    text-transform:uppercase;color:var(--soft);margin-bottom:7px}
  .sp-zeile{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .sp-zeile input{width:120px;border:1.5px solid var(--line);border-radius:10px;
    padding:9px 11px;min-height:44px;background:var(--sheet);text-align:right;
    font:600 12px var(--mono);color:var(--ink)}
  .sp-zeile input:focus{outline:none;border-color:var(--teal)}
  .sp-eh{font:600 11px var(--mono);color:var(--soft);margin-right:4px}
  .sp-fest{font:600 12px var(--mono);color:var(--ink)}
  .sp-hint{display:block;font:400 11.5px var(--body);color:var(--soft);
    line-height:1.5;margin-top:7px}
  /* Extern ist Zukauf, kein Fehler — gedeckt statt rot. Intern kommt aus der
     eigenen Anlage und ist grün. */
  .mchip.extern{color:var(--soft);background:#EDF1F0}
  .mchip.intern{color:var(--pos);background:var(--pos-bg)}
  .st-neu input[type=text]{flex:1 1 190px;width:auto;min-width:0}
  .st-neu select{flex:1 1 190px;min-width:0}

  /* ---- N142: die Stromkette an der Strom-Kostenposition ------------------
     Drei Schritte untereinander, jeder mit einer kleinen Tabelle: was
     hineingeht und was herauskommt. Rahmen und Scroll-Mechanik wie in der
     Wasser-Detailtabelle (.wd-scroll/.wd-tab), damit beide gleich lesen. */
  .sk-box{margin:0 0 14px}
  .sk-schritt{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .sk-schritt:first-child{margin-top:0;padding-top:0;border-top:none}
  .sk-kopf{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;
    margin-bottom:8px}
  .sk-nr{flex:none;display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;border-radius:50%;background:var(--teal-l);
    color:var(--teal-d);font:700 10.5px var(--mono);align-self:center}
  .sk-t{font:700 12.5px var(--disp);color:var(--ink)}
  .sk-h{font:500 10.5px var(--mono);color:var(--soft)}
  .sk-quelle{display:block;font:400 11.5px var(--body);color:var(--soft);
    line-height:1.5;margin:8px 0 0}
  .sk-quelle b{color:var(--ink);font-weight:600}
  /* N142 — die Herkunft je Block: aus welcher Position der Betrag kommt und
     welcher Beleg daran hängt. Untereinander, damit auch lange Dateinamen auf
     dem iPhone lesbar bleiben statt in eine Zeile gequetscht zu werden. */
  .sk-herk{list-style:none;margin:9px 0 0;padding:0;display:flex;
    flex-direction:column;gap:4px}
  .sk-herk li{font:400 11.5px var(--body);color:var(--soft);line-height:1.45;
    padding-left:11px;position:relative;overflow-wrap:anywhere}
  .sk-herk li::before{content:'';position:absolute;left:0;top:.55em;width:4px;
    height:4px;border-radius:50%;background:var(--teal-l)}
  .sk-herk b{color:var(--ink);font-weight:600}
  /* Ein noch fehlender Betrag — ein Strich statt einer Null, in Bernstein. */
  .sk-offen{color:var(--amber)}
  /* N173 — die zwei Netzsätze nebeneinander: Verteilung (Mieter) und geeicht
     (E-Auto). Zwei ruhige Kärtchen, darunter ein Satz, warum sie sich
     unterscheiden. Auf dem iPhone brechen sie untereinander um. */
  .sk-saetze{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
  .sk-satz{flex:1 1 130px;min-width:0;display:flex;flex-direction:column;
    gap:2px;padding:8px 11px;border-radius:10px;background:var(--paper)}
  .sk-satz b{font:600 14px var(--mono);color:var(--ink)}
  .sk-satz small{font:400 11px var(--body);color:var(--soft);line-height:1.4}
  .sk-satz-hinweis{flex:1 1 100%;font:400 11.5px var(--body);color:var(--soft);
    line-height:1.5;margin-top:2px}
  .sk-felder{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .sk-feld{flex:1 1 74px;min-width:0;display:flex;flex-direction:column;gap:4px}
  .sk-feld label{font:600 8.5px var(--mono);letter-spacing:.05em;
    text-transform:uppercase;color:var(--soft)}
  .sk-feld input{width:100%;min-width:0;border:1.5px solid var(--line);
    border-radius:10px;padding:9px 10px;min-height:44px;background:var(--sheet);
    text-align:right;font:600 12px var(--mono);color:var(--ink)}
  .sk-feld input:focus{outline:none;border-color:var(--teal)}
  .sk-feld.fest span{display:block;padding:9px 10px;min-height:44px;
    border-radius:10px;background:var(--paper);text-align:right;
    font:600 12px var(--mono);color:var(--ink)}
  /* Die Kettentabellen tragen kurze Zeilenköpfe („Netz", „Akku") — mit der
     schmaleren ersten Spalte passen Menge UND Kosten auf den iPhone-Schirm,
     ohne dass die wichtigste Zahl hinter dem Rand verschwindet. */
  .sk-tab th,.sk-tab td{padding-left:8px;padding-right:8px}
  .sk-tab th.wd-rowh,.sk-tab td.wd-rowh{width:96px;min-width:96px;max-width:96px}
  .sk-tab thead th{min-width:72px}
  .sk-kontrolle{display:flex;flex-wrap:wrap;justify-content:space-between;
    gap:6px 16px;margin-top:12px;padding-top:10px;border-top:2px solid var(--line);
    font:500 12px var(--body);color:var(--soft)}
  .sk-kontrolle b{color:var(--ink);font-weight:700}
  .sk-kontrolle .ok{color:var(--pos)}
  .sk-kontrolle .fehl{color:var(--neg)}

  /* ---- N191/N192: grafisch strukturierte Stromkette ---------------------- */
  /* Der ct/kWh-Wert als kleiner Chip oben rechts im Kopf statt als volle Zeile. */
  .sk-satzchip{margin-left:auto;flex:none;font:600 10px var(--mono);
    color:var(--ink);background:var(--paper);border-radius:999px;padding:5px 10px;
    white-space:nowrap}
  /* Balken (Höhe ∝ Prozent) links, Tabelle rechts — auf dem iPhone bricht die
     Tabelle unter die Balken um. */
  .sk-split{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px}
  .sk-splittab{flex:1 1 230px;min-width:0}
  .sk-bars{flex:0 0 auto;display:flex;align-items:flex-end;gap:9px;
    padding:10px 12px 9px;background:var(--paper);border-radius:12px;
    position:relative}
  /* N208 — sind alle drei Anteile gesetzt, spannt der Balken über die volle
     Breite (statt schmaler Kasten links mit Leerfläche daneben); die Tabelle
     steht dann darunter. Die Säulen verteilen sich gleichmäßig, der Fluss-Pfeil
     entfällt (der Fluss läuft nun sichtbar nach unten in die Tabelle). */
  .sk-bars.breit{flex:1 1 100%;margin-bottom:10px;justify-content:space-around;
    align-items:flex-end;padding:9px 16px 8px}
  .sk-bars.breit .sk-bars-pfeil{display:none}
  .sk-bars.breit .sk-saeule-bar{width:26px}
  .sk-saeule{display:flex;flex-direction:column;align-items:center;
    justify-content:flex-end;gap:3px}
  .sk-saeule-wert{font:600 9.5px var(--mono);color:var(--soft)}
  .sk-saeule-bar{width:18px;border-radius:5px 5px 0 0;min-height:8px}
  .sk-saeule-name{font:600 8px var(--mono);letter-spacing:.04em;
    text-transform:uppercase;color:var(--soft)}
  .sk-bars-pfeil{align-self:center;font-size:17px;color:var(--teal);
    line-height:1;padding-left:1px}
  /* Die Zeilenköpfe tragen die Balkenfarbe — so liest sich, welcher Balken zu
     welcher Zeile gehört. */
  .sk-rh-netz{box-shadow:inset 3px 0 0 var(--amber)}
  .sk-rh-pv{box-shadow:inset 3px 0 0 var(--teal)}
  .sk-rh-akku{box-shadow:inset 3px 0 0 var(--pos)}
  /* Drei Bubbles statt eines grauen Textblocks. */
  .sk-bubbles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:8px;margin-top:12px}
  .sk-bubble{background:var(--paper);border-radius:12px;padding:10px 12px;
    font:400 11.5px var(--body);color:var(--ink);line-height:1.5}
  .sk-bubble b{font-weight:600}
  .sk-bubble-k{display:block;font:600 8.5px var(--mono);letter-spacing:.05em;
    text-transform:uppercase;color:var(--soft);margin-bottom:4px}
  .sk-bubble-warn{display:block;color:var(--amber);margin-top:6px;
    font:500 11px var(--body);line-height:1.45}
  /* Aufklappbare Info-Box (Datenherkunft & €-Herleitung) — wie bei der
     E-Tankstelle, kein Framework. */
  .sk-info{margin-top:8px}
  .sk-info>summary{list-style:none;cursor:pointer;font:600 10px var(--mono);
    color:var(--teal-d);display:inline-flex;align-items:center;gap:5px;
    min-height:32px}
  .sk-info>summary::-webkit-details-marker{display:none}
  .sk-info>summary::before{content:'i';display:inline-flex;align-items:center;
    justify-content:center;width:15px;height:15px;border-radius:50%;
    background:var(--teal-l);color:var(--teal-d);font:700 9px var(--mono)}
  .sk-info[open]>summary{margin-bottom:2px}
  .sk-info .sk-herk{margin-top:6px}
  /* N192 — die Netz-Belege ansehen/herausnehmen. */
  .sk-belege{margin-top:12px;background:var(--paper);border-radius:12px;
    padding:11px 12px}
  .sk-belege-k{display:block;font:600 8.5px var(--mono);letter-spacing:.05em;
    text-transform:uppercase;color:var(--soft)}
  .sk-belege-txt{display:block;font:400 11.5px var(--body);color:var(--soft);
    line-height:1.5;margin:3px 0 9px}
  .sk-belege .belege{margin-top:0}
  /* N192 — die geeichte Rechnungsmenge: ruhige Info-Box mit Eingabe, kein
     Dauerbanner. */
  .sk-geeicht{margin-top:10px;background:var(--paper);border-radius:12px;
    padding:11px 12px;border-left:3px solid var(--amber-li)}
  .sk-geeicht>summary{list-style:none;cursor:pointer;display:flex;
    align-items:center;font:600 11.5px var(--body);color:var(--ink);
    line-height:1.4;min-height:28px}
  .sk-geeicht>summary::-webkit-details-marker{display:none}
  .sk-geeicht-i{flex:none;display:inline-flex;align-items:center;
    justify-content:center;width:16px;height:16px;border-radius:50%;
    background:var(--amber-li);color:var(--amber);font:700 10px var(--mono);
    margin-right:8px}
  .sk-geeicht p{font:400 11.5px var(--body);color:var(--soft);line-height:1.55;
    margin:9px 0 0}
  .sk-geeicht p b{color:var(--ink);font-weight:600}
  .sk-geeicht-eingabe{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .sk-geeicht-eingabe input{flex:1 1 130px;min-width:0;border:1.5px solid var(--line);
    border-radius:10px;padding:10px 11px;min-height:44px;background:var(--sheet);
    font:600 12px var(--mono);color:var(--ink)}
  .sk-geeicht-eingabe input:focus{outline:none;border-color:var(--teal)}
  .sk-geeicht-eingabe button{flex:none;min-height:44px;padding:0 16px;border:none;
    border-radius:10px;background:var(--teal);color:#fff;cursor:pointer;
    font:600 12px var(--disp)}
  .sk-geeicht-eingabe button:hover{background:var(--teal-d)}
  /* N191 — „was übrig ist" vor der Verteilungstabelle: gekipptes Etikett + Zahl. */
  .sk-rest{display:flex;align-items:stretch;gap:11px;margin:2px 0 11px;
    background:var(--teal-l);border-radius:12px;padding:10px 13px}
  .sk-rest-label{flex:none;writing-mode:vertical-rl;transform:rotate(180deg);
    font:600 8.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;
    color:var(--teal-d);text-align:center}
  .sk-rest-zahl{flex:1;min-width:0;display:flex;flex-direction:column;
    justify-content:center}
  .sk-rest-zahl b{font:600 20px var(--disp);color:var(--ink);line-height:1.1}
  .sk-rest-zahl small{display:block;font:400 11px var(--body);color:var(--soft);
    line-height:1.4;margin-top:3px}
  @media(max-width:560px){ .sk-bars-pfeil{transform:rotate(90deg);
    align-self:center} }

  .pdflink{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
    background:#F1F4F4;color:var(--ink);border-radius:10px;padding:9px 12px;
    font:600 11.5px var(--body);min-height:40px;margin-top:10px}
  .pdflink:hover{background:var(--teal-l);color:var(--teal-d)}
  .wiederauf{margin-top:12px;border:none;background:transparent;color:var(--soft);
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;
    font:600 12px var(--disp);padding:10px 2px;min-height:44px}
  .wiederauf:hover{color:var(--ink)}
  .belege{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
  .belege a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    background:#F1F4F4;color:var(--ink);border-radius:9px;padding:8px 11px;
    font:500 11.5px var(--body);min-height:36px}
  .belege a:hover{background:var(--teal-l);color:var(--teal-d)}
  .belege .kein{font:400 12px var(--body);color:var(--soft);line-height:1.45}
  /* N95 — Beleg + „herausnehmen" gehören zusammen (ein Chip mit ×). */
  .beleg-zeile{display:inline-flex;align-items:center;gap:2px}
  .beleg-weg{border:none;background:#F1F4F4;color:var(--neg);cursor:pointer;
    width:36px;height:36px;border-radius:9px;font:700 16px var(--body);flex:none}
  .beleg-weg:hover{background:#F6E7E2}
  /* N8 — genaues Belegdatum an der Beleg-Zeile: dezentes Mono-Etikett in
     gedeckter Farbe, damit man sieht, in welche (vermietete) Zeit die Position
     fiel — rein informativ, ändert nichts an der anteiligen Verteilung. */
  .belege .beleg-datum{margin-left:2px;font:600 10.5px var(--mono);
    color:var(--soft);white-space:nowrap}
  /* Anhängen aus dem Bestand — leise und gestrichelt, im aufgeklappten Bereich. */
  .anh-verwalt{margin-top:14px}
  .anh-anbau{display:inline-flex;align-items:center;gap:7px;cursor:pointer;
             border:1.5px dashed var(--line);background:transparent;
             color:var(--soft);border-radius:11px;padding:10px 13px;
             font:600 12px var(--disp);min-height:44px}
  .anh-anbau:hover{border-color:var(--teal);color:var(--teal-d);background:var(--teal-l)}
  .anh-anbau svg{width:15px;height:15px;flex:none}
  .anh-hint{display:block;font:400 11px var(--body);color:var(--soft);
            line-height:1.45;margin-top:8px}
  /* Auswahl-Dialog der kostenfreien Belege aus dem Bestand. */
  .ahdlg .ahliste{max-height:min(50dvh,360px);overflow:auto;margin:6px 0 14px}
  .ahdlg .ahz{display:flex;align-items:center;gap:11px;width:100%;cursor:pointer;
              border:none;background:var(--sheet);border-radius:12px;
              padding:12px 13px;margin-bottom:8px;min-height:52px;text-align:left;
              font-family:var(--body);color:var(--ink);
              box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .ahdlg .ahz:hover{background:var(--teal-l)}
  .ahdlg .ahz svg{width:18px;height:18px;flex:none;color:var(--soft)}
  .ahdlg .ahn{flex:1;min-width:0;font:600 13px var(--body);overflow-wrap:anywhere}
  .ahdlg .ahsub{display:block;font:400 10.5px var(--mono);color:var(--soft);
                margin-top:2px}
  .ahdlg .ahleer{font:400 12.5px var(--body);color:var(--soft);line-height:1.55;
                 margin:4px 0 14px}
  /* Woraus die Summe entstanden ist (CLXXXII) — eine ruhige Zeile über den
     Belegen, damit vier Abschlagsrechnungen nicht als eine Zahl dastehen. */
  .zsumme{font:500 11.5px var(--mono);color:var(--teal-d);background:var(--teal-l);
          border-radius:9px;padding:8px 10px;margin-top:8px;line-height:1.5}
  /* ---- CXCIV: Sonderposten nur für eine Einheit ---- */
  .sonder .erklaer{display:block;font:400 11.5px var(--body);color:var(--soft);
    line-height:1.5;margin:0 0 12px}
  .sonder .starten{border:1.5px dashed var(--line);background:transparent;
    color:var(--teal-d);border-radius:12px;padding:12px 16px;width:100%;
    font:600 13px var(--disp);cursor:pointer;min-height:48px}
  .sonder .starten:hover{border-color:var(--teal);background:var(--teal-l)}
  .sonder .feldlabel{display:block;font:600 10px var(--mono);letter-spacing:.07em;
    text-transform:uppercase;color:var(--soft);margin:14px 0 8px}
  .sonder .einheiten{display:flex;flex-wrap:wrap;gap:8px}
  .ewahl{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;
    min-height:44px;padding:8px 15px;border:none;border-radius:999px;
    background:var(--paper);color:inherit;cursor:pointer;text-align:left;
    box-shadow:inset 0 1px 2px rgba(22,38,44,.05)}
  .ewahl .ename{font:600 13px var(--body);line-height:1.2}
  .ewahl .epartei{font:500 10px var(--mono);color:var(--soft);white-space:nowrap}
  .ewahl.an{background:var(--teal);box-shadow:none}
  .ewahl.an .ename{color:#fff}
  .ewahl.an .epartei{color:rgba(255,255,255,.8)}
  .sonder .abbrechen{margin-top:10px;border:none;background:transparent;
    color:var(--soft);text-decoration:underline;text-underline-offset:3px;
    cursor:pointer;font:600 12px var(--disp);padding:10px 2px;min-height:44px}
  .sonder .abbrechen:hover{color:var(--ink)}

  .karte{background:var(--sheet);border-radius:16px;padding:16px;margin-bottom:12px;
         box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .karte h3{font:600 13px var(--disp);margin:0 0 12px;
            display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .marke{font:600 9.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;
         border-radius:7px;padding:4px 7px;background:#EDF1F0;color:var(--soft)}
  .marke.gut{background:var(--teal-l);color:var(--teal-d)}
  .marke.post{background:var(--amber-bg);color:var(--amber)}
  /* An wen die Abrechnung geht — mehrere Adressen stehen alle da, sonst
     bliebe offen, wer sie außer dem Vertragspartner noch bekommt. */
  .wemgeht{font:400 11.5px var(--body);color:var(--soft);line-height:1.45;
           margin:-6px 0 12px;overflow-wrap:anywhere}
  .wemgeht.fehlt{color:var(--amber)}
  .summe{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
         font:500 13.5px var(--body);border-top:1px solid var(--line)}
  .summe:first-of-type{border-top:none}
  .summe b{font-family:var(--mono)}
  .summe.gesamt{font-weight:700;border-top:2px solid var(--line)}
  .summe .pos{color:var(--pos)} .summe .neg{color:var(--neg)}

  /* N210 — eine Zeile auf iOS: nowrap + kompakte Pillen; der Konfig-Knopf rechts
     ist icon-only (⚙), sonst sprang „Positionen konfigurieren" in die 2. Zeile. */
  .sortleiste{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;margin-bottom:10px}
  .sortleiste span{font:600 10px var(--mono);letter-spacing:.06em;
                   text-transform:uppercase;color:var(--soft);margin-right:1px;
                   white-space:nowrap;flex:none}
  .sortleiste button{border:none;background:var(--sheet);color:var(--soft);
    border-radius:999px;padding:8px 12px;font:600 11.5px var(--disp);cursor:pointer;
    min-height:38px;white-space:nowrap;flex:none;box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .sortleiste button[aria-pressed=true]{background:var(--teal-l);color:var(--teal-d)}
  /* N189 — Knopf rechts in der Sortierleiste öffnet den Konfig-Modus inline. */
  .sortleiste .pos-konfig{margin-left:auto;display:inline-flex;align-items:center;
    justify-content:center;padding:8px;min-width:40px;flex:none;
    color:var(--teal-d);background:var(--teal-l)}
  .sortleiste .pos-konfig svg{width:17px;height:17px}

  /* ---- N189: Konfig-Modus (inline) ---------------------------------------- */
  .konf-leiste{display:flex;margin-bottom:12px}
  .konf-fertig{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;background:var(--teal);color:#fff;border-radius:13px;padding:13px 16px;
    font:600 13px var(--disp);letter-spacing:-.01em;cursor:pointer;min-height:48px;
    box-shadow:0 2px 6px rgba(15,110,92,.18)}
  .konf-fertig:hover{background:var(--teal-d)}
  .konf-hinweis{font:400 12.5px var(--body);color:var(--soft);line-height:1.55;
    background:var(--teal-l);border-radius:12px;padding:12px 14px;margin-bottom:18px}
  .konf-hinweis b{color:var(--teal-d);font-weight:600}
  .konf-zeile{margin-bottom:8px}
  .konf-zeile .kopf{padding:11px 14px;gap:10px;flex-wrap:wrap}
  .konf-zeile.verborgen{opacity:.62}
  .konf-zeile.fest{background:linear-gradient(100deg,#EEF2F1 0%,var(--sheet) 60%)}
  .konf-fest-tag{flex:none;font:600 10px var(--mono);letter-spacing:.06em;
    text-transform:uppercase;color:var(--soft);background:#EDF1F0;border-radius:999px;
    padding:6px 11px;white-space:nowrap}
  .konf-steuer{display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;margin-left:auto}
  /* Anzeige-Schalter */
  .konf-sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;position:relative;
    min-height:44px}
  .konf-sw input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
  .konf-swl{font:600 11px var(--mono);letter-spacing:.04em;color:var(--soft);
    min-width:62px}
  .pk-sw{flex:none;width:42px;height:24px;border-radius:999px;background:var(--line);
    position:relative;transition:background .15s}
  .pk-sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;
    border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .konf-sw input:checked ~ .pk-sw{background:var(--teal)}
  .konf-sw input:checked ~ .pk-sw::after{transform:translateX(18px)}
  .konf-sw input:checked ~ .konf-swl{color:var(--teal-d)}
  /* Pflicht/optional — segmentierter Umschalter */
  .konf-seg{flex:none;display:inline-flex;background:#EDF1F0;border-radius:11px;padding:3px}
  .konf-opt{border:none;background:transparent;color:var(--soft);border-radius:9px;
    padding:9px 14px;font:600 11.5px var(--disp);cursor:pointer;min-height:40px;white-space:nowrap}
  .konf-opt.an{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(22,38,44,.12)}
  .konf-opt[data-optional="0"].an{color:var(--neg)}
  .konf-opt[data-optional="1"].an{color:var(--teal-d)}
  .konf-opt:disabled{opacity:.4;cursor:not-allowed}
  @media(max-width:520px){
    .konf-steuer{width:100%;margin-left:34px;justify-content:space-between}
  }

  .abschluss{border-radius:16px;padding:18px;margin:16px 0 4px}
  .abschluss .at{font:700 16px var(--disp);letter-spacing:-.015em;margin-bottom:6px}
  .abschluss p{font:400 13px var(--body);margin:0 0 14px;line-height:1.5}
  .abschluss.bereit{background:var(--pos-bg);color:var(--pos)}
  .abschluss.offen{background:var(--sheet);color:var(--ink);
                   box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .abschluss.offen p{color:var(--soft)}
  .abschluss.fertig{background:#EEF2F1;color:var(--soft)}
  .abschluss.fertig p{color:var(--soft);margin-bottom:0}
  .uebergehen{display:flex;align-items:center;gap:10px;margin-bottom:14px;
              font:500 13px var(--body);color:var(--ink);cursor:pointer;min-height:44px}
  .uebergehen input{width:20px;height:20px;flex:none}
  .losbutton{width:100%;border:none;border-radius:12px;padding:15px;cursor:pointer;
    font:600 15px var(--disp);background:var(--pos);color:#fff;min-height:48px;
    box-shadow:0 6px 16px -8px rgba(46,125,79,.7)}
  .losbutton:hover{background:#276b44}
  .losbutton[disabled]{background:#C2CCCB;color:#fff;box-shadow:none;cursor:default}

  /* Versandplan vor dem Abschluss: eine Zeile je Partei, der Leerstand ruhig
     am Ende. Er ist kein Empfänger, sondern der Anteil des Eigentümers. */
  .vdlg .vliste{max-height:min(44dvh,330px);overflow:auto;margin:0 0 16px;
                background:var(--sheet);border-radius:12px}
  .vdlg .vz{display:flex;align-items:flex-start;gap:10px;padding:12px 13px}
  .vdlg .vz + .vz{border-top:1px solid var(--line)}
  .vdlg .vn{flex:1;min-width:0;font:600 13px var(--body);color:var(--ink);
            overflow-wrap:anywhere}
