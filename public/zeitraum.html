  /* N189 — Knopf rechts in der Sortierleiste öffnet den Konfig-Modus inline. */
  .sortleiste .pos-konfig{margin-left:auto;display:inline-flex;align-items:center;
    justify-content:center;padding:8px;min-width:40px;flex:none;
    color:var(--teal-d);background:var(--teal-l)}
  .sortleiste .pos-konfig svg{width:17px;height:17px}

  /* ---- N189: Konfig-Modus (inline) ---------------------------------------- */
  .konf-leiste{display:flex;margin-bottom:12px}
  .konf-fertig{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;background:var(--teal);color:#fff;border-radius:13px;padding:13px 16px;
    font:600 13px var(--disp);letter-spacing:-.01em;cursor:pointer;min-height:48px;
    box-shadow:0 2px 6px rgba(15,110,92,.18)}
  .konf-fertig:hover{background:var(--teal-d)}
  .konf-hinweis{font:400 12.5px var(--body);color:var(--soft);line-height:1.55;
    background:var(--teal-l);border-radius:12px;padding:12px 14px;margin-bottom:18px}
  .konf-hinweis b{color:var(--teal-d);font-weight:600}
  .konf-zeile{margin-bottom:8px}
  .konf-zeile .kopf{padding:11px 14px;gap:10px;flex-wrap:wrap}
  .konf-zeile.verborgen{opacity:.62}
  .konf-zeile.fest{background:linear-gradient(100deg,#EEF2F1 0%,var(--sheet) 60%)}
  .konf-fest-tag{flex:none;font:600 10px var(--mono);letter-spacing:.06em;
    text-transform:uppercase;color:var(--soft);background:#EDF1F0;border-radius:999px;
    padding:6px 11px;white-space:nowrap}
  .konf-steuer{display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;margin-left:auto}
  /* Anzeige-Schalter */
  .konf-sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;position:relative;
    min-height:44px}
  .konf-sw input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
  .konf-swl{font:600 11px var(--mono);letter-spacing:.04em;color:var(--soft);
    min-width:62px}
  .pk-sw{flex:none;width:42px;height:24px;border-radius:999px;background:var(--line);
    position:relative;transition:background .15s}
  .pk-sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;
    border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .konf-sw input:checked ~ .pk-sw{background:var(--teal)}
  .konf-sw input:checked ~ .pk-sw::after{transform:translateX(18px)}
  .konf-sw input:checked ~ .konf-swl{color:var(--teal-d)}
  /* Pflicht/optional — segmentierter Umschalter */
  .konf-seg{flex:none;display:inline-flex;background:#EDF1F0;border-radius:11px;padding:3px}
  .konf-opt{border:none;background:transparent;color:var(--soft);border-radius:9px;
    padding:9px 14px;font:600 11.5px var(--disp);cursor:pointer;min-height:40px;white-space:nowrap}
  .konf-opt.an{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(22,38,44,.12)}
  .konf-opt[data-optional="0"].an{color:var(--neg)}
  /* N351 — § 35a-Schalter je Kostenart: aus (grau umrandet) / an (amber). */
  .konf-s35{flex:none;border:1.5px solid var(--line);background:var(--sheet);
    color:var(--soft);border-radius:9px;padding:7px 10px;min-height:38px;
    font:600 11px var(--mono);letter-spacing:.03em;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .konf-s35.an{border-color:var(--amber);background:var(--amber-bg);
    color:var(--amber)}
  .konf-opt[data-optional="1"].an{color:var(--teal-d)}
  .konf-opt:disabled{opacity:.4;cursor:not-allowed}
  @media(max-width:520px){
    .konf-steuer{width:100%;margin-left:34px;justify-content:space-between}
  }

  .abschluss{border-radius:16px;padding:18px;margin:16px 0 4px}
  .abschluss .at{font:700 16px var(--disp);letter-spacing:-.015em;margin-bottom:6px}
  .abschluss p{font:400 13px var(--body);margin:0 0 14px;line-height:1.5}
  .abschluss.bereit{background:var(--pos-bg);color:var(--pos)}
  .abschluss.offen{background:var(--sheet);color:var(--ink);
                   box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .abschluss.offen p{color:var(--soft)}
  .abschluss.fertig{background:#EEF2F1;color:var(--soft)}
  .abschluss.fertig p{color:var(--soft);margin-bottom:0}
  .uebergehen{display:flex;align-items:center;gap:10px;margin-bottom:14px;
              font:500 13px var(--body);color:var(--ink);cursor:pointer;min-height:44px}
  .uebergehen input{width:20px;height:20px;flex:none}
  .losbutton{width:100%;border:none;border-radius:12px;padding:15px;cursor:pointer;
    font:600 15px var(--disp);background:var(--pos);color:#fff;min-height:48px;
    box-shadow:0 6px 16px -8px rgba(46,125,79,.7)}
  .losbutton:hover{background:#276b44}
  .losbutton[disabled]{background:#C2CCCB;color:#fff;box-shadow:none;cursor:default}

  /* Versandplan vor dem Abschluss: eine Zeile je Partei, der Leerstand ruhig
     am Ende. Er ist kein Empfänger, sondern der Anteil des Eigentümers. */
  .vdlg .vliste{max-height:min(44dvh,330px);overflow:auto;margin:0 0 16px;
                background:var(--sheet);border-radius:12px}
  .vdlg .vz{display:flex;align-items:flex-start;gap:10px;padding:12px 13px}
  .vdlg .vz + .vz{border-top:1px solid var(--line)}
  .vdlg .vn{flex:1;min-width:0;font:600 13px var(--body);color:var(--ink);
            overflow-wrap:anywhere}
  .vdlg .vs{display:block;font:400 11px var(--body);color:var(--soft);
            margin-top:3px;line-height:1.45}
  .vdlg .vm{flex:none;margin-top:1px}

  /* ================= N280 — WEG-Abrechnung ================================
     Der Schalter steht auf jedem Zeitraum, schmal wie eine Zeile. Ist er an,
     tritt die Dateiuebernahme an die Stelle der ganzen Checkliste. */
  .weg-schalter{display:flex;align-items:center;gap:12px;background:var(--sheet);
    border-radius:16px;padding:12px 14px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(22,38,44,.07)}
  .weg-schalter.an{background:var(--teal-l);
    box-shadow:inset 3px 0 0 var(--teal),0 1px 3px rgba(22,38,44,.07)}
  .weg-schalter .ws-ikon{flex:none;width:26px;height:26px;color:var(--teal-d);
    display:inline-flex;align-items:center;justify-content:center}
  .weg-schalter .ws-ikon svg{width:24px;height:24px;display:block}
  .weg-schalter .ws-t{flex:1;min-width:0;font:600 13px var(--disp);
    letter-spacing:-.01em;color:var(--ink)}
  .weg-schalter .ws-s{display:block;font:400 11.5px var(--body);color:var(--soft);
    line-height:1.4;margin-top:3px}
  .ws-kipp{flex:none;width:52px;height:30px;border:none;border-radius:15px;
    background:#C7D2D0;cursor:pointer;position:relative;padding:0;
    transition:background .16s}
  .ws-kipp[aria-checked="true"]{background:var(--teal)}
  .ws-kipp[disabled]{opacity:.5;cursor:default}
  .ws-kipp i{position:absolute;top:3px;left:3px;width:24px;height:24px;
    border-radius:50%;background:#fff;transition:transform .16s;
    box-shadow:0 1px 3px rgba(22,38,44,.35)}
  .ws-kipp[aria-checked="true"] i{transform:translateX(22px)}

  .weg-karte .weg-kopf{display:flex;align-items:baseline;gap:10px;
    margin-bottom:4px}
  .weg-karte .weg-kopf h3{margin:0;flex:1;min-width:0}
  .weg-karte .weg-summe{flex:none;font:700 15px var(--mono);color:var(--ink)}
  .weg-plus{flex:none;width:36px;height:36px;border:1.5px solid var(--teal);
    border-radius:11px;background:transparent;color:var(--teal);cursor:pointer;
    font:400 22px/1 var(--body);align-self:center}
  .weg-plus:hover{background:var(--teal-l)}
  .weg-karte .erklaer{display:block;font:400 11.5px var(--body);color:var(--soft);
    line-height:1.45;margin:0 0 12px}
  .weg-leer{font:400 12.5px var(--body);color:var(--soft);line-height:1.5;
    background:var(--paper);border-radius:11px;padding:11px 13px}

  .weg-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  .weg-chip{font:500 11px var(--mono);color:var(--teal-d);background:var(--teal-l);
    border-radius:8px;padding:4px 8px;max-width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}

  .weg-datei{display:flex;flex-direction:column;gap:3px;background:var(--paper);
    border-radius:11px;padding:10px 12px;margin:0 0 12px}
  .weg-datei a{display:flex;align-items:center;gap:8px;color:var(--teal-d);
    font:600 12.5px var(--body);text-decoration:none;min-height:24px}
  .weg-datei a svg{flex:none;width:18px;height:18px}
  .weg-datei a span{min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .weg-datei .wd-ort{font:400 10.5px var(--mono);color:var(--soft);
    word-break:break-all;line-height:1.4}

  .weg-los{display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;min-height:52px;border:none;border-radius:13px;background:var(--teal);
    color:#fff;cursor:pointer;font:600 14px var(--body);margin:2px 0 8px;
    padding:0 14px}
  .weg-los:hover{background:var(--teal-d)}
  .weg-los svg{flex:none;width:20px;height:20px}

  /* Die Positionsliste als Balken: die Groesse der Zahl wird sichtbar. */
  .weg-liste{display:flex;flex-direction:column;gap:7px}
  .weg-zeile{display:flex;align-items:center;gap:10px}
  /* N351 — § 35a-Kennzeichen an der WEG-Zeile, für die Steuererklärung. */
  .wz-s35{display:inline-block;font:600 9px var(--mono);letter-spacing:.03em;
    color:var(--amber);background:var(--amber-bg);border-radius:6px;
    padding:2px 6px;vertical-align:middle}
  .weg-saldo .wsz.s35 span{color:var(--amber)}
  .weg-zeile .wz-n{flex:1 1 40%;min-width:0;font:500 12.5px var(--body);
    color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .weg-zeile .wz-bahn{flex:1 1 30%;min-width:34px;height:8px;border-radius:4px;
    background:var(--paper);overflow:hidden}
  .weg-zeile .wz-bahn i{display:block;height:100%;border-radius:4px;
    background:var(--teal)}
  .weg-zeile .wz-v{flex:none;font:600 12.5px var(--mono);color:var(--ink);
    text-align:right;min-width:74px}
  .weg-liste.aus .wz-bahn i{background:#A9B6B4}
  .weg-liste.aus .wz-n,.weg-liste.aus .wz-v{color:var(--soft)}

  .weg-nicht{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
  .weg-nicht .wn-kopf{display:flex;align-items:baseline;gap:10px;
    font:600 12px var(--disp);color:var(--soft)}
  .weg-nicht .wn-kopf span:first-child{flex:1;min-width:0}
  .weg-nicht .wn-v{flex:none;font:600 13px var(--mono)}
  .weg-nicht .wn-s{margin:4px 0 10px;font:400 11.5px var(--body);color:var(--soft);
    line-height:1.45}

  .weg-warn{display:flex;gap:9px;background:var(--amber-bg);border-radius:11px;
    padding:10px 12px;margin:0 0 12px;font:400 12px var(--body);color:var(--ink);
    line-height:1.5}
  .weg-warn .ww-z{flex:none;color:var(--amber);font-weight:700}
  .weg-warn.leise{background:var(--paper);color:var(--soft)}
  .weg-warn.leise .ww-z{color:var(--soft)}
  .weg-warn b{color:var(--ink)}

  /* Trennstrich zwischen den Abschnitten, nicht hinter dem letzten: `:last-of-type`
     zählt Elementtypen, nicht Klassen — mit der Summenzeile darunter (auch ein
     div) hätte es nie gegriffen und zwei Linien nebeneinander gezogen. */
  .weg-vz{display:flex;align-items:center;gap:10px;padding:9px 0;flex-wrap:wrap}
  .weg-vz + .weg-vz{border-top:1px solid var(--line)}
  .weg-vz .wv-n{flex:1 1 40%;min-width:0;font:600 12.5px var(--body);color:var(--ink)}
  .weg-vz .wv-s{display:block;font:400 10.5px var(--mono);color:var(--soft);
    margin-top:2px}
  .weg-vz .wv-r{flex:none;font:400 11.5px var(--mono);color:var(--soft)}
  .weg-vz .wv-v{flex:none;min-width:82px;text-align:right;
    font:600 13px var(--mono);color:var(--ink)}
  .weg-vz .wv-k{flex:none;display:flex;gap:4px}
  .wv-b{min-height:36px;padding:0 11px;border:1.5px solid var(--line);
    border-radius:9px;background:transparent;color:var(--soft);cursor:pointer;
    font:600 11.5px var(--body)}
  .wv-b:hover{border-color:var(--teal);color:var(--teal)}
  .wv-x{width:36px;height:36px;border:1.5px solid var(--line);border-radius:9px;
    background:transparent;color:var(--soft);cursor:pointer;font:400 17px/1 var(--body)}
  .wv-x:hover{border-color:var(--neg);color:var(--neg)}
  .weg-vzsumme{display:flex;justify-content:space-between;align-items:baseline;
    gap:10px;margin-top:12px;padding-top:11px;border-top:2px solid var(--line);
    font:600 12.5px var(--body);color:var(--soft)}
  .weg-vzsumme span:last-child{font:700 15px var(--mono);color:var(--ink)}

  /* Der Saldo — deutlich abgesetzt, Doppelstrich vor der Endzeile. */
  .weg-saldo{background:var(--sheet);border-radius:16px;padding:16px;
    margin-bottom:12px;box-shadow:0 1px 3px rgba(22,38,44,.07)}
  .weg-saldo .wsz{display:flex;justify-content:space-between;align-items:baseline;
    gap:12px;padding:5px 0;font:500 12.5px var(--body);color:var(--soft)}
  .weg-saldo .wsz span:last-child{font:600 13px var(--mono);color:var(--ink)}
  .weg-saldo .wsz.gross{margin-top:9px;padding-top:12px;
    border-top:3px double var(--ink);font:700 14px var(--disp);color:var(--ink)}
  .weg-saldo .wsz.gross span:last-child{font:700 21px var(--mono)}
  .weg-saldo.neg .wsz.gross span:last-child{color:var(--neg)}
  .weg-saldo.pos .wsz.gross span:last-child{color:var(--pos)}

  /* Die Bestaetigung der gelesenen Abrechnung: eine Tabelle, nicht editierbar. */
  dialog.immo-dlg.weg-best-dlg{max-width:min(680px,calc(100% - 24px))}
  .weg-best-dlg .wb-fuer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--paper);border-radius:11px;padding:9px 12px;margin:0 0 10px;
    font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;
    color:var(--soft);flex:none}
  .weg-best-dlg .wb-einheit{flex:1;min-width:140px;min-height:42px;
    border:1.5px solid #C3DAD2;border-radius:10px;background:var(--sheet);
    padding:0 10px;font:500 13px var(--body);color:var(--ink);
    text-transform:none;letter-spacing:0}
  .weg-best-dlg .wb-eintext{flex:1;min-width:0;font:600 13px var(--body);
    color:var(--ink);text-transform:none;letter-spacing:0}
  .weg-best-dlg .wb-eintext.warn{color:var(--neg)}
  /* EIN Rollbereich für die ganze Abrechnung — Positionen und der nicht
     umlagefähige Block gehören zusammen. Rollte nur die Positionsliste, blieb
     auf dem Telefon Platz für zwei Zeilen, während der Block darunter stand. */
  .weg-best-dlg .wb-rolle{flex:1 1 auto;min-height:0;overflow-y:auto;
    display:flex;flex-direction:column;gap:12px}
  .weg-best-dlg .wb-liste{display:flex;flex-direction:column;flex:none}
  .weg-best-dlg .wb-kopfz,.weg-best-dlg .wb-z{display:flex;align-items:baseline;
    gap:10px;padding:6px 2px;border-bottom:1px solid var(--line)}
  .weg-best-dlg .wb-kopfz{font:600 10px var(--mono);letter-spacing:.08em;
    text-transform:uppercase;color:var(--soft);position:sticky;top:0;
    background:var(--sheet);z-index:1}
  .weg-best-dlg .wb-kopfz span:first-child{flex:1;min-width:0}
  .weg-best-dlg .wb-n{flex:1;min-width:0;font:500 12.5px var(--body);color:var(--ink)}
  .weg-best-dlg .wb-s{display:block;font:400 10px var(--mono);color:var(--soft);
    margin-top:1px}
  .weg-best-dlg .wb-g{flex:none;width:84px;text-align:right;
    font:400 11.5px var(--mono);color:var(--soft)}
  .weg-best-dlg .wb-v{flex:none;width:84px;text-align:right;
    font:600 12.5px var(--mono);color:var(--ink)}
  .weg-best-dlg .wb-z.summe{border-bottom:none;border-top:3px double var(--ink);
    margin-top:2px;padding-top:9px}
  .weg-best-dlg .wb-z.summe .wb-n{font-weight:700}
  .weg-best-dlg .wb-z.summe .wb-v{font-size:14px}
  .weg-best-dlg .wb-nicht{flex:none;background:var(--paper);
    border-radius:12px;padding:11px 12px}
  .weg-best-dlg .wb-nkopf{display:flex;gap:10px;align-items:baseline;
    font:600 12px var(--disp);color:var(--soft)}
  .weg-best-dlg .wb-nkopf span{flex:none;font:600 13px var(--mono)}
  .weg-best-dlg .wb-ns{margin:4px 0 8px;font:400 11px var(--body);color:var(--soft);
    line-height:1.45}
  .weg-best-dlg .wb-liste.aus .wb-n,.weg-best-dlg .wb-liste.aus .wb-v{
    color:var(--soft)}
  .weg-best-dlg .weg-chips{flex:none}
  .weg-best-dlg .weg-warn{flex:none}

  @media(max-width:430px){
    .weg-zeile{flex-wrap:wrap}
    .weg-zeile .wz-n{flex:1 1 100%}
    .weg-zeile .wz-bahn{flex:1 1 auto}
    /* Zwei Zeilen statt vier: oben wer und wie viel, darunter die Herleitung
       und die Knöpfe. Ohne die Reihenfolge sprängen die Knöpfe zwischen
       Betrag und Herleitung. */
    .weg-vz{align-items:flex-start;row-gap:8px}
    .weg-vz .wv-n{flex:1 1 55%}
    .weg-vz .wv-v{order:2}
    .weg-vz .wv-r{order:3;align-self:center}
    .weg-vz .wv-k{order:4;margin-left:auto}
    .weg-best-dlg .wb-g{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="back" id="back" aria-label="Zurück"></button>
    <div class="barwrap">
      <h1 id="titel">Abrechnung</h1>
      <div class="sub" id="sub">wird geladen …</div>
      <div class="frist-chip" id="fristchip"></div>
    </div>
  </div>

  <div class="scroll" id="inhalt"></div>
  <!-- Kamera fuer den Scan an einer offenen Position. capture=environment
       oeffnet auf iOS direkt die Ruecckamera. -->
  <input type="file" id="scanFeld" accept="image/*,application/pdf,.pdf" capture="environment" multiple
         style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"
         tabindex="-1" aria-hidden="true">

  <div data-nav></div>
</div>

<script type="module">
/* N215 — dieser Rumpf lädt die Zeitraum-Seite aus den Modulen unter
   `assets/zeitraum/`. Der große Inline-Script (~5700 Zeilen) wurde nach
   Topics aufgeteilt; siehe `assets/zeitraum/_TOPICS.md`. Hier wird nur
   die Navigation eingehängt, die zentrale Delegation gestartet und das
   erste `laden()` ausgeführt. */
import { installNav } from './assets/immo.js';
import { laden, initHandlers } from './assets/zeitraum/checkliste.js';
installNav();
initHandlers();
await laden();
</script>
</body>
</html>
