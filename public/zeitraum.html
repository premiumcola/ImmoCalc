  else if (e.target.closest('#zaehlerKonfig')) zaehlerKonfig();
});

async function ablesungWizard() {
  let maske;
  try { maske = await api(`/zeitraeume/${zid}/ablesung`); }
  catch (fehler) { melde(fehler.message || 'Ablesewerte nicht ladbar', 'neg'); return; }
  const zl = maske.zaehler || [];
  if (!zl.length) {
    melde('Für diese Immobilie sind noch keine Zähler angelegt.', '');
    return;
  }
  let idx = 0;
  const dlg = document.createElement('dialog');
  dlg.className = 'ablese-dlg';
  document.body.appendChild(dlg);
  dlg.addEventListener('close', () => { dlg.remove(); laden(); });

  async function speichereAktuell() {
    const feld = dlg.querySelector('#awStand');
    if (!feld) return;                                  // Rest-Zähler: nichts einzugeben
    const roh = feld.value.trim().replace(',', '.');
    if (roh === '') return;                             // leer gelassen → nicht speichern
    const stand = Number(roh);
    if (!Number.isFinite(stand)) return;
    const datum = dlg.querySelector('#awDatum').value || maske.zeitraum.ende;
    zl[idx].ablesung = { stand, datum };
    try {
      await api(`/zaehler/${zl[idx].id}/ablesungen`,
        { method: 'POST', body: { stand, datum, zeitraum_id: Number(zid) } });
    } catch (fehler) { melde(fehler.message || 'Speichern fehlgeschlagen', 'neg'); }
  }

  function gruppenNachKostenart() {
    const m = new Map();
    for (const z of zl) {
      if (!z.kostenart) continue;
      if (!m.has(z.kostenart)) m.set(z.kostenart, []);
      m.get(z.kostenart).push(z);
    }
    return [...m.entries()];
  }

  /* Letzter Schritt: je Kostenart die Partei-Aufteilung aus dem Verbrauch, dazu
     der Verteilungsschlüssel zur Wahl (Vorgabe: Verbrauch). „Übernehmen" setzt
     Schlüssel + Gewichte an der Position; der Betrag bleibt beim Beleg. */
  function renderZusammenfassung() {
    const opts = maske.schluessel_optionen || [];
    const bloecke = gruppenNachKostenart().map(([ka, zs]) => {
      const zeilen = zs.filter(z => z.einheit_bezug).map(z =>
        `<div class="aw-zeile"><span>${esc(z.einheit_bezug)}</span>
          <b>${z.verbrauch != null ? zahl(z.verbrauch) + ' ' + esc(z.messeinheit)
              : '—'}</b></div>`).join('');
      const sel = `<select class="aw-select" data-ka="${esc(ka)}">${opts.map(o =>
        `<option value="${o.wert}"${o.wert === 'verbrauch' ? ' selected' : ''}>${
          esc(o.titel)}</option>`).join('')}</select>`;
      return `<div class="aw-block">
        <div class="aw-bk">${esc(ka)}</div>
        ${zeilen || '<div class="aw-leer">Nur Gesamtzähler — keine Aufteilung.</div>'}
        <label class="aw-sk">Verteilungsschlüssel${sel}</label>
      </div>`;
    }).join('');
    dlg.innerHTML = `
      <div class="aw-kopf">
        <span class="t">Übernehmen · ${esc(maske.zeitraum.label)}</span>
        <button class="aw-x" data-schliessen aria-label="Schließen">×</button>
      </div>
      <div class="aw-bahn"><i style="width:100%"></i></div>
      <div class="aw-schritt">Verbrauch in die Abrechnung übernehmen</div>
      <div class="aw-body">${bloecke
        || '<div class="aw-vor">Keine Zähler mit Kostenart angelegt.</div>'}</div>
      <div class="aw-fuss">
        <button class="aw-zurueck" data-zurueck>‹ Zurück</button>
        <button class="aw-weiter" data-uebernehmen ${bloecke ? '' : 'disabled'}>Übernehmen</button>
      </div>`;
  }

  function render() {
    if (idx >= zl.length) { renderZusammenfassung(); return; }
    const z = zl[idx];
    const rest = z.typ === 'rest';
    const vor = z.vorwert
      ? `Vorstand: <strong>${zahl(z.vorwert.stand)} ${esc(z.messeinheit)}</strong>
         <span>(${new Date(z.vorwert.datum).toLocaleDateString('de-DE')})</span>`
      : 'Erste Ablesung — kein Vorstand. Das wird die Startablesung.';
    const chips = [z.kostenart, z.einheit_bezug || 'Haus / Gesamt',
                   rest ? 'berechneter Rest' : z.messeinheit]
      .filter(Boolean).map(c => `<span class="c">${esc(c)}</span>`).join('');
    dlg.innerHTML = `
      <div class="aw-kopf">
        <span class="t">Ablesewerte · ${esc(maske.zeitraum.label)}</span>
        <button class="aw-x" data-schliessen aria-label="Schließen">×</button>
      </div>
      <div class="aw-bahn"><i style="width:${Math.round((idx / zl.length) * 100)}%"></i></div>
      <div class="aw-schritt">Zähler ${idx + 1} von ${zl.length}</div>
      <div class="aw-body">
        <div class="aw-name">${esc(z.name)}</div>
        <div class="aw-chips">${chips}</div>
        <div class="aw-vor">${vor}</div>
        ${rest
          ? `<div class="aw-verb">Berechneter Rest-Zähler — kein Wert nötig. Er
             ergibt sich aus Gesamt minus die gemessenen Unterzähler.</div>`
          : `<div class="aw-feld">
              <label for="awStand">Aktueller Zählerstand (${esc(z.messeinheit)})</label>
              <input id="awStand" type="text" inputmode="decimal" placeholder="z. B. 234,8"
                     value="${z.ablesung ? zahl(z.ablesung.stand) : ''}">
             </div>
             <div class="aw-feld">
              <label for="awDatum">Abgelesen am</label>
              <input id="awDatum" type="date"
                     value="${z.ablesung ? z.ablesung.datum : maske.zeitraum.ende}">
             </div>`}
        ${z.verbrauch != null && !rest
          ? `<div class="aw-verb">Verbrauch im Zeitraum:
             ${zahl(z.verbrauch)} ${esc(z.messeinheit)}</div>` : ''}
      </div>
      <div class="aw-fuss">
        <button class="aw-zurueck" data-zurueck ${idx === 0 ? 'disabled' : ''}>‹ Zurück</button>
        <button class="aw-weiter" data-weiter>Weiter ›</button>
      </div>`;
    const feld = dlg.querySelector('#awStand');
    if (feld) feld.focus();
  }

  dlg.addEventListener('click', async e => {
    if (e.target.closest('[data-schliessen]')) { await speichereAktuell(); dlg.close(); return; }
    if (e.target.closest('[data-zurueck]')) {
      await speichereAktuell(); idx = Math.max(0, idx - 1); render(); return;
    }
    if (e.target.closest('[data-weiter]')) {
      await speichereAktuell(); idx += 1; render(); return;   // letzter → Zusammenfassung
    }
    const ueb = e.target.closest('[data-uebernehmen]');
    if (ueb) {
      const selects = [...dlg.querySelectorAll('.aw-select')];
      ueb.disabled = true; ueb.textContent = 'Übernehme …';
      try {
        let angewandt = 0;
        for (const s of selects) {
          const r = await api(`/zeitraeume/${zid}/ablesung/uebernehmen`,
            { method: 'POST', body: { kostenart: s.dataset.ka, schluessel: s.value } });
          if (r.angewandt) angewandt += 1;
        }
        const rest = selects.length - angewandt;
        melde(angewandt
          ? `Verbrauch übernommen für ${angewandt} Kostenart${angewandt === 1 ? '' : 'en'}`
            + (rest ? ` · ${rest} braucht${rest === 1 ? '' : 'en'} erst einen Beleg` : '')
          : 'Noch keine passende Position — erst die Belege/Beträge erfassen', angewandt ? 'pos' : '');
        dlg.close();
      } catch (fehler) {
        ueb.disabled = false; ueb.textContent = 'Übernehmen';
        melde(fehler.message || 'Übernehmen fehlgeschlagen', 'neg');
      }
    }
  });
  render();
  dlg.showModal();
}

/* Deutsche Zahleneingabe → Number: Punkt = Tausender, Komma = Dezimal
   (Umkehr des zahl()-Formats). '' bei leerer/ungültiger Eingabe. */
/* Die Zeile, zu der ein Eingabefeld gehört: die Karten-Zeile der Zählerstände
   (`.zu-zeile`) oder — in der Strommaske (N120) — die Tabellenzeile. */
const zeilenBox = el => el?.closest('.zu-zeile, tr');

function standAusFeld(el) {
  const roh = (el?.value || '').trim().replace(/\./g, '').replace(',', '.');
  if (roh === '') return null;
  const n = Number(roh);
  return Number.isFinite(n) ? n : NaN;
}

/* N47/N60 — Endstand eines Zählers aus der Übersicht speichern; das Ablese-Datum
   kommt aus dem begleitenden Datumsfeld (N60b), sonst aus dem Zeitraum-Ende.
   Danach die Ablese-Maske neu laden — erst dann trägt der Zähler `verbrauch`. */
async function endstandSpeichern(input) {
  const id = input.dataset.endstand;
  // N120 — der Wert kommt aus DEM Feld, das gespeichert wird. Eine Suche über
  // das Attribut träfe den falschen Zähler, sobald derselbe Zähler zweimal auf
  // der Seite steht (Zählerstände-Panel + Strommaske in der Position).
  const stand = standAusFeld(input);
  if (stand === null) return;                          // kein Stand → nichts speichern
  if (Number.isNaN(stand)) { melde('Ungültiger Zählerstand', 'neg'); return; }
  // N88 — das Ablesedatum dieser Zeile fährt im selben Aufruf mit; ohne Eingabe
  // bleibt es die Periodengrenze. N120 — in der Strommaske ist die Zeile ein <tr>.
  const datumEl = zeilenBox(input)?.querySelector('[data-enddatum]');
  const datum = datumEl?.value || ablesungMaske?.zeitraum?.ende || daten.ende;
  try {
    await api(`/zaehler/${id}/ablesungen`,
      { method: 'POST', body: { stand, datum, zeitraum_id: Number(zid) } });
    ablesungMaske = await api(`/zeitraeume/${zid}/ablesung`);
    chipMap = baueChipMap();
    melde('Zählerstand gespeichert', 'pos');
    await zeichnen();
  } catch (fehler) {
    melde(fehler.message || 'Speichern fehlgeschlagen', 'neg');
  }
}

/* N60 — Anfangsstand eines Zählers aus der Übersicht speichern (idempotent, mit
   Datum). POST /zaehler/{id}/anfangsstand; danach die Ablese-Maske neu laden. */
async function anfangstandSpeichern(input) {
  const id = input.dataset.anfangstand;
  const stand = standAusFeld(input);
  if (stand === null) return;
  if (Number.isNaN(stand)) { melde('Ungültiger Anfangsstand', 'neg'); return; }
  // N88 — dasselbe für den Anfang: Stand und Datum dieser Zeile, ein Aufruf.
  const datumEl = zeilenBox(input)?.querySelector('[data-anfangdatum]');
  const datum = datumEl?.value || ablesungMaske?.zeitraum?.start || daten.start;
  try {
    // N96 — der Anfangsstand hängt an KEINEM Zeitraum (sonst wird er als
    // Endstand dieser Periode gelesen und überschreibt ihn sichtbar).
    await api(`/zaehler/${id}/anfangsstand`, { method: 'POST', body: { stand, datum } });
    ablesungMaske = await api(`/zeitraeume/${zid}/ablesung`);
    chipMap = baueChipMap();
    melde('Anfangsstand gespeichert', 'pos');
    await zeichnen();
  } catch (fehler) {
    melde(fehler.message || 'Speichern fehlgeschlagen', 'neg');
  }
}

/* N88 — ein von Hand geändertes Ablesedatum vormerken. Schreibt bewusst nichts:
   es markiert nur das Feld und zeigt den Übernehmen-Knopf dieser einen Zeile.
   Gespeichert wird erst auf Klick, über denselben Stand-Flow wie sonst. */
function datumGeaendert(el) {
  el.classList.add('geaendert');
  // N96c — ein vollständig geändertes Datum wird sofort mit dem Stand DIESER
  // Zeile gespeichert; danach rechnet die Interpolation neu. `change` feuert
  // beim Datumsfeld erst bei einem gültigen, vollständigen Datum — es gibt also
  // kein Zwischenspeichern beim Tippen (und nie ein Anfassen anderer Zeilen).
  const zeile = zeilenBox(el);
  const ende = el.matches('[data-enddatum]');
  const standEl = zeile?.querySelector(ende ? '[data-endstand]' : '[data-anfangstand]');
  if (el.value && standEl && standAusFeld(standEl) != null
      && !Number.isNaN(standAusFeld(standEl))) {
    return ende ? endstandSpeichern(standEl) : anfangstandSpeichern(standEl);
  }
  const knopf = zeile?.querySelector('[data-datum-uebernehmen]');
  if (knopf) knopf.hidden = false;   // ohne Stand: erst den Stand eintragen
}

/* N88 — das geänderte Datum zusammen mit dem bereits erfassten Stand dieser
   Zeile speichern. Ohne Stand gibt es nichts zu speichern; das sagt die Meldung.
   Nach dem Speichern baut sich die Maske neu auf — deshalb genau ein Feld. */
async function datumUebernehmen(knopf) {
  const zeile = zeilenBox(knopf);
  const datumEl = zeile?.querySelector('input[type=date].geaendert');
  const ende = datumEl?.matches('[data-enddatum]');
  const standEl = zeile?.querySelector(ende ? '[data-endstand]' : '[data-anfangstand]');
  if (!standEl || standAusFeld(standEl) === null) {
    melde('Erst den Zählerstand eintragen — das Datum gehört zu einem Stand', 'neg');
    return;
  }
  return ende ? endstandSpeichern(standEl) : anfangstandSpeichern(standEl);
}

/* N58 — die Einheiten-Zuordnung eines Zählers umschalten und sofort speichern
   (PATCH /zaehler/{id} {einheiten:[…]}). Ohne vollen Neuaufbau: nur der Chip
   wird umgeschaltet, damit der Einklapper offen und die Position stabil bleibt. */
async function einheitToggle(btn) {
  const id = Number(btn.dataset.einheitToggle);
  const einheit = btn.dataset.einheit;
  const z = (ablesungMaske?.zaehler || []).find(m => m.id === id);
  if (!z) return;
  const set = new Set(zaehlerEinheiten(z));
  if (set.has(einheit)) set.delete(einheit); else set.add(einheit);
  const neu = [...set];
  z.einheiten = neu;                                   // lokal nachziehen
  const an = set.has(einheit);
  btn.classList.toggle('an', an);
  btn.setAttribute('aria-pressed', String(an));
  try {
    await api(`/zaehler/${id}`, { method: 'PATCH', body: { einheiten: neu } });
  } catch (fehler) {
    melde(fehler.message || 'Zuordnung nicht gespeichert', 'neg');
  }
}

/* N57 — die Checklisten-Position hinter einem der drei Bestandteile. `wasser` =
   die reine „Wasser"-Sammelposition, `schmutz` = Abwasser, `niederschlag` =
   Niederschlagswasser. Nur mit position_id lässt sich der Betrag speichern. */
function wasserPosFuer(art) {
  const treffer = {
    wasser: k => istWasserSammel(k),
    schmutz: k => {
      const n = normUml(k.kostenart);
      return n.includes('abwasser') || n.includes('schmutzwasser');
    },
    niederschlag: k => normUml(k.kostenart).includes('niederschlag'),
  }[art];
  return (daten.checkliste || []).find(treffer) || null;
}

/* N78 — einen Bereichsbetrag auf seine Wasser-Position schreiben. Gleicher Weg
   wie `wasserBetragSpeichern`: PATCH auf die bestehende Position, sonst legt der
   POST sie beim ersten Betrag an. Fehlt die Position ganz (Kostenart nicht im
   Objekt) oder ist der Betrag ≤ 0, passiert nichts — der Fehler wird nach oben
   gereicht, damit `belegPerDrop` ihn ehrlich meldet. */
async function wasserPosBetragSchreiben(art, betrag) {
  if (!(betrag > 0)) return;
  const pos = wasserPosFuer(art);
  if (!pos) return;
  if (pos.position_id) {
    await api(`/positionen/${pos.position_id}`, { method: 'PATCH', body: { betrag } });
  } else {
    await api(`/zeitraeume/${daten.id}/positionen`,
      { method: 'POST', body: { kostenart: pos.kostenart, betrag } });
  }
}

/* N57 — eine Kostenbox im Popup: als Eingabefeld, wenn der Zeitraum bearbeitbar
   ist. Existiert schon eine Position, wird ihr Betrag per PATCH gesetzt; sonst
   legt das Speichern die Position beim ersten Betrag an. Sonst lesbarer Wert. */
function wdKostenBox(label, art, kostenWert) {
  const pos = wasserPosFuer(art);
  if (pos && daten.status === 'in Arbeit') {
    const val = pos.betrag != null ? pos.betrag : (kostenWert ?? '');
    const ziel = pos.position_id
      ? `data-wasser-pid="${pos.position_id}"`
      : `data-wasser-ka="${esc(pos.kostenart)}"`;
    return `<div class="wd-kbox wd-edit"><span class="wd-kl">${label}</span>
      <span class="wd-kin"><input type="number" step="0.01" inputmode="decimal"
        value="${val ?? ''}" ${ziel} data-wert="${val ?? ''}"
        aria-label="${label} Betrag"><span class="wd-kve">€</span></span></div>`;
  }
  return `<div class="wd-kbox"><span class="wd-kl">${label}</span>
    <span class="wd-kv">${eur(kostenWert)}</span></div>`;
}

/* N57 — einen der drei Bestandteil-Beträge speichern: gleicher Weg wie jeder
   Positionsbetrag (PATCH /positionen/{id} {betrag}); fehlt die Position noch,
   wird sie beim ersten Betrag angelegt. Danach Popup + Untergrund auffrischen. */
async function wasserBetragSpeichern(input) {
  const roh = String(input.value).trim().replace(',', '.');
  if (roh === '') return;
  const betrag = Number(roh);
  if (!Number.isFinite(betrag)) { melde('Ungültiger Betrag', 'neg'); return; }
  if (String(input.dataset.wert) === String(betrag)) return;
  input.dataset.wert = String(betrag);
  try {
    if (input.dataset.wasserPid) {
      await api(`/positionen/${input.dataset.wasserPid}`,
        { method: 'PATCH', body: { betrag } });
    } else {
      await api(`/zeitraeume/${zid}/positionen`,
        { method: 'POST', body: { kostenart: input.dataset.wasserKa, betrag } });
    }
    melde('✓ Betrag gespeichert', 'pos');
    // N74 — die Detailübersicht liegt inline in der aufgeklappten Position:
    // neu laden zeichnet die Liste und holt die Tabelle frisch.
    await laden();
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

/* Der Rumpf des Wasser-Popups aus der /wasser-Antwort. */
function wasserDetailInhalt(d) {
  const k = d.kosten || {};
  const kbox = (label, wert, extra = '') =>
    `<div class="wd-kbox${extra}"><span class="wd-kl">${label}</span>
      <span class="wd-kv">${wert}</span></div>`;
  // N113 - Umschalter: der Rest (Haupthaus) wird nach Personen oder nach
  // Flaeche verteilt. Die gemessenen Zaehler bleiben davon unberuehrt.
  const schl = d.schluessel || 'personen';
  const umschalter = `<div class="wd-schl">
      <span class="wd-schl-l">Rest verteilen nach</span>
      <button type="button" class="wd-sb${schl === 'personen' ? ' an' : ''}"
        data-wasser-schluessel="personen">Personen</button>
      <button type="button" class="wd-sb${schl === 'flaeche' ? ' an' : ''}"
        data-wasser-schluessel="flaeche">Fläche</button>
      <span class="wd-schl-l" style="margin-left:auto">Laut Rechnung</span>
      <input class="wd-rm" type="number" step="0.1" data-wasser-rechnung
        value="${d.rechnung_m3 ?? ''}" placeholder="m³"
        aria-label="Abgerechnete Menge laut Bescheid in m³">
    </div>${(d.abweichung_m3 != null && Math.abs(d.abweichung_m3) > 0.05)
      ? `<div class="ho-warn">Zwei Zahlen, beide bleiben stehen: der
          <b>Zählerwert</b> ${m3(d.abgelesen_m3)} (eigener Hauptzähler) und die
          <b>abgerechnete Menge</b> ${m3(d.rechnung_m3)} (Bescheid des
          Versorgers). Verteilt wird auf die abgerechnete Menge. Die Abweichung
          von ${m3(d.abweichung_m3)} bleibt damit unverteilt — sie ist ein
          offener Punkt zwischen Ablesung und Abrechnung, den die nächsten
          Jahre klären.</div>` : ''}`;
  const kosten = umschalter + `<div class="wd-kosten">
    ${wdKostenBox('Frischwasser', 'wasser', k.wasser)}
    ${wdKostenBox('Schmutzwasser', 'schmutz', k.schmutz)}
    ${wdKostenBox('Niederschlag', 'niederschlag', k.niederschlag)}
    ${kbox('Gesamt', eur(k.gesamt), ' gesamt')}
    ${kbox('Preis / m³', `${(k.preis_m3 ?? 0).toLocaleString('de-DE',
      { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`, ' preis')}
  </div>`;

  // N108 (Fund 7) — die Warnungen der Rechnung MUESSEN sichtbar sein: ein
  // Zaehler ohne aufloesbare Einheit wird uebersprungen, sein Verbrauch faellt
  // in den Rest. Ohne Hinweis merkt das niemand.
  const warn = (d.warnungen || []).map(t =>
    `<div class="ho-warn">▲ ${esc(t)}</div>`).join('');
  const einheiten = d.einheiten || [];
  if (!einheiten.length) {
    return (d.bereit === false
      ? `<div class="wd-hinweis">${esc(d.hinweis
          || 'Für die Verrechnung fehlen noch Angaben.')}</div>` : '')
      + kosten + warn;
  }

  // Zellinhalt einer Verbrauchszeile: m³ + € + Quelle (gemessen/berechnet).
  const zelle = z => z
    ? `<td><span class="wd-m3">${m3(z.m3)}</span>
        <span class="wd-eur">${eur(z.kosten)}</span>
        </td>`
    : '<td class="wd-leerz">–</td>';

  // Alle vorkommenden Verbrauchsarten in Reihenfolge des ersten Auftretens.
  const arten = [];
  for (const e of einheiten) for (const z of (e.zeilen || []))
    if (!arten.includes(z.art)) arten.push(z.art);

  // Eine Einheit kann mehrere Zähler derselben Art haben (zwei Waschmaschinen-
  // zähler o. ä.). Die werden zu EINER Zelle addiert — sonst fiele alles außer
  // dem ersten Zähler unter den Tisch und die Zeilen ergäben nicht die Summe.
  const zusammen = (e, art) => {
    const treffer = (e.zeilen || []).filter(z => z.art === art);
    if (!treffer.length) return null;
    if (treffer.length === 1) return treffer[0];
    return {
      art,
      m3: treffer.reduce((s, z) => s + (z.m3 || 0), 0),
      kosten: treffer.reduce((s, z) => s + (z.kosten || 0), 0),
      // Gemessen gilt nur, wenn jeder Teilzähler gemessen ist.
      quelle: treffer.every(z => z.quelle === 'gemessen') ? 'gemessen'
        : (treffer.find(z => z.quelle) ? 'berechnet' : ''),
    };
  };

  // Jede Zeile hat genau so viele Zellen wie der Kopf: Zeilenkopf + je Einheit.
  const zeileMit = (kopfZelle, klasse, zellen) =>
    `<tr${klasse ? ` class="${klasse}"` : ''}>
      <td class="wd-rowh">${kopfZelle}</td>${zellen.join('')}</tr>`;

  const kopf = `<tr><th class="wd-rowh">Verbrauch</th>${
    einheiten.map(e => `<th>${esc(e.name)}</th>`).join('')}</tr>`;

  // N115 — unter jeder Zeile steht, WOHER die Zahl kommt: gemessen (Zähler),
  // errechnet (Anteil am Rest) oder von Hand eingetragen. Ohne das ist nicht zu
  // sehen, welche Werte belegt und welche verteilt sind.
  const herkunft = a => /waschmaschine|kaltwasser|warmwasser/i.test(a)
    ? 'nach Zähler' : /haupthaus|anteil/i.test(a) ? 'errechnet' : '';
  const artZeilen = arten.map(art => zeileMit(
    `${esc(art)}${herkunft(art) ? `<small>${herkunft(art)}</small>` : ''}`, '',
    einheiten.map(e => zelle(zusammen(e, art))))).join('');

  // Gartenwasser: volle Rate, geht an den Eigentümer — in der Spalte seiner
  // Einheit, sonst „–".
  const g = d.garten;
  const gartenZeile = g ? zeileMit('Gartenwasser <small>manuell · Eigentümer</small>',
    'wd-garten', einheiten.map(e => e.name === g.einheit
      ? `<td><span class="wd-m3">${m3(g.m3)}</span>
          <span class="wd-eur">${eur(g.kosten)}</span></td>`
      : '<td class="wd-leerz">–</td>')) : '';

  // Klasse bewusst wd-summe (nicht summe): die globale .summe-Regel setzt
  // display:flex und würde die Zeile aus dem Spaltenraster reißen.
  const summeZeile = zeileMit('Summe', 'wd-summe',
    einheiten.map(e => `<td><span class="wd-m3">${eur(e.summe)}</span></td>`));

  const tabelle = `<div class="wd-tabelle"><table class="wd-tab">
      <thead>${kopf}</thead>
      <tbody>${artZeilen}${gartenZeile}${summeZeile}</tbody>
    </table></div>`;

  // N108 (Fund 4/9) — die Kontrollsumme MUSS den Gesamtkosten entsprechen.
  // Weicht sie ab, fehlt Geld in der Verteilung (etwa weil kein Ziel fuer den
  // Rest gefunden wurde) — das darf nicht als blosse Zahl durchgehen.
  const stimmt = Math.abs((d.kontrolle ?? 0) - (k.gesamt ?? 0)) < 0.02;
  const fuss = `<div class="wd-fuss">
      <span>Gesamtverbrauch <b>${m3(d.gesamt_m3)}</b></span>
      ${d.rest_m3 != null ? `<span>Rest Haupthaus <b>${m3(d.rest_m3)}</b> ·
        ${eur(d.rest_kosten)}</span>` : ''}
      <span class="wd-kontroll${stimmt ? '' : ' neg'}">Kontrolle ${
        eur(d.kontrolle ?? k.gesamt)}${stimmt ? '' : ` ≠ ${eur(k.gesamt)}`}</span>
    </div>`;

  return (d.bereit === false
    ? `<div class="wd-hinweis">${esc(d.hinweis
        || 'Für die Verrechnung fehlen noch Angaben.')}</div>` : '')
    + kosten + warn + tabelle + fuss;
}

/* ---- Zähler-Konfiguration (CCCLXXX) --------------------------------------
   Zahnrad neben „Ablesewerte eingeben": Zähler je Immobilie anlegen/entfernen/
   verschieben, Messeinheit·Bezug·Kostenart einstellen, die Verrechnung setzen
   (Rest = Hauptzähler − Unterzähler) und den Anfangsstand vor der ersten
   Abrechnung erfassen. Nutzt die vorhandenen Endpunkte; gespeichert wird
   sofort (PATCH/POST/DELETE). */
const MESSEINHEITEN = ['m³', 'kWh', 'Liter'];

/* Frühester Periodenbeginn (ISO) — dorthin gehört der Anfangsstand, damit er die
   erste Abrechnung öffnet. Labels der Objektseite: „dd.mm.yyyy – dd.mm.yyyy". */
function fruehesterStartISO(objektDaten) {
  const daten2 = (objektDaten?.zeitraeume || [])
    .map(z => (z.label || '').match(/(\d{2})\.(\d{2})\.(\d{4})/))
    .filter(Boolean).map(m => `${m[3]}-${m[2]}-${m[1]}`).sort();
  return daten2[0] || null;
}

async function zaehlerKonfig() {
  const slug = daten.objekt;
  let meters, objektDaten;
  try {
    [meters, objektDaten] = await Promise.all([
      api(`/objekte/${slug}/zaehler`), api(`/objekte/${slug}`)]);
  } catch (fehler) { melde(fehler.message || 'Zähler nicht ladbar', 'neg'); return; }

  const startISO = fruehesterStartISO(objektDaten) || daten.start;
  const kostenarten = [...new Set((daten.checkliste || []).map(k => k.kostenart))];
  const bezuege = [...new Set((schluessel?.parteien || []).map(p => p.partei))];

  const dlg = document.createElement('dialog');
  dlg.className = 'ablese-dlg';
  document.body.appendChild(dlg);
  dlg.addEventListener('close', () => { dlg.remove(); laden(); });

  async function neuLaden() {
    try { meters = await api(`/objekte/${slug}/zaehler`); } catch { /* Ansicht bleibt */ }
    render();
  }

  const opt = (wert, text, sel) =>
    `<option value="${esc(String(wert))}"${sel ? ' selected' : ''}>${esc(text)}</option>`;

  function karte(z, i) {
    const rest = z.typ === 'rest';
    const messSel = MESSEINHEITEN.map(m => opt(m, m, m === z.messeinheit)).join('')
      + (MESSEINHEITEN.includes(z.messeinheit) ? '' : opt(z.messeinheit, z.messeinheit, true));
    const bezugSel = opt('', 'Haus / Gesamt', !z.einheit_bezug)
      + bezuege.map(b => opt(b, b, b === z.einheit_bezug)).join('')
      + (z.einheit_bezug && !bezuege.includes(z.einheit_bezug)
         ? opt(z.einheit_bezug, z.einheit_bezug, true) : '');
    const kaSel = opt('', '— keine —', !z.kostenart)
      + kostenarten.map(k => opt(k, k, k === z.kostenart)).join('')
      + (z.kostenart && !kostenarten.includes(z.kostenart)
         ? opt(z.kostenart, z.kostenart, true) : '');
    const modus = rest ? 'rest' : (z.hauptzaehler_id ? 'unter' : 'frei');
    const verrSel = opt('frei', 'Eigenständig / Gesamt', modus === 'frei')
      + opt('unter', 'Unterzähler von …', modus === 'unter')
      + opt('rest', 'Rest von …', modus === 'rest');
    const andere = meters.filter(m => m.id !== z.id);
    const hauptSel = andere.length
      ? andere.map(m => opt(m.id, m.name, m.id === z.hauptzaehler_id)).join('')
      : opt('', 'kein anderer Zähler', true);
    let restInfo = '';
    if (rest && z.hauptzaehler_id) {
      const haupt = meters.find(m => m.id === z.hauptzaehler_id);
      const unter = meters.filter(m => m.typ === 'gemessen'
        && m.hauptzaehler_id === z.hauptzaehler_id);
      restInfo = `<div class="zk-rest">Rest = ${esc(haupt?.name || '?')}${
        unter.length ? unter.map(u => ` − ${esc(u.name)}`).join('')
                     : ' − (noch keine Unterzähler)'}</div>`;
    }
    const anf = z.anfangsstand;
    const anfBlock = rest ? '' : `<div class="zk-anfang">
        <div class="zk-feld"><label>Anfangsstand</label>
          <input type="number" step="0.001" inputmode="decimal" placeholder="—"
            value="${anf ? anf.stand : ''}" data-zk-anf-stand="${z.id}"
            aria-label="Anfangsstand ${esc(z.name)}"></div>
        <div class="zk-feld"><label>am</label>
          <input type="date" value="${anf ? anf.datum : startISO}"
            data-zk-anf-datum="${z.id}" aria-label="Datum Anfangsstand"></div>
      </div>`;

    return `<div class="zk-karte" data-zid="${z.id}">
      <div class="zk-kopf">
        <input class="zk-name" value="${esc(z.name)}" data-zk-f="name" data-zid="${z.id}"
          aria-label="Zählername">
        <div class="zk-tools">
          <button class="zk-ic" data-zk-up="${z.id}" ${i === 0 ? 'disabled' : ''}
            aria-label="nach oben">↑</button>
          <button class="zk-ic" data-zk-down="${z.id}"
            ${i === meters.length - 1 ? 'disabled' : ''} aria-label="nach unten">↓</button>
          <button class="zk-ic gefahr" data-zk-del="${z.id}"
            aria-label="Zähler entfernen">${MUELL_ICON}</button>
        </div>
      </div>
      <div class="zk-grid">
        <div class="zk-feld"><label>Einheit</label>
          <select data-zk-f="messeinheit" data-zid="${z.id}">${messSel}</select></div>
        <div class="zk-feld"><label>Bezug</label>
          <select data-zk-f="einheit_bezug" data-zid="${z.id}">${bezugSel}</select></div>
        <div class="zk-feld"><label>Kostenart</label>
          <select data-zk-f="kostenart" data-zid="${z.id}">${kaSel}</select></div>
        <div class="zk-feld"><label>Verrechnung</label>
          <select data-zk-verr="${z.id}">${verrSel}</select></div>
        ${modus !== 'frei' ? `<div class="zk-feld voll"><label>Hauptzähler</label>
          <select data-zk-f="hauptzaehler_id" data-zid="${z.id}">${hauptSel}</select></div>` : ''}
      </div>
      ${restInfo}
      ${anfBlock}
    </div>`;
  }

  function render() {
    const liste = meters.length
      ? meters.map((z, i) => karte(z, i)).join('')
      : `<div class="zk-leer">Noch keine Zähler für diese Immobilie. Lege den
          ersten an — Gesamtzähler, Unterzähler je Einheit und, wenn nötig, einen
          berechneten Rest.</div>`;
    dlg.innerHTML = `
      <div class="aw-kopf">
        <span class="t">Zähler · ${esc(daten.objekt_name)}</span>
        <button class="aw-x" data-zk-schliessen aria-label="Schließen">×</button>
      </div>
      <div class="aw-body zk-body">
        <p class="zk-intro">Zähler dieser Immobilie: Messeinheit, Bezug und
          Kostenart einstellen, die Verrechnung festlegen (Rest = Hauptzähler −
          Unterzähler) und den Anfangsstand vor der ersten Abrechnung setzen.</p>
        <div class="zk-liste">${liste}</div>
        <button class="zk-add" data-zk-add>＋ Zähler hinzufügen</button>
      </div>
      <div class="aw-fuss">
        <button class="aw-weiter" data-zk-schliessen style="flex:1">Fertig</button>
      </div>`;
  }

  dlg.addEventListener('change', async e => {
    const f = e.target.closest('[data-zk-f]');
    if (f) {
      const id = f.dataset.zid;
      let wert = f.value;
      if (f.dataset.zkF === 'hauptzaehler_id') wert = wert ? Number(wert) : null;
      const z = meters.find(m => String(m.id) === String(id));
      if (z) z[f.dataset.zkF] = wert;               // lokal nachziehen
      try { await api(`/zaehler/${id}`, { method: 'PATCH', body: { [f.dataset.zkF]: wert } }); }
      catch (fehler) { melde(fehler.message || 'Speichern fehlgeschlagen', 'neg'); }
      return;
    }
    const verr = e.target.closest('[data-zk-verr]');
    if (verr) return verrechnungSetzen(Number(verr.dataset.zkVerr), verr.value);
    const anf = e.target.closest('[data-zk-anf-stand],[data-zk-anf-datum]');
    if (anf) return anfangsstandSpeichern(
      Number(anf.dataset.zkAnfStand || anf.dataset.zkAnfDatum));
  });

  async function verrechnungSetzen(id, modus) {
    const z = meters.find(m => m.id === id);
    const andere = meters.filter(m => m.id !== id);
    const haupt = z?.hauptzaehler_id || (andere[0] && andere[0].id) || null;
    const body = modus === 'frei'
      ? { typ: 'gemessen', hauptzaehler_id: null }
      : { typ: modus === 'rest' ? 'rest' : 'gemessen', hauptzaehler_id: haupt };
    try { await api(`/zaehler/${id}`, { method: 'PATCH', body }); await neuLaden(); }
    catch (fehler) { melde(fehler.message || 'Speichern fehlgeschlagen', 'neg'); }
  }

  async function anfangsstandSpeichern(id) {
    const s = dlg.querySelector(`[data-zk-anf-stand="${id}"]`);
    const d = dlg.querySelector(`[data-zk-anf-datum="${id}"]`);
    const roh = (s?.value || '').trim().replace(',', '.');
    if (roh === '') return;                          // leer → nichts speichern
    const stand = Number(roh);
    if (!Number.isFinite(stand)) return;
    const datum = d?.value || startISO;
    try {
      await api(`/zaehler/${id}/ablesungen`,
        { method: 'POST', body: { stand, datum, notiz: 'Anfangsstand' } });
      const z = meters.find(m => m.id === id);
      if (z) z.anfangsstand = { stand, datum };
      melde('✓ Anfangsstand gespeichert', 'pos');
    } catch (fehler) { melde(fehler.message || 'Speichern fehlgeschlagen', 'neg'); }
  }

  dlg.addEventListener('click', async e => {
    if (e.target.closest('[data-zk-schliessen]')) { dlg.close(); return; }
    if (e.target.closest('[data-zk-add]')) {
      try {
        await api(`/objekte/${slug}/zaehler`, { method: 'POST',
          body: { name: 'Neuer Zähler', messeinheit: 'm³', reihenfolge: meters.length } });
        await neuLaden();
      } catch (fehler) { melde(fehler.message || 'Anlegen fehlgeschlagen', 'neg'); }
      return;
    }
    const del = e.target.closest('[data-zk-del]');
    if (del) {
      const z = meters.find(m => m.id === Number(del.dataset.zkDel));
      const ja = await frage(`„${z?.name || 'Zähler'}" entfernen?`,
        'Der Zähler und seine Ablesungen werden gelöscht. Kostenpositionen und '
        + 'Belege bleiben unangetastet.', { knopf: 'Entfernen', gefahr: true });
      if (!ja) return;
      try { await api(`/zaehler/${del.dataset.zkDel}`, { method: 'DELETE' }); await neuLaden(); }
      catch (fehler) { melde(fehler.message || 'Löschen fehlgeschlagen', 'neg'); }
      return;
    }
    const bewegung = e.target.closest('[data-zk-up],[data-zk-down]');
    if (bewegung) return verschieben(
      Number(bewegung.dataset.zkUp || bewegung.dataset.zkDown),
      bewegung.dataset.zkUp ? -1 : 1);
  });

  async function verschieben(id, richtung) {
    const i = meters.findIndex(m => m.id === id);
    const j = i + richtung;
    if (i < 0 || j < 0 || j >= meters.length) return;
    const neu = [...meters];
    [neu[i], neu[j]] = [neu[j], neu[i]];
    meters = neu;
    render();                                        // sofort sichtbar
    try {
      await Promise.all(neu.map((m, k) => m.reihenfolge === k ? null
        : api(`/zaehler/${m.id}`, { method: 'PATCH', body: { reihenfolge: k } })));
      neu.forEach((m, k) => { m.reihenfolge = k; });
    } catch (fehler) { melde(fehler.message || 'Speichern fehlgeschlagen', 'neg'); }
  }

  render();
  dlg.showModal();
}

await laden();
</script>
