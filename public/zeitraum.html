<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Abrechnung · ImmoCalc</title>
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F6E5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ImmoCalc">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/immo.css">
<style>
  .banner{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;
          font:600 12px var(--mono);margin-bottom:16px;line-height:1.4}
  .banner .d{width:8px;height:8px;border-radius:50%;flex:none}
  .banner .days{margin-left:auto;font-weight:700;white-space:nowrap}
  .banner.pos{background:var(--pos-bg);color:var(--pos)} .banner.pos .d{background:var(--pos)}
  .banner.amber{background:var(--amber-bg);color:var(--amber)} .banner.amber .d{background:var(--amber)}
  .banner.neg{background:var(--neg-bg);color:var(--neg)} .banner.neg .d{background:var(--neg)}
  .banner.fertig{background:#EEF2F1;color:var(--soft)} .banner.fertig .d{background:var(--soft)}

  .fortschritt{background:var(--sheet);border-radius:14px;padding:15px 16px;margin-bottom:16px;
               box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .fortschritt .kopf{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .fortschritt .gross{font:700 19px var(--disp);letter-spacing:-.02em}
  .fortschritt .klein{font:500 12px var(--body);color:var(--soft)}
  .fortschritt .bahn{height:8px;border-radius:99px;background:#E4EAEA;overflow:hidden}
  .fortschritt .bahn i{display:block;height:100%;border-radius:99px;background:var(--teal)}

  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{flex:1;border:none;background:var(--sheet);color:var(--soft);border-radius:11px;
    padding:11px 8px;font:600 12.5px var(--disp);cursor:pointer;min-height:44px;
    box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .tabs button[aria-selected=true]{background:var(--teal-l);color:var(--teal-d)}

  /* Ablese-Wizard (CCXCIII) */
  .ablesebtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    border:1.5px solid #BFD9D1;background:var(--teal-l);color:var(--teal-d);border-radius:13px;
    padding:13px;min-height:48px;font:600 14px var(--disp);cursor:pointer;margin-bottom:14px}
  .ablesebtn:hover{background:#DCEDE7}
  .ablesebtn .si{font:400 18px var(--mono);line-height:1}
  .ablese-dlg{border:none;border-radius:18px;padding:0;max-width:440px;width:calc(100vw - 28px);
    background:var(--sheet);color:var(--ink);box-shadow:0 18px 50px rgba(22,38,44,.25)}
  .ablese-dlg::backdrop{background:rgba(22,38,44,.45)}
  .aw-kopf{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
  .aw-kopf .t{font:700 15px var(--disp);flex:1;min-width:0}
  .aw-x{border:none;background:var(--paper);width:32px;height:32px;border-radius:50%;
    font-size:18px;color:var(--ink);cursor:pointer;flex:none;line-height:1}
  .aw-bahn{height:6px;background:#E4EAEA;margin:0 18px;border-radius:99px;overflow:hidden}
  .aw-bahn i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .2s}
  .aw-schritt{font:600 11px var(--mono);color:var(--soft);padding:9px 18px 0}
  .aw-body{padding:4px 18px 14px}
  .aw-name{font:700 20px var(--disp);letter-spacing:-.01em;margin:4px 0 9px;line-height:1.15}
  .aw-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .aw-chips .c{font:600 11.5px var(--body);background:var(--paper);color:var(--soft);
    border-radius:99px;padding:4px 10px}
  .aw-vor{font:500 12.5px var(--body);color:var(--soft);margin-bottom:13px;line-height:1.5}
  .aw-vor strong{color:var(--ink)}
  .aw-feld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .aw-feld label{font:600 11px var(--mono);text-transform:uppercase;color:var(--soft);letter-spacing:.03em}
  .aw-feld input{border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;
    font:600 16px var(--body);background:var(--sheet);color:var(--ink);min-height:48px}
  .aw-feld input:focus{outline:none;border-color:var(--teal)}
  .aw-verb{font:600 12.5px var(--body);color:var(--teal-d);background:var(--teal-l);
    border-radius:11px;padding:10px 13px;margin-top:2px;line-height:1.45}
  .aw-fuss{display:flex;gap:10px;padding:12px 18px 18px}
  .aw-fuss button{flex:1;border-radius:12px;padding:13px;min-height:48px;
    font:600 14px var(--disp);cursor:pointer;border:none}
  .aw-zurueck{background:var(--paper);color:var(--ink)}
  .aw-zurueck[disabled]{opacity:.4;cursor:default}
  .aw-weiter{background:var(--teal);color:#fff}
  .aw-weiter[disabled]{opacity:.5;cursor:default}
  .aw-block{background:var(--paper);border-radius:13px;padding:12px 13px;margin-bottom:11px}
  .aw-bk{font:700 14px var(--disp);margin-bottom:8px}
  .aw-zeile{display:flex;justify-content:space-between;gap:10px;
    font:500 13px var(--body);padding:4px 0;border-top:1px solid var(--line)}
  .aw-zeile:first-of-type{border-top:none}
  .aw-zeile b{font-weight:700;white-space:nowrap}
  .aw-leer{font:500 12.5px var(--body);color:var(--soft);padding:2px 0}
  .aw-sk{display:flex;flex-direction:column;gap:6px;margin-top:10px;
    font:600 11px var(--mono);text-transform:uppercase;color:var(--soft);letter-spacing:.03em}
  .aw-select{border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;
    font:600 14px var(--body);background:var(--sheet);color:var(--ink);min-height:46px}
  .aw-select:focus{outline:none;border-color:var(--teal)}

  /* CCCLXXX — „Ablesewerte eingeben" und der Zahnrad-Knopf zum Konfigurieren
     stehen nebeneinander in einer Leiste. */
  .ablese-leiste{display:flex;gap:8px;margin-bottom:14px}
  .ablese-leiste .ablesebtn{flex:1;margin-bottom:0}
  .zk-gear{flex:none;width:48px;min-height:48px;display:flex;align-items:center;
    justify-content:center;border:1.5px solid #BFD9D1;background:var(--teal-l);
    color:var(--teal-d);border-radius:13px;cursor:pointer}
  .zk-gear:hover{background:#DCEDE7}
  .zk-gear svg{width:22px;height:22px;display:block}

  /* Zähler-Konfig-Maske (nutzt den Rahmen der Ablese-Maske: .ablese-dlg). */
  .zk-body{max-height:min(74dvh,620px);overflow:auto}
  .zk-intro{font:500 12.5px var(--body);color:var(--soft);line-height:1.5;
    margin:2px 0 12px}
  .zk-karte{background:var(--paper);border-radius:14px;padding:12px 12px 4px;
    margin-bottom:11px}
  .zk-kopf{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .zk-name{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;
    padding:10px 11px;font:700 14px var(--disp);background:var(--sheet);
    color:var(--ink);min-height:44px}
  .zk-name:focus{outline:none;border-color:var(--teal)}
  .zk-tools{display:flex;gap:4px;flex:none}
  .zk-ic{width:38px;height:38px;min-width:38px;border:none;border-radius:9px;
    background:var(--sheet);color:var(--soft);cursor:pointer;display:flex;
    align-items:center;justify-content:center;font:600 15px var(--body);line-height:1}
  .zk-ic:hover{background:#E1E8E6;color:var(--ink)}
  .zk-ic[disabled]{opacity:.35;cursor:default}
  .zk-ic.gefahr:hover{background:var(--neg-bg);color:var(--neg)}
  .zk-ic svg{width:16px;height:16px;display:block}
  .zk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:400px){ .zk-grid{grid-template-columns:1fr} }
  .zk-feld{display:flex;flex-direction:column;gap:5px;min-width:0;margin-bottom:9px}
  .zk-feld.voll{grid-column:1 / -1}
  .zk-feld label{font:600 9.5px var(--mono);text-transform:uppercase;
    letter-spacing:.05em;color:var(--soft)}
  .zk-feld select,.zk-feld input{border:1.5px solid var(--line);border-radius:10px;
    padding:9px 10px;font:600 13px var(--body);background:var(--sheet);
    color:var(--ink);min-height:44px;width:100%}
  .zk-feld select:focus,.zk-feld input:focus{outline:none;border-color:var(--teal)}
  .zk-anfang{display:flex;gap:8px;align-items:flex-end}
  .zk-anfang .zk-feld{flex:1;margin-bottom:9px}
  .zk-rest{font:500 11.5px var(--body);color:var(--teal-d);background:var(--teal-l);
    border-radius:9px;padding:8px 10px;margin:0 0 9px;line-height:1.45}
  .zk-add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    border:1.5px dashed var(--line);background:transparent;color:var(--teal-d);
    border-radius:13px;padding:12px;font:600 13px var(--disp);cursor:pointer;
    min-height:48px;margin-top:2px}
  .zk-add:hover{border-color:var(--teal);background:var(--teal-l)}
  .zk-leer{font:500 12.5px var(--body);color:var(--soft);line-height:1.5;
    padding:6px 2px 14px}

  .pruef{background:var(--sheet);border-radius:14px;margin-bottom:10px;overflow:hidden;
         box-shadow:0 1px 2px rgba(22,38,44,.05)}
  /* Gefüllte Zeile sanft grün herausheben: man sieht auf einen Blick, wo schon
     ein Betrag steht — und in welcher Höhe. Kein greller Block, sondern ein
     weicher Verlauf von links plus ein schmaler Akzent an der Kante. */
  .pruef.gefuellt{background:linear-gradient(100deg,var(--pos-bg) 0%,var(--sheet) 58%);
         box-shadow:inset 3px 0 0 var(--pos),0 1px 3px rgba(22,38,44,.07)}
  .pruef.gefuellt .wert{color:var(--pos)}
  /* CCLXXVIII — vorläufige (orange) Position aus einem Beleg: dieselbe Sprache
     wie die grüne „gefüllt"-Zeile, nur in Amber. Der Nutzer sieht auf einen
     Blick, dass hier noch eine Entscheidung aussteht — dezent, nicht grell.
     Amber übersticht Grün: eine bestätigte Position wird grün, hier ist noch
     nichts bestätigt. */
  .pruef.entwurf{background:linear-gradient(100deg,var(--amber-bg) 0%,var(--sheet) 60%);
         box-shadow:inset 3px 0 0 var(--amber),0 1px 3px rgba(22,38,44,.07)}
  .pruef.entwurf .wert{color:var(--amber)}
  .pruef.entwurf .ikon.fertig,.pruef.entwurf .ikon.warte{
         background:var(--amber-bg);color:var(--amber)}
  .pruef.entwurf .haken{background:var(--amber-bg);color:var(--amber)}
  /* Das kleine „Entwurf aus Beleg"-Etikett unter dem Namen — eine eigene Zeile,
     so breit wie sein Text, damit es nicht am Titel klebt. */
  .entw-badge{display:block;width:fit-content;max-width:100%;margin-top:6px;
    font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;
    color:var(--amber);background:var(--amber-bg);border-radius:7px;padding:4px 8px}
  /* Fuß der aufgeklappten Karte: primäre Aktion und der leise Zweitweg stehen
     nebeneinander in einer Zeile — „Fertig"/„Bestätigen" breit und teal, der
     Zweitweg dezent daneben. */
  .kartenfuss{display:flex;align-items:center;gap:10px;margin-top:18px}
  .hauptaktion{flex:1;min-width:0;border:none;border-radius:12px;padding:13px;
    font:600 14px var(--disp);cursor:pointer;min-height:48px;color:#fff;
    background:var(--teal)}
  .hauptaktion:hover{background:var(--teal-d)}
  .hauptaktion.ja{background:var(--pos)} .hauptaktion.ja:hover{background:#276b44}
  .hauptaktion[disabled]{opacity:.6;cursor:default}
  /* Zarte Textlinks: „Ableiten", „Zurück zum Prüfen", „Entfernen". Keine
     konkurrierenden Knöpfe, nur ruhige Zweitwege. Im Fuß mittig, nicht
     umbrechend, damit sie neben der breiten Hauptaktion sitzen. */
  .minilink{align-self:flex-start;border:none;background:transparent;
    color:var(--soft);text-decoration:underline;text-underline-offset:3px;
    cursor:pointer;font:600 12px var(--disp);padding:9px 2px;min-height:44px}
  .minilink:hover{color:var(--ink)}
  .minilink.gefahr:hover{color:var(--neg)}
  .kartenfuss .minilink{align-self:center;flex:none;white-space:nowrap;padding:9px 6px}
  /* Der Betrag lebt oben im Kopf: aufgeklappt ein schlankes Eingabefeld rechts
     (speichert beim Verlassen), sonst der lesbare Wert. Kein zweites, großes
     Feld mehr weiter unten. */
  .kopf-betrag{flex:none;width:118px;border:1.5px solid var(--line);
    border-radius:11px;padding:10px 11px;font:600 15px var(--body);min-height:44px;
    background:var(--sheet);color:var(--ink);text-align:right}
  .kopf-betrag:focus{outline:none;border-color:var(--teal)}
  /* Das Anlege-Betragsfeld einer Katalog-Kostenart (nur beim Neuanlegen). */
  .betragfeld{margin-top:2px}
  .betragfeld input{width:100%;border:1.5px solid var(--line);border-radius:12px;
    padding:13px 14px;font:600 17px var(--body);min-height:50px;
    background:var(--sheet);color:var(--ink)}
  .betragfeld input:focus{outline:none;border-color:var(--teal)}
  /* Aufteilung als €-Ergebnis je Partei; der Prozentanteil steht ruhig dahinter. */
  .rzp{color:var(--soft);font-weight:500;font-size:11px}
  .vt-gewichte{margin-top:4px}
  /* CCCLXI — Anteil je Zeile auch bei abgeleiteten Schlüsseln überschreibbar.
     Der €-Betrag bleibt die Leitzahl; das kleine Anteil-Feld sitzt ruhig und
     rechtsbündig daneben, ohne die Zahl von früher wiederzubeleben. */
  .rz.vt-abg{align-items:center}
  .rz.vt-abg .gn{flex:1;min-width:0;font:500 12.5px var(--body);
    hyphens:auto;overflow-wrap:anywhere}
  .rz.vt-abg .gsub{display:block;font:400 11px var(--body);color:var(--soft);
    margin-top:2px;line-height:1.35}
  .rz.vt-abg .vt-euro{flex:none;font:600 12.5px var(--mono);white-space:nowrap;
    color:var(--ink)}
  .rz.vt-abg .vt-euro .rzp{font-weight:500}
  .anteil-mini{flex:none;width:62px;border:1.5px solid var(--line);border-radius:9px;
    padding:8px 9px;font:600 12px var(--mono);min-height:44px;background:var(--sheet);
    color:var(--soft);text-align:right}
  .anteil-mini:focus{outline:none;border-color:var(--teal);color:var(--ink)}
  /* Einheit-Auswähler für „Nur eine Einheit/Person". */
  .einzel-wahl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  /* CCCLIX — Teilbetrag direkt auf eine Einheit. Zarter Zugang unter der
     Aufteilung; leiser Textlink, aufgeklappt Betrag · Einheit · §35a. */
  .vorab-link{align-self:flex-start;border:none;background:transparent;
    color:var(--soft);cursor:pointer;font:600 12px var(--disp);padding:9px 2px;
    min-height:44px;margin-top:6px;
    text-decoration:underline;text-underline-offset:3px}
  .vorab-link:hover{color:var(--teal-d)}
  .vorab{margin-top:10px;background:var(--paper);border-radius:12px;padding:12px 13px}
  .vorab-kopf{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .vorab-t{flex:1;min-width:0;font:600 10px var(--mono);letter-spacing:.06em;
    text-transform:uppercase;color:var(--soft)}
  .vorab-x{border:none;background:none;color:var(--soft);cursor:pointer;
    font:400 18px var(--body);line-height:1;padding:0;flex:none;
    width:32px;height:32px;border-radius:8px}
  .vorab-x:hover{color:var(--neg);background:rgba(178,66,41,.09)}
  .vorab-betrag{display:flex;align-items:center;gap:9px}
  .vorab-betrag input{flex:1;min-width:0;border:1.5px solid var(--line);
    border-radius:11px;padding:11px 12px;font:600 15px var(--body);min-height:46px;
    background:var(--sheet);color:var(--ink)}
  .vorab-betrag input:focus{outline:none;border-color:var(--teal)}
  .vorab-eur{font:600 11px var(--mono);color:var(--soft);flex:none;
    text-transform:uppercase;letter-spacing:.04em}
  /* Netto rein, Brutto (× 1,19) rechnet live daneben — ruhig teal, damit klar
     ist, welcher Betrag am Ende auf die Einheit geht. */
  .vorab-brutto{margin-top:8px;font:600 12.5px var(--body);color:var(--teal-d);
    background:var(--teal-l);border-radius:9px;padding:8px 11px;line-height:1.4}
  .vorab .einzel-wahl{margin-top:12px}
  .vorab-s35{display:flex;align-items:center;gap:10px;margin-top:12px;
    padding-top:10px;border-top:1px solid var(--line);
    font:500 12.5px var(--body);color:var(--ink);cursor:pointer;min-height:44px}
  .vorab-s35 input{width:20px;height:20px;flex:none}
  /* Die Vorab-Zeile ganz oben in der Aufteilung — ruhig, teal-getönt. */
  .vorab-zeile{color:var(--teal-d)}
  /* Fußzeile: was am Zeitraum hängt, und der ruhige Hinweis auf das
     automatische Entfernen — kein Löschknopf. */
  .zr-fuss{margin-top:18px;padding:14px 16px;border-radius:14px;
           background:var(--sheet);box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .zr-fuss .zeilen{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .zr-fuss .chip{font:600 11.5px var(--mono);padding:5px 10px;border-radius:999px;
                 background:#EDF1F0;color:var(--soft)}
  .zr-fuss .chip.hat{background:var(--pos-bg);color:var(--pos)}
  .zr-fuss .hinweis{font:400 12px var(--body);color:var(--soft);line-height:1.5}
  .pruef .zeile{display:flex;gap:12px;align-items:center;padding:13px 15px;
                width:100%;border:none;background:none;text-align:left;cursor:pointer;
                font-family:var(--body);color:inherit;min-height:44px}
  .pruef .zeile + .auf{border-top:1px solid var(--line)}
  .haken{width:24px;height:24px;border-radius:50%;flex:none;display:flex;
         align-items:center;justify-content:center;font:600 12px var(--mono)}
  .haken.gruen{background:var(--pos-bg);color:var(--pos)}
  .haken.rot{background:var(--neg-bg);color:var(--neg)}
  .haken.grau{background:#EDF1F0;color:var(--soft)}
  /* overflow-wrap: lange Begriffe wie "Gebäudeversicherung" schieben sonst
     den Betrag an sich heran, bis beides zusammenklebt. */
  /* hyphens vor overflow-wrap: so wird aus "Gebäudeversicherung" ein
     getrenntes "Gebäude-versicherung" statt eines Bruchs mitten im Wort.
     overflow-wrap bleibt als Notnagel fuer Woerter ohne Trennstelle. */
  .pruef .name{flex:1;min-width:0;font:600 14px var(--disp);letter-spacing:-.01em;
               hyphens:auto;overflow-wrap:break-word;padding-right:4px}
  .pruef .unter{display:block;font:400 11.5px var(--body);color:var(--soft);
                margin-top:3px;line-height:1.4;letter-spacing:0}
  .pruef .wert{flex:none;font:600 13px var(--mono);white-space:nowrap}
  /* Einheitliches Kategorie-Symbol; die Farbe traegt den Zustand. */
  .ikon{width:34px;height:34px;border-radius:10px;flex:none;display:flex;
        align-items:center;justify-content:center}
  .ikon svg{width:21px;height:21px;display:block}
  .ikon.fertig{background:var(--pos-bg);color:var(--pos)}
  .ikon.warte{background:#EDF1F0;color:var(--soft)}
  .pruef .wert.fehlt{color:var(--neg)}
  .pruef .auf{padding:0 15px 14px;border-top:1px solid var(--line)}
  .pruef .auf .zk{font:600 10px var(--mono);letter-spacing:.07em;text-transform:uppercase;
                  color:var(--soft);margin:12px 0 6px}
  .pruef .auf .rz{display:flex;justify-content:space-between;gap:10px;
                  font:500 12.5px var(--body);padding:4px 0}
  .pruef .auf .rz span:last-child{font-family:var(--mono);font-weight:600}
  /* Scan direkt in der Zeile: einladend, aber nicht grell — gedecktes Grün
     auf hellem Grund statt eines vollflächigen Knopfes. Steht neben dem
     Zeilenknopf, nicht darin: Knöpfe lassen sich nicht schachteln. */
  .pruef .kopf{display:flex;align-items:center;gap:8px;padding-right:15px}
  .pruef .kopf > .zeile{flex:1;min-width:0;padding-right:2px}
  .scanmini{display:flex;align-items:center;justify-content:center;gap:7px;flex:none;
    border:1.5px solid #BFD9D1;background:var(--teal-l);color:var(--teal-d);
    border-radius:11px;padding:9px 11px;cursor:pointer;font-family:var(--body);
    min-height:44px;min-width:44px}
  .scanmini:hover{background:#DCEDE7}
  .scanmini[disabled]{opacity:.65;cursor:default}
  .scanmini .si{font:400 15px var(--mono);line-height:1;flex:none}
  .scanmini .st{font:600 11.5px var(--disp);letter-spacing:-.005em;
                white-space:nowrap}
  /* „Aus Ablage" steht neben der Kamera, aber ruhiger (neutral statt Teal) —
     die zweite, sekundäre Art, einen Beleg an die Position zu holen. */
  .scanmini.ablage{border-color:var(--line);background:var(--sheet);color:var(--ink)}
  .scanmini.ablage:hover{background:var(--paper)}
  /* Auf dem Handy tragen die zwei Knöpfe nur ihr Symbol — sonst quetschen die
     Labels („Beleg erfassen" + „Aus Ablage") den Kostenart-Namen zeichenweise
     um. Erst ab Tablet-Breite ist Platz für die Beschriftung. */
  @media(max-width:560px){ .scanmini .st{display:none} }
  /* ---- NK-STRUKTUR: Bereiche, Zähler-Chip, Schlüsselwort ----------------- */
  /* Bereichs-Überschrift über einer Gruppe von Kostenzeilen: dezente
     Abtrennung, kleine gedeckte Mono-Marke — ordnet, ohne zu rufen. */
  .kat-kopf{display:flex;align-items:center;gap:10px;margin:20px 2px 8px}
  .kat-kopf span{font:600 10px var(--mono);letter-spacing:.09em;flex:none;
    text-transform:uppercase;color:var(--soft)}
  .kat-kopf::after{content:"";flex:1;height:1px;background:var(--line)}
  /* Zähler-Chip: der abgelesene Medienverbrauch an der Position — bewusst
     eigenständig (gedeckt-teal, mono, rund) und klar KEIN €-Betrag, damit er
     der Verteilung nicht widerspricht (Tooltip sagt es aus). */
  .mchip{display:inline-flex;align-items:center;vertical-align:middle;
    font:600 10.5px var(--mono);color:var(--teal-d);background:var(--teal-l);
    border-radius:999px;padding:2px 9px;margin-right:7px;white-space:nowrap}
  /* Verteilungsschlüssel als ein ruhiges Wort an der Zeile. */
  .vkey{display:inline-block;vertical-align:middle;margin-left:7px;
    font:600 10px var(--mono);letter-spacing:.02em;color:var(--soft);
    background:#EDF1F0;border-radius:6px;padding:2px 8px;white-space:nowrap}
  /* CCCLXIII — Anbieter/Gewerk: Tag in der Zeile + Setz-Feld in der Karte. */
  .anbieter-tag{flex:none;align-self:center;font:600 10px var(--mono);
    letter-spacing:.02em;color:var(--teal-d);background:var(--teal-l);
    border-radius:8px;padding:4px 8px;max-width:130px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .anbieterzeile{margin-top:10px}
  .anbieterzeile label{display:block;font:600 10px var(--mono);letter-spacing:.06em;
    text-transform:uppercase;color:var(--soft);margin-bottom:4px}
  .anbieterzeile input{width:100%;border:1.5px solid var(--line);border-radius:11px;
    padding:10px 12px;font-size:16px;background:var(--sheet);color:var(--ink)}
  .anbieterzeile input:focus{outline:none;border-color:var(--teal)}
  /* CCCLXII — Kostenart der Position wechseln (Wähler + Freitext für eine neue). */
  .kostenartzeile{margin-top:10px}
  .kostenartzeile label{display:block;font:600 10px var(--mono);letter-spacing:.06em;
    text-transform:uppercase;color:var(--soft);margin-bottom:4px}
  .kostenartzeile select,.kostenartzeile .ka-neu{width:100%;border:1.5px solid var(--line);
    border-radius:11px;padding:10px 12px;font-size:16px;background:var(--sheet);color:var(--ink)}
  .kostenartzeile select:focus,.kostenartzeile .ka-neu:focus{outline:none;border-color:var(--teal)}
  .kostenartzeile .ka-neu{margin-top:6px}
  .nachtrag{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .nachtrag input{flex:1;min-width:130px;border:1.5px solid var(--line);
    border-radius:10px;padding:10px 12px;
    font:500 14px var(--body);min-height:44px;background:var(--sheet)}
  .nachtrag input:focus{outline:none;border-color:var(--teal)}
  .nachtrag button{border:none;border-radius:10px;padding:10px 16px;background:var(--teal);
    color:#fff;font:600 13px var(--disp);cursor:pointer;min-height:44px}
  /* Den Betrag einer bestehenden Position ändern ist eine leise Korrektur, kein
     Haupt-Aufruf — grau statt grün, damit nur „Anlegen"/„Bestätigen" grün rufen. */
  .nachtrag button.leise{background:#EDF1F0;color:var(--ink)}
  .nachtrag button.leise:hover{background:#E1E8E6}
  /* Eine Kostenart aus dem Katalog, zu der es noch keine Position gibt:
     hier entsteht sie. Der Betrag ist freiwillig — wer den Beleg noch sucht,
     legt die Position leer an und trägt ihn später nach. */
  .neu .text{display:block;font:400 11.5px var(--body);color:var(--soft);
             line-height:1.45;margin:10px 0 0}
  /* Entfernen steht bewusst am Ende und leise: es ist die seltenste Handlung
     an einer Position und darf nicht neben „Übernehmen" um Klicks buhlen. */
  .entfernen{margin-top:12px;border:none;background:transparent;color:var(--soft);
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;
    font:600 12px var(--disp);padding:10px 2px;min-height:44px}
  .entfernen:hover{color:var(--neg)}
  /* Verteilung: Schlüssel wählen, Gewichte lesen und überschreiben.
     Die Zahl allein („Büro 4.1398") sagt niemandem etwas — erst Maßeinheit
     und Prozentanteil machen sie lesbar. */
  .vt{margin-top:2px}
  .vt .wahl{margin:6px 0 4px}
  .vt .hinweis{font:400 11.5px var(--body);color:var(--soft);line-height:1.45;
               margin:8px 0 2px}
  .gw{display:flex;align-items:center;gap:8px;padding:5px 0}
  .gw .gn{flex:1;min-width:0;font:500 12.5px var(--body);
          hyphens:auto;overflow-wrap:anywhere}
  .gw input{width:92px;flex:none;border:1.5px solid var(--line);border-radius:10px;
    padding:9px 10px;font:600 12.5px var(--mono);min-height:44px;
    background:var(--sheet);text-align:right;color:inherit}
  .gw input:focus{outline:none;border-color:var(--teal)}
  /* Ein Leerstand heißt wie seine Einheit („EG") und sähe sonst aus wie ein
     Mieter. Die Beischrift sagt, wer ihn trägt. */
  .gw .gsub{display:block;font:400 11px var(--body);color:var(--soft);
            margin-top:2px;line-height:1.35}
  .gw .gv{width:92px;flex:none;text-align:right;font:600 12.5px var(--mono)}
  .gw .gp{width:48px;flex:none;text-align:right;
          font:600 11.5px var(--mono);color:var(--soft)}
  .vt .knopfzeile{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .vt .knopfzeile button{border:none;border-radius:10px;padding:10px 14px;
    font:600 12.5px var(--disp);cursor:pointer;min-height:44px}
  .vt .leise{background:#EDF1F0;color:var(--ink)}
  .vt .leise:hover{background:#E1E8E6}
  .warnung{display:flex;gap:9px;align-items:flex-start;background:var(--neg-bg);
    color:var(--neg);border-radius:11px;padding:11px 12px;margin:10px 0 2px;
    font:500 11.5px var(--body);line-height:1.45}
  .warnung b{font-weight:700}
  .pdflink{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
    background:#F1F4F4;color:var(--ink);border-radius:10px;padding:9px 12px;
    font:600 11.5px var(--body);min-height:40px;margin-top:10px}
  .pdflink:hover{background:var(--teal-l);color:var(--teal-d)}
  .wiederauf{margin-top:12px;border:none;background:transparent;color:var(--soft);
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;
    font:600 12px var(--disp);padding:10px 2px;min-height:44px}
  .wiederauf:hover{color:var(--ink)}
  .belege{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
  .belege a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    background:#F1F4F4;color:var(--ink);border-radius:9px;padding:8px 11px;
    font:500 11.5px var(--body);min-height:36px}
  .belege a:hover{background:var(--teal-l);color:var(--teal-d)}
  .belege .kein{font:400 12px var(--body);color:var(--soft);line-height:1.45}
  /* CCLV — kostenfreie Belege als kleiner Anhänger („Kleideranhänger") am
     Kostenart-Thema. Dezent und gedeckt-grau, klar ohne Betrag — nie mit den
     grün gefüllten Kostenzeilen zu verwechseln. Sitzt unter der Kopfzeile und
     erscheint auch bei „offen"/„fehlt", weil er am Thema hängt, nicht an der
     Position. */
  .anh{display:flex;flex-wrap:wrap;gap:6px;padding:0 15px 12px}
  .anh-chip{display:inline-flex;align-items:center;max-width:100%;
            background:#EDF1F0;border-radius:9px;overflow:hidden}
  .anh-chip a{display:inline-flex;align-items:center;gap:5px;min-width:0;
              text-decoration:none;color:var(--soft);padding:7px 6px 7px 10px;
              min-height:32px;font:600 11px var(--mono)}
  .anh-chip a:hover{color:var(--teal-d)}
  .anh-chip svg{width:13px;height:13px;flex:none}
  .anh-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
  .anh-x{border:none;background:none;color:var(--soft);cursor:pointer;
         font:400 15px var(--body);line-height:1;padding:0 10px;
         align-self:stretch;min-width:34px}
  .anh-x:hover{color:var(--neg);background:rgba(178,66,41,.09)}
  /* Anhängen aus dem Bestand — leise und gestrichelt, im aufgeklappten Bereich. */
  .anh-verwalt{margin-top:14px}
  .anh-anbau{display:inline-flex;align-items:center;gap:7px;cursor:pointer;
             border:1.5px dashed var(--line);background:transparent;
             color:var(--soft);border-radius:11px;padding:10px 13px;
             font:600 12px var(--disp);min-height:44px}
  .anh-anbau:hover{border-color:var(--teal);color:var(--teal-d);background:var(--teal-l)}
  .anh-anbau svg{width:15px;height:15px;flex:none}
  .anh-hint{display:block;font:400 11px var(--body);color:var(--soft);
            line-height:1.45;margin-top:8px}
  /* Auswahl-Dialog der kostenfreien Belege aus dem Bestand. */
  .ahdlg .ahliste{max-height:min(50dvh,360px);overflow:auto;margin:6px 0 14px}
  .ahdlg .ahz{display:flex;align-items:center;gap:11px;width:100%;cursor:pointer;
              border:none;background:var(--sheet);border-radius:12px;
              padding:12px 13px;margin-bottom:8px;min-height:52px;text-align:left;
              font-family:var(--body);color:var(--ink);
              box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .ahdlg .ahz:hover{background:var(--teal-l)}
  .ahdlg .ahz svg{width:18px;height:18px;flex:none;color:var(--soft)}
  .ahdlg .ahn{flex:1;min-width:0;font:600 13px var(--body);overflow-wrap:anywhere}
  .ahdlg .ahsub{display:block;font:400 10.5px var(--mono);color:var(--soft);
                margin-top:2px}
  .ahdlg .ahleer{font:400 12.5px var(--body);color:var(--soft);line-height:1.55;
                 margin:4px 0 14px}
  /* Woraus die Summe entstanden ist (CLXXXII) — eine ruhige Zeile über den
     Belegen, damit vier Abschlagsrechnungen nicht als eine Zahl dastehen. */
  .zsumme{font:500 11.5px var(--mono);color:var(--teal-d);background:var(--teal-l);
          border-radius:9px;padding:8px 10px;margin-top:8px;line-height:1.5}
  /* ---- CXCIV: Sonderposten nur für eine Einheit ---- */
  .sonder .erklaer{display:block;font:400 11.5px var(--body);color:var(--soft);
    line-height:1.5;margin:0 0 12px}
  .sonder .starten{border:1.5px dashed var(--line);background:transparent;
    color:var(--teal-d);border-radius:12px;padding:12px 16px;width:100%;
    font:600 13px var(--disp);cursor:pointer;min-height:48px}
  .sonder .starten:hover{border-color:var(--teal);background:var(--teal-l)}
  .sonder .feldlabel{display:block;font:600 10px var(--mono);letter-spacing:.07em;
    text-transform:uppercase;color:var(--soft);margin:14px 0 8px}
  .sonder .einheiten{display:flex;flex-wrap:wrap;gap:8px}
  .ewahl{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;
    min-height:44px;padding:8px 15px;border:none;border-radius:999px;
    background:var(--paper);color:inherit;cursor:pointer;text-align:left;
    box-shadow:inset 0 1px 2px rgba(22,38,44,.05)}
  .ewahl .ename{font:600 13px var(--body);line-height:1.2}
  .ewahl .epartei{font:500 10px var(--mono);color:var(--soft);white-space:nowrap}
  .ewahl.an{background:var(--teal);box-shadow:none}
  .ewahl.an .ename{color:#fff}
  .ewahl.an .epartei{color:rgba(255,255,255,.8)}
  .sonder .abbrechen{margin-top:10px;border:none;background:transparent;
    color:var(--soft);text-decoration:underline;text-underline-offset:3px;
    cursor:pointer;font:600 12px var(--disp);padding:10px 2px;min-height:44px}
  .sonder .abbrechen:hover{color:var(--ink)}

  .karte{background:var(--sheet);border-radius:16px;padding:16px;margin-bottom:12px;
         box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .karte h3{font:600 13px var(--disp);margin:0 0 12px;
            display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .marke{font:600 9.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;
         border-radius:7px;padding:4px 7px;background:#EDF1F0;color:var(--soft)}
  .marke.gut{background:var(--teal-l);color:var(--teal-d)}
  .marke.post{background:var(--amber-bg);color:var(--amber)}
  /* An wen die Abrechnung geht — mehrere Adressen stehen alle da, sonst
     bliebe offen, wer sie außer dem Vertragspartner noch bekommt. */
  .wemgeht{font:400 11.5px var(--body);color:var(--soft);line-height:1.45;
           margin:-6px 0 12px;overflow-wrap:anywhere}
  .wemgeht.fehlt{color:var(--amber)}
  .summe{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
         font:500 13.5px var(--body);border-top:1px solid var(--line)}
  .summe:first-of-type{border-top:none}
  .summe b{font-family:var(--mono)}
  .summe.gesamt{font-weight:700;border-top:2px solid var(--line)}
  .summe .pos{color:var(--pos)} .summe .neg{color:var(--neg)}

  .sortleiste{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .sortleiste span{font:600 10px var(--mono);letter-spacing:.08em;
                   text-transform:uppercase;color:var(--soft);margin-right:2px}
  .sortleiste button{border:none;background:var(--sheet);color:var(--soft);
    border-radius:999px;padding:8px 13px;font:600 11.5px var(--disp);cursor:pointer;
    min-height:38px;box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .sortleiste button[aria-pressed=true]{background:var(--teal-l);color:var(--teal-d)}

  .abschluss{border-radius:16px;padding:18px;margin:16px 0 4px}
  .abschluss .at{font:700 16px var(--disp);letter-spacing:-.015em;margin-bottom:6px}
  .abschluss p{font:400 13px var(--body);margin:0 0 14px;line-height:1.5}
  .abschluss.bereit{background:var(--pos-bg);color:var(--pos)}
  .abschluss.offen{background:var(--sheet);color:var(--ink);
                   box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .abschluss.offen p{color:var(--soft)}
  .abschluss.fertig{background:#EEF2F1;color:var(--soft)}
  .abschluss.fertig p{color:var(--soft);margin-bottom:0}
  .uebergehen{display:flex;align-items:center;gap:10px;margin-bottom:14px;
              font:500 13px var(--body);color:var(--ink);cursor:pointer;min-height:44px}
  .uebergehen input{width:20px;height:20px;flex:none}
  .losbutton{width:100%;border:none;border-radius:12px;padding:15px;cursor:pointer;
    font:600 15px var(--disp);background:var(--pos);color:#fff;min-height:48px;
    box-shadow:0 6px 16px -8px rgba(46,125,79,.7)}
  .losbutton:hover{background:#276b44}
  .losbutton[disabled]{background:#C2CCCB;color:#fff;box-shadow:none;cursor:default}

  /* Versandplan vor dem Abschluss: eine Zeile je Partei, der Leerstand ruhig
     am Ende. Er ist kein Empfänger, sondern der Anteil des Eigentümers. */
  .vdlg .vliste{max-height:min(44dvh,330px);overflow:auto;margin:0 0 16px;
                background:var(--sheet);border-radius:12px}
  .vdlg .vz{display:flex;align-items:flex-start;gap:10px;padding:12px 13px}
  .vdlg .vz + .vz{border-top:1px solid var(--line)}
  .vdlg .vn{flex:1;min-width:0;font:600 13px var(--body);color:var(--ink);
            overflow-wrap:anywhere}
  .vdlg .vs{display:block;font:400 11px var(--body);color:var(--soft);
            margin-top:3px;line-height:1.45}
  .vdlg .vm{flex:none;margin-top:1px}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="back" id="back">Zurück</button>
    <div class="barwrap">
      <h1 id="titel">Abrechnung</h1>
      <div class="sub" id="sub">wird geladen …</div>
    </div>
  </div>

  <div class="scroll" id="inhalt"></div>
  <!-- Kamera fuer den Scan an einer offenen Position. capture=environment
       oeffnet auf iOS direkt die Ruecckamera. -->
  <input type="file" id="scanFeld" accept="image/*,application/pdf,.pdf" capture="environment" multiple
         style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"
         tabindex="-1" aria-hidden="true">

  <div data-nav></div>
</div>

<script type="module">
import { api, eur, eurKurz, esc, fristKlasse, melde, frage, belegAnsehen, installNav }
  from './assets/immo.js';
import { auswahlfeld } from './assets/auswahl.js';
import { sankey } from './assets/charts.js';
import { kostenIcon } from './assets/kostenicons.js';
import { scanZuPdf, lesbareGroesse } from './assets/scan.js';
installNav();

const zid = new URLSearchParams(location.search).get('z');
const inhalt = document.getElementById('inhalt');
const titel = document.getElementById('titel');
const sub = document.getElementById('sub');
let daten = null;
/* Welche Verteilungsschlüssel für dieses Objekt taugen und welche Gewichte
   sie ergäben — die Vorschau, bevor man sich festlegt. */
let schluessel = null;
/* CCLV — kostenfreie Themen-Anhänger: was am Zeitraum hängt (nach Kostenart
   gruppiert) und welche kostenfreien Belege sich noch anhängen ließen. */
let anhaenger = null;
/* Welche Zeilen der Verteilung kein Mieter sind, sondern unbelegte Zeit. Die
   Schlüssel-Vorschau nennt sie je Schlüssel; zusammen sind das die Leerstände
   des Zeitraums. Ohne diese Kennzeichnung liest sich der Anteil, den der
   Eigentümer selbst trägt, wie eine Partei namens „EG". */
let leerstaende = new Set();
let ansicht = 'pruef';
let sortierung = 'status';
const offen = new Set();
/* „Nur eine Einheit/Person" ist Teil der Verteilungs-Auswahl geworden. Diese
   Variable merkt sich, für welche Position der Einheit-Auswähler offen ist,
   solange noch keine Einheit gesetzt wurde. */
let einzelWahl = null;
/* CCCLIX — für welche Position der „Teilbetrag direkt auf eine Einheit"-Zugang
   offen ist, obwohl noch kein Vorab-Betrag gesetzt wurde. Ist einer gesetzt,
   ist der Bereich ohnehin offen. */
const vorabOffen = new Set();

/* Welche Position gerade einen Beleg erwartet — gesetzt beim Klick auf den
   Scan-Knopf, gelesen, wenn die Kamera zurückkommt. */
let scanZiel = null;

/* NK-STRUKTUR — die Ablese-Maske (Zähler samt interpoliertem Verbrauch) und
   daraus der Chip je Kostenart. Beiwerk: fehlt sie, bleibt die Checkliste ohne
   Chips bedienbar. */
let ablesungMaske = null;
let chipMap = new Map();

/* Geräte ohne Kamera (Schreibtisch, Maus): dort genügt EIN neutraler Knopf, der
   den lokalen Datei-Dialog öffnet — die „Beleg erfassen"-Kamera hätte hier
   nichts aufzunehmen. Auf Touch-Geräten bleiben beide Wege. */
const KEINE_KAMERA = window.matchMedia('(pointer: fine)').matches;

const SORTIERUNG = {
  status: (a, b) => Number(a.erledigt) - Number(b.erledigt) ||
                    (b.betrag || 0) - (a.betrag || 0),
  betrag: (a, b) => (b.betrag || 0) - (a.betrag || 0),
  name: (a, b) => a.kostenart.localeCompare(b.kostenart, 'de'),
};

document.getElementById('back').addEventListener('click', () => history.length > 1
  ? history.back() : location.href = 'index.html');

const HAKEN = {
  erledigt: ['gruen', '✓'],
  offen: ['rot', '!'],
  fehlt: ['grau', '–'],
};

function bannerHtml() {
  if (daten.status !== 'in Arbeit') {
    return `<div class="banner fertig"><span class="d"></span>
      <span>Abgeschlossen · ${esc(daten.label)}</span></div>`;
  }
  const k = fristKlasse(daten.frist_tage);
  const tage = daten.frist_tage < 0
    ? `${Math.abs(daten.frist_tage)} Tage über` : `noch ${daten.frist_tage} Tage`;
  return `<div class="banner ${k}"><span class="d"></span>
    <span>Frist § 556 BGB</span><span class="days">${tage}</span></div>`;
}

/* Welche Belege zu einer Position gehören.

   CLXXXIII: die belastbare Auskunft steht seit dem Übernehmen an den Belegen
   selbst (`position_id`) und kommt als `k.belege` mit — sie überlebt eine
   umbenannte Kostenart und trägt den Betrag, mit dem der Beleg in der Summe
   steckt. Erst danach greifen die beiden alten Wege: die Gruppierung nach
   Dokumentart und, für Scans aus der Checkliste, der Dateiname. */
function belegeZu(k) {
  if (k.belege?.length) return k.belege;
  const gruppe = (daten.belege_je_art || {})[k.kostenart];
  if (gruppe?.length) return gruppe;
  const stamm = k.kostenart.toLowerCase().split(/[ /]/)[0];
  return (daten.dokumente || []).filter(d =>
    (d.dateiname || '').toLowerCase().includes(stamm));
}

/* `data-name` statt der Beschriftung: seit der Betrag mit im Text steht,
   hiesse der Beleg im Dialog sonst „…pdf · 1.284,50 €". */
const belegLinks = (liste, extra = '') => `<div class="belege">${liste.map(d =>
  `<a href="#" data-beleg="${d.id}" data-name="${esc(d.dateiname)}"
      title="${esc(d.pfad)}">PDF · ${esc(d.dateiname)}${
    d.betrag ? ` · ${eur(d.betrag)}` : ''}</a>`
).join('')}${extra}</div>`;

/* Woraus der Betrag besteht. Vier Abschlagsrechnungen ergeben eine Position
   (CLXXXII) — ohne diesen Satz stünde dort nur eine Summe, die niemand mehr
   auf ihre Belege zurückführen kann. */
function zusammensetzungHtml(k) {
  if (!k.beleg_summe) return '';
  const anzahl = (k.belege || []).length;
  // „aus" verlangt den Dativ: aus einem Beleg, aus zwei Belegen.
  const teile = [`${anzahl} ${anzahl === 1 ? 'Beleg' : 'Belegen'} · ${eur(k.beleg_summe)}`];
  if (k.handanteil) teile.push(`${eur(k.handanteil)} von Hand`);
  return `<div class="zsumme">Summe aus ${teile.join(' · ')}</div>`;
}

function belegeHtml(k, extra = '') {
  const alle = belegeZu(k);
  if (!alle.length) {
    return `<div class="belege"><span class="kein">Kein Beleg hinterlegt —
      im Eingang lässt sich einer übernehmen.</span>${extra}</div>`;
  }
  return zusammensetzungHtml(k) + belegLinks(alle, extra);
}

/* CCLV — der kleine Anhänger („Kleideranhänger"): ein flaches Etikett-Symbol
   im bestehenden Strichstil, kein Emoji. */
const ANH_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
  aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.4-7.4A2 2
  0 0 1 2.6 11.8V4.8a2 2 0 0 1 2-2h7a2 2 0 0 1 1.4.6l7.4 7.4a2 2 0 0 1 0
  2.8Z"/><circle cx="7.8" cy="7.8" r="1.4"/></svg>`;

/* Der Dateiname als kurze Chip-Beschriftung: Endung, führendes Datum und ein
   etwaiger Betrag hinten fallen weg — übrig bleibt die Sache selbst. */
const kurzBeleg = name => (name || '')
  .replace(/\.[^.]+$/, '')
  .replace(/^\d{4}(-\d{2})?[_-]/, '')
  .replace(/_-?\d[\d.,]*\s*€$/, '')
  .replace(/[_-]+/g, ' ')
  .trim() || (name || 'Beleg');

const anhaengerZu = kostenart => (anhaenger?.angehaengt || {})[kostenart] || [];

/* Normalisiert einen Namen für den Vergleich „sagt das dasselbe wie die
   Kostenart?" — Kleinschreibung, ein führendes „NK"/„Nebenkosten" weg, alle
   Trenn- und Satzzeichen raus. */
const normThema = s => (s || '').toLowerCase()
  .replace(/^(nk|nebenkosten)\b[\s·:.,–-]*/, '')
  .replace(/[^a-zäöüß0-9]+/g, '');

/* Ein Anhänger-Etikett verdient seinen Chip nur, wenn es etwas Neues sagt —
   nicht, wenn sein Kern bloß den Kostenart-Namen wiederholt (Beleg „NK
   Schornsteinfeger" an der Position „Schornsteinfeger"). */
const anhaengerSagtNeues = (dateiname, kostenart) => {
  const kern = normThema(kurzBeleg(dateiname));
  return kern !== '' && kern !== normThema(kostenart);
};

/* Die Chip-Leiste unter der Kopfzeile: je Anhänger ein gedeckter Chip
   (antippen → ansehen) und, solange der Zeitraum in Arbeit ist, ein leises ×
   zum Lösen. Sie erscheint unabhängig davon, ob es eine Kostenposition gibt. */
function anhaengerStrip(k) {
  // Nur Anhänger zeigen, die etwas Neues sagen — ein Chip, der bloß den
  // Kostenart-Namen doppelt, wird weggelassen (kein zweiter Titel unter dem Titel).
  const liste = anhaengerZu(k.kostenart)
    .filter(d => anhaengerSagtNeues(d.dateiname, k.kostenart));
  if (!liste.length) return '';
  const bearbeitbar = daten.status === 'in Arbeit';
  const chips = liste.map(d => `
    <span class="anh-chip">
      <a href="#" data-beleg="${d.id}" data-name="${esc(d.dateiname)}"
         title="${esc(d.pfad)} · Zusatzbeleg ohne Kostenanteil">${ANH_ICON}<span
         class="anh-t">${esc(kurzBeleg(d.dateiname))}</span></a>
      ${bearbeitbar ? `<button class="anh-x" data-anh-loesen="${d.id}"
        title="Anhänger lösen" aria-label="Anhänger von ${esc(k.kostenart)} lösen"
        >×</button>` : ''}
    </span>`).join('');
  return `<div class="anh">${chips}</div>`;
}

const schluesselMeta = wert =>
  (schluessel?.schluessel || []).find(s => s.wert === wert) || null;

const prozentText = (wert, summe) =>
  summe > 0 ? `${(Number(wert || 0) / summe * 100).toFixed(1)} %` : '—';

/* ---- NK-STRUKTUR — Bereiche, Zähler-Chip, Schlüsselwort ------------------ */

/* Umlaut-tolerant + case-insensitiv: für den Wortvergleich der Bereiche und der
   Zähler-Zuordnung. */
const normUml = s => (s || '').toLowerCase()
  .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');

/* Fünf Bereiche in fester Anzeige-Reihenfolge. Geprüft wird Bereich 2 (Heizung/
   Warmwasser) VOR Bereich 1, damit „Warmwasser" zu 2 fällt und nicht zu 1. */
const BEREICHE = [
  { titel: 'Wasser & Abwasser',
    muster: ['wasser', 'abwasser', 'kanal', 'niederschlag', 'entwaesser'] },
  { titel: 'Heizung & Warmwasser',
    muster: ['heiz', 'oel', 'gas', 'fernwaerme', 'warmwasser', 'brennstoff'] },
  { titel: 'Strom & Beleuchtung',
    muster: ['strom', 'beleucht'] },
  { titel: 'Reinigung & Außenanlagen',
    muster: ['reinig', 'winterdienst', 'streu', 'garten', 'gruenpflege', 'muell',
             'entsorg', 'hausmeist', 'hauswart', 'schornstein', 'kamin', 'aufzug',
             'fahrstuhl'] },
  { titel: 'Verwaltung & Sonstiges', muster: [] },
];
// Prüf-Reihenfolge: Bereich 2 (Heizung) zuerst, dann 1, dann 3, 4; Rest → 5.
const BEREICH_PRUEF = [1, 0, 2, 3];

function bereichIndex(kostenart) {
  const n = normUml(kostenart);
  for (const i of BEREICH_PRUEF) {
    if (BEREICHE[i].muster.some(m => n.includes(m))) return i;
  }
  return 4;
}

/* Eine reine Zähler-Kostenart (Name enthält „zähler") OHNE Betrag UND OHNE
   Position ist keine Kostenposition — sie entfällt als Zeile. Steht ein Betrag
   oder eine Position dahinter (z. B. „Kaltwasserzähler · 51,41 €"), bleibt sie
   eine ganz normale Kostenzeile. Defensiv, damit echte Kosten nie verschwinden. */
/* Zähler-Zuordnung über den Namen, wenn am Zähler keine Kostenart hängt. */
function zaehlerNameZuKostenart(name) {
  const n = normUml(name);
  if (n.includes('warmwasser')) return 'Warmwasser';
  if (n.includes('wasser')) return 'Wasser';
  if (n.includes('oel')) return 'Heizkosten';
  if (n.includes('strom')) return 'Allgemeinstrom';
  return '';
}

/* Der abgelesene Medienverbrauch je Kostenart — mehrere Zähler derselben
   Kostenart werden summiert. KEIN Verteilungsgewicht: er beschreibt die
   Messung, nicht die Aufteilung. */
function baueChipMap() {
  const map = new Map();
  for (const z of (ablesungMaske?.zaehler || [])) {
    if (z.verbrauch == null) continue;
    const ziel = z.kostenart || zaehlerNameZuKostenart(z.name);
    if (!ziel) continue;
    const cur = map.get(ziel) || { verbrauch: 0, messeinheit: z.messeinheit };
    cur.verbrauch += z.verbrauch;
    map.set(ziel, cur);
  }
  return map;
}

/* Liter kurz als „l"; m³/kWh bleiben, wie sie sind. */
const chipEinheit = e => (e === 'Liter' ? 'l' : e);
/* Der Verbrauch im Chip auf ganze Einheiten gerundet — kompakt (1.237 m³), die
   Nachkommastellen leben in der Ablese-Maske. */
const chipZahl = n => Math.round(n || 0).toLocaleString('de-DE');

/* Der runde Zähler-Chip vor dem Namen. Der Tooltip stellt klar, dass hier der
   abgelesene Verbrauch steht — nicht die Verteilungsgewichte der Position. */
function chipHtml(k) {
  const c = chipMap.get(k.kostenart);
  if (!c) return '';
  return `<span class="mchip" title="Zählerstand · abgelesener Verbrauch im ` +
    `Zeitraum — nicht die Verteilungsgewichte">${chipZahl(c.verbrauch)}&nbsp;${
      esc(chipEinheit(c.messeinheit))}</span>`;
}

/* CCCLXII — die Kostenarten des Objekts (Katalog-Zeilen mit kostenart_id) als
   Optionen für den Umhäng-Wähler. Die eigene Art ist immer dabei, auch wenn sie
   (noch) keine Katalog-Art ist; zuletzt „＋ Neue Kostenart …" als Freitext-Weg. */
function artOptionen(aktuell) {
  const namen = new Set();
  for (const k of (daten.checkliste || [])) if (k.kostenart_id) namen.add(k.kostenart);
  namen.add(aktuell);
  const opts = [...namen].sort((a, b) => a.localeCompare(b, 'de'))
    .map(n => `<option value="${esc(n)}"${n === aktuell ? ' selected' : ''}>${esc(n)}</option>`)
    .join('');
  return opts + '<option value="__neu__">＋ Neue Kostenart …</option>';
}

/* Der Verteilungsschlüssel als ein ruhiges Wort an der Zeile. Bei „nur eine
   Einheit" steht dort „1 Einheit" statt eines Schlüssels. */
function schluesselWort(k) {
  if (!k.position_id) return '';
  if (k.nur_einheit) return '1 Einheit';
  if (!k.schluessel) return '';
  return schluesselMeta(k.schluessel)?.titel || k.schluessel;
}

/* Warum eine Einheit zweimal in der Verteilung steht: war sie nur einen Teil
   des Zeitraums vermietet, trägt der Mieter seine Wohndauer und der Eigentümer
   die leere Zeit. Ohne diesen Satz sieht das nach einer doppelten Zeile aus. */
function doppelteEinheit(namen) {
  const einheit = new Map(
    (schluessel?.parteien || []).map(p => [p.partei, p.einheit]));
  const doppelt = namen.filter(n => leerstaende.has(n) && einheit.get(n)
    && namen.some(m => m !== n && einheit.get(m) === einheit.get(n)));
  if (!doppelt.length) return '';
  return `<div class="hinweis">${doppelt.map(esc).join(', ')}: vermietete Zeit
    und Leerstand getrennt.</div>`;
}

/* Welche Schlüssel sich aus den Stammdaten ergeben (verteilung.py: ableitbar).
   Bei ihnen zeigt die Karte nur das €-Ergebnis; die Roh-Gewichte kommen erst
   hinter „Anpassen". Manuelle Schlüssel (Verbrauch/Prozent/Individuell) müssen
   direkt eingegeben werden. */
const ABGELEITET = new Set(['flaeche', 'personen', 'einheiten', 'bewohnermonate']);
/* Der Sonder-Eintrag am Ende der „Verteilen nach"-Auswahl. */
const NUR_EINHEIT_WAHL = '__nur_einheit__';

/* Die Einheit-Chips des Objekts für „Nur eine Einheit/Person" — dieselbe
   Datenquelle wie der frühere Sonderposten-Bereich. */
function einheitChips(pid, aktuell) {
  if (daten.status !== 'in Arbeit') return '';
  return sonderEinheiten().map(e => `
    <button type="button" class="ewahl${e.einheit === aktuell ? ' an' : ''}"
        data-einzel-pid="${pid}" data-einzel-einheit="${esc(e.einheit)}"
        aria-pressed="${e.einheit === aktuell}">
      <span class="ename">${esc(e.einheit)}</span>
      ${e.parteien.length
        ? `<span class="epartei">${esc(e.parteien.join(' · '))}</span>` : ''}
    </button>`).join('');
}

/* CCCLIX — der Vorab-Anteil ist nur dann wirksam (und wird nur dann von der
   Verteilung abgezogen), wenn ein Betrag > 0 UND eine Einheit gesetzt sind —
   genau wie es die Engine handhabt. */
const vorabAktiv = k => (k.vorab_betrag || 0) > 0 && !!(k.vorab_einheit || '');

/* Netto → Brutto: 19 % dazu, kaufmännisch auf den Cent gerundet — genau der
   Wert, der als vorab_betrag gespeichert wird und sich oben vom Gesamtbetrag
   abzieht. Der Nutzer gibt netto ein, brutto rechnet live daneben. */
const vorabBrutto = netto => Math.round((Number(netto) || 0) * 1.19 * 100) / 100;
const bruttoAnzeige = netto => (Number(netto) || 0) > 0
  ? `= ${eur(vorabBrutto(netto))} brutto (19 %)`
  : 'netto eingeben — Brutto rechnet 19 % dazu';

/* Die ruhige Extra-Zeile ganz oben in der Aufteilung: „Vorab → 1. OG · §35a"
   mit dem €-Betrag rechts. Nur wenn ein Teilbetrag wirklich abgezweigt wird. */
function vorabZeileHtml(k) {
  if (!vorabAktiv(k)) return '';
  return `<div class="rz vorab-zeile">
      <span>→ ${esc(k.vorab_einheit)}${k.vorab_s35
        ? '<span class="rzp"> · §35a</span>' : ''}</span>
      <span>− ${eur(k.vorab_betrag)}</span>
    </div>`;
}

/* Der zarte Zugang „Teilbetrag direkt auf eine Einheit" (nur bearbeitbar und
   nicht im Einzel-Modus). Geschlossen ein leiser Link; offen ein kleines
   Betragsfeld, der Einheit-Auswähler und der §35a-Schalter — alles
   auto-speichernd. Offen, sobald ein Vorab-Betrag gesetzt ist. */
function vorabHtml(k) {
  if (daten.status !== 'in Arbeit') return '';
  const offenJetzt = (k.vorab_betrag || 0) > 0 || (k.vorab_netto || 0) > 0
    || vorabOffen.has(k.position_id);
  if (!offenJetzt) {
    return `<button class="vorab-link" data-vorab-oeffnen="${k.position_id}"
      >＋ Teilbetrag direkt auf eine Einheit</button>`;
  }
  const chips = sonderEinheiten().map(e => `
    <button type="button" class="ewahl${e.einheit === k.vorab_einheit ? ' an' : ''}"
        data-vorab-einheit-pid="${k.position_id}" data-vorab-einheit="${esc(e.einheit)}"
        aria-pressed="${e.einheit === k.vorab_einheit}">
      <span class="ename">${esc(e.einheit)}</span>
      ${e.parteien.length
        ? `<span class="epartei">${esc(e.parteien.join(' · '))}</span>` : ''}
    </button>`).join('');
  const netto = k.vorab_netto || 0;
  const brutto = k.vorab_betrag || 0;
  const hat = netto > 0 || brutto > 0;
  return `<div class="vorab">
      <div class="vorab-kopf">
        <span class="vorab-t">Teilbetrag direkt auf eine Einheit</span>
        <button class="vorab-x" data-vorab-entfernen="${k.position_id}"
          data-hat="${hat ? '1' : ''}" aria-label="Teilbetrag entfernen">×</button>
      </div>
      <div class="vorab-betrag">
        <input type="number" step="0.01" min="0" inputmode="decimal"
               placeholder="Netto" value="${netto > 0 ? netto : ''}"
               data-vorab-netto="${k.position_id}"
               aria-label="Teilbetrag netto in Euro">
        <span class="vorab-eur">€ netto</span>
      </div>
      <div class="vorab-brutto" data-vorab-brutto="${k.position_id}"
        >${bruttoAnzeige(netto)}</div>
      <div class="einzel-wahl">${chips}</div>
      <label class="vorab-s35">
        <input type="checkbox" data-vorab-s35="${k.position_id}"
               ${k.vorab_s35 ? 'checked' : ''}>
        <span>§35a absetzbar</span>
      </label>
    </div>`;
}

/* Verteilung einer Position: „Verteilen nach" (Schlüssel oder „Nur eine
   Einheit/Person") und darunter die Aufteilung. */
function verteilungHtml(k) {
  if (!k.position_id) return '';
  const bearbeitbar = daten.status === 'in Arbeit';
  const einzelOffen = k.nur_einheit || einzelWahl === k.position_id;
  const wahlWert = einzelOffen ? NUR_EINHEIT_WAHL : (k.schluessel || '');
  const wahl = bearbeitbar
    ? `<div class="wahl" data-schluesselwahl="${k.position_id}"
         data-wert="${esc(wahlWert)}"></div>` : '';

  // „Nur eine Einheit/Person": kein Schlüssel, 100 % auf eine Einheit.
  if (einzelOffen) {
    const traeger = Object.keys(k.anteile || {});
    return `<div class="vt" data-pid="${k.position_id}">
        <div class="zk">Verteilen nach</div>
        ${wahl}
        <div class="einzel-wahl">${einheitChips(k.position_id, k.nur_einheit)}</div>
        ${k.nur_einheit ? `<div class="zsumme">Zu 100 % auf ${esc(k.nur_einheit)}${
          traeger.length ? ` · ${traeger.map(esc).join(' · ')}` : ''}</div>` : ''}
        ${k.nur_einheit && !traeger.length ? `<div class="warnung"><span>▲</span>
          <span><b>Keine Partei für ${esc(k.nur_einheit)}.</b></span></div>` : ''}
      </div>`;
  }

  const meta = schluesselMeta(k.schluessel);
  const eintraege = Object.entries(k.anteile || {});
  const summe = eintraege.reduce((s, [, w]) => s + Number(w || 0), 0);
  const einheit = k.anteile_einheit || meta?.einheit || '';
  const abzuleiten = meta?.moeglich ? Object.entries(meta.gewichte) : [];
  const gleich = abzuleiten.length === eintraege.length &&
    abzuleiten.every(([p, w]) => Number(k.anteile?.[p] ?? NaN) === Number(w));
  // Nicht ableitbar → Parteien mit 0 anbieten, damit man von Hand füllen kann.
  const felder = eintraege.length || !bearbeitbar ? eintraege
    : (schluessel?.parteien || []).map(p => [p.partei, 0]);
  // Die €-Beträge beziehen sich auf den Rest (Betrag − Vorab-Brutto, CCCLX),
  // damit Vorab-Zeile + Rest den vollen Positionsbetrag ergeben.
  const rest = (k.betrag || 0) - (vorabAktiv(k) ? k.vorab_betrag : 0);

  const gwRows = felder.map(([p, w]) => `
    <div class="gw">
      <span class="gn">${esc(p)}${leerstaende.has(p)
        ? '<span class="gsub">Leerstand · Eigentümer</span>' : ''}</span>
      ${bearbeitbar
        ? `<input type="number" step="0.0001" min="0" value="${Number(w)}"
                 data-gewicht="${esc(p)}"
                 aria-label="Gewicht ${esc(p)}${einheit ? ` in ${esc(einheit)}` : ''}">`
        : `<span class="gv">${Number(w).toLocaleString('de-DE')}</span>`}
      <span class="gp" data-anteil>${prozentText(w, summe)}</span>
    </div>`).join('');

  // Ableiten bleibt als leiser Textlink erhalten (kein Umschalten mehr).
  const ableiten = bearbeitbar && abzuleiten.length && !gleich
    ? `<button class="minilink" data-ableiten="${k.position_id}"
        data-fuer="${esc(k.schluessel || '')}">${eintraege.length
          ? 'Aus Stammdaten neu ableiten' : 'Aus Stammdaten ableiten'}</button>` : '';

  const abgeleitet = ABGELEITET.has(k.schluessel);
  let aufteilung;
  if (abgeleitet && eintraege.length) {
    // Abgeleiteter Schlüssel: der €-Betrag je Partei bleibt die Leitzahl (samt
    // Prozent). Zusätzlich ein kleines, dezentes Anteil-Feld rechts, mit dem
    // sich einzelne Anteile überschreiben lassen (z. B. eine Partei auf 0) —
    // über denselben data-gewicht-Mechanismus wie die manuellen Schlüssel.
    const euroRows = felder.map(([p, w]) => {
      const euro = summe > 0 ? rest * (Number(w) || 0) / summe : 0;
      return `<div class="rz vt-abg"><span class="gn">${esc(p)}${leerstaende.has(p)
          ? '<span class="gsub">Leerstand · Eigentümer</span>' : ''}</span>
        <span class="vt-euro"><span data-euro>${eur(euro)}</span>
          <span class="rzp" data-anteil>${prozentText(w, summe)}</span></span>
        ${bearbeitbar
          ? `<input class="anteil-mini" type="number" step="0.0001" min="0"
                    inputmode="decimal" value="${Number(w)}" data-gewicht="${esc(p)}"
                    aria-label="Anteil ${esc(p)}${einheit ? ` in ${esc(einheit)}` : ''}">`
          : ''}
      </div>`;
    }).join('');
    aufteilung = `<div class="vt-ergebnis">${euroRows}</div>${
      bearbeitbar ? ableiten : ''}`;
  } else {
    // Manueller Schlüssel (Verbrauch/Prozent/Individuell): die Eingabefelder
    // direkt zeigen — die braucht man hier wirklich.
    aufteilung = `<div class="vt-gewichte">${gwRows}${ableiten}</div>`;
  }

  // Ausgangswerte für die Änderungserkennung beim Auto-Speichern.
  const basis = esc(JSON.stringify(Object.fromEntries(
    felder.map(([p, w]) => [p, Number(w) || 0]))));

  return `<div class="vt" data-pid="${k.position_id}" data-basis="${basis}"
      data-rest="${rest}">
      <div class="zk">Verteilen nach</div>
      ${wahl}
      ${k.ohne_verteilung ? `<div class="warnung"><span>▲</span>
        <span><b>Ohne Gewichte fließen die ${eur(k.betrag)} mit 0,00 € ein.</b>
        </span></div>` : ''}
      <div class="zk">Aufteilung</div>
      ${vorabZeileHtml(k)}
      ${aufteilung}
      ${doppelteEinheit(felder.map(([p]) => p))}
      ${vorabHtml(k)}
    </div>`;
}

function zeileHtml(k, i) {
  const [farbe, zeichen] = HAKEN[k.zustand] || HAKEN.fehlt;
  const wert = eur(k.betrag);
  const aufgeklappt = offen.has(i);

  // Nur ein kurzer Zustandshinweis, wo wirklich etwas fehlt — kein Sermon.
  const infos = [
    k.zustand === 'offen' ? 'Betrag fehlt' : null,
    k.ohne_verteilung ? 'Verteilung fehlt' : null,
  ].filter(Boolean).join(' · ');

  return zeileInner(k, i, aufgeklappt, infos, wert, farbe, zeichen);
}

// Fußzeile des Zeitraums: was hängt dran — und der ruhige Hinweis, dass ein
// leerer Zeitraum von selbst verschwindet (statt eines Löschknopfs).
function zeitraumFussHtml() {
  const v = daten.verknuepft || {};
  const chips = [
    ['Positionen', v.positionen || 0],
    ['Belege', v.belege || 0],
    ['Vorauszahlungen', v.vorauszahlungen || 0],
  ];
  const leer = chips.every(([, n]) => n === 0);
  return `<div class="zr-fuss">
    <div class="zeilen">${chips.map(([l, n]) =>
      `<span class="chip${n > 0 ? ' hat' : ''}">${n}&nbsp;${l}</span>`).join('')}</div>
    <div class="hinweis">${leer
      ? 'An diesem Zeitraum hängt nichts mehr — beim nächsten Aufräumen verschwindet er automatisch.'
      : 'Nimmst du die letzte Position und den letzten Beleg heraus, wird der dann leere Zeitraum von selbst entfernt. Einen Löschknopf gibt es bewusst nicht.'}</div>
  </div>`;
}

function zeileInner(k, i, aufgeklappt, infos, wert, farbe, zeichen) {
  // Eine vorläufige (orange) Position bleibt orange, bis sie bestätigt ist.
  const zustandKlasse = k.vorlaeufig ? ' entwurf' : (k.erledigt ? ' gefuellt' : '');
  const bearbeitbar = daten.status === 'in Arbeit';

  let koerper = '';
  if (aufgeklappt && k.position_id) {
    // Der Betrag steht jetzt oben im Kopf (kopf-betrag) — kein zweites Feld hier.
    // „Beleg anhängen" sitzt neben den Belegen in derselben Zeile.
    const anbau = bearbeitbar
      ? `<button class="anh-anbau" data-anhaengen="${esc(k.kostenart)}"
          >${ANH_ICON} Beleg anhängen</button>` : '';
    const belege = `<div class="zk">Belege</div>${belegeHtml(k, anbau)}`;
    // Unten Hauptaktion und dezenter Zweitweg nebeneinander.
    const fuss = k.vorlaeufig
      ? `<button class="hauptaktion ja" data-entwurf-ja="${k.position_id}"
          >✓ Bestätigen</button>
         <button class="minilink" data-entwurf-nein="${k.position_id}"
          data-art="${esc(k.kostenart)}">Zurück zum Prüfen</button>`
      : `<button class="hauptaktion" data-fertig="${i}">Fertig</button>
         ${bearbeitbar ? `<button class="minilink gefahr"
          data-entfernen="${k.position_id}"
          data-art="${esc(k.kostenart)}">Entfernen</button>` : ''}`;
    // CCCLXIII — Anbieter/Gewerk der Kostenart (WWK, Zweckverband, Firma …);
    // gilt über alle Zeiträume, erscheint als Tag in der Zeile.
    const anbieterFeld = (bearbeitbar && k.kostenart_id)
      ? `<div class="anbieterzeile"><label>Anbieter / Gewerk</label>
          <input type="text" data-anbieter="${k.kostenart_id}"
            value="${esc(k.anbieter || '')}" data-wert="${esc(k.anbieter || '')}"
            placeholder="z. B. WWK, Zweckverband, Firma …"></div>` : '';
    // CCCLXII — diese Position auf eine andere/spezifischere Kostenart setzen.
    const kostenartFeld = bearbeitbar
      ? `<div class="kostenartzeile"><label>Kostenart</label>
          <select data-kostenart-pos="${k.position_id}" data-wert="${esc(k.kostenart)}"
            aria-label="Kostenart dieser Position">${artOptionen(k.kostenart)}</select>
          <input class="ka-neu" data-kostenart-neu="${k.position_id}" hidden
            placeholder="Neue Kostenart …" aria-label="Neue Kostenart"></div>` : '';
    koerper = `${verteilungHtml(k)}${belege}${kostenartFeld}${anbieterFeld}
      <div class="kartenfuss">${fuss}</div>`;
  } else if (aufgeklappt) {
    // Katalog-Kostenart ohne Position: hier entsteht sie.
    koerper = `<div class="betragfeld">
        <input type="number" step="0.01" placeholder="Betrag (optional)"
               data-neubetrag="${i}" aria-label="Betrag für ${esc(k.kostenart)}"></div>
      <div class="kartenfuss">
        <button class="hauptaktion" data-anlegen="${esc(k.kostenart)}"
                data-index="${i}">Anlegen</button>
      </div>`;
  }

  // Der Betrag im Kopf: aufgeklappt ein schlankes Eingabefeld (speichert beim
  // Verlassen), sonst der lesbare Wert — so steht er nur einmal in der Karte.
  const betragEl = (aufgeklappt && k.position_id && bearbeitbar)
    ? `<input class="kopf-betrag" type="number" step="0.01" inputmode="decimal"
         placeholder="Betrag" value="${k.betrag ?? ''}"
         data-betrag="${k.position_id}" data-wert="${k.betrag ?? ''}"
         aria-label="Betrag für ${esc(k.kostenart)}">`
    : (k.erledigt ? `<span class="wert">${wert}</span>` : '');
  // Quick-Capture nur an der geschlossenen, offenen Zeile — aufgeklappt macht
  // der Betrag im Kopf Platz, Belege kommen dann über „Beleg anhängen".
  // Ohne Kamera (Schreibtisch) genügt EIN neutraler Knopf — er öffnet über
  // data-scan das lokale #scanFeld (nimmt PDFs an), navigiert also NICHT bloß in
  // den Eingang. Mit Kamera bleiben beide Wege: erfassen (teal) und aus Ablage.
  const quickScan = (!k.erledigt && !aufgeklappt)
    ? (KEINE_KAMERA
      ? `<button class="scanmini ablage" data-scan="${esc(k.kostenart)}"
            title="Beleg-PDF von diesem Rechner wählen">
            <span class="si">▤</span><span class="st">Beleg wählen</span>
          </button>`
      : `<button class="scanmini" data-scan="${esc(k.kostenart)}"
            title="Beleg für ${esc(k.kostenart)} abfotografieren">
            <span class="si">▣</span><span class="st">Beleg erfassen</span>
          </button>
          <button class="scanmini ablage" data-ablage="${esc(k.kostenart)}"
            title="Beleg aus der Ablage / Nextcloud wählen">
            <span class="si">☁</span><span class="st">Aus Ablage</span>
          </button>`) : '';

  return `<div class="pruef${zustandKlasse}">
      <div class="kopf">
        <button class="zeile" data-auf="${i}" aria-expanded="${aufgeklappt}">
          <span class="ikon ${k.erledigt ? 'fertig' : 'warte'}">${
            kostenIcon(k.kostenart)}</span>
          <span class="name">${chipHtml(k)}${esc(k.kostenart)}${
            (w => w ? `<span class="vkey">${esc(w)}</span>` : '')(schluesselWort(k))}${
            k.vorlaeufig ? '<span class="entw-badge">Entwurf aus Beleg</span>' : ''}
            ${infos ? `<span class="unter">${esc(infos)}</span>` : ''}</span>
        </button>
        ${k.anbieter ? `<span class="anbieter-tag" title="Anbieter / Gewerk"
          >${esc(k.anbieter)}</span>` : ''}
        ${betragEl}
        ${quickScan}
        <span class="haken ${farbe}">${zeichen}</span>
      </div>
      ${anhaengerStrip(k)}
      ${aufgeklappt ? `<div class="auf">${koerper}</div>` : ''}
    </div>`;
}

/* An wen die Abrechnung dieser Partei geht. Beim Leerstand an niemanden — er
   ist kein Empfänger, sondern der Anteil des Eigentümers. */
function empfaengerHtml(p) {
  if (!p) return '';
  if (p.leerstand) {
    return '<div class="wemgeht">Bleibt beim Eigentümer — kein Versand.</div>';
  }
  if (p.adressen?.length) {
    return `<div class="wemgeht">Geht an ${p.adressen.map(esc).join(' · ')}</div>`;
  }
  return `<div class="wemgeht fehlt">Keine Mailadresse hinterlegt —
    ausdrucken und mit der Post schicken.</div>`;
}

async function ergebnisHtml() {
  // Der Versandplan sagt, welche Zeile ein Leerstand ist und wer die
  // Abrechnung bekommt; ohne ihn bleibt das Ergebnis trotzdem lesbar.
  const [rechnung, versand] = await Promise.allSettled([
    api(`/zeitraeume/${zid}/abrechnung`),
    api(`/zeitraeume/${zid}/versand`),
  ]);
  if (rechnung.status !== 'fulfilled') {
    return '<div class="empty"><div class="big">Ergebnis nicht verfügbar</div></div>';
  }
  const a = rechnung.value;
  const wer = new Map((versand.value?.parteien || []).map(p => [p.partei, p]));

  // Die Abrechnung je Partei als PDF — dieselbe Datei, die beim Versand
  // angehängt wird. Vor dem Verschicken einmal ansehen zu können, ist der
  // Sinn der Vorschau.
  const zeilen = Object.entries(a.parteien || {}).map(([partei, w]) => `
    <div class="karte">
      <h3>${esc(partei)}${wer.get(partei)?.leerstand || leerstaende.has(partei)
        ? '<span class="marke">Leerstand</span>' : ''}</h3>
      ${empfaengerHtml(wer.get(partei))}
      <div class="summe"><span>Umlagefähige Kosten</span><b>${eur(w.kosten)}</b></div>
      <div class="summe"><span>Vorauszahlungen</span><b>${eur(w.vorauszahlungen)}</b></div>
      ${w.s35 ? `<div class="summe"><span>davon § 35a</span><b>${eur(w.s35)}</b></div>`
        : ''}
      <div class="summe gesamt"><span>Saldo</span>
        <b class="${(w.saldo ?? 0) >= 0 ? 'pos' : 'neg'}">${eur(w.saldo)}</b></div>
      <a class="pdflink" target="_blank" rel="noopener"
         href="/api/zeitraeume/${zid}/abrechnung.pdf?partei=${
           encodeURIComponent(partei)}">▤ Abrechnung als PDF ansehen</a>
    </div>`).join('');

  const g = a.gesamt || {};
  return `<div class="karte">
      <h3>Gesamt</h3>
      <div class="summe"><span>Auslagen</span><b>${eur(g.auslagen)}</b></div>
      <div class="summe"><span>Abschläge</span><b>${eur(g.abschlaege)}</b></div>
      <div class="summe gesamt"><span>Saldo</span>
        <b class="${(g.saldo ?? 0) >= 0 ? 'pos' : 'neg'}">${eur(g.saldo)}</b></div>
    </div>${zeilen}
    ${a.offen?.length ? `<div class="karte"><h3>Noch offen</h3>
      ${a.ohne_betrag?.length ? `<div class="summe">
        <span>Ohne Betrag</span><b>${a.ohne_betrag.map(esc).join(', ')}</b></div>` : ''}
      ${a.ohne_verteilung?.length ? `<div class="summe">
        <span>Ohne Verteilung</span>
        <b class="neg">${a.ohne_verteilung.map(esc).join(', ')}</b></div>` : ''}
      </div>` : ''}`;
}

/* Abschluss: erst wenn nichts mehr offen ist — oder du die Reste bewusst
   übergehst — wird der Versand freigegeben. */
function abschlussHtml() {
  if (daten.status !== 'in Arbeit') {
    // Zurückhaltend, aber vorhanden: ein versehentlicher Abschluss war bisher
    // unumkehrbar — samt der Fristen und Erinnerungen, die daran hängen.
    return `<div class="abschluss fertig">
        <div class="at">Abgeschlossen</div>
        <p>Dieser Zeitraum ist abgerechnet und versendet.</p>
        <button class="wiederauf" data-oeffnen="1">Wieder öffnen</button>
      </div>`;
  }
  const f = daten.fortschritt;
  const rest = f.gesamt - f.fertig;
  // Eine erledigte Position ohne Gewichte sieht fertig aus, fließt aber mit
  // 0,00 € ein. Sie gehört deshalb zu dem, was den Abschluss aufhält.
  const ohne = daten.checkliste.filter(k => k.ohne_verteilung)
    .map(k => k.kostenart);

  if (rest === 0 && !ohne.length) {
    return `<div class="abschluss bereit">
        <div class="at">✓ Alles erfasst</div>
        <p>${f.gesamt} Positionen vollständig · ${eur(f.summe)} umlagefähig.
           Die Abrechnungen können erstellt und verschickt werden.</p>
        <button class="losbutton" data-abschluss="1">Abrechnungen erstellen und versenden</button>
      </div>`;
  }
  const teile = [
    rest ? `${rest} ${rest === 1 ? 'Position' : 'Positionen'} ohne Betrag` : null,
    ohne.length ? `${ohne.length} ohne Verteilung` : null,
  ].filter(Boolean).join(' · ');

  return `<div class="abschluss offen">
      <div class="at">Noch nicht vollständig</div>
      <p>${teile}. Trage die fehlenden Angaben ein — oder bestätige, dass die
         restlichen Posten für diesen Zeitraum nicht anfallen.</p>
      ${ohne.length ? `<div class="warnung"><span>▲</span>
        <span><b>${esc(ohne.join(', '))}</b> ${ohne.length === 1 ? 'hat' : 'haben'}
        einen Betrag, aber keine Verteilungsgewichte — ${ohne.length === 1
          ? 'er zählt' : 'sie zählen'} in der Abrechnung mit 0,00 €.</span>
        </div>` : ''}
      <label class="uebergehen">
        <input type="checkbox" id="uebergehen">
        <span>Restliche Positionen fallen nicht an</span>
      </label>
      <button class="losbutton" data-abschluss="1" disabled
              id="abschlussKnopf">Abrechnungen erstellen und versenden</button>
    </div>`;
}

/* Die Einheiten des Objekts samt der Partei, die einen Sonderposten dort
   tragen würde. Grundlage ist die Schlüssel-Vorschau: dort steht je Bezug
   Partei und Einheit — und ausgeschlossene Einheiten (CXCIII) fehlen bereits,
   für sie käme ohnehin keine Verteilung zustande. */
function sonderEinheiten() {
  const map = new Map();
  for (const p of (schluessel?.parteien || [])) {
    if (!p.einheit) continue;
    if (!map.has(p.einheit)) map.set(p.einheit, new Set());
    map.get(p.einheit).add(p.partei);
  }
  return [...map.entries()].map(([einheit, parteien]) =>
    ({ einheit, parteien: [...parteien] }));
}

/* ---- CCVIII: Mieter-Direkteintrag für ein WEG-Objekt --------------------
   Ist die Wohnung Teil einer Wohnungseigentümergemeinschaft, verteilt die
   Hausverwaltung die Nebenkosten. ImmoCalc verteilt dann nicht selbst: der
   Nutzer trägt je Mieter die umlagefähige NK-Summe vom Zettel direkt ein. Das
   läuft über die vorhandene 100-%-je-Einheit-Mechanik (`nur_einheit`) — die
   Summe geht ganz auf die Partei der Einheit, ohne Verteilungsschlüssel, und
   die bestehende Abrechnungs-/Versandmaschinerie rechnet sie gegen die
   Vorauszahlung. */
const WEG_ART = einheit => `Nebenkosten (WEG) · ${einheit}`;

function wegDirektHtml() {
  if (!daten.weg) return '';
  const einheiten = sonderEinheiten();
  const bereit = daten.status === 'in Arbeit';
  const bestehende = new Map((daten.checkliste || []).map(k => [k.kostenart, k]));

  const zeilen = einheiten.map(e => {
    const vorhanden = bestehende.get(WEG_ART(e.einheit));
    const betrag = vorhanden && vorhanden.betrag != null ? vorhanden.betrag : '';
    return `<div class="gw">
        <span class="gn">${esc(e.einheit)}${e.parteien.length
          ? `<span class="gsub">${esc(e.parteien.join(' · '))}</span>` : ''}</span>
        ${bereit
          ? `<input type="number" step="0.01" min="0" value="${betrag}"
                   data-weg-betrag="${esc(e.einheit)}" placeholder="NK-Summe"
                   aria-label="Umlagefähige NK-Summe ${esc(e.einheit)}">`
          : `<span class="gv">${betrag !== '' ? eur(betrag) : '—'}</span>`}
      </div>`;
  }).join('');

  const koerper = einheiten.length
    ? zeilen + (bereit ? `<div class="nachtrag" style="margin-top:12px">
        <button data-weg-speichern="1">Werte je Mieter übernehmen</button>
      </div>` : '')
    : `<div class="belege"><span class="kein">Noch keine vermietete Einheit —
        lege auf der Objektseite Einheiten und Mieter an, dann steht hier je
        Mieter ein Feld für die NK-Summe.</span></div>`;

  return `<div class="karte sonder">
      <h3>Nebenkosten laut Hausverwaltung <span class="marke post">WEG</span></h3>
      <span class="erklaer">Diese Wohnung gehört zu einer WEG — die
        Hausverwaltung verteilt die Nebenkosten. Trage je Mieter die
        umlagefähige NK-Summe vom Abrechnungszettel direkt ein. ImmoCalc
        verteilt nichts, sondern rechnet sie gegen die Vorauszahlung und erstellt
        Saldo, PDF und Versand wie gewohnt.</span>
      ${koerper}</div>`;
}

async function zeichnen() {
  const f = daten.fortschritt;
  const anteil = f.gesamt ? Math.round((f.fertig / f.gesamt) * 100) : 0;

  const kopf = `${bannerHtml()}
    <div class="fortschritt">
      <div class="kopf">
        <span class="gross">${f.fertig} von ${f.gesamt}</span>
        <span class="klein">Positionen vollständig</span>
      </div>
      <div class="bahn"><i style="width:${anteil}%"></i></div>
    </div>
    <div class="tabs" role="tablist">
      <button data-tab="pruef" aria-selected="${ansicht === 'pruef'}">Checkliste</button>
      <button data-tab="ergebnis" aria-selected="${ansicht === 'ergebnis'}">Ergebnis</button>
      <button data-tab="belege" aria-selected="${ansicht === 'belege'}">Belege</button>
    </div>`;

  let rumpf = '';
  if (ansicht === 'pruef') {
    const fluss = daten.sankey || { knoten: [], fluss: [] };
    const flussKarte = fluss.fluss.length
      ? `<div class="karte"><h3>Kostenfluss · erfasste Positionen</h3>
          ${sankey(fluss.knoten, fluss.fluss,
                   { format: eurKurz, breite: window.innerWidth < 520 ? 260 : 540 })}
         </div>`
      : '';

    const sortWahl = `<div class="sortleiste">
        <span>Sortieren</span>
        ${Object.entries({ status: 'Offene zuerst', betrag: 'Größe', name: 'Name' })
          .map(([k, l]) => `<button data-sort="${k}"
            aria-pressed="${sortierung === k}">${l}</button>`).join('')}
      </div>`;

    // Jede Kostenart bleibt als Zeile — auch eine, die „Zähler" heißt (etwa die
    // umlagefähige Zählermiete): sie trägt einen Betrag und muss erfassbar
    // bleiben. Der abgelesene Verbrauch erscheint als Chip an der Position, nicht
    // als eigene Zeile. Sortiert, dann in Bereiche gruppiert; der echte Index i
    // aus dem Original-Array bleibt an der Zeile, damit data-auf/offen/index passen.
    const sortiert = daten.checkliste
      .map((k, i) => ({ k, i }))
      .sort((a, b) => SORTIERUNG[sortierung](a.k, b.k));
    const bereiche = BEREICHE.map(() => []);
    for (const eintrag of sortiert) {
      bereiche[bereichIndex(eintrag.k.kostenart)].push(eintrag);
    }
    const zeilen = bereiche.map((liste, bi) => liste.length
      ? `<div class="kat-kopf"><span>${esc(BEREICHE[bi].titel)}</span></div>`
        + liste.map(({ k, i }) => zeileHtml(k, i)).join('')
      : '').join('');

    rumpf = wegDirektHtml() + ablesenKnopfHtml() + flussKarte + sortWahl +
      zeilen + abschlussHtml() + zeitraumFussHtml();
  } else if (ansicht === 'ergebnis') {
    rumpf = '<div class="karte"><h3>Wird gerechnet …</h3></div>';
  } else {
    // Nach Dokumentart gruppiert — so, wie die API sie liefert.
    const gruppen = Object.entries(daten.belege_je_art || {})
      .filter(([, liste]) => liste.length)
      .sort(([a], [b]) => a.localeCompare(b, 'de'));
    rumpf = daten.dokumente.length
      ? gruppen.map(([art, liste]) => `<div class="karte">
          <h3>${esc(art || 'Ohne Art')} · ${liste.length}</h3>
          ${belegLinks(liste)}</div>`).join('')
      : `<div class="empty"><div class="big">Noch keine Belege</div>
          <p>Fotografiere in der Checkliste einen Beleg zu einer Position ab —
             er wird in der Cloud abgelegt und erscheint dann hier.</p></div>`;
  }

  inhalt.innerHTML = kopf + rumpf;

  if (ansicht === 'ergebnis') {
    inhalt.innerHTML = kopf + await ergebnisHtml();
  } else if (ansicht === 'pruef') {
    montiereSchluessel();
  }
}

/* Die Auswahlfelder werden nach dem Zeichnen gesetzt: sie bestehen aus
   Knopf und Liste und lassen sich nicht als Zeichenkette einfügen. */
function montiereSchluessel() {
  if (!schluessel) return;
  // Nur noch vier Schlüssel zur Wahl: Fläche · Personen · Einheiten · Verbrauch.
  const WAHL = ['flaeche', 'personen', 'einheiten', 'verbrauch'];
  const titel = new Map(schluessel.schluessel.map(s => [s.wert, s.titel]));
  const basis = WAHL.filter(w => titel.has(w))
    .map(w => ({ wert: w, text: titel.get(w) }));
  inhalt.querySelectorAll('[data-schluesselwahl]').forEach(ziel => {
    const pid = ziel.dataset.schluesselwahl;
    const jetzt = ziel.dataset.wert || '';
    // Eine Bestandsposition mit entferntem Schlüssel (Bewohnermonate, Prozent,
    // Individuell) oder „nur eine Einheit" darf nicht brechen: ihren aktuellen
    // Wert als zusätzliche Option zeigen, damit das Feld ihn weiter nennt.
    const optionen = basis.slice();
    if (jetzt === NUR_EINHEIT_WAHL) {
      optionen.push({ wert: NUR_EINHEIT_WAHL, text: '1 Einheit' });
    } else if (jetzt && !WAHL.includes(jetzt)) {
      optionen.push({ wert: jetzt, text: titel.get(jetzt) || jetzt });
    }
    auswahlfeld(ziel, {
      optionen, wert: jetzt, label: 'Verteilen nach',
      aenderung: async neu => {
        // „Nur eine Einheit/Person": erst den Einheit-Auswähler zeigen, gesetzt
        // wird nur_einheit dann über den Klick auf eine Einheit.
        if (neu === NUR_EINHEIT_WAHL) { einzelWahl = Number(pid); return zeichnen(); }
        try {
          // Der Server leitet die Gewichte beim Wechsel neu ab; nur_einheit wird
          // dabei geleert, falls die Position vorher ein Einzelposten war.
          await api(`/positionen/${pid}`,
                    { method: 'PATCH', body: { schluessel: neu, nur_einheit: '' } });
          einzelWahl = null;
          await laden();
        } catch (fehler) {
          melde(String(fehler.message || fehler), 'neg');
        }
      },
    });
  });
}

/* Die Schlüsselliste ist mit sieben Einträgen hoch. Steht das Feld weit unten,
   reicht der Platz darunter zwar für die Liste, nicht aber für die
