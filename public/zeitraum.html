     dem iPhone lesbar bleiben statt in eine Zeile gequetscht zu werden. */
  .sk-herk{list-style:none;margin:9px 0 0;padding:0;display:flex;
    flex-direction:column;gap:4px}
  .sk-herk li{font:400 11.5px var(--body);color:var(--soft);line-height:1.45;
    padding-left:11px;position:relative;overflow-wrap:anywhere}
  .sk-herk li::before{content:'';position:absolute;left:0;top:.55em;width:4px;
    height:4px;border-radius:50%;background:var(--teal-l)}
  .sk-herk b{color:var(--ink);font-weight:600}
  /* Ein noch fehlender Betrag — ein Strich statt einer Null, in Bernstein. */
  .sk-offen{color:var(--amber)}
  /* N173 — die zwei Netzsätze nebeneinander: Verteilung (Mieter) und geeicht
     (E-Auto). Zwei ruhige Kärtchen, darunter ein Satz, warum sie sich
     unterscheiden. Auf dem iPhone brechen sie untereinander um. */
  .sk-saetze{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
  .sk-satz{flex:1 1 130px;min-width:0;display:flex;flex-direction:column;
    gap:2px;padding:8px 11px;border-radius:10px;background:var(--paper)}
  .sk-satz b{font:600 14px var(--mono);color:var(--ink)}
  .sk-satz small{font:400 11px var(--body);color:var(--soft);line-height:1.4}
  .sk-satz-hinweis{flex:1 1 100%;font:400 11.5px var(--body);color:var(--soft);
    line-height:1.5;margin-top:2px}
  .sk-felder{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .sk-feld{flex:1 1 74px;min-width:0;display:flex;flex-direction:column;gap:4px}
  .sk-feld label{font:600 8.5px var(--mono);letter-spacing:.05em;
    text-transform:uppercase;color:var(--soft)}
  .sk-feld input{width:100%;min-width:0;border:1.5px solid var(--line);
    border-radius:10px;padding:9px 10px;min-height:44px;background:var(--sheet);
    text-align:right;font:600 12px var(--mono);color:var(--ink)}
  .sk-feld input:focus{outline:none;border-color:var(--teal)}
  .sk-feld.fest span{display:block;padding:9px 10px;min-height:44px;
    border-radius:10px;background:var(--paper);text-align:right;
    font:600 12px var(--mono);color:var(--ink)}
  /* Die Kettentabellen tragen kurze Zeilenköpfe („Netz", „Akku") — mit der
     schmaleren ersten Spalte passen Menge UND Kosten auf den iPhone-Schirm,
     ohne dass die wichtigste Zahl hinter dem Rand verschwindet. */
  .sk-tab th,.sk-tab td{padding-left:8px;padding-right:8px}
  .sk-tab th.wd-rowh,.sk-tab td.wd-rowh{width:96px;min-width:96px;max-width:96px}
  .sk-tab thead th{min-width:72px}
  .sk-kontrolle{display:flex;flex-wrap:wrap;justify-content:space-between;
    gap:6px 16px;margin-top:12px;padding-top:10px;border-top:2px solid var(--line);
    font:500 12px var(--body);color:var(--soft)}
  .sk-kontrolle b{color:var(--ink);font-weight:700}
  .sk-kontrolle .ok{color:var(--pos)}
  .sk-kontrolle .fehl{color:var(--neg)}

  /* ---- N191/N192: grafisch strukturierte Stromkette ---------------------- */
  /* Der ct/kWh-Wert als kleiner Chip oben rechts im Kopf statt als volle Zeile. */
  .sk-satzchip{margin-left:auto;flex:none;font:600 10px var(--mono);
    color:var(--ink);background:var(--paper);border-radius:999px;padding:5px 10px;
    white-space:nowrap}
  /* Balken (Höhe ∝ Prozent) links, Tabelle rechts — auf dem iPhone bricht die
     Tabelle unter die Balken um. */
  .sk-split{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px}
  .sk-splittab{flex:1 1 230px;min-width:0}
  .sk-bars{flex:0 0 auto;display:flex;align-items:flex-end;gap:9px;
    padding:10px 12px 9px;background:var(--paper);border-radius:12px;
    position:relative}
  /* N208 — sind alle drei Anteile gesetzt, spannt der Balken über die volle
     Breite (statt schmaler Kasten links mit Leerfläche daneben); die Tabelle
     steht dann darunter. Die Säulen verteilen sich gleichmäßig, der Fluss-Pfeil
     entfällt (der Fluss läuft nun sichtbar nach unten in die Tabelle). */
  .sk-bars.breit{flex:1 1 100%;margin-bottom:10px;justify-content:space-around;
    align-items:flex-end;padding:9px 16px 8px}
  .sk-bars.breit .sk-bars-pfeil{display:none}
  .sk-bars.breit .sk-saeule-bar{width:26px}
  .sk-saeule{display:flex;flex-direction:column;align-items:center;
    justify-content:flex-end;gap:3px}
  .sk-saeule-wert{font:600 9.5px var(--mono);color:var(--soft)}
  .sk-saeule-bar{width:18px;border-radius:5px 5px 0 0;min-height:8px}
  .sk-saeule-name{font:600 8px var(--mono);letter-spacing:.04em;
    text-transform:uppercase;color:var(--soft)}
  .sk-bars-pfeil{align-self:center;font-size:17px;color:var(--teal);
    line-height:1;padding-left:1px}
  /* Die Zeilenköpfe tragen die Balkenfarbe — so liest sich, welcher Balken zu
     welcher Zeile gehört. */
  .sk-rh-netz{box-shadow:inset 3px 0 0 var(--amber)}
  .sk-rh-pv{box-shadow:inset 3px 0 0 var(--teal)}
  .sk-rh-akku{box-shadow:inset 3px 0 0 var(--pos)}
  /* Drei Bubbles statt eines grauen Textblocks. */
  .sk-bubbles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:8px;margin-top:12px}
  .sk-bubble{background:var(--paper);border-radius:12px;padding:10px 12px;
    font:400 11.5px var(--body);color:var(--ink);line-height:1.5}
  .sk-bubble b{font-weight:600}
  .sk-bubble-k{display:block;font:600 8.5px var(--mono);letter-spacing:.05em;
    text-transform:uppercase;color:var(--soft);margin-bottom:4px}
  .sk-bubble-warn{display:block;color:var(--amber);margin-top:6px;
    font:500 11px var(--body);line-height:1.45}
  /* Aufklappbare Info-Box (Datenherkunft & €-Herleitung) — wie bei der
     E-Tankstelle, kein Framework. */
  .sk-info{margin-top:8px}
  .sk-info>summary{list-style:none;cursor:pointer;font:600 10px var(--mono);
    color:var(--teal-d);display:inline-flex;align-items:center;gap:5px;
    min-height:32px}
  .sk-info>summary::-webkit-details-marker{display:none}
  .sk-info>summary::before{content:'i';display:inline-flex;align-items:center;
    justify-content:center;width:15px;height:15px;border-radius:50%;
    background:var(--teal-l);color:var(--teal-d);font:700 9px var(--mono)}
  .sk-info[open]>summary{margin-bottom:2px}
  .sk-info .sk-herk{margin-top:6px}
  /* N192 — die Netz-Belege ansehen/herausnehmen. */
  .sk-belege{margin-top:12px;background:var(--paper);border-radius:12px;
    padding:11px 12px}
  .sk-belege-k{display:block;font:600 8.5px var(--mono);letter-spacing:.05em;
    text-transform:uppercase;color:var(--soft)}
  .sk-belege-txt{display:block;font:400 11.5px var(--body);color:var(--soft);
    line-height:1.5;margin:3px 0 9px}
  .sk-belege .belege{margin-top:0}
  /* N192 — die geeichte Rechnungsmenge: ruhige Info-Box mit Eingabe, kein
     Dauerbanner. */
  .sk-geeicht{margin-top:10px;background:var(--paper);border-radius:12px;
    padding:11px 12px;border-left:3px solid var(--amber-li)}
  .sk-geeicht>summary{list-style:none;cursor:pointer;display:flex;
    align-items:center;font:600 11.5px var(--body);color:var(--ink);
    line-height:1.4;min-height:28px}
  .sk-geeicht>summary::-webkit-details-marker{display:none}
  .sk-geeicht-i{flex:none;display:inline-flex;align-items:center;
    justify-content:center;width:16px;height:16px;border-radius:50%;
    background:var(--amber-li);color:var(--amber);font:700 10px var(--mono);
    margin-right:8px}
  .sk-geeicht p{font:400 11.5px var(--body);color:var(--soft);line-height:1.55;
    margin:9px 0 0}
  .sk-geeicht p b{color:var(--ink);font-weight:600}
  .sk-geeicht-eingabe{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .sk-geeicht-eingabe input{flex:1 1 130px;min-width:0;border:1.5px solid var(--line);
    border-radius:10px;padding:10px 11px;min-height:44px;background:var(--sheet);
    font:600 12px var(--mono);color:var(--ink)}
  .sk-geeicht-eingabe input:focus{outline:none;border-color:var(--teal)}
  .sk-geeicht-eingabe button{flex:none;min-height:44px;padding:0 16px;border:none;
    border-radius:10px;background:var(--teal);color:#fff;cursor:pointer;
    font:600 12px var(--disp)}
  .sk-geeicht-eingabe button:hover{background:var(--teal-d)}
  /* N191 — „was übrig ist" vor der Verteilungstabelle: gekipptes Etikett + Zahl. */
  .sk-rest{display:flex;align-items:stretch;gap:11px;margin:2px 0 11px;
    background:var(--teal-l);border-radius:12px;padding:10px 13px}
  .sk-rest-label{flex:none;writing-mode:vertical-rl;transform:rotate(180deg);
    font:600 8.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;
    color:var(--teal-d);text-align:center}
  .sk-rest-zahl{flex:1;min-width:0;display:flex;flex-direction:column;
    justify-content:center}
  .sk-rest-zahl b{font:600 20px var(--disp);color:var(--ink);line-height:1.1}
  .sk-rest-zahl small{display:block;font:400 11px var(--body);color:var(--soft);
    line-height:1.4;margin-top:3px}
  @media(max-width:560px){ .sk-bars-pfeil{transform:rotate(90deg);
    align-self:center} }

  /* N407 — Belegungsübersicht: ein Zeitstrahl je Einheit, dieselbe Sprache
     wie die Mietverhältnis-Timeline der Objekt-Seite (dort .miet-timeline in
     objekt.html; hier dupliziert, weil zeitraum.html sein eigener,
     unabhängiger Seitenrahmen ist). */
  .beleg-einheit{margin-bottom:16px}
  .beleg-einheit:last-of-type{margin-bottom:14px}
  .be-kopf{display:flex;align-items:baseline;justify-content:space-between;
    gap:8px;margin-bottom:6px}
  .be-name{font:600 13px var(--disp);color:var(--ink)}
  .be-flaeche{font:500 11.5px var(--mono);color:var(--soft)}
  .miet-timeline{margin:2px 0}
  .miet-timeline.mini .tl-track{height:11px;border-radius:5px}
  .tl-track{position:relative;height:16px;background:#E3E9E9;
    border-radius:6px;overflow:hidden}
  .tl-seg{position:absolute;top:0;height:100%;border-radius:4px;min-width:3px}
  .tl-seg.leer{background:repeating-linear-gradient(45deg,#C9D3D3,#C9D3D3 5px,
    #DCE3E3 5px,#DCE3E3 10px)}
  /* Kosten×Einheiten-Matrix: dieselbe Tabellenform wie die Wasser-
     Detailtabelle (.wd-tabelle/.wd-tab/.wd-rowh/.wd-summe, siehe wasser.js) —
     Kostenarten stehen fest links (sticky), Einheiten/Parteien laufen
     nebeneinander und bleiben beim Scrollen oben sichtbar. */
  .mx-einheit{display:block;font:600 10px var(--mono);letter-spacing:.03em;
    text-transform:uppercase;color:var(--teal-d)}
  .mx-partei{display:block;font:600 12px var(--body);color:var(--ink);
    text-transform:none;letter-spacing:0;margin-top:1px}
  .mx-partei.leer{color:var(--soft);font-style:italic}
  .mx-pdf{display:inline-flex;align-items:center;gap:4px;text-decoration:none;
    color:var(--teal-d);font:600 11.5px var(--body);border:none;background:none;
    padding:0;cursor:pointer;min-height:32px}
  .mx-pdf:hover{color:var(--teal)}
  /* N410 — die Kostenart-Spalte ist bei .wd-rowh sonst auf 124px/break-
     anywhere getrimmt (passt für kurze Namen wie „Wasser"); zusammengesetzte
     Wörter wie „Gebäudeversicherung"/„Niederschlagswasser" haben keine
     Leerstelle zum Umbrechen und rissen mitten im Wort. In der Matrix bleibt
     die Spalte deshalb einzeilig und wächst mit dem längsten Namen mit. */
  .wd-tab.mx-tab th.wd-rowh,.wd-tab.mx-tab td.wd-rowh{width:auto;
    min-width:150px;max-width:220px;white-space:nowrap;overflow-wrap:normal}
  /* N425 — genug Höhe für Einheit + (ggf. zweizeiligen) Parteinamen, egal wie
     lang der Name ist ("Delta Wohnbau GmbH") — plus eine deutliche, dickere
     Trennlinie zur ersten Datenzeile, statt der dünnen 1px-Standardlinie.
     Vorher lief ein langer Name sichtbar in die Zeile darunter hinein. */
  .wd-tab.mx-tab thead th{min-height:52px;padding-bottom:11px;
    border-bottom:2px solid var(--line)}
  /* N410 — Sortierbare Spaltenköpfe: eigener Zeiger, der Pfeil bleibt blass,
     bis die Spalte aktiv sortiert — dann Ink-Farbe und Richtung. */
  .mx-sortbar{cursor:pointer;user-select:none}
  .mx-sortbar:hover{background:var(--paper)}
  .mx-pfeil{display:inline-block;margin-left:5px;font-size:9px;color:var(--soft)}
  .mx-pfeil.aktiv{color:var(--teal-d);font-size:10px}
  .wiederauf{margin-top:12px;border:none;background:transparent;color:var(--soft);
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;
    font:600 12px var(--disp);padding:10px 2px;min-height:44px}
  .wiederauf:hover{color:var(--ink)}
  .belege{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
  .belege a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    background:#F1F4F4;color:var(--ink);border-radius:9px;padding:8px 11px;
    font:500 11.5px var(--body);min-height:36px}
  .belege a:hover{background:var(--teal-l);color:var(--teal-d)}
  .belege .kein{font:400 12px var(--body);color:var(--soft);line-height:1.45}
  /* N95 — Beleg + „herausnehmen" gehören zusammen (ein Chip mit ×). */
  .beleg-zeile{display:inline-flex;align-items:center;gap:2px}
  .beleg-weg{border:none;background:#F1F4F4;color:var(--neg);cursor:pointer;
    width:36px;height:36px;border-radius:9px;font:700 16px var(--body);flex:none}
  .beleg-weg:hover{background:#F6E7E2}
  /* N8 — genaues Belegdatum an der Beleg-Zeile: dezentes Mono-Etikett in
     gedeckter Farbe, damit man sieht, in welche (vermietete) Zeit die Position
     fiel — rein informativ, ändert nichts an der anteiligen Verteilung. */
  .belege .beleg-datum{margin-left:2px;font:600 10.5px var(--mono);
    color:var(--soft);white-space:nowrap}
  /* Anhängen aus dem Bestand — leise und gestrichelt, im aufgeklappten Bereich. */
  .anh-verwalt{margin-top:14px}
  .anh-anbau{display:inline-flex;align-items:center;gap:7px;cursor:pointer;
             border:1.5px dashed var(--line);background:transparent;
             color:var(--soft);border-radius:11px;padding:10px 13px;
             font:600 12px var(--disp);min-height:44px}
  .anh-anbau:hover{border-color:var(--teal);color:var(--teal-d);background:var(--teal-l)}
  .anh-anbau svg{width:15px;height:15px;flex:none}
  .anh-hint{display:block;font:400 11px var(--body);color:var(--soft);
            line-height:1.45;margin-top:8px}
  /* N258(d) — die Zusatzbelege in der geöffneten Karte: unter den Kostenbelegen
     und eingerückt, mit ruhiger Schiene links — sie gehören dazu, zahlen aber
     nicht auf den Betrag ein. Gleiche Staffelungs-Sprache wie `.dd-beleg.unter`
     in der Eintrags-Detailansicht. */
  .zusatzbelege{display:flex;flex-direction:column;gap:6px;margin:10px 0 0 14px;
                padding-left:12px;border-left:2px solid var(--line)}
  .zusatzbelege .zb-t{font:600 10px var(--mono);letter-spacing:.08em;
                      text-transform:uppercase;color:var(--soft)}
  .zusatzbelege .beleg-zeile a{color:var(--soft);display:inline-flex;
                               align-items:center;gap:6px}
  .zusatzbelege .beleg-zeile a:hover{color:var(--teal-d)}
  .zusatzbelege svg{width:12px;height:12px;flex:none}
  /* N252 — die Badge am Kopf der Karte: „2 Belege". Sie ersetzt die früheren
     Chips im aufgeklappten Bereich; eine Karte ohne Kostenposition klappt gar
     nicht mehr auf, die Badge ist dort der einzige Hinweis auf hinterlegte
     Info-Belege. Ein Tippen öffnet die Liste. */
  .anh-badge{display:inline-flex;align-items:center;gap:6px;flex:none;
             border:1.5px solid var(--line);background:var(--sheet);
             color:var(--soft);border-radius:999px;padding:0 12px;min-height:36px;
             font:600 11.5px var(--mono);cursor:pointer;white-space:nowrap}
  .anh-badge:hover{border-color:var(--teal);color:var(--teal-d);
                   background:var(--teal-l)}
  .anh-badge svg{width:13px;height:13px;flex:none}
  /* Schmaler Schirm: nur Symbol + Zahl. Mit dem Wort „Belege" blieb dem
     Positionsnamen so wenig Breite, dass er buchstabenweise umbrach. */
  @media (max-width:560px){
    .anh-badge{padding:0 9px}
    .anh-badge .anh-b-w{display:none}
  }
  /* Das Fenster hinter der Badge: eine Zeile je Beleg mit vollem Dateinamen
     und Ablageort. Lange Namen werden abgeschnitten, der volle steht im
     Titel — dieselbe Regel wie im Dokumente-Baum. */
  .anh-dlg .anh-liste{display:flex;flex-direction:column;gap:16px;
                      overflow:auto;min-height:0}
  /* N257 — zwei Gruppen: was auf die Position zahlt, und was nur danebenliegt. */
  .anh-dlg .anh-gruppe{display:flex;flex-direction:column;gap:8px}
  .anh-dlg .anh-g-t{font:600 10.5px var(--mono);letter-spacing:.09em;
                    text-transform:uppercase;color:var(--soft)}
  .anh-dlg .anh-z-b{flex:none;font:600 12.5px var(--mono);color:var(--teal-d);
                    padding:0 4px;white-space:nowrap}
  .anh-dlg .anh-zeile{display:flex;align-items:center;gap:8px;
                      background:var(--paper);border-radius:12px;padding:4px}
  .anh-dlg .anh-z-name{flex:1;min-width:0;border:none;background:none;
                       cursor:pointer;text-align:left;padding:9px 10px}
  .anh-dlg .anh-z-dn{display:block;font:600 12.5px var(--body);color:var(--ink);
                     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .anh-dlg .anh-z-pf{display:block;font:500 10px var(--mono);color:var(--soft);
                     margin-top:3px;overflow:hidden;text-overflow:ellipsis;
                     white-space:nowrap;direction:rtl;text-align:left}
  .anh-dlg .anh-z-name:hover .anh-z-dn{color:var(--teal-d)}
  .anh-dlg .anh-z-x{flex:none;border:none;background:var(--line);color:var(--soft);
                    width:36px;height:36px;border-radius:10px;cursor:pointer;
                    font:600 15px var(--body);line-height:1}
  .anh-dlg .anh-z-x:hover{background:var(--neg-bg);color:var(--neg)}
  .anh-dlg .anh-leer{font:400 13px var(--body);color:var(--soft);padding:14px 2px}
  /* Auswahl-Dialog der kostenfreien Belege aus dem Bestand. */
  .ahdlg .ahliste{max-height:min(50dvh,360px);overflow:auto;margin:6px 0 14px}
  .ahdlg .ahz{display:flex;align-items:center;gap:11px;width:100%;cursor:pointer;
              border:none;background:var(--sheet);border-radius:12px;
              padding:12px 13px;margin-bottom:8px;min-height:52px;text-align:left;
              font-family:var(--body);color:var(--ink);
              box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .ahdlg .ahz:hover{background:var(--teal-l)}
  .ahdlg .ahz svg{width:18px;height:18px;flex:none;color:var(--soft)}
  .ahdlg .ahn{flex:1;min-width:0;font:600 13px var(--body);overflow-wrap:anywhere}
  .ahdlg .ahsub{display:block;font:400 10.5px var(--mono);color:var(--soft);
                margin-top:2px}
  .ahdlg .ahleer{font:400 12.5px var(--body);color:var(--soft);line-height:1.55;
                 margin:4px 0 14px}
  /* N268: der Weg über die Kamera steht ÜBER dem Bestand — er ist der
     häufigere Fall (der Beleg liegt in der Hand, nicht schon in der Ablage)
     und deshalb hervorgehoben statt gleichrangig unter den Kandidaten. */
  .ahdlg .ahscan{display:flex;align-items:center;gap:11px;width:100%;
                 cursor:pointer;border:1.5px solid var(--teal);
                 background:var(--teal-l);border-radius:12px;padding:12px 13px;
                 margin:10px 0 4px;min-height:56px;text-align:left;
                 font-family:var(--body);color:var(--teal-d)}
  .ahdlg .ahscan:hover{background:#D6E9E2}
  .ahdlg .ahscan svg{width:20px;height:20px;flex:none;color:var(--teal)}
  .ahdlg .ahscan .ahn{color:var(--teal-d)}
  .ahdlg .ahtrenn{font:600 10px var(--mono);letter-spacing:.09em;
                  text-transform:uppercase;color:var(--soft);margin:14px 0 2px}
  /* Woraus die Summe entstanden ist (CLXXXII) — eine ruhige Zeile über den
     Belegen, damit vier Abschlagsrechnungen nicht als eine Zahl dastehen. */
  .zsumme{font:500 11.5px var(--mono);color:var(--teal-d);background:var(--teal-l);
          border-radius:9px;padding:8px 10px;margin-top:8px;line-height:1.5}
  /* ---- CXCIV: Sonderposten nur für eine Einheit ---- */
  .sonder .erklaer{display:block;font:400 11.5px var(--body);color:var(--soft);
    line-height:1.5;margin:0 0 12px}
  .sonder .starten{border:1.5px dashed var(--line);background:transparent;
    color:var(--teal-d);border-radius:12px;padding:12px 16px;width:100%;
    font:600 13px var(--disp);cursor:pointer;min-height:48px}
  .sonder .starten:hover{border-color:var(--teal);background:var(--teal-l)}
  .sonder .feldlabel{display:block;font:600 10px var(--mono);letter-spacing:.07em;
    text-transform:uppercase;color:var(--soft);margin:14px 0 8px}
  .sonder .einheiten{display:flex;flex-wrap:wrap;gap:8px}
  .ewahl{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;
    min-height:44px;padding:8px 15px;border:none;border-radius:999px;
    background:var(--paper);color:inherit;cursor:pointer;text-align:left;
    box-shadow:inset 0 1px 2px rgba(22,38,44,.05)}
  .ewahl .ename{font:600 13px var(--body);line-height:1.2}
  .ewahl .epartei{font:500 10px var(--mono);color:var(--soft);white-space:nowrap}
  .ewahl.an{background:var(--teal);box-shadow:none}
  .ewahl.an .ename{color:#fff}
  .ewahl.an .epartei{color:rgba(255,255,255,.8)}
  .sonder .abbrechen{margin-top:10px;border:none;background:transparent;
    color:var(--soft);text-decoration:underline;text-underline-offset:3px;
    cursor:pointer;font:600 12px var(--disp);padding:10px 2px;min-height:44px}
  .sonder .abbrechen:hover{color:var(--ink)}

  .karte{background:var(--sheet);border-radius:16px;padding:16px;margin-bottom:12px;
         box-shadow:0 1px 2px rgba(22,38,44,.05)}
  /* N422 — Abrechnungstabellen am Telefon randlos.
     Auf 390 px blieben der Tabelle nach Seitenrand (2×12) und Kartenrand
     (2×16) nur 334 px — jede Spalte mehr hieß Hin- und Herscrollen. Diese
     Karten brechen deshalb am schmalen Schirm aus beiden Rändern aus und
     nutzen die volle Breite; die Überschrift behält ihren Einzug, damit sie
     mit dem übrigen Inhalt fluchtet. Ab Tablet-Breite ist Platz genug, dort
     bleibt die Karte eine normale Karte. */
  @media (max-width:700px){
    /* Die Karte reicht bis an den Seitenrand (−12 px Seitenpolster), die
       TABELLE zusätzlich bis über das Kartenpolster hinaus (−16 px). Alles
       andere in der Karte — Überschrift, Zeitstrahl, Fußzeile — behält seinen
       Einzug und fluchtet weiter mit dem übrigen Inhalt. */
    .karte-breit{margin-left:-12px;margin-right:-12px;border-radius:0}
    /* `max-width:100%` (Grundregel) deckelte die negativen Ränder auf die
       Kartenbreite — hier ausdrücklich aufgehoben, sonst bleibt die Tabelle
       trotz Ausbruch so schmal wie zuvor. */
    .karte-breit .wd-tabelle{margin-left:-16px;margin-right:-16px;
      max-width:none;border-radius:0;border-left:none;border-right:none}
    /* Mehr Spalten ins Bild: engere Zellen und eine schmalere, weiterhin
       stehenbleibende erste Spalte.
       N430 — die schmalere erste Spalte gilt AUSDRÜCKLICH NICHT für die
       Kosten-Matrix: die führt ihre Kostenarten einzeilig (`white-space:
       nowrap`, N410 — „Gebäudeversicherung"/„Niederschlagswasser" sind
       Komposita ohne Bruchstelle und rissen sonst mitten im Wort). Auf 104 px
       gezwungen, aber weiterhin einzeilig, lief der Name aus der Zelle heraus
       und überschrieb die erste Wertespalte (Nutzer: „die Texte vorne
       überschneiden"). Beide Regeln hatten dieselbe Spezifität — meine stand
       nur später und gewann. Die Matrix behält deshalb ihre eigene Breite;
       durch den Vollbreit-Ausbruch ist dafür genug Platz da. */
    .karte-breit .wd-tab th,.karte-breit .wd-tab td{padding:8px 7px}
    .karte-breit .wd-tab:not(.mx-tab) th.wd-rowh,
    .karte-breit .wd-tab:not(.mx-tab) td.wd-rowh{
      width:104px;min-width:104px;max-width:104px}
    .karte-breit .wd-tab thead th{min-width:70px}
  }
  .karte h3{font:600 13px var(--disp);margin:0 0 12px;
            display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .marke{font:600 9.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;
         border-radius:7px;padding:4px 7px;background:#EDF1F0;color:var(--soft)}
  .marke.gut{background:var(--teal-l);color:var(--teal-d)}
  .marke.post{background:var(--amber-bg);color:var(--amber)}
  .summe{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
         font:500 13.5px var(--body);border-top:1px solid var(--line)}
  .summe:first-of-type{border-top:none}
  .summe b{font-family:var(--mono)}
  .summe.gesamt{font-weight:700;border-top:2px solid var(--line)}
  .summe .pos{color:var(--pos)} .summe .neg{color:var(--neg)}

  /* N210 — eine Zeile auf iOS: nowrap + kompakte Pillen; der Konfig-Knopf rechts
     ist icon-only (⚙), sonst sprang „Positionen konfigurieren" in die 2. Zeile. */
  .sortleiste{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;margin-bottom:10px}
  .sortleiste span{font:600 10px var(--mono);letter-spacing:.06em;
                   text-transform:uppercase;color:var(--soft);margin-right:1px;
                   white-space:nowrap;flex:none}
  .sortleiste button{border:none;background:var(--sheet);color:var(--soft);
    border-radius:999px;padding:8px 12px;font:600 11.5px var(--disp);cursor:pointer;
    min-height:38px;white-space:nowrap;flex:none;box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .sortleiste button[aria-pressed=true]{background:var(--teal-l);color:var(--teal-d)}
  /* N189 — Knopf rechts in der Sortierleiste öffnet den Konfig-Modus inline. */
  .sortleiste .pos-konfig{margin-left:auto;display:inline-flex;align-items:center;
    justify-content:center;padding:8px;min-width:40px;flex:none;
    color:var(--teal-d);background:var(--teal-l)}
  .sortleiste .pos-konfig svg{width:17px;height:17px}

  /* ---- N189: Konfig-Modus (inline) ---------------------------------------- */
  .konf-leiste{display:flex;margin-bottom:12px}
  .konf-fertig{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;background:var(--teal);color:#fff;border-radius:13px;padding:13px 16px;
    font:600 13px var(--disp);letter-spacing:-.01em;cursor:pointer;min-height:48px;
    box-shadow:0 2px 6px rgba(15,110,92,.18)}
  .konf-fertig:hover{background:var(--teal-d)}
  .konf-hinweis{font:400 12.5px var(--body);color:var(--soft);line-height:1.55;
    background:var(--teal-l);border-radius:12px;padding:12px 14px;margin-bottom:18px}
  .konf-hinweis b{color:var(--teal-d);font-weight:600}
  .konf-zeile{margin-bottom:8px}
  .konf-zeile .kopf{padding:11px 14px;gap:10px;flex-wrap:wrap}
  .konf-zeile.verborgen{opacity:.62}
  .konf-zeile.fest{background:linear-gradient(100deg,#EEF2F1 0%,var(--sheet) 60%)}
  .konf-fest-tag{flex:none;font:600 10px var(--mono);letter-spacing:.06em;
    text-transform:uppercase;color:var(--soft);background:#EDF1F0;border-radius:999px;
    padding:6px 11px;white-space:nowrap}
  .konf-steuer{display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;margin-left:auto}
  /* Anzeige-Schalter */
  .konf-sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;position:relative;
    min-height:44px}
  .konf-sw input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
  .konf-swl{font:600 11px var(--mono);letter-spacing:.04em;color:var(--soft);
    min-width:62px}
  .pk-sw{flex:none;width:42px;height:24px;border-radius:999px;background:var(--line);
    position:relative;transition:background .15s}
  .pk-sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;
    border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .konf-sw input:checked ~ .pk-sw{background:var(--teal)}
  .konf-sw input:checked ~ .pk-sw::after{transform:translateX(18px)}
  .konf-sw input:checked ~ .konf-swl{color:var(--teal-d)}
  /* Pflicht/optional — segmentierter Umschalter */
  .konf-seg{flex:none;display:inline-flex;background:#EDF1F0;border-radius:11px;padding:3px}
  .konf-opt{border:none;background:transparent;color:var(--soft);border-radius:9px;
    padding:9px 14px;font:600 11.5px var(--disp);cursor:pointer;min-height:40px;white-space:nowrap}
  .konf-opt.an{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(22,38,44,.12)}
  .konf-opt[data-optional="0"].an{color:var(--neg)}
  /* N351 — § 35a-Schalter je Kostenart: aus (grau umrandet) / an (amber). */
  .konf-s35{flex:none;border:1.5px solid var(--line);background:var(--sheet);
    color:var(--soft);border-radius:9px;padding:7px 10px;min-height:38px;
    font:600 11px var(--mono);letter-spacing:.03em;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .konf-s35.an{border-color:var(--amber);background:var(--amber-bg);
    color:var(--amber)}
  .konf-opt[data-optional="1"].an{color:var(--teal-d)}
  .konf-opt:disabled{opacity:.4;cursor:not-allowed}
  @media(max-width:520px){
    .konf-steuer{width:100%;margin-left:34px;justify-content:space-between}
  }

  .abschluss{border-radius:16px;padding:18px;margin:16px 0 4px}
  .abschluss .at{font:700 16px var(--disp);letter-spacing:-.015em;margin-bottom:6px}
  .abschluss p{font:400 13px var(--body);margin:0 0 14px;line-height:1.5}
  .abschluss.bereit{background:var(--pos-bg);color:var(--pos)}
  .abschluss.offen{background:var(--sheet);color:var(--ink);
                   box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .abschluss.offen p{color:var(--soft)}
  .abschluss.fertig{background:#EEF2F1;color:var(--soft)}
  .abschluss.fertig p{color:var(--soft);margin-bottom:0}
  .uebergehen{display:flex;align-items:center;gap:10px;margin-bottom:14px;
              font:500 13px var(--body);color:var(--ink);cursor:pointer;min-height:44px}
  .uebergehen input{width:20px;height:20px;flex:none}
  .losbutton{width:100%;border:none;border-radius:12px;padding:15px;cursor:pointer;
    font:600 15px var(--disp);background:var(--pos);color:#fff;min-height:48px;
    box-shadow:0 6px 16px -8px rgba(46,125,79,.7)}
  .losbutton:hover{background:#276b44}
  .losbutton[disabled]{background:#C2CCCB;color:#fff;box-shadow:none;cursor:default}

  /* Versandplan vor dem Abschluss: eine Zeile je Partei, der Leerstand ruhig
     am Ende. Er ist kein Empfänger, sondern der Anteil des Eigentümers. */
  .vdlg .vliste{max-height:min(44dvh,330px);overflow:auto;margin:0 0 16px;
                background:var(--sheet);border-radius:12px}
  .vdlg .vz{display:flex;align-items:flex-start;gap:10px;padding:12px 13px}
  .vdlg .vz + .vz{border-top:1px solid var(--line)}
  .vdlg .vn{flex:1;min-width:0;font:600 13px var(--body);color:var(--ink);
            overflow-wrap:anywhere}
  .vdlg .vs{display:block;font:400 11px var(--body);color:var(--soft);
            margin-top:3px;line-height:1.45}
  .vdlg .vm{flex:none;margin-top:1px}

  /* ================= N280 — WEG-Abrechnung ================================
     Der Schalter steht auf jedem Zeitraum, schmal wie eine Zeile. Ist er an,
     tritt die Dateiuebernahme an die Stelle der ganzen Checkliste. */
  .weg-schalter{display:flex;align-items:center;gap:12px;background:var(--sheet);
    border-radius:16px;padding:12px 14px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(22,38,44,.07)}
  .weg-schalter.an{background:var(--teal-l);
    box-shadow:inset 3px 0 0 var(--teal),0 1px 3px rgba(22,38,44,.07)}
  .weg-schalter .ws-ikon{flex:none;width:26px;height:26px;color:var(--teal-d);
    display:inline-flex;align-items:center;justify-content:center}
  .weg-schalter .ws-ikon svg{width:24px;height:24px;display:block}
  .weg-schalter .ws-t{flex:1;min-width:0;font:600 13px var(--disp);
    letter-spacing:-.01em;color:var(--ink)}
  .weg-schalter .ws-s{display:block;font:400 11.5px var(--body);color:var(--soft);
    line-height:1.4;margin-top:3px}
  .ws-kipp{flex:none;width:52px;height:30px;border:none;border-radius:15px;
    background:#C7D2D0;cursor:pointer;position:relative;padding:0;
    transition:background .16s}
  .ws-kipp[aria-checked="true"]{background:var(--teal)}
  .ws-kipp[disabled]{opacity:.5;cursor:default}
  .ws-kipp i{position:absolute;top:3px;left:3px;width:24px;height:24px;
    border-radius:50%;background:#fff;transition:transform .16s;
    box-shadow:0 1px 3px rgba(22,38,44,.35)}
  .ws-kipp[aria-checked="true"] i{transform:translateX(22px)}

  .weg-karte .weg-kopf{display:flex;align-items:baseline;gap:10px;
    margin-bottom:4px}
  .weg-karte .weg-kopf h3{margin:0;flex:1;min-width:0}
  .weg-karte .weg-summe{flex:none;font:700 15px var(--mono);color:var(--ink)}
  .weg-plus{flex:none;width:36px;height:36px;border:1.5px solid var(--teal);
    border-radius:11px;background:transparent;color:var(--teal);cursor:pointer;
    font:400 22px/1 var(--body);align-self:center}
  .weg-plus:hover{background:var(--teal-l)}
  .weg-karte .erklaer{display:block;font:400 11.5px var(--body);color:var(--soft);
    line-height:1.45;margin:0 0 12px}
  .weg-leer{font:400 12.5px var(--body);color:var(--soft);line-height:1.5;
    background:var(--paper);border-radius:11px;padding:11px 13px}

  .weg-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  .weg-chip{font:500 11px var(--mono);color:var(--teal-d);background:var(--teal-l);
    border-radius:8px;padding:4px 8px;max-width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}

  .weg-datei{display:flex;flex-direction:column;gap:3px;background:var(--paper);
    border-radius:11px;padding:10px 12px;margin:0 0 12px}
  .weg-datei a{display:flex;align-items:center;gap:8px;color:var(--teal-d);
    font:600 12.5px var(--body);text-decoration:none;min-height:24px}
  .weg-datei a svg{flex:none;width:18px;height:18px}
  .weg-datei a span{min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .weg-datei .wd-ort{font:400 10.5px var(--mono);color:var(--soft);
    word-break:break-all;line-height:1.4}

  .weg-los{display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;min-height:52px;border:none;border-radius:13px;background:var(--teal);
    color:#fff;cursor:pointer;font:600 14px var(--body);margin:2px 0 8px;
    padding:0 14px}
  .weg-los:hover{background:var(--teal-d)}
  .weg-los svg{flex:none;width:20px;height:20px}

  /* Die Positionsliste als Balken: die Groesse der Zahl wird sichtbar. */
  .weg-liste{display:flex;flex-direction:column;gap:7px}
  .weg-zeile{display:flex;align-items:center;gap:10px}
  /* N351 — § 35a-Kennzeichen an der WEG-Zeile, für die Steuererklärung. */
  .wz-s35{display:inline-block;font:600 9px var(--mono);letter-spacing:.03em;
    color:var(--amber);background:var(--amber-bg);border-radius:6px;
    padding:2px 6px;vertical-align:middle}
  .weg-saldo .wsz.s35 span{color:var(--amber)}
  .weg-zeile .wz-n{flex:1 1 40%;min-width:0;font:500 12.5px var(--body);
    color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .weg-zeile .wz-bahn{flex:1 1 30%;min-width:34px;height:8px;border-radius:4px;
    background:var(--paper);overflow:hidden}
  .weg-zeile .wz-bahn i{display:block;height:100%;border-radius:4px;
    background:var(--teal)}
  .weg-zeile .wz-v{flex:none;font:600 12.5px var(--mono);color:var(--ink);
    text-align:right;min-width:74px}
  .weg-liste.aus .wz-bahn i{background:#A9B6B4}
  .weg-liste.aus .wz-n,.weg-liste.aus .wz-v{color:var(--soft)}

  .weg-nicht{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
  .weg-nicht .wn-kopf{display:flex;align-items:baseline;gap:10px;
    font:600 12px var(--disp);color:var(--soft)}
  .weg-nicht .wn-kopf span:first-child{flex:1;min-width:0}
  .weg-nicht .wn-v{flex:none;font:600 13px var(--mono)}
  .weg-nicht .wn-s{margin:4px 0 10px;font:400 11.5px var(--body);color:var(--soft);
    line-height:1.45}

  .weg-warn{display:flex;gap:9px;background:var(--amber-bg);border-radius:11px;
    padding:10px 12px;margin:0 0 12px;font:400 12px var(--body);color:var(--ink);
    line-height:1.5}
  .weg-warn .ww-z{flex:none;color:var(--amber);font-weight:700}
  .weg-warn.leise{background:var(--paper);color:var(--soft)}
  .weg-warn.leise .ww-z{color:var(--soft)}
  .weg-warn b{color:var(--ink)}

  /* Trennstrich zwischen den Abschnitten, nicht hinter dem letzten: `:last-of-type`
     zählt Elementtypen, nicht Klassen — mit der Summenzeile darunter (auch ein
     div) hätte es nie gegriffen und zwei Linien nebeneinander gezogen. */
  .weg-vz{display:flex;align-items:center;gap:10px;padding:9px 0;flex-wrap:wrap}
  .weg-vz + .weg-vz{border-top:1px solid var(--line)}
  .weg-vz .wv-n{flex:1 1 40%;min-width:0;font:600 12.5px var(--body);color:var(--ink)}
  .weg-vz .wv-s{display:block;font:400 10.5px var(--mono);color:var(--soft);
    margin-top:2px}
  .weg-vz .wv-r{flex:none;font:400 11.5px var(--mono);color:var(--soft)}
  .weg-vz .wv-v{flex:none;min-width:82px;text-align:right;
    font:600 13px var(--mono);color:var(--ink)}
  .weg-vz .wv-k{flex:none;display:flex;gap:4px}
  .wv-b{min-height:36px;padding:0 11px;border:1.5px solid var(--line);
    border-radius:9px;background:transparent;color:var(--soft);cursor:pointer;
    font:600 11.5px var(--body)}
  .wv-b:hover{border-color:var(--teal);color:var(--teal)}
  .wv-x{width:36px;height:36px;border:1.5px solid var(--line);border-radius:9px;
    background:transparent;color:var(--soft);cursor:pointer;font:400 17px/1 var(--body)}
  .wv-x:hover{border-color:var(--neg);color:var(--neg)}
  .weg-vzsumme{display:flex;justify-content:space-between;align-items:baseline;
    gap:10px;margin-top:12px;padding-top:11px;border-top:2px solid var(--line);
    font:600 12.5px var(--body);color:var(--soft)}
  .weg-vzsumme span:last-child{font:700 15px var(--mono);color:var(--ink)}

  /* Der Saldo — deutlich abgesetzt, Doppelstrich vor der Endzeile. */
  .weg-saldo{background:var(--sheet);border-radius:16px;padding:16px;
    margin-bottom:12px;box-shadow:0 1px 3px rgba(22,38,44,.07)}
  .weg-saldo .wsz{display:flex;justify-content:space-between;align-items:baseline;
    gap:12px;padding:5px 0;font:500 12.5px var(--body);color:var(--soft)}
  .weg-saldo .wsz span:last-child{font:600 13px var(--mono);color:var(--ink)}
  .weg-saldo .wsz.gross{margin-top:9px;padding-top:12px;
    border-top:3px double var(--ink);font:700 14px var(--disp);color:var(--ink)}
  .weg-saldo .wsz.gross span:last-child{font:700 21px var(--mono)}
  .weg-saldo.neg .wsz.gross span:last-child{color:var(--neg)}
  .weg-saldo.pos .wsz.gross span:last-child{color:var(--pos)}

  /* Die Bestaetigung der gelesenen Abrechnung: eine Tabelle, nicht editierbar. */
  dialog.immo-dlg.weg-best-dlg{max-width:min(680px,calc(100% - 24px))}
  .weg-best-dlg .wb-fuer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--paper);border-radius:11px;padding:9px 12px;margin:0 0 10px;
    font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;
    color:var(--soft);flex:none}
  .weg-best-dlg .wb-einheit{flex:1;min-width:140px;min-height:42px;
    border:1.5px solid #C3DAD2;border-radius:10px;background:var(--sheet);
    padding:0 10px;font:500 13px var(--body);color:var(--ink);
    text-transform:none;letter-spacing:0}
  .weg-best-dlg .wb-eintext{flex:1;min-width:0;font:600 13px var(--body);
    color:var(--ink);text-transform:none;letter-spacing:0}
  .weg-best-dlg .wb-eintext.warn{color:var(--neg)}
  /* EIN Rollbereich für die ganze Abrechnung — Positionen und der nicht
     umlagefähige Block gehören zusammen. Rollte nur die Positionsliste, blieb
     auf dem Telefon Platz für zwei Zeilen, während der Block darunter stand. */
  .weg-best-dlg .wb-rolle{flex:1 1 auto;min-height:0;overflow-y:auto;
    display:flex;flex-direction:column;gap:12px}
  .weg-best-dlg .wb-liste{display:flex;flex-direction:column;flex:none}
  .weg-best-dlg .wb-kopfz,.weg-best-dlg .wb-z{display:flex;align-items:baseline;
    gap:10px;padding:6px 2px;border-bottom:1px solid var(--line)}
  .weg-best-dlg .wb-kopfz{font:600 10px var(--mono);letter-spacing:.08em;
    text-transform:uppercase;color:var(--soft);position:sticky;top:0;
    background:var(--sheet);z-index:1}
  .weg-best-dlg .wb-kopfz span:first-child{flex:1;min-width:0}
  .weg-best-dlg .wb-n{flex:1;min-width:0;font:500 12.5px var(--body);color:var(--ink)}
  .weg-best-dlg .wb-s{display:block;font:400 10px var(--mono);color:var(--soft);
    margin-top:1px}
  .weg-best-dlg .wb-g{flex:none;width:84px;text-align:right;
    font:400 11.5px var(--mono);color:var(--soft)}
  .weg-best-dlg .wb-v{flex:none;width:84px;text-align:right;
    font:600 12.5px var(--mono);color:var(--ink)}
  .weg-best-dlg .wb-z.summe{border-bottom:none;border-top:3px double var(--ink);
    margin-top:2px;padding-top:9px}
  .weg-best-dlg .wb-z.summe .wb-n{font-weight:700}
  .weg-best-dlg .wb-z.summe .wb-v{font-size:14px}
  .weg-best-dlg .wb-nicht{flex:none;background:var(--paper);
    border-radius:12px;padding:11px 12px}
  .weg-best-dlg .wb-nkopf{display:flex;gap:10px;align-items:baseline;
    font:600 12px var(--disp);color:var(--soft)}
  .weg-best-dlg .wb-nkopf span{flex:none;font:600 13px var(--mono)}
  .weg-best-dlg .wb-ns{margin:4px 0 8px;font:400 11px var(--body);color:var(--soft);
    line-height:1.45}
  .weg-best-dlg .wb-liste.aus .wb-n,.weg-best-dlg .wb-liste.aus .wb-v{
    color:var(--soft)}
  .weg-best-dlg .weg-chips{flex:none}
  .weg-best-dlg .weg-warn{flex:none}

  @media(max-width:430px){
    .weg-zeile{flex-wrap:wrap}
    .weg-zeile .wz-n{flex:1 1 100%}
    .weg-zeile .wz-bahn{flex:1 1 auto}
    /* Zwei Zeilen statt vier: oben wer und wie viel, darunter die Herleitung
       und die Knöpfe. Ohne die Reihenfolge sprängen die Knöpfe zwischen
       Betrag und Herleitung. */
    .weg-vz{align-items:flex-start;row-gap:8px}
    .weg-vz .wv-n{flex:1 1 55%}
    .weg-vz .wv-v{order:2}
    .weg-vz .wv-r{order:3;align-self:center}
    .weg-vz .wv-k{order:4;margin-left:auto}
    .weg-best-dlg .wb-g{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="back" id="back" aria-label="Zurück"></button>
    <div class="barwrap">
      <h1 id="titel">Abrechnung</h1>
      <div class="sub" id="sub">wird geladen …</div>
      <div class="frist-chip" id="fristchip"></div>
    </div>
  </div>

  <div class="scroll" id="inhalt"></div>
  <!-- Kamera fuer den Scan an einer offenen Position. capture=environment
       oeffnet auf iOS direkt die Ruecckamera. -->
  <input type="file" id="scanFeld" accept="image/*,application/pdf,.pdf" capture="environment" multiple
         style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"
         tabindex="-1" aria-hidden="true">

  <div data-nav></div>
</div>

<script type="module">
/* N215 — dieser Rumpf lädt die Zeitraum-Seite aus den Modulen unter
   `assets/zeitraum/`. Der große Inline-Script (~5700 Zeilen) wurde nach
   Topics aufgeteilt; siehe `assets/zeitraum/_TOPICS.md`. Hier wird nur
   die Navigation eingehängt, die zentrale Delegation gestartet und das
   erste `laden()` ausgeführt. */
import { installNav } from './assets/immo.js';
import { laden, initHandlers } from './assets/zeitraum/checkliste.js';
installNav();
initHandlers();
await laden();
</script>
</body>
</html>
