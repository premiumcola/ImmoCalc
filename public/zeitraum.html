/* Der Versandplan als Dialog: eine Zeile je Partei, damit vor dem Abschluss
   klar ist, wer die Abrechnung bekommt — und über welche Adressen. Der
   Leerstand steht ruhig am Ende: er ist kein vergessener Mieter, sondern der
   Anteil, den der Eigentümer selbst trägt. Liefert 'senden', 'nur' oder null.

   Eigener Dialog statt `wahl`: dort ginge alles in einem Fließtext auf, und
   genau die Unterscheidung, um die es hier geht, wäre wieder verwischt. */
function versandWahl(plan) {
  const zeile = (p, marke, klasse, unter) => `
    <div class="vz">
      <span class="vn">${esc(p.partei)}
        <span class="vs">${esc(unter)}</span></span>
      <span class="marke vm ${klasse}">${marke}</span>
    </div>`;

  const bereit = plan.parteien.filter(p => p.versandbereit);
  const ohne = plan.parteien.filter(p => !p.versandbereit && !p.leerstand);
  const leer = plan.parteien.filter(p => p.leerstand);
  const mieter = bereit.length + ohne.length;

  const liste = [
    ...bereit.map(p => zeile(p, 'Mail', 'gut', p.adressen.join(' · '))),
    ...ohne.map(p => zeile(p, 'Post', 'post',
      'Keine Mailadresse — ausdrucken und schicken')),
    ...leer.map(p => zeile(p, 'Leerstand', '', 'Bleibt beim Eigentümer')),
  ].join('');

  const satz = mieter
    ? `${bereit.length} von ${mieter} ${mieter === 1 ? 'Mietpartei bekommt'
        : 'Mietparteien bekommen'} die Abrechnung als PDF per Mail.`
    : 'Es gibt keine Mietpartei zu beliefern — der Zeitraum lässt sich '
      + 'trotzdem abschließen.';

  return new Promise(fertig => {
    const dlg = document.createElement('dialog');
    dlg.className = 'immo-dlg vdlg';
    dlg.innerHTML = `
      <div class="dt">Abrechnung abschließen</div>
      <p>${esc(plan.zeitraum)} · ${esc(satz)}</p>
      <div class="vliste">${liste}</div>
      ${bereit.length ? `<button class="btn"
        data-wahl="senden">Abschließen und verschicken</button>` : ''}
      <button class="btn leise" data-wahl="nur">Nur abschließen, nicht
        verschicken</button>
      <button class="btn leise" data-nein>Abbrechen</button>`;
    document.body.appendChild(dlg);
    dlg.addEventListener('close', () => dlg.remove());
    dlg.addEventListener('cancel', () => fertig(null));
    dlg.addEventListener('click', e => {
      const knopf = e.target.closest('[data-wahl]');
      if (knopf) { fertig(knopf.dataset.wahl); dlg.close(); }
      else if (e.target.closest('[data-nein]')) { fertig(null); dlg.close(); }
    });
    dlg.showModal();
  });
}

/* Vor dem Versand zeigen, wer was bekommt — und wem die Mailadresse fehlt. */
async function abschliessen(knopf) {
  const uebergehen = document.getElementById('uebergehen')?.checked || false;
  knopf.disabled = true;
  knopf.textContent = 'Prüfe Empfänger …';

  let plan;
  try {
    plan = await api(`/zeitraeume/${zid}/versand`);
  } catch (fehler) {
    knopf.disabled = false;
    knopf.textContent = 'Abrechnungen erstellen und versenden';
    melde(String(fehler.message || fehler), 'neg');
    return;
  }

  // Nicht jeder verschickt per Mail — wer die Abrechnung ausdruckt und mit
  // der Post schickt, muss den Zeitraum trotzdem abschliessen koennen.
  const weg = await versandWahl(plan);

  if (!weg) {
    knopf.disabled = false;
    knopf.textContent = 'Abrechnungen erstellen und versenden';
    return;
  }

  knopf.textContent = weg === 'senden' ? 'Verschicke …' : 'Schließe ab …';
  try {
    const antwort = await api(`/zeitraeume/${zid}/abschliessen`, {
      method: 'POST', body: { versenden: weg === 'senden',
                              offene_uebergehen: uebergehen },
    });
    melde(antwort.versendet.length
      ? `${antwort.versendet.length} Abrechnung(en) verschickt an ${antwort.versendet.join(', ')}`
      : 'Zeitraum abgeschlossen — versendet wurde nichts.',
      antwort.versendet.length ? 'pos' : '');
    await laden();
  } catch (fehler) {
    knopf.disabled = false;
    knopf.textContent = 'Abrechnungen erstellen und versenden';
    melde(String(fehler.message || fehler), 'neg');
  }
}

async function laden() {
  if (!zid) {
    inhalt.innerHTML = '<div class="empty"><div class="big">Kein Zeitraum gewählt</div></div>';
    return;
  }
  try {
    daten = await api(`/zeitraeume/${zid}`);
  } catch {
    inhalt.innerHTML = `<div class="empty"><div class="big">Zeitraum nicht gefunden</div></div>`;
    return;
  }
  // Die Schlüssel-Vorschau ist Beiwerk: fehlt sie, bleibt die Checkliste
  // bedienbar, nur ohne Auswahlfeld und ohne Ableitung.
  try {
    schluessel = await api(`/zeitraeume/${zid}/schluessel`);
  } catch {
    schluessel = null;
  }
  leerstaende = new Set(
    (schluessel?.schluessel || []).flatMap(s => s.leerstand || []));
  // CCLV — die kostenfreien Themen-Anhänger. Beiwerk: fehlt der Endpunkt (noch
  // nicht deployt), bleibt die Checkliste ohne Anhänger bedienbar.
  try {
    anhaenger = await api(`/dokumente/anhaenger/${zid}`);
  } catch {
    anhaenger = null;
  }
  // NK-STRUKTUR — die Ablese-Maske liefert den Zählerverbrauch je Kostenart für
  // den Chip. Beiwerk: fehlt der Endpunkt, bleibt die Checkliste ohne Chips.
  try {
    ablesungMaske = await api(`/zeitraeume/${zid}/ablesung`);
  } catch {
    ablesungMaske = null;
  }
  // N114 — die Heizkosten stehen nicht als Positionsbetrag, sondern entstehen
  // aus der FIFO-Bewertung des Öl-Verbrauchs. Die Zeile soll sie trotzdem
  // ausweisen statt „Datei wählen" anzubieten, als waere nichts erfasst.
  try {
    const b = await api(`/objekte/${encodeURIComponent(daten.objekt)}`
      + `/heizoel/bewertung?zeitraum_id=${zid}`);
    heizoelKosten = b?.verbrauch_kosten || 0;
    // N118 — den §9-Split gleich mitziehen, damit die Zeile „Warmwasser-
    // erzeugung" ihre Gesamtkosten oben rechts ausweisen kann.
    const zl = ablesungMaske?.zaehler || [];
    const wwH = zl.find(z => wasserArt(z) === 'Warmwasser' && !z.hauptzaehler_id);
    const vol = wwH?.verbrauch != null ? wwH.verbrauch
      : zl.filter(z => wasserArt(z) === 'Warmwasser' && z.hauptzaehler_id)
          .reduce((su, z) => su + (z.verbrauch || 0), 0);
    const sp = heizoelKosten > 0 ? await api(
      `/objekte/${encodeURIComponent(daten.objekt)}/waerme/split`
      + `?oel_kosten=${heizoelKosten}&oel_liter=${b?.verbrauch_liter || 0}`
      + `&ww_volumen_m3=${vol}`).catch(() => null) : null;
    wwKosten = sp?.ww_kosten || 0;
  } catch { heizoelKosten = 0; wwKosten = 0; }
  // N82b — die NK-Vorauszahlungen des Zeitraums für die Deckungs-Anzeige.
  try {
    const ab = await api(`/zeitraeume/${zid}/abrechnung`);
    deckungAbschlaege = ab?.gesamt?.abschlaege ?? null;
    deckungUmgelegt = ab?.gesamt?.auslagen ?? null;
  } catch {
    deckungAbschlaege = null;
    deckungUmgelegt = null;
  }
  // N58 — die realen Einheiten des Objekts als Fallback für den Auswähler.
  // Beiwerk: fehlt der Endpunkt, genügt die Schlüssel-Vorschau.
  try {
    const o = await api(`/objekte/${daten.objekt}`);
    // N77c — nur Einheiten, die an der NK teilnehmen (Garage: nk_abrechnung=false → raus).
    objektEinheiten = (o.einheiten || [])
      .filter(e => typeof e === 'string' || e.nk_abrechnung !== false)
      .map(e => typeof e === 'string'
        ? e : (e.bezeichnung || e.name || e.einheit || '')).filter(Boolean);
  } catch {
    objektEinheiten = [];
  }
  chipMap = baueChipMap();
  // N34 — Titel: „Abrechnungszeitraum <Jahr> · von – bis" (Jahr = Jahr mit den
  // meisten Tagen). Fällt das Backend-`jahr` mal aus, gilt das Jahr aus dem Ende.
  const jahrLabel = daten.jahr || Number((daten.ende || '').slice(0, 4)) || '';
  titel.textContent = `Abrechnungszeitraum ${jahrLabel}`.trim();
  sub.textContent = `${daten.label} · ${daten.objekt_name}`;
  fristChipSetzen();
  await zeichnen();
}

/* Prozentanteile beim Tippen mitrechnen — sonst sieht man erst nach dem
   Speichern, was man da eigentlich verteilt hat. */
inhalt.addEventListener('input', e => {
  // CCCLIX — Teilbetrag: netto tippen, Brutto (× 1,19) rechnet live daneben.
  if (e.target.matches('[data-vorab-netto]')) {
    const netto = Number(String(e.target.value).replace(',', '.')) || 0;
    const ziel = e.target.closest('.vorab')?.querySelector('[data-vorab-brutto]');
    if (ziel) ziel.textContent = bruttoAnzeige(netto);
    return;
  }
  if (!e.target.matches('[data-gewicht]')) return;
  const vt = e.target.closest('.vt');
  const felder = [...vt.querySelectorAll('[data-gewicht]')];
  const summe = felder.reduce((s, f) => s + (Number(f.value) || 0), 0);
  // Bei abgeleiteten Schlüsseln rechnet der €-Betrag (Leitzahl) live mit — der
  // Rest steht am Block. Beim manuellen Schlüssel fehlt das €-Ziel und es bleibt
  // beim Prozent-Update; endgültig gerechnet wird ohnehin nach dem Speichern.
  const rest = Number(vt.dataset.rest || 0);
  felder.forEach(f => {
    const ziel = f.parentElement.querySelector('[data-anteil]');
    if (ziel) ziel.textContent = prozentText(f.value, summe);
    const euroZiel = f.parentElement.querySelector('[data-euro]');
    if (euroZiel) euroZiel.textContent = eur(summe > 0
      ? rest * (Number(f.value) || 0) / summe : 0);
  });
});

inhalt.addEventListener('change', e => {
  // Der Versand bleibt gesperrt, bis die Restposten bewusst abgehakt sind.
  if (e.target.id === 'uebergehen') {
    const knopf = document.getElementById('abschlussKnopf');
    if (knopf) knopf.disabled = !e.target.checked;
    return;
  }
  // Der Betrag speichert sich beim Verlassen des Feldes.
  if (e.target.matches('[data-betrag]')) betragSpeichern(e.target);
  // CCCLXIII — Anbieter/Gewerk der Kostenart speichert sich genauso.
  if (e.target.matches('[data-anbieter]')) anbieterSpeichern(e.target);
  // N47/N60 — Anfang/Ende (Stand oder Datum) eines Zählers speichern.
  if (e.target.matches('[data-endstand]')) endstandSpeichern(e.target);
  if (e.target.matches('[data-anfangstand]')) anfangstandSpeichern(e.target);
  // N88 — ein geändertes Ablesedatum speichert NICHTS von selbst. Genau eine
  // solche Automatik hatte beim Tippen (Tag→Monat→Jahr) fremde Stände
  // überschrieben. Das Datum fährt beim Speichern eines Stands mit; wurde es
  // allein geändert, blendet dieser Handler nur den ausdrücklichen Knopf ein.
  if (e.target.matches('[data-anfangdatum],[data-enddatum]')) datumGeaendert(e.target);
  // N120 — der Jahreswert eines direkt erfassten Strom-Zählers und die Rolle,
  // die eine Zeile im Strom-Block einnimmt.
  if (e.target.matches('[data-strom-jahr]')) stromJahreswertSpeichern(e.target);
  if (e.target.matches('[data-strom-rolle-set]')) stromRolleSetzen(e.target);
  // N122 — die kWh-Menge hinter dem Betrag einer Strom-Position.
  if (e.target.matches('[data-strom-menge]')) stromMengeSpeichern(e.target);
  // N142 — einer der drei SolarEdge-Anteile in der Stromkette.
  if (e.target.matches('[data-sk-anteil]')) stromAnteilSpeichern(e.target);
  // N74 — die drei Wasser-Bestandteil-Beträge in der Inline-Detailtabelle.
  if (e.target.matches('[data-wasser-pid],[data-wasser-ka]')) wasserBetragSpeichern(e.target);
  // N116/N144 - abgerechnete Menge aus dem Bescheid: wird am Zeitraum
  // gespeichert und bleibt damit stehen; die Verteilung rechnet sofort damit.
  if (e.target.matches('[data-wasser-rechnung]')) {
    wasserRechnungsmengeSpeichern(e.target);
  }
  // CCCLXII — Kostenart der Position wechseln (Wähler + Freitext für eine neue).
  if (e.target.matches('[data-kostenart-pos]')) kostenartWechseln(e.target);
  if (e.target.matches('[data-kostenart-neu]')) kostenartNeu(e.target);
  // CCCLIX — Teilbetrag (netto) und §35a-Schalter speichern sich auf dieselbe Art.
  if (e.target.matches('[data-vorab-netto]')) vorabNettoSpeichern(e.target);
  if (e.target.matches('[data-vorab-s35]')) {
    vorabPatch(e.target.dataset.vorabS35, { vorab_s35: e.target.checked });
  }
});

inhalt.addEventListener('click', async e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { ansicht = tab.dataset.tab; return zeichnen(); }

  const sort = e.target.closest('[data-sort]');
  if (sort) { sortierung = sort.dataset.sort; return zeichnen(); }
  if (e.target.closest('[data-pos-konfig]')) return positionenKonfig();

  // N60 — Zählerstände-Einklapper auf/zu (ohne Neuaufbau; Zustand gemerkt).
  const zt = e.target.closest('[data-zu-toggle]');
  if (zt) {
    const panel = zt.closest('.zu-panel');
    const block = panel?.dataset.zuBlock || '';
    const jetztOffen = !panel.classList.contains('offen');
    if (jetztOffen) zaehlerOffen.add(block); else zaehlerOffen.delete(block);
    panel.classList.toggle('offen', jetztOffen);
    zt.setAttribute('aria-expanded', String(jetztOffen));
    return;
  }
  // N58 — eine Einheit-Zuordnung eines Zählers umschalten.
  const eToggle = e.target.closest('[data-einheit-toggle]');
  if (eToggle) return einheitToggle(eToggle);

  // N88 — ein allein geändertes Ablesedatum ausdrücklich übernehmen.
  const dUeb = e.target.closest('[data-datum-uebernehmen]');
  if (dUeb) return datumUebernehmen(dUeb);

  const abschluss = e.target.closest('[data-abschluss]');
  if (abschluss) return abschliessen(abschluss);

  const oeffnen = e.target.closest('[data-oeffnen]');
  if (oeffnen) return wiederOeffnen(oeffnen);

  const ableiten = e.target.closest('[data-ableiten]');
  if (ableiten) return verteilungAbleiten(ableiten);

  const anlegen = e.target.closest('[data-anlegen]');
  if (anlegen) return positionAnlegen(anlegen);

  // „Nur eine Einheit/Person": die gewählte Einheit setzen.
  const einzel = e.target.closest('[data-einzel-einheit]');
  if (einzel) return einzelSetzen(einzel.dataset.einzelPid,
                                  einzel.dataset.einzelEinheit);

  // CCCLIX — Teilbetrag: Zugang aufklappen, Einheit wählen, entfernen.
  const vorabAuf = e.target.closest('[data-vorab-oeffnen]');
  if (vorabAuf) {
    vorabOffen.add(Number(vorabAuf.dataset.vorabOeffnen));
    return zeichnen();
  }
  const vorabE = e.target.closest('[data-vorab-einheit-pid]');
  if (vorabE) return vorabPatch(vorabE.dataset.vorabEinheitPid,
                                { vorab_einheit: vorabE.dataset.vorabEinheit });
  const vorabWeg = e.target.closest('[data-vorab-entfernen]');
  if (vorabWeg) return vorabEntfernen(vorabWeg);

  // „Fertig": die Karte einfach wieder zuklappen.
  const fertig = e.target.closest('[data-fertig]');
  if (fertig) { offen.delete(Number(fertig.dataset.fertig)); return zeichnen(); }

  const wegSpeichern = e.target.closest('[data-weg-speichern]');
  if (wegSpeichern) return wegDirektSpeichern(wegSpeichern);

  const entwJa = e.target.closest('[data-entwurf-ja]');
  if (entwJa) return entwurfBestaetigen(entwJa.dataset.entwurfJa, entwJa);

  const entwNein = e.target.closest('[data-entwurf-nein]');
  if (entwNein) return entwurfVerwerfen(entwNein.dataset.entwurfNein,
                                        entwNein.dataset.art, entwNein);

  const entfernen = e.target.closest('[data-entfernen]');
  if (entfernen) return positionEntfernen(entfernen);

  const auf = e.target.closest('[data-auf]');
  if (auf) {
    // N74 — Wasser ohne Rechnung hat nichts aufzuklappen; der Klick tut nichts
    // (der Weg zur Position ist „Datei wählen"/Drop).
    if (auf.hasAttribute('data-noexpand')) return;
    const i = Number(auf.dataset.auf);
    offen.has(i) ? offen.delete(i) : offen.add(i);
    return zeichnen();
  }

  const anhaengenKnopf = e.target.closest('[data-anhaengen]');
  if (anhaengenKnopf) return anhaengen(anhaengenKnopf.dataset.anhaengen);

  // N79 — Heizöl-Lieferung hinzufügen / entfernen.
  const hoAdd = e.target.closest('[data-heizoel-add]');
  if (hoAdd) return heizoelHinzufuegen(hoAdd);
  const hoWeg = e.target.closest('[data-heizoel-weg]');
  if (hoWeg) return heizoelEntfernen(hoWeg.dataset.heizoelWeg);
  // N113 - Verteilungsschluessel des Wasser-Rests umschalten.
  const wsch = e.target.closest('[data-wasser-schluessel]');
  if (wsch) {
    wasserSchluessel = wsch.dataset.wasserSchluessel;
    const box = wsch.closest('[data-wasser-inline]');
    if (box) return fuelleWasserInline(box);
    return zeichnen();
  }
  // N95 — einen Beleg aus seiner Kostenposition herausnehmen (Datei bleibt).
  const belegWeg = e.target.closest('[data-beleg-loesen]');
  if (belegWeg) { e.preventDefault(); return belegLoesen(belegWeg.dataset.belegLoesen); }
  // N122 — Herkunft einer Strom-Position: Netzbezug oder eigene Anlage.
  const herk = e.target.closest('[data-herkunft]');
  if (herk) return stromHerkunftSetzen(herk);
  // N120 — Strom-Zähler anlegen / entfernen.
  const stAdd = e.target.closest('[data-strom-add]');
  if (stAdd) return stromZaehlerAnlegen(stAdd);
  const stWeg = e.target.closest('[data-strom-weg]');
  if (stWeg) return stromZaehlerEntfernen(stWeg);
  // N94 — Gartenwasser ohne Zähler eintragen.
  const gAdd = e.target.closest('[data-garten-anlegen]');
  if (gAdd) return gartenAnlegen(gAdd);
  // N81 — Heizkörper (HKV) hinzufügen / entfernen.
  const hkvAdd = e.target.closest('[data-hkv-add]');
  if (hkvAdd) return hkvHinzufuegen(hkvAdd);
  const hkvWeg = e.target.closest('[data-hkv-weg]');
  if (hkvWeg) return hkvEntfernen(hkvWeg.dataset.hkvWeg);
  // N135 — Zähler umbenennen (alle Zähler, nicht nur Strom).
  const umb = e.target.closest('[data-zaehler-umbenennen]');
  if (umb) { e.preventDefault(); e.stopPropagation();
    return zaehlerUmbenennen(umb.dataset.zaehlerUmbenennen); }

  const beleg = e.target.closest('[data-beleg]');
  if (beleg) {
    e.preventDefault();
    // Der Beleg wird durch die API gereicht — Nextcloud verlangt sonst eine
    // eigene Anmeldung. Angezeigt wird er im Dialog, nicht in einem neuen
    // Fenster: aus dem kommt man auf dem Telefon nicht mehr zurueck.
    // N99 - den Ablageort mitgeben (er steht schon als title am Link).
    belegAnsehen(`/api/dokumente/${beleg.dataset.beleg}/inhalt`,
                 beleg.dataset.name
                 || beleg.textContent.replace(/^PDF · /, '').trim(),
                 beleg.getAttribute('title') || '');
    return;
  }

  const scan = e.target.closest('[data-scan]');
  if (scan) {
    scanZiel = { kostenart: scan.dataset.scan, knopf: scan };
    document.getElementById('scanFeld').click();
    return;
  }

  // CCLXXXIII — Beleg aus der Ablage/Nextcloud wählen: hinüber in den
  // Dokumenteneingang, dort auf dieses Objekt + diese Kostenart vorgefiltert.
  // Das Prüfblatt kennt die Ziel-Abrechnung und ordnet den gewählten Beleg
  // beim Übernehmen genau dieser Position zu.
  const ablage = e.target.closest('[data-ablage]');
  if (ablage) {
    // CCCLXXII — das Abrechnungsjahr (Ende des Zeitraums) mitgeben, damit der
    // Eingang gleich am richtigen Ordner (…/60_Nebenkosten/<Jahr>) startet.
    const jahr = Number((daten.ende || '').slice(0, 4)) || new Date().getFullYear();
    const p = new URLSearchParams({
      objekt: daten.objekt, kostenart: ablage.dataset.ablage,
      zuordnenZeitraum: String(daten.id), jahr: String(jahr),
      zurueck: location.pathname + location.search,
    });
    location.href = 'eingang.html?' + p.toString();
    return;
  }
});

/* ---- Beleg direkt an einer offenen Position ------------------------------
   Die Aufnahmen werden im Browser zu einem PDF gebaut und mit Kostenart, Jahr
   und Objekt hochgeladen — der Umweg über den Eingang entfällt. Parallel geht
   die erste Aufnahme durch die Texterkennung; findet sie einen Betrag, wird er
   nur vorgeschlagen, nie ohne Rückfrage gespeichert. */
document.getElementById('scanFeld').addEventListener('change', async e => {
  const feld = e.target;
  const dateien = [...feld.files];
  feld.value = '';
  const ziel = scanZiel;
  scanZiel = null;
  if (!dateien.length || !ziel) return;

  const knopf = ziel.knopf;
  const beschriftung = knopf.querySelector('.st');
  const urText = beschriftung ? beschriftung.textContent : '';
  knopf.disabled = true;
  if (beschriftung) beschriftung.textContent = 'Verarbeite …';

  const istPdf = d => d.type === 'application/pdf' || /\.pdf$/i.test(d.name || '');
  const erstes = dateien.find(d => !istPdf(d)) || dateien[0];
  const jahr = Number((daten.ende || '').slice(0, 4)) || new Date().getFullYear();

  try {
    // N42 — ÜBERALL dieselbe Scan-Oberfläche: der Kamerascan-Overlay über
    // `belegScannen` (zuschneiden, mehrseitig, iOS-fest — N41), statt des alten
    // stillen `scanZuPdf`. Der Kontext gibt die Ablage vor (ich bin in dieser
    // Kostenart dieses Zeitraums), die KI-Erkennung liefert parallel den
    // Betragsvorschlag. So sieht und funktioniert Scannen hier wie unter
    // Vermietung.
    const [ergebnis, vorschlag] = await Promise.all([
      belegScannen(dateien, {
        objekt: daten.objekt, kategorie: 'Nebenkosten',
        kostenart: ziel.kostenart, jahr, zeitraumId: daten.id,
        titel: ziel.kostenart,
      }),
      erkennen(erstes).catch(() => null),
    ]);
    if (!ergebnis) {                                   // Zuschnitt abgebrochen
      knopf.disabled = false;
      if (beschriftung) beschriftung.textContent = urText;
      return;
    }
    const seiten = ergebnis.seiten || 1;
    if (beschriftung) {
      beschriftung.textContent = `✓ ${seiten} Seite${seiten > 1 ? 'n' : ''}`
        + (ergebnis.groesse ? ` · ${lesbareGroesse(ergebnis.groesse)}` : '');
    }
    if (vorschlag) await betragVorschlagen(ziel.kostenart, vorschlag);
    await laden();
  } catch (fehler) {
    if (beschriftung) beschriftung.textContent = 'Fehlgeschlagen';
    knopf.disabled = false;
    melde(String(fehler.message || fehler), 'neg');
  }
});

/* SHA-1 einer Datei als Hex — die Prüfsumme, mit der der Server erkennt, ob die
   exakt gleiche Datei schon in der Nextcloud liegt (CCCLXXXVI c). */
async function sha1Hex(datei) {
  const hash = await crypto.subtle.digest('SHA-1', await datei.arrayBuffer());
  return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
}

/* Die schlanke Bestätigung beim Drop: zeigt die KI-Erkennung („was ist das?"),
   und — liegt die Datei schon in der Ablage — den Hinweis samt Verknüpfen statt
   Hochladen. Objekt, Art (Nebenkosten) und Kostenart stehen aus dem Kontext
   fest, hier bleiben Bezeichnung, Jahr und der Betrag zum Bestätigen. Liefert
   die Auswahl oder null (abgebrochen). */
function belegDropDialog({ kostenart, vorschlag, dup, jahr, groesse, datei, anbieter }) {
  return new Promise(fertig => {
    const dlg = document.createElement('dialog');
    dlg.className = 'immo-dlg beleg-drop-dlg';
    document.body.appendChild(dlg);
    let entschieden = false;
    const blobUrl = datei ? URL.createObjectURL(datei) : '';
    dlg.addEventListener('close', () => {
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      dlg.remove();
      if (!entschieden) fertig(null);
    }, { once: true });
    const kiZeile = v => {
      const t = [];
      if (v?.sache) t.push(esc(v.sache));
      if (v?.absender) t.push(esc(v.absender));
      if (v?.datum) t.push(new Date(v.datum).toLocaleDateString('de-DE'));
      if (v?.betrag) t.push(eur(Math.abs(v.betrag)));
      return t.length ? `erkannt: ${t.join(' · ')}` : 'keine automatische Erkennung';
    };
    const dupHtml = dup?.gefunden ? `<div class="dup-hinweis">
        <strong>Diese Datei liegt schon in der Ablage.</strong>
        ${dup.im_ziel_ordner ? 'Im richtigen Ordner ✓' : 'Aber in einem anderen Ordner.'}
        ${dup.pfad ? `<span class="pfad">${esc(dup.pfad)}</span>` : ''}
        Statt sie erneut hochzuladen, wird der vorhandene Beleg verknüpft.</div>` : '';
    const istPdf = (datei?.type || '') === 'application/pdf' || /\.pdf$/i.test(datei?.name || '');
    const vorschau = !blobUrl ? '<div class="bdd-leer">Keine Vorschau</div>'
      : istPdf ? `<embed class="bdd-embed" src="${blobUrl}#toolbar=0&navpanes=0&view=Fit" type="application/pdf">`
      : `<img class="bdd-img" src="${blobUrl}" alt="Beleg-Vorschau">`;
    // CD — dynamischer Eyebrow: welche Immobilie, welcher Bereich. Gilt für
    // alle Einheiten (der Name kommt aus dem geladenen Zeitraum).
    const eyebrow = [daten.objekt_name, 'Nebenkosten'].filter(Boolean).map(esc).join(' · ');
    dlg.innerHTML = `
      <button class="immo-dlg-zu" data-nein aria-label="Schließen">×</button>
      ${eyebrow ? `<span class="bdd-eyebrow">${eyebrow}</span>` : ''}
      <div class="dt">Beleg zuordnen</div>
      <div class="bdd-body">
        <div class="bdd-links">
          <p class="zinfo">→ <strong>${esc(kostenart)}</strong> · ${lesbareGroesse(groesse)}
            <br><span class="bdd-ki" data-ki-zeile>${kiZeile(vorschlag)}</span></p>
          <button class="bdd-kibtn" data-ki-neu type="button"
            title="Beleg noch einmal von der KI lesen lassen">
            <span class="funke">✦</span><span class="lbl">KI neu lesen</span></button>
          <div class="bdd-zus" data-zus${vorschlag?.zusammenfassung ? '' : ' hidden'}
            >${esc(vorschlag?.zusammenfassung || '')}</div>
          ${dupHtml}
          <div class="field"><label>Bezeichnung</label>
            <input class="inp" data-f="beschreibung" value="${esc(vorschlag?.sache || kostenart)}"></div>
          <div class="field"><label>Firma / Gemeinde / Zweckverband</label>
            <input class="inp" data-f="firma" value="${esc(vorschlag?.absender || anbieter || '')}"
              placeholder="z. B. Zweckverband, Versicherer …"></div>
          <div class="field zwei">
            <div><label>Jahr</label>
              <input class="inp" type="number" data-f="jahr" value="${jahr}"></div>
            <div><label>Betrag (€)</label>
              <input class="inp" type="number" step="0.01" data-f="betrag"
                value="${vorschlag?.betrag != null ? Math.abs(vorschlag.betrag) : ''}"
                placeholder="Rechnungsbetrag"></div>
          </div>
          <div class="bdd-err" data-err hidden></div>
          <div class="bdd-fuss">
            <button class="btn" data-ok>${dup?.gefunden ? 'Verknüpfen' : 'Ablegen'}</button>
          </div>
        </div>
        <div class="bdd-rechts">${vorschau}</div>
      </div>`;
    // CCCXCIV — die KI den Beleg (neu) lesen lassen: der Knopf animiert, bis das
    // Ergebnis da ist, dann füllen sich Bezeichnung/Firma/Jahr/Betrag neu.
    const kibtn = dlg.querySelector('[data-ki-neu]');
    async function neuErkennen() {
      if (!datei || kibtn.classList.contains('laedt')) return;
      kibtn.classList.add('laedt'); kibtn.disabled = true;
      kibtn.querySelector('.lbl').textContent = 'KI liest …';
      try {
        const fd = new FormData();
        fd.append('datei', datei, datei.name || 'beleg.pdf');
        const r = await fetch('/api/dokumente/erkennen', { method: 'POST', body: fd });
        if (!r.ok) throw new Error(`Fehler ${r.status}`);
        const v = await r.json();
        const setF = (s, val) => {
          const el = dlg.querySelector(`[data-f="${s}"]`);
          if (el && val != null && val !== '') el.value = val;
        };
        if (v.sache) setF('beschreibung', v.sache);
        if (v.absender) setF('firma', v.absender);
        if (v.betrag) setF('betrag', Math.abs(v.betrag));
        if (v.jahr) setF('jahr', v.jahr);
        dlg.querySelector('[data-ki-zeile]').textContent = kiZeile(v);
        const zus = dlg.querySelector('[data-zus]');
        if (v.zusammenfassung) { zus.textContent = v.zusammenfassung; zus.hidden = false; }
        if (!v.ki) {
          melde('KI nicht aktiv (kein Schlüssel/Guthaben) — es gilt die einfache '
            + 'Erkennung. In den Einstellungen den Anthropic-Schlüssel hinterlegen.', 'neg');
        } else {
          melde('✦ KI-Erkennung aktualisiert', 'pos');
        }
      } catch (fehler) {
        melde('KI-Erkennung nicht möglich: ' + String(fehler.message || fehler), 'neg');
      } finally {
        kibtn.classList.remove('laedt'); kibtn.disabled = false;
        kibtn.querySelector('.lbl').textContent = 'KI neu lesen';
      }
    }
    kibtn.onclick = neuErkennen;
    dlg.querySelector('[data-nein]').onclick = () => dlg.close();
    dlg.querySelector('[data-ok]').onclick = () => {
      const f = s => dlg.querySelector(`[data-f="${s}"]`).value;
      const betrag = parseFloat(String(f('betrag')).replace(',', '.')) || 0;
      // N54 — ohne Betrag kann die Position keine Zahl tragen und bliebe grau;
      // der Server würde die Verbuchung verweigern. Also hier klar sagen, statt
      // scheinbar „abzulegen" und die Zeile ungefüllt zu lassen.
      if (!(betrag > 0)) {
        const err = dlg.querySelector('[data-err]');
        err.textContent = 'Bitte den Rechnungsbetrag eintragen — ohne ihn '
          + 'bleibt die Zeile leer.';
        err.hidden = false;
        const bf = dlg.querySelector('[data-f="betrag"]');
        bf.focus(); bf.select?.();
        return;
      }
      entschieden = true;
      fertig({
        aktion: dup?.gefunden ? 'verknuepfen' : 'ablegen',
        beschreibung: f('beschreibung').trim(),
        firma: f('firma').trim(),
        jahr: Number(f('jahr')) || jahr,
        betrag,
      });
      dlg.close();
    };
    dlg.showModal();
  });
}

/* N78 — der wasser-spezifische Drop-Dialog: wie `belegDropDialog`, aber mit DREI
   Betragsfeldern (Frisch-/Schmutz-/Niederschlagswasser) statt eines einzigen.
   Die KI liest sie voraus (`vorschlag.wasser`); „KI neu lesen" füllt sie neu.
   Liefert `{ aktion, beschreibung, firma, jahr, betrag, wasser:{…} }` oder null.
   `betrag` ist der Frischwasser-Betrag — er landet an der Wasser-Sammelposition,
   an die der Beleg gehängt wird; Schmutz/Niederschlag setzt `belegPerDrop`
   danach auf ihre eigenen Positionen. */
function belegWasserDialog({ kostenart, vorschlag, dup, jahr, groesse, datei, anbieter }) {
  return new Promise(fertig => {
    const dlg = document.createElement('dialog');
    dlg.className = 'immo-dlg beleg-drop-dlg';
    document.body.appendChild(dlg);
    let entschieden = false;
    const blobUrl = datei ? URL.createObjectURL(datei) : '';
    dlg.addEventListener('close', () => {
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      dlg.remove();
      if (!entschieden) fertig(null);
    }, { once: true });
    const kiZeile = v => {
      const t = [];
      if (v?.sache) t.push(esc(v.sache));
      if (v?.absender) t.push(esc(v.absender));
      if (v?.datum) t.push(new Date(v.datum).toLocaleDateString('de-DE'));
      const w = v?.wasser;
      if (w && (w.wasser || w.schmutz || w.niederschlag)) {
        const s = w.wasser + (w.schmutz || 0) + (w.niederschlag || 0);
        t.push(eur(s) + ' gesamt');
      } else if (v?.betrag) {
        t.push(eur(Math.abs(v.betrag)));
      }
      return t.length ? `erkannt: ${t.join(' · ')}` : 'keine automatische Erkennung';
    };
    const dupHtml = dup?.gefunden ? `<div class="dup-hinweis">
        <strong>Diese Datei liegt schon in der Ablage.</strong>
        ${dup.im_ziel_ordner ? 'Im richtigen Ordner ✓' : 'Aber in einem anderen Ordner.'}
        ${dup.pfad ? `<span class="pfad">${esc(dup.pfad)}</span>` : ''}
        Statt sie erneut hochzuladen, wird der vorhandene Beleg verknüpft.</div>` : '';
    const istPdf = (datei?.type || '') === 'application/pdf' || /\.pdf$/i.test(datei?.name || '');
    const vorschau = !blobUrl ? '<div class="bdd-leer">Keine Vorschau</div>'
      : istPdf ? `<embed class="bdd-embed" src="${blobUrl}#toolbar=0&navpanes=0&view=Fit" type="application/pdf">`
      : `<img class="bdd-img" src="${blobUrl}" alt="Beleg-Vorschau">`;
    const eyebrow = [daten.objekt_name, 'Nebenkosten'].filter(Boolean).map(esc).join(' · ');
    // Betrag eines Bereichs als Feldwert (positiv, ohne Nachkomma-Rauschen).
    const wv = v => (v != null && v !== '') ? Math.abs(v) : '';
    const w0 = vorschlag?.wasser || {};
    dlg.innerHTML = `
      <button class="immo-dlg-zu" data-nein aria-label="Schließen">×</button>
      ${eyebrow ? `<span class="bdd-eyebrow">${eyebrow}</span>` : ''}
      <div class="dt">Wasser-Beleg zuordnen</div>
      <div class="bdd-body">
        <div class="bdd-links">
          <p class="zinfo">→ <strong>${esc(kostenart)}</strong> · ${lesbareGroesse(groesse)}
            <br><span class="bdd-ki" data-ki-zeile>${kiZeile(vorschlag)}</span></p>
          <button class="bdd-kibtn" data-ki-neu type="button"
            title="Beleg noch einmal von der KI lesen lassen">
            <span class="funke">✦</span><span class="lbl">KI neu lesen</span></button>
          <div class="bdd-zus" data-zus${vorschlag?.zusammenfassung ? '' : ' hidden'}
            >${esc(vorschlag?.zusammenfassung || '')}</div>
          ${dupHtml}
          <p class="bdd-wasser-hint">Die drei Bereichs-Gebühren des Bescheids —
            von der KI vorausgelesen, bitte prüfen. Sie werden auf die Positionen
            Wasser, Abwasser und Niederschlagswasser gebucht.</p>
          <div class="field"><label>Bezeichnung</label>
            <input class="inp" data-f="beschreibung" value="${esc(vorschlag?.sache || kostenart)}"></div>
          <div class="field"><label>Firma / Gemeinde / Zweckverband</label>
            <input class="inp" data-f="firma" value="${esc(vorschlag?.absender || anbieter || '')}"
              placeholder="z. B. Zweckverband, Versicherer …"></div>
          <div class="field drei">
            <div><label>Frischwasser (€)</label>
              <input class="inp" type="number" step="0.01" data-f="w_wasser"
                value="${wv(w0.wasser)}" placeholder="0,00"></div>
            <div><label>Schmutzwasser (€)</label>
              <input class="inp" type="number" step="0.01" data-f="w_schmutz"
                value="${wv(w0.schmutz)}" placeholder="0,00"></div>
            <div><label>Niederschlag (€)</label>
              <input class="inp" type="number" step="0.01" data-f="w_niederschlag"
                value="${wv(w0.niederschlag)}" placeholder="0,00"></div>
          </div>
          <div class="field"><label>Jahr</label>
            <input class="inp" type="number" data-f="jahr" value="${jahr}"></div>
          <div class="bdd-err" data-err hidden></div>
          <div class="bdd-fuss">
            <button class="btn" data-ok>${dup?.gefunden ? 'Verknüpfen' : 'Ablegen'}</button>
          </div>
        </div>
        <div class="bdd-rechts">${vorschau}</div>
      </div>`;
    const kibtn = dlg.querySelector('[data-ki-neu]');
    async function neuErkennen() {
      if (!datei || kibtn.classList.contains('laedt')) return;
      kibtn.classList.add('laedt'); kibtn.disabled = true;
      kibtn.querySelector('.lbl').textContent = 'KI liest …';
      try {
        const v = await erkennen(datei, kostenart);
        if (!v) throw new Error('keine Antwort');
        const setF = (s, val) => {
          const el = dlg.querySelector(`[data-f="${s}"]`);
          if (el && val != null && val !== '') el.value = val;
        };
        if (v.sache) setF('beschreibung', v.sache);
        if (v.absender) setF('firma', v.absender);
        if (v.jahr) setF('jahr', v.jahr);
        const w = v.wasser || {};
        if (w.wasser != null) setF('w_wasser', Math.abs(w.wasser));
        if (w.schmutz != null) setF('w_schmutz', Math.abs(w.schmutz));
        if (w.niederschlag != null) setF('w_niederschlag', Math.abs(w.niederschlag));
        dlg.querySelector('[data-ki-zeile]').textContent = kiZeile(v);
        const zus = dlg.querySelector('[data-zus]');
        if (v.zusammenfassung) { zus.textContent = v.zusammenfassung; zus.hidden = false; }
        if (!v.ki) {
          melde('KI nicht aktiv (kein Schlüssel/Guthaben) — es gilt die einfache '
            + 'Erkennung. In den Einstellungen den Anthropic-Schlüssel hinterlegen.', 'neg');
        } else if (!w.wasser && !w.schmutz && !w.niederschlag) {
          melde('✦ KI gelesen — aber keine Wasser-Bereiche erkannt; bitte von Hand '
            + 'eintragen.', 'neg');
        } else {
          melde('✦ KI-Erkennung aktualisiert', 'pos');
        }
      } catch (fehler) {
        melde('KI-Erkennung nicht möglich: ' + String(fehler.message || fehler), 'neg');
      } finally {
        kibtn.classList.remove('laedt'); kibtn.disabled = false;
        kibtn.querySelector('.lbl').textContent = 'KI neu lesen';
      }
    }
    kibtn.onclick = neuErkennen;
    dlg.querySelector('[data-nein]').onclick = () => dlg.close();
    dlg.querySelector('[data-ok]').onclick = () => {
      const f = s => dlg.querySelector(`[data-f="${s}"]`).value;
      const zahl = s => parseFloat(String(f(s)).replace(',', '.')) || 0;
      const wasser = zahl('w_wasser'), schmutz = zahl('w_schmutz'),
            niederschlag = zahl('w_niederschlag');
      // Ohne einen einzigen Bereichsbetrag bliebe die Zeile leer — klar sagen,
      // statt scheinbar „abzulegen" (vgl. N54 im generischen Dialog).
      if (!(wasser > 0 || schmutz > 0 || niederschlag > 0)) {
        const err = dlg.querySelector('[data-err]');
        err.textContent = 'Bitte mindestens einen Bereichsbetrag eintragen — '
          + 'sonst bleibt die Zeile leer.';
        err.hidden = false;
        const bf = dlg.querySelector('[data-f="w_wasser"]');
        bf.focus(); bf.select?.();
        return;
      }
      entschieden = true;
      fertig({
        aktion: dup?.gefunden ? 'verknuepfen' : 'ablegen',
        beschreibung: f('beschreibung').trim(),
        firma: f('firma').trim(),
        jahr: Number(f('jahr')) || jahr,
        betrag: wasser,
        wasser: { wasser, schmutz, niederschlag },
      });
      dlg.close();
    };
    dlg.showModal();
  });
}

/* CCCXCVI — NK-Positionen ein-/ausblenden. Jede Kostenart des Objekts als
   Schalter; „aus" setzt `Kostenart.aktiv=false` (die Checkliste blendet sie dann
   aus, die Daten bleiben). Beim Schließen wird neu geladen. Nützlich für
   Positionen ohne laufende Kosten (z. B. Rauchwarnmelder, einmalig angeschafft). */
async function positionenKonfig() {
  let arten;
  try {
    arten = await api(`/objekte/${encodeURIComponent(daten.objekt)}/kostenarten`);
  } catch (fehler) {
    return melde('Kostenarten nicht ladbar', 'neg');
  }
  arten = (arten || []).slice().sort((a, b) => a.name.localeCompare(b.name, 'de'));
  const dlg = document.createElement('dialog');
  dlg.className = 'immo-dlg';
  document.body.appendChild(dlg);
  dlg.addEventListener('close', () => { dlg.remove(); laden(); });
  const zeile = a => `<label class="pk-zeile">
      <span class="pk-name">${esc(a.name)}</span>
      <input type="checkbox" data-pk="${a.id}"${a.aktiv !== false ? ' checked' : ''}>
      <span class="pk-sw" aria-hidden="true"></span>
    </label>`;
  dlg.innerHTML = `
    <button class="immo-dlg-zu" data-nein aria-label="Schließen">×</button>
    <div class="dt">Positionen ein- oder ausblenden</div>
    <p>Ausgeblendete Positionen verschwinden aus der Checkliste — die Daten
       bleiben erhalten und lassen sich hier jederzeit wieder einblenden.</p>
    <div class="pk-liste">${arten.map(zeile).join('')
      || '<div class="leerzeile">Keine Kostenarten</div>'}</div>
    <button class="btn" data-nein>Fertig</button>`;
  dlg.addEventListener('change', async e => {
    const cb = e.target.closest('[data-pk]');
    if (!cb) return;
    try {
      await api(`/kostenarten/${cb.dataset.pk}`, { method: 'PATCH', body: { aktiv: cb.checked } });
    } catch (fehler) {
      melde(String(fehler.message || fehler), 'neg');
      cb.checked = !cb.checked;
    }
  });
  dlg.querySelectorAll('[data-nein]').forEach(b => (b.onclick = () => dlg.close()));
  dlg.showModal();
}

/* CCCLXXXVI — eine oder mehrere Dateien einer NK-Zeile zuordnen (Drag&Drop aus
   dem Explorer). Ablauf: Prüfsumme + KI-Erkennung der ersten Datei, Duplikat im
   Nextcloud-Ordner suchen, schlanke Bestätigung, dann verknüpfen (Duplikat) oder
   hochladen (PDF direkt, Bilder zu EINEM PDF). Objekt/Art/Kostenart aus dem
   Kontext, Bezeichnung/Jahr/Betrag aus der Maske. */
/* N54 — Ladeanzeige in genau der NK-Zeile einer Kostenart einblenden (Spinner +
   Text). `laden()` zeichnet die Liste danach neu und räumt den Zustand von
   selbst wieder ab — grün bei Erfolg, alter Zustand bei Fehler. */
function zeileVerarbeitet(kostenart, text) {
  const zeile = inhalt.querySelector(`.pruef[data-kostenart="${CSS.escape(kostenart)}"]`);
  if (!zeile) return;
  zeile.classList.add('verarbeitet');
  const kopf = zeile.querySelector('.kopf');
  let badge = kopf.querySelector('.zeile-lade');
  if (!badge) {
    badge = document.createElement('span');
    badge.className = 'zeile-lade';
    badge.innerHTML = '<span class="kringel"></span><span class="zl-txt"></span>';
    kopf.appendChild(badge);
  }
  badge.querySelector('.zl-txt').textContent = text;
}

async function belegPerDrop(kostenart, dateien) {
  const istPdf = d => d.type === 'application/pdf' || /\.pdf$/i.test(d.name || '');
  const pdfs = dateien.filter(istPdf);
  const bilder = dateien.filter(d => !istPdf(d) && (d.type || '').startsWith('image/'));
  if (!pdfs.length && !bilder.length) {
    melde('Nur PDF- oder Bilddateien lassen sich hier ablegen.', 'neg');
    return;
  }
  const jahr = Number((daten.ende || '').slice(0, 4)) || new Date().getFullYear();
  const erste = pdfs[0] || bilder[0];
  // N78 — Ziel ist die Wasser-Sammelposition? Dann der wasser-spezifische Dialog
  // (drei Beträge), und die KI-Erkennung bekommt den Wasser-Kontext mit.
  const istWasser = istWasserSammel({ kostenart });

  // CD — sofort einen Ladeschleier zeigen: Prüfsumme + KI-Erkennung brauchen
  // einen Moment, in dem sonst gefühlt „nichts passiert", bis der Dialog kommt.
  const schleier = document.createElement('div');
  schleier.className = 'drop-lade';
  schleier.innerHTML = '<div class="kringel"></div><div class="txt">Beleg wird gelesen …</div>';
  document.body.appendChild(schleier);

  const zeile = (daten.checkliste || []).find(k => k.kostenart === kostenart);
  let wahl, dup = { gefunden: false };
  try {
    // Prüfsumme nur bei EINEM fertigen PDF — aus Bildern entsteht erst ein neues
    // PDF, das nie ein Duplikat sein kann. KI-Erkennung läuft immer.
    const [sha1, vorschlag] = await Promise.all([
      (pdfs.length === 1 && !bilder.length) ? sha1Hex(erste).catch(() => null) : Promise.resolve(null),
      erkennen(erste, istWasser ? kostenart : ''),
    ]);
    if (sha1) {
      try {
        dup = await api('/dokumente/duplikat-pruefen',
          { method: 'POST', body: { objekt: daten.objekt, sha1, name: erste.name || '', jahr } }) || dup;
      } catch { /* Endpunkt/Cloud nicht da → einfach normal ablegen */ }
    }

    const groesse = dateien.reduce((s, d) => s + (d.size || 0), 0);
    schleier.remove();      // Dialog übernimmt jetzt sichtbar
    const dialogArgs = { kostenart, vorschlag, dup, jahr, groesse,
      datei: erste, anbieter: zeile?.anbieter || '' };
    wahl = istWasser ? await belegWasserDialog(dialogArgs)
                     : await belegDropDialog(dialogArgs);
  } finally {
    schleier.remove();      // auch bei Fehler nie hängenbleiben
  }
  if (!wahl) return;
  // CCCXCV — die eingetragene Firma/Gemeinde als Anbieter der Kostenart merken;
  // sie erscheint dann in der Zeile (kursiv, zurückgesetzt).
  if (wahl.firma && wahl.firma !== (zeile?.anbieter || '') && zeile?.kostenart_id) {
    await api(`/kostenarten/${zeile.kostenart_id}`,
      { method: 'PATCH', body: { lieferant: wahl.firma } }).catch(() => {});
  }

  // N54 — jetzt sichtbar IN der Zeile arbeiten, bis der Beleg verbucht ist.
  zeileVerarbeitet(kostenart, 'Beleg wird abgelegt …');
  try {
    const dokIds = [];
    if (wahl.aktion === 'verknuepfen' && dup.pfad) {
      // Schon in der Cloud — nur verknüpfen, kein Upload. Kostenart/Betrag mit,
      // damit der Beleg gleich an seiner Position landet.
      const res = await api('/dokumente/vorhandenen-zuordnen', { method: 'POST', body: {
        objekt: daten.objekt, pfad: dup.pfad, kategorie: 'Nebenkosten',
        kostenart, beschreibung: wahl.beschreibung || kostenart,
        betrag: wahl.betrag > 0 ? wahl.betrag : null, jahr: wahl.jahr, zeitraum_id: daten.id } });
      if (res?.id) dokIds.push(res.id);
    } else {
      const sendungen = [];
      if (bilder.length) {
        const { pdf } = await scanZuPdf(bilder);
        sendungen.push({ datei: pdf, name: 'scan.pdf' });
      }
      for (const p of pdfs) sendungen.push({ datei: p, name: p.name });
      for (let i = 0; i < sendungen.length; i++) {
        const { datei, name } = sendungen[i];
        const paket = new FormData();
        paket.append('objekt', daten.objekt);
        paket.append('kategorie', 'Nebenkosten');
        // CCCXCII — die Kostenart als eigenes Feld (nicht nur in der Bezeichnung):
        // erst damit findet `verbuche` die Position und setzt `position_id`.
        paket.append('kostenart', kostenart);
        paket.append('jahr', String(wahl.jahr));
        paket.append('beschreibung', wahl.beschreibung || kostenart);
        paket.append('zeitraum_id', String(daten.id));
        // Bestätigter Betrag nur EINMAL, sonst summiert verbuche ihn mehrfach.
        if (i === 0 && wahl.betrag > 0) paket.append('betrag', String(wahl.betrag));
        paket.append('datei', datei, name);
        const antwort = await fetch('/api/dokumente/scannen', { method: 'POST', body: paket });
        if (!antwort.ok) {
          const grund = await antwort.json().then(k => k.detail).catch(() => null);
          throw new Error(grund || `Fehler ${antwort.status}`);
        }
        const res = await antwort.json();
        if (res?.id) dokIds.push(res.id);
      }
    }
    // CCCXCII/N54 — den/die Belege in die Kostenposition verbuchen: erst dadurch
    // bekommt das Dokument seine `position_id`, einen Betrag und die Zeile wird
    // grün. Fehler NICHT verschlucken (früher `.catch(()=>{})` → „✓" gelogen,
    // Zeile blieb grau): schlägt es fehl, sagen wir warum.
    if (!dokIds.length) throw new Error('Der Beleg wurde nicht abgelegt.');
    zeileVerarbeitet(kostenart, 'wird verbucht …');
    for (const id of dokIds) {
      await api(`/dokumente/${id}/position`, { method: 'POST' });
    }
    // N78 — der Beleg hängt jetzt an der Wasser-Sammelposition (Betrag =
    // Frischwasser). Schmutz- und Niederschlagswasser zusätzlich auf ihre
    // eigenen Positionen buchen, damit die Detail-Tabelle die drei Werte zeigt.
    if (istWasser && wahl.wasser) {
      zeileVerarbeitet(kostenart, 'Bereiche werden gebucht …');
      await wasserPosBetragSchreiben('schmutz', wahl.wasser.schmutz);
      await wasserPosBetragSchreiben('niederschlag', wahl.wasser.niederschlag);
    }
    melde(`✓ Beleg „${kostenart}“ zugeordnet`, 'pos');
    await laden();
  } catch (fehler) {
    melde('Beleg nicht zugeordnet: ' + String(fehler.message || fehler), 'neg');
    await laden();   // Zeile zurücksetzen (Ladeanzeige weg, alter Zustand)
  }
}

/* Drag&Drop nur am Zeiger-Gerät (PC): eine Datei aus dem Explorer über die
   Liste ziehen markiert GENAU die überflogene NK-Zeile als Drop-Zone; fällt sie
   dort, wird sie dieser Kostenart zugeordnet. Ein Drop daneben wird verworfen,
   damit der Browser die Datei nicht als Seite öffnet. */
if (KEINE_KAMERA) {
  const istDateiZug = e => [...(e.dataTransfer?.types || [])].includes('Files');
  let dropZeile = null;
  const markiere = z => {
    if (z === dropZeile) return;
    dropZeile?.classList.remove('dropziel');
    dropZeile = z || null;
    dropZeile?.classList.add('dropziel');
  };
  inhalt.addEventListener('dragover', e => {
    if (!istDateiZug(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    markiere(e.target.closest('.pruef[data-kostenart]'));
  });
  inhalt.addEventListener('dragleave', e => {
    if (e.relatedTarget && inhalt.contains(e.relatedTarget)) return;
    markiere(null);
  });
  inhalt.addEventListener('drop', e => {
    if (!istDateiZug(e)) return;
    e.preventDefault();
    const zeile = e.target.closest('.pruef[data-kostenart]');
    const dateien = [...(e.dataTransfer.files || [])];
    markiere(null);
    if (zeile && dateien.length) belegPerDrop(zeile.dataset.kostenart, dateien);
  });
  // Ein Datei-Drop irgendwo sonst darf die Seite nicht überschreiben.
  document.addEventListener('dragover', e => { if (istDateiZug(e)) e.preventDefault(); });
  document.addEventListener('drop', e => {
    if (istDateiZug(e) && !e.target.closest('.pruef[data-kostenart]')) {
      e.preventDefault();
      markiere(null);
    }
  });
}

/** Texterkennung — schlägt fehl sie, gibt es eben keinen Vorschlag.
    N78 — mit `kostenart` als Kontext liefert die KI beim Wasser-Beleg
    zusätzlich die drei Bereichsbeträge (Feld `wasser`). */
async function erkennen(bild, kostenart = '') {
  if (!bild) return null;
  try {
    const paket = new FormData();
    // Der Dateiname sagt dem Server, womit er es zu tun hat (Bild oder PDF).
    paket.append('datei', bild, bild.name || 'seite.jpg');
    if (kostenart) paket.append('kostenart', kostenart);
    const antwort = await fetch('/api/dokumente/erkennen',
                                { method: 'POST', body: paket });
    return antwort.ok ? await antwort.json() : null;
  } catch {
    return null;
  }
}

async function betragVorschlagen(kostenart, vorschlag) {
  if (!vorschlag?.betrag) return;
  const zeile = daten.checkliste.find(k => k.kostenart === kostenart);
  if (!zeile) return;
  const ja = await frage('Betrag aus dem Beleg übernehmen?',
    `Erkannt wurden ${eur(vorschlag.betrag)}`
    + (vorschlag.datum
      ? ` vom ${new Date(vorschlag.datum).toLocaleDateString('de-DE')}`
      : '')
    + `. Als Betrag für „${kostenart}“ eintragen?`,
    { knopf: 'Übernehmen' });
  if (!ja) return;
  // Gibt es die Position noch nicht, entsteht sie hier — sonst versickerte
  // der erkannte Betrag an genau den Zeilen, die noch nichts haben.
  if (zeile.position_id) {
    await api(`/positionen/${zeile.position_id}`,
              { method: 'PATCH', body: { betrag: vorschlag.betrag,
                                         wertquelle: 'Scan' } });
  } else {
    await api(`/zeitraeume/${zid}/positionen`,
              { method: 'POST', body: { kostenart, betrag: vorschlag.betrag,
                                        wertquelle: 'Scan' } });
  }
}

/* CCCLXXX — der Zahnrad-Knopf neben „Ablesewerte eingeben" öffnet die
   Zähler-Konfiguration dieser Immobilie. */
function ablesenKnopfHtml() {

const zahl = n => (n ?? 0).toLocaleString('de-DE', { maximumFractionDigits: 3 });

inhalt.addEventListener('click', e => {
