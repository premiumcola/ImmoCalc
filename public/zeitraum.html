  const fremd = s.unter.filter(z => s.gesamt && z.hauptzaehler_id !== s.gesamt.id);
  if (fremd.length) {
    warnungen.push(`${fremd.map(z => `<b>${esc(stromLabel(z))}</b>`).join(', ')}
      ${fremd.length === 1 ? 'gehört' : 'gehören'} noch zu keinem Gesamtverbrauch und
      ${fremd.length === 1 ? 'wird' : 'werden'} beim Verbrauch Haus nicht abgezogen —
      die Rolle unten an der Zeile setzen.`);
  }
  const hinweise = [];
  if (!s.rest) {
    hinweise.push('Für den Verbrauch Haus fehlt noch die errechnete Zeile.');
  }
  if (s.gesamt && gesamtV == null) {
    hinweise.push(`Für „${esc(stromLabel(s.gesamt))}“ ist in dieser Periode noch
      kein Wert erfasst.`);
  }

  return `${s.gesamt ? zeile(s.gesamt, {}) : ''}
    <div class="zu-abzug">${subZeilen || `<div class="zu-kein">Noch keine
      Zwischenzähler.</div>`}${restZeile}</div>
    ${rechnung}
    ${hinweise.map(h => `<div class="zu-kein">${h}</div>`).join('')}
    ${warnungen.map(w => `<div class="ho-warn">▲ ${w}</div>`).join('')}
    ${form}`;
}

/* N122 — die Menge einer Strom-Position speichern (PATCH /positionen/{id}).
   Die Einheit fährt mit, damit die Zahl nicht ohne Maß in der Datenbank steht. */
async function stromMengeSpeichern(input) {
  const menge = standAusFeld(input);
  if (menge === null) return;
  if (Number.isNaN(menge)) { melde('Ungültige Menge', 'neg'); return; }
  try {
    await api(`/positionen/${input.dataset.stromMenge}`, { method: 'PATCH',
      body: { menge, menge_einheit: 'kWh' } });
    melde('Verbrauch gespeichert', 'pos');
    await laden();
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

/* N122 — woher der Strom dieser Position kam. Ein zweiter Tipp auf dieselbe
   Herkunft nimmt sie wieder zurück. */
async function stromHerkunftSetzen(btn) {
  const k = (daten.checkliste || []).find(p =>
    String(p.position_id) === btn.dataset.herkunftPid);
  const neu = k?.herkunft === btn.dataset.herkunft ? '' : btn.dataset.herkunft;
  try {
    await api(`/positionen/${btn.dataset.herkunftPid}`, { method: 'PATCH',
      body: { herkunft: neu } });
    await laden();
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

/* Nach jeder Änderung an den Zählern: Maske neu holen, Chips neu rechnen,
   Ansicht neu zeichnen — die Strom-Position bleibt dabei aufgeklappt. */
async function stromFrisch(text) {
  ablesungMaske = await api(`/zeitraeume/${zid}/ablesung`);
  chipMap = baueChipMap();
  melde(text, 'pos');
  await zeichnen();
}

/* Ein Jahreswert (`typ: direkt`) wird als ganz normale Ablesung dieses
   Zeitraums abgelegt — der Wert IST der Verbrauch, das Datum ist die
   Periodengrenze. */
async function stromJahreswertSpeichern(input) {
  const wert = standAusFeld(input);
  if (wert === null) return;
  if (Number.isNaN(wert)) { melde('Ungültiger Wert', 'neg'); return; }
  try {
    await api(`/zaehler/${input.dataset.stromJahr}/ablesungen`, {
      method: 'POST',
      body: { stand: wert, zeitraum_id: Number(zid),
              datum: ablesungMaske?.zeitraum?.ende || daten.ende },
    });
    await stromFrisch('Jahreswert gespeichert');
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

async function stromZaehlerAnlegen(btn) {
  const box = btn.closest('.ho-neu');
  const feld = box?.querySelector('[data-strom-name]');
  const name = (feld?.value || '').trim();
  const rolle = box?.querySelector('[data-strom-rolle]')?.value || 'gemessen';
  const r = STROM_ROLLEN[rolle];
  if (!name) { melde('Name des Zählers eintragen', 'neg'); feld?.focus(); return; }
  const s = stromStruktur();
  if (r.haupt && !s.gesamt) {
    melde('Erst den Gesamtverbrauch anlegen — die übrigen hängen daran', 'neg');
    return;
  }
  try {
    await api(`/objekte/${encodeURIComponent(daten.objekt)}/zaehler`, {
      method: 'POST',
      body: { name, kostenart: stromKostenart(), art: 'Strom',
              messeinheit: 'kWh', typ: r.typ, reihenfolge: r.reihenfolge,
              hauptzaehler_id: r.haupt ? s.gesamt.id : null },
    });
    await stromFrisch('Zähler angelegt');
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

/* Die Rolle einer bestehenden Zeile umstellen (PATCH /zaehler/{id}). Damit
   lassen sich vorhandene Zähler in die Ordnung bringen, ohne sie neu anzulegen
   und ihre Ablesungen zu verlieren. */
async function stromRolleSetzen(sel) {
  const id = Number(sel.dataset.stromRolleSet);
  const r = STROM_ROLLEN[sel.value];
  if (!r) return;
  const s = stromStruktur();
  const gesamt = s.gesamt && s.gesamt.id !== id ? s.gesamt : null;
  if (r.haupt && !gesamt) {
    melde('Erst einen anderen Zähler zum Gesamtverbrauch machen', 'neg');
    return zeichnen();
  }
  try {
    await api(`/zaehler/${id}`, { method: 'PATCH',
      body: { typ: r.typ, reihenfolge: r.reihenfolge,
              hauptzaehler_id: r.haupt ? gesamt.id : null } });
    await stromFrisch('Rolle geändert');
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

async function stromZaehlerEntfernen(btn) {
  const name = btn.dataset.stromTitel || 'Zähler';
  const ja = await frage(`„${name}“ entfernen?`,
    'Der Zähler und seine Ablesungen werden gelöscht. Kostenposition und Belege '
    + 'bleiben unangetastet. Hängen Unterzähler an ihm, verlieren sie ihren Bezug.',
    { knopf: 'Entfernen', gefahr: true });
  if (!ja) return;
  try {
    await api(`/zaehler/${btn.dataset.stromWeg}`, { method: 'DELETE' });
    await stromFrisch('Zähler entfernt');
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

/* N94 — Gartenwasser ohne Zähler: der eingetragene m³-Wert wird als Zähler mit
   Anfangsstand 0 und Endstand = Wert abgelegt. Damit ist er ein ganz normaler
   Verbrauch (die Wasser-Rechnung zieht ihn vom Rest ab und belastet ihn nur mit
   dem Frischwasser-Anteil), und die tragende Einheit lässt sich danach über den
   Chooser wählen. */
async function gartenAnlegen(btn) {
  const feld = btn.closest('.ho-neu')?.querySelector('[data-garten-m3]');
  const m3wert = parseFloat(String(feld?.value || '').replace(',', '.'));
  if (!(m3wert > 0)) { melde('m³ eintragen', 'neg'); return; }
  try {
    const neu = await api(`/objekte/${encodeURIComponent(daten.objekt)}/zaehler`, {
      method: 'POST',
      body: { name: 'Gartenwasser', art: 'Gartenwasser', kostenart: 'Wasser',
              messeinheit: 'm³', typ: 'gemessen' },
    });
    const id = neu?.id;
    if (id) {
      await api(`/zaehler/${id}/anfangsstand`,
        { method: 'POST', body: { stand: 0, datum: daten.start } });
      await api(`/zaehler/${id}/ablesungen`, { method: 'POST',
        body: { stand: m3wert, datum: daten.ende, zeitraum_id: Number(zid) } });
    }
    melde('Gartenwasser erfasst — jetzt die Einheit wählen', 'pos');
    await laden();
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

/* N81 — einen Heizkörper (HKV) erfassen: Einheit, Nummer, Raum, Faktor und die
   abgelesenen Einheiten. Danach neu zeichnen → Verteilung aktualisiert. */
async function hkvHinzufuegen(btn) {
  const box = btn.closest('.ho-neu');
  const q = s => box?.querySelector(s);
  const faktor = parseFloat(String(q('[data-hkv-faktor]')?.value || '').replace(',', '.'));
  const stand = parseFloat(String(q('[data-hkv-stand]')?.value || '').replace(',', '.'));
  if (!(faktor > 0)) { melde('Faktor angeben', 'neg'); return; }
  try {
    await api(`/objekte/${encodeURIComponent(daten.objekt)}/heizverteiler`, {
      method: 'POST',
      body: {
        einheit: q('[data-hkv-einheit]')?.value || '',
        nummer: q('[data-hkv-nummer]')?.value || '',
        raum: q('[data-hkv-raum]')?.value || '',
        faktor, einheiten_stand: Number.isFinite(stand) ? stand : 0,
      },
    });
    melde('Heizkörper erfasst', 'pos');
    await zeichnen();
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

async function hkvEntfernen(id) {
  try {
    await api(`/heizverteiler/${id}`, { method: 'DELETE' });
    melde('Heizkörper entfernt', 'pos');
    await zeichnen();
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

/* N79 — Öl-Manager inline in der aufgeklappten Heizkosten-Position: die
   Lieferungen (Anfangsbestand + Nachtankungen), ein Erfassungsformular und die
   FIFO-Bewertung (Verbrauch der Periode zum Einstandspreis des ältesten Öls,
   Restbestand + Restwert). Daten aus GET /objekte/{slug}/heizoel und
   GET .../heizoel/bewertung?zeitraum_id=. */
async function fuelleHeizoelInline(el) {
  const slug = encodeURIComponent(daten.objekt);
  try {
    const [best, bew, hkv] = await Promise.all([
      api(`/objekte/${slug}/heizoel`),
      api(`/objekte/${slug}/heizoel/bewertung?zeitraum_id=${zid}`).catch(() => null),
      api(`/objekte/${slug}/heizverteiler`).catch(() => ({ heizverteiler: [] })),
    ]);
    // N80 — Warmwassermenge (m³) für den §9-Split: der Warmwasser-Hauptzähler
    // (Boiler-Zulauf), sonst die Summe der Warmwasser-Unterzähler.
    const zl = ablesungMaske?.zaehler || [];
    const wwHaupt = zl.find(z => wasserArt(z) === 'Warmwasser' && !z.hauptzaehler_id);
    const wwVol = wwHaupt?.verbrauch != null ? wwHaupt.verbrauch
      : zl.filter(z => wasserArt(z) === 'Warmwasser' && z.hauptzaehler_id)
          .reduce((s, z) => s + (z.verbrauch || 0), 0);
    let split = null;
    if (bew && bew.verbrauch_kosten > 0) {
      split = await api(`/objekte/${slug}/waerme/split?oel_kosten=${bew.verbrauch_kosten}`
        + `&oel_liter=${bew.verbrauch_liter}&ww_volumen_m3=${wwVol}`).catch(() => null);
    }
    // N118 — für die Verteilungstabelle dieselben Mengen wie in der Wasser-
    // tabelle verwenden, statt sie ein zweites Mal (und anders) zu rechnen.
    if ((el.dataset.heizModus || 'oel') === 'warmwasser' && !wasserDetailCache) {
      wasserDetailCache = await api(`/zeitraeume/${zid}/wasser`
        + `?schluessel=${wasserSchluessel}`).catch(() => null);
    }
    let verteilung = null;
    if (split && split.heizung_kosten > 0) {
      verteilung = await api(`/objekte/${slug}/heizung/verteilung?kosten=${split.heizung_kosten}`)
        .catch(() => null);
    }
    el.innerHTML = heizoelInhalt(best, bew, hkv, wwVol, split, verteilung,
                                 el.dataset.heizModus || 'oel');
  } catch (fehler) {
    el.innerHTML = `<div class="wd-lade">Heizöl nicht ladbar: ${
      esc(String(fehler.message || fehler))}</div>`;
  }
}

/* N118 — die Warmwassermenge je Einheit aus den Warmwasser-Unterzählern.
   Dieselbe Zuordnung wie in der Wassertabelle (`zaehlerEinheiten`); teilt sich
   ein Zähler mehrere Einheiten, wird sein Verbrauch gleichmäßig geteilt. */
function wwJeEinheit(wasserDetail) {
  const karte = {};
  // Bevorzugt die Zahlen der Wassertabelle: dort ist die Zuordnung bereits
  // sauber aufgelöst (Mehrfach-Zähler, Alt-Labels). Fällt die Antwort aus,
  // wird ersatzweise aus den Zählern gerechnet.
  for (const e of (wasserDetail?.einheiten || [])) {
    const m3 = (e.zeilen || []).filter(z => z.art === 'Warmwasser')
      .reduce((su, z) => su + (z.m3 || 0), 0);
    if (m3 > 0) karte[e.name] = m3;
  }
  if (Object.keys(karte).length) return karte;
  for (const z of (ablesungMaske?.zaehler || [])) {
    if (wasserArt(z) !== 'Warmwasser' || !z.hauptzaehler_id) continue;
    const v = z.verbrauch || 0;
    if (!v) continue;
    const ein = zaehlerEinheiten(z).filter(e => alleEinheiten().includes(e));
    if (!ein.length) continue;
    for (const e of ein) karte[e] = (karte[e] || 0) + v / ein.length;
  }
  return karte;
}

/* Die Warmwasser-Kosten (§9-Anteil des Öls) nach eben diesen Mengen verteilen —
   cent-genau: der letzte Anteil trägt die Rundungsdifferenz. */
function wwVerteilung(kosten, wasserDetail) {
  const mengen = wwJeEinheit(wasserDetail);
  const namen = Object.keys(mengen);
  const summe = namen.reduce((s, e) => s + mengen[e], 0);
  if (!summe || !kosten) return { mengen, anteile: {}, summe };
  const anteile = {};
  let rest = Math.round(kosten * 100);
  namen.forEach((e, i) => {
    const c = i === namen.length - 1 ? rest
      : Math.round(kosten * 100 * mengen[e] / summe);
    anteile[e] = c / 100;
    rest -= c;
  });
  return { mengen, anteile, summe };
}

/* Der Öl-Manager als HTML: FIFO oben, Lieferungen, Erfassung; darunter der
   §9-Split (Warmwasser/Heizung, N80) und die HKV-Verteilung (N81). */
function heizoelInhalt(best, bew, hkv, wwVol, split, verteilung, modus = 'oel') {
  const bearbeitbar = daten.status === 'in Arbeit';
  const liefer = (best?.lieferungen || []);
  const kopf = bew && bew.verbrauch_liter != null
    ? `<div class="ho-kpi">
        ${bew.anfang_liter != null ? `<div class="ho-kbox">
          <span class="ho-kl">Bestand zu Periodenbeginn</span>
          <span class="ho-kv">${zahl(bew.anfang_liter)} L · ${eur(bew.anfang_wert)}</span></div>` : ''}
        <div class="ho-kbox"><span class="ho-kl">Verbrauch Periode</span>
          <span class="ho-kv">${zahl(bew.verbrauch_liter)} L</span></div>
        <div class="ho-kbox teal"><span class="ho-kl">Heizkosten (FIFO)</span>
          <span class="ho-kv">${eur(bew.verbrauch_kosten)}</span></div>
        <div class="ho-kbox"><span class="ho-kl">Restbestand am Ende</span>
          <span class="ho-kv">${zahl(bew.rest_liter)} L · ${eur(bew.rest_wert)}</span></div>
      </div>${bew.warnung ? `<div class="ho-warn">▲ ${esc(bew.warnung)}</div>` : ''}`
    : `<div class="ho-warn">Noch keine Öl-Lieferung erfasst — unten anlegen. Der
        Perioden-Verbrauch kommt aus dem Öl-Zähler.</div>`;
  // N100 — nur die Lieferungen DIESER Periode listen; der Bestand aus früheren
  // Jahren steckt im „Bestand zu Periodenbeginn" (FIFO-bewertet), nicht noch
  // einmal als Zeile. Ohne Periodenangabe (alter Stand) alle zeigen.
  const inPeriode = bew?.lieferungen_periode;
  // N117 — der Anfangsbestand bleibt IMMER sichtbar, auch wenn er vor dem
  // Periodenstart liegt: er geht voll in den Bestand ein und muss korrigierbar
  // sein. Vorher war er nur als Zahl in der Kachel zu sehen, nicht zu ändern.
  const sichtbar = Array.isArray(inPeriode)
    ? liefer.filter(l => inPeriode.includes(l.id) || l.ist_anfangsbestand) : liefer;
  const zeilen = sichtbar.length ? sichtbar.map(l => `
    <div class="ho-zeile">
      <span class="ho-dt">${_isoKurz(l.datum)}${l.ist_anfangsbestand
        ? ' <span class="ho-anf">Anfangsbestand — zählt vor der Periode</span>'
        : ''}</span>
      <span class="ho-lit">${zahl(l.liter)} L</span>
      <span class="ho-wert">${eur(l.wert)}</span>
      <span class="ho-pl">${eur(l.preis_liter ?? (l.liter ? l.wert / l.liter : 0))}/L</span>
      ${bearbeitbar ? `<button class="ho-x" data-heizoel-weg="${l.id}"
        aria-label="Lieferung entfernen">×</button>` : ''}
    </div>`).join('') : '';
  const nurPeriode = sichtbar.filter(l => !l.ist_anfangsbestand
    || !Array.isArray(inPeriode) || inPeriode.includes(l.id));
  const bestZeile = sichtbar.length
    ? `<div class="ho-summe">In dieser Periode getankt: <b>${
        zahl(nurPeriode.reduce((s, l) => s + (l.liter || 0), 0))} L</b> · <b>${
        eur(nurPeriode.reduce((s, l) => s + (l.wert || 0), 0))}</b>${
        liefer.length > sichtbar.length
          ? ` · insgesamt erfasst: ${zahl(best.bestand_liter)} L` : ''}</div>` : '';
  const form = bearbeitbar ? `
    <div class="ho-neu">
      <input type="date" data-ho-datum aria-label="Datum" value="${daten.ende || ''}">
      <input type="number" step="0.1" data-ho-liter placeholder="Liter" aria-label="Liter">
      <input type="number" step="0.01" data-ho-wert placeholder="€ gesamt" aria-label="Wert €">
      <label class="ho-anfw"><input type="checkbox" data-ho-anf> Anfangsbestand</label>
      <button class="btn" data-heizoel-add>Lieferung hinzufügen</button>
    </div>` : '';
  // N80 — §9-Split Warmwasser vs. Heizung aus den Öl-Kosten.
  const splitHtml = split ? `<div class="ho-sekt">
      <div class="ho-st">Warmwasser & Heizung <span class="ho-sh">§9: 2,5·V·(t−10)</span></div>
      <div class="ho-kpi">
        <div class="ho-kbox"><span class="ho-kl">Warmwasser-Menge</span>
          <span class="ho-kv">${zahl(wwVol)} m³ · ${zahl(split.ww_kwh)} kWh</span></div>
        <div class="ho-kbox"><span class="ho-kl">Warmwasser-Kosten</span>
          <span class="ho-kv">${eur(split.ww_kosten)}</span></div>
        <div class="ho-kbox teal"><span class="ho-kl">Heizungs-Kosten</span>
          <span class="ho-kv">${eur(split.heizung_kosten)}</span></div>
      </div>${split.warnung ? `<div class="ho-warn">▲ ${esc(split.warnung)}</div>` : ''}
    </div>` : '';
  // N81 — Heizkostenverteiler (Faktor × Einheiten) → Heizungs-Anteil je Einheit.
  const hkvListe = (hkv?.heizverteiler || []);
  const vt = verteilung || {};
  const hkvZeilen = hkvListe.length ? hkvListe.map(h => `
    <div class="ho-zeile">
      <span class="ho-dt">${esc(h.nummer || '—')}${h.raum ? ` · ${esc(h.raum)}` : ''}
        ${h.einheit ? `<span class="ho-anf">${esc(h.einheit)}</span>` : ''}</span>
      <span class="ho-lit">Faktor ${zahl(h.faktor)}</span>
      <span class="ho-wert">${zahl(h.einheiten_stand)} Einh.</span>
      ${bearbeitbar ? `<button class="ho-x" data-hkv-weg="${h.id}"
        aria-label="HKV entfernen">×</button>` : ''}
    </div>`).join('') : '';
  const vtZeilen = Object.keys(vt).length ? `<div class="ho-summe">Heizung je Einheit: ${
    Object.entries(vt).map(([e, w]) => `${esc(e)} <b>${eur(w)}</b>`).join(' · ')}</div>` : '';
  const einOpt = alleEinheiten().map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('');
  const hkvForm = bearbeitbar ? `
    <div class="ho-neu">
      <select data-hkv-einheit aria-label="Einheit"><option value="">Einheit …</option>${einOpt}</select>
      <input type="text" data-hkv-nummer placeholder="HKV-Nr." aria-label="Nummer">
      <input type="text" data-hkv-raum placeholder="Raum" aria-label="Raum">
      <input type="number" step="0.001" data-hkv-faktor placeholder="Faktor" aria-label="Faktor">
      <input type="number" step="0.1" data-hkv-stand placeholder="Einheiten" aria-label="Abgelesene Einheiten">
      <button class="btn" data-hkv-add>Heizkörper hinzufügen</button>
    </div>` : '';
  const hkvHtml = `<div class="ho-sekt">
      <div class="ho-st">Heizungswärme · Heizkostenverteiler</div>
      ${hkvZeilen ? `<div class="ho-liste">${hkvZeilen}</div>${vtZeilen}`
        : '<div class="ho-warn">Noch keine Heizkörper erfasst — je Heizkörper Nummer, Raum, Faktor und die abgelesenen Einheiten anlegen.</div>'}
      ${hkvForm}</div>`;
  // N91 — jede Stufe zeigt nur ihren Teil:
  //   oel        Lieferungen + FIFO (was gekauft und verbraucht wurde)
  //   warmwasser der §9-Anteil des Öls für die Warmwassererzeugung
  //   waerme     die Heizkörper-Wärmemenge über die Heizkostenverteiler
  if (modus === 'warmwasser') {
    // N118 — die Verteilung der Warmwasser-Kosten auf die Einheiten, als
    // kleine Tabelle wie beim Wasser: oben die Menge, darunter die Kosten.
    const wv = wwVerteilung(split?.ww_kosten || 0, wasserDetailCache);
    const sp = Object.keys(wv.mengen);
    const wwTab = sp.length ? `<div class="ho-sekt">
        <div class="ho-st">Verteilung auf die Einheiten
          <span class="ho-sh">nach Warmwasser-Zähler</span></div>
        <div class="wd-scroll"><table class="wd-tab"><thead><tr>
          <th>Warmwasser</th>${sp.map(e => `<th>${esc(e)}</th>`).join('')}</tr></thead>
          <tbody>
            <tr><td class="wd-rowh">Menge<small>nach Zähler</small></td>
              ${sp.map(e => `<td>${zahl(wv.mengen[e])} m³</td>`).join('')}</tr>
            <tr><td class="wd-rowh">Kosten<small>anteilig</small></td>
              ${sp.map(e => `<td><b>${eur(wv.anteile[e] || 0)}</b></td>`).join('')}</tr>
          </tbody>
          <tfoot><tr><td class="wd-rowh">Summe</td>
            <td colspan="${sp.length}">${zahl(wv.summe)} m³ · <b>${
              eur(split?.ww_kosten || 0)}</b></td></tr></tfoot>
        </table></div></div>` : '';
    return `<div class="ho-box">${splitHtml
      || '<div class="ho-warn">Noch keine Öl-Kosten erfasst — erst Lieferungen und den Zähler-Endstand bei „Heizöl & Lieferungen" eintragen.</div>'}${wwTab}</div>`;
  }
  if (modus === 'waerme') {
    const kopfW = split ? `<div class="ho-kpi"><div class="ho-kbox teal">
        <span class="ho-kl">Heizungs-Kosten (nach Warmwasser-Abzug)</span>
        <span class="ho-kv">${eur(split.heizung_kosten)}</span></div></div>` : '';
    return `<div class="ho-box">${kopfW}${hkvHtml}</div>`;
  }
  return `<div class="ho-box">${kopf}
    ${zeilen ? `<div class="ho-liste">${zeilen}</div>${bestZeile}` : ''}
    ${form}</div>`;
}

/* N74 — die Wasser-Detailübersicht als Tabelle IN die aufgeklappte Position
   laden (kein Popup mehr). Nutzt dieselbe Aufbereitung wie früher das Popup. */
// N113 - nach welchem Schluessel der Haupthaus-Rest verteilt wird. Der Nutzer
// schaltet oben in der Detailansicht um; die Wahl gilt fuer die Anzeige.
let wasserSchluessel = 'personen';

/* N116/N144 — die vom Versorger abgerechnete Menge (aus dem Bescheid) steht
   jetzt AM ZEITRAUM und wird serverseitig gehalten. Sie hielt vorher nur im
   Speicher der Seite und war nach jedem Neuladen wieder weg. Ein leerer Wert
   löscht die Angabe. */
async function wasserRechnungsmengeSpeichern(feld) {
  const wert = (feld.value || '').trim();
  try {
    await api(`/zeitraeume/${zid}/wasser/rechnungsmenge`,
      { method: 'PUT', body: { rechnung_m3: wert === '' ? null : Number(wert) } });
    const box = feld.closest('[data-wasser-inline]');
    if (box) await fuelleWasserInline(box);
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

async function fuelleWasserInline(el) {
  try {
    const d = await api(`/zeitraeume/${el.dataset.wasserInline}/wasser`
      + `?schluessel=${wasserSchluessel}`);
    wasserDetailCache = d;
    el.innerHTML = wasserDetailInhalt(d);
  } catch (fehler) {
    el.innerHTML = `<div class="wd-lade">Detailübersicht nicht ladbar: ${
      esc(String(fehler.message || fehler))}</div>`;
  }
}

/* ---- N142: die Stromkette — kWh → Euro → E-Tankstelle → Einheiten --------
   Drei Schritte untereinander, jeder mit dem, was hineingeht und was heraus-
   kommt. Gerechnet wird im Backend (GET /zeitraeume/{zid}/stromkette); hier
   steht nur die Darstellung und die Eingabe der drei SolarEdge-Anteile. */

/* Prozent mit einer Nachkommastelle, ohne überflüssige Null. */
const skProz = n => (n ?? 0).toLocaleString('de-DE', { maximumFractionDigits: 1 });
/* Ein Preis als ct/kWh — die Einheit, in der Stromrechnungen gelesen werden. */
const skCt = n => `${((n ?? 0) * 100).toLocaleString('de-DE',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ct`;

/* Die drei Blöcke in fester Reihenfolge — teuer nach günstig, wie im Backend. */
const SK_BLOECKE = [['netz', 'Netz', 'zugekauft'], ['pv', 'PV direkt', 'vom Dach'],
  ['akku', 'Akku', 'aus dem Speicher']];

async function fuelleStromketteInline(el) {
  try {
    const d = await api(`/zeitraeume/${zid}/stromkette`);
    // Der Gesamtverbrauch bleibt am Panel: aus ihm rechnet das Speichern die
    // eingetippten Prozente wieder in Mengen zurück.
    el.dataset.gesamtKwh = d.schritt1.gesamt_kwh || 0;
    el.innerHTML = stromketteInhalt(d);
  } catch (fehler) {
    el.innerHTML = `<div class="wd-lade">Stromkette nicht ladbar: ${
      esc(String(fehler.message || fehler))}</div>`;
  }
}

/* Schritt 1 — aus den drei Anteilen und der Rechnung werden Euro. Die Prozente
   sind hier eingebbar: gespeichert werden sie als die drei Mengen am Strom-Jahr
   (netz_kwh/solar_kwh/akku_kwh), aus denen sie sich wieder ergeben. */
function skSchritt1(d) {
  const s = d.schritt1;
  const bearbeitbar = daten.status === 'in Arbeit';
  const feld = (schluessel, label, wert) => bearbeitbar
    ? `<div class="sk-feld"><label>${label}</label>
        <input type="text" inputmode="decimal" data-sk-anteil="${schluessel}"
          value="${wert ? skProz(wert) : ''}" placeholder="%"
          aria-label="${label} in Prozent"></div>`
    : `<div class="sk-feld fest"><label>${label}</label>
        <span>${wert ? `${skProz(wert)} %` : '—'}</span></div>`;
  const zeilen = SK_BLOECKE.map(([k, titel, sub]) => `<tr>
      <td class="wd-rowh">${titel}<small>${sub}</small></td>
      <td><span class="wd-m3">${zahl(s[k].kwh)} kWh</span>
        <span class="wd-eur">${skProz(s[`${k === 'akku' ? 'speicher' : k}_prozent`])} %</span></td>
      <td><span class="wd-m3">${skCt(s[k].preis)}</span>
        <span class="wd-eur">je kWh</span></td>
      <td><span class="wd-m3">${eur(s[k].betrag)}</span></td></tr>`).join('');
  const quelle = [s.quelle_menge && `Menge: <b>${esc(s.quelle_menge)}</b>`,
    s.quelle_betrag && `Netz: <b>${esc(s.quelle_betrag)}</b>`,
    s.quelle_eigen && `Eigener Strom: <b>${esc(s.quelle_eigen)}</b>`]
    .filter(Boolean).join(' · ');
  return `<div class="sk-schritt">
      <div class="sk-kopf"><span class="sk-nr">1</span><span class="sk-t">Aus kWh
        werden Euro</span><span class="sk-h">${zahl(s.gesamt_kwh)} kWh im Zeitraum</span></div>
      <div class="sk-felder">${feld('netz', 'Netz', s.netz_prozent)}${
        feld('pv', 'PV direkt', s.pv_prozent)}${
        feld('akku', 'Speicher', s.speicher_prozent)}</div>
      <div class="wd-scroll"><table class="wd-tab sk-tab"><thead><tr>
        <th class="wd-rowh">Quelle</th><th>Menge</th><th>Preis</th><th>Kosten</th>
      </tr></thead><tbody>${zeilen}</tbody>
      <tfoot><tr class="wd-summe"><td class="wd-rowh">Summe</td>
        <td><span class="wd-m3">${zahl(s.gesamt_kwh)} kWh</span></td><td></td>
        <td><span class="wd-m3">${eur(s.betrag)}</span></td></tr></tfoot>
      </table></div>
      ${quelle ? `<span class="sk-quelle">${quelle}</span>` : ''}</div>`;
}

/* Schritt 2 — die Ladungen der Periode gehen vorab ab. Sie werden aus dem
   Bereich E-Tankstelle gezogen (Wallbox-Protokoll, sonst erfasste Ladungen)
   und dürfen NICHT auf die Bewohner der Einheiten verteilt werden. */
function skSchritt2(d) {
  const s = d.schritt2;
  if (!s.eauto_kwh) {
    return `<div class="sk-schritt">
      <div class="sk-kopf"><span class="sk-nr">2</span><span class="sk-t">Abzug
        E-Tankstelle</span></div>
      <div class="zu-kein">Im Zeitraum wurde nichts geladen${
        s.quelle_text ? ` — ${esc(s.quelle_text)}` : ''}. Es geht nichts ab.</div>
    </div>`;
  }
  const spalten = SK_BLOECKE.map(([, titel]) => `<th>${titel}</th>`).join('');
  const mengen = SK_BLOECKE.map(([k]) =>
    `<td><span class="wd-m3">${zahl(s[`${k}_kwh`])} kWh</span></td>`).join('');
  return `<div class="sk-schritt">
      <div class="sk-kopf"><span class="sk-nr">2</span><span class="sk-t">Abzug
        E-Tankstelle</span><span class="sk-h">${esc(s.quelle_text)}</span></div>
      <div class="wd-scroll"><table class="wd-tab sk-tab"><thead><tr>
        <th class="wd-rowh">${esc(s.einheit)}</th>${spalten}<th>Summe</th>
      </tr></thead><tbody>
        <tr><td class="wd-rowh">Menge<small>geladen</small></td>${mengen}
          <td><span class="wd-m3">${zahl(s.eauto_kwh)} kWh</span></td></tr>
        <tr class="wd-summe"><td class="wd-rowh">Kosten</td>
          <td colspan="3">exakt zu den Preisen der drei Blöcke</td>
          <td><span class="wd-m3">${eur(s.betrag)}</span></td></tr>
      </tbody></table></div>
      <span class="sk-quelle">Diese Menge geht <b>vorab</b> ab und wird
        <b>nicht</b> auf die Bewohner der Einheiten verteilt — das Auto lädt für
        sich. Wer geladen hat, spielt hier keine Rolle; das steht im Bereich
        E-Tankstelle.</span></div>`;
}

/* Schritt 3 — der Rest nach den Zählerwerten, jede Einheit mit demselben
   Mischpreis aus allen drei Blöcken. */
function skSchritt3(d) {
  const s = d.schritt3;
  const namen = Object.keys(s.je_einheit);
  if (!namen.length) {
    return `<div class="sk-schritt">
      <div class="sk-kopf"><span class="sk-nr">3</span><span class="sk-t">Verteilung
        auf die Einheiten</span></div>
      <div class="zu-kein">Noch keine Einheit mit Zählerwert — die Zuordnung
        bitte an den Stromzählern nachtragen.</div></div>`;
  }
  const zeile = (titel, sub, zellen) => `<tr>
    <td class="wd-rowh">${titel}${sub ? `<small>${sub}</small>` : ''}</td>${zellen}</tr>`;
  const menge = k => namen.map(n =>
    `<td><span class="wd-m3">${zahl(s.je_einheit[n][k])} kWh</span></td>`).join('');
  return `<div class="sk-schritt">
      <div class="sk-kopf"><span class="sk-nr">3</span><span class="sk-t">Verteilung
        auf die Einheiten</span><span class="sk-h">nach Zählerwerten</span></div>
      <div class="wd-scroll"><table class="wd-tab sk-tab"><thead><tr>
        <th class="wd-rowh">Verbrauch</th>${namen.map(n =>
          `<th>${esc(n)}</th>`).join('')}</tr></thead>
      <tbody>
        ${zeile('Menge', 'nach Zähler', menge('kwh'))}
        ${zeile('davon Netz', '', menge('netz_kwh'))}
        ${zeile('davon PV', '', menge('pv_kwh'))}
        ${zeile('davon Akku', '', menge('akku_kwh'))}
        <tr class="wd-summe"><td class="wd-rowh">Kosten</td>${namen.map(n =>
          `<td><span class="wd-m3">${eur(s.je_einheit[n].betrag)}</span></td>`).join('')}</tr>
      </tbody></table></div>
      ${(s.ohne_einheit || []).length ? `<span class="sk-quelle">Ohne Einheit:
        ${s.ohne_einheit.map(o => `<b>${esc(o.zaehler)}</b> ${zahl(o.kwh)} kWh`)
          .join(' · ')}</span>` : ''}</div>`;
}

function stromketteInhalt(d) {
  const k = d.kontrolle || {};
  const warn = (d.warnungen || []).map(t =>
    `<div class="ho-warn">▲ ${esc(t)}</div>`).join('');
  const quote = d.eigenverbrauchsquote
    ? ` · eigener Strom <b>${Math.round(d.eigenverbrauchsquote * 100)} %</b>` : '';
  return `<div class="sk-box">${skSchritt1(d)}${skSchritt2(d)}${skSchritt3(d)}
    <div class="sk-kontrolle">
      <span>Verteilt <b>${eur(k.verteilt)}</b> von <b>${eur(k.schritt1_betrag)}</b>${quote}</span>
      <span class="${k.stimmt ? 'ok' : 'fehl'}">${k.stimmt
        ? '✓ Kontrollsumme stimmt'
        : `▲ Abweichung ${eur(k.differenz)}`}</span>
    </div>${warn}</div>`;
}

/* Einen der drei SolarEdge-Anteile speichern. Ein eigenes Prozentfeld gibt es
   im Datenmodell nicht — gespeichert werden die Mengen (Anteil × Gesamt), aus
   denen die Prozente wieder hervorgehen. */
async function stromAnteilSpeichern(feld) {
  const wert = parseFloat(String(feld.value || '').replace(',', '.'));
  const box = feld.closest('[data-strom-kette]');
  if (!box || Number.isNaN(wert) || wert < 0) return;
  const gesamt = Number(box.dataset.gesamtKwh) || 0;
  if (!gesamt) {
    return melde('Ohne Gesamtverbrauch lässt sich der Anteil nicht umrechnen — '
      + 'bitte zuerst den Stromzähler ablesen.', 'neg');
  }
  const spalte = { netz: 'netz_kwh', pv: 'solar_kwh', akku: 'akku_kwh' }[
    feld.dataset.skAnteil];
  try {
    await api(`/objekte/${encodeURIComponent(daten.objekt)}/strom/${
      daten.jahr}`, { method: 'PUT',
      body: { [spalte]: Math.round(gesamt * wert / 100 * 1000) / 1000 } });
    await fuelleStromketteInline(box);
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

/* Die Auswahlfelder werden nach dem Zeichnen gesetzt: sie bestehen aus
   Knopf und Liste und lassen sich nicht als Zeichenkette einfügen. */
function montiereSchluessel() {
  if (!schluessel) return;
  // Fläche · Personen · Einheiten · Prozentual · Verbrauch (N73).
  const WAHL = ['flaeche', 'personen', 'einheiten', 'prozentual', 'verbrauch'];
  const titel = new Map(schluessel.schluessel.map(s => [s.wert, s.titel]));
  const basis = WAHL.filter(w => titel.has(w))
    .map(w => ({ wert: w, text: titel.get(w) }));
  inhalt.querySelectorAll('[data-schluesselwahl]').forEach(ziel => {
    const pid = ziel.dataset.schluesselwahl;
    const jetzt = ziel.dataset.wert || '';
    // Eine Bestandsposition mit entferntem Schlüssel (Bewohnermonate, Prozent,
    // Individuell) oder „nur eine Einheit" darf nicht brechen: ihren aktuellen
    // Wert als zusätzliche Option zeigen, damit das Feld ihn weiter nennt.
    const optionen = basis.slice();
    if (jetzt === NUR_EINHEIT_WAHL) {
      optionen.push({ wert: NUR_EINHEIT_WAHL, text: '1 Einheit' });
    } else if (jetzt && !WAHL.includes(jetzt)) {
      optionen.push({ wert: jetzt, text: titel.get(jetzt) || jetzt });
    }
    auswahlfeld(ziel, {
      optionen, wert: jetzt, label: 'Verteilen nach',
      aenderung: async neu => {
        // „Nur eine Einheit/Person": erst den Einheit-Auswähler zeigen, gesetzt
        // wird nur_einheit dann über den Klick auf eine Einheit.
        if (neu === NUR_EINHEIT_WAHL) { einzelWahl = Number(pid); return zeichnen(); }
        try {
          // Der Server leitet die Gewichte beim Wechsel neu ab; nur_einheit wird
          // dabei geleert, falls die Position vorher ein Einzelposten war.
          await api(`/positionen/${pid}`,
                    { method: 'PATCH', body: { schluessel: neu, nur_einheit: '' } });
          einzelWahl = null;
          await laden();
        } catch (fehler) {
          melde(String(fehler.message || fehler), 'neg');
        }
      },
    });
  });
}

/* Die Schlüsselliste ist mit sieben Einträgen hoch. Steht das Feld weit unten,
   reicht der Platz darunter zwar für die Liste, nicht aber für die
   Menüleiste — die letzten Einträge lägen dahinter und wären nicht anklickbar.
   Deshalb vorher nach oben rollen, im Capture-Lauf: das Auswahlfeld misst den
   Platz erst danach. */
inhalt.addEventListener('click', e => {
  const knopf = e.target.closest('.vt .auswahl-knopf');
  if (!knopf || knopf.getAttribute('aria-expanded') === 'true') return;
  const noetig = (schluessel?.schluessel.length || 7) * 44 + 120;
  if (window.innerHeight - knopf.getBoundingClientRect().bottom < noetig) {
    // Nicht scrollIntoView: das schöbe das Feld unter die Kopfzeile. 150 px
    // von oben lassen die Kopfzeile stehen und die Liste ganz sichtbar werden.
    rolleUnterDieKopfzeile(knopf, 150);
  }
}, true);

/** Rollt `el` auf `oben` px unter den oberen Rand — im richtigen Rollbereich:
    auf dem Handy scrollt die Seite, am Schreibtisch die Spalte `.scroll`. */
function rolleUnterDieKopfzeile(el, oben) {
  const delta = el.getBoundingClientRect().top - oben;
  let bereich = el.parentElement;
  while (bereich && bereich !== document.body) {
    const stil = getComputedStyle(bereich);
    if (/(auto|scroll)/.test(stil.overflowY) &&
        bereich.scrollHeight > bereich.clientHeight) break;
    bereich = bereich.parentElement;
  }
  if (bereich && bereich !== document.body) bereich.scrollTop += delta;
  else window.scrollBy(0, delta);
}

/* Die Verteilung speichert sich, sobald die Gewichtsfelder den Fokus verlassen
   — kein eigener „Verteilung übernehmen"-Knopf mehr. Gespeichert wird nur, was
   sich gegenüber dem Ausgangsstand (data-basis) wirklich geändert hat; bloßes
   Durchtabben oder ein noch leerer (alles-null) Block löst nichts aus. Die
   Rückmeldung ist ein kurzer, nicht anklickbarer Toast. */
async function verteilungAutoSpeichern(vt) {
  const felder = [...vt.querySelectorAll('[data-gewicht]')];
  if (!felder.length) return;
  const anteile = {};
  felder.forEach(f => { anteile[f.dataset.gewicht] = Number(f.value) || 0; });

  let basis = {};
  try { basis = JSON.parse(vt.dataset.basis || '{}'); } catch { basis = {}; }
  const unveraendert = Object.keys(anteile).length === Object.keys(basis).length
    && Object.entries(anteile).every(([p, w]) => Number(basis[p]) === w);
  if (unveraendert) return;
  // Alles null lassen ist erlaubt (die Warnung bleibt stehen), aber nichts wird
  // dafür gespeichert — sonst käme bei jedem Verlassen eine Fehlermeldung.
  if (!Object.values(anteile).some(w => w > 0)) return;

  vt.dataset.basis = JSON.stringify(anteile);   // gespeicherten Stand nachziehen
  try {
    // N5 — von Hand geänderte Gewichte sind eine Handeingabe (abgeleitet=false):
    // sie werden bei einer späteren Mietänderung nicht automatisch überschrieben.
    await api(`/positionen/${vt.dataset.pid}`,
              { method: 'PATCH', body: { anteile, abgeleitet: false } });
    melde('✓ Verteilung gespeichert', 'pos');
    await laden();
  } catch (fehler) {
    melde(String(fehler.message || fehler), 'neg');
  }
}

/* Verlässt der Fokus den ganzen Verteilungsblock (nicht nur ein Feld daneben),
   wird gespeichert. So greift die Speicherung auch, wenn danach „Bestätigen"
   oder eine Zeile angeklickt wird — der focusout läuft vor dem Klick. */
inhalt.addEventListener('focusout', e => {
  const feld = e.target.closest?.('[data-gewicht]');
  if (!feld) return;
  const vt = feld.closest('.vt');
  if (!vt || vt.contains(e.relatedTarget)) return;
  verteilungAutoSpeichern(vt);
});

    await api(`/positionen/${knopf.dataset.ableiten}`,
              { method: 'PATCH', body: { anteile: meta.gewichte, abgeleitet: true } });

/* Eine Kostenart des Katalogs, zu der es noch keine Position gibt, wird hier

/* Der Betrag speichert sich beim Verlassen des Feldes — kein „Übernehmen"-Knopf
   mehr. Nur ein wirklich geänderter, gültiger Wert löst etwas aus. */
async function betragSpeichern(feld) {
  const pid = feld.dataset.betrag;
  const roh = String(feld.value).trim().replace(',', '.');
  if (roh === '') return;
  const betrag = Number(roh);
  if (!Number.isFinite(betrag)) return;
  if (String(feld.dataset.wert) === String(betrag)) return;
  feld.dataset.wert = String(betrag);
  try {
    await api(`/positionen/${pid}`, { method: 'PATCH', body: { betrag } });
    melde('✓ Betrag gespeichert', 'pos');
    await laden();
  } catch (fehler) {
    melde(String(fehler.message || fehler), 'neg');
  }
}

/* CCCLXIII — der Anbieter/das Gewerk gehört an die Kostenart (Feld `lieferant`),
   nicht an die einzelne Position; einmal gesetzt, gilt er über alle Zeiträume. */
async function anbieterSpeichern(feld) {
  const kid = feld.dataset.anbieter;
  if (!kid) return;
  const wert = feld.value.trim();
  if (String(feld.dataset.wert || '') === wert) return;
  feld.dataset.wert = wert;
  try {
    await api(`/kostenarten/${kid}`, { method: 'PATCH', body: { lieferant: wert } });
    await laden();
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

/* CCCLXII — die Position auf eine andere Kostenart umhängen. „＋ Neue Kostenart"
   klappt ein Freitextfeld auf; jede andere Wahl setzt direkt um. Bei Konflikt
   (Zielart hat im Zeitraum schon eine Position) meldet der Server, und der Wähler
   dreht auf die alte Art zurück. */
async function kostenartWechseln(sel) {
  const pid = sel.dataset.kostenartPos;
  const neuFeld = sel.parentElement.querySelector('.ka-neu');
  if (sel.value === '__neu__') {
    if (neuFeld) { neuFeld.hidden = false; neuFeld.value = ''; neuFeld.focus(); }
    return;
  }
  if (neuFeld) neuFeld.hidden = true;
  if (sel.value === String(sel.dataset.wert || '')) return;
  try {
    await api(`/positionen/${pid}`, { method: 'PATCH', body: { kostenart: sel.value } });
    await laden();
  } catch (fehler) {
    melde(String(fehler.message || fehler), 'neg');
    sel.value = sel.dataset.wert || sel.value;   // Auswahl zurückdrehen
  }
}

async function kostenartNeu(feld) {

/* CCCLIX — der Teilbetrag speichert sich wie der Betrag: ein geänderter Wert
   per PATCH, kein Übernehmen-Knopf. Backend rechnet den Rest nach Schlüssel. */
async function vorabPatch(pid, body) {
  try {
    await api(`/positionen/${pid}`, { method: 'PATCH', body });
    melde('✓ Teilbetrag gespeichert', 'pos');
    await laden();
  } catch (fehler) {
    melde(String(fehler.message || fehler), 'neg');
  }
}

/* Netto-Feld verlassen: leer/0 leert den Teilbetrag samt Einheit, sonst wird
   der Netto-Wert gesetzt und der Brutto (× 1,19, auf den Cent) als vorab_betrag
   mitgeschrieben — genau der Betrag, der sich oben vom Gesamtbetrag abzieht. */
async function vorabNettoSpeichern(feld) {
  const pid = feld.dataset.vorabNetto;
  const roh = String(feld.value).trim().replace(',', '.');
  const netto = roh === '' ? 0 : Number(roh);
  if (!Number.isFinite(netto) || netto < 0) return;
  if (netto === 0) {
    vorabOffen.delete(Number(pid));
    return vorabPatch(pid, { vorab_netto: 0, vorab_betrag: 0, vorab_einheit: '' });
  }
  return vorabPatch(pid, { vorab_netto: netto, vorab_betrag: vorabBrutto(netto) });
}

/* Das × am Teilbetrag: gesetzten Teilbetrag leeren, sonst nur wieder
   zuklappen. */
async function vorabEntfernen(knopf) {
  const pid = Number(knopf.dataset.vorabEntfernen);
  vorabOffen.delete(pid);
  if (knopf.dataset.hat === '1') {
    return vorabPatch(pid, { vorab_netto: 0, vorab_betrag: 0, vorab_einheit: '' });
  }
  return zeichnen();
}

/* CCVIII — die abgetippten NK-Summen je Mieter übernehmen. Je Einheit eine
   Position mit `nur_einheit`: bestehende werden aktualisiert, neue angelegt —
   so lässt sich der Zettel der Hausverwaltung mehrfach nachtragen, ohne dass
   sich Positionen doppeln. */
async function wegDirektSpeichern(knopf) {
  const eingaben = [...inhalt.querySelectorAll('[data-weg-betrag]')]
    .map(f => ({ einheit: f.dataset.wegBetrag, betrag: Number(f.value) }))
    .filter(x => x.betrag > 0);
  if (!eingaben.length) {
    return melde('Trage mindestens eine NK-Summe ein', 'neg');
  }
  knopf.disabled = true;
  knopf.textContent = 'Übernehme …';
  const bestehende = new Map((daten.checkliste || []).map(k => [k.kostenart, k]));
  try {
    for (const { einheit, betrag } of eingaben) {
      const art = WEG_ART(einheit);
      const vorhanden = bestehende.get(art);
      if (vorhanden && vorhanden.position_id) {
        await api(`/positionen/${vorhanden.position_id}`,
                  { method: 'PATCH', body: { betrag } });
      } else {
        await api(`/zeitraeume/${zid}/positionen`, {
          method: 'POST',
          body: { kostenart: art, betrag, nur_einheit: einheit },
        });
      }
    }
    melde(`NK-Summe je Mieter übernommen · ${eingaben.length} ${
      eingaben.length === 1 ? 'Mieter' : 'Mieter'}`, 'pos');
    await laden();
  } catch (fehler) {
    knopf.disabled = false;
    knopf.textContent = 'Werte je Mieter übernehmen';
    melde(String(fehler.message || fehler), 'neg');
  }
}

/* Entfernen mit Rückfrage: die Kostenart bleibt im Katalog, die Zeile taucht

/* CCLV — den kostenfreien Beleg aus dem Bestand wählen. Eigener Dialog wie der
   Versandplan: eine Zeile je Kandidat. Liefert die Dokument-Id oder null. */
function anhaengerWaehlen(kostenart) {
  const kandidaten = anhaenger?.kandidaten || [];
  const liste = kandidaten.length
    ? kandidaten.map(d => `
        <button class="ahz" data-pick="${d.id}">
          ${ANH_ICON}
          <span class="ahn">${esc(kurzBeleg(d.dateiname))}
            <span class="ahsub">${esc(d.kategorie || 'Ohne Art')}${
              d.jahr ? ` · ${d.jahr}` : ''}</span></span>
        </button>`).join('')
    : `<div class="ahleer">Kein kostenfreier Beleg im Bestand dieser Immobilie.
       Ein Beleg wird kostenfrei, wenn er im Eingang ohne Kostenposition bleibt —
       etwa ein Zählerstand oder ein SEPA-Mandat.</div>`;

  return new Promise(fertig => {
    const dlg = document.createElement('dialog');
    dlg.className = 'immo-dlg ahdlg';
    dlg.innerHTML = `
      <div class="dt">Beleg an „${esc(kostenart)}“ hängen</div>
      <p>Ein Zusatzbeleg ohne Kostenanteil — er erscheint als kleiner Anhänger
        am Thema, ohne Betrag.</p>
      <div class="ahliste">${liste}</div>
      <button class="btn leise" data-nein>Abbrechen</button>`;
    document.body.appendChild(dlg);
    dlg.addEventListener('close', () => dlg.remove());
    dlg.addEventListener('cancel', () => fertig(null));
    dlg.addEventListener('click', e => {
      const pick = e.target.closest('[data-pick]');
      if (pick) { fertig(Number(pick.dataset.pick)); dlg.close(); }
      else if (e.target.closest('[data-nein]')) { fertig(null); dlg.close(); }
    });
    dlg.showModal();
  });
}
