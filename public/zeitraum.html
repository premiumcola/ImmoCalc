   Menüleiste — die letzten Einträge lägen dahinter und wären nicht anklickbar.
   Deshalb vorher nach oben rollen, im Capture-Lauf: das Auswahlfeld misst den
   Platz erst danach. */
inhalt.addEventListener('click', e => {
  const knopf = e.target.closest('.vt .auswahl-knopf');
  if (!knopf || knopf.getAttribute('aria-expanded') === 'true') return;
  const noetig = (schluessel?.schluessel.length || 7) * 44 + 120;
  if (window.innerHeight - knopf.getBoundingClientRect().bottom < noetig) {
    // Nicht scrollIntoView: das schöbe das Feld unter die Kopfzeile. 150 px
    // von oben lassen die Kopfzeile stehen und die Liste ganz sichtbar werden.
    rolleUnterDieKopfzeile(knopf, 150);
  }
}, true);

/** Rollt `el` auf `oben` px unter den oberen Rand — im richtigen Rollbereich:
    auf dem Handy scrollt die Seite, am Schreibtisch die Spalte `.scroll`. */
function rolleUnterDieKopfzeile(el, oben) {
  const delta = el.getBoundingClientRect().top - oben;
  let bereich = el.parentElement;
  while (bereich && bereich !== document.body) {
    const stil = getComputedStyle(bereich);
    if (/(auto|scroll)/.test(stil.overflowY) &&
        bereich.scrollHeight > bereich.clientHeight) break;
    bereich = bereich.parentElement;
  }
  if (bereich && bereich !== document.body) bereich.scrollTop += delta;
  else window.scrollBy(0, delta);
}

/* Die Verteilung speichert sich, sobald die Gewichtsfelder den Fokus verlassen
   — kein eigener „Verteilung übernehmen"-Knopf mehr. Gespeichert wird nur, was
   sich gegenüber dem Ausgangsstand (data-basis) wirklich geändert hat; bloßes
   Durchtabben oder ein noch leerer (alles-null) Block löst nichts aus. Die
   Rückmeldung ist ein kurzer, nicht anklickbarer Toast. */
async function verteilungAutoSpeichern(vt) {
  const felder = [...vt.querySelectorAll('[data-gewicht]')];
  if (!felder.length) return;
  const anteile = {};
  felder.forEach(f => { anteile[f.dataset.gewicht] = Number(f.value) || 0; });

  let basis = {};
  try { basis = JSON.parse(vt.dataset.basis || '{}'); } catch { basis = {}; }
  const unveraendert = Object.keys(anteile).length === Object.keys(basis).length
    && Object.entries(anteile).every(([p, w]) => Number(basis[p]) === w);
  if (unveraendert) return;
  // Alles null lassen ist erlaubt (die Warnung bleibt stehen), aber nichts wird
  // dafür gespeichert — sonst käme bei jedem Verlassen eine Fehlermeldung.
  if (!Object.values(anteile).some(w => w > 0)) return;

  vt.dataset.basis = JSON.stringify(anteile);   // gespeicherten Stand nachziehen
  try {
    await api(`/positionen/${vt.dataset.pid}`,
              { method: 'PATCH', body: { anteile } });
    melde('✓ Verteilung gespeichert', 'pos');
    await laden();
  } catch (fehler) {
    melde(String(fehler.message || fehler), 'neg');
  }
}

/* Verlässt der Fokus den ganzen Verteilungsblock (nicht nur ein Feld daneben),
   wird gespeichert. So greift die Speicherung auch, wenn danach „Bestätigen"
   oder eine Zeile angeklickt wird — der focusout läuft vor dem Klick. */
inhalt.addEventListener('focusout', e => {
  const feld = e.target.closest?.('[data-gewicht]');
  if (!feld) return;
  const vt = feld.closest('.vt');
  if (!vt || vt.contains(e.relatedTarget)) return;
  verteilungAutoSpeichern(vt);
});

/* Eine Kostenart des Katalogs, zu der es noch keine Position gibt, wird hier
   zu einer. Erst danach gibt es einen Betrag, eine Verteilung und damit
   überhaupt eine Zeile in der Abrechnung. Die Gewichte leitet der Server aus
   den Stammdaten ab — mitgegeben wird nur, was der Nutzer eingetippt hat. */

  const kostenart = knopf.dataset.anlegen;
  const i = Number(knopf.dataset.index);
  const feld = inhalt.querySelector(`[data-neubetrag="${i}"]`);

  knopf.textContent = 'Lege an …';

              { method: 'POST', body: { kostenart, betrag } });

    await laden();
  } catch (fehler) {
    knopf.disabled = false;
    knopf.textContent = 'Anlegen';
    melde(String(fehler.message || fehler), 'neg');
  }
}

/* Der Betrag speichert sich beim Verlassen des Feldes — kein „Übernehmen"-Knopf
   mehr. Nur ein wirklich geänderter, gültiger Wert löst etwas aus. */
async function betragSpeichern(feld) {
  const pid = feld.dataset.betrag;
  const roh = String(feld.value).trim().replace(',', '.');
  if (roh === '') return;
  const betrag = Number(roh);
  if (!Number.isFinite(betrag)) return;
  if (String(feld.dataset.wert) === String(betrag)) return;
  feld.dataset.wert = String(betrag);
  try {
    await api(`/positionen/${pid}`, { method: 'PATCH', body: { betrag } });
    melde('✓ Betrag gespeichert', 'pos');
    await laden();
  } catch (fehler) {
    melde(String(fehler.message || fehler), 'neg');
  }
}

/* CCCLXIII — der Anbieter/das Gewerk gehört an die Kostenart (Feld `lieferant`),
   nicht an die einzelne Position; einmal gesetzt, gilt er über alle Zeiträume. */
async function anbieterSpeichern(feld) {
  const kid = feld.dataset.anbieter;
  if (!kid) return;
  const wert = feld.value.trim();
  if (String(feld.dataset.wert || '') === wert) return;
  feld.dataset.wert = wert;
  try {
    await api(`/kostenarten/${kid}`, { method: 'PATCH', body: { lieferant: wert } });
    await laden();
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

/* CCCLXII — die Position auf eine andere Kostenart umhängen. „＋ Neue Kostenart"
   klappt ein Freitextfeld auf; jede andere Wahl setzt direkt um. Bei Konflikt
   (Zielart hat im Zeitraum schon eine Position) meldet der Server, und der Wähler
   dreht auf die alte Art zurück. */
async function kostenartWechseln(sel) {
  const pid = sel.dataset.kostenartPos;
  const neuFeld = sel.parentElement.querySelector('.ka-neu');
  if (sel.value === '__neu__') {
    if (neuFeld) { neuFeld.hidden = false; neuFeld.value = ''; neuFeld.focus(); }
    return;
  }
  if (neuFeld) neuFeld.hidden = true;
  if (sel.value === String(sel.dataset.wert || '')) return;
  try {
    await api(`/positionen/${pid}`, { method: 'PATCH', body: { kostenart: sel.value } });
    await laden();
  } catch (fehler) {
    melde(String(fehler.message || fehler), 'neg');
    sel.value = sel.dataset.wert || sel.value;   // Auswahl zurückdrehen
  }
}

/* CCCLIX — der Teilbetrag speichert sich wie der Betrag: ein geänderter Wert
   per PATCH, kein Übernehmen-Knopf. Backend rechnet den Rest nach Schlüssel. */
async function vorabPatch(pid, body) {

    await laden();

/* Netto-Feld verlassen: leer/0 leert den Teilbetrag samt Einheit, sonst wird
   der Netto-Wert gesetzt und der Brutto (× 1,19, auf den Cent) als vorab_betrag
   mitgeschrieben — genau der Betrag, der sich oben vom Gesamtbetrag abzieht. */
async function vorabNettoSpeichern(feld) {
  const pid = feld.dataset.vorabNetto;
  const roh = String(feld.value).trim().replace(',', '.');
  const netto = roh === '' ? 0 : Number(roh);
  if (!Number.isFinite(netto) || netto < 0) return;
  if (netto === 0) {
    vorabOffen.delete(Number(pid));
    return vorabPatch(pid, { vorab_netto: 0, vorab_betrag: 0, vorab_einheit: '' });
  }
  return vorabPatch(pid, { vorab_netto: netto, vorab_betrag: vorabBrutto(netto) });
}

/* Das × am Teilbetrag: gesetzten Teilbetrag leeren, sonst nur wieder
   zuklappen. */
async function vorabEntfernen(knopf) {
  const pid = Number(knopf.dataset.vorabEntfernen);
  vorabOffen.delete(pid);
  if (knopf.dataset.hat === '1') {
    return vorabPatch(pid, { vorab_netto: 0, vorab_betrag: 0, vorab_einheit: '' });
  }
  return zeichnen();
}

/* CCVIII — die abgetippten NK-Summen je Mieter übernehmen. Je Einheit eine
   Position mit `nur_einheit`: bestehende werden aktualisiert, neue angelegt —
   so lässt sich der Zettel der Hausverwaltung mehrfach nachtragen, ohne dass
   sich Positionen doppeln. */
async function wegDirektSpeichern(knopf) {
  const eingaben = [...inhalt.querySelectorAll('[data-weg-betrag]')]
    .map(f => ({ einheit: f.dataset.wegBetrag, betrag: Number(f.value) }))
    .filter(x => x.betrag > 0);
  if (!eingaben.length) {
    return melde('Trage mindestens eine NK-Summe ein', 'neg');
  }
  knopf.disabled = true;
  knopf.textContent = 'Übernehme …';
  const bestehende = new Map((daten.checkliste || []).map(k => [k.kostenart, k]));
  try {
    for (const { einheit, betrag } of eingaben) {
      const art = WEG_ART(einheit);
      const vorhanden = bestehende.get(art);
      if (vorhanden && vorhanden.position_id) {
        await api(`/positionen/${vorhanden.position_id}`,
                  { method: 'PATCH', body: { betrag } });
      } else {
        await api(`/zeitraeume/${zid}/positionen`, {
          method: 'POST',
          body: { kostenart: art, betrag, nur_einheit: einheit },
        });
      }
    }
    melde(`NK-Summe je Mieter übernommen · ${eingaben.length} ${
      eingaben.length === 1 ? 'Mieter' : 'Mieter'}`, 'pos');
    await laden();
  } catch (fehler) {
    knopf.disabled = false;
    knopf.textContent = 'Werte je Mieter übernehmen';
    melde(String(fehler.message || fehler), 'neg');
  }
}

    + 'erfassen. Hinterlegte Belege bleiben unangetastet.',

  knopf.disabled = true;

    melde(`„${art}“ entfernt`, '');
    await laden();
  } catch (fehler) {
    knopf.disabled = false;
    melde(String(fehler.message || fehler), 'neg');

}

/* CCLV — den kostenfreien Beleg aus dem Bestand wählen. Eigener Dialog wie der
   Versandplan: eine Zeile je Kandidat. Liefert die Dokument-Id oder null. */
function anhaengerWaehlen(kostenart) {
  const kandidaten = anhaenger?.kandidaten || [];
  const liste = kandidaten.length
    ? kandidaten.map(d => `
        <button class="ahz" data-pick="${d.id}">
          ${ANH_ICON}
          <span class="ahn">${esc(kurzBeleg(d.dateiname))}
            <span class="ahsub">${esc(d.kategorie || 'Ohne Art')}${
              d.jahr ? ` · ${d.jahr}` : ''}</span></span>
        </button>`).join('')
    : `<div class="ahleer">Kein kostenfreier Beleg im Bestand dieser Immobilie.
       Ein Beleg wird kostenfrei, wenn er im Eingang ohne Kostenposition bleibt —
       etwa ein Zählerstand oder ein SEPA-Mandat.</div>`;

  return new Promise(fertig => {
    const dlg = document.createElement('dialog');
    dlg.className = 'immo-dlg ahdlg';
    dlg.innerHTML = `
      <div class="dt">Beleg an „${esc(kostenart)}“ hängen</div>
      <p>Ein Zusatzbeleg ohne Kostenanteil — er erscheint als kleiner Anhänger
        am Thema, ohne Betrag.</p>
      <div class="ahliste">${liste}</div>
      <button class="btn leise" data-nein>Abbrechen</button>`;
    document.body.appendChild(dlg);
    dlg.addEventListener('close', () => dlg.remove());
    dlg.addEventListener('cancel', () => fertig(null));
    dlg.addEventListener('click', e => {
      const pick = e.target.closest('[data-pick]');
      if (pick) { fertig(Number(pick.dataset.pick)); dlg.close(); }
      else if (e.target.closest('[data-nein]')) { fertig(null); dlg.close(); }
    });
    dlg.showModal();
  });
}

/* Der Versandplan als Dialog: eine Zeile je Partei, damit vor dem Abschluss
   klar ist, wer die Abrechnung bekommt — und über welche Adressen. Der
   Leerstand steht ruhig am Ende: er ist kein vergessener Mieter, sondern der
   Anteil, den der Eigentümer selbst trägt. Liefert 'senden', 'nur' oder null.

   Eigener Dialog statt `wahl`: dort ginge alles in einem Fließtext auf, und
   genau die Unterscheidung, um die es hier geht, wäre wieder verwischt. */
function versandWahl(plan) {
  const zeile = (p, marke, klasse, unter) => `
    <div class="vz">
      <span class="vn">${esc(p.partei)}
        <span class="vs">${esc(unter)}</span></span>
      <span class="marke vm ${klasse}">${marke}</span>
    </div>`;

  const bereit = plan.parteien.filter(p => p.versandbereit);
  const ohne = plan.parteien.filter(p => !p.versandbereit && !p.leerstand);
  const leer = plan.parteien.filter(p => p.leerstand);
  const mieter = bereit.length + ohne.length;

  const liste = [
    ...bereit.map(p => zeile(p, 'Mail', 'gut', p.adressen.join(' · '))),
    ...ohne.map(p => zeile(p, 'Post', 'post',
      'Keine Mailadresse — ausdrucken und schicken')),
    ...leer.map(p => zeile(p, 'Leerstand', '', 'Bleibt beim Eigentümer')),
  ].join('');

  const satz = mieter
    ? `${bereit.length} von ${mieter} ${mieter === 1 ? 'Mietpartei bekommt'
        : 'Mietparteien bekommen'} die Abrechnung als PDF per Mail.`
    : 'Es gibt keine Mietpartei zu beliefern — der Zeitraum lässt sich '
      + 'trotzdem abschließen.';

  return new Promise(fertig => {
    const dlg = document.createElement('dialog');
    dlg.className = 'immo-dlg vdlg';
    dlg.innerHTML = `
      <div class="dt">Abrechnung abschließen</div>
      <p>${esc(plan.zeitraum)} · ${esc(satz)}</p>
      <div class="vliste">${liste}</div>
      ${bereit.length ? `<button class="btn"
        data-wahl="senden">Abschließen und verschicken</button>` : ''}
      <button class="btn leise" data-wahl="nur">Nur abschließen, nicht
        verschicken</button>
      <button class="btn leise" data-nein>Abbrechen</button>`;
    document.body.appendChild(dlg);
    dlg.addEventListener('close', () => dlg.remove());
    dlg.addEventListener('cancel', () => fertig(null));
    dlg.addEventListener('click', e => {
      const knopf = e.target.closest('[data-wahl]');
      if (knopf) { fertig(knopf.dataset.wahl); dlg.close(); }
      else if (e.target.closest('[data-nein]')) { fertig(null); dlg.close(); }
    });
    dlg.showModal();
  });
}

/* Vor dem Versand zeigen, wer was bekommt — und wem die Mailadresse fehlt. */
async function abschliessen(knopf) {
  const uebergehen = document.getElementById('uebergehen')?.checked || false;
  knopf.disabled = true;
  knopf.textContent = 'Prüfe Empfänger …';

  let plan;
  try {
    plan = await api(`/zeitraeume/${zid}/versand`);
  } catch (fehler) {
    knopf.disabled = false;
    knopf.textContent = 'Abrechnungen erstellen und versenden';
    melde(String(fehler.message || fehler), 'neg');
    return;
  }

  // Nicht jeder verschickt per Mail — wer die Abrechnung ausdruckt und mit
  // der Post schickt, muss den Zeitraum trotzdem abschliessen koennen.
  const weg = await versandWahl(plan);

  if (!weg) {
    knopf.disabled = false;
    knopf.textContent = 'Abrechnungen erstellen und versenden';
    return;
  }

  knopf.textContent = weg === 'senden' ? 'Verschicke …' : 'Schließe ab …';
  try {
    const antwort = await api(`/zeitraeume/${zid}/abschliessen`, {
      method: 'POST', body: { versenden: weg === 'senden',
                              offene_uebergehen: uebergehen },
    });
    melde(antwort.versendet.length
      ? `${antwort.versendet.length} Abrechnung(en) verschickt an ${antwort.versendet.join(', ')}`
      : 'Zeitraum abgeschlossen — versendet wurde nichts.',
      antwort.versendet.length ? 'pos' : '');
    await laden();
  } catch (fehler) {
    knopf.disabled = false;
    knopf.textContent = 'Abrechnungen erstellen und versenden';
    melde(String(fehler.message || fehler), 'neg');
  }
}

async function laden() {
  if (!zid) {
    inhalt.innerHTML = '<div class="empty"><div class="big">Kein Zeitraum gewählt</div></div>';
    return;
  }
  try {
    daten = await api(`/zeitraeume/${zid}`);
  } catch {
    inhalt.innerHTML = `<div class="empty"><div class="big">Zeitraum nicht gefunden</div></div>`;
    return;
  }
  // Die Schlüssel-Vorschau ist Beiwerk: fehlt sie, bleibt die Checkliste
  // bedienbar, nur ohne Auswahlfeld und ohne Ableitung.
  try {
    schluessel = await api(`/zeitraeume/${zid}/schluessel`);
  } catch {
    schluessel = null;
  }
  leerstaende = new Set(
    (schluessel?.schluessel || []).flatMap(s => s.leerstand || []));
  // CCLV — die kostenfreien Themen-Anhänger. Beiwerk: fehlt der Endpunkt (noch
  // nicht deployt), bleibt die Checkliste ohne Anhänger bedienbar.
  try {
    anhaenger = await api(`/dokumente/anhaenger/${zid}`);
  } catch {
    anhaenger = null;
  }
  // NK-STRUKTUR — die Ablese-Maske liefert den Zählerverbrauch je Kostenart für
  // den Chip. Beiwerk: fehlt der Endpunkt, bleibt die Checkliste ohne Chips.
  try {
    ablesungMaske = await api(`/zeitraeume/${zid}/ablesung`);
  } catch {
    ablesungMaske = null;
  }
  chipMap = baueChipMap();
  titel.textContent = daten.label;
  sub.textContent = `${daten.objekt_name} · ${daten.typ}`;
  await zeichnen();
}

/* Prozentanteile beim Tippen mitrechnen — sonst sieht man erst nach dem
   Speichern, was man da eigentlich verteilt hat. */
inhalt.addEventListener('input', e => {
  // CCCLIX — Teilbetrag: netto tippen, Brutto (× 1,19) rechnet live daneben.
  if (e.target.matches('[data-vorab-netto]')) {
    const netto = Number(String(e.target.value).replace(',', '.')) || 0;
    const ziel = e.target.closest('.vorab')?.querySelector('[data-vorab-brutto]');
    if (ziel) ziel.textContent = bruttoAnzeige(netto);
    return;
  }
  if (!e.target.matches('[data-gewicht]')) return;
  const vt = e.target.closest('.vt');
  const felder = [...vt.querySelectorAll('[data-gewicht]')];
  const summe = felder.reduce((s, f) => s + (Number(f.value) || 0), 0);
  // Bei abgeleiteten Schlüsseln rechnet der €-Betrag (Leitzahl) live mit — der
  // Rest steht am Block. Beim manuellen Schlüssel fehlt das €-Ziel und es bleibt
  // beim Prozent-Update; endgültig gerechnet wird ohnehin nach dem Speichern.
  const rest = Number(vt.dataset.rest || 0);
  felder.forEach(f => {
    const ziel = f.parentElement.querySelector('[data-anteil]');
    if (ziel) ziel.textContent = prozentText(f.value, summe);
    const euroZiel = f.parentElement.querySelector('[data-euro]');
    if (euroZiel) euroZiel.textContent = eur(summe > 0
      ? rest * (Number(f.value) || 0) / summe : 0);
  });
});

inhalt.addEventListener('change', e => {
  // Der Versand bleibt gesperrt, bis die Restposten bewusst abgehakt sind.
  if (e.target.id === 'uebergehen') {
    const knopf = document.getElementById('abschlussKnopf');
    if (knopf) knopf.disabled = !e.target.checked;
    return;
  }
  // Der Betrag speichert sich beim Verlassen des Feldes.
  if (e.target.matches('[data-betrag]')) betragSpeichern(e.target);
  // CCCLXIII — Anbieter/Gewerk der Kostenart speichert sich genauso.
  if (e.target.matches('[data-anbieter]')) anbieterSpeichern(e.target);
  // CCCLXII — Kostenart der Position wechseln (Wähler + Freitext für eine neue).
  if (e.target.matches('[data-kostenart-pos]')) kostenartWechseln(e.target);
  if (e.target.matches('[data-kostenart-neu]')) kostenartNeu(e.target);
  // CCCLIX — Teilbetrag (netto) und §35a-Schalter speichern sich auf dieselbe Art.
  if (e.target.matches('[data-vorab-netto]')) vorabNettoSpeichern(e.target);
  if (e.target.matches('[data-vorab-s35]')) {
    vorabPatch(e.target.dataset.vorabS35, { vorab_s35: e.target.checked });
  }
});

inhalt.addEventListener('click', async e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { ansicht = tab.dataset.tab; return zeichnen(); }

  const sort = e.target.closest('[data-sort]');
  if (sort) { sortierung = sort.dataset.sort; return zeichnen(); }

  const abschluss = e.target.closest('[data-abschluss]');
  if (abschluss) return abschliessen(abschluss);

  const oeffnen = e.target.closest('[data-oeffnen]');
  if (oeffnen) return wiederOeffnen(oeffnen);

  const ableiten = e.target.closest('[data-ableiten]');
  if (ableiten) return verteilungAbleiten(ableiten);

  const anlegen = e.target.closest('[data-anlegen]');
  if (anlegen) return positionAnlegen(anlegen);

  // „Nur eine Einheit/Person": die gewählte Einheit setzen.
  const einzel = e.target.closest('[data-einzel-einheit]');
  if (einzel) return einzelSetzen(einzel.dataset.einzelPid,
                                  einzel.dataset.einzelEinheit);

  // CCCLIX — Teilbetrag: Zugang aufklappen, Einheit wählen, entfernen.
  const vorabAuf = e.target.closest('[data-vorab-oeffnen]');
  if (vorabAuf) {
    vorabOffen.add(Number(vorabAuf.dataset.vorabOeffnen));
    return zeichnen();
  }
  const vorabE = e.target.closest('[data-vorab-einheit-pid]');
  if (vorabE) return vorabPatch(vorabE.dataset.vorabEinheitPid,
                                { vorab_einheit: vorabE.dataset.vorabEinheit });
  const vorabWeg = e.target.closest('[data-vorab-entfernen]');
  if (vorabWeg) return vorabEntfernen(vorabWeg);

  // „Fertig": die Karte einfach wieder zuklappen.
  const fertig = e.target.closest('[data-fertig]');
  if (fertig) { offen.delete(Number(fertig.dataset.fertig)); return zeichnen(); }

  const wegSpeichern = e.target.closest('[data-weg-speichern]');
  if (wegSpeichern) return wegDirektSpeichern(wegSpeichern);

  const entwJa = e.target.closest('[data-entwurf-ja]');
  if (entwJa) return entwurfBestaetigen(entwJa.dataset.entwurfJa, entwJa);

  const entwNein = e.target.closest('[data-entwurf-nein]');
  if (entwNein) return entwurfVerwerfen(entwNein.dataset.entwurfNein,
                                        entwNein.dataset.art, entwNein);

  const entfernen = e.target.closest('[data-entfernen]');
  if (entfernen) return positionEntfernen(entfernen);

  const auf = e.target.closest('[data-auf]');
  if (auf) {
    const i = Number(auf.dataset.auf);
    offen.has(i) ? offen.delete(i) : offen.add(i);
    return zeichnen();
  }

  const anhaengenKnopf = e.target.closest('[data-anhaengen]');
  if (anhaengenKnopf) return anhaengen(anhaengenKnopf.dataset.anhaengen);

  const anhLoesen = e.target.closest('[data-anh-loesen]');
  if (anhLoesen) return anhaengerLoesen(Number(anhLoesen.dataset.anhLoesen));

  const beleg = e.target.closest('[data-beleg]');
  if (beleg) {
    e.preventDefault();
    // Der Beleg wird durch die API gereicht — Nextcloud verlangt sonst eine
    // eigene Anmeldung. Angezeigt wird er im Dialog, nicht in einem neuen
    // Fenster: aus dem kommt man auf dem Telefon nicht mehr zurueck.
    belegAnsehen(`/api/dokumente/${beleg.dataset.beleg}/inhalt`,
                 beleg.dataset.name
                 || beleg.textContent.replace(/^PDF · /, '').trim());
    return;
  }

  const scan = e.target.closest('[data-scan]');
  if (scan) {
    scanZiel = { kostenart: scan.dataset.scan, knopf: scan };
    document.getElementById('scanFeld').click();
    return;
  }

  // CCLXXXIII — Beleg aus der Ablage/Nextcloud wählen: hinüber in den
  // Dokumenteneingang, dort auf dieses Objekt + diese Kostenart vorgefiltert.
  // Das Prüfblatt kennt die Ziel-Abrechnung und ordnet den gewählten Beleg
  // beim Übernehmen genau dieser Position zu.
  const ablage = e.target.closest('[data-ablage]');
  if (ablage) {
    const p = new URLSearchParams({
      objekt: daten.objekt, kostenart: ablage.dataset.ablage,
      zuordnenZeitraum: String(daten.id),
      zurueck: location.pathname + location.search,
    });
    location.href = 'eingang.html?' + p.toString();
    return;
  }
});

/* ---- Beleg direkt an einer offenen Position ------------------------------
   Die Aufnahmen werden im Browser zu einem PDF gebaut und mit Kostenart, Jahr
   und Objekt hochgeladen — der Umweg über den Eingang entfällt. Parallel geht
   die erste Aufnahme durch die Texterkennung; findet sie einen Betrag, wird er
   nur vorgeschlagen, nie ohne Rückfrage gespeichert. */
document.getElementById('scanFeld').addEventListener('change', async e => {
  const feld = e.target;
  const dateien = [...feld.files];
  feld.value = '';
  const ziel = scanZiel;
  scanZiel = null;
  if (!dateien.length || !ziel) return;

  const knopf = ziel.knopf;
  const beschriftung = knopf.querySelector('.st');
  knopf.disabled = true;
  if (beschriftung) beschriftung.textContent = 'Verarbeite …';

  try {
    // CCCLXXI — am Rechner lassen sich auch fertige PDFs wählen (Belege sind
    // meist PDF). Ein PDF geht unverändert hoch, Fotos werden wie bisher zu
    // EINEM PDF zusammengebaut; beides zusammen ergibt mehrere Belege.
    const istPdf = d => d.type === 'application/pdf' || /\.pdf$/i.test(d.name || '');
    const pdfs = dateien.filter(istPdf);
    const bilder = dateien.filter(d => !istPdf(d));
    const jahr = Number((daten.ende || '').slice(0, 4)) || new Date().getFullYear();

    const sendungen = [];
    if (bilder.length) {
      const { pdf, seiten } = await scanZuPdf(bilder);
      sendungen.push({ datei: pdf, name: 'scan.pdf', seiten });
    }
    for (const p of pdfs) sendungen.push({ datei: p, name: p.name, seiten: null });

    const hochladen = async ({ datei, name }) => {
      const paket = new FormData();
      paket.append('objekt', daten.objekt);
      paket.append('kategorie', 'Nebenkosten');
      paket.append('jahr', String(jahr));
      paket.append('beschreibung', ziel.kostenart);
      // Ohne den Zeitraum hinge der Beleg nur am Objekt — der Reiter „Belege"
      // bliebe leer und die Zuordnung müsste man von Hand nachholen.
      paket.append('zeitraum_id', String(daten.id));
      paket.append('datei', datei, name);
      const antwort = await fetch('/api/dokumente/scannen',
                                  { method: 'POST', body: paket });
      if (!antwort.ok) {
        const grund = await antwort.json().then(k => k.detail).catch(() => null);
        throw new Error(grund || `Fehler ${antwort.status}`);
      }
      return antwort.json();
    };

    const [ergebnisse, vorschlag] = await Promise.all([
      Promise.all(sendungen.map(hochladen)),
      erkennen(bilder[0] || pdfs[0]),
    ]);
    const seiten = sendungen.reduce((s, x) => s + (x.seiten || 1), 0);
    const groesse = sendungen.reduce((s, x) => s + (x.datei.size || 0), 0);
    if (beschriftung) {
      beschriftung.textContent = ergebnisse.every(r => r.abgelegt)
        ? `✓ ${seiten} Seite${seiten > 1 ? 'n' : ''} · ${lesbareGroesse(groesse)}`
        : '✓ Im Eingang';
    }

    await betragVorschlagen(ziel.kostenart, vorschlag);
    await laden();
  } catch (fehler) {
    if (beschriftung) beschriftung.textContent = 'Fehlgeschlagen';
    knopf.disabled = false;
    melde(String(fehler.message || fehler), 'neg');
  }
});

/** Texterkennung — schlägt fehl sie, gibt es eben keinen Vorschlag. */
async function erkennen(bild) {
  if (!bild) return null;
  try {
    const paket = new FormData();
    // Der Dateiname sagt dem Server, womit er es zu tun hat (Bild oder PDF).
    paket.append('datei', bild, bild.name || 'seite.jpg');
    const antwort = await fetch('/api/dokumente/erkennen',
                                { method: 'POST', body: paket });
    return antwort.ok ? await antwort.json() : null;
  } catch {
    return null;
  }
}

async function betragVorschlagen(kostenart, vorschlag) {
  if (!vorschlag?.betrag) return;
  const zeile = daten.checkliste.find(k => k.kostenart === kostenart);
  if (!zeile) return;
  const ja = await frage('Betrag aus dem Beleg übernehmen?',
    `Erkannt wurden ${eur(vorschlag.betrag)}`
    + (vorschlag.datum
      ? ` vom ${new Date(vorschlag.datum).toLocaleDateString('de-DE')}`
      : '')
    + `. Als Betrag für „${kostenart}“ eintragen?`,
    { knopf: 'Übernehmen' });
  if (!ja) return;
  // Gibt es die Position noch nicht, entsteht sie hier — sonst versickerte
  // der erkannte Betrag an genau den Zeilen, die noch nichts haben.
  if (zeile.position_id) {
    await api(`/positionen/${zeile.position_id}`,
              { method: 'PATCH', body: { betrag: vorschlag.betrag,
                                         wertquelle: 'Scan' } });
  } else {
    await api(`/zeitraeume/${zid}/positionen`,
              { method: 'POST', body: { kostenart, betrag: vorschlag.betrag,
                                        wertquelle: 'Scan' } });
  }
}

/* ---- Ablese-Wizard (CCXCIII) — Zählerstände durchscrollend eingeben --------

/* CCCLXXX — der Zahnrad-Knopf neben „Ablesewerte eingeben" öffnet die
   Zähler-Konfiguration dieser Immobilie. */
function ablesenKnopfHtml() {
  return `<div class="ablese-leiste">
    <button class="ablesebtn" id="ableseWizard" type="button">
      <span class="si">▦</span> Ablesewerte eingeben</button>

const zahl = n => (n ?? 0).toLocaleString('de-DE', { maximumFractionDigits: 3 });

inhalt.addEventListener('click', e => {
  if (e.target.closest('#ableseWizard')) ablesungWizard();
  else if (e.target.closest('#zaehlerKonfig')) zaehlerKonfig();
});

async function ablesungWizard() {
  let maske;
  try { maske = await api(`/zeitraeume/${zid}/ablesung`); }
  catch (fehler) { melde(fehler.message || 'Ablesewerte nicht ladbar', 'neg'); return; }
  const zl = maske.zaehler || [];
  if (!zl.length) {
    melde('Für diese Immobilie sind noch keine Zähler angelegt.', '');
    return;
  }
  let idx = 0;
  const dlg = document.createElement('dialog');
  dlg.className = 'ablese-dlg';
  document.body.appendChild(dlg);
  dlg.addEventListener('close', () => { dlg.remove(); laden(); });

  async function speichereAktuell() {
    const feld = dlg.querySelector('#awStand');
    if (!feld) return;                                  // Rest-Zähler: nichts einzugeben
    const roh = feld.value.trim().replace(',', '.');
    if (roh === '') return;                             // leer gelassen → nicht speichern
    const stand = Number(roh);
    if (!Number.isFinite(stand)) return;
    const datum = dlg.querySelector('#awDatum').value || maske.zeitraum.ende;
    zl[idx].ablesung = { stand, datum };
    try {
      await api(`/zaehler/${zl[idx].id}/ablesungen`,
        { method: 'POST', body: { stand, datum, zeitraum_id: Number(zid) } });
    } catch (fehler) { melde(fehler.message || 'Speichern fehlgeschlagen', 'neg'); }
  }

  function gruppenNachKostenart() {
    const m = new Map();
    for (const z of zl) {
      if (!z.kostenart) continue;
      if (!m.has(z.kostenart)) m.set(z.kostenart, []);
      m.get(z.kostenart).push(z);
    }
    return [...m.entries()];
  }

  /* Letzter Schritt: je Kostenart die Partei-Aufteilung aus dem Verbrauch, dazu
     der Verteilungsschlüssel zur Wahl (Vorgabe: Verbrauch). „Übernehmen" setzt
     Schlüssel + Gewichte an der Position; der Betrag bleibt beim Beleg. */
  function renderZusammenfassung() {
    const opts = maske.schluessel_optionen || [];
    const bloecke = gruppenNachKostenart().map(([ka, zs]) => {
      const zeilen = zs.filter(z => z.einheit_bezug).map(z =>
        `<div class="aw-zeile"><span>${esc(z.einheit_bezug)}</span>
          <b>${z.verbrauch != null ? zahl(z.verbrauch) + ' ' + esc(z.messeinheit)
              : '—'}</b></div>`).join('');
      const sel = `<select class="aw-select" data-ka="${esc(ka)}">${opts.map(o =>
        `<option value="${o.wert}"${o.wert === 'verbrauch' ? ' selected' : ''}>${
          esc(o.titel)}</option>`).join('')}</select>`;
      return `<div class="aw-block">
        <div class="aw-bk">${esc(ka)}</div>
        ${zeilen || '<div class="aw-leer">Nur Gesamtzähler — keine Aufteilung.</div>'}
        <label class="aw-sk">Verteilungsschlüssel${sel}</label>
      </div>`;
    }).join('');
    dlg.innerHTML = `
      <div class="aw-kopf">
        <span class="t">Übernehmen · ${esc(maske.zeitraum.label)}</span>
        <button class="aw-x" data-schliessen aria-label="Schließen">×</button>
      </div>
      <div class="aw-bahn"><i style="width:100%"></i></div>
      <div class="aw-schritt">Verbrauch in die Abrechnung übernehmen</div>
      <div class="aw-body">${bloecke
        || '<div class="aw-vor">Keine Zähler mit Kostenart angelegt.</div>'}</div>
      <div class="aw-fuss">
        <button class="aw-zurueck" data-zurueck>‹ Zurück</button>
        <button class="aw-weiter" data-uebernehmen ${bloecke ? '' : 'disabled'}>Übernehmen</button>
      </div>`;
  }

  function render() {
    if (idx >= zl.length) { renderZusammenfassung(); return; }
    const z = zl[idx];
    const rest = z.typ === 'rest';
    const vor = z.vorwert
      ? `Vorstand: <strong>${zahl(z.vorwert.stand)} ${esc(z.messeinheit)}</strong>
         <span>(${new Date(z.vorwert.datum).toLocaleDateString('de-DE')})</span>`
      : 'Erste Ablesung — kein Vorstand. Das wird die Startablesung.';
    const chips = [z.kostenart, z.einheit_bezug || 'Haus / Gesamt',
                   rest ? 'berechneter Rest' : z.messeinheit]
      .filter(Boolean).map(c => `<span class="c">${esc(c)}</span>`).join('');
    dlg.innerHTML = `
      <div class="aw-kopf">
        <span class="t">Ablesewerte · ${esc(maske.zeitraum.label)}</span>
        <button class="aw-x" data-schliessen aria-label="Schließen">×</button>
      </div>
      <div class="aw-bahn"><i style="width:${Math.round((idx / zl.length) * 100)}%"></i></div>
      <div class="aw-schritt">Zähler ${idx + 1} von ${zl.length}</div>
      <div class="aw-body">
        <div class="aw-name">${esc(z.name)}</div>
        <div class="aw-chips">${chips}</div>
        <div class="aw-vor">${vor}</div>
        ${rest
          ? `<div class="aw-verb">Berechneter Rest-Zähler — kein Wert nötig. Er
             ergibt sich aus Gesamt minus die gemessenen Unterzähler.</div>`
          : `<div class="aw-feld">
              <label for="awStand">Aktueller Zählerstand (${esc(z.messeinheit)})</label>
              <input id="awStand" type="text" inputmode="decimal" placeholder="z. B. 234,8"
                     value="${z.ablesung ? zahl(z.ablesung.stand) : ''}">
             </div>
             <div class="aw-feld">
              <label for="awDatum">Abgelesen am</label>
              <input id="awDatum" type="date"
                     value="${z.ablesung ? z.ablesung.datum : maske.zeitraum.ende}">
             </div>`}
        ${z.verbrauch != null && !rest
          ? `<div class="aw-verb">Verbrauch im Zeitraum:
             ${zahl(z.verbrauch)} ${esc(z.messeinheit)}</div>` : ''}
      </div>
      <div class="aw-fuss">
        <button class="aw-zurueck" data-zurueck ${idx === 0 ? 'disabled' : ''}>‹ Zurück</button>
        <button class="aw-weiter" data-weiter>Weiter ›</button>
      </div>`;
    const feld = dlg.querySelector('#awStand');
    if (feld) feld.focus();
  }

  dlg.addEventListener('click', async e => {
    if (e.target.closest('[data-schliessen]')) { await speichereAktuell(); dlg.close(); return; }
    if (e.target.closest('[data-zurueck]')) {
      await speichereAktuell(); idx = Math.max(0, idx - 1); render(); return;
    }
    if (e.target.closest('[data-weiter]')) {
      await speichereAktuell(); idx += 1; render(); return;   // letzter → Zusammenfassung
    }
    const ueb = e.target.closest('[data-uebernehmen]');
    if (ueb) {
      const selects = [...dlg.querySelectorAll('.aw-select')];
      ueb.disabled = true; ueb.textContent = 'Übernehme …';
      try {
        let angewandt = 0;
        for (const s of selects) {
          const r = await api(`/zeitraeume/${zid}/ablesung/uebernehmen`,
            { method: 'POST', body: { kostenart: s.dataset.ka, schluessel: s.value } });
          if (r.angewandt) angewandt += 1;
        }
        const rest = selects.length - angewandt;
        melde(angewandt
          ? `Verbrauch übernommen für ${angewandt} Kostenart${angewandt === 1 ? '' : 'en'}`
            + (rest ? ` · ${rest} braucht${rest === 1 ? '' : 'en'} erst einen Beleg` : '')
          : 'Noch keine passende Position — erst die Belege/Beträge erfassen', angewandt ? 'pos' : '');
        dlg.close();
      } catch (fehler) {
        ueb.disabled = false; ueb.textContent = 'Übernehmen';
        melde(fehler.message || 'Übernehmen fehlgeschlagen', 'neg');
      }
    }
  });
  render();
  dlg.showModal();
}

/* ---- Zähler-Konfiguration (CCCLXXX) --------------------------------------
   Zahnrad neben „Ablesewerte eingeben": Zähler je Immobilie anlegen/entfernen/
   verschieben, Messeinheit·Bezug·Kostenart einstellen, die Verrechnung setzen
   (Rest = Hauptzähler − Unterzähler) und den Anfangsstand vor der ersten
   Abrechnung erfassen. Nutzt die vorhandenen Endpunkte; gespeichert wird
   sofort (PATCH/POST/DELETE). */
const MESSEINHEITEN = ['m³', 'kWh', 'Liter'];

/* Frühester Periodenbeginn (ISO) — dorthin gehört der Anfangsstand, damit er die
   erste Abrechnung öffnet. Labels der Objektseite: „dd.mm.yyyy – dd.mm.yyyy". */
function fruehesterStartISO(objektDaten) {
  const daten2 = (objektDaten?.zeitraeume || [])
    .map(z => (z.label || '').match(/(\d{2})\.(\d{2})\.(\d{4})/))
    .filter(Boolean).map(m => `${m[3]}-${m[2]}-${m[1]}`).sort();
  return daten2[0] || null;
}

async function zaehlerKonfig() {
  const slug = daten.objekt;
  let meters, objektDaten;
  try {
    [meters, objektDaten] = await Promise.all([
      api(`/objekte/${slug}/zaehler`), api(`/objekte/${slug}`)]);
  } catch (fehler) { melde(fehler.message || 'Zähler nicht ladbar', 'neg'); return; }

  const startISO = fruehesterStartISO(objektDaten) || daten.start;
  const kostenarten = [...new Set((daten.checkliste || []).map(k => k.kostenart))];
  const bezuege = [...new Set((schluessel?.parteien || []).map(p => p.partei))];

  const dlg = document.createElement('dialog');
  dlg.className = 'ablese-dlg';
  document.body.appendChild(dlg);
  dlg.addEventListener('close', () => { dlg.remove(); laden(); });

  async function neuLaden() {
    try { meters = await api(`/objekte/${slug}/zaehler`); } catch { /* Ansicht bleibt */ }
    render();
  }

  const opt = (wert, text, sel) =>
    `<option value="${esc(String(wert))}"${sel ? ' selected' : ''}>${esc(text)}</option>`;

  function karte(z, i) {
    const rest = z.typ === 'rest';
    const messSel = MESSEINHEITEN.map(m => opt(m, m, m === z.messeinheit)).join('')
      + (MESSEINHEITEN.includes(z.messeinheit) ? '' : opt(z.messeinheit, z.messeinheit, true));
    const bezugSel = opt('', 'Haus / Gesamt', !z.einheit_bezug)
      + bezuege.map(b => opt(b, b, b === z.einheit_bezug)).join('')
      + (z.einheit_bezug && !bezuege.includes(z.einheit_bezug)
         ? opt(z.einheit_bezug, z.einheit_bezug, true) : '');
    const kaSel = opt('', '— keine —', !z.kostenart)
      + kostenarten.map(k => opt(k, k, k === z.kostenart)).join('')
      + (z.kostenart && !kostenarten.includes(z.kostenart)
         ? opt(z.kostenart, z.kostenart, true) : '');
    const modus = rest ? 'rest' : (z.hauptzaehler_id ? 'unter' : 'frei');
    const verrSel = opt('frei', 'Eigenständig / Gesamt', modus === 'frei')
      + opt('unter', 'Unterzähler von …', modus === 'unter')
      + opt('rest', 'Rest von …', modus === 'rest');
    const andere = meters.filter(m => m.id !== z.id);
    const hauptSel = andere.length
      ? andere.map(m => opt(m.id, m.name, m.id === z.hauptzaehler_id)).join('')
      : opt('', 'kein anderer Zähler', true);
    let restInfo = '';
    if (rest && z.hauptzaehler_id) {
      const haupt = meters.find(m => m.id === z.hauptzaehler_id);
      const unter = meters.filter(m => m.typ === 'gemessen'
        && m.hauptzaehler_id === z.hauptzaehler_id);
      restInfo = `<div class="zk-rest">Rest = ${esc(haupt?.name || '?')}${
        unter.length ? unter.map(u => ` − ${esc(u.name)}`).join('')
                     : ' − (noch keine Unterzähler)'}</div>`;
    }
    const anf = z.anfangsstand;
    const anfBlock = rest ? '' : `<div class="zk-anfang">
        <div class="zk-feld"><label>Anfangsstand</label>
          <input type="number" step="0.001" inputmode="decimal" placeholder="—"
            value="${anf ? anf.stand : ''}" data-zk-anf-stand="${z.id}"
            aria-label="Anfangsstand ${esc(z.name)}"></div>
        <div class="zk-feld"><label>am</label>
          <input type="date" value="${anf ? anf.datum : startISO}"
            data-zk-anf-datum="${z.id}" aria-label="Datum Anfangsstand"></div>
      </div>`;

    return `<div class="zk-karte" data-zid="${z.id}">
      <div class="zk-kopf">
        <input class="zk-name" value="${esc(z.name)}" data-zk-f="name" data-zid="${z.id}"
          aria-label="Zählername">
        <div class="zk-tools">
          <button class="zk-ic" data-zk-up="${z.id}" ${i === 0 ? 'disabled' : ''}
            aria-label="nach oben">↑</button>
          <button class="zk-ic" data-zk-down="${z.id}"
            ${i === meters.length - 1 ? 'disabled' : ''} aria-label="nach unten">↓</button>
          <button class="zk-ic gefahr" data-zk-del="${z.id}"
            aria-label="Zähler entfernen">${MUELL_ICON}</button>
        </div>
      </div>
      <div class="zk-grid">
        <div class="zk-feld"><label>Einheit</label>
          <select data-zk-f="messeinheit" data-zid="${z.id}">${messSel}</select></div>
        <div class="zk-feld"><label>Bezug</label>
          <select data-zk-f="einheit_bezug" data-zid="${z.id}">${bezugSel}</select></div>
        <div class="zk-feld"><label>Kostenart</label>
          <select data-zk-f="kostenart" data-zid="${z.id}">${kaSel}</select></div>
        <div class="zk-feld"><label>Verrechnung</label>
          <select data-zk-verr="${z.id}">${verrSel}</select></div>
        ${modus !== 'frei' ? `<div class="zk-feld voll"><label>Hauptzähler</label>
          <select data-zk-f="hauptzaehler_id" data-zid="${z.id}">${hauptSel}</select></div>` : ''}
      </div>
      ${restInfo}
      ${anfBlock}
    </div>`;
  }

  function render() {
    const liste = meters.length
      ? meters.map((z, i) => karte(z, i)).join('')
      : `<div class="zk-leer">Noch keine Zähler für diese Immobilie. Lege den
          ersten an — Gesamtzähler, Unterzähler je Einheit und, wenn nötig, einen
          berechneten Rest.</div>`;
    dlg.innerHTML = `
      <div class="aw-kopf">
        <span class="t">Zähler · ${esc(daten.objekt_name)}</span>
        <button class="aw-x" data-zk-schliessen aria-label="Schließen">×</button>
      </div>
      <div class="aw-body zk-body">
        <p class="zk-intro">Zähler dieser Immobilie: Messeinheit, Bezug und
          Kostenart einstellen, die Verrechnung festlegen (Rest = Hauptzähler −
          Unterzähler) und den Anfangsstand vor der ersten Abrechnung setzen.</p>
        <div class="zk-liste">${liste}</div>
        <button class="zk-add" data-zk-add>＋ Zähler hinzufügen</button>
      </div>
      <div class="aw-fuss">
        <button class="aw-weiter" data-zk-schliessen style="flex:1">Fertig</button>
      </div>`;
  }

  dlg.addEventListener('change', async e => {
    const f = e.target.closest('[data-zk-f]');
    if (f) {
      const id = f.dataset.zid;
      let wert = f.value;
      if (f.dataset.zkF === 'hauptzaehler_id') wert = wert ? Number(wert) : null;
      const z = meters.find(m => String(m.id) === String(id));
      if (z) z[f.dataset.zkF] = wert;               // lokal nachziehen
      try { await api(`/zaehler/${id}`, { method: 'PATCH', body: { [f.dataset.zkF]: wert } }); }
      catch (fehler) { melde(fehler.message || 'Speichern fehlgeschlagen', 'neg'); }
      return;
    }
    const verr = e.target.closest('[data-zk-verr]');
    if (verr) return verrechnungSetzen(Number(verr.dataset.zkVerr), verr.value);
    const anf = e.target.closest('[data-zk-anf-stand],[data-zk-anf-datum]');
    if (anf) return anfangsstandSpeichern(
      Number(anf.dataset.zkAnfStand || anf.dataset.zkAnfDatum));
  });

  async function verrechnungSetzen(id, modus) {
    const z = meters.find(m => m.id === id);
    const andere = meters.filter(m => m.id !== id);
    const haupt = z?.hauptzaehler_id || (andere[0] && andere[0].id) || null;
    const body = modus === 'frei'
      ? { typ: 'gemessen', hauptzaehler_id: null }
      : { typ: modus === 'rest' ? 'rest' : 'gemessen', hauptzaehler_id: haupt };
    try { await api(`/zaehler/${id}`, { method: 'PATCH', body }); await neuLaden(); }
    catch (fehler) { melde(fehler.message || 'Speichern fehlgeschlagen', 'neg'); }
  }

  async function anfangsstandSpeichern(id) {
    const s = dlg.querySelector(`[data-zk-anf-stand="${id}"]`);
    const d = dlg.querySelector(`[data-zk-anf-datum="${id}"]`);
    const roh = (s?.value || '').trim().replace(',', '.');
    if (roh === '') return;                          // leer → nichts speichern
    const stand = Number(roh);
    if (!Number.isFinite(stand)) return;
    const datum = d?.value || startISO;
    try {
      await api(`/zaehler/${id}/ablesungen`,
        { method: 'POST', body: { stand, datum, notiz: 'Anfangsstand' } });
      const z = meters.find(m => m.id === id);
      if (z) z.anfangsstand = { stand, datum };
      melde('✓ Anfangsstand gespeichert', 'pos');
    } catch (fehler) { melde(fehler.message || 'Speichern fehlgeschlagen', 'neg'); }
  }

  dlg.addEventListener('click', async e => {
    if (e.target.closest('[data-zk-schliessen]')) { dlg.close(); return; }
    if (e.target.closest('[data-zk-add]')) {
      try {
        await api(`/objekte/${slug}/zaehler`, { method: 'POST',
          body: { name: 'Neuer Zähler', messeinheit: 'm³', reihenfolge: meters.length } });
        await neuLaden();
      } catch (fehler) { melde(fehler.message || 'Anlegen fehlgeschlagen', 'neg'); }
      return;
    }
    const del = e.target.closest('[data-zk-del]');
    if (del) {
      const z = meters.find(m => m.id === Number(del.dataset.zkDel));
      const ja = await frage(`„${z?.name || 'Zähler'}" entfernen?`,
        'Der Zähler und seine Ablesungen werden gelöscht. Kostenpositionen und '
        + 'Belege bleiben unangetastet.', { knopf: 'Entfernen', gefahr: true });
      if (!ja) return;
      try { await api(`/zaehler/${del.dataset.zkDel}`, { method: 'DELETE' }); await neuLaden(); }
      catch (fehler) { melde(fehler.message || 'Löschen fehlgeschlagen', 'neg'); }
      return;
    }
    const bewegung = e.target.closest('[data-zk-up],[data-zk-down]');
    if (bewegung) return verschieben(
      Number(bewegung.dataset.zkUp || bewegung.dataset.zkDown),
      bewegung.dataset.zkUp ? -1 : 1);
  });

  async function verschieben(id, richtung) {
    const i = meters.findIndex(m => m.id === id);
    const j = i + richtung;
    if (i < 0 || j < 0 || j >= meters.length) return;
    const neu = [...meters];
    [neu[i], neu[j]] = [neu[j], neu[i]];
    meters = neu;
    render();                                        // sofort sichtbar
    try {
      await Promise.all(neu.map((m, k) => m.reihenfolge === k ? null
        : api(`/zaehler/${m.id}`, { method: 'PATCH', body: { reihenfolge: k } })));
      neu.forEach((m, k) => { m.reihenfolge = k; });
    } catch (fehler) { melde(fehler.message || 'Speichern fehlgeschlagen', 'neg'); }
  }

  render();
  dlg.showModal();
}

await laden();
</script>
</body>
</html>
