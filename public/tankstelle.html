<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>E-Tankstelle · ImmoCalc</title>
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F6E5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ImmoCalc">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/immo.css">
<style>
  /* ------------------------------------------------------------------
     Nur tankstelle.html (N132). immo.css wird nicht angefasst; was sich
     spaeter als seitenuebergreifend erweist, wandert dann dorthin.
     ------------------------------------------------------------------ */
  .filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;
          align-items:center}
  .filter > div{flex:1 1 130px;min-width:0}

  .karte{background:var(--sheet);border-radius:16px;padding:16px;
         margin-bottom:14px;box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .karte h3{font:600 13px var(--disp);letter-spacing:-.01em;margin:0;
            color:var(--ink)}
  .karte .hh{display:flex;align-items:baseline;justify-content:space-between;
             gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .karte .hint{display:block;font:400 12px var(--body);color:var(--soft);
               line-height:1.55;margin:0 0 16px;max-width:620px}

  /* ---- Kennzahlen ------------------------------------------------------ */
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));
       gap:10px}
  .kpi .k{background:var(--paper);border-radius:14px;padding:12px 13px;
          min-width:0}
  .kpi .kl{display:block;font:600 9px var(--mono);letter-spacing:.07em;
           text-transform:uppercase;color:var(--soft)}
  .kpi .kv{display:block;font:700 16px var(--disp);letter-spacing:-.02em;
           margin-top:6px;color:var(--ink)}
  /* N180 — die vier Verlauf-Kennzahlen (Geladen · Netz · Eigen · Ladungen)
     stehen immer in EINER Reihe, auch auf dem iPhone: vier gleich breite
     Spalten, auf schmalen Schirmen mit knapperem Innenabstand und kleinerer
     Schrift, damit nichts ueberlaeuft. Die zweispaltige Abrechnungs-KPI bleibt
     unberuehrt (nur `.kpi`, ohne `.vier`). */
  .kpi.vier{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .kpi.vier .k{padding:11px 9px}
  @media(max-width:479px){
    .kpi.vier{gap:6px}
    .kpi.vier .k{padding:9px 6px}
    .kpi.vier .kl{font-size:8px;letter-spacing:.02em}
    .kpi.vier .kv{font-size:12.5px;margin-top:3px}
  }
  .kpi .kv.teal{color:var(--teal-d)}
  .kpi .kv.amber{color:var(--amber)}

  /* ---- Nutzerliste ----------------------------------------------------- */
  .nliste{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .nz{display:flex;align-items:center;gap:12px;background:var(--paper);
      border-radius:14px;padding:10px 10px 10px 14px;min-height:44px}
  .nz .nk{width:34px;height:34px;border-radius:11px;background:var(--teal-l);
          color:var(--teal-d);flex:none;display:flex;align-items:center;
          justify-content:center;font:600 14px var(--disp)}
  .nz .nt{flex:1;min-width:0}
  .nz .nn{display:block;font:600 13.5px var(--disp);letter-spacing:-.01em;
          color:var(--ink);overflow-wrap:anywhere}
  .nz .nm{display:block;font:400 11.5px var(--body);color:var(--soft);
          margin-top:2px;overflow-wrap:anywhere}
  .nz .nx{flex:none;width:44px;height:44px;border:none;background:none;
          color:var(--soft);font:400 20px var(--body);border-radius:12px;
          cursor:pointer}
  .nz .nx:hover{background:var(--neg-bg);color:var(--neg)}

  /* Anlegen: auf dem iPhone untereinander, ab iPad nebeneinander. `auto-fit`
     statt fester Spalten — die Masken haben zwei bzw. drei Felder, und eine
     feste Spaltenzahl liesse den Knopf in der zweiten Reihe allein stehen. */
  .neu{display:grid;grid-template-columns:1fr;gap:10px;background:var(--paper);
       border-radius:14px;padding:14px}
  .neu .field{margin:0}
  .neu .fl{display:block;font:600 10.5px var(--mono);letter-spacing:.06em;
           text-transform:uppercase;color:var(--soft);margin-bottom:7px}
  @media(min-width:520px){
    .neu{grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
         align-items:end}
  }

  /* ---- Verlauf: Grafik, Legende, Tabelle -------------------------------
     Der Verlauf geht ueber alle Monate, nicht ueber ein Jahr. Damit ein
     Balken nicht zum Strich schrumpft, bekommt jeder Monat eine feste
     Breite; wird die Grafik dadurch breiter als die Karte, scrollt sie in
     ihrem eigenen Rahmen. Die Seite selbst scrollt nie waagerecht. */
  .chartrahmen{overflow-x:auto;-webkit-overflow-scrolling:touch;
               margin:4px 0 12px}
  .chart{display:block;margin:0 auto}
  .legende{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 16px;
           font:500 11.5px var(--body);color:var(--soft)}
  .legende .le{display:inline-flex;align-items:center;gap:7px}
  .legende i{width:11px;height:11px;border-radius:4px;flex:none}
  /* Ruhiger Vermerk an der Zahl — kein Warnbalken. */
  .vermerk{display:block;font:400 11.5px var(--body);color:var(--soft);
           line-height:1.55;margin:0 0 16px}
  /* Die automatische Zuordnung ist eine Erleichterung, keine Störung — ein
     ruhiger Teal-Hinweis statt des amberfarbenen Warnbalkens. */
  .notiz.auto{background:var(--teal-l);color:var(--teal-d)}
  /* Inline-Bearbeitung der Stammdaten unter der Nutzerzeile. */
  .nedit:empty{display:none}
  .nedit-form{margin:2px 0 10px}

  /* „＋" oben rechts an der Nutzerüberschrift — derselbe ruhige Teal-Chip wie
     das Nutzerkürzel, 34 px sichtbar, 44 px tippbar (iOS) über ::after. */
  .karte .hh .plus{flex:none;border:none;background:var(--teal-l);
    color:var(--teal-d);width:34px;height:34px;border-radius:11px;cursor:pointer;
    font:600 21px var(--body);line-height:1;display:inline-flex;
    align-items:center;justify-content:center;position:relative}
  .karte .hh .plus::after{content:"";position:absolute;inset:-5px}
  .karte .hh .plus:hover{background:var(--teal);color:#fff}

  /* Bearbeiten/Anlegen als aufgeräumtes Raster: zwei Spalten auf breiten
     Geräten, eine auf dem iPhone. E-Mail, IBAN und Anschrift bekommen die volle
     Breite (`.span`) — sonst würde die Adresse abgeschnitten. */
  .efgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px 12px;
          background:var(--paper);border-radius:14px;padding:14px;margin:2px 0 10px}
  .efgrid .field{margin:0;min-width:0}
  .efgrid .field.span{grid-column:1/-1}
  .efgrid .fl{display:block;font:600 10.5px var(--mono);letter-spacing:.06em;
              text-transform:uppercase;color:var(--soft);margin-bottom:7px}
  .efgrid .inp{width:100%}
  @media(max-width:479px){ .efgrid{grid-template-columns:1fr} }
  /* Das Verbrauchsfeld trägt seinen KI-Knopf gleich rechts daneben — die
     Ermittlung sitzt am Feld, nicht als zweiter großer Knopf neben „Speichern". */
  .verbrauchzeile{display:flex;gap:8px;align-items:stretch}
  .verbrauchzeile .inp{flex:1;min-width:0}
  .btn-ki{flex:none;border:none;background:var(--teal-l);color:var(--teal-d);
          font:600 11px var(--mono);letter-spacing:.02em;cursor:pointer;
          border-radius:10px;padding:0 14px;min-height:44px;white-space:nowrap}
  .btn-ki:hover{background:var(--teal);color:#fff}
  .btn-ki:disabled{opacity:.55;cursor:default}
  .ef-save{display:flex;justify-content:flex-end}
  .ef-save .btn{width:auto;min-width:150px}

  .tabrahmen{overflow-x:auto;-webkit-overflow-scrolling:touch;
             border-radius:12px;background:var(--paper)}
  .mt{border-collapse:collapse;width:100%;min-width:322px}
  /* N188 — die Kosten-Spalte trägt die Heatmap (amber je nach gefahrener Menge)
     und den Betrag etwas kräftiger; die Tönung sitzt als Inline-Style dahinter. */
  .mt td.kbtr{font-weight:700;color:var(--ink)}
  .mt tfoot td.kbtr{color:var(--teal-d)}
  .mt th{font:600 9px var(--mono);letter-spacing:.06em;text-transform:uppercase;
         color:var(--soft);text-align:right;padding:11px 8px 8px;
         white-space:nowrap}
  .mt th:first-child{text-align:left;padding-left:14px}
  .mt th:last-child{padding-right:14px}
  .mt td{font:500 12px var(--mono);color:var(--ink);text-align:right;
         padding:9px 8px;white-space:nowrap;
         border-top:1px solid rgba(22,38,44,.07)}
  .mt td:first-child{text-align:left;padding-left:14px;font:600 12.5px var(--disp);
                     letter-spacing:-.01em}
  .mt td:last-child{padding-right:14px}
  .mt td.leise{color:var(--soft)}
  .mt td .pz{display:block;font:400 9.5px var(--mono);color:var(--soft);
             margin-top:2px}
  .mt tfoot td{font-weight:700;border-top:1.5px solid var(--line)}
  /* Sieben Spalten (Monat · Geladen · Netz · PV · Akku · Reichw. · Kosten, N188)
     passen auf dem iPhone nur mit knapperen Zellenabstaenden; darüber hinaus
     scrollt der Rahmen (`.tabrahmen{overflow-x:auto}`) waagerecht in sich. */
  @media(max-width:479px){
    .mt th,.mt td{padding-left:5px;padding-right:5px}
    .mt th:first-child,.mt td:first-child{padding-left:11px}
    .mt th:last-child,.mt td:last-child{padding-right:11px}
  }
  /* N178 — durch die Monatstabelle blaettern: nur ~10 Zeilen je Seite, die
     neuesten voran (die Grafik oben bleibt der Gesamtueberblick). Die
     Summe steht als tfoot immer darunter, unabhaengig von der Seite. */
  .tabpager{display:flex;align-items:center;justify-content:center;gap:12px;
            margin:0 0 8px}
  .tabpager .tp{min-width:44px;min-height:44px;border:none;cursor:pointer;
                border-radius:12px;background:var(--paper);color:var(--teal-d);
                font:600 16px var(--body);line-height:1;display:inline-flex;
                align-items:center;justify-content:center}
  .tabpager .tp:hover:not(:disabled){background:var(--teal-l)}
  .tabpager .tp:disabled{color:var(--soft);opacity:.45;cursor:default}
  .tabpager .tpz{font:600 11px var(--mono);letter-spacing:.03em;
                 color:var(--soft);min-width:82px;text-align:center}

  /* ---- Abrechnung (N193) ----------------------------------------------- */
  /* Kopfzeile: „E-Tankstelle Abrechnung" + ein Info-i, rechts der kompakte
     Automatik-Schalter. Auf schmalen Breiten bricht der Schalter um. */
  .abkopf{display:flex;align-items:center;justify-content:space-between;gap:12px;
          flex-wrap:wrap;margin:0 0 14px}
  .abkopf-t{display:flex;align-items:center;gap:5px;min-width:0}
  .abkopf-t h3{font:600 13px var(--disp);letter-spacing:-.01em;margin:0}
  /* Auswahl (Matrix) + Ø-Satz nebeneinander auf dem Desktop, den freien Platz
     rechts nutzend; auf dem iPhone gestapelt (Matrix zuerst). */
  /* N220 — ohne Rand hing die Matrix-Box direkt an der ersten Nutzerkarte. */
  .absel{display:grid;gap:14px;margin-bottom:14px}
  @media(min-width:720px){
    .absel{grid-template-columns:1fr minmax(214px,262px);align-items:start}
    .absel .satz{order:1;margin:0}.absel .filter-matrix{order:2}
  }
  /* Der Chooser: Jahr-Pills, darunter eine Quartal×Monat-Matrix (4 Spalten
     Q1–Q4, 3 Monatszeilen), darunter die klare Aktion. Statt drei gestapelter
     Bubble-Reihen ein kompakter Block, der die Breite füllt. */
  /* N202 — gleicher Innenabstand wie der Satz-Block (14px) und kompakter, damit
     die Matrix auf die Höhe des linken Blocks kommt.
     N220 — der „ganzes Jahr"-Knopf ist weg (Q1–Q4 zusammen klicken deckt
     denselben Fall ab), die Jahre-Zeile darum enger gefasst. */
  .filter-matrix{background:var(--paper);border-radius:14px;padding:14px}
  .fm-jahre{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 6px}
  .fm-jahre button{min-height:32px;padding:6px 13px;border:none;cursor:pointer;
                   border-radius:999px;background:var(--sheet);color:var(--soft);
                   font:700 11.5px var(--mono);letter-spacing:.03em}
  .fm-jahre button[aria-pressed="true"]{background:var(--teal-l);color:var(--teal-d)}
  .fm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  .fm-grid button{border:none;cursor:pointer;border-radius:10px;
                  display:inline-flex;align-items:center;justify-content:center;
                  gap:3px;font:600 11px var(--mono)}
  .fm-q{min-height:24px;background:transparent;color:var(--soft);font-weight:700;
        text-transform:uppercase;letter-spacing:.05em;font-size:10px}
  .fm-q.an{color:var(--teal-d)}
  .fm-m{min-height:38px;background:var(--sheet);color:var(--soft)}
  .fm-m.an{background:var(--teal-l);color:var(--teal-d)}
  .fm-grid .hk{font-size:9px;color:var(--pos)}
  .fm-q.fertig .hk{color:var(--teal-d)}
  .fm-m.fertig{color:var(--teal-d)}.fm-m.fertig .hk{color:var(--teal-d)}
  /* N214 — noch nicht abgeschlossene Monate: sichtbar dezent + nicht klickbar. */
  .fm-m.offen{opacity:.42;cursor:not-allowed}
  .fm-m.offen:hover{background:var(--sheet)}
  .fm-abbtn{margin-top:6px;width:100%;min-height:40px;border:none;cursor:pointer;
            border-radius:999px;background:var(--sheet);color:var(--teal-d);
            font:600 11.5px var(--mono);letter-spacing:.03em}
  .fm-abbtn.an{background:var(--teal);color:#fff}
  .fm-abbtn:hover:not(.an){background:var(--teal-l)}

  /* Die eingebettete PDF-Vorschau (N169/N178) — sie zeigt genau das Blatt, das
     als Anhang ausginge, und laedt sich bei jeder Auswahländerung neu. Ein
     gerahmter Block: oben der Mail-Kopf mit einem klaren ×, darunter das Blatt.
     Kein „neuer Tab" mehr (N178) — die Vorschau bleibt auf der Seite. */
  .vorschau{margin-top:12px;background:var(--paper);border-radius:14px;
            padding:10px;display:flex;flex-direction:column;gap:10px}
  .vorschau-kopf{display:flex;align-items:center;gap:10px}
  .vorschau-kopf .mailkopf{flex:1;min-width:0;margin:0;overflow-wrap:anywhere}
  .vorschau-x{flex:none;width:36px;height:36px;border:none;background:var(--sheet);
              color:var(--soft);font:400 22px var(--body);line-height:1;
              border-radius:11px;cursor:pointer;display:inline-flex;
              align-items:center;justify-content:center;position:relative}
  .vorschau-x::after{content:"";position:absolute;inset:-4px}
  .vorschau-x:hover{background:var(--neg-bg);color:var(--neg)}
  .vorschau .mailtext{margin:0}
  /* N179 — die Vorschau als responsiver HTML-Nachbau der PDF-Abrechnung statt
     eines eingebetteten A4-PDFs. Das native iframe-PDF skaliert auf iOS/Safari
     nicht auf die Rahmenbreite: es blieb waagerecht scrollbar und rechts
     abgeschnitten. Der HTML-Nachbau nimmt dieselben Daten (aus der Abrechnung),
     passt sich jeder Breite an und scrollt nie seitwaerts. Das vollstaendige
     PDF bleibt fuer Download und Versand. */
  .blatt{background:var(--sheet);border-radius:12px;padding:16px 16px 14px;
         display:flex;flex-direction:column;gap:14px}
  .bl-kopf{display:flex;flex-direction:column;gap:3px}
  .bl-titel{font:700 17px var(--disp);letter-spacing:-.02em;color:var(--ink)}
  .bl-meta{font:400 11.5px var(--body);color:var(--soft);overflow-wrap:anywhere}
  .bl-empf{display:flex;flex-direction:column;gap:2px}
  .bl-name{font:600 14px var(--disp);letter-spacing:-.01em;color:var(--ink);
           overflow-wrap:anywhere}
  .bl-mail{font:400 11.5px var(--mono);color:var(--soft);overflow-wrap:anywhere}
  .bl-satz{background:var(--paper);border-radius:12px;padding:12px 14px;
           display:flex;flex-direction:column;gap:7px}
  .bl-sw{font:700 19px var(--disp);letter-spacing:-.02em;color:var(--teal-d)}
  .bl-sd{font:400 12px var(--body);color:var(--ink);line-height:1.55;
         overflow-wrap:anywhere}
  .bl-sq{font:400 10.5px var(--mono);color:var(--soft);line-height:1.6;
         overflow-wrap:anywhere}
  .bl-betrag{background:var(--teal-l);border-radius:12px;padding:14px 16px;
             display:flex;align-items:center;justify-content:space-between;
             gap:12px;flex-wrap:wrap}
  .bl-bl{display:flex;flex-direction:column;gap:3px;min-width:0}
  .bl-bk{font:600 12px var(--disp);color:var(--ink)}
  .bl-bkwh{font:400 11px var(--mono);color:var(--soft)}
  .bl-bb{font:700 24px var(--disp);letter-spacing:-.02em;color:var(--teal-d);
         white-space:nowrap}
  .bl-hint{font:400 11px var(--body);color:var(--soft);line-height:1.55}
  .bl-hint a{color:var(--teal-d);font-weight:600}
  /* N184b — die Empfänger-Anschrift unter dem Namen, wie im PDF. */
  .bl-adr{font:400 11.5px var(--body);color:var(--ink);overflow-wrap:anywhere}
  /* N184b — die ausgewiesene Ersparnis des Benzin-Kostenvergleichs: grün
     hervorgehoben wie im PDF (--pos), ruhig, aber deutlich. */
  .bl-spar{font:600 12.5px var(--body);color:var(--pos);line-height:1.5;
           overflow-wrap:anywhere}
  /* N184b — der Konto-Block: die Bankverbindung auf ruhigem Paper-Grund. */
  .bl-konto{background:var(--paper);border-radius:12px;padding:12px 14px}
  .bl-konto .bl-sd{font-family:var(--mono);font-size:11.5px}
  /* N184 — die Vorschau zeigt jetzt die VOLLSTÄNDIGE Abrechnung inline: dieselben
     Blöcke wie das PDF (Diagramm, Monatstabelle mit Kosten, E-Auto, Satz, Betrag).
     Jeder Abschnitt ein ruhiger Titel, darunter sein Inhalt. */
  .bl-block{display:flex;flex-direction:column;gap:9px}
  .bl-abschnitt{font:700 12.5px var(--disp);letter-spacing:-.01em;color:var(--ink)}
  /* N194 — die Fakten-Bubbles unter dem Satz: Menge Netz/Eigen, Ersparnis,
     Ø/Monat mit Trend. Ein responsives Raster, das die Zahlen grafisch fasst. */
  .bl-fakten{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
             gap:8px}
  .bl-fakt{background:var(--paper);border-radius:12px;padding:11px 13px;
           display:flex;flex-direction:column;gap:3px}
  .bl-fl{font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;
         color:var(--soft)}
  .bl-fv{font:700 15px var(--disp);letter-spacing:-.01em;color:var(--teal-d)}
  .bl-trend{font:600 10px var(--mono);letter-spacing:.02em;color:var(--soft)}
  .bl-trend.pos{color:var(--pos)}.bl-trend.neg{color:var(--neg)}
  /* Die Monatstabelle im Blatt: derselbe .mt-Stil wie der Verlauf, nur ohne
     Pager. Fünf Spalten scrollen auf dem iPhone in ihrem eigenen Rahmen — die
     Seite selbst nie waagerecht. */
  .blatt .tabrahmen{background:var(--paper)}
  .bl-mt{min-width:288px}

  /* N148/N186 — der abgeleitete Satz: die Hero-Zahl gross, daneben ein i mit
     Mischregel und Herkunft (dynamisch, kein Dauertext). Darunter zwei Chips
     fuer Netz- und Eigen-Satz — grafisch statt Fliesstext. Kein Eingabefeld. */
  .satz{background:var(--paper);border-radius:14px;padding:14px;
        margin:0 0 14px}
  .satz-hero{display:flex;align-items:center;gap:2px}
  .satz .sw{font:700 22px var(--disp);letter-spacing:-.02em;color:var(--teal-d)}
  .satz-hero .tinfo{color:var(--soft);margin:-13px -8px -13px -4px}
  /* N195 — je Quelle eine Karte: Menge des Zeitraums × Satz = Betrag. Füllt den
     linken Block und zeigt, woraus sich der Mischsatz zusammensetzt. */
  .satz-teile{display:grid;gap:9px;margin-top:14px}
  .satz-teil{background:var(--sheet);border-radius:12px;padding:11px 13px;
             position:relative;padding-left:26px}
  .satz-teil i{position:absolute;left:13px;top:15px;width:8px;height:8px;
               border-radius:3px}
  .satz-teil.netz i{background:var(--amber)}
  .satz-teil.eigen i{background:var(--teal)}
  .st-kopf{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .st-l{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;
        color:var(--soft)}
  .st-s{font:600 10.5px var(--mono);color:var(--soft);white-space:nowrap}
  .st-rechnung{display:flex;align-items:baseline;gap:8px;margin-top:5px}
  .st-m{font:600 13px var(--mono);color:var(--ink);white-space:nowrap}
  .st-eq{color:var(--soft);font-size:13px}
  .st-v{font:700 15px var(--disp);letter-spacing:-.01em;color:var(--teal-d);
        margin-left:auto;white-space:nowrap}
  /* N187 — der Zeitraum, für den der Ø-Satz gilt: als ruhige Fußzeile im
     Satz-Feld (bzw. solo, wenn noch kein Satz feststeht). */
  .satz-zr{display:block;font:500 11px var(--mono);color:var(--soft);
           letter-spacing:.02em}
  .satz .satz-zr{margin-top:12px}
  .satz-zr.solo{margin:0 0 14px}

  .az{background:var(--paper);border-radius:14px;padding:14px;
      margin-bottom:10px}
  .az .ak{display:flex;align-items:baseline;justify-content:space-between;
          gap:10px;flex-wrap:wrap}
  .az .an{font:600 14px var(--disp);letter-spacing:-.01em;color:var(--ink);
          overflow-wrap:anywhere}
  .az .ab{font:700 17px var(--disp);letter-spacing:-.02em;color:var(--teal-d)}
  .az .ad{display:block;font:400 11.5px var(--body);color:var(--soft);
          margin-top:6px;line-height:1.5;overflow-wrap:anywhere}
  /* N170/N186 — die E-Auto-Kennzahlen als grafische Stat-Chips: km, Preis/100 km,
     Benzin-Aequivalent. Die Annahme steckt im i daneben (N186), nicht mehr als
     Dauertext. Ruhiger Teal-Ton, hebt sie von der grauen Detailzeile ab. */
  .az .eco{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:10px}
  .az .eco .ecar{font-size:15px;line-height:1;flex:none}
  .az .ecochip{display:inline-flex;align-items:baseline;gap:5px;
               background:var(--teal-l);border-radius:10px;padding:6px 10px;
               min-width:0}
  .az .ecochip .ev{font:700 12.5px var(--disp);letter-spacing:-.01em;
                   color:var(--teal-d);white-space:nowrap}
  .az .ecochip .eu{font:500 10px var(--mono);letter-spacing:.02em;
                   color:var(--teal-d);opacity:.72;white-space:nowrap}
  .az .eco .tinfo{color:var(--teal-d);margin:-11px -7px}
  /* Vorschau und Versand stehen nebeneinander — zwei volle Balken
     untereinander wirkten wie zwei Hauptwege, dabei ist einer der Vorlauf
     des anderen. */
  /* N202 — die Aktionszeile mit Doppelstrich abgesetzt (finale Abrechnung), der
     Sende-Button trägt Zeitraum + Betrag; kein Leerraum mehr rechts. */
  .az .aw{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:13px;
          border-top:3px double var(--line)}
  .az .aw .btn{flex:1 1 132px;width:auto;min-height:48px;padding:9px 14px;
               font-size:14px}
  .az .aw .btn.leise{flex:0 1 auto}
  .az .aw .btn-send,.az .aw .btn.gesperrt{flex:1 1 200px;display:flex;
      flex-direction:column;align-items:center;justify-content:center;gap:1px;
      line-height:1.15}
  .az .aw .bs-t{font:600 11px var(--mono);letter-spacing:.02em;opacity:.9}
  .az .aw .bs-e{font:800 15px var(--disp);letter-spacing:-.02em}
  .az .fehlt{margin-top:10px}

  /* ---- Autoversand-Schalter (N165/2, kompakt seit N187) ---------------- */
  /* Ein schlanker Schalter ganz oben, ohne Kasten — „Automatik" plus das i
     direkt dahinter. Kein breiter Balken mehr, der wie eine eigene Karte wirkt. */
  .switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;
          min-height:44px}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .sw-track{flex:none;width:42px;height:25px;border-radius:999px;
                    background:var(--line);position:relative;transition:background .15s}
  .switch .sw-track::after{content:"";position:absolute;top:3px;left:3px;width:19px;
                           height:19px;border-radius:50%;background:#fff;
                           transition:transform .15s;
                           box-shadow:0 1px 2px rgba(22,38,44,.25)}
  .switch input:checked + .sw-track{background:var(--teal)}
  .switch input:checked + .sw-track::after{transform:translateX(17px)}
  .switch input:focus-visible + .sw-track{outline:2px solid var(--teal-d);
                                          outline-offset:2px}
  .switch .sw-label{font:600 13px var(--disp);color:var(--ink)}

  /* ---- Mehrnutzer-Zuordnung nach Zeitraum (N165/2) --------------------- */
  .zregel{background:var(--paper);border-radius:14px;padding:12px 14px;
          margin-bottom:8px}
  .zregel .zn{display:block;font:600 13px var(--disp);color:var(--ink);
              margin-bottom:9px;overflow-wrap:anywhere}
  /* Zwei Datumsfelder nebeneinander — auf dem iPhone aber untereinander, sonst
     schneidet das native Datumsfeld die Jahreszahl ab. */
  .zregel .zf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:479px){ .zregel .zf{grid-template-columns:1fr} }
  .zregel .zf .field{min-width:0;margin:0}
  .zregel .zf .fl{display:block;font:600 10px var(--mono);letter-spacing:.05em;
                  text-transform:uppercase;color:var(--soft);margin-bottom:5px}
  .lz .lex{flex:none;border:none;background:var(--sheet);color:var(--soft);
           font:600 10.5px var(--mono);letter-spacing:.03em;cursor:pointer;
           min-height:36px;padding:0 11px;border-radius:10px;white-space:nowrap}
  .lz .lex:hover{background:var(--teal-l);color:var(--teal-d)}
  .lz.aus{opacity:.55}
  .lz.aus .ld{text-decoration:line-through}
  .lz.aus .lex{background:var(--teal-l);color:var(--teal-d)}

  .mailtext{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sheet);
            border-radius:12px;padding:14px;margin:12px 0 0;
            font:400 11.5px var(--mono);color:var(--ink);line-height:1.65}
  .mailkopf{display:block;font:600 9px var(--mono);letter-spacing:.07em;
            text-transform:uppercase;color:var(--soft);margin:12px 0 0}

  /* ---- Ladungen -------------------------------------------------------- */
  .lliste{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .lz{display:flex;align-items:center;gap:10px;background:var(--paper);
      border-radius:12px;padding:8px 8px 8px 14px;min-height:44px;
      font:500 12.5px var(--body);color:var(--ink)}
  .lz .ld{flex:1;min-width:0;overflow-wrap:anywhere}
  .lz .ldt{display:block;font:400 11px var(--mono);color:var(--soft);
           margin-top:2px}
  .lz .lk{font:600 12px var(--mono);color:var(--soft);white-space:nowrap}
  .lz .lx{flex:none;width:40px;height:40px;border:none;background:none;
          color:var(--soft);font:400 19px var(--body);border-radius:11px;
          cursor:pointer}
  .lz .lx:hover{background:var(--neg-bg);color:var(--neg)}

  /* ---- Hinweise und Leerzustände --------------------------------------- */
  .notiz{display:flex;gap:10px;align-items:flex-start;background:var(--amber-bg);
         color:var(--amber);border-radius:12px;padding:12px 14px;
         margin:0 0 16px;font:500 12px var(--body);line-height:1.55}
  .notiz .wi{font-size:15px;line-height:1.3;flex:none}
  .leer{background:var(--paper);border-radius:14px;padding:20px 16px;
        text-align:center;font:400 12.5px var(--body);color:var(--soft);
        line-height:1.6;margin:0 0 4px}
  .leer b{display:block;font:600 14px var(--disp);color:var(--ink);
          margin-bottom:6px;letter-spacing:-.01em}

  /* ---- N181: Erklärtexte in Info-Popups -------------------------------
     Statt einer Textwand am Kartenanfang steht ein kleines i hinter dem Titel.
     Dieselbe Mechanik wie die Lexikon-Hilfe (immo.js, nur lesen): eine Karte
     unter dem Icon auf dem Desktop, ein Blatt von unten auf dem iPhone,
     Escape/Klick daneben schließt. Kein neuer Text — nur ein anderer Ort. */
  .titelinfo{display:flex;align-items:center;gap:1px;min-width:0}
  .tinfo{display:inline-flex;align-items:center;justify-content:center;
         width:44px;height:44px;margin:-13px -10px -13px -4px;padding:0;border:none;
         background:none;color:var(--soft);cursor:pointer;border-radius:50%;
         flex:none;-webkit-tap-highlight-color:transparent}
  .tinfo svg{width:17px;height:17px;display:block}
  .tinfo:hover{color:var(--teal-d)}
  .tinfo:focus-visible{outline:2px solid var(--teal-d);outline-offset:2px}
  .tinfo-overlay{position:fixed;inset:0;z-index:1200;background:transparent}
  .tinfo-card{position:fixed;z-index:1201;background:var(--sheet);
              border-radius:14px;box-shadow:0 22px 55px -14px rgba(22,38,44,.45);
              padding:16px 18px;width:320px;max-width:calc(100vw - 24px);
              color:var(--ink)}
  .tinfo-titel{font:700 15px var(--disp);letter-spacing:-.01em;margin-bottom:7px}
  .tinfo-text{font:400 13px/1.6 var(--body);color:var(--ink);margin:0 0 13px;
              white-space:pre-line}
  .tinfo-ok{min-height:40px;padding:0 16px;border:none;border-radius:10px;
            background:var(--teal-l);color:var(--teal-d);cursor:pointer;
            font:600 12.5px var(--disp)}
  .tinfo-ok:hover{background:var(--teal);color:#fff}
  @media(max-width:700px){
    .tinfo-overlay.sheet{background:rgba(22,38,44,.35)}
    .tinfo-card.sheet{left:0;right:0;bottom:0;top:auto;width:auto;max-width:none;
      border-radius:18px 18px 0 0;
      padding:20px 20px calc(20px + env(safe-area-inset-bottom));
      animation:tinfo-auf .18s ease-out}
    .tinfo-ok{min-height:44px;width:100%}
  }
  @keyframes tinfo-auf{from{transform:translateY(100%)}to{transform:translateY(0)}}

  /* Die Zeitraum-Zeile über dem Verlauf (Von–Bis · N Monate). Am Ø-Satz gibt es
     dafür jetzt `.satz-zr` (N187); hier bleibt sie als Überschrift des Verlaufs. */
  .zrzeile{display:block;font:500 11px var(--mono);color:var(--soft);
           margin:0 0 14px;letter-spacing:.02em}

  /* Der ✓ an Jahr-Pill & Matrix, sobald die Periode abgerechnet ist (N182/N193). */
  .fm-jahre button .hk{margin-left:4px;font-size:10px;color:var(--pos);font-weight:700}
  .fm-jahre button[aria-pressed="true"] .hk{color:var(--teal-d)}
  /* Der gesperrte Versand-Knopf: sichtbar ausgegraut, die Vorschau bleibt. */
  .az .aw .btn.gesperrt{opacity:.55;cursor:default;background:var(--paper);
                        color:var(--soft)}
  .az .aw .btn.gesperrt:hover{background:var(--paper);color:var(--soft)}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <a href="index.html" aria-label="Zur Übersicht" class="applogo-link"><img src="icons/icon.svg" alt="" class="applogo"></a>
    <div class="barwrap">
      <h1>E-Tankstelle</h1>
      <div class="sub" id="sub">wird geladen …</div>
    </div>
  </div>

  <div class="scroll">
    <div class="filter">
      <div id="objekt"></div>
    </div>
    <div id="inhalt"></div>
  </div>

  <div data-nav></div>
</div>

<script type="module">
/* N132 — die E-Tankstelle als eigener Bereich.
   An der Ladestation der PV-Anlage laden auch andere. Das ist eine eigene
   Fachlichkeit und keine Karte auf der PV-Seite: hier werden die Nutzer
   gepflegt (Name + E-Mail, beliebig viele, nicht zwangslaeufig Eigentuemer),
   hier steht der monatliche Verlauf mit der Aufteilung Netz/eigener Strom,
   und hier entsteht die Abrechnung, die quartalsweise verschickt wird.
   Gerechnet wird im Backend (api/app/routers/tankstelle.py).

   N215 — die frueher ~1700 Zeilen inline liegende Fachlogik ist nach Themen
   in `public/assets/tankstelle/` aufgeteilt (`_TOPICS.md` fuehrt Buch);
   hier bleiben Skelett, Verdrahtung und Objekt-Kopf. */
import { api, esc, installNav } from './assets/immo.js';
import { auswahlfeld } from './assets/auswahl.js';
import { S } from './assets/tankstelle/state.js';
import { infoKnopf, infoOeffnen, infoSchliessen } from './assets/tankstelle/infos.js';
import { monatUmschalten, quartalUmschalten } from './assets/tankstelle/matrix.js';
import { verlaufZeigen, tabelleNeu } from './assets/tankstelle/verlauf.js';
import { vorschauZeigen } from './assets/tankstelle/blatt.js';
import { nutzerZeigen, nutzerBearbeiten, nutzerSpeichern, nutzerAnlegen,
         nutzerEntfernen, eautoErmitteln } from './assets/tankstelle/nutzer.js';
import { abrechnungZeigen, einstellungenLaden, autoversandUmschalten,
         abgerechnetUmschalten } from './assets/tankstelle/abrechnung.js';
import { zuordnungSpeichern, ausschlussUmschalten }
  from './assets/tankstelle/zuordnen.js';
import { ladungBuchen, ladungEntfernen } from './assets/tankstelle/ladungen.js';
import { versenden } from './assets/tankstelle/versand.js';

installNav();

const sub = document.getElementById('sub');
const inhalt = document.getElementById('inhalt');

/* =======================================================================
   Seitengeruest und Verdrahtung
   ======================================================================= */
/* Reihenfolge nach Gebrauch: den Verlauf sieht man staendig, die Abrechnung
   quartalsweise, zugeordnet wird gelegentlich — und Nutzer legt man einmal
   an. Deshalb steht die Nutzerverwaltung ganz unten (N143). */
function skelett() {
  return `
    <div class="karte">
      <div class="hh"><span class="titelinfo"><h3>Verlauf</h3>
        ${infoKnopf('verlauf')}</span></div>
      <div id="verlauf"></div>
    </div>

    <div class="karte">
      <div id="abrechnung"></div>
    </div>

    <div class="karte" id="kartezuordnen" hidden>
      <div class="hh"><span class="titelinfo"><h3>Ladungen zuordnen</h3>
        ${infoKnopf('zuordnen')}</span></div>
      <div id="ladungen"></div>
    </div>

    <div class="karte">
      <div class="hh"><span class="titelinfo"><h3>Nutzer</h3>
        ${infoKnopf('nutzer')}</span>
        <button class="plus" data-nutzer-add aria-label="Nutzer hinzufügen"
                title="Nutzer hinzufügen">＋</button></div>
      <div id="nutzer"></div>
    </div>`;
}

document.addEventListener('click', e => {
  // N181 — das i-Popup zuerst: es sitzt in den Titeln und am Schalter und darf
  // keinen anderen Faenger mitauslösen.
  const inf = e.target.closest('[data-info]');
  if (inf) { e.preventDefault(); e.stopPropagation(); return infoOeffnen(inf, inf.dataset.info); }
  const infZu = e.target.closest('[data-info-zu]');
  if (infZu) return infoSchliessen();
  const add = e.target.closest('[data-nutzer-add]');
  if (add) { S.addOffen = !S.addOffen; return nutzerZeigen(); }
  const neu = e.target.closest('[data-nutzer-neu]');
  if (neu) return nutzerAnlegen();
  const edit = e.target.closest('[data-nutzer-edit]');
  if (edit) return nutzerBearbeiten(edit.dataset.nutzerEdit);
  const save = e.target.closest('[data-nutzer-save]');
  if (save) return nutzerSpeichern(save.dataset.nutzerSave);
  const ea = e.target.closest('[data-eauto-ermitteln]');
  if (ea) return eautoErmitteln(ea.dataset.eautoErmitteln);
  const weg = e.target.closest('[data-nutzer-weg]');
  if (weg) return nutzerEntfernen(weg.dataset.nutzerWeg, weg.dataset.name);
  const j = e.target.closest('[data-jahr]');
  if (j) {                                   // Jahr wechseln → zurück aufs ganze Jahr
    S.jahrGewaehlt = Number(j.dataset.jahr);
    S.quartaleGewaehlt = [0]; S.ausMonate = new Set();
    return abrechnungZeigen();
  }
  const q = e.target.closest('[data-quartal]');
  if (q) return quartalUmschalten(Number(q.dataset.quartal));
  const m = e.target.closest('[data-monat]');
  if (m) return monatUmschalten(Number(m.dataset.monat));
  const tp = e.target.closest('[data-tabseite]');
  if (tp) { S.verlaufSeite = Number(tp.dataset.tabseite); return tabelleNeu(); }
  const v = e.target.closest('[data-vorschau]');
  if (v) return vorschauZeigen(v.dataset.vorschau);
  const s = e.target.closest('[data-senden]');
  if (s) return versenden(s.dataset.senden);
  const lb = e.target.closest('[data-ladung-neu]');
  if (lb) return ladungBuchen();
  const lw = e.target.closest('[data-ladung-weg]');
  if (lw) return ladungEntfernen(lw.dataset.ladungWeg);
  const zs = e.target.closest('[data-zuordnung-speichern]');
  if (zs) return zuordnungSpeichern();
  const ax = e.target.closest('[data-ausschluss]');
  if (ax) return ausschlussUmschalten(ax.dataset.ausschluss);
  const at = e.target.closest('[data-abger-toggle]');
  if (at) return abgerechnetUmschalten();
});

/* Der Autoversand-Schalter ist eine Checkbox — sie meldet sich ueber `change`,
   nicht ueber den globalen Klick-Faenger. */
document.addEventListener('change', e => {
  const a = e.target.closest('[data-autoversand]');
  if (a) return autoversandUmschalten(a.checked);
});

async function laden() {
  if (!S.objektSlug) {
    inhalt.innerHTML = `<div class="empty"><div class="big">Kein Objekt vorhanden</div>
      <p>Lege zuerst ein Objekt an — die E-Tankstelle gehört zu einer
      PV-Anlage.</p></div>`;
    sub.textContent = 'kein Objekt';
    return;
  }
  inhalt.innerHTML = skelett();
  // Der Verlauf laeuft ueber alles und liefert dabei die Jahre mit Verbrauch —
  // er muss vor der Abrechnung stehen, die genau diese Jahre braucht. Die
  // Einstellungen (Autoversand, Zuordnung) vor der Abrechnung laden, damit
  // Schalter und Regeln beim ersten Zeichnen stimmen.
  await verlaufZeigen();
  await nutzerZeigen();
  await einstellungenLaden();
  await abrechnungZeigen();
}

/* ---- Kopf: nur die Objekt-Auswahl ----
   Jahr und Quartal sitzen an der Abrechnung selbst (siehe `zeitraumWahl`),
   nicht ueber dem Verlauf — so passt die Auswahl stets zum Angezeigten. */
const objektWahl = auswahlfeld(document.getElementById('objekt'), {
  label: 'Objekt',
  optionen: [{ wert: '', text: '—' }],
  wert: '',
  aenderung: (wert) => { S.objektSlug = wert; laden(); },
});

let objekte = [];
try {
  objekte = await api('/objekte');
} catch {
  sub.textContent = 'API nicht erreichbar';
}

// Die Ladestation haengt an der PV-Anlage: zur Wahl stehen die Objekte mit
// Anlage. Ist noch keines markiert, bleiben alle waehlbar — sonst liesse sich
// die erste Station nirgends einrichten.
const mitPv = objekte.filter(o => o.hat_pv);
const wahl = mitPv.length ? mitPv : objekte;

// N213 — kommt der Nutzer über ?objekt=<slug> auf ein Objekt ohne PV, zeigt die
// Seite einen klaren Leerzustand, statt still die erste PV-Immobilie zu laden.
const ausUrl = new URLSearchParams(location.search).get('objekt');
const nichtPvUrl = ausUrl && objekte.some(o => o.slug === ausUrl)
                            && !wahl.some(o => o.slug === ausUrl);
if (nichtPvUrl) {
  const gemeint = objekte.find(o => o.slug === ausUrl);
  sub.textContent = gemeint ? (gemeint.titel || gemeint.name) : '';
  inhalt.innerHTML = `<div class="empty">
      <div class="big">Für diese Immobilie nicht relevant</div>
      <p>Die E-Tankstelle gehört zur PV-Anlage — sie erscheint nur bei Objekten
      mit Anlage. „${esc((gemeint && (gemeint.titel || gemeint.name)) || '')}" ist
      ohne PV geführt.</p></div>`;
  if (wahl.length) {
    objektWahl.fuelle(wahl.map(o => ({ wert: o.slug, text: o.titel || o.name })), '');
  }
} else if (wahl.length) {
  S.objektSlug = (ausUrl && wahl.some(o => o.slug === ausUrl)) ? ausUrl : wahl[0].slug;
  objektWahl.fuelle(wahl.map(o => ({ wert: o.slug, text: o.titel || o.name })),
                    S.objektSlug);
  sub.textContent = mitPv.length
    ? `${mitPv.length} ${mitPv.length === 1 ? 'Station' : 'Stationen'}`
    : 'Noch keine PV-Anlage erfasst';
  await laden();
} else {
  await laden();
}
</script>
</body>
</html>
