  // N187 — der Zeitraum, für den der Durchschnittssatz gilt, steht jetzt AM
  // Satz statt in einer eigenen Zeile darüber („dieser Ø-Wert gilt für …").
  const zr = `gilt für ${esc(d.label)} · ${datum(d.von)} – ${datum(d.bis)}`;
  if (d.satz == null) {
    return `<div class="notiz"><span class="wi">◔</span><span>${esc(
      d.satz_grund || 'Der Satz je kWh lässt sich noch nicht ermitteln.')}
      </span></div>
      <span class="satz-zr solo">${zr}</span>`;
  }
  // Jede Ergaenzung einzeln geprueft: fehlt eine, bleibt sie weg. Ein „NaN %"
  // oder ein „undefined" waere schlimmer als eine Zeile weniger.
  const rabatt = d.satz_rabatt == null ? ''
    : ` (${Math.round(d.satz_rabatt * 100)} % darunter)`;
  const hatTeile = d.satz_netz != null && d.satz_eigen != null;
  // N195 — statt nur der zwei Sätze zeigen die Karten die MENGEN und BETRÄGE des
  // gewählten Zeitraums: Netz-kWh × Netzsatz = Netz-€, Eigen-kWh × Eigensatz =
  // Eigen-€. So füllt der linke Block sinnvoll und die Herkunft des Mischsatzes
  // ist ablesbar. Fehlt die Aufteilung (unbekannt), bleibt die Menge „—".
  const s = periodeSumme(periodeMonate(d));
  const teil = (klasse, label, menge, satzc) => {
    const betrag = (menge != null && satzc != null) ? menge * satzc : null;
    return `<div class="satz-teil ${klasse}"><i></i>
      <div class="st-kopf"><span class="st-l">${label}</span>
        <span class="st-s">${satzText(satzc)}</span></div>
      <div class="st-rechnung"><span class="st-m">${menge == null ? '—' : kwh(menge)}</span>
        <span class="st-eq">→</span>
        <span class="st-v">${betrag == null ? '—' : eur(betrag)}</span></div></div>`;
  };
  const teile = !hatTeile ? '' : `<div class="satz-teile">
      ${teil('netz', 'Netz', s.extern_kwh, d.satz_netz)}
      ${teil('eigen', 'Eigen' + (rabatt ? ' · −10 %' : ''), s.eigen_kwh, d.satz_eigen)}
    </div>`;
  // Mischregel und Herkunft wandern ins i neben die Hero-Zahl (N186) — beide
  // bestehende Texte, nur an einem Ort statt als graue Textwand.
  const regel = !hatTeile ? ''
    : `Netz ${satzText(d.satz_netz)} · eigener Strom ${satzText(d.satz_eigen)}`
      + `${rabatt}. Der Satz einer Ladung mischt beide nach den Mengen des Zeitraums.`;
  const infoText = [regel, d.satz_herkunft || ''].filter(Boolean).join('\n\n');
  return `<div class="satz">
    <div class="satz-hero"><span class="sw">${satzText(d.satz)}</span>
      ${infoKnopfText('Satz je kWh', infoText)}</div>
    ${teile}
    <span class="satz-zr">${zr}</span></div>`;
}

/* Der Kern des Fehlers „ich druecke und nichts passiert": abgerechnet wird
   nur, was einer Person zugeordnet ist. Die Wallbox weiss, WIE VIEL geladen
   wurde, aber nicht von WEM. Ohne eine einzige Zuordnung zeigt jedes Quartal
   dieselben 0,00 € — und bisher stand nirgends, warum. Also: die Luecke
   zwischen geladen und zugeordnet benennen, statt sie stumm zu rendern. */
function offeneNotiz(d) {
  if (!(d.offen_kwh > 0.05)) return '';
  const nichts = !(d.kwh_gesamt > 0);
  return `<div class="notiz"><span class="wi">◔</span><span>Im Zeitraum
    ${esc(d.label)} wurden ${zahl(d.geladen_kwh)} kWh geladen, davon
    ${nichts ? 'keine einzige' : `nur ${zahl(d.kwh_gesamt)} kWh`} einer Person
    zugeordnet. Abgerechnet wird nur, was zugeordnet ist — die Wallbox weiß
    nicht, wer geladen hat. Das geht unten unter „Ladungen zuordnen“.</span></div>`;
}

/* N165 — ist nur eine Person angelegt, gehoeren ihr automatisch alle Ladungen
   des Zeitraums. Das ist eine Erleichterung, keine Stoerung: ein ruhiger
   Hinweis, kein Warnbalken — und die Zeile traegt zusaetzlich den Chip
   „automatisch", damit die Zuordnung nicht wie eine Handeingabe aussieht. */
function autoNotiz() {
  return `<div class="notiz auto"><span class="wi">⤳</span><span>Automatisch
    zugeordnet — nur eine Person angelegt, alle Ladungen gehen auf sie.</span></div>`;
}

/* Die Vorschau: das Abrechnungs-PDF, wie es als Anhang ausssaehe — eingebettet
   auf der Seite (N169), nicht in einem neuen Tab. Sie aktualisiert sich, sobald
   sich die Auswahl aendert (Jahr, Quartale, Monate): `abrechnungZeigen` merkt
   sich die offene Vorschau und laedt sie mit dem neuen Ausschnitt entprellt neu.
   Verschickt wird dabei nichts. */
async function vorschauZeigen(nid) {
  nid = Number(nid);
  const feld = document.querySelector(`[data-mail="${nid}"]`);
  if (!feld) return;
  if (offeneVorschau === nid) {                // zweiter Klick schliesst wieder
    feld.innerHTML = '';
    offeneVorschau = 0;
    clearTimeout(vorschauTimer);
    return;
  }
  document.querySelectorAll('[data-mail]').forEach(f => { f.innerHTML = ''; });
  offeneVorschau = nid;
  await vorschauRendern(nid);
}

function vorschauEntprellt(nid) {
  clearTimeout(vorschauTimer);
  vorschauTimer = setTimeout(() => vorschauRendern(nid), 350);
}

async function vorschauRendern(nid) {
  const feld = document.querySelector(`[data-mail="${nid}"]`);
  if (!feld || offeneVorschau !== Number(nid)) return;
  const slug = encodeURIComponent(objektSlug);
  let v;
  try {
    v = await api(`/tankstelle/${slug}/vorschau?${zeitraumParams()}&nutzer_id=${nid}`);
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); return; }
  // Der Kopf traegt An/Betreff und ein klares × (N178): die Vorschau bleibt
  // inline, der Schliessen-Weg sitzt direkt am Blatt. Das × ist derselbe
  // Vorschau-Umschalter — bei offener Vorschau schliesst ein Klick sie wieder.
  const kopf = `<div class="vorschau-kopf">
      <span class="mailkopf">An ${esc(v.an || '— keine Adresse —')}
        · ${esc(v.betreff)}</span>
      <button class="vorschau-x" data-vorschau="${nid}"
              aria-label="Vorschau schließen" title="Vorschau schließen">×</button>
    </div>`;
  // N179/N184 — statt des eingebetteten A4-PDFs (skaliert auf iOS nicht auf die
  // Rahmenbreite: waagerechtes Scrollen, rechts abgeschnitten) ein responsiver
  // HTML-Nachbau der VOLLSTÄNDIGEN Abrechnung. Ohne Betrag bleibt es beim
  // Mailtext. Die Blattbreite wird an die Grafik gereicht (abzüglich der
  // Innenabstände von Vorschau- und Blattrahmen).
  const breite = Math.max(240, (feld.clientWidth || 300) - 56);
  const koerper = v.betrag == null
    ? `<pre class="mailtext">${esc(v.text)}</pre>`
    : abrechnungBlatt(nid, v.text, breite);
  feld.innerHTML = `<div class="vorschau">${kopf}${koerper}</div>`;
}

/* N184 — die Monate des Abrechnungszeitraums, aus dem bereits geholten Verlauf
   (`verlaufMonate`) gefiltert auf Jahr und die aktiven Monate der Abrechnung.
   `/abrechnung` liefert die Monatsaufteilung nicht selbst mit; sie steht aber
   identisch im Verlauf, der beim Seitenaufbau schon geladen wurde — dieselben
   Zahlen, keine erfundenen. Ein Monat ohne Ladung bleibt als leere Stelle
   stehen (Diagramm) bzw. mit Strich (Tabelle). */
function periodeMonate(d) {
  const aktiv = new Set(d.monate_aktiv || []);
  return (verlaufMonate || []).filter(
    m => m.jahr === d.jahr && aktiv.has(m.monat));
}

/* Die Summenzeile des Zeitraums — dieselben Regeln wie im Backend
   (`verlauf_summe`): unbekannte Aufteilung bleibt ``null`` statt einer 0, und
   die Prozentwerte kommen aus den summierten Mengen. */
function periodeSumme(monate) {
  const r2 = n => Math.round(n * 100) / 100;
  const summe = k => r2(monate.reduce((s, m) => s + (m[k] || 0), 0));
  const kwh = summe('kwh');
  const voll = monate.length > 0 && monate.every(m => m.aufteilung);
  const drei = monate.length > 0 && monate.every(m => m.dreiteilig);
  const wert = (k, unbekannt) => unbekannt ? null : summe(k);
  const s = { kwh, aufteilung: voll, dreiteilig: drei,
    extern_kwh: wert('extern_kwh', !voll), eigen_kwh: wert('eigen_kwh', !voll),
    pv_kwh: wert('pv_kwh', !drei), speicher_kwh: wert('speicher_kwh', !drei) };
  for (const feld of ['extern', 'eigen', 'pv', 'speicher']) {
    const v = s[feld + '_kwh'];
    s[feld + '_prozent'] = (v == null || !(kwh > 0)) ? null
      : Math.round(v / kwh * 1000) / 10;
  }
  return s;
}

/* N194 — der Ø-Verbrauch je Monat im Vergleich zur Vorperiode: die gleich lange
   Spanne unmittelbar VOR dem gewählten Zeitraum (aus dem Gesamtverlauf). So sieht
   man, ob im Schnitt mehr oder weniger geladen wurde. Ohne Vorperiode → null. */
function verbrauchsTrend(periodMonate) {
  if (!periodMonate.length || !(verlaufMonate || []).length) return null;
  const key = m => m.jahr * 12 + m.monat;
  const chrono = [...verlaufMonate].sort((a, b) => key(a) - key(b));
  const ersterKey = Math.min(...periodMonate.map(key));
  const startIdx = chrono.findIndex(m => key(m) === ersterKey);
  if (startIdx <= 0) return null;                        // keine Vorperiode
  const vorher = chrono.slice(Math.max(0, startIdx - periodMonate.length), startIdx);
  if (!vorher.length) return null;
  const schnitt = arr => arr.reduce((sum, m) => sum + (m.kwh || 0), 0) / arr.length;
  const jetzt = schnitt(periodMonate), vor = schnitt(vorher);
  if (!(vor > 0)) return null;
  return { jetzt, vor, delta: (jetzt - vor) / vor };
}

/* Die Monatstabelle mit E-Auto (Monat · Geladen · km · Kosten) — wie im PDF,
   wenn ein Verbrauch hinterlegt ist. km = kWh ÷ Verbrauch × 100, Kosten =
   kWh × Satz. Die frühere Spalte „Preis/100 km" ist raus (N194): sie war über
   die Periode konstant (Ø-Satz × Verbrauch) und monatlich ohne Aussage. */
function blattTabelleEauto(monate, summe, verbrauch, satz) {
  const km = k => (k > 0 && verbrauch > 0) ? k / verbrauch * 100 : null;
  const kosten = k => satz == null ? null : k * satz;
  const zeile = (label, k) => {
    const kmv = km(k), ko = kosten(k);
    return `<tr>
      <td>${esc(label)}</td>
      <td class="${k ? '' : 'leise'}">${zahl(k)}</td>
      <td class="${kmv == null ? 'leise' : ''}">${kmv == null ? '—' : zahl(kmv, 0)}</td>
      <td class="${ko == null ? 'leise' : ''}">${ko == null ? '—' : eur(ko)}</td></tr>`;
  };
  return `<div class="tabrahmen"><table class="mt bl-mt">
    <thead><tr><th>Monat</th><th>Geladen</th><th>km</th><th>Kosten</th></tr></thead>
    <tbody>${monate.map(m => zeile(m.label, m.kwh || 0)).join('')}</tbody>
    <tfoot>${zeile('Summe', summe.kwh || 0)}</tfoot>
  </table></div>`;
}

/* Die Monatstabelle ohne E-Auto: Monat · Geladen · Netz · (PV · Akku | Eigen) —
   wie der Verlauf, nur für den Zeitraum und ohne Pager. */
function blattTabelleStrom(monate, summe) {
  const drei = summe.dreiteilig;
  const zelle = v => v == null ? '<td class="leise">—</td>' : `<td>${zahl(v)}</td>`;
  const zeile = (label, m) => `<tr>
    <td>${esc(label)}</td>
    <td class="${m.kwh ? '' : 'leise'}">${zahl(m.kwh)}</td>
    ${zelle(m.extern_kwh)}
    ${drei ? zelle(m.pv_kwh) + zelle(m.speicher_kwh) : zelle(m.eigen_kwh)}</tr>`;
  return `<div class="tabrahmen"><table class="mt bl-mt">
    <thead><tr><th>Monat</th><th>Geladen</th><th>Netz</th>
      ${drei ? '<th>PV</th><th>Akku</th>' : '<th>Eigen</th>'}</tr></thead>
    <tbody>${monate.map(m => zeile(m.label, m)).join('')}</tbody>
    <tfoot>${zeile('Summe', summe)}</tfoot>
  </table></div>`;
}

/* N179/N184 — die Abrechnung als vollständiges HTML-Blatt: dieselben Blöcke und
   Zahlen wie das PDF, in derselben Reihenfolge, nur responsiv. Kopf, Empfänger,
   Diagramm je Monat mit Legende, Monatstabelle mit Kosten, E-Auto, Satz mit
   Herkunft und der Rechnungsbetrag. Grundlage ist die zuletzt geholte Abrechnung
   (`letzteAbrechnung`) und die Nutzerzeile daraus, ergänzt um die Monate aus dem
   Verlauf. Fehlt die Zeile wider Erwarten, fällt es auf den Mailtext zurück.

   N184b — die Vorschau spiegelt das PDF jetzt vollständig: Empfänger-Anschrift
   unter dem Namen, der Benzin-Kostenvergleich (mit grün hervorgehobener
   Ersparnis) nach dem E-Auto-Block und die Objekt-Bankverbindung unter dem
   Rechnungsbetrag. Fehlt ein Datum (kein KI-Benzinwert, kein Konto, keine
   Anschrift), entfällt der jeweilige Block ersatzlos — wie im PDF, nie ein
   Platzhalter, nie eine erfundene Zahl. */
function abrechnungBlatt(nid, fallbackText, breite) {
  const d = letzteAbrechnung;
  const row = d && (d.nutzer || []).find(n => Number(n.nutzer_id) === Number(nid));
  if (!d || !row) return `<pre class="mailtext">${esc(fallbackText || '')}</pre>`;

  // Diagramm + Legende + Monatstabelle aus den Monaten des Zeitraums.
  const monate = periodeMonate(d);
  const summe = periodeSumme(monate);
  const verbrauch = row.verbrauch_kwh_100km || 0;
  let verlaufBlock = '';
  if (monate.length) {
    const drei = summe.dreiteilig;
    const leg = legende(drei
      ? [{ name: 'Netz', farbe: NETZ }, { name: 'PV direkt', farbe: PV },
         { name: 'Akku', farbe: AKKU }]
      : [{ name: 'Netz', farbe: NETZ },
         { name: 'Eigener Strom (PV + Akku)', farbe: EIGEN }]);
    const tabelle = verbrauch > 0
      ? blattTabelleEauto(monate, summe, verbrauch, d.satz)
      : blattTabelleStrom(monate, summe);
    verlaufBlock = `<div class="bl-block">
      <span class="bl-abschnitt">Geladene Energie je Monat</span>
      ${grafik(monate, breite)}${leg}${tabelle}</div>`;
  }

  // E-Auto: Modell, Verbrauch, energetisches Benzin-Äquivalent (kein Kosten-
  // vergleich — der bräuchte den Vergleichsbenziner, den `/abrechnung` nicht
  // liefert).
  let eautoBlock = '';
  if (verbrauch > 0) {
    const liter = d.benzin_kwh_pro_liter ? verbrauch / d.benzin_kwh_pro_liter : null;
    eautoBlock = `<div class="bl-block">
      <span class="bl-abschnitt">E-Auto${row.e_auto_modell
        ? ' · ' + esc(row.e_auto_modell) : ''}</span>
      <span class="bl-sd">Verbrauch ${zahl(verbrauch, 1)} kWh/100 km. Defensive
        Fahrweise, Ladeverluste eingerechnet.</span>
      ${liter != null ? `<span class="bl-sq">Energie-Äquivalent:
        ${zahl(verbrauch, 1)} kWh entsprechen rund ${zahl(liter, 1)} l Benzin
        (Annahme ${zahl(d.benzin_kwh_pro_liter, 1)} kWh je Liter).</span>` : ''}</div>`;
  }

  // N184b — der Kosten-Benzinvergleich mit der grün hervorgehobenen Ersparnis,
  // wie im PDF. `row.benzin` kommt aus `eauto.benzin_vergleich`; fehlt der
  // Vergleich (kein KI-Benzinwert), ist es null und der Block entfällt.
  let benzinBlock = '';
  const bz = row.benzin;
  if (bz) {
    const spar = bz.ersparnis_100km == null ? '' : `<span class="bl-spar">
      Ersparnis Elektro: ${eur(bz.ersparnis_100km)} je 100 km${
        bz.ersparnis_gesamt != null && bz.km != null
          ? ` — für rund ${zahl(bz.km, 0)} km im Quartal rund ${eur(bz.ersparnis_gesamt)}`
          : ''}</span>`;
    benzinBlock = `<div class="bl-block">
      <span class="bl-abschnitt">Kostenvergleich mit Benzin</span>
      <span class="bl-sd">Ein vergleichbarer Benziner braucht rund
        ${zahl(bz.verbrauch_l, 1)} l/100 km (Annahme ${eur(bz.preis_liter)} je
        Liter). Benzin ${eur(bz.benzin_100km)} je 100 km · Ihr E-Auto
        ${eur(bz.e_100km)} je 100 km.</span>
      ${spar}</div>`;
  }

  // N184b — die Objekt-Bankverbindung (der Betreiber, an den überwiesen wird).
  // `d.konto` ist null, solange keine der drei Angaben gepflegt ist — dann
  // entfällt der Block ersatzlos, kein leerer Platzhalter.
  let kontoBlock = '';
  if (d.konto) {
    const teile = [];
    if ((d.konto.kontoinhaber || '').trim()) teile.push(esc(d.konto.kontoinhaber));
    if ((d.konto.iban || '').trim()) teile.push('IBAN ' + esc(d.konto.iban));
    if ((d.konto.bank || '').trim()) teile.push(esc(d.konto.bank));
    if (teile.length) kontoBlock = `<div class="bl-block bl-konto">
      <span class="bl-abschnitt">Bitte überweisen Sie den Betrag auf:</span>
      <span class="bl-sd">${teile.join(' · ')}</span></div>`;
  }

  // N184b — die Empfänger-Anschrift unter dem Namen (Straße, dann PLZ + Ort).
  // Fehlt sie (noch nicht angelegte Person), bleibt es beim Namen.
  const anschrift = [row.strasse,
    [row.plz, row.ort].filter(s => (s || '').trim()).join(' ')]
    .filter(s => (s || '').trim())
    .map(s => `<span class="bl-adr">${esc(s)}</span>`).join('');

  // Satz je kWh mit Herkunft (der lange „Rechnung … ÷ … Netzbezug"-Satz ist
  // raus, N194 — er wiederholte die Herleitung; die Aufteilung steht in den
  // Fakten unten).
  const rabatt = d.satz_rabatt == null ? ''
    : ` (${Math.round(d.satz_rabatt * 100)} % darunter)`;
  const regel = d.satz_netz == null || d.satz_eigen == null ? ''
    : `<span class="bl-sd">Netz ${satzText(d.satz_netz)} · eigener Strom
        ${satzText(d.satz_eigen)}${rabatt}. Der Satz einer Ladung mischt beide
        nach den Mengen des Zeitraums.</span>`;

  // N194 — die Fakten des Zeitraums als Bubbles: Menge Netz/Eigen, die Ersparnis
  // gegenüber Benzin und der Ø-Verbrauch je Monat mit dem Trend zur Vorperiode.
  const oMonat = monate.length ? summe.kwh / monate.length : null;
  const tr = verbrauchsTrend(monate);
  const trChip = !tr ? '' : `<span class="bl-trend ${
      tr.delta < -0.005 ? 'pos' : (tr.delta > 0.005 ? 'neg' : '')}">${
      tr.delta < -0.005 ? '↓' : (tr.delta > 0.005 ? '↑' : '±')} ${
      Math.abs(Math.round(tr.delta * 100))} % ggü. Vorperiode</span>`;
  const bubble = (label, wert, extra = '') => `<div class="bl-fakt">
      <span class="bl-fl">${label}</span>
      <span class="bl-fv">${wert}</span>${extra}</div>`;
  const fakten = [];
  if (summe.extern_kwh != null) fakten.push(bubble('Netz', kwh(summe.extern_kwh)));
  if (summe.eigen_kwh != null) fakten.push(bubble('Eigen', kwh(summe.eigen_kwh)));
  if (row.benzin && row.benzin.ersparnis_gesamt != null) {
    fakten.push(bubble('Ersparnis ggü. Benzin', eur(row.benzin.ersparnis_gesamt)));
  }
  if (oMonat != null) fakten.push(bubble('Ø / Monat', kwh(oMonat), trChip));
  const faktenBlock = fakten.length
    ? `<div class="bl-block"><div class="bl-fakten">${fakten.join('')}</div></div>` : '';

  return `<div class="blatt">
    <div class="bl-kopf">
      <span class="bl-titel">Abrechnung E-Tankstelle</span>
      <span class="bl-meta">${esc(d.objekt)} · ${esc(d.label)}</span>
      <span class="bl-meta">Ladezeitraum ${datum(d.von)} – ${datum(d.bis)}</span>
    </div>
    <div class="bl-empf"><span class="bl-name">${esc(row.name)}</span>
      ${anschrift}
      ${row.email ? `<span class="bl-mail">${esc(row.email)}</span>` : ''}</div>
    ${verlaufBlock}
    ${eautoBlock}
    ${benzinBlock}
    <div class="bl-block">
      <span class="bl-abschnitt">Satz je kWh</span>
      <div class="bl-satz"><span class="bl-sw">${satzText(row.satz)}</span>
        ${regel}</div>
    </div>
    ${faktenBlock}
    <div class="bl-betrag">
      <span class="bl-bl"><span class="bl-bk">Rechnungsbetrag</span>
        <span class="bl-bkwh">${kwh(row.kwh)} geladen</span></span>
      <span class="bl-bb">${row.betrag == null ? '—' : eur(row.betrag)}</span></div>
    ${kontoBlock}
  </div>`;
}

async function versenden(nid) {
  const nutzer = nutzerListe.find(n => n.id === Number(nid));
  const ja = await frage('Abrechnung verschicken?',
    `Die Abrechnung geht als Mail an ${nutzer?.email || 'die hinterlegte Adresse'}.`,
    { knopf: 'Senden' });
  if (!ja) return;
  try {
    const d = await api(`/tankstelle/${encodeURIComponent(objektSlug)}/versand`, {
      method: 'POST',
      body: { nutzer_id: Number(nid), jahr: jahrWert(),
              quartale: quartaleGewaehlt, aus: [...ausMonate] } });
    melde(`Abrechnung an ${d.an} verschickt`, 'pos');
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

/* =======================================================================
   Ladungen: was die Wallbox nicht weiss, ist WER geladen hat. Deshalb hier
   die Zuordnung — sie ist die Grundlage jeder Abrechnung.
   ======================================================================= */
let buchungsWahl = null;

/* N165/2 — die Mehrnutzer-Zuordnung ueber einen Zeitraum. Statt jede Ladung
   einzeln anzuklicken (der ausdrueckliche Kritikpunkt): je Nutzer ein „laedt
   vom … bis …". Jede Ladung geht an den, dessen Zeitraum ihren Tag enthaelt.
   Einzelne Ladungen schliesst man in der Liste darunter aus — der
   Korrekturweg. */
function zuordnungBlock() {
  const regel = id => (einst.regeln || []).find(r => r.nutzer_id === id) || {};
  const zeilen = nutzerListe.map(n => {
    const r = regel(n.id);
    return `<div class="zregel">
      <span class="zn">${esc(n.name)}</span>
      <div class="zf">
        <div class="field"><span class="fl">Lädt ab</span>
          <input class="inp" type="date" data-regel-von="${n.id}"
                 value="${esc(r.von || '')}"></div>
        <div class="field"><span class="fl">Lädt bis</span>
          <input class="inp" type="date" data-regel-bis="${n.id}"
                 value="${esc(r.bis || '')}"></div>
      </div>
    </div>`;
  }).join('');
  // Der frühere Erklär-Absatz steht jetzt im i-Popup am Karten-Titel „Ladungen
  // zuordnen" (N181) — hier bleiben nur die Regel-Felder selbst.
  return `${zeilen}
    <button class="btn" data-zuordnung-speichern
            style="margin:0 0 16px">Zuordnung speichern</button>`;
}

async function ladungenZeigen() {
  const ziel = document.getElementById('ladungen');
  if (!ziel) return;
  // N169 — bei genau einem (oder keinem) Nutzer gehoeren ihm ohnehin alle
  // Ladungen automatisch; die Zuordnung waere leer und verwirrend. Erst ab zwei
  // Nutzern gibt es etwas zuzuordnen, dann erscheint der Bereich.
  const karte = document.getElementById('kartezuordnen');
  if (karte) karte.hidden = nutzerListe.length < 2;
  if (nutzerListe.length < 2) return;
  let d;
  try {
    d = await api(`/objekte/${encodeURIComponent(objektSlug)}/tankstelle/${jahrWert()}`);
  } catch (fehler) {
    zeigeFehler(ziel, 'Erfasste Ladungen nicht verfügbar', fehler);
    return;
  }
  /* Bewusst ohne Geldspalte (N148): der Betrag je Ladung kaeme aus
     `Tankladung.preis` — dem stillgelegten Handwert. Er stand hier als
     „0,00 €" und widersprach dem abgeleiteten Satz eine Karte weiter oben.
     Was eine Ladung kostet, sagt die Abrechnung; hier geht es allein um die
     Zuordnung: wer, wann, wie viel. */
  // Solange nur eine Person angelegt ist, gibt es nichts zu entscheiden —
  // jede Ladung geht auf sie. Sobald es zwei sind, wird zugeordnet.
  const einer = nutzerListe.length === 1 ? nutzerListe[0] : null;
  const mehr = nutzerListe.length > 1;
  const ausg = new Set(einst.ausschluss || []);

  const zeilen = (d.ladungen || []).map(l => `
    <div class="lz ${mehr && ausg.has(l.id) ? 'aus' : ''}">
      <span class="ld">${esc(l.person || '—')}
        <span class="ldt">${l.datum ? datum(l.datum) : 'ohne Datum'}</span></span>
      <span class="lk">${kwh(l.kwh)}</span>
      ${mehr ? `<button class="lex" data-ausschluss="${l.id}">${
        ausg.has(l.id) ? 'einbeziehen' : 'ausschließen'}</button>` : ''}
      <button class="lx" data-ladung-weg="${l.id}" aria-label="Ladung entfernen">×</button>
    </div>`).join('');

  ziel.innerHTML = `
    ${einer ? `<span class="vermerk">Angelegt ist bisher nur
        <b>${esc(einer.name)}</b> — jede Ladung geht damit auf ihn.</span>` : ''}
    ${mehr ? zuordnungBlock() : ''}
    ${zeilen ? `<div class="lliste">${zeilen}</div>`
      : `<div class="leer" style="margin-bottom:14px"><b>Keine Ladung erfasst</b>
          In ${esc(String(jahrWert()))} ist noch keine Ladung einer Person
          zugeordnet.</div>`}
    <div class="neu">
      <div class="field"><span class="fl">Wer hat geladen</span>
        <div id="bPerson"></div></div>
      <div class="field"><label for="bKwh">Menge (kWh)</label>
        <input class="inp" id="bKwh" type="number" inputmode="decimal" step="0.1" min="0"></div>
      <div class="field"><label for="bDatum">Datum</label>
        <input class="inp" id="bDatum" type="date"></div>
      <button class="btn" data-ladung-neu>Ladung buchen</button>
    </div>`;

  buchungsWahl = auswahlfeld(document.getElementById('bPerson'), {
    label: 'Wer hat geladen',
    optionen: nutzerListe.length
      ? nutzerListe.map(n => ({ wert: String(n.id), text: n.name }))
      : [{ wert: '', text: 'Nutzer anlegen' }],
    wert: nutzerListe.length ? String(nutzerListe[0].id) : '',
  });
}

async function ladungBuchen() {
  const nid = buchungsWahl?.wert();
  const nutzer = nutzerListe.find(n => String(n.id) === String(nid));
  const menge = parseFloat(String(document.getElementById('bKwh')?.value || '')
    .replace(',', '.'));
  if (!nutzer) { melde('Erst einen Nutzer anlegen', 'neg'); return; }
  if (!(menge > 0)) { melde('Bitte die geladene Menge angeben', 'neg'); return; }
  try {
    await api(`/objekte/${encodeURIComponent(objektSlug)}/tankstelle/${jahrWert()}`, {
      method: 'POST',
      body: { name: nutzer.name, email: nutzer.email || '', kwh: menge,
              datum: document.getElementById('bDatum')?.value || null } });
    melde('Ladung gebucht', 'pos');
    await abrechnungZeigen();
    await verlaufZeigen();
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

async function ladungEntfernen(id) {
  try {
    await api(`/tankladungen/${id}`, { method: 'DELETE' });
    await abrechnungZeigen();
    await verlaufZeigen();
  } catch (fehler) { melde(String(fehler.message || fehler), 'neg'); }
}

/* =======================================================================
   Seitengeruest und Verdrahtung
   ======================================================================= */
/* Reihenfolge nach Gebrauch: den Verlauf sieht man staendig, die Abrechnung
   quartalsweise, zugeordnet wird gelegentlich — und Nutzer legt man einmal
   an. Deshalb steht die Nutzerverwaltung ganz unten (N143). */
function skelett() {
  return `
    <div class="karte">
      <div class="hh"><span class="titelinfo"><h3>Verlauf</h3>
        ${infoKnopf('verlauf')}</span></div>
      <div id="verlauf"></div>
    </div>

    <div class="karte">
      <div id="abrechnung"></div>
    </div>

    <div class="karte" id="kartezuordnen" hidden>
      <div class="hh"><span class="titelinfo"><h3>Ladungen zuordnen</h3>
        ${infoKnopf('zuordnen')}</span></div>
      <div id="ladungen"></div>
    </div>

    <div class="karte">
      <div class="hh"><span class="titelinfo"><h3>Nutzer</h3>
        ${infoKnopf('nutzer')}</span>
        <button class="plus" data-nutzer-add aria-label="Nutzer hinzufügen"
                title="Nutzer hinzufügen">＋</button></div>
      <div id="nutzer"></div>
    </div>`;
}

document.addEventListener('click', e => {
  // N181 — das i-Popup zuerst: es sitzt in den Titeln und am Schalter und darf
  // keinen anderen Faenger mitauslösen.
  const inf = e.target.closest('[data-info]');
  if (inf) { e.preventDefault(); e.stopPropagation(); return infoOeffnen(inf, inf.dataset.info); }
  const infZu = e.target.closest('[data-info-zu]');
  if (infZu) return infoSchliessen();
  const add = e.target.closest('[data-nutzer-add]');
  if (add) { addOffen = !addOffen; return nutzerZeigen(); }
  const neu = e.target.closest('[data-nutzer-neu]');
  if (neu) return nutzerAnlegen();
  const edit = e.target.closest('[data-nutzer-edit]');
  if (edit) return nutzerBearbeiten(edit.dataset.nutzerEdit);
  const save = e.target.closest('[data-nutzer-save]');
  if (save) return nutzerSpeichern(save.dataset.nutzerSave);
  const ea = e.target.closest('[data-eauto-ermitteln]');
  if (ea) return eautoErmitteln(ea.dataset.eautoErmitteln);
  const weg = e.target.closest('[data-nutzer-weg]');
  if (weg) return nutzerEntfernen(weg.dataset.nutzerWeg, weg.dataset.name);
  const j = e.target.closest('[data-jahr]');
  if (j) {                                   // Jahr wechseln → zurück aufs ganze Jahr
    jahrGewaehlt = Number(j.dataset.jahr);
    quartaleGewaehlt = [0]; ausMonate = new Set();
    return abrechnungZeigen();
  }
  const q = e.target.closest('[data-quartal]');
  if (q) return quartalUmschalten(Number(q.dataset.quartal));
  const m = e.target.closest('[data-monat]');
  if (m) return monatUmschalten(Number(m.dataset.monat));
  const tp = e.target.closest('[data-tabseite]');
  if (tp) { verlaufSeite = Number(tp.dataset.tabseite); return tabelleNeu(); }
  const v = e.target.closest('[data-vorschau]');
  if (v) return vorschauZeigen(v.dataset.vorschau);
  const s = e.target.closest('[data-senden]');
  if (s) return versenden(s.dataset.senden);
  const lb = e.target.closest('[data-ladung-neu]');
  if (lb) return ladungBuchen();
  const lw = e.target.closest('[data-ladung-weg]');
  if (lw) return ladungEntfernen(lw.dataset.ladungWeg);
  const zs = e.target.closest('[data-zuordnung-speichern]');
  if (zs) return zuordnungSpeichern();
  const ax = e.target.closest('[data-ausschluss]');
  if (ax) return ausschlussUmschalten(ax.dataset.ausschluss);
  const at = e.target.closest('[data-abger-toggle]');
  if (at) return abgerechnetUmschalten();
});

/* Der Autoversand-Schalter ist eine Checkbox — sie meldet sich ueber `change`,
   nicht ueber den globalen Klick-Faenger. */
document.addEventListener('change', e => {
  const a = e.target.closest('[data-autoversand]');
  if (a) return autoversandUmschalten(a.checked);
});

async function laden() {
  if (!objektSlug) {
    inhalt.innerHTML = `<div class="empty"><div class="big">Kein Objekt vorhanden</div>
      <p>Lege zuerst ein Objekt an — die E-Tankstelle gehört zu einer
      PV-Anlage.</p></div>`;
    sub.textContent = 'kein Objekt';
    return;
  }
  inhalt.innerHTML = skelett();
  // Der Verlauf laeuft ueber alles und liefert dabei die Jahre mit Verbrauch —
  // er muss vor der Abrechnung stehen, die genau diese Jahre braucht. Die
  // Einstellungen (Autoversand, Zuordnung) vor der Abrechnung laden, damit
  // Schalter und Regeln beim ersten Zeichnen stimmen.
  await verlaufZeigen();
  await nutzerZeigen();
  await einstellungenLaden();
  await abrechnungZeigen();
}

/* ---- Kopf: nur die Objekt-Auswahl ----
   Jahr und Quartal sitzen an der Abrechnung selbst (siehe `zeitraumWahl`),
   nicht ueber dem Verlauf — so passt die Auswahl stets zum Angezeigten. */
const objektWahl = auswahlfeld(document.getElementById('objekt'), {
  label: 'Objekt',
  optionen: [{ wert: '', text: '—' }],
  wert: '',
  aenderung: (wert) => { objektSlug = wert; laden(); },
});

let objekte = [];
try {
  objekte = await api('/objekte');
} catch {
  sub.textContent = 'API nicht erreichbar';
}

// Die Ladestation haengt an der PV-Anlage: zur Wahl stehen die Objekte mit
// Anlage. Ist noch keines markiert, bleiben alle waehlbar — sonst liesse sich
// die erste Station nirgends einrichten.
const mitPv = objekte.filter(o => o.hat_pv);
const wahl = mitPv.length ? mitPv : objekte;

if (wahl.length) {
  const ausUrl = new URLSearchParams(location.search).get('objekt');
  objektSlug = (ausUrl && wahl.some(o => o.slug === ausUrl)) ? ausUrl : wahl[0].slug;
  objektWahl.fuelle(wahl.map(o => ({ wert: o.slug, text: o.titel || o.name })),
                    objektSlug);
  sub.textContent = mitPv.length
    ? `${mitPv.length} ${mitPv.length === 1 ? 'Station' : 'Stationen'}`
    : 'Noch keine PV-Anlage erfasst';
}
await laden();
</script>
