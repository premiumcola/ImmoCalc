<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vorlagen · ImmoCalc</title>
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F6E5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ImmoCalc">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/immo.css">
<style>
  /* N240 — Vorlagenarchiv: dieselben Bausteine wie das Belegarchiv (N84),
     hier nach Verwendungszweck statt Objekt/Jahr gruppiert. */
  .zahlzeile{display:flex;align-items:center;gap:8px;margin:0 2px 14px;flex-wrap:wrap}
  .zahlzeile .zahl{font:600 12px var(--mono);color:var(--soft)}
  /* N247 — die Regel steht EINMAL hier, nicht in jeder der fuenf Zeilen. */
  .vz-regel{font:500 11px var(--mono);color:var(--soft);background:#F1F4F4;
            border-radius:99px;padding:4px 10px}

  .vz-gruppe{margin-bottom:22px}
  .vz-titel{font:700 12px var(--mono);letter-spacing:.04em;color:var(--soft);
            text-transform:uppercase;margin:0 2px 10px}

  .vk{background:var(--sheet);border-radius:14px;padding:14px 16px;margin-bottom:10px;
      box-shadow:0 1px 2px rgba(22,38,44,.05)}
  /* N264 — die Druckknoepfe sitzen rechts oben in der Titelzeile. Auf
     schmalen Schirmen bleibt nur das Symbol: der Standort steht im Titel. */
  .vk-druck{margin-left:auto;display:flex;gap:6px;flex:none}
  .vk-dr{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #C3DAD2;
    background:var(--sheet);color:var(--teal-d);border-radius:10px;cursor:pointer;
    font:600 11.5px var(--disp);padding:7px 10px;min-height:36px}
  .vk-dr:hover{background:var(--teal-l)}
  .vk-dr[disabled]{opacity:.55;cursor:default}
  @media (max-width:560px){ .vk-dr-t{display:none} .vk-dr{padding:7px 9px} }
  .vk-kopf{display:flex;align-items:center;gap:8px}
  .vk-name{font:600 14px var(--body);color:var(--ink);flex:1;min-width:0}
  .vk-quelle{flex:none;width:26px;height:26px;border:none;background:#F1F4F4;
             color:var(--soft);border-radius:8px;cursor:pointer;font:600 12px var(--mono);
             display:flex;align-items:center;justify-content:center}
  .vk-quelle:hover{background:var(--teal-l);color:var(--teal-d)}
  .vk-hinweis{font:400 12.5px var(--body);color:var(--soft);line-height:1.5;margin:8px 0 0}
  .vk-fuss{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;
           border-top:1px solid var(--line)}
  .vk-datei{flex:1;min-width:0;font:500 10.5px var(--mono);color:var(--soft);
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vk-ansehen{flex:none;border:none;background:var(--teal-l);color:var(--teal-d);
              font:600 12.5px var(--disp);border-radius:10px;padding:0 14px;
              min-height:44px;cursor:pointer}
  .vk-ansehen:hover{background:var(--teal);color:#fff}
  .vk-loeschen{flex:none;width:44px;height:44px;border:none;background:#F1F4F4;
               color:var(--soft);border-radius:10px;cursor:pointer;
               font:400 17px var(--body);display:flex;align-items:center;
               justify-content:center;line-height:1}
  .vk-loeschen:hover{background:var(--neg-bg);color:var(--neg)}

  /* N247 — je Vorlagenart eine Zeile; die leeren zeigen ein Ablagefeld.
     Dieselben Bausteine wie „Beleg hier ablegen" in der Nebenkosten-
     Checkliste (`.ablg` in zeitraum.html), nur je Zeile statt je Karte. */
  .vk.leer{background:#F4F7F7;box-shadow:none}
  .vk-ablg{display:flex;align-items:center;justify-content:space-between;gap:12px;
           flex-wrap:wrap;border:1.5px dashed var(--line);border-radius:12px;
           padding:10px 14px;margin-top:11px;transition:border-color .15s,background .15s}
  .vk.dropziel .vk-ablg{border-color:var(--teal);background:var(--teal-l)}
  .vk-ablg-t{font:600 12.5px var(--disp);letter-spacing:-.01em;color:var(--soft)}
  .vk-waehlen{display:inline-flex;align-items:center;justify-content:center;gap:8px;
              border:none;background:#E8F0F6;color:#2C5C7A;border-radius:10px;
              font:600 12.5px var(--disp);padding:0 15px;min-height:44px;
              cursor:pointer}
  .vk-waehlen:hover{background:#D8E8F2}
  .vk-ersetzen{flex:none;border:none;background:#F1F4F4;color:var(--soft);
               font:600 12.5px var(--disp);border-radius:10px;padding:0 13px;
               min-height:44px;cursor:pointer}
  .vk-ersetzen:hover{background:var(--teal-l);color:var(--teal-d)}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <a href="index.html" aria-label="Zur Übersicht" class="applogo-link"><img src="icons/icon.svg" alt="" class="applogo"></a>
    <div class="barwrap">
      <h1>Vorlagen</h1>
      <div class="sub" id="sub">wird geladen …</div>
    </div>
  </div>

  <div class="scroll">
    <div class="zahlzeile"><span class="zahl" id="zahl"></span>
      <span class="vz-regel">PDF zum Ausdrucken — keine Fotos</span></div>
    <div id="liste"></div>
    <!-- N247 — bewusst OHNE `capture`: hier gehoeren Roh-PDFs hin, keine
         abfotografierten Formulare. -->
    <input type="file" id="datei" hidden
           accept="application/pdf,.pdf,.doc,.docx,.odt">
  </div>

  <div data-nav></div>
</div>

<script type="module">
/* N240/N247 — Vorlagenarchiv: leere Formulare (Übergabeprotokoll,
   Selbstauskunft, Rauchwarnmelder-Abnahme, Wohnungsgeberbestätigung …),
   getrennt von den echten Belegen des Nutzers (Backend: dokumentvorlagen.py).

   N247: eine Zeile je Vorlagenart — der Katalog kommt aus dem Backend
   (`typen`), damit die Liste hier nicht doppelt gepflegt wird. Leere Zeilen
   zeigen ein Ablagefeld, gefüllte die Datei mit Ansehen/Ersetzen/Entfernen.
   Bewusst OHNE Kamera: für einen Vordruck taugt ein Foto nicht.

   Vorschau über dieselbe `belegAnsehen`-Ansicht wie überall sonst — ohne
   `/seiten`/`/vorschau`-Endpunkte fällt sie automatisch auf „Im neuen Tab
   öffnen" zurück (kein Duplikat, kein zweiter Vorschau-Weg). */
import { api, esc, melde, frage, belegAnsehen, installNav } from './assets/immo.js';

installNav();

const sub = document.getElementById('sub');
const zahl = document.getElementById('zahl');
const liste = document.getElementById('liste');
const dateifeld = document.getElementById('datei');

let vorlagen = [];
const DRUCKER_ICON = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none"
  stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
  stroke-linejoin="round" aria-hidden="true">
  <path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/>
  <path d="M6 14h12v7H6z"/></svg>`;
let typen = [];
let drucker = [];

/* Welche Art gerade eine Datei bekommt — gesetzt vom Knopf wie vom Ziehen. */
let zielTyp = null;

const vorlageZu = typ => vorlagen.find(v => v.typ === typ) || null;

function zeile(t) {
  const v = vorlageZu(t.typ);
  const quelle = v?.quelle_url
    ? `<button class="vk-quelle" type="button" data-quelle="${v.id}"
         title="Herkunft ansehen" aria-label="Herkunft ansehen">i</button>` : '';
  // N264 — je Drucker ein Knopf, rechts oben in der Titelzeile. Nur an
  // gefuellten Zeilen: eine Vorlage, die es nicht gibt, kann man nicht drucken.
  const druckKnoepfe = (v && drucker.length)
    ? `<span class="vk-druck">${drucker.map(d => `
        <button type="button" class="vk-dr" data-drucken="${v.id}"
          data-drucker="${esc(d.name)}"
          title="Auf ${esc(d.ort || d.name)} drucken (s/w, einseitig)"
          aria-label="Auf ${esc(d.ort || d.name)} drucken">
          ${DRUCKER_ICON}<span class="vk-dr-t">${esc(d.ort || d.name)}</span>
        </button>`).join('')}</span>`
    : '';
  const kopf = `<div class="vk-kopf">
        <span class="vk-name">${esc(t.name)}</span>
        ${quelle}
        ${druckKnoepfe}
      </div>`;
  const hinweis = t.hinweis ? `<p class="vk-hinweis">${esc(t.hinweis)}</p>` : '';
  if (!v) {
    // Der Zusatz „keine Fotos" steht EINMAL oben auf der Seite, nicht in
    // jeder der fünf Zeilen — sonst liest man denselben Satz fünfmal.
    return `<div class="vk leer" data-typ="${esc(t.typ)}">
        ${kopf}
        ${hinweis}
        <div class="vk-ablg">
          <span class="vk-ablg-t">PDF hier ablegen</span>
          <button class="vk-waehlen" type="button" data-waehlen="${esc(t.typ)}"
            >Datei wählen</button>
        </div>
      </div>`;
  }
  return `<div class="vk" data-typ="${esc(t.typ)}">
      ${kopf}
      ${hinweis}
      <div class="vk-fuss">
        <span class="vk-datei" title="${esc(v.pfad || v.dateiname || '')}"
          >${esc(v.dateiname || 'Datei')}</span>
        <button class="vk-ansehen" type="button" data-ansehen="${v.id}">Ansehen</button>
        <button class="vk-ersetzen" type="button" data-waehlen="${esc(t.typ)}"
          >Ersetzen</button>
        <button class="vk-loeschen" type="button" data-loeschen="${v.id}"
                aria-label="Vorlage entfernen" title="Vorlage entfernen">✕</button>
      </div>
    </div>`;
}

/* Eigene Vorlagen zu einer Art, die der Katalog nicht kennt, gehen nicht
   verloren — sie bekommen ihre eigene Zeile am Ende ihrer Gruppe. */
function zusatzTypen(zweck) {
  const bekannt = new Set(typen.filter(t => t.verwendungszweck === zweck)
                               .map(t => t.typ));
  return vorlagen
    .filter(v => v.verwendungszweck === zweck && !bekannt.has(v.typ))
    .map(v => ({ verwendungszweck: zweck, typ: v.typ, name: v.name,
                 hinweis: v.hinweis || '' }));
}

function gruppenHtml() {
  const zwecke = [...new Set([...typen.map(t => t.verwendungszweck),
                              ...vorlagen.map(v => v.verwendungszweck)])];
  return zwecke.map(zweck => {
    const reihen = [...typen.filter(t => t.verwendungszweck === zweck),
                    ...zusatzTypen(zweck)];
    return `<div class="vz-gruppe">
      <div class="vz-titel">${esc(zweck)}</div>
      ${reihen.map(zeile).join('')}
    </div>`;
  }).join('');
}

/* ---- Hochladen: Knopf und Ziehen enden beide hier -------------------- */

async function hochladen(typ, datei) {
  const t = typen.find(x => x.typ === typ);
  const name = t?.name || typ || datei.name;
  const zweck = t?.verwendungszweck || 'Vermietung';
  const frist = /\.(pdf|docx?|odt)$/i.test(datei.name);
  if (!frist) {
    return melde('Nur PDF- oder Textdokumente — ein Foto taugt nicht als '
      + 'Vordruck.', 'neg');
  }
  const paket = new FormData();
  paket.append('datei', datei, datei.name);
  const frage_ = new URLSearchParams({ name, verwendungszweck: zweck, typ });
  if (t?.hinweis) frage_.set('hinweis', t.hinweis);
  melde('Vorlage wird abgelegt …');
  try {
    const antwort = await fetch(`/api/dokumentvorlagen?${frage_}`,
                                { method: 'POST', body: paket });
    if (!antwort.ok) {
      const grund = await antwort.json().then(k => k.detail).catch(() => null);
      throw new Error(grund || `${antwort.status}`);
    }
  } catch (fehler) {
    return melde(String(fehler.message || fehler), 'neg');
  }
  melde('Vorlage gespeichert.', 'pos');
  await laden_();
}

dateifeld.addEventListener('change', async () => {
  const datei = dateifeld.files?.[0];
  const typ = zielTyp;
  dateifeld.value = '';
  zielTyp = null;
  if (datei && typ) await hochladen(typ, datei);
});

/* Ziehen und Ablegen — auf die Zeile, zu der die Vorlage gehört. */
const istDateiZug = e => [...(e.dataTransfer?.types || [])].includes('Files');
let zielZeile = null;
const markiere = z => {
  if (z === zielZeile) return;
  zielZeile?.classList.remove('dropziel');
  zielZeile = z || null;
  zielZeile?.classList.add('dropziel');
};
liste.addEventListener('dragover', e => {
  if (!istDateiZug(e)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  markiere(e.target.closest('.vk[data-typ]'));
});
liste.addEventListener('dragleave', e => {
  if (e.relatedTarget && liste.contains(e.relatedTarget)) return;
  markiere(null);
});
liste.addEventListener('drop', async e => {
  if (!istDateiZug(e)) return;
  e.preventDefault();
  const zeile_ = e.target.closest('.vk[data-typ]');
  const datei = [...(e.dataTransfer.files || [])][0];
  markiere(null);
  if (zeile_ && datei) await hochladen(zeile_.dataset.typ, datei);
});
// Ausserhalb der Zeilen fallen gelassen: der Browser soll die Datei nicht
// einfach anzeigen und die Seite verlassen.
document.addEventListener('dragover', e => { if (istDateiZug(e)) e.preventDefault(); });
document.addEventListener('drop', e => {
  if (istDateiZug(e) && !e.target.closest('.vk[data-typ]')) e.preventDefault();
});

liste.addEventListener('click', async e => {
  const waehlen = e.target.closest('[data-waehlen]');
  if (waehlen) {
    zielTyp = waehlen.dataset.waehlen;
    dateifeld.click();
    return;
  }
  const drucken = e.target.closest('[data-drucken]');
  if (drucken) {
    e.preventDefault();
    const wohin = drucken.dataset.drucker;
    drucken.disabled = true;
    try {
      const antwort = await api(
        `/dokumentvorlagen/${drucken.dataset.drucken}/drucken`
        + `?drucker=${encodeURIComponent(wohin)}`, { method: 'POST' });
      melde(antwort.meldung || 'An den Drucker geschickt', 'pos');
    } catch (fehler) {
      melde(fehler?.message || 'Der Druckauftrag hat nicht geklappt', 'neg');
    } finally {
      drucken.disabled = false;
    }
    return;
  }

  const ansehen = e.target.closest('[data-ansehen]');
  if (ansehen) {
    const v = vorlagen.find(x => x.id === Number(ansehen.dataset.ansehen));
    if (!v) return;
    belegAnsehen(`/api/dokumentvorlagen/${v.id}/inhalt`, v.name, v.pfad || '', null);
    return;
  }
  const quelle = e.target.closest('[data-quelle]');
  if (quelle) {
    const v = vorlagen.find(x => x.id === Number(quelle.dataset.quelle));
    if (!v) return;
    melde(`Herkunft: ${v.quelle_url}`);
    return;
  }
  const loeschen = e.target.closest('[data-loeschen]');
  if (!loeschen) return;
  const id = Number(loeschen.dataset.loeschen);
  const ok = await frage('Vorlage entfernen',
    'Nur der Eintrag hier verschwindet — die Datei bleibt unangetastet in der '
    + 'Nextcloud und lässt sich bei Bedarf erneut hochladen.',
    { knopf: 'Entfernen', gefahr: true });
  if (!ok) return;
  try {
    await api(`/dokumentvorlagen/${id}`, { method: 'DELETE' });
    melde('Vorlage entfernt');
    await laden_();
  } catch (fehler) {
    melde(String(fehler.message || fehler), 'neg');
  }
});

async function laden_() {
  let d;
  try {
    d = await api('/dokumentvorlagen');
    // N264 — die Drucker des Hauses. Fehlt der Dienst, bleibt es bei
    // einer leeren Liste: dann zeigt die Seite keine Druckknoepfe,
    // statt welche anzubieten, die ins Leere laufen.
    try { drucker = (await api('/drucker')).drucker || []; }
    catch { drucker = []; }
  } catch {
    sub.textContent = 'API nicht erreichbar';
    liste.innerHTML = `<div class="empty"><div class="big">Keine Verbindung</div>
      <p>Das Vorlagenarchiv konnte nicht geladen werden.</p></div>`;
    return;
  }

  vorlagen = d.vorlagen || [];
  typen = d.typen || [];
  const offen = typen.filter(t => !vorlageZu(t.typ)).length;
  zahl.textContent = `${d.anzahl} von ${typen.length} hinterlegt`;
  sub.textContent = offen
    ? `${offen} ${offen === 1 ? 'Vorlage fehlt' : 'Vorlagen fehlen'} noch`
    : 'Alle Vorlagen hinterlegt';
  liste.innerHTML = gruppenHtml();
}

await laden_();
</script>
</body>
</html>
