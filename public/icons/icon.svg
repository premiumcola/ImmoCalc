<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- N318 — Variante C „Modern-Linie": das alte Dach lag dunkel auf
       aehnlich dunklem Grund, dazu ragte ein Balken (die "unklare Linie")
       nur zur Haelfte unterm Dach hervor. Jetzt heller Grund, reine Kontur
       plus ein Vollton-Punkt als Tuer. -->
  <rect width="512" height="512" rx="112" fill="#EEF1F0"/>
  <path d="M128 248 256 138 384 248" fill="none" stroke="#16262C"
        stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M152 232 V 392 H 360 V 232" fill="none" stroke="#16262C"
        stroke-width="20" stroke-linejoin="round"/>
  <circle cx="256" cy="304" r="34" fill="#0F6E5C"/>
</svg>
