<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ImmoCalc</title>
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#E8ECEC">
<meta name="robots" content="noindex">
<meta name="description" content="ImmoCalc — Nebenkostenabrechnung selbst gemacht. Zugang nur mit Einladung.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* N496 — die öffentliche Startseite. ZWEI Zustände, die den Platz tauschen.
 *
 * Nutzer: „mach die vier Elemente nach oben und kräftig, solange man keinen
 * Einladungscode eingegeben hat … und unten drunter nur dieses kleine
 * Einladungsfenster. Wenn man das Einladungsfenster eindrückt, dann rutschen
 * die runter und die Anmeldung ist grösser und dominant. Also die tauschen
 * Platz."
 *
 * Zustand RUHE (Ankunft): vier grosse Merkmale oben, zwei mal zwei; darunter
 * nur eine schmale Zeile „Zugang nur mit Einladung".
 * Zustand ZUGANG (angetippt): die Karte wird gross und dominant, die Merkmale
 * rutschen darunter und werden klein.
 *
 * In BEIDEN Zuständen stehen die Merkmale ohne eigenen Kasten direkt auf dem
 * Grund — nur das getönte Zeichen trägt Farbe (Wunsch des Nutzers; die hellen
 * Kästchen davor zerschnitten die Fläche in acht Rechtecke).
 *
 * Die Geschichte davor, damit sie niemand rückwärts geht: erst vier grosse
 * Blasen nebeneinander (N493, lief am PC quer über den halben Schirm), dann
 * untereinander und neutraler (N494, daraus wurden Badeperlen). Ursache beide
 * Male: eine Seifenblase über fast weissem Grund ist unsichtbar — es gibt
 * nichts zu brechen —, und die mit weisser Füllung NACHGEBAUTE Durchsichtig-
 * keit macht zwangsläufig Kugeln daraus. Seit N495 ist die Blase aufgegeben.
 *
 * Bewusst OHNE `assets/immo.css` und ohne ein einziges App-Modul: diese Seite
 * sieht jeder Fremde, sie soll nichts über die Anwendung mitliefern und nicht
 * auf eine Sitzung warten.
 */
:root{
  --paper:#E8ECEC; --sheet:#FFFFFF; --ink:#16262C; --soft:#5C6B70;
  --line:#D6DCDD; --teal:#0F6E5C; --teal-l:#DCEBE6; --teal-d:#0B574A;
  --neg:#B24229;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:var(--body); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.45;
  background:
    radial-gradient(110% 70% at 20% 4%,  #F2F6F5 0%, transparent 56%),
    radial-gradient(100% 60% at 86% 96%, #DDE7E5 0%, transparent 58%),
    var(--paper);
  min-height:100dvh; display:flex; flex-direction:column;
  align-items:center;
  padding:calc(48px + env(safe-area-inset-top)) 20px
          calc(40px + env(safe-area-inset-bottom));
}
/* N499 — ein Rahmen um den Inhalt. Nutzer: „das ist zu gedrungen, zieh einen
   Rahmen rum wie davor." Ohne ihn klebte alles direkt auf dem Grund und hatte
   keinen Rand, an dem das Auge zur Ruhe kommt — die Abstände sahen deshalb
   enger aus, als sie waren. Derselbe Aufbau wie der Anmeldescreen: eine
   helle Karte, mittig, mit grosszügigem Innenabstand. */
.blatt{
  /* N500 — `margin:auto` statt `justify-content:center` am Körper: zentriert
     genauso, schneidet bei zu wenig Höhe aber nicht oben ab, sondern lässt
     nach unten rollen. */
  margin:auto;
  width:100%; max-width:440px; text-align:center;
  display:flex; flex-direction:column;
  background:var(--sheet); border-radius:24px;
  padding:36px 26px 26px;
  box-shadow:0 26px 64px -34px rgba(22,38,44,.45),
             inset 0 0 0 1px rgba(255,255,255,.85);
}

/* ---- Kopf ----
   N498 — Zeichen und Wortmarke stehen nebeneinander, nicht übereinander
   (Nutzer: „Logo und dahinter direkt ImmoCalc"). Der Kopf wird dadurch eine
   Zeile flach statt drei — genau der Platz, den die Merkmale darunter
   bekommen sollen. */
header{order:1}
.kopfzeile{display:flex; align-items:center; justify-content:center; gap:12px}
/* N499 — getönt statt weiss: seit der Rahmen selbst weiss ist, wäre ein
   weisses Zeichenfeld darauf unsichtbar. */
.marke{
  width:54px; height:54px; border-radius:16px; flex:none;
  background:var(--teal-l); color:var(--teal-d);
  display:flex; align-items:center; justify-content:center;
}
.marke svg{width:32px; height:32px}
/* N504 — grösser. Das Zeichen daneben wächst mit, sonst rutscht die
   Wortmarke optisch aus der Zeile. */
h1{font:700 clamp(31px,8.5vw,40px) var(--disp); letter-spacing:-.03em;
   margin:0; line-height:1}
/* N500 — der Leitspruch liest sich als Zitat: kursiv und in deutschen
   Anführungszeichen. Die Zeichen kommen aus der Gestaltung, nicht aus dem
   Text — so bleibt der Spruch selbst sauberer Klartext (auch fürs Vorlesen).
   Sie stehen bewusst IM Textfluss und nicht absolut gesetzt: bei einem
   mittig gesetzten Zweizeiler würden sie sonst irgendwo am Rand kleben. */
.unterzeile{font:italic 400 14px var(--body); color:var(--soft);
            line-height:1.6; margin:16px auto 0; max-width:30ch}
.unterzeile:empty{display:none}
.unterzeile::before{content:'\201E'}
.unterzeile::after{content:'\201C'}
.unterzeile::before,.unterzeile::after{
  font:600 15px var(--disp); font-style:normal; color:#B8C4C5}

/* ---- Die Merkmale ---------------------------------------------------
   Kein eigener Kasten, in keinem Zustand: sie stehen direkt auf dem Grund,
   Farbe trägt nur das Zeichen. Der Wechsel zwischen gross und klein läuft
   über Übergänge an Grösse und Abstand — die Reihenfolge selbst springt
   (`order` lässt sich nicht weich bewegen), deshalb legt sich ein kurzes
   Aufblenden darüber, damit der Sprung als Absicht gelesen wird. */
/* N504 — Nutzer: „zieh die Information noch ein bisschen weiter
   auseinander — die Logos in der Mitte und unten dann ein bisschen Abstand
   und dann die Fusszeile mit dem Anmeldeding." Die Merkmale stehen jetzt
   mit Luft nach beiden Seiten in der Mitte, der Zugang rückt deutlich ab. */
.merkmale{
  order:2; display:grid; gap:26px; margin:40px 0 0;
  grid-template-columns:repeat(2,1fr);
  transition:gap .3s ease, margin .3s ease;
}
.merkmal{
  display:flex; flex-direction:column; align-items:center; gap:9px;
  padding:6px 4px; text-align:center;
}
.m-ic{
  width:74px; height:74px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
  background:var(--ton-bg); color:var(--ton);
  transition:width .3s ease, height .3s ease, background .3s ease;
}
.m-ic svg{width:56%; height:56%; display:block}
.m-wort{font:600 12.5px var(--body); color:var(--ink); line-height:1.35;
        transition:font-size .3s ease, color .3s ease}

/* ---- Der Zugang ---- */
.zugang{order:3; margin-top:44px; text-align:left}

/* Zustand RUHE: nur eine schlichte Zeile, kein Kasten.
   Nutzer: „der Hinweis mit Zugang mit Einladungscode freischalten — das soll
   unscheinbar ohne Kasten im Hintergrund ganz unten stehen." Der Rahmen davor
   machte daraus eine Schaltfläche, die mit den Merkmalen um Aufmerksamkeit
   stritt. Jetzt steht da Text; dass er anfassbar ist, sagt allein die Farbe
   und der Pfeil. */
.zugang .schmal{
  width:100%; min-height:44px; border:none; background:none;
  color:var(--soft); cursor:pointer; font:500 12.5px var(--body);
  display:flex; align-items:center; justify-content:center; gap:7px;
  padding:0 8px; transition:color .2s;
}
.zugang .schmal:hover{color:var(--teal-d)}
.zugang .schmal:focus-visible{outline:2px solid var(--teal);
  outline-offset:2px; border-radius:10px}
.zugang .schmal svg{width:14px; height:14px; flex:none; opacity:.8}
/* N504 — ein schlichter Briefumschlag vor der Zeile. Nutzer: „vielleicht
   davor noch ein schlichtes hellgraues E-Mail-Logo". Bewusst grösser als der
   Pfeil und in einem sehr zurückgenommenen Grau: er soll die Zeile
   kennzeichnen, nicht sie anführen. */
.zugang .schmal .brief{width:19px; height:19px; opacity:1; color:#AFBBBD;
                       transition:color .2s}
.zugang .schmal:hover .brief{color:var(--teal)}

/* Zustand ZUGANG: die volle Karte. */
/* N499 — Papierton statt weiss, aus demselben Grund wie beim Zeichen: die
   Karte liegt jetzt IM weissen Rahmen und muss sich von ihm absetzen, nicht
   von der Seite. */
.karte{
  background:var(--paper); border-radius:16px; padding:18px 16px 12px;
  box-shadow:inset 0 0 0 1px rgba(22,38,44,.07);
}
.karte .kopf{font:600 9.5px var(--mono); letter-spacing:.1em;
  text-transform:uppercase; color:var(--teal); margin:0 0 7px}
.karte p.text{margin:0 0 14px; font:400 12.5px var(--body); color:var(--soft);
  line-height:1.55}
.karte label{display:block; font:600 9.5px var(--mono); letter-spacing:.09em;
  text-transform:uppercase; color:var(--soft); margin-bottom:6px}
.karte input{
  width:100%; min-height:46px; border-radius:12px; border:1.5px solid #C9D4D4;
  background:var(--sheet); padding:11px 13px; color:var(--ink);
  font:600 16px var(--mono); letter-spacing:.06em; text-align:center;
}
.karte input:focus{outline:none; border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(15,110,92,.14)}
.karte .los{
  width:100%; min-height:48px; margin-top:10px; border:none; border-radius:12px;
  background:var(--teal); color:#fff; cursor:pointer; font:600 14px var(--body);
}
.karte .los:hover{background:var(--teal-d)}
.karte .los:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
.fehler{margin:9px 0 0; font:500 12px var(--body); color:var(--neg);
        min-height:1.1em}
.schon{display:inline-block; font:500 12px var(--body); color:var(--soft);
       text-decoration:none; padding:10px 4px; min-height:44px}
.schon:hover{color:var(--teal-d)}

/* ---- Der Wechsel: die beiden tauschen den Platz -------------------- */
.blatt.offen .zugang{order:2; margin-top:24px}
.blatt.offen .merkmale{
  order:3; margin-top:28px; gap:6px; grid-template-columns:repeat(4,1fr);
}
.blatt.offen .m-ic{width:30px; height:30px}
.blatt.offen .m-wort{font-size:9px; color:var(--soft)}
/* Ein kurzes Aufblenden verdeckt den Sprung der Reihenfolge. */
@keyframes tausch{from{opacity:0; transform:translateY(8px)} to{opacity:1}}
.blatt.wechselt .merkmale,.blatt.wechselt .zugang{
  animation:tausch .34s ease-out both;
}
@media (prefers-reduced-motion:reduce){
  .merkmale,.m-ic,.m-wort{transition:none}
  .blatt.wechselt .merkmale,.blatt.wechselt .zugang{animation:none}
}

/* N500 — t1 war Grün und damit der Ton des Logos: das Zeichen sah aus
   wie ein zweites Markenzeichen statt wie ein Merkmal. Jetzt Graphit —
   farblos, ruhig, und zu den drei anderen klar unterscheidbar. */
.t1{--ton:#4E5C64; --ton-bg:#DCE3E6}
.t2{--ton:#6D4A9C; --ton-bg:#E7DFF4}
.t3{--ton:#1F6A8C; --ton-bg:#D9EAF2}
.t4{--ton:#916212; --ton-bg:#F4E6C8}

/* ---- Der Gruss, ganz unten ----
   N499/N500 — „vibecoded ♥ with Claude 👾": das Herz hinter „vibecoded",
   der Invader hinter dem Namen. Beide bewegen sich, aber verschieden — sonst
   wären es zwei gleich blinkende Punkte statt zweier Figuren.

   Bewusst ein Doppelschlag (zwei Ausschläge dicht hintereinander, dann eine
   lange Pause) statt eines gleichmässigen Pulsierens: nur so liest man es
   als Herzschlag und nicht als blinkendes Element. */
.gruss{order:4; margin:26px 0 0; font:500 11.5px var(--body); color:#93A3A3;
       display:flex; align-items:center; justify-content:center; gap:5px}
.gruss .herz{
  color:var(--neg); font-size:12.5px; display:inline-block;
  transform-origin:center;
  animation:herzschlag 2.6s ease-in-out infinite;
}
@keyframes herzschlag{
  0%,62%,100%{transform:scale(1)}
  68%{transform:scale(1.34)}
  74%{transform:scale(1.02)}
  80%{transform:scale(1.2)}
  88%{transform:scale(1)}
}
@media (prefers-reduced-motion:reduce){ .gruss .herz{animation:none} }

/* N500 — der Claude-Invader hinter dem Namen. Zwei Stellungen im harten
   Wechsel plus ein Hüpfer: so marschiert er, statt zu blinken. */
.invader{display:inline-block; line-height:0; color:#C1603C;
  vertical-align:-1px;
  animation:iv-huepf 1s steps(1,end) infinite}
.invader svg{width:14px; height:auto; display:block}
.iv-a{animation:iv-eins 1s steps(1,end) infinite}
.iv-b{animation:iv-zwei 1s steps(1,end) infinite}
@keyframes iv-eins{0%{opacity:1} 50%,100%{opacity:0}}
@keyframes iv-zwei{0%{opacity:0} 50%,100%{opacity:1}}
@keyframes iv-huepf{0%{transform:translateY(0)} 50%,100%{transform:translateY(-1.5px)}}
@media (prefers-reduced-motion:reduce){
  .invader,.iv-a{animation:none}
  .iv-b{animation:none; opacity:0}
}

</style>
</head>
<body>

<div class="blatt" id="blatt">
  <header>
    <div class="kopfzeile">
      <span class="marke">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3.6 10.4 12 3.6l8.4 6.8V20a1.4 1.4 0 0 1-1.4 1.4H5A1.4 1.4 0 0 1 3.6 20Z"/>
          <path d="M9.4 21.4v-6.6h5.2v6.6"/>
        </svg>
      </span>
      <h1>ImmoCalc</h1>
    </div>
    <p class="unterzeile" id="spruch"></p>
  </header>

  <div class="merkmale" id="merkmale"></div>

  <div class="zugang">
    <button type="button" class="schmal" id="aufmachen"
            aria-expanded="false" aria-controls="karte">
      <svg class="brief" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true">
        <rect x="2.8" y="5.4" width="18.4" height="13.2" rx="2.3"/>
        <path d="m3.4 7.2 7.5 5.2a2 2 0 0 0 2.2 0l7.5-5.2"/>
      </svg>
      Zugang mit Einladungscode freischalten
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></svg>
    </button>

    <div class="karte" id="karte" hidden>
      <p class="kopf">Zugang nur mit Einladung</p>
      <p class="text">Trag den Code aus deiner Einladungs-E-Mail ein — danach
        geht es zur Einrichtung deines Zugangs.</p>
      <label for="code">Einladungscode</label>
      <input id="code" type="text" inputmode="text" autocomplete="off"
             autocapitalize="characters" spellcheck="false"
             placeholder="XXXX-XXXX-XXXX" maxlength="40">
      <button type="button" class="los" id="los">Weiter</button>
      <p class="fehler" id="fehler" role="status"></p>
      <!-- N493 — ohne diesen Weg landet ein bereits eingerichteter Nutzer nach
           jeder abgelaufenen Sitzung auf einer Seite, die einen Einladungscode
           von ihm verlangt, den er nicht hat. Leise, aber vorhanden. -->
      <a class="schon" href="anmeldung.html">Ich bin schon eingerichtet</a>
    </div>
  </div>

  <p class="gruss">vibecoded <span class="herz">♥</span> with Claude <span class="invader" aria-hidden="true"><svg viewBox="0 0 11 8" fill="currentColor" shape-rendering="crispEdges"><g class="iv-a"><rect x="2" y="0" width="1" height="1"/><rect x="8" y="0" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="7" y="1" width="1" height="1"/><rect x="2" y="2" width="7" height="1"/><rect x="1" y="3" width="2" height="1"/><rect x="4" y="3" width="3" height="1"/><rect x="8" y="3" width="2" height="1"/><rect x="0" y="4" width="11" height="1"/><rect x="0" y="5" width="1" height="1"/><rect x="2" y="5" width="7" height="1"/><rect x="10" y="5" width="1" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="2" y="6" width="1" height="1"/><rect x="8" y="6" width="1" height="1"/><rect x="10" y="6" width="1" height="1"/><rect x="3" y="7" width="2" height="1"/><rect x="6" y="7" width="2" height="1"/></g><g class="iv-b"><rect x="2" y="0" width="1" height="1"/><rect x="8" y="0" width="1" height="1"/><rect x="0" y="1" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="7" y="1" width="1" height="1"/><rect x="10" y="1" width="1" height="1"/><rect x="0" y="2" width="1" height="1"/><rect x="2" y="2" width="7" height="1"/><rect x="10" y="2" width="1" height="1"/><rect x="0" y="3" width="3" height="1"/><rect x="4" y="3" width="3" height="1"/><rect x="8" y="3" width="3" height="1"/><rect x="0" y="4" width="11" height="1"/><rect x="1" y="5" width="9" height="1"/><rect x="2" y="6" width="1" height="1"/><rect x="8" y="6" width="1" height="1"/><rect x="1" y="7" width="1" height="1"/><rect x="9" y="7" width="1" height="1"/></g></svg></span></p>
</div>

<script type="module">
/* Die vier Merkmale. Als Daten und nicht als Markup, damit Reihenfolge und
   Töne an einer Stelle stehen. */
const STRICH = 'fill="none" stroke="currentColor" stroke-width="1.9" '
  + 'stroke-linecap="round" stroke-linejoin="round"';

/* N497 — der Leitspruch wechselt bei jedem Aufruf.
 *
 * Nutzer: „wieso echte und echte? Wieso die Wiederholung." — zurecht: da
 * stand „für echte Objekte mit echten Mieterdaten", eine Dopplung, die
 * ausserdem nach Werbebroschüre klang. Und: „mach immer 'n anderen Spruch."
 *
 * Der Ton, den er vorgegeben hat: es einfach machen und dabei zwinkern, weil
 * eine Nebenkostenabrechnung normalerweise niemandem Spass macht und kaum
 * jemand sie versteht. Deshalb keine Versprechen, die niemand glaubt („macht
 * Spass!"), sondern Einschränkungen, die das Zwinkern tragen: „fast", „muss
 * ja nicht", „klingt schlimmer, als es ist".
 *
 * Bewusst ohne Speicher: jeder Aufruf zieht neu. Einen zuletzt gezeigten
 * Spruch zu merken hiesse, dem Besucher der ÖFFENTLICHEN Seite etwas ins
 * Gerät zu schreiben — für einen Gag nicht angemessen.
 */
const SPRUECHE = [
  'Die einzige Nebenkostenabrechnung, auf die man sich fast freut.',
  'Belege fotografieren, Haken setzen, fertig — so war das mal gedacht.',
  'Einmal im Jahr Nebenkosten — muss ja kein ganzes Wochenende fressen!',
  'Umlagefähig, zeitanteilig, § 35a. Klingt schlimmer, als es sein muss.',
];
document.getElementById('spruch').textContent =
  SPRUECHE[Math.floor(Math.random() * SPRUECHE.length)];

const MERKMALE = [
  { ton: 't1', wort: 'Verschlüsselte<br>Backups', bild: `
      <rect x="3.5" y="4" width="17" height="16" rx="2.6"/>
      <path d="M17.7 9.7v4.6"/><circle cx="10.6" cy="12" r="3.4"/>` },
  { ton: 't2', wort: 'Intelligente<br>Beleganalyse', bild: `
      <path d="M12 5.2v14.2"/>
      <path d="M12 6.6c-1-1.6-2.9-2-4.3-1.2S6 7.9 6.5 9.2c-1.5.5-2.3 1.9-1.8 3.3
               s1.8 2 1.8 2c-.7 1.3-.3 2.9 1 3.6s2.9.3 3.6-.9"/>
      <path d="M12 6.6c1-1.6 2.9-2 4.3-1.2S18 7.9 17.5 9.2c1.5.5 2.3 1.9 1.8 3.3
               s-1.8 2-1.8 2c.7 1.3.3 2.9-1 3.6s-2.9.3-3.6-.9"/>` },
  { ton: 't3', wort: 'Modular<br>aufgebaut', bild: `
      <rect x="3.6" y="3.6" width="7.4" height="7.4" rx="2"/>
      <rect x="13" y="3.6" width="7.4" height="7.4" rx="2"/>
      <rect x="3.6" y="13" width="7.4" height="7.4" rx="2"/>
      <path d="M16.7 13v7.4M13 16.7h7.4"/>` },
  { ton: 't4', wort: 'Zwei-Faktor-<br>Anmeldung', bild: `
      <path d="M12 3.2 19.4 6v6.1c0 4.2-3 7.2-7.4 8.6-4.4-1.4-7.4-4.4-7.4-8.6V6Z"/>
      <path d="m8.9 12.1 2.2 2.2 4-4.3"/>` },
];

document.getElementById('merkmale').innerHTML = MERKMALE.map(m => `
  <div class="merkmal ${m.ton}">
    <span class="m-ic"><svg viewBox="0 0 24 24" aria-hidden="true" ${STRICH}
      >${m.bild}</svg></span>
    <span class="m-wort">${m.wort}</span>
  </div>`).join('');

/* Der Wechsel. Einmal hin, nicht zurück: wer den Zugang geöffnet hat, will
   ihn benutzen — ihn wieder zuklappen zu lassen, wäre ein Knopf, der die
   Arbeit rückgängig macht, die man gerade angefangen hat. */
const blatt = document.getElementById('blatt');
const karte = document.getElementById('karte');
const aufmachen = document.getElementById('aufmachen');
const feld = document.getElementById('code');
const fehler = document.getElementById('fehler');

aufmachen.addEventListener('click', () => {
  aufmachen.hidden = true;
  karte.hidden = false;
  aufmachen.setAttribute('aria-expanded', 'true');
  blatt.classList.add('offen', 'wechselt');
  // Die Klasse für das Aufblenden wieder abnehmen, sonst läuft sie bei jeder
  // späteren Änderung an diesen Elementen erneut.
  setTimeout(() => blatt.classList.remove('wechselt'), 400);
  setTimeout(() => feld.focus(), 80);
});

/* Der Code wird hier NICHT geprüft — das tut der Server auf der Anmeldeseite.
   Hier geht es nur darum, ihn mitzunehmen, damit niemand zweimal tippt. */
function weiter() {
  const code = feld.value.trim();
  if (code.length < 4) {
    fehler.textContent = 'Bitte den Code aus der Einladungs-E-Mail eintragen.';
    feld.focus();
    return;
  }
  fehler.textContent = '';
  location.href = `anmeldung.html?code=${encodeURIComponent(code)}`;
}

document.getElementById('los').addEventListener('click', weiter);
feld.addEventListener('keydown', e => { if (e.key === 'Enter') weiter(); });
</script>
</body>
</html>
