<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ImmoCalc</title>
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#E8ECEC">
<meta name="robots" content="noindex">
<meta name="description" content="ImmoCalc — Nebenkostenabrechnung für echte Objekte. Zugang nur mit Einladung.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* N495 — die öffentliche Startseite, dritte und letzte Fassung.
 *
 * Die Geschichte dieser Datei in drei Sätzen, damit sie niemand rückwärts
 * geht: Zuerst standen vier grosse Blasen NEBENEINANDER (N493) — am PC liefen
 * sie quer über den halben Schirm. Dann untereinander und neutraler (N494) —
 * daraus wurden Badeperlen, weil eine Seifenblase über fast weissem Grund
 * unsichtbar ist und ich die Durchsichtigkeit mit weisser Füllung und
 * Innenschattierung NACHGEBAUT habe. Genau das macht Kugeln daraus.
 *
 * Nutzer danach: „machen wir das viel unscheinbarer, kleiner, irgendwie unten
 * hin. Die Animationseffekte grossteils raus. Eher im Design wie C, ruhige
 * Scheiben. Deutlich kleiner und nicht zwangsweise rund, einfach vier
 * nebeneinander. Das heisst, die Startseite zeigt dann schon die Anmeldung
 * bzw. den Hinweis, dass man sich mit Einladung anmelden kann."
 *
 * Also umgedreht: der ZUGANG ist der Hauptgegenstand, die Merkmale sind eine
 * leise Zeile darunter — über dem Gruss, wie in den Einstellungen. Keine
 * Bewegung mehr: sie sind eine Fussnote, kein Schauplatz.
 *
 * Bewusst OHNE `assets/immo.css` und ohne ein einziges App-Modul: diese Seite
 * sieht jeder Fremde, sie soll nichts über die Anwendung mitliefern und nicht
 * auf eine Sitzung warten. Die Farben stehen deshalb hier noch einmal — es
 * sind dieselben Werte wie in immo.css, nur kopiert statt geladen.
 */
:root{
  --paper:#E8ECEC; --sheet:#FFFFFF; --ink:#16262C; --soft:#5C6B70;
  --line:#D6DCDD; --teal:#0F6E5C; --teal-l:#DCEBE6; --teal-d:#0B574A;
  --neg:#B24229;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:var(--body); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.45;
  background:
    radial-gradient(110% 70% at 20% 4%,  #F2F6F5 0%, transparent 56%),
    radial-gradient(100% 60% at 86% 96%, #DDE7E5 0%, transparent 58%),
    var(--paper);
  min-height:100dvh; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:calc(30px + env(safe-area-inset-top)) 20px
          calc(22px + env(safe-area-inset-bottom));
}
.blatt{width:100%; max-width:420px; text-align:center}

/* ---- Kopf ---- */
.marke{
  width:56px; height:56px; border-radius:16px; margin:0 auto 13px;
  background:var(--sheet); color:var(--teal);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 22px -14px rgba(22,38,44,.5);
}
.marke svg{width:32px; height:32px}
h1{font:700 clamp(27px,7vw,34px) var(--disp); letter-spacing:-.03em;
   margin:0; line-height:1.05}
.unterzeile{font:400 13.5px var(--body); color:var(--soft); line-height:1.55;
            margin:9px auto 0; max-width:34ch}

/* ---- Der Zugang: jetzt der Hauptgegenstand der Seite ---------------- */
.zugang{
  background:var(--sheet); border-radius:18px; padding:20px 18px 14px;
  margin-top:22px; text-align:left;
  box-shadow:0 12px 34px -22px rgba(22,38,44,.55),
             inset 0 0 0 1px rgba(255,255,255,.7);
}
.zugang .kopf{font:600 9.5px var(--mono); letter-spacing:.1em;
  text-transform:uppercase; color:var(--teal); margin:0 0 7px}
.zugang p.text{margin:0 0 14px; font:400 12.5px var(--body); color:var(--soft);
          line-height:1.55}
.zugang label{display:block; font:600 9.5px var(--mono); letter-spacing:.09em;
  text-transform:uppercase; color:var(--soft); margin-bottom:6px}
.zugang input{
  width:100%; min-height:46px; border-radius:12px; border:1.5px solid #C9D4D4;
  background:var(--paper); padding:11px 13px; color:var(--ink);
  font:600 16px var(--mono); letter-spacing:.06em; text-align:center;
}
.zugang input:focus{outline:none; border-color:var(--teal);
  background:var(--sheet); box-shadow:0 0 0 3px rgba(15,110,92,.14)}
.zugang .los{
  width:100%; min-height:48px; margin-top:10px; border:none; border-radius:12px;
  background:var(--teal); color:#fff; cursor:pointer; font:600 14px var(--body);
}
.zugang .los:hover{background:var(--teal-d)}
.zugang .los:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
.fehler{margin:9px 0 0; font:500 12px var(--body); color:var(--neg);
        min-height:1.1em}
.schon{display:inline-block; font:500 12px var(--body);
       color:var(--soft); text-decoration:none; padding:10px 4px;
       min-height:44px}
.schon:hover{color:var(--teal-d)}

/* ---- Die Merkmale: klein, ruhig, über dem Gruss --------------------
   Die Form aus Fassung C: eine zarte Tönung in der Farbe des Merkmals, wie
   die Symbolflächen in der App — nur klein. Vier nebeneinander, auf schmalem
   Schirm zwei mal zwei. Keine Bewegung. */
.merkmale{
  display:grid; grid-template-columns:repeat(2,1fr); gap:8px;
  margin-top:24px;
}
@media (min-width:400px){ .merkmale{grid-template-columns:repeat(4,1fr)} }
.merkmal{
  display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:10px 5px; border-radius:12px; background:rgba(255,255,255,.5);
  text-align:center;
}
.m-ic{
  width:27px; height:27px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
  background:var(--ton-bg); color:var(--ton);
}
.m-ic svg{width:16px; height:16px; display:block}
.m-wort{font:600 9px var(--body); color:var(--soft); line-height:1.35;
        letter-spacing:.01em}

.t1{--ton:#2E7D4F; --ton-bg:#DDEEE2}
.t2{--ton:#6D4A9C; --ton-bg:#EFE9F7}
.t3{--ton:#1F6A8C; --ton-bg:#E2EEF4}
.t4{--ton:#916212; --ton-bg:#F6EBD3}

/* ---- Der Gruss, ganz unten — derselbe wie in den Einstellungen ---- */
.gruss{margin:16px 0 0; font:500 11.5px var(--body); color:#93A3A3}
.gruss .herz{color:var(--neg); font-size:12.5px}
</style>
</head>
<body>

<div class="blatt">
  <span class="marke">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3.6 10.4 12 3.6l8.4 6.8V20a1.4 1.4 0 0 1-1.4 1.4H5A1.4 1.4 0 0 1 3.6 20Z"/>
      <path d="M9.4 21.4v-6.6h5.2v6.6"/>
    </svg>
  </span>
  <h1>ImmoCalc</h1>
  <p class="unterzeile">Nebenkostenabrechnung für echte Objekte mit echten
    Mieterdaten.</p>

  <div class="zugang">
    <p class="kopf">Zugang nur mit Einladung</p>
    <p class="text">Trag den Code aus deiner Einladungs-E-Mail ein — danach
      geht es zur Einrichtung deines Zugangs.</p>
    <label for="code">Einladungscode</label>
    <input id="code" type="text" inputmode="text" autocomplete="off"
           autocapitalize="characters" spellcheck="false"
           placeholder="XXXX-XXXX-XXXX" maxlength="40">
    <button type="button" class="los" id="los">Weiter</button>
    <p class="fehler" id="fehler" role="status"></p>
    <!-- N493 — ohne diesen Weg landet ein bereits eingerichteter Nutzer nach
         jeder abgelaufenen Sitzung auf einer Seite, die einen Einladungscode
         von ihm verlangt, den er nicht hat. Leise, aber vorhanden. -->
    <a class="schon" href="anmeldung.html">Ich bin schon eingerichtet</a>
  </div>

  <div class="merkmale" id="merkmale"></div>

  <p class="gruss">vibecoded with <span class="herz">♥</span> by Claude</p>
</div>

<script type="module">
/* Die vier Merkmale. Als Daten und nicht als Markup, damit Reihenfolge und
   Töne an einer Stelle stehen. */
const STRICH = 'fill="none" stroke="currentColor" stroke-width="1.9" '
  + 'stroke-linecap="round" stroke-linejoin="round"';

const MERKMALE = [
  { ton: 't1', wort: 'Verschlüsselte<br>Backups', bild: `
      <rect x="3.5" y="4" width="17" height="16" rx="2.6"/>
      <path d="M17.7 9.7v4.6"/><circle cx="10.6" cy="12" r="3.4"/>` },
  { ton: 't2', wort: 'Intelligente<br>Beleganalyse', bild: `
      <path d="M12 5.2v14.2"/>
      <path d="M12 6.6c-1-1.6-2.9-2-4.3-1.2S6 7.9 6.5 9.2c-1.5.5-2.3 1.9-1.8 3.3
               s1.8 2 1.8 2c-.7 1.3-.3 2.9 1 3.6s2.9.3 3.6-.9"/>
      <path d="M12 6.6c1-1.6 2.9-2 4.3-1.2S18 7.9 17.5 9.2c1.5.5 2.3 1.9 1.8 3.3
               s-1.8 2-1.8 2c.7 1.3.3 2.9-1 3.6s-2.9.3-3.6-.9"/>` },
  { ton: 't3', wort: 'Modular<br>aufgebaut', bild: `
      <rect x="3.6" y="3.6" width="7.4" height="7.4" rx="2"/>
      <rect x="13" y="3.6" width="7.4" height="7.4" rx="2"/>
      <rect x="3.6" y="13" width="7.4" height="7.4" rx="2"/>
      <path d="M16.7 13v7.4M13 16.7h7.4"/>` },
  { ton: 't4', wort: 'Zwei-Faktor-<br>Anmeldung', bild: `
      <path d="M12 3.2 19.4 6v6.1c0 4.2-3 7.2-7.4 8.6-4.4-1.4-7.4-4.4-7.4-8.6V6Z"/>
      <path d="m8.9 12.1 2.2 2.2 4-4.3"/>` },
];

document.getElementById('merkmale').innerHTML = MERKMALE.map(m => `
  <div class="merkmal ${m.ton}">
    <span class="m-ic"><svg viewBox="0 0 24 24" aria-hidden="true" ${STRICH}
      >${m.bild}</svg></span>
    <span class="m-wort">${m.wort}</span>
  </div>`).join('');

/* Der Code wird hier NICHT geprüft — das tut der Server auf der Anmeldeseite.
   Hier geht es nur darum, ihn mitzunehmen, damit niemand zweimal tippt. */
const feld = document.getElementById('code');
const fehler = document.getElementById('fehler');

function weiter() {
  const code = feld.value.trim();
  if (code.length < 4) {
    fehler.textContent = 'Bitte den Code aus der Einladungs-E-Mail eintragen.';
    feld.focus();
    return;
  }
  fehler.textContent = '';
  location.href = `anmeldung.html?code=${encodeURIComponent(code)}`;
}

document.getElementById('los').addEventListener('click', weiter);
feld.addEventListener('keydown', e => { if (e.key === 'Enter') weiter(); });
</script>
</body>
</html>
