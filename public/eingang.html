<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dokumente &amp; Ereignisse · ImmoCalc</title>
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F6E5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ImmoCalc">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/immo.css">
<style>
  /* N374 — Dialog-Kopf, Schließer und Rumpf stehen in assets/immo.css. */
  .kamera{display:flex;gap:14px;align-items:center;width:100%;border:none;cursor:pointer;
    background:var(--teal);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px;
    text-align:left;font-family:var(--body);min-height:44px;
    box-shadow:0 8px 20px -10px rgba(15,110,92,.8)}
  .kamera:hover{background:var(--teal-d)}
  .kamera[disabled]{opacity:.7;cursor:default}
  .kamera .ks{width:44px;height:44px;border-radius:12px;flex:none;display:flex;
    align-items:center;justify-content:center;background:rgba(255,255,255,.18);
    font:600 19px var(--mono)}
  .kamera .k1{display:block;font:600 15px var(--disp);letter-spacing:-.01em}
  .kamera .k2{display:block;font:400 12px var(--body);opacity:.85;margin-top:3px;
              line-height:1.4}

  /* Am Schreibtisch fotografiert niemand einen Beleg ab — dort ist der
     breite Balken nur eine Bank, die den Blick auf die Arbeit versperrt. Er
     wird zum schlanken Knopf neben der Suche; die Handlung bleibt erreichbar,
     kostet aber keine Zeile Höhe mehr. */
  @media (min-width:1000px){
    .kamera{width:auto;margin:0;padding:11px 15px;border-radius:12px;
            box-shadow:none;gap:9px;order:3;flex:none}
    .kamera .ks{width:22px;height:22px;background:none;font-size:15px}
    .kamera .k2{display:none}
    .kamera .k1{font:600 13px var(--disp)}
  }

  .fussnote{display:block;font:500 11.5px var(--mono);color:var(--soft);
            margin:0 0 12px;line-height:1.5}
  .fussnote.warn{color:var(--amber)}
  /* Der Hinweis zum Ordner-Takt gehoert am Schreibtisch neben die Werkzeuge,
     nicht als eigene Zeile darueber. */
  @media (min-width:1000px){
    .fussnote{margin:0 0 10px}
  }

  /* Werkzeugleiste: suchen und den Ordner neu einlesen */
  .werkzeuge{display:flex;gap:8px;margin-bottom:10px}
  .werkzeuge .suche{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;
    padding:11px 13px;font:500 13.5px var(--body);background:var(--sheet);
    min-height:44px;color:var(--ink)}
  .werkzeuge .suche:focus{outline:none;border-color:var(--teal)}
  /* iOS zoomt bei Fokus auf Felder < 16px hinein und nicht zurueck (CCCLII). */
  @media(pointer:coarse){.werkzeuge .suche{font-size:16px}}
  .werkzeuge .pruef{flex:none;border:none;background:var(--sheet);color:var(--teal-d);
    border-radius:12px;padding:11px 15px;font:600 13px var(--disp);cursor:pointer;
    min-height:44px;box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .werkzeuge .pruef:hover{background:var(--teal-l)}
  .werkzeuge .pruef[disabled]{opacity:.55;cursor:default}

  /* Ergebnis des Ordner-Abgleichs — ruhig, eine Zeile, bleibt stehen */
  .bilanz{background:var(--teal-l);color:var(--teal-d);border-radius:12px;
    padding:11px 13px;margin-bottom:10px;font:500 12px var(--mono);line-height:1.6}
  .bilanz.warn{background:var(--amber-bg);color:var(--amber)}
  .bilanz a{color:inherit}
  .bilanz .zeile{display:block}

  /* ---- N301: Duplikat-Assistent ------------------------------------------
     Ein ruhiger Aufklapper unter der Dokumentenverwaltung. Zugeklappt eine
     einzige Zeile, die nichts fordert; aufgeklappt stehen die gleichen
     Dateien am Schreibtisch nebeneinander und am Telefon gestapelt. */
  .dupe{background:var(--sheet);border-radius:14px;margin:0 0 12px;
        box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .dupe > summary{list-style:none;cursor:pointer;min-height:44px;
    display:flex;align-items:center;gap:9px;padding:0 13px;
    font:600 12.5px var(--disp);color:var(--ink);
    -webkit-tap-highlight-color:transparent}
  .dupe > summary::-webkit-details-marker{display:none}
  .dupe > summary::after{content:'▾';margin-left:auto;color:var(--soft);
    font:400 12px var(--body);transition:transform .15s}
  .dupe[open] > summary::after{transform:rotate(180deg)}
  .dupe > summary:hover{color:var(--teal-d)}
  .dupe .dsi{flex:none;color:var(--soft);font:400 15px var(--mono);line-height:1}
  .dupe .dsz{flex:none;font:600 11px var(--mono);color:var(--soft);
    background:#F1F4F4;border-radius:999px;padding:3px 9px}
  .dupe .dsz.an{background:var(--amber-bg);color:var(--amber)}
  .dbox{padding:0 13px 14px}

  .dgruppe{border-top:1px solid var(--line);margin-top:13px;padding-top:13px}
  .dgruppe:first-child{border-top:none;margin-top:0;padding-top:2px}
  .dgkopf{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
          margin-bottom:10px}
  .dgkopf .dgt{font:600 13px var(--disp);letter-spacing:-.01em}
  .dgkopf .dgm{min-width:0;font:500 11px var(--mono);color:var(--soft);
               overflow-wrap:anywhere}

  /* Nebeneinander, sobald Platz da ist — sonst gestapelt. Bewusst Flex und
     nicht Grid: bleibt in der letzten Zeile eine Karte allein (drei Kopien,
     zwei Spalten), zieht sie sich über die volle Breite, statt ein Loch
     neben sich stehen zu lassen. */
  .dkopien{display:flex;flex-wrap:wrap;gap:10px}

  .dkopie{flex:1 1 250px;min-width:0;background:var(--paper);
    border:1.5px solid transparent;border-radius:13px;padding:12px;cursor:pointer}
  .dkopie:hover{border-color:var(--line)}
  .dkopie.an{border-color:var(--teal);background:var(--teal-l)}
  .dkopie .dkw{display:flex;align-items:flex-start;gap:9px}
  .dkopie input[type=radio]{flex:none;width:19px;height:19px;margin:1px 0 0;
    accent-color:var(--teal)}
  .dkopie .dn{min-width:0;font:600 13px var(--disp);letter-spacing:-.01em;
    line-height:1.35;overflow-wrap:anywhere}
  /* Der Pfad ist lang: er bricht an den Schrägstrichen und notfalls
     mittendrin — die Seite scrollt nie waagerecht. */
  .dkopie .dpfad{display:block;margin-top:9px;background:var(--sheet);
    border-radius:9px;padding:7px 9px;font:400 10.5px var(--mono);
    color:var(--soft);line-height:1.6;overflow-wrap:anywhere}
  .dkopie.an .dpfad{background:rgba(255,255,255,.75)}
  /* Die Marken erben aus immo.css ein `white-space:nowrap`. Ein langer
     Objektname („… — Vorderhaus links") sprengte damit die Karte und die
     Seite scrollte waagerecht — hier dürfen sie umbrechen. */
  .dkopie .chips{margin-top:9px}
  .dkopie .chips .chip{white-space:normal;overflow-wrap:anywhere}

  .dlink{display:block;margin-top:10px}
  .dlink .dlt{display:block;font:600 10px var(--mono);color:var(--soft);
    letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
  .dlink ul{margin:0;padding:0;list-style:none;display:flex;
            flex-direction:column;gap:4px}
  .dlink li{display:flex;gap:6px;font:500 11.5px var(--body);color:var(--ink);
            line-height:1.45;overflow-wrap:anywhere}
  .dlink li::before{content:'↳';flex:none;color:var(--soft);
                    font:400 11px var(--mono)}
  /* Nichts hängt daran — das ist der gefahrloseste Kandidat zum Wegwerfen. */
  .dfrei{display:inline-flex;align-items:center;margin-top:10px;
    border-radius:999px;padding:4px 10px;background:var(--pos-bg);
    color:var(--pos);font:600 11px var(--mono)}

  .dfuss{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
  .dopt{display:inline-flex;align-items:center;gap:8px;min-height:44px;
    cursor:pointer;font:500 12px var(--body);color:var(--soft)}
  .dopt input{flex:none;width:18px;height:18px;accent-color:var(--teal)}
  .dtat{margin-left:auto;flex:none;border:none;border-radius:12px;
    background:var(--teal);color:#fff;padding:12px 16px;min-height:44px;
    cursor:pointer;font:600 13px var(--disp)}
  .dtat:hover{background:var(--teal-d)}
  .dtat[disabled]{opacity:.55;cursor:default}
  /* Auf dem Telefon steht der Knopf nicht als Rest einer Zeile rechts unten,
     sondern über die volle Breite. */
  @media (max-width:559px){.dtat{width:100%;margin-left:0}}

  .dwarte,.dleer{display:block;padding:6px 0 2px;font:500 12px var(--mono);
    color:var(--soft);line-height:1.6}

  .filter{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;
          margin-bottom:14px}
  @media (min-width:900px){.filter{grid-template-columns:repeat(4,minmax(0,1fr))}}
  /* Kontext-Banner beim Sprung aus der NK-Abrechnung (Beleg wählen) */
  .nkkontext{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--teal-l);color:var(--teal-d);border:1px solid #BFD9D1;
    border-radius:14px;padding:12px 15px;margin:0 0 12px;
    font:500 13px var(--body);line-height:1.45}
  .nkkontext .kx{font:400 17px var(--mono);flex:none}
  .nkkontext strong{font-weight:700}
  .nkkontext .zur{margin-left:auto;color:var(--teal-d);font:600 12.5px var(--disp);
    text-decoration:none;white-space:nowrap;border:1px solid #BFD9D1;
    border-radius:999px;padding:7px 13px;background:var(--sheet)}
  .nkkontext .zur:hover{background:#DCEDE7}

  /* Immobilien-Filter als kurze Code-Buttons (lau 5, tau 5 …) — einzeilig.
     Passen sie doch nicht in eine Zeile, scrollt die Leiste seitwärts statt
     umzubrechen: so bleibt der Filter immer eine Zeile hoch. */
  .im-leiste{display:flex;flex-wrap:nowrap;gap:6px;margin:0 0 12px;
             overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .im-leiste::-webkit-scrollbar{display:none}
  .imbtn{display:inline-flex;align-items:center;justify-content:center;flex:none;
         border:1px solid var(--line);background:var(--sheet);color:var(--ink);
         border-radius:11px;padding:8px 11px;min-height:44px;white-space:nowrap;
         font:600 12.5px var(--body);cursor:pointer;
         transition:background .12s,border-color .12s,color .12s}
  .imbtn:hover{border-color:var(--teal)}
  .imbtn.an{background:var(--teal);border-color:var(--teal);color:#fff}

  /* Kostenart: Dropdown-Auslöser (im Filterraster) + aufklappbare Bubbles */
  .ka-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;
    width:100%;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);
    border-radius:12px;padding:0 13px;min-height:44px;font:600 13px var(--body);
    cursor:pointer;transition:border-color .12s}
  .ka-trigger:hover{border-color:var(--teal)}
  .ka-trigger .chev{flex:none;color:var(--soft);transition:transform .16s}
  .ka-trigger[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .ka-trigger.an{background:var(--teal);border-color:var(--teal);color:#fff}
  .ka-trigger.an .chev{color:rgba(255,255,255,.85)}
  .ka-pop{display:flex;flex-wrap:wrap;gap:7px;margin:-4px 0 16px;padding:13px;
    background:var(--sheet);border:1px solid var(--line);border-radius:14px;
    max-height:46vh;overflow:auto;box-shadow:0 6px 20px rgba(22,38,44,.08)}
  .kabtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
         background:var(--paper);color:var(--ink);border-radius:999px;
         padding:7px 12px;min-height:36px;font:600 12.5px var(--body);cursor:pointer;
         transition:background .12s,border-color .12s,color .12s}
  .kabtn:hover{border-color:var(--teal)}
  .kabtn .n{font:600 11px var(--mono);color:var(--soft);
            background:var(--sheet);border-radius:999px;padding:1px 7px;min-width:20px;
            text-align:center}
  .kabtn.alle{border-style:dashed}
  .kabtn.an{background:var(--teal);border-color:var(--teal);color:#fff}
  .kabtn.an .n{background:rgba(255,255,255,.22);color:#fff}

  .zahlzeile{display:flex;align-items:center;gap:8px;margin:0 2px 10px}
  .zahlzeile .zahl{font:600 12px var(--mono);color:var(--soft)}
  .zahlzeile .warte{margin-left:auto;border:1px solid var(--amber);background:none;
    color:var(--amber);font:600 12px var(--disp);cursor:pointer;padding:7px 12px;
    border-radius:999px;min-height:34px}
  .zahlzeile .warte:hover{background:var(--amber-bg)}
  .zahlzeile .zuruecksetzen{border:none;background:none;
    color:var(--teal-d);font:600 12px var(--disp);cursor:pointer;padding:6px 2px}
  .zahlzeile .warte + .zuruecksetzen{margin-left:0}
  .zahlzeile .warte[hidden] + .zuruecksetzen{margin-left:auto}

  /* ---- Arbeitsfläche: links die Arbeit, rechts das Dokument -----------------
     CCCLXVII: Links steht alles zum Anfassen — die Belege, die Eingabefelder
     und das Ergebnis-Prüfblatt (unter der gewählten Karte). Rechts steht NUR
     das Dokument, ruhig und sticky. So liegen Felder/Ergebnis und Dokument
     nebeneinander statt in einem langen „Dokument + drunter noch was"-Turm.
     Auf dem Telefon gibt es eine Spalte; Dokument und Prüfblatt rücken dann
     unter die gewählte Karte (siehe blattPlatzieren in der Logik). */
  .flaeche{display:grid;gap:16px;align-items:start}
  @media (min-width:1180px){
    .flaeche{grid-template-columns:minmax(340px,30rem) minmax(0,1fr)}
    .spaltedok{position:sticky;top:8px}
    /* Das Dokument nicht über die halbe Wand ziehen — lesbar genug, den Rest
       füllt Weißraum; „größer ansehen" zeigt es voll. */
    .bdok{max-width:560px}
  }
  /* Schmale Schirme: das Dokument sitzt unter der Karte, die rechte Spalte
     trägt dann nichts — sie soll auch keine leere Zeile erzeugen. */
  @media (max-width:1179px){.spaltedok{display:contents}}
  .bdok{position:relative}
  .bdok[hidden]{display:none}

  .beleg{background:var(--sheet);border-radius:16px;padding:14px;margin-bottom:10px;
         box-shadow:0 1px 2px rgba(22,38,44,.05);cursor:pointer;
         border:1.5px solid transparent}
  .beleg:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .beleg.gewaehlt{border-color:var(--teal);cursor:default;
                  box-shadow:0 6px 18px -12px rgba(22,38,44,.55)}
  .beleg .kopf{display:flex;gap:12px;align-items:flex-start}
  /* Zuklappen (CCLX): der Kopf der offenen Karte ist der Umschalter — ein Tipp
     darauf klappt sie wieder zu. Das × oben rechts sagt dasselbe für alle, die
     ein klares Ziel suchen; es schließt die GANZE Karte, nicht nur die
     Vorschau. Deshalb liegt es hier oben und nicht unten im Beleg. */
  .beleg.gewaehlt .kopf{cursor:pointer}
  .beleg .kzu{flex:none;align-self:flex-start;width:40px;height:40px;
    margin:-7px -6px -7px 0;border:none;border-radius:11px;background:none;
    color:var(--soft);font:400 22px var(--body);line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent}
  .beleg .kzu:hover{background:var(--teal-l);color:var(--teal-d)}
  .beleg .sym{width:42px;height:42px;border-radius:11px;background:#EDF1F0;
    color:var(--soft);flex:none;display:flex;align-items:center;justify-content:center;
    font:600 13px var(--mono)}
  .beleg[data-status="neu"] .sym{background:var(--amber-bg);color:var(--amber)}
  .beleg[data-status="vermisst"] .sym{background:var(--neg-bg);color:var(--neg)}
  .beleg .wer{flex:1;min-width:0}
  .beleg .dn{display:block;font:600 14px var(--disp);letter-spacing:-.01em;
    line-height:1.35;word-break:break-word}
  .beleg .meta{display:block;font:400 11.5px var(--body);color:var(--soft);
    margin-top:5px;line-height:1.5}
  /* Erledigtes, eingeklappt: es ist da, aber es drängt sich nicht auf. */
  .erledigt{margin-top:6px}
  .erledigt > summary{list-style:none;cursor:pointer;min-height:44px;
    display:flex;align-items:center;gap:8px;padding:0 4px;
    font:600 12px var(--mono);color:var(--soft)}
  .erledigt > summary::-webkit-details-marker{display:none}
  .erledigt > summary::before{content:'▸';font:400 12px var(--body);
    transition:transform .15s}
  .erledigt[open] > summary::before{transform:rotate(90deg)}
  .erledigt > summary:hover{color:var(--teal-d)}
  .erledigt .ebox{padding-top:6px}
  .erledigt .beleg{opacity:.72}
  .erledigt .beleg.gewaehlt{opacity:1}

  .beleg .marke{flex:none;font:600 10.5px var(--mono);border-radius:7px;
    padding:4px 7px;background:var(--amber-bg);color:var(--amber);letter-spacing:.02em}
  .beleg .marke.fehlt{background:var(--neg-bg);color:var(--neg)}

  /* Datum und Betrag — das Wichtigste am Beleg, deshalb eigene Zeile (CXXIV) */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chips .chip{display:inline-flex;align-items:center;gap:6px;border-radius:9px;
    padding:5px 9px;background:#F1F4F4;color:var(--ink);
    font:500 12px var(--mono);letter-spacing:-.01em}
  .chips .chip .ci{font:400 12px var(--mono);color:var(--soft);line-height:1}
  .chips .chip.geld{background:var(--teal-l);color:var(--teal-d)}
  .chips .chip.offen{background:transparent;color:var(--soft);
                     box-shadow:inset 0 0 0 1.5px var(--line)}

  /* Erfassung an der gewählten Karte */
  /* Zwei Spalten auf jeder Breite. Drei waren es einmal; seit die
     Kostenposition (CLXXI) über die volle Breite läuft, blieb daneben eine
     handbreite Lücke stehen, und die Kanten fluchteten nicht mehr. Schmaler
     als die Hälfte darf ein Auswahlfeld ohnehin nicht werden, sonst schneidet
     es seinen eigenen Text ab („(Eschenau…", „Nebenkost…"). */
  .felder{margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
          gap:10px}
  /* Steht der Beleg daneben, stehen die Angaben untereinander: schmale Spalte
     links, dafuer das Blatt rechts so breit wie moeglich. Nebeneinander wurden
     die Auswahlfelder so eng, dass sie ihren eigenen Text abschnitten.
     Diese Regel muss NACH der Grundregel stehen, sonst gewinnt die
     zweispaltige. */
  @media (min-width:1180px){.felder{grid-template-columns:minmax(0,1fr)}}
  .felder .breit{grid-column:1 / -1}
  /* Die Felder einer Zeile fluchten unten, auch wenn eine Beschriftung
     umbricht — sonst rutscht ein Feld gegenüber seinem Nachbarn nach unten. */
  .felder .fach{display:flex;flex-direction:column}
  /* `hidden` muss die Regel darüber schlagen — sonst stünde das Jahresfeld
     noch da, obwohl längst ein Belegdatum gewählt ist. */
  .felder .fach[hidden]{display:none}
  .felder .fach > :last-child{margin-top:auto}
  .felder .fl{display:block;font:600 10.5px var(--mono);color:var(--soft);
    letter-spacing:.06em;text-transform:uppercase;margin:0 0 5px 2px}
  .felder input{width:100%;border:1.5px solid var(--line);border-radius:12px;
    padding:11px 13px;font:500 13.5px var(--body);background:var(--sheet);
    min-height:44px;color:var(--ink);appearance:none}
  .felder input:focus{outline:none;border-color:var(--teal)}
  /* CLXXV: was beisammen ist, ist grün — was fehlt, bleibt ruhig offen.
     Kein Ampelspiel: der Rahmen wechselt die Farbe, mehr braucht es nicht. */
  .felder .fach.gefuellt input,
  .felder .fach.gefuellt .auswahl-knopf{border-color:var(--teal)}
  /* CLXXVII: was die Texterkennung beigesteuert hat, sagt es auch — sie
     schlägt vor, gespeichert wird erst mit „Übernehmen". */
  .felder .fach.vorschlag .fl::after{content:" · Vorschlag";color:var(--teal-d)}

  /* ---- Beleg übernehmen: der Beleg und was aus ihm wird -------------------
     Eine ruhige, flache Fläche. Ein weißes Sheet, darin dezente Paper-Inseln
     für Vorschau und Rechnung, ein Akzent (Teal) für die Haupthandlung —
     kein Wechselspiel aus grauen und grünen Kästen, nichts klebt am Rand.
     Tiefe kommt aus der Farbabstufung, nicht aus Rahmenlinien. */
  .blatt{position:relative;background:var(--sheet);border-radius:16px;padding:16px;
         box-shadow:0 1px 2px rgba(22,38,44,.05)}
  @media (min-width:1180px){.blatt{padding:18px}}
  /* CCCLXVII: das Ergebnis-Prüfblatt liegt jetzt IMMER in der weißen Karte —
     unter den Eingabefeldern, links neben dem Dokument. Dieselbe Fläche, nur
     durch eine feine Linie und Luft abgesetzt, keine zweite Farbe. Geschlossen
     wird die Karte über ihr × im Kopf (kzu). */
  .beleg .blatt{margin-top:14px;padding:14px 0 0;background:none;box-shadow:none;
                border-top:1px solid var(--line);border-radius:0}

  /* Vorschau: die GANZE erste Seite als Bild, volle Breite, nichts
     beschnitten. Ein Tippen öffnet die große Ansicht. */
  .bschau{position:relative;display:block;width:100%;border:none;padding:0;
    border-radius:12px;overflow:hidden;background:var(--paper);cursor:zoom-in}
  .bschau img{display:block;width:100%;height:auto}
  .bschau .lupe{position:absolute;right:8px;bottom:8px;border-radius:9px;
    background:rgba(22,38,44,.72);color:#fff;font:500 11px var(--mono);
    padding:6px 9px;pointer-events:none}
  .bschau.knapp{cursor:default}
  .bschau .wart{display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:28px 18px;text-align:center;font:400 12.5px var(--body);
    color:var(--soft);line-height:1.55}
  .bschau .wart.leer{color:var(--neg)}
  .bschau .wart a{color:var(--teal-d);font:600 12.5px var(--disp);
    text-decoration:none}
  .bschau:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  /* Abschnitte: durch Luft getrennt, nicht durch Farbwechsel. */
  .bsek{margin-top:18px}
  .bsek .bt{display:block;font:600 10.5px var(--mono);color:var(--soft);
    letter-spacing:.09em;text-transform:uppercase;margin-bottom:9px}
  /* Auch der gewählte Zeitraum ist eine erledigte Angabe (CLXXV). */
  .bsek .auswahl.gefuellt .auswahl-knopf{border-color:var(--teal)}

  /* Gegenüberstellung: erkannt → wird eingetragen. Ruhige Zeilen, kein Kasten. */
  .pzeile{display:flex;align-items:baseline;gap:8px;padding:5px 0;
          font:500 12.5px var(--body);line-height:1.5}
  .pzeile .pl{flex:none;width:82px;font:500 11.5px var(--mono);color:var(--soft)}
  .pzeile .pw{min-width:0;word-break:break-word}
  .pzeile .pw.leer{color:var(--amber)}
  /* CLXXV: eine Angabe, die steht, ist erledigt. Grün sagt das, ein Satz
     darüber wäre einer zu viel. */
  .pzeile .pw.da{color:var(--pos)}
  .pzeile .alt{color:var(--soft);text-decoration:line-through}
  .pzeile .pfeil{color:var(--soft);font:400 12px var(--mono)}

  /* Höchstens eine ruhige Hinweiszeile je Abschnitt — sonst weg. */
  .bhinweis{display:block;font:500 11.5px var(--mono);color:var(--soft);
            margin-top:8px;line-height:1.55}
  .bhinweis.warn{color:var(--amber)}
  .bhinweis:empty{display:none}

  /* ---- CCLXXIII/CCCLXVII: KI-Einschätzung — Kosten? NK? Zeitraum? + Satz ----
     Dezent unter den Feldern: ein ✦, kompakte Marken (Kosten/Nebenkosten/
     Zeitraum) und der ruhige Klartext der KI. Nur da, wenn die KI etwas
     geliefert hat — sonst bleibt der Block ausgeblendet. */
  .bein{display:flex;gap:9px;background:var(--teal-l);border-radius:12px;
    padding:11px 13px;margin-top:16px}
  .bein[hidden]{display:none}
  .bein .beinsym{flex:none;color:var(--teal-d);font:600 14px var(--mono);
    line-height:1.5}
  .bein .beinbody{min-width:0;display:flex;flex-direction:column;gap:8px}
  .bein .beintags{display:flex;flex-wrap:wrap;gap:6px}
  .bein .beintags:empty{display:none}
  .kitag{font:600 11px var(--mono);border-radius:999px;padding:3px 9px;
    background:var(--sheet);color:var(--teal-d);white-space:nowrap}
  .kitag.ja{background:var(--pos-bg);color:var(--pos)}
  .kitag.nein{background:var(--sheet);color:var(--soft)}
  .bein .beintext{min-width:0;font:500 12.5px var(--body);color:var(--teal-d);
    line-height:1.55;word-break:break-word}
  .bein .beintext:empty{display:none}

  /* Ein dezenter Knopf, die KI-Analyse neu anzustoßen (CCCLXVII) — z. B. wenn
     der Schlüssel erst jetzt hinterlegt wurde. Text-leise, mit ✦, links. */
  .kineu{display:inline-flex;align-items:center;gap:7px;margin-top:10px;
    border:1px solid var(--line);background:var(--sheet);color:var(--teal-d);
    border-radius:999px;padding:8px 13px;min-height:36px;cursor:pointer;
    font:600 12px var(--disp)}
  .kineu:hover{border-color:var(--teal);background:var(--teal-l)}
  .kineu[disabled]{opacity:.6;cursor:default}
  .kineu .kns{font:600 12px var(--mono);line-height:1}

  /* ---- CCLXXIV: KI-Vorbelegung — erkannte Liegenschaft und Felder ----------
     Was die KI aus dem Beleg gezogen hat, als kompakte Liste im selben dezenten
     Ton wie die ✦-Einordnungskarte. Der Nutzer bestätigt nur noch. Nur da,
     wenn die KI etwas geliefert hat — sonst ausgeblendet. */
  .bki{background:var(--teal-l);border-radius:12px;padding:12px 13px;margin-top:16px}
  .bki[hidden]{display:none}
  .bki .bkikopf{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
  .bki .bkisym{flex:none;color:var(--teal-d);font:600 13px var(--mono);line-height:1.3}
  .bki .bkitit{font:600 10.5px var(--mono);color:var(--teal-d);letter-spacing:.09em;
    text-transform:uppercase}
  .bki .bkiliste{display:flex;flex-direction:column;gap:5px}
  .bki .bkizeile{display:flex;align-items:baseline;gap:10px;line-height:1.45}
  .bki .bkik{flex:none;width:96px;font:500 11.5px var(--mono);color:var(--teal-d);
    opacity:.85}
  .bki .bkiv{min-width:0;font:500 12.5px var(--body);color:var(--ink);
    word-break:break-word}

  /* ---- CLXXX: aus dem Beleg wird eine Zeile der Abrechnung ----------------
     Die Rechnung liegt in einer dezenten Paper-Insel — man soll sehen, was man
     bestätigt (ein zweiter Beleg erhöht den Betrag, CLXXXII). */
  .posplan{background:var(--paper);border-radius:12px;padding:12px 13px;
    font:500 12px var(--mono);color:var(--ink);line-height:1.55}
  .posplan .pr{display:flex;align-items:baseline;justify-content:space-between;
    gap:12px;padding:3px 0}
  .posplan .pr > span:last-child{font-weight:600;white-space:nowrap}
  .posplan .pr.summe{border-top:1px solid var(--line);margin-top:6px;
    padding-top:8px;color:var(--teal-d)}
  .posplan .pr.fehlt{color:var(--amber);display:block}
  .posplan .pr.fehlt span{white-space:normal;font-weight:500}
  .posplan .pr.fertig{color:var(--pos)}
  .postat{display:flex;gap:8px;margin-top:10px}
  .postat button{border:none;border-radius:12px;cursor:pointer;min-height:44px;
    font:600 13px var(--disp)}
  .postat .posknopf{flex:1;background:var(--teal-l);color:var(--teal-d);padding:12px}
  .postat .posknopf:hover{background:#DCEDE7}
  .postat .posknopf[disabled]{opacity:.5;cursor:default}
  /* Der bestätigte Zustand ist keine Sperre, sondern eine Auskunft. */
  .postat .posknopf.fertig,
  .postat .posknopf.fertig[disabled]{background:var(--pos-bg);color:var(--pos);
    opacity:1}
  .postat .poslos{flex:none;background:var(--paper);color:var(--soft);padding:0 14px;
    font:600 12.5px var(--disp)}
  .postat .poslos:hover{background:var(--neg-bg);color:var(--neg)}

  /* Haupthandlung: übernehmen, daneben zwei klar erkennbare Icon-Knöpfe. */
  .btat{display:flex;gap:8px;margin-top:18px}
  .btat button{border:none;border-radius:12px;cursor:pointer;min-height:48px;
    font:600 14px var(--disp)}
  .btat .haupt{flex:1;background:var(--teal);color:#fff;padding:12px}
  .btat .haupt:hover{background:var(--teal-d)}
  .btat .haupt[disabled]{opacity:.5;cursor:default}
  .btat .klein{flex:none;min-width:48px;padding:0 12px;background:var(--paper);
    color:var(--soft);font:400 18px var(--mono)}
  .btat .klein:hover{background:var(--teal-l);color:var(--teal-d)}
  .btat .klein.gefahr:hover{background:var(--neg-bg);color:var(--neg)}
  .btat .klein.frage{background:var(--neg-bg);color:var(--neg);
    font:600 12.5px var(--disp);padding:0 14px}

  /* Ziel-Dateiname: eine dezente Zeile, kein eigener Kasten. */
  .bziel{display:block;font:500 11px var(--mono);color:var(--soft);
    margin-top:10px;line-height:1.55;word-break:break-word}
  .bziel.gesperrt{color:var(--neg)}
  .bziel:empty{display:none}

  .bmeldung{display:block;font:500 11.5px var(--mono);color:var(--soft);
    margin-top:8px;line-height:1.5;word-break:break-word}
  .bmeldung.gut{color:var(--pos)}
  .bmeldung.schlecht{color:var(--neg)}

  /* Rechte Spalte ohne Auswahl: eine Einladung statt einer leeren Fläche */
  .leerblatt{display:none;background:var(--sheet);border-radius:16px;
    padding:26px 22px;text-align:center;box-shadow:0 1px 2px rgba(22,38,44,.05)}
  @media (min-width:1180px){.leerblatt{display:block}}
  /* `hidden` muss die Regel oben schlagen — sonst steht die Einladung noch da,
     wenn längst ein Beleg gewählt ist. */
  .leerblatt[hidden]{display:none}
  .leerblatt .lb1{font:700 15px var(--disp);letter-spacing:-.015em;margin-bottom:8px}
  .leerblatt p{font:400 12.5px var(--body);color:var(--soft);margin:0;line-height:1.6}

  .hinweisbox{background:var(--sheet);border-radius:16px;padding:24px 22px;
    text-align:center;box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .hinweisbox .big{font:700 16px var(--disp);letter-spacing:-.015em;margin-bottom:8px}
  .hinweisbox p{font:400 13px var(--body);color:var(--soft);margin:0 0 14px;
    line-height:1.55}
  .hinweisbox a{display:inline-block;text-decoration:none;background:var(--teal);
    color:#fff;border-radius:12px;padding:12px 18px;font:600 13.5px var(--disp)}

  dialog{border:none;border-radius:18px;padding:0;max-width:400px;
         width:calc(100% - 32px);background:var(--paper);
         box-shadow:0 30px 70px -20px rgba(22,38,44,.5)}
  dialog::backdrop{background:rgba(22,38,44,.45)}
  .zinfo{font:600 12px var(--mono);color:var(--teal-d);background:var(--teal-l);
         border-radius:10px;padding:10px 12px;margin:0 0 14px;line-height:1.5}

</style>
</head>
<body>
<!-- „weit": diese Seite arbeitet zweispaltig, der Beleg braucht Platz -->
<div class="app weit">
  <div class="bar">
    <a href="index.html" aria-label="Zur Übersicht" class="applogo-link"><img src="icons/icon.svg" alt="" class="applogo"></a>
    <div class="barwrap">
      <!-- CXXVI wollte den Doppelnamen fuer die Kopfzeile ("Dokumente &
           Ereignisse"); die vier 44px-Kopfzeilen-Symbole (N327-b) lassen
           dafuer keinen Platz mehr, ohne den Titel abzuschneiden — jetzt
           derselbe kurze Name wie in der Navigation. -->
      <h1>Dokumente</h1>
      <div class="sub" id="sub">wird geladen …</div>
    </div>
  </div>

  <div class="scroll">
    <!-- CCLXXXIII — aus der NK-Abrechnung hierher gesprungen: Kontext + Rückweg. -->
    <div class="nkkontext" id="nkKontext" hidden></div>
    <button class="kamera" id="kamera">
      <span class="ks">▣</span>
      <span class="kt">
        <span class="k1">Beleg abfotografieren</span>
        <span class="k2">Mehrere Seiten möglich · wird als PDF abgelegt</span>
      </span>
    </button>
    <!-- CCCLXXI — auf dem Telefon führt `capture` direkt zur Kamera; am PC
         (keine Kamera) zählt der `accept`-Filter, der auch PDFs zulässt, damit
         ein fertiger Beleg nicht durch den Bild-Filter ausgeblendet wird. -->
    <input type="file" id="kameraFeld" accept="image/*,application/pdf,.pdf"
           capture="environment" multiple hidden>
    <input type="file" id="erneutFeld" accept="image/*,application/pdf,.pdf"
           capture="environment" multiple hidden>

    <span class="fussnote" id="fussnote"></span>

    <div class="werkzeuge">
      <input class="suche" id="suche" type="search" placeholder="Dateiname suchen"
             aria-label="Dateiname suchen">
      <button class="pruef" id="pruef">Ordner einlesen</button>
    </div>
    <div class="bilanz" id="bilanz" hidden></div>

    <!-- N301 — Duplikat-Assistent: hängt als Aufklapper unter der
         Dokumentenverwaltung, bewusst NICHT als eigener Menüpunkt. Zugeklappt
         ist er eine Zeile; die Daten holt er sich erst beim Aufklappen (der
         Abruf geht über die ganze Ablage). Die Logik liegt in
         `assets/eingang/duplikate.js`. -->
    <details class="dupe" id="dupe">
      <summary>
        <span class="dsi" aria-hidden="true">⧉</span>
        <span class="dst">Doppelte Dateien</span>
        <span class="dsz" id="dupeZahl" hidden></span>
      </summary>
      <div class="dbox" id="dupeInhalt"></div>
    </details>

    <!-- Immobilien-Filter als Buttons: nur Immo-Icon + Adresse (CCLXXIX). -->
    <div class="im-leiste" id="fObjektBtns"></div>

    <div class="filter">
      <div id="fArt"></div>
      <div id="fJahr"></div>
      <div id="fStatus"></div>
      <!-- Kostenart: aufklappbares Dropdown, die Bubbles stehen darin (CCLXXIX). -->
      <button class="ka-trigger" id="kaTrigger" type="button" aria-expanded="false"
              aria-controls="fKostenart">
        <span class="lbl" id="kaLabel">Kostenart</span>
        <svg class="chev" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Kostenart-Bubbles mit Anzahl, aufgeklappt unter dem Dropdown. -->
    <div class="ka-pop" id="fKostenart" hidden></div>

    <div class="zahlzeile">
      <span class="zahl" id="zahl"></span>
      <button class="warte" id="warteArchiv" hidden>Angezeigte ins Warten</button>
      <button class="zuruecksetzen" id="zuruecksetzen" hidden>Filter zurücksetzen</button>
    </div>

    <div class="flaeche">
      <div id="liste"></div>
      <!-- CCCLXVII: rechts steht NUR das Dokument (sticky); auf schmalen
           Schirmen rückt es unter die gewählte Karte. Das Ergebnis-Prüfblatt
           liegt links unter der Karte (siehe #blatt weiter unten). -->
      <div class="spaltedok" id="spalteDok">
        <div class="bdok" id="bDok" hidden>
          <div class="bschau" id="bSchau" role="button" tabindex="0"
               aria-label="Beleg groß ansehen"></div>
        </div>
        <div class="leerblatt" id="leerBlatt">
          <div class="lb1">Beleg wählen</div>
          <p>Ein Antippen zeigt links das Prüfblatt — mit allem, was erkannt
             wurde, und dem, was daraus in der Ablage wird — und hier den Beleg
             selbst.</p>
        </div>
      </div>
    </div>

    <!-- Das Ergebnis-Prüfblatt: es wird unter die gewählte Karte gesetzt
         (blattPlatzieren), damit Felder + Ergebnis links beisammen stehen und
         das Dokument rechts daneben (CCCLXVII). Hier nur der Ausgangsknoten. -->
    <aside class="blatt" id="blatt" hidden aria-label="Beleg übernehmen">
      <div class="bsek">
        <span class="bt">Erkannt → wird eingetragen</span>
        <div id="bPlan"></div>
        <span class="bhinweis" id="bLesen"></span>
      </div>
      <!-- CCLXXIII/CCCLXVII: die KI-Einschätzung — Marken (Kosten/NK/Zeitraum)
           und ein bis vier Sätze. Dezent, nur sichtbar, wenn die KI etwas
           geliefert hat. -->
      <div class="bein" id="bEin" hidden>
        <span class="beinsym" aria-hidden="true">✦</span>
        <div class="beinbody">
          <div class="beintags" id="bEinTags"></div>
          <span class="beintext" id="bEinText"></span>
        </div>
      </div>
      <!-- CCLXXIV: die KI-Vorbelegung — erkannte Liegenschaft, Einheit und
           die typspezifischen Felder. Inhalt kommt aus der Logik; der Block
           bleibt aus, solange die KI nichts geliefert hat. -->
      <div class="bki" id="bKi" hidden></div>
      <button class="kineu" id="bKiNeu" type="button">
        <span class="kns" aria-hidden="true">✦</span>KI-Analyse neu starten</button>
      <span class="bhinweis" id="bKiMeldung"></span>
      <div class="bsek">
        <span class="bt">Abrechnungszeitraum</span>
        <div id="bZeitraum"></div>
        <span class="bhinweis" id="bZeitHinweis"></span>
      </div>
      <div class="bsek" id="bPosFach" hidden>
        <span class="bt">Kostenposition</span>
        <div class="posplan" id="bPosPlan"></div>
        <div class="postat">
          <button class="posknopf" id="bPos">Als Kostenposition übernehmen</button>
          <button class="poslos" id="bPosLos" hidden>Lösen</button>
        </div>
        <span class="bhinweis" id="bPosHinweis"></span>
      </div>
      <span class="bziel" id="bZiel"></span>
      <div class="btat">
        <button class="haupt" id="bOk">Übernehmen</button>
        <button class="klein" id="bNeu" aria-label="Beleg neu einscannen"
                title="Beleg neu einscannen">▣</button>
        <button class="klein gefahr" id="bWeg" aria-label="Eintrag entfernen"
                title="Eintrag entfernen">⌫</button>
      </div>
      <span class="bmeldung" id="bMeldung"></span>
    </aside>
  </div>

  <div data-nav></div>
</div>

<dialog id="zielDlg">
  <div class="dh">
    <h2>Wohin gehört der Beleg?</h2>
    <button class="close" onclick="this.closest('dialog').close()"
            aria-label="Abbrechen">×</button>
  </div>
  <div class="dbody">
    <p class="zinfo" id="zielInfo"></p>
    <div class="field"><label>Immobilie</label><div id="zielObjekt"></div></div>
    <div class="field"><label>Art</label><div id="zielArt"></div></div>
    <div class="field"><label>Jahr</label><div id="zielJahr"></div></div>
    <!-- N280 — Bezeichnung und Betrag stehen in der Bestätigungsmaske, die
         gleich danach kommt; hier stünden sie ein zweites Mal. -->
    <button class="btn" id="zielOk" autofocus>Weiter</button>
  </div>
</dialog>

<script type="module">
/* N216 — die Fach-Logik dieser Seite ist in Themen-Module unter
   `assets/eingang/` aufgeteilt (siehe `assets/eingang/_TOPICS.md`). Hier
   bleibt nur die Verdrahtung: Navigation installieren, den NK-Kontext-
   Sprung uebernehmen, dann laden und die Fussnote fuellen. Die einzelnen
   Fach-Module registrieren ihre Klick-/Change-Handler im eigenen
   Modul-Top-Level, sobald sie importiert werden. */
import { installNav } from './assets/immo.js';
import { laden, fussnoteZeigen, nkKontextInit } from './assets/eingang/aktionen.js';
// Der Import wirkt: er zieht per Cascade alle uebrigen Module (filter, liste,
// plan, zeitraum, kostenart, vorschau, ki, position, scan) mit hinein und
// installiert deren Event-Handler.
import './assets/eingang/vorschau.js';
import './assets/eingang/ki.js';
import './assets/eingang/position.js';
import './assets/eingang/scan.js';
// N301 — der Duplikat-Assistent haengt sich selbst an den Aufklapper; er holt
// seine Daten erst, wenn der Nutzer ihn oeffnet.
import './assets/eingang/duplikate.js';

installNav();
nkKontextInit();
await laden();
await fussnoteZeigen();
// N327 — der Suchknopf in der Kopfzeile springt von anderen Seiten hierher;
// `?fokus=suche` holt danach den Fokus (und die Tastatur) direkt ins Feld.
if (new URLSearchParams(location.search).get('fokus') === 'suche') {
  document.getElementById('suche')?.focus();
}
</script>
</body>
</html>
