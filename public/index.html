<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ImmoCalc</title>
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F6E5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ImmoCalc">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/immo.css">
<style>
  /* LXXVIII — Hauslogos groesser. Gehoert spaeter nach immo.css (.tile .ico),
     steht hier nur, weil an immo.css gerade parallel gearbeitet wird.
     64px passt auf dem iPhone in die 2-spaltige Kachel (~163px innen) und
     laesst rechts genug Luft, damit nichts ueberlaeuft. */
  .tile .ico{width:64px; height:64px; border-radius:15px}
  @media(min-width:680px){ .tile .ico{width:72px; height:72px; border-radius:17px} }

  /* Ort · Strasse · Einheit — drei Ebenen in der Kachel. Alle drei Zeilen
     display:block, weil margin an einem <span> sonst wirkungslos bleibt. */
  .tile .ortszeile{
    display:block; font:600 10px var(--mono); letter-spacing:.11em;
    text-transform:uppercase; color:var(--soft); margin:0 0 4px; line-height:1.3;
    overflow-wrap:anywhere;
  }
  .tile .name{overflow-wrap:anywhere}
  .tile .einheit{
    display:block; font:400 12px var(--body); color:var(--soft);
    margin-top:4px; line-height:1.35; overflow-wrap:anywhere;
  }
  /* Flurnummer des Grundstücks — gesetzt wie ein Label (mono), gedeckt */
  .tile .einheit.flur{font:600 11.5px var(--mono); letter-spacing:.02em;
    color:var(--soft)}

  /* LXXIX — Haus: Oberkachel mit angedockten Einheiten. Die gemeinsame,
     etwas dunklere Flaeche haelt die Gruppe zusammen; die Einzelkacheln
     liegen als helle Blaetter darin. Kein Rahmen, Tiefe nur ueber Farbe. */
  .haus{background:#DFE5E5; border-radius:20px; padding:8px; margin-bottom:14px}
  .haus + .haus{margin-top:0}
  .haus-kopf{
    width:100%; min-height:0; flex-direction:row; align-items:flex-start;
    gap:12px; flex-wrap:wrap; border-radius:14px 14px 10px 10px;
    margin-bottom:8px; padding:14px 14px 12px;
  }
  .haus-kopf .txt{flex:1; min-width:0}
  .haus-kopf .name{font-size:16px}
  .haus-kopf .foot{flex-basis:100%; margin-top:2px}
  .haus-kopf .klapp{
    flex:none; align-self:center; color:var(--soft); font:400 15px var(--body);
    transition:transform .15s;
  }
  .haus-kopf[aria-expanded=false] .klapp{transform:rotate(-90deg)}
  /* Untereinheiten: gleiche Sprache, eine Stufe leiser */
  .haus .grid{gap:8px}
  /* Ohne diese Zeile bliebe das Raster sichtbar: `display:grid` aus immo.css
     schlaegt die [hidden]-Regel des Browsers. */
  .haus .grid[hidden]{display:none}
  /* Zugeklappt sitzt die Oberkachel allein in der Flaeche — kein Rest-Rand. */
  .haus-kopf[aria-expanded=false]{margin-bottom:0; border-radius:14px}
  .haus .grid .tile{min-height:148px; padding:12px}
  .haus .grid .tile .ico{width:48px; height:48px; border-radius:12px}
  @media(min-width:680px){ .haus .grid .tile .ico{width:54px; height:54px} }

  /* CXLV — Die Einheiten eines Hauses. Gemeint ist die Tabelle `Einheit`
     INNERHALB eines Objekts (1. OG, 2. OG, EG / Buero, Garage), nicht die
     Gruppierung mehrerer Objekte derselben Adresse weiter oben.
     Die Karte nimmt die ganze Breite: vier Bubbles passen in keine halbe
     Spalte, ohne die Nachbarkachel auf dieselbe Hoehe leer mitzuziehen.
     Rahmen und Farbabstufung wie bei .haus — dieselbe Sprache. */
  .mitbubbles{
    grid-column:1/-1; background:#DFE5E5; border-radius:20px; padding:8px;
    display:flex; flex-direction:column; gap:8px;
  }
  .mitbubbles > .tile{
    width:100%; min-height:0; flex-direction:row; align-items:center;
    gap:14px; flex-wrap:wrap; border-radius:14px; padding:16px;
  }
  .mitbubbles > .tile .txt{flex:1 1 140px; min-width:0}
  .mitbubbles > .tile .name{font-size:17px}
  /* Schmal: die Chips unter den Namen. Breit: neben ihn — sonst bliebe rechts
     eine handbreite leere Flaeche stehen. */
  .mitbubbles > .tile .foot{flex-basis:100%; margin-top:6px}
  @media(min-width:680px){
    .mitbubbles > .tile .foot{flex-basis:auto; margin:0 0 0 auto}
  }
  /* Das Haussymbol darf hier groesser sein — die Karte hat die Breite dafuer. */
  .mitbubbles > .tile .ico{width:76px; height:76px; border-radius:18px}
  @media(min-width:680px){
    .mitbubbles > .tile .ico{width:84px; height:84px; border-radius:20px}
  }

  /* CCCXLIX — Cashflow-Indikator oben rechts in der Kachel. Schlicht: ein
     kleiner runder Punkt mit Pfeil, gruen bei Ueberschuss, rot bei Fehlbetrag.
     Kein Betrag, keine Zahl — nur die Richtung. `position:relative` auf .tile,
     damit der Punkt in der Kachel sitzt (gehoert spaeter nach immo.css). */
  .tile{position:relative}
  .tile .cf{
    position:absolute; top:12px; right:12px;
    display:inline-flex; align-items:center; gap:4px;
    padding:4px 9px 4px 7px; border-radius:999px;
    font:600 12px var(--mono); line-height:1; white-space:nowrap;
    box-shadow:0 1px 2px rgba(22,38,44,.06);
  }
  .tile .cf svg{display:block; fill:currentColor; flex:none}
  .tile .cf.pos{background:var(--pos-bg); color:var(--pos)}
  .tile .cf.neg{background:var(--neg-bg); color:var(--neg)}
  /* Platz oben rechts freihalten, damit ein langer Name nicht unter die
     Cashflow-Pille laeuft. Nur wo eine Pille sitzt. */
  .tile.hat-cf .txt{padding-right:96px}
  /* In der breiten Bubble-Karte sitzt der Fuss (Chips) rechts — dort ruecken
     wir die Pille etwas hoeher, damit sie nicht auf die Chips trifft. */
  .mitbubbles > .tile .cf{top:10px; right:14px}
  /* N110 — die PV-Anlage ist ein EIGENES Investment an der Immobilie, kein
     Statuszeichen: sie steht deshalb als freischwebendes Modul NEBEN dem
     Hauslogo (kein Kasten, kein Hintergrund) und führt angetippt direkt in
     „PV & Amortisation", wo Investment, Eigentümer-‰ und Amortisation gepflegt
     werden. Vorher war es eine kleine Pille, die niemand als Weg erkannt hat. */
  .tile .pv-invest{
    position:absolute; top:10px; right:10px;
    display:inline-flex; flex-direction:column; align-items:center; gap:2px;
    background:none; border:none; padding:4px; cursor:pointer;
    color:var(--soft); text-decoration:none; z-index:2;
  }
  .tile .pv-invest svg{width:46px; height:46px; display:block;
    filter:drop-shadow(0 2px 4px rgba(22,38,44,.18))}
  .tile .pv-invest .pvt{font:600 8.5px var(--mono); letter-spacing:.1em;
    text-transform:uppercase; color:var(--amber)}
  .tile .pv-invest:hover svg{filter:drop-shadow(0 3px 7px rgba(22,38,44,.28))}
  .tile .pv-invest:focus-visible{outline:2px solid var(--teal); outline-offset:3px;
    border-radius:10px}
  .tile.hat-cf .pv-invest{top:46px}
  .mitbubbles > .tile .pv-invest{top:12px; right:16px}
  .mitbubbles > .tile .pv-invest svg{width:54px; height:54px}
  @media(min-width:680px){ .tile .pv-invest svg{width:52px; height:52px} }

  /* Grundform der Blasen steht geteilt in immo.css (CCCLXXVIII c). Hier bleiben
     nur die startseiten-eigenen Zustände und Zusätze. */
  .bubbles{padding:0 2px 2px}
  /* CCCLXVII — beide Zustaende tragen jetzt Farbe: vermietet ruhig gruen
     (dieselbe Paarung wie die Cashflow-Pille), frei weiter warm amber. */
  .bubble.vermietet{background:var(--pos-bg)}
  .bubble.frei{background:var(--amber-bg)}
  /* Die Monatsmiete ist die Zahl, wegen der man hinsieht — mono, gruen. */
  .bubble .bm{font:600 12px var(--mono); color:var(--pos); white-space:nowrap}
  /* Der Quadratmeterpreis ordnet nur ein und bleibt leise. */
  .bubble .bqm{font:500 10px var(--mono); color:var(--soft); white-space:nowrap}
  /* Der Aufklapper bleibt leise — er ist keine Einheit. */
  .bubble.mehr{background:rgba(255,255,255,.5); box-shadow:none;
               font:600 11.5px var(--mono); color:var(--soft);
               letter-spacing:.04em}

  /* LXX — Was ansteht. Ruhig: derselbe Merkstreifen wie auf der Objektseite,
     nur anklickbar. Steht unter den Kacheln, damit es sie nicht erschlaegt. */
  .merker.sprung{width:100%; text-align:left; border:none; cursor:pointer;
                 font-family:var(--body); align-items:center}
  .merker.sprung:hover{filter:brightness(.98)}
  .merker .wann{font:600 11px var(--mono); white-space:nowrap; flex:none;
                opacity:.85; align-self:center}
  .weitere{display:block; font:400 12.5px var(--body); color:var(--soft);
           margin:2px 0 6px; padding-left:2px}
  /* Luft zwischen der letzten Kachel und der Überschrift — sonst klebt sie an
     der Kachelkante. */
  #ansteht h2.sec{margin-top:26px}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <img src="icons/icon.svg" alt="" class="applogo">
    <div class="barwrap">
      <h1>Immobilien</h1>
      <div class="sub" id="sub">wird geladen …</div>
    </div>
  </div>

  <div class="scroll">
    <div id="objekte"></div>

    <div id="ansteht"></div>

    <h2 class="sec">Verwalten</h2>
    <a class="row ghost" href="onboarding.html">
      <span class="ic">＋</span>
      <span class="txt">
        <span class="t">Immobilie einrichten</span>
        <span class="d">Grunddaten, Turnus, Kostenarten, Einheiten</span>
      </span>
      <span class="arr">›</span>
    </a>
  </div>

  <div data-nav></div>
</div>

<script type="module">
import { installLogos, installNav, logoSvg, api, esc, eurVoll, fristKlasse,
         fristText } from './assets/immo.js';
installNav();

installLogos();

const ziel = document.getElementById('objekte');
const sub = document.getElementById('sub');

/* N87 — Zeichen für ein PV-Add-on an der Immobilie: Sonne über Modul, flach im
   Bestandsstil (kein Icon-Paket). */
const PV_ICON = `<svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <!-- N110 - Black-Edition-Solarmodul: dunkle Zellen mit feinem Raster, leicht
       angeschraegt wie ein Dachmodul, dazu ein Sonnenbogen. Flaechig statt
       Strichzeichnung, damit es neben der Objektkachel als eigenes Investment
       auftritt und nicht wie ein Statuszeichen wirkt. -->
  <path d="M12.5 6.5h27l6 24h-27z" fill="#16262C"/>
  <path d="M12.5 6.5h27l6 24h-27z" stroke="#0B1A20" stroke-width="1.2"/>
  <g stroke="#3C4E55" stroke-width="1" opacity=".85">
    <path d="M21.5 6.5l6 24M30.5 6.5l6 24M14.6 14.5h27.4M16.5 22.5h27"/>
  </g>
  <path d="M18.5 30.5l-3 11M39.5 30.5l3 11M13 41.5h32" stroke="#16262C"
    stroke-width="2.4" stroke-linecap="round"/>
  <g stroke="#916212" stroke-width="2.1" stroke-linecap="round">
    <path d="M8 12.5a9 9 0 0 1 9-9"/><path d="M3.5 17.5h2.4M6 8.6l1.7 1.7"/>
  </g>
</svg>`;

/* ---- Ort → Strasse → Einheit -------------------------------------------
   Spiegelt api/app/bezeichnung.py:hierarchie(). Die Felder sind gewachsen:
   die Strasse steht mal in `strasse`, mal im Namen, der Ort mal in `ort`,
   mal als "(Ort)" vor dem Namen — und in `ort` steht vereinzelt gar kein Ort,
   sondern die Nutzung ("Mixed-Use · 7 Einheiten"). Erst sortieren, dann
   anzeigen; sonst steht Unsinn gross in der Kachel. */
const KEIN_ORT = /mixed[\s-]?use|mfh|efh|zfh|mehrfamilien|einfamilien|zweifamilien|doppelhaus|reihenhaus|wohnanlage|gewerbe|stellplatz|garage|\d\s*(einheit|wohnung|gewerbe|zimmer|partei|stellplatz)/i;
const IST_EINHEIT = /^(whg|wohnung|einheit|eg|og|ug|dg|kg|souterrain|dachgeschoss|stellplatz|garage|laden|b[üu]ro|praxis|gewerbe|halle|keller)\b/i;
const IST_STRASSE = /(stra(ß|ss)e|str\.|weg|allee|platz|gasse|ring|winkel|damm|ufer|steig|zeile|chaussee|pfad|hof|berg|feld|anger|markt)\b|\d+\s*[a-zA-Z]?$/;
const TRENNER = /\s*[·•]\s*|\s+[-–—]\s+/;
const sauber = t => String(t || '').replace(/\s+/g, ' ').trim();

function hierarchie(o) {
  let ort = sauber(o.ort).split(TRENNER).filter(t => t && !KEIN_ORT.test(t))[0] || '';

  let rest = sauber(o.name);
  const klammer = rest.match(/^\((.+?)\)\s*(.*)$/);
  if (klammer) {                       // "(Teststadt) Prüfweg 5 · EG"
    if (!ort && !KEIN_ORT.test(klammer[1])) ort = sauber(klammer[1]);
    rest = sauber(klammer[2]);
  }

  let strasse = sauber(o.strasse);
  const einheiten = [];
  for (const stueck of rest.split(TRENNER).filter(Boolean)) {
    const klein = stueck.toLowerCase();
    if (klein === ort.toLowerCase() || klein === strasse.toLowerCase()) continue;
    if (!strasse && !IST_EINHEIT.test(stueck) && IST_STRASSE.test(stueck)) {
      strasse = stueck; continue;
    }
    einheiten.push(stueck);
  }
  // Ohne erkennbare Strasse ist der Name selbst die mittlere Ebene — eine
  // leere Strassenzeile ueber einer gefuellten Einheit waere kopflastig.
  if (!strasse && einheiten.length) strasse = einheiten.shift();
  return { ort, strasse: strasse || sauber(o.name), einheit: einheiten.join(' · ') };
}

function chips(frist_tage, offen) {
  const teile = [];
  const frist = fristText(frist_tage);
  if (frist) teile.push(`<span class="chip ${fristKlasse(frist_tage)}">${frist}</span>`);
  if (offen > 0)
    teile.push(`<span class="chip amber">${offen} Beleg${offen > 1 ? 'e' : ''} offen</span>`);
  if (!teile.length) teile.push('<span class="chip pos">alles erledigt</span>');
  return `<span class="foot">${teile.join('')}</span>`;
}

/* ---- CXLV — die Einheiten INNERHALB eines Objekts ------------------------
   Nicht zu verwechseln mit der Gruppierung weiter unten: dort sind es eigene
   Objekte derselben Adresse, hier die Tabelle `Einheit` eines Objekts.
   Ab zwei Einheiten lohnt die Aufzaehlung; bei einer einzigen stuende dieselbe
   Angabe nur ein zweites Mal in der Kachel. */
const flaecheText = f => `${Number(f).toLocaleString('de-DE',
  { maximumFractionDigits: 1 })} m²`;

/* CCCLXVII — Miete je m²: eine Nachkommastelle reicht, der Cent je
   Quadratmeter sagt nichts und macht die Blase nur breiter. */
const qmMieteText = v => `${Number(v).toLocaleString('de-DE',
  { minimumFractionDigits: 1, maximumFractionDigits: 1 })} €/m²`;

/* Ab hier wird zugeklappt: ein Haus mit zwanzig Einheiten wuerde die Karte
   sonst ueber den ganzen Schirm ziehen. */
const MAX_BUBBLES = 6;

/* CCCLXVII — vermietet ist gruen und nennt die Miete, frei bleibt amber.
   Ist keine Miete gepflegt, bleibt die Blase gruen und zeigt nur, was da ist —
   eine Zahl wird nicht erfunden. */
function bubble(o, e, versteckt = false) {
  const name = e.bezeichnung || 'Einheit';
  const miete = e.vermietet && e.miete_monat > 0 ? e.miete_monat : 0;
  const titel = `${name} · ${e.vermietet ? 'vermietet' : 'nicht vermietet'}`
    + (miete ? ` · ${eurVoll(miete)} im Monat` : '');
  return `<button class="bubble ${e.vermietet ? 'vermietet' : 'frei'}"
          data-slug="${esc(o.slug)}"${e.id != null ? ` data-e="${esc(String(e.id))}"` : ''}${versteckt ? ' data-rest hidden' : ''}
          title="${esc(titel)}">
      <span class="bt">${esc(name)}</span>
      ${e.flaeche ? `<span class="bf">${flaecheText(e.flaeche)}</span>` : ''}
      ${miete ? `<span class="bm">${eurVoll(miete)}</span>` : ''}
      ${miete && e.miete_qm ? `<span class="bqm">${qmMieteText(e.miete_qm)}</span>` : ''}
      ${e.vermietet ? '' : '<span class="bfrei">frei</span>'}
    </button>`;
}

function bubbles(o) {
  const liste = o.einheiten_liste || [];
  if (liste.length < 2) return '';
  const rest = liste.length - MAX_BUBBLES;
  const label = `+${rest} weitere`;
  return `<div class="bubbles">
      ${liste.map((e, i) => bubble(o, e, i >= MAX_BUBBLES)).join('')}
      ${rest > 0 ? `<button class="bubble mehr" data-mehr="${esc(label)}"
                            aria-expanded="false">${esc(label)}</button>` : ''}
    </div>`;
}

/* ---- CCCXLIX — Cashflow je Objekt ---------------------------------------
   Der Jahres-Saldo (Einnahmen − Ausgaben) kommt aus /api/auswertung, je Objekt
   nach slug. Gezeigt wird nur die Richtung als kleiner Pfeil: ein grüner nach
   oben bei Überschuss, ein roter nach unten bei Fehlbetrag. Fehlt der Wert oder
   ist er glatt null, bleibt der Punkt weg — nichts wird erfunden. */
const saldoMap = new Map();

function saldoIndikator(slug) {
  const s = saldoMap.get(slug);
  if (s == null || s === 0) return '';
  const pos = s > 0;
  const pfeil = pos ? 'M8 4l4 6H4z' : 'M8 12l-4-6h8z';   // Dreieck hoch / runter
  // Kleine Zahl dazu: der Jahres-Cashflow, gerundet, mit Vorzeichen (CCCLV).
  const betrag = `${pos ? '+' : '−'}${Math.abs(Math.round(s)).toLocaleString('de-DE')} €`;
  return `<span class="cf ${pos ? 'pos' : 'neg'}"
                title="Cashflow pro Jahr: ${betrag}">
      <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="${pfeil}"/></svg>
      <span class="cfv">${betrag}</span>
    </span>`;
}

/* Einzelkachel. `feinste` zeigt nur die Einheit gross — innerhalb einer
   Hausgruppe stehen Ort und Strasse bereits in der Oberkachel; Bubbles
   entfallen dort, weil die Gruppe schon die feine Ebene ist. */
function kachel(o, feinste = false) {
  const h = o._h;
  const gross = feinste ? (h.einheit || h.strasse) : h.strasse;
  const oben = feinste ? '' : (h.ort ? `<span class="ortszeile">${esc(h.ort)}</span>` : '');
  const bub = feinste ? '' : bubbles(o);
  // CCCXIV — das Grundstück trägt unter dem Namen seine Flurnummer, gesetzt wie
  // die Einheitenzeile links (mono, gedeckt), statt eines Chips am Fuss. So ist
  // die Kachel gleich formatiert wie die eines Hauses: Ort · Name · Unterzeile.
  const grundstueck = o.typ === 'lg-grundstueck';
  const unten = grundstueck
    ? (o.flurstueck ? `<span class="einheit flur">${esc(o.flurstueck)}</span>` : '')
    : feinste
      ? (h.einheit ? '' : `<span class="einheit">${o.einheiten || 1} Einheit${(o.einheiten || 1) > 1 ? 'en' : ''}</span>`)
      : (h.einheit ? `<span class="einheit">${esc(h.einheit)}</span>` : '');

  const cf = grundstueck ? '' : saldoIndikator(o.slug);
  const knopf = `<button class="tile${cf ? ' hat-cf' : ''}" data-slug="${esc(o.slug)}">
      ${cf}
      <span class="ico">${logoSvg(o.typ)}</span>
      <span class="txt">
        ${oben}
        <span class="name">${esc(gross)}</span>
        ${unten}
      </span>
      ${o.hat_pv ? `<a class="pv-invest" href="strom.html?objekt=${esc(o.slug)}"
        title="PV-Anlage — Investment, Eigentümer-Anteile und Amortisation"
        aria-label="PV-Anlage konfigurieren"
        onclick="event.stopPropagation()">${PV_ICON}<span class="pvt">PV</span></a>` : ''}
      ${grundstueck ? '' : chips(o.frist_tage, o.offene_positionen)}
    </button>`;
  return bub ? `<section class="mitbubbles">${knopf}${bub}</section>` : knopf;
}

/* Oberkachel einer Adresse: Stammdaten und die zusammengefassten Zahlen.
   Sie fuehrt bewusst NICHT auf ein Objekt — die Adresse ist kein Objekt, die
   Wahl "erstes der Gruppe" waere willkuerlich. Stattdessen klappt sie die
   Einheiten auf und zu; angeklickt wird die Einheit, die man wirklich meint. */
function hauskachel(g, id) {
  const einheiten = g.objekte.reduce((s, o) => s + (o.einheiten || 1), 0);
  const offen = g.objekte.reduce((s, o) => s + (o.offene_positionen || 0), 0);
  const fristen = g.objekte.map(o => o.frist_tage).filter(t => t !== null && t !== undefined);
  const frist = fristen.length ? Math.min(...fristen) : null;

  return `<section class="haus">
      <button class="tile haus-kopf" aria-expanded="true" aria-controls="${id}"
              data-gruppe="${id}">
        <span class="ico">${logoSvg(g.objekte[0].typ)}</span>
        <span class="txt">
          ${g.ort ? `<span class="ortszeile">${esc(g.ort)}</span>` : ''}
          <span class="name">${esc(g.strasse)}</span>
          <span class="einheit">${einheiten} Einheiten</span>
        </span>
        <span class="klapp" aria-hidden="true">▾</span>
        ${chips(frist, offen)}
      </button>
      <div class="grid" id="${id}">${g.objekte.map(o => kachel(o, true)).join('')}</div>
    </section>`;
}

/* Einheiten derselben Adresse gehoeren zusammen. Gruppiert wird nur, wo es
   wirklich mehrere sind — eine Oberkachel ueber einer einzigen Einheit waere
   nur eine leere Huelle. Geschluesselt wird nach der ZERLEGTEN Adresse, nicht
   nach den Rohfeldern: sonst faende sich nichts zusammen, wo die Strasse im
   Namen statt im Feld `strasse` steht. */
function gruppieren(objekte) {
  const eimer = new Map();
  for (const o of objekte) {
    const h = o._h;
    const k = [sauber(o.plz), h.ort, h.strasse].filter(Boolean).join(' ').toLowerCase();
    if (!k) { eimer.set(`einzeln:${o.slug}`, { objekte: [o] }); continue; }
    if (!eimer.has(k)) eimer.set(k, { ort: h.ort, strasse: h.strasse, objekte: [] });
    eimer.get(k).objekte.push(o);
  }
  const gruppen = [...eimer.values()].filter(g => g.objekte.length > 1);
  // Haeuser mit mehreren Einheiten nehmen die ganze Zeile ein. Stuenden sie
  // zwischen den halbbreiten Kacheln, liesse das Raster Loecher — deshalb
  // zuerst. Innerhalb der beiden Bloecke bleibt die Reihenfolge der API.
  const breit = o => (o.einheiten_liste || []).length > 1 ? 0 : 1;
  const einzeln = [...eimer.values()].filter(g => g.objekte.length === 1)
    .flatMap(g => g.objekte)
    .sort((a, b) => breit(a) - breit(b));
  return { gruppen, einzeln };
}

try {
  // Objektliste und Jahres-Saldi parallel holen. Die Auswertung ist Beiwerk —
  // scheitert sie, fehlt nur der Cashflow-Punkt, die Kacheln stehen trotzdem.
  const [roh, auswertung] = await Promise.all([
    api('/objekte'),
    api('/auswertung').catch(() => null),
  ]);
  const objekte = roh.filter(o => o.aktiv !== false);
  if (auswertung && Array.isArray(auswertung.objekte))
    for (const z of auswertung.objekte) saldoMap.set(z.slug, z.saldo);

  if (!objekte.length) {
    sub.textContent = 'noch keine Immobilie';
    ziel.innerHTML = `<div class="empty">
        <div class="big">Noch keine Immobilie</div>
        <p>Lege deine erste Immobilie an — danach erscheinen hier
           Fristen und offene Belege auf einen Blick.</p>
      </div>`;
  } else {
    const n = objekte.length;
    sub.textContent = `${n} ${n === 1 ? 'Objekt' : 'Objekte'} · ImmoCalc`;
    for (const o of objekte) o._h = hierarchie(o);
    const { gruppen, einzeln } = gruppieren(objekte);
    ziel.innerHTML = gruppen.map((g, i) => hauskachel(g, `haus${i}`)).join('')
      + (einzeln.length
        ? (gruppen.length ? '<div class="gruppe">Einzelne Einheiten</div>' : '')
          + `<div class="grid">${einzeln.map(o => kachel(o)).join('')}</div>`
        : '');
  }
} catch (e) {
  sub.textContent = 'API nicht erreichbar';
  ziel.innerHTML = `<div class="empty">
      <div class="big">Keine Verbindung zur API</div>
      <p>Die Objektliste konnte nicht geladen werden. Prüfe, ob der
         Container <code>immocalc-api</code> läuft.</p>
    </div>`;
}

/* ---- Was ansteht ---------------------------------------------------------
   Fristen nach § 556 BGB und erwartete Jahresabrechnungen, beides aus
   /api/erinnerungen. Steht unter den Kacheln und zeigt nur die dringendsten —
   die Liste ist serverseitig sortiert (Fälliges zuerst). Ist nichts offen,
   erscheint gar nichts: eine leere Überschrift wäre nur Lärm. */
const MAX_ERINNERUNGEN = 4;
const tageText = t => t == null ? ''
  : t < 0 ? `${Math.abs(t)} Tage über` : t === 0 ? 'heute' : `in ${t} Tagen`;

/* Ein volles Jahr liest sich als Jahreszahl — "01.01.2024 – 31.12.2024" ist
   in einer Zeile nur Ballast. */
const kurzZeitraum = l => (/^01\.01\.(\d{4}) – 31\.12\.\1$/.exec(l || '') || [, l])[1];

/* Der Text der API nennt Frist und Restzeit noch einmal im Satz; hier stehen
   beide ohnehin als Titel und als Zeitangabe rechts. Deshalb kurz halten —
   jede Information nur einmal. */
function erinnerungHtml(e) {
  const frist = e.art === 'frist';
  const titel = frist ? `Abrechnungsfrist § 556 · ${kurzZeitraum(e.zeitraum)}`
                      : e.kostenart;
  const unten = frist ? e.name : `${e.name} · Jahresabrechnung erwartet`;
  return `<button class="merker sprung ${e.faellig ? 'neg' : ''}"
                  data-slug="${esc(e.objekt)}">
      <span class="hi">${frist ? '§' : '▤'}</span>
      <span class="ht">
        <span class="t">${esc(titel)}</span>
        <span class="d">${esc(unten)}</span>
      </span>
      <span class="wann">${esc(tageText(e.tage))}</span>
    </button>`;
}

const ansteht = document.getElementById('ansteht');
try {
  const { erinnerungen } = await api('/erinnerungen');
  if (erinnerungen.length) {
    const rest = erinnerungen.length - MAX_ERINNERUNGEN;
    ansteht.innerHTML = '<h2 class="sec">Was ansteht</h2>'
      + erinnerungen.slice(0, MAX_ERINNERUNGEN).map(erinnerungHtml).join('')
      + (rest > 0 ? `<span class="weitere">und ${rest} weitere</span>` : '');
  }
} catch {
  /* Erinnerungen sind Beiwerk — ohne sie bleibt die Seite vollständig. */
}

ansteht.addEventListener('click', e => {
  const t = e.target.closest('[data-slug]');
  if (t) location.href = `objekt.html?o=${encodeURIComponent(t.dataset.slug)}`;
});

ziel.addEventListener('click', e => {
  const mehr = e.target.closest('[data-mehr]');
  if (mehr) {                       // restliche Einheiten ein- und ausblenden
    const auf = mehr.getAttribute('aria-expanded') === 'true';
    for (const b of mehr.parentElement.querySelectorAll('.bubble[data-rest]'))
      b.hidden = auf;
    mehr.setAttribute('aria-expanded', auf ? 'false' : 'true');
    mehr.textContent = auf ? mehr.dataset.mehr : 'weniger';
    return;
  }
  const kopf = e.target.closest('[data-gruppe]');
  if (kopf) {                       // Oberkachel: Einheiten auf-/zuklappen
    const auf = kopf.getAttribute('aria-expanded') === 'true';
    kopf.setAttribute('aria-expanded', auf ? 'false' : 'true');
    document.getElementById(kopf.dataset.gruppe).hidden = auf;
    return;
  }
  const t = e.target.closest('[data-slug]');
  if (t) {
    // CCCXLVIII — eine Einheiten-Bubble trägt ihre Einheit-ID und springt direkt
    // auf diese Ebene; eine Kachel ohne ID öffnet wie bisher das Haus.
    const eid = t.dataset.e;
    location.href = `objekt.html?o=${encodeURIComponent(t.dataset.slug)}`
      + (eid ? `&e=${encodeURIComponent(eid)}` : '');
  }
});
</script>
</body>
</html>
