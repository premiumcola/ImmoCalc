  /* Die Restschuld, auf die sich beide Felder beziehen — null, solange keine
     eingetragen ist. */
  const basis = () => {
    const r = zahlAus(rest);
    return r && r > 0 ? r : null;
  };

  const setze = (feld, wert) => {
    rechnet = true;
    feld.value = wert == null ? '' : String(wert);
    rechnet = false;
  };
  const auf2 = n => Math.round(n * 100) / 100;

  function ausSatz() {
    const r = basis();
    const s = zahlAus(satz);
    setze(monat, r == null || s == null ? null : auf2(r * s / 100 / 12));
  }

  /* Umgekehrt nur, wenn wirklich etwas dasteht: ein geleertes Hilfsfeld soll
     keinen eingetragenen Zinssatz mitnehmen. */
  function ausMonat() {
    const r = basis();
    const m = zahlAus(monat);
    if (r == null || m == null) return;
    setze(satz, auf2(m * 12 / r * 100));
  }

  /* Die fehlende Restschuld wird erst zum Thema, wenn wirklich etwas
     umzurechnen wäre — ein frisch geöffnetes Formular wird nicht gleich
     ermahnt. */
  function melde() {
    if (!note) return;
    const angefangen = zahlAus(satz) != null || zahlAus(monat) != null;
    note.textContent = !basis() && angefangen ? ZINSTEXT.nein : ZINSTEXT.ja;
  }

  const beiEingabe = rechnung => () => {
    if (rechnet) return;
    rechnung();
    melde();
  };

  satz.addEventListener('input', beiEingabe(ausSatz));
  monat.addEventListener('input', beiEingabe(ausMonat));
  // Ändert sich die Restschuld, gilt weiter der Zinssatz — er ist das
  // Gespeicherte, der Zinsanteil folgt ihm.
  rest.addEventListener('input', beiEingabe(ausSatz));

  melde();
  ausSatz();
}

/* Die Felder, die gerade im Dialog stehen. Beim Speichern wird genau das
   ausgelesen, was auch gezeigt wurde — bei den Verträgen hängt das an der
   Vertragsart und lässt sich nicht aus dem Bereich allein ableiten. */
let dialogFelder = [];
/* Baut den offenen Dialog mit anderen Feldern neu auf, ohne das Eingetippte
   zu verlieren. Gesetzt von `formular`, gerufen vom Auswahlfeld mit `umbau`. */
let dialogUmbau = null;

// CCCXXIII — die PDF-Spalte des Bearbeiten-Dialogs sauber wieder abräumen,
// sobald er schliesst: Klasse weg (nächste schmale Maske bleibt schmal),
// Object-URLs freigeben, Inhalt leeren.
if (!dlg._pdfWired) {
  dlg._pdfWired = true;
  dlg.addEventListener('close', () => {
    (dlg._pdfUrls || []).forEach(u => URL.revokeObjectURL(u));
    dlg._pdfUrls = [];
    dlg.classList.remove('mit-pdf');
    const p = document.getElementById('dlgPdf');
    p.innerHTML = '';
    delete p.dataset.docId;
  });
}

async function formular(einst) {
  const { titel: dtitel, felder, bereich, werte = {}, absicht,
          hinweis = '', extra = '', knopf = 'Speichern', beleg = null } = einst;
  const form = document.getElementById('dlgForm');
  // Beleg daneben (CCCXXIII): nur laden, wenn sich das Dokument ändert — sonst
  // flackerte die Vorschau bei jedem reaktiven Umbau des Formulars.
  const pdf = document.getElementById('dlgPdf');
  if (beleg && beleg.id) {
    dlg.classList.add('mit-pdf');
    if (pdf.dataset.docId !== String(beleg.id)) {
      (dlg._pdfUrls || []).forEach(u => URL.revokeObjectURL(u));
      pdf.innerHTML = '<div class="beleg-flaeche"></div>';
      dlg._pdfUrls = belegSeitenLaden(`/api/dokumente/${beleg.id}`,
        pdf.querySelector('.beleg-flaeche'), beleg.dateiname || 'Beleg',
        `/api/dokumente/${beleg.id}/inhalt`);
      pdf.dataset.docId = String(beleg.id);
    }
  } else {
    dlg.classList.remove('mit-pdf');
    (dlg._pdfUrls || []).forEach(u => URL.revokeObjectURL(u));
    dlg._pdfUrls = [];
    pdf.innerHTML = '';
    delete pdf.dataset.docId;
  }
  const html = await Promise.all(
    felder.map(f => feldHtml(f, bereich, werte[f.k])));
  document.getElementById('dlgTitel').textContent = dtitel;
  // Abbrechen ist bewusst type="button": als Submit-Knopf loeste es den
  // submit-Handler aus und speicherte. Die Abfrage darauf lief ins Leere,
  // weil returnValue am <dialog> haengt, nicht am <form>.
  form.innerHTML = (hinweis ? `<p class="dlgnote">${esc(hinweis)}</p>` : '')
    + html.join('') + extra +
    `<button class="btn" value="ok">${esc(knopf)}</button>
     <button class="btn leise" type="button" data-abbruch
             style="margin-top:8px">Abbrechen</button>`;
  form.dataset.absicht = absicht;
  form.dataset.bereich = bereich || '';
  form.dataset.id = werte.id || '';
  delete form.dataset.vorgaenger;   // sonst endet beim nächsten Mal ein fremder Stand
  dialogFelder = felder;
  dialogUmbau = async () => {
    // Das schon Eingetippte überlebt den Umbau — nur die Felder wechseln.
    const stand = bereich === 'kredite'
      ? uebernahmeAnbieten({ ...werte, ...ausFormular(form, felder) })
      : { ...werte, ...ausFormular(form, felder) };
    await formular({ ...einst, felder: felderFuer(bereich, stand, absicht),
                     werte: stand });
  };
  formateSetzen(form, felder);
  auswahlSetzen(form);
  zinsKopplung(form);
  installHilfe(form);
  // Ein zweiter showModal-Aufruf auf einem offenen Dialog wirft — der Wechsel
  // von der Miete zur Erhöhung tauscht nur den Inhalt aus.
  if (!dlg.open) dlg.showModal();
  form.scrollTop = 0;
}

/* N35 — Werkzeug „Zeiträume umstellen": Grenzen verschieben, teilen, neuen
   Zeitraum anlegen und Belege nach Datum neu zuordnen. Reine GUI über die
   Zeitraum-Endpunkte (PATCH /zeitraeume, /teilen, /belege-abgleichen). */
async function zeitraumWerkzeug() {
  const dlg = document.createElement('dialog');
  dlg.className = 'immo-dlg zuord-dlg zw-breit';
  document.body.appendChild(dlg);
  dlg.addEventListener('close', () => dlg.remove());
  let veraendert = false;   // ob die Seite dahinter neu geladen werden muss

  const rowHtml = z => {
    const offen = z.status === 'in Arbeit';
    return `<div class="zw-row">
        <div class="zw-lbl">${esc(z.label)}
          <span class="zw-typ">${esc(z.typ)}</span>
          ${offen ? '' : '<span class="zw-zu">abgeschlossen</span>'}</div>
        ${offen ? `<div class="zw-felder">
          <input type="date" data-zw-start value="${esc(z.start || '')}" aria-label="Start">
          <input type="date" data-zw-ende value="${esc(z.ende || '')}" aria-label="Ende">
          <button class="zw-b" data-zw-save="${z.id}">Speichern</button></div>
        <div class="zw-teil"><label>teilen ab</label>
          <input type="date" data-zw-teildatum aria-label="Teilungsdatum">
          <button class="zw-b teil" data-zw-teilen="${z.id}">Teilen</button></div>`
        : ''}
      </div>`;
  };

  async function rendern() {
    const det = await api(`/objekte/${encodeURIComponent(slug)}`);
    const alle = (det.zeitraeume || []).slice()
      .sort((a, b) => (a.start || '').localeCompare(b.start || ''));
    // Nur bestückte Zeiträume zeigen — die vielen leeren, automatisch
    // angelegten Alt-Jahre gehören nicht in dieses Werkzeug.
    const zs = alle.filter(z => (z.positionen || 0) > 0);
    const versteckt = alle.length - zs.length;
    const verstecktText = versteckt === 1
      ? '1 leerer Zeitraum ausgeblendet'
      : `${versteckt} leere Zeiträume ausgeblendet`;
    dlg.innerHTML = `
      <div class="zd-kopf"><span class="zd-t">Zeiträume umstellen</span>
        <button class="zd-x" data-nein aria-label="Schließen">×</button></div>
      <p class="zw-intro">Jeder Beleg gehört in <b>genau einen</b> Zeitraum — den,
        in dessen Datumsfenster er fällt. Grenzen ändern oder teilen, dann
        <b>Belege neu zuordnen</b>: die App schiebt jeden Beleg ins richtige
        Fenster und markiert Grenzfälle (z. B. Jahresrechnungen, die anteilig in
        zwei Zeiträume gehören — die teilst du danach per Teilbetrag auf).</p>
      <div class="zw-body">
        <div class="zw-links">
          ${zs.map(rowHtml).join('') || '<p class="zw-intro">Noch kein bestückter Zeitraum.</p>'}
          ${versteckt ? `<div class="zw-leer">${verstecktText}</div>` : ''}
        </div>
        <div class="zw-rechts">
          <div class="zw-neu"><span class="zd-l">Neuer Zeitraum</span>
            <div class="zw-felder">
              <input type="date" data-zw-neu-start aria-label="Start neuer Zeitraum">
              <input type="date" data-zw-neu-ende aria-label="Ende neuer Zeitraum">
              <button class="zw-b" data-zw-neu>Anlegen</button></div></div>
          <div class="zw-abgl">
            <button class="zd-ok" data-zw-abgleich>Belege nach Datum neu zuordnen</button></div>
          <div class="zw-erg" id="zwErg"></div>
        </div>
      </div>
      <div class="zd-fuss"><button class="zd-ab" data-nein>Schließen</button></div>`;
  }

  const erg = () => dlg.querySelector('#zwErg');
  const fehlerText = f => String(f?.message || f || 'Das ging nicht.');
  // N52 — Meldungen IM Dialog zeigen: ein modaler <dialog> liegt in der obersten
  // Browser-Ebene, ein normaler Toast (`melde`) läge dahinter (unlesbar). Erfolg
  // grün, Fehler rot, direkt im Ergebnis-Bereich.
  const zeigeErg = (text, art = 'fehler') => {
    const e = erg();
    if (e) e.innerHTML = `<div class="zw-${art}">${esc(text)}</div>`;
  };

  async function speichern(id, row) {
    const start = row.querySelector('[data-zw-start]').value;
    const ende = row.querySelector('[data-zw-ende]').value;
    if (!start || !ende) return zeigeErg('Start und Ende angeben.');
    try {
      await api(`/zeitraeume/${id}`, { method: 'PATCH', body: { start, ende } });
    } catch (f) { return zeigeErg(fehlerText(f)); }
    veraendert = true; await rendern(); zeigeErg('Grenzen gespeichert.', 'ok');
  }

  async function teilen(id, row) {
    const datum = row.querySelector('[data-zw-teildatum]').value;
    if (!datum) return zeigeErg('Teilungsdatum angeben.');
    try {
      await api(`/zeitraeume/${id}/teilen`, { method: 'POST', body: { datum } });
    } catch (f) { return zeigeErg(fehlerText(f)); }
    veraendert = true; await rendern(); zeigeErg('Zeitraum geteilt.', 'ok');
  }

  async function neuAnlegen() {
    const start = dlg.querySelector('[data-zw-neu-start]').value;
    const ende = dlg.querySelector('[data-zw-neu-ende]').value;
    if (!start || !ende) return zeigeErg('Start und Ende angeben.');
    try {
      await api(`/objekte/${encodeURIComponent(slug)}/zeitraeume`,
                { method: 'POST', body: { start, ende } });
    } catch (f) { return zeigeErg(fehlerText(f)); }
    veraendert = true; await rendern(); zeigeErg('Zeitraum angelegt.', 'ok');
  }

  function abgleichBericht(v, angewandt) {
    const moves = (v.moves || []).map(m =>
      `<div class="zw-move">• <b>${esc(m.name)}</b>: ${esc(m.von)} → ${esc(m.nach)}</div>`).join('');
    const GF = { kein_datum: 'kein Belegdatum', kein_zeitraum: 'Datum in keinem Zeitraum',
                 randnah: 'randnah — evtl. zeitanteilig prüfen' };
    const gf = (v.grenzfaelle || []).map(g =>
      `<div class="zw-gf">▲ <b>${esc(g.name)}</b>: ${esc(GF[g.typ] || g.typ)}</div>`).join('');
    const kopf = angewandt
      ? `<b>${v.verschoben} Beleg(e) verschoben.</b>`
      : `<b>${v.wandern} Beleg(e) würden wandern.</b>`;
    const knopf = (!angewandt && v.wandern)
      ? `<div class="zw-abgl" style="margin-top:10px"><button class="zd-ok"
           data-zw-anwenden>Übernehmen — ${v.wandern} Beleg(e) verschieben</button></div>`
      : '';
    erg().innerHTML = kopf
      + (moves ? `<div style="margin-top:6px">${moves}</div>` : '')
      + (gf ? `<div style="margin-top:8px"><b>Grenzfälle (${(v.grenzfaelle || []).length}):</b>${gf}</div>` : '')
      + knopf;
  }

  async function abgleichVorschau() {
    erg().textContent = 'Prüfe …';
    try {
      const v = await api(`/objekte/${encodeURIComponent(slug)}/zeitraeume/belege-abgleichen`,
                          { method: 'POST' });
      abgleichBericht(v, false);
    } catch (f) { zeigeErg(fehlerText(f)); }
  }

  async function abgleichAnwenden() {
    try {
      const v = await api(`/objekte/${encodeURIComponent(slug)}/zeitraeume/`
                          + 'belege-abgleichen?vorschau=false', { method: 'POST' });
      veraendert = true;
      abgleichBericht(v, true);
    } catch (f) { zeigeErg(fehlerText(f)); }
  }

  dlg.addEventListener('click', async e => {
    if (e.target.closest('[data-nein]')) { dlg.close(); if (veraendert) laden(); return; }
    const save = e.target.closest('[data-zw-save]');
    if (save) return speichern(save.dataset.zwSave, save.closest('.zw-row'));
    const teil = e.target.closest('[data-zw-teilen]');
    if (teil) return teilen(teil.dataset.zwTeilen, teil.closest('.zw-row'));
    if (e.target.closest('[data-zw-neu]')) return neuAnlegen();
    if (e.target.closest('[data-zw-abgleich]')) return abgleichVorschau();
    if (e.target.closest('[data-zw-anwenden]')) return abgleichAnwenden();
  });

  await rendern();
  dlg.showModal();
}

/* Was wirklich im Feld steht — auch wenn es "1.250.000" anzeigt.
   `data-wert` hat Vorrang: dort legt die Formatierung den rohen Wert ab. */
function zahlAus(el) {
  const roh = el.dataset.wert != null && el.dataset.wert !== ''
    ? el.dataset.wert : el.value;
  const text = String(roh ?? '').replace(/[^\d,.-]/g, '');
  if (text === '') return null;
  const komma = text.lastIndexOf(',');
  const sauber = komma >= 0
    ? `${text.slice(0, komma).replace(/\./g, '')}.${text.slice(komma + 1).replace(/\D/g, '')}`
    // Ein einzelner Punkt mit ein bis zwei Stellen dahinter ist ein
    // Dezimalpunkt (so kommt der Wert aus der API), sonst Tausendertrennung.
    : (/^-?\d+\.\d{1,2}$/.test(text) ? text : text.replace(/\./g, ''));
  const zahl = Number(sauber);
  return Number.isFinite(zahl) ? zahl : null;
}

function ausFormular(form, felder) {
  const werte = {};
  for (const f of felder) {
    // Hilfsfelder helfen beim Ausfüllen und werden nicht gespeichert — der
    // Zinsanteil je Monat steckt schon im Zinssatz.
    if (f.hilfe) continue;
    const el = form.elements[f.k];
    if (!el) continue;
    if (f.typ === 'ja_nein' || f.typ === 'schalter') {
      werte[f.k] = el.value === 'ja'; continue;
    }
    // Leeren heisst hier wirklich leeren — sonst liesse sich ein einmal
    // gesetztes Enddatum nie wieder entfernen.
    if (f.typ === 'number') { werte[f.k] = zahlAus(el); continue; }
    if (el.value === '') { werte[f.k] = f.typ === 'date' ? null : ''; continue; }
    werte[f.k] = el.value;
  }
  return werte;
}

/* Was im Dialog steht, mit dem Bestand abgleichen: geändert, neu, entfernt. */
async function bewohnerSpeichern(form, miete_id) {
  const block = form.querySelector('#bewohnerblock');
  if (!block || !miete_id) return;
  for (const bid of bewohnerWeg) {
    await api(`/bewohner/${bid}`, { method: 'DELETE' });
  }
  bewohnerWeg = [];
  for (const zeile of block.querySelectorAll('.bwzeile')) {
    const daten = {
      name: zeile.querySelector('[name=bw_name]').value.trim(),
      email: zeile.querySelector('[name=bw_email]').value.trim(),
      telefon: zeile.querySelector('[name=bw_telefon]').value.trim(),
      anschrift: zeile.querySelector('[name=bw_anschrift]').value.trim(),
    };
    if (zeile.dataset.bid) {
      await api(`/bewohner/${zeile.dataset.bid}`, { method: 'PATCH', body: daten });
    } else if (daten.name || daten.email || daten.telefon || daten.anschrift) {
      await api(`/mieten/${miete_id}/bewohner`, { method: 'POST', body: daten });
    }
  }
}

/* ---- Jahresstände eines Kredits ---- */

/* Das Feld heisst weiter `restschuld` — so heisst die Spalte, und beim
   Bausparvertrag steht dort der Sparstand (siehe `models.Kreditstand`).
   Gefragt wird trotzdem nach dem, was auf dem Auszug steht. */
const standFelder = bauspar => [
  { k: 'jahr', l: 'Jahr', typ: 'number', pflicht: true,
    vorgabe: new Date().getFullYear() - 1 },
  { k: 'restschuld', l: bauspar ? 'Sparstand am 31.12.'
                                : 'Restschuld am 31.12.',
    typ: 'number', schritt: '0.01', geld: true, pflicht: true },
  // CCXXXI — was laut Kontoauszug tatsächlich an Zinsen floss, neben der
  // Kalkulation aus Rate und Zinssatz. Optional: ohne Angabe zeigt der
  // Verlauf weiter nur die gerechnete Zahl.
  { k: 'zinsen_ist', l: bauspar ? 'Erhaltene Zinsen lt. Kontoauszug'
                                : 'Gezahlte Zinsen lt. Kontoauszug',
    typ: 'number', schritt: '0.01', geld: true },
];

/* CCXXXI — Zinsen je Jahr: was laut Kontoauszug wirklich anfiel (`zinsen_ist`)
   neben dem, was aus Rate und Zinssatz gerechnet ist (`zinsen_kalk`). Fehlt
   der Ist-Wert, bleibt nur die Kalkulation stehen; fehlen beide, bleibt die
   Zeile ganz weg — eine leere Zinszeile wäre nur Rauschen. */
function zinsZeile(j) {
  if (j.zinsen_ist == null && j.zinsen_kalk == null) return '';
  const teile = [];
  if (j.zinsen_ist != null) teile.push(`ist ${eur(j.zinsen_ist)}`);
  if (j.zinsen_kalk != null) teile.push(`kalk ${eur(j.zinsen_kalk)}`);
  return `<div class="jz">Zinsen: ${teile.join(' · ')}</div>`;
}

function verlaufBlock(s) {
  const bauspar = istBausparer(s.art);
  const zeilen = (s.verlauf || []).map(j => `<div class="jahr${
      j.eingetragen ? ' gemessen' : ''}">
      <div class="jzeile">
        <span class="jj">${j.jahr}</span>
        <span class="jw">${eur(j.restschuld)}</span>
        <span class="jq">${j.eingetragen ? 'eingetragen' : 'gerechnet'}</span>
        ${j.eingetragen ? `<button type="button" class="weg"
            data-stand-weg="${(s.staende.find(x => x.jahr === j.jahr) || {}).id}"
            aria-label="Stand entfernen">×</button>`
          : '<span class="weg" aria-hidden="true"></span>'}
      </div>
      ${zinsZeile(j)}
    </div>`).join('');
  return `<div class="block">
    <span class="bt">Verlauf</span>
    <span class="bd">Grün hinterlegt ist, was du eingetragen hast. Die Jahre
      dazwischen rechnet die App aus ${bauspar ? 'Sparbeitrag und Guthabenzins'
                                              : 'Rate und Zinssatz'}.</span>
    ${zeilen ? `<div class="jahre">${zeilen}</div>`
             : '<div class="bd">Noch kein Stand eingetragen.</div>'}
  </div>`;
}

/* ---- Zusatzblöcke der Formulare ---- */

/* CCCXXXIII — hat die Einheit €/m²-Ansätze, ergibt sich daraus eine Kaltmiete.
   Sie wird als überschreibbarer Vorschlag angeboten: ein Knopf trägt sie ins
   Kaltmiete-Feld, gespeichert wird nur, was dann dort steht. Beim Anlegen im
   Fokus ist die Einheit die fokussierte, beim Bearbeiten die am Mietverhältnis
   genannte. Ohne Ansatz (kein Vorschlag) bleibt der Block ganz weg. */
function mietVorschlagBlock(eintrag) {
  if (istGrundstueck()) return '';           // eine Pacht kennt keine €/m²-Ansätze
  const bez = (eintrag && eintrag.einheit) || (fokus && fokus.bezeichnung) || '';
  const e = (bez && einheiten.find(x => x.bezeichnung === bez)) || fokus || null;
  if (!e) return '';
  const wert = hergeleiteteKaltmiete(e);
  if (wert == null) return '';
  return `<div class="block">
    <span class="bt">Kaltmiete aus Flächen</span>
    <span class="bd">Aus den €/m²-Ansätzen dieser Einheit ergeben sich
      ${eur(wert)} / Monat. Übernimm den Wert als Ausgangspunkt und passe ihn
      im Feld „Kaltmiete" bei Bedarf an.</span>
    <button type="button" class="zusatz" data-miete-vorschlag="${wert}"
      >aus Flächen × €/m² (${eur(wert)}) übernehmen</button>
  </div>`;
}

function mietExtra(eintrag) {
  // Ein Acker hat keine Bewohner. Die Staffelung des Pachtzinses schon —
  // die läuft über denselben Weg wie eine Mieterhöhung.
  const pacht = istGrundstueck();
  const kopf = pacht ? 'Pachterhöhung' : 'Mieterhöhung';
  const kopien = (eintrag ? eintrag.bewohner : []) || [];
  return mietVorschlagBlock(eintrag)
    + (pacht ? '' : bewohnerBlock(kopien)) + (eintrag ? `<div class="block">
      <span class="bt">${kopf}</span>
      <span class="bd">Eine beschlossene Erhöhung lässt sich schon jetzt
        eintragen. Sie steht als „geplant" in der Liste, bis sie wirksam wird;
        der heutige Stand endet automatisch am Tag davor.</span>
      <button type="button" class="zusatz"
              data-erhoehung="${eintrag.id}">＋ ${kopf} planen</button>
    </div>` : '');
}

function kreditExtra(eintrag) {
  if (!eintrag) return '';
  const s = eintrag.stand || {};
  const bauspar = istBausparer(eintrag.art);
  const gemessen = s.stand_jahr
    ? `Zuletzt eingetragen zum 31.12.${s.stand_jahr}: ${eur(s.stand_wert)} —
       heute fortgeschrieben ${eur(s.stand)}.`
    : (bauspar
        ? `Trage den Sparstand zum 31.12. ein, wie er auf dem Kontoauszug
           steht. Dazwischen rechnet ImmoCalc aus Sparbeitrag und
           Guthabenzins weiter.`
        : `Trage die Restschuld zum 31.12. ein, wie sie im Kontoauszug steht.
           Dazwischen rechnet ImmoCalc aus Rate und Zinssatz weiter.`);
  // Beim Bausparvertrag zählt, was noch fehlt — das ist die Zahl, die der
  // Nutzer im Kopf hat: 140.000 Bausparsumme, 45.000 gespart, Rest offen.
  const rest = bauspar && s.noch_zu_sparen != null
    ? (s.zuteilungsreif
        ? ` Die Bausparsumme ist erreicht — der Vertrag ist zuteilungsreif.`
        : ` Bis zur Bausparsumme fehlen noch ${eur(s.noch_zu_sparen)}.`)
    : '';
  const zins = bauspar
    ? (s.habenzins_monat ? ` Das Guthaben bringt zurzeit
        ${eur(s.habenzins_monat)} im Monat an Zinsen.` : '')
    : (s.zins_monat ? ` Davon gehen zurzeit ${eur(s.zins_monat)} im Monat
        an Zinsen weg.` : '');
  return `<div class="block">
    <span class="bt">${bauspar ? 'Sparstand' : 'Restschuld'}</span>
    <span class="bd">${gemessen}${rest}${zins}</span>
    <button type="button" class="zusatz"
            data-staende="${eintrag.id}">Jahresstände pflegen</button>
  </div>`;
}

/* ---- CCXXIX: Grundschulden ------------------------------------------------
   Eine eigene Liste, kein Eintrag in BEREICHE: die Endpunkte liegen anders
   (`/objekte/{slug}/grundschulden`, `/grundschulden/{id}`, nicht der
   generische `/stammdaten/{bereich}/{id}`-Weg) — wie bei den Einheiten.

   Die Zuordnung zu Krediten ist eine Mehrfachauswahl, und zwar
   objektübergreifend: eine Grundschuld auf diesem Grundstück kann einen
   Kredit an einem ganz anderen Objekt sichern. Gelöst als Reihe ankreuzbarer
   Blasen (`data-gs-kredit`) statt eines nativen multiselect — jede Blase
   trägt ihren Zustand selbst, ohne die übrigen abzuwählen; das unterscheidet
   sie von den Einheiten-Blasen (`data-wahl`/`data-wahlfeld`), die immer nur
   eine Auswahl zulassen. */
const GRUNDSCHULDFELDER = [
  { k: 'betrag', l: 'Betrag', typ: 'number', schritt: '0.01', geld: true,
    voll: true, pflicht: true },
  { k: 'rang', l: 'Rang', typ: 'number', schritt: '1', lex: 'rang' },
  { k: 'grundbuch_blatt', l: 'Grundbuchblatt', typ: 'text', lex: 'grundbuch' },
  { k: 'glaeubiger', l: 'Gläubiger', typ: 'text' },
  { k: 'brief', l: 'Briefgrundschuld', typ: 'schalter', vorgabe: false,
    lex: 'brief-buchgrundschuld',
    note: 'Aus: Buchgrundschuld — kein Grundschuldbrief ausgestellt.' },
  { k: 'notiz', l: 'Notiz', typ: 'text' },
];

const grundschuldName = g =>
  g.glaeubiger || (g.grundbuch_blatt ? `Blatt ${g.grundbuch_blatt}` : 'Grundschuld');

const grundschuldDetail = g => [
  g.rang != null && g.rang !== '' ? `Rang ${g.rang}` : '',
  g.grundbuch_blatt ? `Blatt ${g.grundbuch_blatt}` : '',
  g.brief ? 'Brief' : 'Buch',
  (g.kredit_ids || []).length
    ? `sichert ${g.kredit_ids.length} Kredit${g.kredit_ids.length === 1 ? '' : 'e'}`
    : 'sichert keinen Kredit',
].filter(Boolean).join(' · ');

/** Alle Kredite über alle Objekte — eine Grundschuld kann anderswo sichern. */
async function grundschuldKrediteListe() {
  try { return await api('/grundschulden/kredit-auswahl'); }
  catch { return []; }
}

function grundschuldKreditBlock(kreditListe, ausgewaehlt) {
  if (!kreditListe.length) {
    return `<div class="block">
      <span class="bt">Gesicherte Kredite</span>
      <span class="bd">Noch kein Kredit angelegt — lege zuerst einen an, um
        ihn hier zu verknüpfen.</span>
    </div>`;
  }
  const gewaehlt = new Set(ausgewaehlt.map(String));
  const blasen = kreditListe.map(k => {
    const an = gewaehlt.has(String(k.id));
    return `<button type="button" class="bubble${an ? ' gewaehlt' : ''}"
        data-gs-kredit="${k.id}" aria-pressed="${an}">
      <span class="bt">${esc(k.bezeichnung)}</span>
      <span class="bf">${esc(k.objekt)}</span>
    </button>`;
  }).join('');
  return `<div class="block">
    <span class="bt">Gesicherte Kredite</span>
    <span class="bd">Eine Grundschuld kann auch einen Kredit an einem anderen
      Objekt sichern — deshalb stehen hier alle Kredite, objektübergreifend.
      Mehrfachauswahl möglich.</span>
    <div class="bubbles" role="group"
         aria-label="Gesicherte Kredite">${blasen}</div>
  </div>`;
}

async function grundschuldFormular(g = null) {
  const kreditListe = await grundschuldKrediteListe();
  await formular({
    titel: g ? 'Grundschuld bearbeiten' : 'Grundschuld hinzufügen',
    hinweis: 'Rang und Grundbuchblatt stehen im Grundbuchauszug. Eine '
      + 'Grundschuld sichert einen oder mehrere Kredite ab — auch an einem '
      + 'anderen Objekt.',
    felder: GRUNDSCHULDFELDER, werte: g || {}, absicht: 'grundschuld',
    extra: grundschuldKreditBlock(kreditListe, g ? (g.kredit_ids || []) : []),
    knopf: g ? 'Speichern' : 'Anlegen',
  });
}

function grundschuldenHtml() {
  const zeilen = grundschulden.length
    ? grundschulden.map(g => `<div class="eintrag klick" data-gs-edit="${g.id}">
        <span class="sym">${kostenIcon('Kredit')}</span>
        <span class="et">
          <span class="en">${esc(grundschuldName(g))}</span>
          <span class="ed">${esc(grundschuldDetail(g))}</span>
        </span>
        <span class="ew">${eurVoll(g.betrag)}</span>
        <button class="del" data-gs-weg="${g.id}" aria-label="löschen">×</button>
      </div>`).join('')
    : `<div class="leerzeile">Noch keine Grundschuld hinterlegt</div>`;
  // CCCXXXII — Grundschulden bekommen ein Symbol (Finanzierungs-Cluster wie
  // Kredite) und die Hilfe hängt daneben, nicht am nackten Titel.
  return `<div class="sekopf"><span class="seikon"
        style="color:var(--neg)">${kostenIcon('Grundschuld')}</span>
      <h2 class="sec">Grundschulden</h2><span data-hilfe="grundschuld"></span>
      <button class="seakt" data-gs-neu="1" aria-label="Grundschuld hinzufügen"
        title="Grundschuld hinzufügen">Hinzufügen</button></div>
    <div class="liste">${zeilen}</div>`;
}

/* ---- CLXXVI: Kappungsgrenze nach § 558 Abs. 3 BGB -----------------------
   Wie viel eine Erhöhung binnen drei Jahren zulegen darf, hängt an der
   Gemeinde: 20 %, in Gebieten mit angespanntem Wohnungsmarkt 15 %. Welche
   Gemeinden das sind und wie gerechnet wird, steht in
   `api/app/kappungsgrenze.py` — hier wird nur gefragt und gezeigt.

   Gewarnt, nicht verboten: eine Erhöhung nach Modernisierung (§ 559 BGB)
   fällt gar nicht unter die Grenze, und über Ausnahmen entscheidet nicht
   diese Seite. Gespeichert wird deshalb in jedem Fall. */
async function kappungWachen(mid) {
  const form = document.getElementById('dlgForm');
  const feld = form.querySelector('#f_kaltmiete');
  const abFeld = form.querySelector('#f_ab_datum');
  if (!feld || !feld.closest('.field')) return;

  const halter = document.createElement('div');
  // Eigener Abstand nach unten: sonst klebt die Fundstelle an der
  // Beschriftung des nächsten Feldes.
  halter.style.margin = '-4px 0 18px';
  feld.closest('.field').insertAdjacentElement('afterend', halter);

  let lauf = 0;
  async function zeigen() {
    const frage = new URLSearchParams();
    const neu = zahlAus(feld);
    if (neu != null && neu > 0) frage.set('neu', String(neu));
    if (abFeld && abFeld.value) frage.set('ab', abFeld.value);
    const nummer = ++lauf;
    let s;
    try {
      s = await api(`/mieten/${mid}/kappungsgrenze?${frage}`);
    } catch {
      return;                    // ohne Auskunft lieber nichts behaupten
    }
    // Eine ältere Antwort darf eine neuere nicht überschreiben, und ein
    // umgebautes Formular hat den Platz gar nicht mehr.
    if (nummer !== lauf || !halter.isConnected) return;
    // Die Fundstelle steht immer, aber leise: sie gehört zur Auskunft, ist
    // aber nicht die Nachricht. Die Warnung selbst bleibt kurz.
    const quelle = `<span class="feldnote">Grundlage: ${esc(s.fundstelle)}.
      ${s.ueberschritten ? 'Eine Erhöhung nach Modernisierung (§ 559 BGB) '
        + 'fällt nicht darunter — eintragen lässt sie sich trotzdem.' : ''}</span>`;
    halter.innerHTML = (s.ueberschritten
      ? `<div class="merker" style="margin-top:10px">
           <span class="hi">!</span><span class="ht">
           <span class="t">${esc(s.titel)}</span>
           <span class="d">${esc(s.text)}</span></span></div>`
      : `<span class="feldnote">${esc(s.text)}</span>`) + quelle;
  }

  let warten = null;
  const spaeter = () => {
    clearTimeout(warten);
    warten = setTimeout(zeigen, 350);
  };
  feld.addEventListener('input', spaeter);
  if (abFeld) abFeld.addEventListener('change', spaeter);
  await zeigen();
}

/* Eine geplante Erhöhung ist ein neuer Mietstand derselben Partei — nicht ein
   geänderter alter. So bleibt nachvollziehbar, was wann galt. */
async function erhoehungFormular(mid) {
  let alt;
  try {
    alt = (await api(`/objekte/${encodeURIComponent(slug)}/mieten`))
      .find(x => String(x.id) === String(mid));
  } catch (fehler) {
    return melde(String(fehler.message || fehler), 'neg');
  }
  if (!alt) return;
  const pacht = istGrundstueck();
  const bewohner = (alt.bewohner || []).map(b => ({ ...b, id: null }));
  await formular({
    titel: pacht ? 'Pachterhöhung planen' : 'Mieterhöhung planen',
    hinweis: `Trage ${pacht ? 'den neuen Pachtzins' : 'die neue Miete'} und `
      + 'den Tag ein, ab dem er gilt. Der bisherige Stand läuft bis zum Tag '
      + 'davor weiter und bleibt als Historie erhalten.',
    felder: cfgFuer('mieten').felder, bereich: 'mieten', absicht: 'eintrag',
    werte: { ...alt, id: '', ab_datum: ersterNaechsterMonat(), bis_datum: null },
    extra: pacht ? '' : bewohnerBlock(bewohner), knopf: 'Erhöhung planen',
  });
  document.getElementById('dlgForm').dataset.vorgaenger = mid;
  // Beim Pachtzins gibt es keine Kappungsgrenze — § 558 BGB gilt für
  // Wohnraum, nicht für Grund und Boden.
  if (!pacht) await kappungWachen(mid);
}

async function standFormular(kid) {
  let s;
  try {
    s = await api(`/kredite/${kid}/staende`);
  } catch (fehler) {
    return melde(String(fehler.message || fehler), 'neg');
  }
  const bauspar = istBausparer(s.art);
  await formular({
    titel: bauspar ? 'Sparstand zum Jahresende' : 'Restschuld zum Jahresende',
    hinweis: bauspar
      ? 'Die Bausparkasse weist das Guthaben zum 31.12. aus — trage es ein wie '
        + 'einen Zählerstand. Dazwischen schreibt ImmoCalc monatlich fort: '
        + 'Sparbeitrag plus Guthabenzins. Jeder neue Stand korrigiert die '
        + 'Rechnung.'
      : 'Die Bank weist die Restschuld zum 31.12. aus — trage sie ein wie '
        + 'einen Zählerstand. Dazwischen schreibt ImmoCalc monatlich fort: Rate '
        + 'minus Zinsanteil ist Tilgung. Jeder neue Stand korrigiert die Rechnung.',
    felder: standFelder(bauspar), werte: { id: kid }, absicht: 'stand',
    extra: verlaufBlock(s), knopf: 'Stand eintragen',
  });
}

dlg.addEventListener('close', () => {
  formateLoesen();
  auswahlLoesen();
  dialogUmbau = null;      // sonst baut ein später Klick einen toten Dialog um
});

document.getElementById('dlgForm').addEventListener('click', async e => {
  if (e.target.closest('[data-abbruch]')) return dlg.close('abbruch');

  // CCXXIX — Mehrfachauswahl der gesicherten Kredite: jede Blase schaltet
  // nur sich selbst, im Unterschied zu den Einzelauswahl-Blasen unten.
  const gsKredit = e.target.closest('[data-gs-kredit]');
  if (gsKredit) {
    const an = !gsKredit.classList.contains('gewaehlt');
    gsKredit.classList.toggle('gewaehlt', an);
    gsKredit.setAttribute('aria-pressed', String(an));
    return;
  }

  const wahl = e.target.closest('[data-wahl]');
  if (wahl) {
    const gruppe = wahl.closest('[data-wahlfeld]');
    const form = document.getElementById('dlgForm');
    form.elements[gruppe.dataset.wahlfeld].value = wahl.dataset.wahl;
    // Blasen (Einheitenwahl) und der Ja/Nein-Schalter (CXCIII) teilen sich
    // diese Verdrahtung — jeder trägt seine eigene Aktiv-Klasse.
    for (const knopf of gruppe.querySelectorAll('[data-wahl]')) {
      const an = knopf === wahl;
      knopf.classList.toggle(
        knopf.classList.contains('schaltknopf') ? 'an' : 'gewaehlt', an);
      knopf.setAttribute('aria-pressed', String(an));
    }
    // Ein Schalter mit Umbau (CCCI: Nießbrauch) baut das Formular neu auf, sobald
    // er umgelegt wird — dann kommen/gehen die abhängigen Felder.
    if (gruppe.dataset.umbau && dialogUmbau) setTimeout(dialogUmbau, 0);
    return;
  }

  const weg = e.target.closest('[data-bw-weg]');
  if (weg) {
    // Erst beim Speichern wirklich löschen — bis dahin nur gemerkt.
    const zeile = weg.closest('.bwzeile');
    if (zeile.dataset.bid) bewohnerWeg.push(zeile.dataset.bid);
    zeile.remove();
    return;
  }
  if (e.target.closest('[data-bw-neu]')) {
    e.target.closest('[data-bw-neu]').insertAdjacentHTML('beforebegin',
      bewohnerZeile({}));
    return;
  }

  // CCCXXVII — Gemeinschaftsflächen-Zeilen hinzufügen/entfernen.
  const gfWeg = e.target.closest('[data-gf-weg]');
  if (gfWeg) { gfWeg.closest('.gfzeile').remove(); return; }
  if (e.target.closest('[data-gf-neu]')) {
    e.target.closest('[data-gf-neu]').insertAdjacentHTML('beforebegin', gemeinZeile({}));
    return;
  }

  // CCCXXIX — Zusatz-Nutzflächen-Zeilen hinzufügen/entfernen.
  const nfWeg = e.target.closest('[data-nf-weg]');
  if (nfWeg) { nfWeg.closest('.nfzeile').remove(); return; }
  if (e.target.closest('[data-nf-neu]')) {
    e.target.closest('[data-nf-neu]').insertAdjacentHTML('beforebegin', nutzZeile({}));
    return;
  }

  const standWeg = e.target.closest('[data-stand-weg]');
  if (standWeg) {
    const kid = document.getElementById('dlgForm').dataset.id;
    try {
      await api(`/kreditstaende/${standWeg.dataset.standWeg}`, { method: 'DELETE' });
    } catch (fehler) {
      return melde(String(fehler.message || fehler), 'neg');
    }
    await laden();
    return standFormular(kid);
  }

  const staende = e.target.closest('[data-staende]');
  if (staende) return standFormular(staende.dataset.staende);

  const erhoehung = e.target.closest('[data-erhoehung]');
  if (erhoehung) return erhoehungFormular(erhoehung.dataset.erhoehung);

  // CCCXXXIII — den hergeleiteten Kaltmiete-Vorschlag ins Feld übernehmen. Das
  // Kaltmiete-Feld ist ein geld-formatiertes Feld: der Name wandert dabei auf
  // ein verstecktes Feld, der rohe Wert wird auf dem sichtbaren (#f_kaltmiete)
  // gesetzt, das sich selbst neu formatiert. Überschreibbar bleibt es.
  const vorschlag = e.target.closest('[data-miete-vorschlag]');
  if (vorschlag) {
    const sicht = document.getElementById('f_kaltmiete');
    if (sicht) {
      sicht.value = vorschlag.dataset.mieteVorschlag;
      sicht.dispatchEvent(new Event('input', { bubbles: true }));
      sicht.focus();
    }
    return;
  }
});

document.getElementById('dlgForm').addEventListener('submit', async e => {
  // Der Dialog schliesst sich nicht mehr von selbst (siehe Kommentar am
  // <form>): erst wenn gespeichert ist, geht er zu. Schlaegt es fehl, bleibt
  // alles Eingetippte stehen und laesst sich verbessern.
  e.preventDefault();
  const form = e.target;
  const { absicht, bereich, id } = form.dataset;
  const knopf = form.querySelector('button[value="ok"]');
  const beschriftung = knopf ? knopf.textContent : '';
  if (knopf) { knopf.disabled = true; knopf.textContent = 'Wird gespeichert …'; }

  try {
    if (absicht === 'stamm') {
      // dialogFelder statt stammfelder(): nur die tatsächlich gezeigten Felder,
      // inkl. der beim Nießbrauch-Umschalten dazugekommenen (CCCI).
      await api(`/objekte/${encodeURIComponent(slug)}`,
                { method: 'PATCH', body: ausFormular(form, dialogFelder) });
    } else if (absicht === 'weg') {
      await api(`/objekte/${encodeURIComponent(slug)}`,
                { method: 'PATCH', body: ausFormular(form, WEGFELDER) });
    } else if (absicht === 'anteil') {
      const werte = ausFormular(form, ANTEILFELDER);
      await api(`/objekte/${encodeURIComponent(slug)}/anteile`, {
        method: 'POST',
        body: { eigentuemer_id: Number(werte.eigentuemer_id),
                promille: Number(werte.promille) || 1000,
                einheit: werte.einheit || '',
                notiz: werte.notiz || '' },
      });
    } else if (absicht === 'einheit') {
      const werte = { ...ausFormular(form, EINHEITFELDER),
                      nutzflaechen: nutzAusFormular(form),
                      gemeinflaechen: gemeinAusFormular(form) };
      if (id) {
        await api(`/einheiten/${id}`, { method: 'PATCH', body: werte });
      } else {
        await api(`/objekte/${encodeURIComponent(slug)}/einheiten`,
                  { method: 'POST', body: werte });
      }
    } else if (absicht === 'zeitraum') {
      const werte = ausFormular(form, ZEITRAUMFELDER);
      await api(`/objekte/${encodeURIComponent(slug)}/zeitraeume`,
                { method: 'POST', body: { jahr: Number(werte.jahr) } });
    } else if (absicht === 'stand') {
      const werte = ausFormular(form, dialogFelder);
      await api(`/kredite/${id}/staende`, {
        method: 'POST',
        body: { jahr: Number(werte.jahr), restschuld: werte.restschuld || 0,
                ...(werte.zinsen_ist != null ? { zinsen_ist: werte.zinsen_ist } : {}) },
      });
      await laden();
      // Gleich weiter: Jahresstände werden meist mehrere auf einmal gepflegt.
      return standFormular(id);
    } else if (absicht === 'grundschuld') {
      const werte = ausFormular(form, GRUNDSCHULDFELDER);
      // Immer mitgeschickt, nie weggelassen: die Blasen zeigen den Stand, den
      // der Nutzer gerade bestätigt hat — „unangetastet lassen" gibt es in
      // dieser Maske nicht, hier wird stets neu gesetzt.
      const kredit_ids = [...form.querySelectorAll('[data-gs-kredit].gewaehlt')]
        .map(b => Number(b.dataset.gsKredit));
      const body = { ...werte, kredit_ids };
      if (id) {
        await api(`/grundschulden/${id}`, { method: 'PATCH', body });
      } else {
        await api(`/objekte/${encodeURIComponent(slug)}/grundschulden`,
                  { method: 'POST', body });
      }
    } else {
      // Nicht `cfgFuer(bereich).felder`: bei den Verträgen entscheidet die
      // Vertragsart, welche Felder überhaupt dastanden.
      // Pseudo-Rubriken (Erwerbsnebenkosten) schicken feste Werte mit und
      // sprechen den geteilten Endpunkt an (CCCXIX).
      const werte = { ...ausFormular(form, dialogFelder),
                      ...(RUBRIK_FESTWERTE[bereich] || {}) };
      const ep = endpunktBereich(bereich);
      let miete_id = id;
      if (id) {
        await api(`/stammdaten/${ep}/${id}`, { method: 'PATCH', body: werte });
      } else {
        const neu = await api(`/objekte/${encodeURIComponent(slug)}/${ep}`,
                              { method: 'POST', body: werte });
        miete_id = neu.id;
      }
      if (bereich === 'mieten') {
        await bewohnerSpeichern(form, miete_id);
        // Die Erhöhung löst den bisherigen Stand ab — er endet am Tag davor.
        if (form.dataset.vorgaenger && werte.ab_datum) {
          await api(`/stammdaten/mieten/${form.dataset.vorgaenger}`, {
            method: 'PATCH', body: { bis_datum: tagDavor(werte.ab_datum) } });
        }
      }
    }
    dlg.close();
    await laden();
  } catch (fehler) {
    melde(String(fehler.message || 'Konnte nicht gespeichert werden.'), 'neg');
  } finally {
    if (knopf) { knopf.disabled = false; knopf.textContent = beschriftung; }
  }
});

const ZEITRAUMFELDER = [
  { k: 'jahr', l: 'Abrechnungsjahr', typ: 'number', pflicht: true,
    vorgabe: new Date().getFullYear() - 1 },
];

let ANTEILFELDER = [];

async function anteilFormular() {
  let eigner = [];
  try { eigner = await api('/eigentuemer'); } catch { /* leer behandeln */ }
  if (!eigner.length) {
    const hin = await frage('Noch kein Eigentümer angelegt',
      'Eigentümer werden einmal zentral gepflegt und dann den Immobilien '
      + 'zugeordnet. Jetzt in den Einstellungen anlegen?',
      { knopf: 'Zu den Einstellungen' });
    if (hin) location.href = 'settings.html#eigentuemer';
    return;
  }
  ANTEILFELDER = [
    { k: 'eigentuemer_id', l: 'Eigentümer', typ: 'select',
      werte: eigner.map(e => e.name) },
    // Die Einheitenwahl nur, wenn es überhaupt Einheiten gibt — ein
    // Grundstück oder ein Objekt ohne erfasste Einheiten kennt nur den
    // Haus-Anteil.
    ...(einheiten.length
      ? [{ k: 'einheit', l: 'Gehört dem Eigentümer', typ: 'anteileinheit' }]
      : []),
    { k: 'promille', l: 'Anteil in Tausendstel (‰)', typ: 'number', schritt: '0.1',
      vorgabe: 1000, pflicht: true },
    { k: 'notiz', l: 'Notiz', typ: 'text' },
  ];
  await formular({ titel: 'Eigentümer zuordnen', felder: ANTEILFELDER,
                   absicht: 'anteil' });
  // Der Name im Auswahlfeld muss zur ID werden — die Reihenfolge ist dieselbe.
  const feld = document.getElementById('f_eigentuemer_id');
  eigner.forEach((e, i) => { feld.options[i].value = e.id; });
}

inhalt.addEventListener('click', async e => {
  /* ---- Dokumentenbaum (CCXCIX) ---- */
  const bf = e.target.closest('[data-bfilter]');
  if (bf) { baumFilterUmschalten(bf.dataset.bfilter); return; }
  const bm = e.target.closest('[data-bmehr]');
  if (bm) { baumMehrZeigen(bm.dataset.bmehr); return; }
  // CCCXXXI — Ordnerkopf antippen: auf-/zuklappen.
  const ba = e.target.closest('[data-bast]');
  if (ba) { baumAstUmschalten(ba.dataset.bast); return; }
  // CCCXXXI — Jahres-Filter im Nebenkosten-Ordner.
  const bj = e.target.closest('[data-bjahr]');
  if (bj) { baumJahrSetzen(bj.dataset.bjahr); return; }
  // CCCXXI — auf das Statuszeichen eines zugeordneten Belegs tippen: umhängen.
  // Erst die alte Zuordnung lösen, dann den Zuordnen-Dialog wie sonst.
  const um = e.target.closest('[data-umhaengen]');
  if (um) {
    const dokId = Number(um.dataset.umhaengen);
    const dok = (getBaumDaten()?.aeste || []).flatMap(a => a.dokumente)
      .find(d => d.id === dokId) || { dateiname: 'Dokument' };
    const wahl = await zuordnenDialog(dok, um.dataset.rubrik || '', true);
    if (!wahl) return;
    try {
      await api(`/dokumente/${dokId}/loese-zuordnung`, { method: 'POST' });
      if (wahl.entfernen) {
        melde('Zuordnung gelöst — der Beleg ist wieder offen', '');
      } else {
        const r = await api(`/dokumente/${dokId}/zuordnen`,
                            { method: 'POST', body: wahl });
        const wo = (r.angelegt || []).map(a => a.wo).filter(Boolean).join(' · ');
        melde(wo ? `Umgehängt: ${wo}` : 'Neu zugeordnet', 'pos');
      }
      await laden();
    } catch (fehler) { melde(fehler.message || 'Umhängen fehlgeschlagen', 'neg'); }
    return;
  }

  const zu = e.target.closest('[data-zuordnen]');
  if (zu) {
    const dokId = Number(zu.dataset.zuordnen);
    const dok = (getBaumDaten()?.aeste || []).flatMap(a => a.dokumente)
      .find(d => d.id === dokId) || { dateiname: 'Dokument' };
    const wahl = await zuordnenDialog(dok, zu.dataset.rubrik || '');
    if (!wahl) return;
    zu.disabled = true; zu.textContent = '…';
    try {
      const r = await api(`/dokumente/${dokId}/zuordnen`,
                          { method: 'POST', body: wahl });
      const wo = (r.angelegt || []).map(a => a.wo).filter(Boolean).join(' · ');
      melde(wo ? `Angelegt: ${wo} — unten als Entwurf bestätigen`
                : 'Aus diesem Beleg liess sich kein Eintrag ableiten', wo ? 'pos' : '');
      await laden();
    } catch (fehler) {
      zu.disabled = false; zu.textContent = 'zuordnen';
      melde(fehler.message || 'Zuordnen fehlgeschlagen', 'neg');
    }
    return;
  }

  const einheitWeg = e.target.closest('[data-einheit-weg]');
  if (einheitWeg) {
    e.stopPropagation();
    const eintrag = einheiten.find(x =>
      String(x.id) === einheitWeg.dataset.einheitWeg);
    const ja = await frage(`„${eintrag ? eintrag.bezeichnung : 'Einheit'}“ entfernen?`,
      'Die Einheit wird gelöscht. Mietverhältnisse, die daran hängen, müssen '
      + 'vorher weg — sonst gehörten sie zu keiner Wohnung mehr.',
      { knopf: 'Entfernen', gefahr: true });
    if (!ja) return;
    try {
      await api(`/einheiten/${einheitWeg.dataset.einheitWeg}`, { method: 'DELETE' });
    } catch (fehler) {
      return melde(String(fehler.message || 'Konnte nicht entfernt werden.'), 'neg');
    }
    return laden();
  }

  const einheitEdit = e.target.closest('[data-einheit-edit]');
  if (einheitEdit) {
    const eintrag = einheiten.find(x =>
      String(x.id) === einheitEdit.dataset.einheitEdit);
    if (!eintrag) return;
    return formular({ titel: 'Einheit bearbeiten', felder: EINHEITFELDER,
                      werte: eintrag, absicht: 'einheit',
                      extra: nutzBlock(eintrag.nutzflaechen || [])
                        + gemeinBlock(eintrag.gemeinflaechen || []) });
  }

  if (e.target.closest('[data-einheit-neu]')) {
    return formular({ titel: 'Einheit anlegen', felder: EINHEITFELDER,
                      absicht: 'einheit', knopf: 'Anlegen',
                      extra: nutzBlock([]) + gemeinBlock([]),
                      hinweis: 'Wohnung, Büro oder Stellplatz — die Bezeichnung '
                        + 'steht später auf den Mietverhältnissen und in der '
                        + 'Abrechnung.' });
  }

  const einheit = e.target.closest('[data-einheit]');
  if (einheit) {
    location.href = einheitUrl(einheit.dataset.einheit);
    return;
  }

  // N… — der dezente Aufklapper blendet die verborgenen (leeren, aber
  // belegbehafteten) Zeiträume ein bzw. wieder aus. Reine Anzeige, kein Reload.
  const alteSchalter = e.target.closest('[data-alte-zeitraeume]');
  if (alteSchalter) {
    const liste = alteSchalter.parentElement.querySelector('[data-alte-liste]');
    if (liste) {
      const auf = liste.hasAttribute('hidden');
      liste.toggleAttribute('hidden', !auf);
      const label = alteSchalter.querySelector('[data-alte-label]');
      if (label) label.textContent = auf ? 'Ausblenden' : 'Anzeigen';
      const pfeil = alteSchalter.querySelector('[data-alte-pfeil]');
      if (pfeil) pfeil.textContent = auf ? '▴' : '▾';
    }
    return;
  }

  const zeitraum = e.target.closest('[data-zeitraum]');
  if (zeitraum) {
    location.href = `zeitraum.html?z=${zeitraum.dataset.zeitraum}`;
    return;
  }

  // CCCLXXX (a) — die Anfangszählerstand-Rubrik führt zur Zähler-Konfig im
  // Abrechnungszeitraum (dort wird der Erststand erfasst). Ohne Zeitraum ist
  // die Konfig nicht erreichbar — dann zuerst einen Zeitraum anlegen.
  const erststand = e.target.closest('[data-erststand]');
  if (erststand) {
    if (erststand.dataset.z) {
      location.href = `zeitraum.html?z=${encodeURIComponent(erststand.dataset.z)}`;
    } else {
      formular({ titel: 'Abrechnungszeitraum anlegen', felder: ZEITRAUMFELDER,
                 absicht: 'zeitraum' });
    }
    return;
  }

  if (e.target.closest('[data-zeitraum-werkzeug]')) {
    return zeitraumWerkzeug();
  }

  if (e.target.closest('[data-zeitraum-neu]')) {
    return formular({ titel: 'Abrechnungszeitraum anlegen', felder: ZEITRAUMFELDER,
                      absicht: 'zeitraum' });
  }

  if (e.target.closest('[data-stamm]')) {
    // CCCXXXVI — beim Grundstück bearbeitet dieses eine Formular auch die
    // Grundstücks- und Grundsteuer-Angaben (GRUND_STAMMFELDER). Der Kopfhinweis
    // erklärt die Grundsteuer-Kette; die Feld-Notizen tun das je Feld.
    return formular({ titel: 'Stammdaten bearbeiten', felder: stammfelder(),
                      werte: objekt, absicht: 'stamm',
                      hinweis: istGrundstueck()
                        ? 'Reihenfolge der Grundsteuer: Grundsteuerwert '
                          + '(Finanzamt) × Steuermesszahl = Steuermessbetrag '
                          + '(Finanzamt) × Hebesatz (Gemeinde) = Grundsteuer/Jahr. '
                          + 'Der Grundstückswert ist der Marktwert und steht nicht '
                          + 'im Bescheid.'
                        : '' });
  }

  if (e.target.closest('[data-weg]')) {
    return formular({ titel: 'WEG-Ebene bearbeiten', felder: WEGFELDER,
                      werte: objekt, absicht: 'weg',
                      hinweis: 'Ist die Wohnung Teil einer '
                        + 'Wohnungseigentümergemeinschaft, verteilt die '
                        + 'Hausverwaltung die Nebenkosten. ImmoCalc verteilt '
                        + 'dann nicht selbst — du trägst die fertigen Werte je '
                        + 'Mieter direkt ein. Hausgeld ist ein '
                        + 'Eigentümerkosten.' });
  }

  if (e.target.closest('[data-anteil-neu]')) return anteilFormular();

  const anteilWeg = e.target.closest('[data-anteil]');
  if (anteilWeg) {
    const ja = await frage('Zuordnung entfernen?',
      'Der Eigentümer bleibt erhalten — nur die Beteiligung an dieser '
      + 'Immobilie wird gelöst.', { knopf: 'Entfernen', gefahr: true });
    if (!ja) return;
    try {
      await api(`/anteile/${anteilWeg.dataset.anteil}`, { method: 'DELETE' });
    } catch (fehler) {
      return melde(String(fehler.message || 'Konnte nicht entfernt werden.'), 'neg');
    }
    return laden();
  }

  const cloud = e.target.closest('[data-cloud]');
  if (cloud && cloud.dataset.cloud === 'status') return cloudZeigen();
  if (cloud) {
    cloud.disabled = true;
    cloud.textContent = 'Lege an …';
    try {
      const antwort = await api(
        `/nextcloud/objekte/${encodeURIComponent(slug)}/struktur`, { method: 'POST' });
      cloud.textContent = antwort.neu_angelegt.length
        ? `${antwort.neu_angelegt.length} Ordner angelegt`
        : 'Alles schon vorhanden';
      setTimeout(cloudZeigen, 1600);
    } catch (fehler) {
      cloud.disabled = false;
      cloud.textContent = 'Fehlgeschlagen — nochmal';
      melde(String(fehler.message || fehler), 'neg');
    }
    return;
  }

  if (e.target.closest('[data-export]')) {
    location.href = `/api/objekte/${encodeURIComponent(slug)}/export`;
    return;
  }

  const weg = e.target.closest('[data-loeschen]');
  if (weg) {
    // Schieben statt klicken: Löschen ist nicht rückgängig zu machen, und ein
    // zweiter Klick an derselben Stelle passiert zu leicht aus Versehen.
    const ja = await schiebeFrage(`„${objekt.titel || objekt.name}“ löschen`,
      'Alle Eingaben zu dieser Immobilie werden entfernt. Die Unterlagen in '
      + 'der Nextcloud bleiben bestehen; eine Sicherung wird vorher dort '
      + 'abgelegt.', 'Zum Löschen schieben');
    if (!ja) return;
    weg.disabled = true;
    weg.textContent = 'Sichere und lösche …';
    try {
      const antwort = await api(`/objekte/${encodeURIComponent(slug)}`,
                                { method: 'DELETE' });
      // Erst melden, dann zurück: sonst wäre die Bestätigung schon weg,
      // bevor sie jemand gelesen hat.
      melde(antwort.sicherung?.gesichert
        ? `„${antwort.name}“ gelöscht · Sicherung: ${antwort.sicherung.pfad}`
        : `„${antwort.name}“ gelöscht — ohne Sicherung in der Nextcloud `
          + `(${antwort.sicherung?.grund || 'kein Grund genannt'})`,
        antwort.sicherung?.gesichert ? 'pos' : '');
      setTimeout(() => { location.href = 'index.html'; }, 2600);
    } catch (fehler) {
      weg.disabled = false;
      weg.textContent = 'Immobilie löschen';
      melde(String(fehler.message || fehler), 'neg');
    }
    return;
  }

  // CCCLXXXI — einen Lageplan umbenennen (nur der Anzeigename am Datensatz).
  const lpUm = e.target.closest('[data-lageplan-rename]');
  if (lpUm) {
    e.stopPropagation();
    return lageplanUmbenennen(lpUm.dataset.e, lpUm.dataset.lageplanRename,
                              lpUm.dataset.name);
  }

  // CCCLXXXI — einen Lageplan entfernen. Nur der Eintrag geht; die Datei in der
  // Nextcloud bleibt (der Endpunkt fasst die Cloud gar nicht an).
  const lpWeg = e.target.closest('[data-lageplan-weg]');
  if (lpWeg) {
    e.stopPropagation();
    const ja = await frage('Lageplan entfernen?',
      'Der Eintrag wird aus der App genommen. Die Datei in der Nextcloud '
      + 'bleibt unberührt — dort wird nichts gelöscht.',
      { knopf: 'Entfernen', gefahr: true });
    if (!ja) return;
    try {
      await api(`/einheiten/${lpWeg.dataset.e}/lageplan/${lpWeg.dataset.lageplanWeg}`,
                { method: 'DELETE' });
    } catch (fehler) {
      return melde(String(fehler.message || 'Konnte nicht entfernt werden.'), 'neg');
    }
    return laden();
  }

  // CCCXXVI — einen hinterlegten Lageplan als Bild-Vorschau öffnen (dieselbe
  // Ansicht wie ein Beleg, über den Dokument-Inhalt).
  const lageplan = e.target.closest('[data-lageplan]');
  if (lageplan) {
    e.stopPropagation();
    belegAnsehen(`/api/dokumente/${lageplan.dataset.lageplan}/inhalt`, 'Lageplan');
    return;
  }

  // CCLXXVIII — Orange-Entwürfe: den Beleg ansehen, bestätigen, verwerfen.
  const beleg = e.target.closest('[data-beleg]');
  if (beleg) {
    e.stopPropagation();
    belegAnsehen(`/api/dokumente/${beleg.dataset.beleg}/inhalt`, 'Beleg');
    return;
  }

  const ok = e.target.closest('[data-ok]');
  if (ok) {
    e.stopPropagation();
    const [typ, id] = ok.dataset.ok.split(':');
    ok.disabled = true;
    try {
      await api(`/entwuerfe/${typ}/${id}/bestaetigen`, { method: 'POST' });
    } catch (fehler) {
      ok.disabled = false;
      return melde(String(fehler.message || 'Konnte nicht bestätigt werden.'), 'neg');
    }
    return laden();
  }

  const zurueck = e.target.closest('[data-zurueck]');
  if (zurueck) {
    e.stopPropagation();
    const [typ, id] = zurueck.dataset.zurueck.split(':');
    const ja = await frage('Zurück zum Prüfen?',
      'Der Entwurf wird verworfen. Der Beleg bleibt erhalten und geht zurück in '
      + 'den Prüfmodus, wo du ihn neu zuordnen kannst.',
      { knopf: 'Verwerfen', gefahr: true });
    if (!ja) return;
    try {
      await api(`/entwuerfe/${typ}/${id}/verwerfen`, { method: 'POST' });
    } catch (fehler) {
      return melde(String(fehler.message || 'Konnte nicht verworfen werden.'), 'neg');
    }
    return laden();
  }

  const del = e.target.closest('[data-del]');
  if (del) {
    e.stopPropagation();
    const [bereich, id] = del.dataset.del.split(':');
    const ja = await frage(`${cfgFuer(bereich).einzahl} löschen?`,
      'Der Eintrag wird entfernt. Rückgängig machen lässt sich das nicht.',
      { knopf: 'Löschen', gefahr: true });
    if (!ja) return;
    try {
      await api(`/stammdaten/${endpunktBereich(bereich)}/${id}`, { method: 'DELETE' });
    } catch (fehler) {
      return melde(String(fehler.message || 'Konnte nicht gelöscht werden.'), 'neg');
    }
    return laden();
  }

  const add = e.target.closest('[data-add]');
  if (add) {
    const bereich = add.dataset.add;
    const cfg = cfgFuer(bereich);
    // Im Fokus ist die Einheit schon entschieden — die Blase steht vorgewählt da.
    const werte = bereich === 'mieten' && fokus
      ? { einheit: fokus.bezeichnung } : {};
    return formular({ titel: `${cfg.einzahl} hinzufügen`,
                      felder: felderFuer(bereich, werte), bereich, werte,
                      absicht: 'eintrag',
                      extra: bereich === 'mieten' ? mietExtra(null) : '' });
  }

  // CCCXIII — Klick auf einen Eintrag öffnet die Detailansicht (Daten links,
  // Beleg rechts). Das Bearbeiten-Formular ist von dort aus erreichbar.
  const edit = e.target.closest('[data-edit]');
  if (edit) {
    const [bereich, id] = edit.dataset.edit.split(':');
    return eintragDetail(bereich, id);
  }

  // CCXXIX — Grundschulden hängen nicht an BEREICHE (eigene Endpunkte), daher
  // eigene data-Attribute statt data-add/-edit/-del.
  if (e.target.closest('[data-gs-neu]')) return grundschuldFormular(null);

  const gsEdit = e.target.closest('[data-gs-edit]');
  if (gsEdit) {
    const g = grundschulden.find(x => String(x.id) === gsEdit.dataset.gsEdit);
    return g ? grundschuldFormular(g) : undefined;
  }

  const gsWeg = e.target.closest('[data-gs-weg]');
  if (gsWeg) {
    e.stopPropagation();
    const ja = await frage('Grundschuld löschen?',
      'Der Eintrag wird entfernt. Rückgängig machen lässt sich das nicht.',
      { knopf: 'Löschen', gefahr: true });
    if (!ja) return;
    try {
      await api(`/grundschulden/${gsWeg.dataset.gsWeg}`, { method: 'DELETE' });
    } catch (fehler) {
      return melde(String(fehler.message || 'Konnte nicht gelöscht werden.'), 'neg');
    }
    return laden();
  }
});

/* CCCXXVI / CCCLXIX — ein aufgenommener oder gewählter Lageplan wird abgelegt.
   Ein Foto läuft durch dieselbe Aufbereitung wie die Belege (`kamerascan`:
   Kanten erkennen, drehen, zuschneiden, klein als PDF); ein bereits fertiges
   PDF geht unverändert durch. Das Ergebnis wandert als multipart (Feld „datei")
   an den Lageplan-Endpunkt. Danach neu laden, damit der frische Plan — mitsamt
   Inline-Vorschau — in der Liste steht. Fehler dezent über melde. */
inhalt.addEventListener('change', async e => {
  const feld = e.target.closest('[data-lageplan-neu]');
  if (!feld || !feld.files || !feld.files.length) return;
  const dateien = [...feld.files];
  feld.value = '';        // damit dieselbe Datei danach erneut wählbar bleibt

  const bilder = dateien.filter(d => (d.type || '').startsWith('image/'));
  const pdf = dateien.find(d => (d.type || '') === 'application/pdf');
  let datei, name;
  if (bilder.length) {
    let ergebnis;
    try {
      ergebnis = await kamerascanStarten(bilder, { titel: 'Lageplan' });
    } catch (fehler) {
      return melde(String(fehler.message
        || 'Der Lageplan konnte nicht aufbereitet werden.'), 'neg');
    }
    if (!ergebnis) return;            // Zuschnitt abgebrochen
    datei = ergebnis.pdf; name = 'lageplan.pdf';
  } else if (pdf) {
    datei = pdf; name = pdf.name;
  } else {
    return;
  }

  // N9 — Zusatztitel direkt beim Erstellen erfragen; fließt in den Dateinamen.
  const tag = await lageplanTitelAbfragen();
  if (tag === null) return;               // abgebrochen
  const fd = new FormData();
  fd.append('datei', datei, name);
  if (tag) fd.append('bezeichnung', tag);
  melde('Lageplan wird hochgeladen …');
  try {
    const antwort = await fetch(
      `/api/einheiten/${feld.dataset.lageplanNeu}/lageplan`,
      { method: 'POST', body: fd });
    if (!antwort.ok) {
      const grund = await antwort.json().then(k => k.detail).catch(() => null);
      throw new Error(grund || `${antwort.status}`);
    }
  } catch (fehler) {
    return melde(String(fehler.message
      || 'Lageplan konnte nicht hochgeladen werden.'), 'neg');
  }
  melde('Lageplan gespeichert.', 'pos');
  return laden();
});

await laden();
</script>
