<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Objekt · ImmoCalc</title>
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F6E5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ImmoCalc">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/immo.css">
<style>
  /* N327-b — von 34px auf 28px verkleinert: die vier 44px-Kopfzeilen-Symbole
     liessen kurze Titel wie "Musterstraße 5" abschneiden; das Klickfeld
     bleibt bei 44px (groesseres negatives Inset gleicht die 6px aus). */
  .barlogo{width:28px;height:28px;border-radius:8px;flex:none;
           border:none;background:none;padding:0;cursor:pointer;display:block;
           position:relative}
  /* Rundung aufs SVG statt per overflow:hidden — so schneidet das Logo das
     unsichtbare 44x44-Klickfeld (::after) nicht weg (CCCLIII). */
  .barlogo svg{border-radius:8px}
  .barlogo:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  /* Unsichtbares 44x44-Klickfeld ums 28px-Logo — Aussehen gleich, Tippflaeche
     bleibt Fingergroesse. */
  .barlogo::after{content:"";position:absolute;inset:-8px}
  /* CCCXXXVI — Kopf-Titel und -Unterzeile bleiben einzeilig: beim Grundstück
     trägt die Unterzeile Ort · Gemarkung · Flur · Nutzungsart · Fläche und würde
     sonst umbrechen. Zu lang wird abgeschnitten (…). */
  #titel,#sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .banner{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;
          font:600 12px var(--mono);margin-bottom:18px;line-height:1.4}
  .banner .d{width:8px;height:8px;border-radius:50%;flex:none}
  .banner .days{margin-left:auto;font-weight:700;white-space:nowrap}
  .banner.pos{background:var(--pos-bg);color:var(--pos)} .banner.pos .d{background:var(--pos)}
  .banner.amber{background:var(--amber-bg);color:var(--amber)} .banner.amber .d{background:var(--amber)}
  .banner.neg{background:var(--neg-bg);color:var(--neg)} .banner.neg .d{background:var(--neg)}

  /* N317 — Baustellen-Banner: auffälliger als der ruhige `.banner` oben,
     bewusst — genau während eine Renovierung läuft, wird am meisten
     gescannt. Volltonfarbe statt Pastell, leichtes Pulsieren statt Stillstand;
     `prefers-reduced-motion` lässt es stehen, ohne zu animieren. */
  .baustelle-banner{display:flex;align-items:center;gap:12px;padding:14px 16px;
    border-radius:14px;margin-bottom:18px;text-decoration:none;color:#fff;
    background:var(--amber);box-shadow:0 4px 16px -4px rgba(145,98,18,.5);
    animation:bb-puls 2.6s ease-in-out infinite}
  .baustelle-banner .bb-ikon{flex:none;display:inline-flex}
  .baustelle-banner .bb-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .baustelle-banner .bb-titel{font:700 14.5px var(--disp);letter-spacing:-.01em;
    overflow-wrap:anywhere}
  .baustelle-banner .bb-sub{font:500 12px var(--body);opacity:.92;overflow-wrap:anywhere}
  .baustelle-banner .bb-pfeil{flex:none;font:400 20px var(--body);opacity:.85}
  .baustelle-banner:hover{box-shadow:0 6px 20px -4px rgba(145,98,18,.6)}
  @keyframes bb-puls{
    0%,100%{box-shadow:0 4px 16px -4px rgba(145,98,18,.5)}
    50%{box-shadow:0 4px 22px -2px rgba(145,98,18,.85)}
  }
  @media (prefers-reduced-motion: reduce){
    .baustelle-banner{animation:none}
  }

  .sekopf{display:flex;align-items:flex-start;gap:10px;margin:26px 0 12px}
  /* N210 — Titel + Objektname als Spalte, damit der Name UNTER „Stammdaten"
     steht und die Kopfzeile nicht mehr umbricht. */
  .sekopf .setxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .sekopf h2.sec{font:700 17px var(--disp);letter-spacing:-.015em;margin:0}
  .sekopf .seikon,.sekopf button{margin-top:1px}
  /* CCXCIX — Dokumentenbaum: Filter-Chips, farbige Äste, Dokumente als Früchte */
  .bfilter-leiste{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
  .bfilter{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 11px;
    min-height:38px;font:600 12.5px var(--body);cursor:pointer}
  .bfilter .bi{display:inline-flex;color:var(--bf,var(--soft))}
  .bfilter .bi svg{width:16px;height:16px}
  .bfilter .bz{font:600 11px var(--mono);color:var(--soft);background:var(--paper);
    border-radius:999px;padding:1px 6px}
  .bfilter.an{background:var(--bf,var(--teal));border-color:var(--bf,var(--teal));color:#fff}
  .bfilter.an .bi,.bfilter.an .bz{color:#fff}
  .bfilter.an .bz{background:rgba(255,255,255,.24)}
  .baum{display:flex;flex-direction:column;gap:10px}
  /* CCCXXXI — verknüpfter Cloud-Pfad klein/kursiv unter dem Ablage-Header */
  .ablage-pfad:not(:empty){font:italic 400 11.5px var(--body);color:var(--soft);
    margin:-8px 2px 12px;overflow-wrap:anywhere;display:block}
  .zweig{background:var(--sheet);border-radius:14px;padding:12px 13px;
    border-left:4px solid var(--zw,var(--line))}
  .zweig.zu{padding:8px 13px}
  /* CCCXXXI — der Ordnerkopf ist ein Knopf: antippen klappt auf/zu */
  .zkopf{display:flex;align-items:center;gap:9px;margin-bottom:8px;width:100%;
    border:none;background:none;text-align:left;cursor:pointer;padding:4px 0;
    font-family:var(--body);color:var(--ink)}
  .zweig.zu .zkopf{margin-bottom:0}
  .zkopf:hover .zn{color:var(--teal-d)}
  .zkopf .zpfeil{flex:none;font:400 18px var(--body);color:var(--soft);
    transition:transform .15s;transform:rotate(90deg)}
  .zkopf .zpfeil.auf{transform:rotate(-90deg)}
  /* CCCXXXI — Jahres-Filter im Nebenkosten-Ordner */
  .jahr-leiste{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px 21px}
  .jchip{border:1px solid var(--line);background:var(--paper);color:var(--soft);
    border-radius:999px;padding:4px 11px;font:600 11px var(--mono);cursor:pointer;
    min-height:30px}
  .jchip.an{background:var(--teal);border-color:var(--teal);color:#fff}
  .zkopf .zi{display:inline-flex;color:var(--zw);flex:none}
  .zkopf .zi svg{width:19px;height:19px}
  .zkopf .zt{flex:1;min-width:0;display:flex;flex-direction:column}
  .zkopf .zn{font:700 14px var(--disp)}
  .zkopf .zo{font:500 11px var(--mono);color:var(--soft)}
  .zkopf .zz{font:600 11px var(--mono);color:var(--soft);white-space:nowrap}
  .fruechte{display:flex;flex-direction:column;gap:3px;
    border-left:1px dashed var(--line);margin-left:9px;padding-left:12px}
  .frucht{display:flex;align-items:center;gap:8px;padding:5px 0;min-height:32px}
  /* CCCXVII — untergeordneter Beleg: eingerückt, mit Anschluss-Linie */
  .frucht.kind{margin-left:16px;padding-left:12px;
    border-left:2px solid var(--line)}
  .frucht.kind .fn{font-size:12px;color:var(--soft)}
  .frucht .fp{width:9px;height:9px;border-radius:50%;border:1.5px solid;flex:none}
  .frucht .fn{flex:1;min-width:0;font:500 12.5px var(--body);color:var(--ink);
    cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frucht .fn:hover{text-decoration:underline}
  .frucht.offen .fn{color:var(--soft)}
  /* CCCXXI — Statuszeichen als Knopf (antippen zum Umhängen) */
  .frucht .fstatus{flex:none;display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:8px;border:1px solid transparent;
    background:none;cursor:pointer;padding:0}
  .frucht .fstatus.pos{color:var(--pos)}
  .frucht .fstatus.info{color:var(--soft)}
  .frucht .fstatus:hover{border-color:var(--line);background:var(--paper)}
  .frucht .fgrau{font:500 11px var(--mono);color:var(--soft);flex:none}
  .baum-legende{display:flex;flex-wrap:wrap;align-items:center;gap:5px 12px;
    margin:0 2px 10px;font:500 11px var(--body);color:var(--soft)}
  .baum-legende span{display:inline-flex;align-items:center;margin-right:2px}
  .baum-legende .bl-hak{color:var(--pos)}
  .baum-legende .bl-off{font:600 13px var(--mono);color:var(--soft)}
  .zd-loesen{display:block;width:calc(100% - 36px);margin:0 18px 12px;
    border:1px solid var(--neg);background:none;color:var(--neg);border-radius:11px;
    padding:9px;font:600 12px var(--disp);cursor:pointer}
  .zd-loesen:hover{background:var(--neg-bg)}
  .frucht .fzu{border:1px solid var(--line);background:var(--paper);color:var(--teal-d);
    border-radius:999px;padding:4px 10px;font:600 11.5px var(--disp);cursor:pointer;flex:none}
  .frucht .fzu:hover{background:var(--teal-l);border-color:var(--teal)}
  .mehrbtn{margin:8px 0 0 21px;border:none;background:none;color:var(--teal-d);
    font:600 12px var(--disp);cursor:pointer;padding:4px 0}
  .baumleer{font:500 12.5px var(--body);color:var(--soft);padding:10px 2px}

  /* CCCXII — Jahresstaffel einer wiederkehrenden Position */
  .eintrag.staffel{align-items:flex-start}
  .eintrag.staffel .en .stz{font:600 10.5px var(--mono);color:var(--soft);
    background:var(--paper);border-radius:99px;padding:1px 7px;margin-left:7px}
  .staffel-jahre{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .stjahr{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--sheet);border-radius:9px;padding:4px 12px;cursor:pointer;
    min-height:44px}
  .stjahr:hover{border-color:var(--teal);background:var(--teal-l)}
  .stjahr .sj{font:600 11px var(--mono);color:var(--ink)}
  .stjahr .sb{font:500 11px var(--body);color:var(--soft)}

  /* CCCIX/CCCX — Zuordnen-Dialog */
  .zuord-dlg{border:none;border-radius:18px;padding:0 0 4px;max-width:460px;
    width:calc(100vw - 28px);background:var(--sheet);color:var(--ink);
    box-shadow:0 18px 50px rgba(22,38,44,.25)}
  .zuord-dlg::backdrop{background:rgba(22,38,44,.45)}
  .zd-kopf{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
  .zd-t{font:700 15px var(--disp);flex:1}
  .zd-datei{margin:0 18px 12px;font:500 12.5px var(--mono);color:var(--soft);
    overflow-wrap:anywhere;line-height:1.5}
  .zd-block{padding:0 18px 14px}
  .zd-l{display:block;font:600 11px var(--mono);text-transform:uppercase;
    color:var(--soft);letter-spacing:.03em;margin-bottom:7px}
  .zd-chips{display:flex;flex-wrap:wrap;gap:6px}
  .zd-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 12px;
    min-height:40px;font:600 12.5px var(--body);cursor:pointer}
  .zd-chip .zi{display:inline-flex;color:var(--soft)}
  .zd-chip .zi svg{width:16px;height:16px}
  .zd-chip.an{background:var(--teal);border-color:var(--teal);color:#fff}
  .zd-chip.an .zi{color:#fff}
  .zd-hint{display:block;margin-top:8px;font:500 12px var(--body);color:var(--soft);
    line-height:1.5}
  .zd-x{border:none;background:var(--paper);width:32px;height:32px;border-radius:50%;
    font-size:18px;color:var(--ink);cursor:pointer;flex:none;line-height:1}
  .zd-fuss{display:flex;gap:10px;padding:4px 18px 18px}
  .zd-fuss button{flex:1;border-radius:12px;padding:13px;min-height:48px;border:none;
    font:600 14px var(--disp);cursor:pointer}
  .zd-ab{background:var(--paper);color:var(--ink)}
  .zd-ok{background:var(--teal);color:#fff}

  /* N141 — Anfangszählerstände: eine Übersicht, in der auch erfasst wird.
     Der Kopf steht fest, die Liste scrollt (14 Zeilen passen sonst auf kein
     Telefon), der Fuß bleibt sichtbar. `overscroll-behavior:contain` hält die
     Seite dahinter still, wenn die Liste am Ende ist. */
  /* Durchweg mit `dialog.` davor: `dialog.immo-dlg` in immo.css setzt Papier-
     Hintergrund, 22 px Innenrand und 400 px Breite — eine reine Klasse verliert
     dagegen und der Dialog käme grau, eng und zu schmal heraus. */
  /* N141c — der Dialog fiel auf dem iPhone zusammen: Kopf und Fuss standen,
     die Liste dazwischen bekam keine Hoehe. `flex:1` mit `min-height:0` in
     einem Container OHNE feste Hoehe laesst den Bereich auf null schrumpfen.
     Deshalb bekommt der Dialog jetzt eine Hoehe (nicht nur eine Obergrenze),
     und `vh` steht als Rueckfall vor `dvh` fuer aeltere iOS-Fassungen. */
  dialog.az-dlg{border:none;border-radius:20px;padding:0;max-width:560px;
    width:calc(100vw - 24px);background:var(--sheet);
    height:86vh; height:min(86dvh,900px); max-height:none;
    color:var(--ink);display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 18px 50px rgba(22,38,44,.25)}
  dialog.az-dlg::backdrop{background:rgba(22,38,44,.5)}
  dialog.az-dlg .zd-kopf{flex:none;border-bottom:1px solid var(--line);
    padding:12px 14px 12px 18px}
  /* Fingergerecht: das gemeinsame 32-px-Kreuz ist für einen Dialog, in dem
     lange gescrollt und getippt wird, zu klein. */
  dialog.az-dlg .zd-x{width:44px;height:44px;font-size:20px}
  dialog.az-dlg .zd-fuss{flex:none;border-top:1px solid var(--line);
    padding:12px 18px;gap:10px;align-items:center}
  dialog.az-dlg .az-body{flex:1 1 auto;min-height:140px;overflow:auto;
    overscroll-behavior:contain;padding:14px 18px 6px;-webkit-overflow-scrolling:touch}
  dialog.az-dlg .az-intro{margin:0 0 14px;font:500 12.5px var(--body);
    color:var(--soft);line-height:1.55}
  dialog.az-dlg .az-fort{display:flex;align-items:center;gap:11px;
    background:var(--paper);border-radius:13px;padding:11px 13px;margin-bottom:18px}
  dialog.az-dlg .az-balken{flex:1;height:7px;border-radius:99px;background:#DDE5E3;
    overflow:hidden}
  dialog.az-dlg .az-balken i{display:block;height:100%;background:var(--teal);
    border-radius:99px}
  dialog.az-dlg .az-fz{flex:none;font:600 11.5px var(--mono);color:var(--teal-d);
    white-space:nowrap}
  dialog.az-dlg .az-abschnitt{margin-bottom:20px}
  dialog.az-dlg .az-at{display:block;font:600 11px var(--mono);
    text-transform:uppercase;letter-spacing:.04em;color:var(--soft);margin-bottom:10px}
  dialog.az-dlg .az-at.offen{color:var(--amber)}
  dialog.az-dlg .az-gruppe{margin-bottom:14px}
  dialog.az-dlg .az-gt{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  dialog.az-dlg .az-gt .zi{display:inline-flex;color:var(--soft);flex:none}
  dialog.az-dlg .az-gt .zi svg{width:15px;height:15px;display:block}
  dialog.az-dlg .az-gt .az-gn{font:600 12px var(--disp);letter-spacing:-.01em}
  dialog.az-dlg .az-gt .az-me{font:500 10.5px var(--mono);color:var(--soft)}
  dialog.az-dlg .az-zeile{background:var(--paper);border-radius:13px;
    padding:11px 12px;margin-bottom:7px}
  dialog.az-dlg .az-zeile.offen{background:var(--amber-bg)}
  dialog.az-dlg .az-zeile.aend{background:var(--teal-l)}
  dialog.az-dlg .az-kopfz{display:flex;align-items:center;gap:9px;min-width:0}
  dialog.az-dlg .az-hak{flex:none;width:20px;height:20px;border-radius:50%;
    background:var(--pos);color:#fff;display:flex;align-items:center;
    justify-content:center}
  dialog.az-dlg .az-hak svg{width:12px;height:12px;display:block}
  dialog.az-dlg .az-punkt{flex:none;width:20px;height:20px;border-radius:50%;
    border:1.5px dashed var(--amber-li)}
  dialog.az-dlg .az-n{flex:1;min-width:0;font:600 13px var(--body);color:var(--ink);
    line-height:1.4;overflow-wrap:anywhere}
  dialog.az-dlg .az-stand{display:block;margin:4px 0 0 29px;
    font:600 11.5px var(--mono);color:var(--soft);overflow-wrap:anywhere}
  dialog.az-dlg .az-aend{flex:none;border:none;background:none;color:var(--teal-d);
    cursor:pointer;font:600 11.5px var(--disp);text-decoration:underline;
    padding:11px 2px;min-height:44px;white-space:nowrap}
  dialog.az-dlg .az-aend:hover{color:var(--teal)}
  dialog.az-dlg .az-hinw{display:block;margin:8px 0 0;font:500 11.5px var(--body);
    color:var(--amber);line-height:1.5}
  dialog.az-dlg .az-hinw.leise{color:var(--soft)}
  dialog.az-dlg .az-felder{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  dialog.az-dlg .az-f{display:flex;align-items:center;gap:6px;flex:1 1 160px;
    min-width:0;background:var(--sheet);border:1.5px solid var(--line);
    border-radius:11px;padding:0 10px;min-height:46px}
  /* Das Datumsfeld bringt seine eigene Anzeige mit (tt.mm.jjjj plus Kalender-
     Knopf) und wird sonst mitten im Jahr abgeschnitten. */
  dialog.az-dlg .az-f.dat{flex:1 1 175px}
  /* Die Knöpfe stehen immer auf einer eigenen Zeile — sonst rutscht bei vier
     Elementen einer allein um und steht verloren unter den Feldern. */
  dialog.az-dlg .az-knoepfe{display:flex;gap:7px;flex:1 1 100%}
  dialog.az-dlg .az-f:focus-within{border-color:var(--teal)}
  dialog.az-dlg .az-f label{flex:none;font:600 10px var(--mono);
    text-transform:uppercase;letter-spacing:.04em;color:var(--soft)}
  dialog.az-dlg .az-f input{flex:1;min-width:0;width:100%;border:none;
    background:none;color:var(--ink);font:600 13px var(--body);padding:11px 0;
    min-height:44px}
  dialog.az-dlg .az-f input:focus{outline:none}
  dialog.az-dlg .az-f .az-eh{flex:none;font:500 11px var(--mono);color:var(--soft)}
  dialog.az-dlg .az-sp{flex:1 1 120px;border:none;background:var(--teal);color:#fff;
    border-radius:11px;padding:0 16px;min-height:46px;font:600 12.5px var(--disp);
    cursor:pointer}
  dialog.az-dlg .az-sp:hover{background:var(--teal-d)}
  dialog.az-dlg .az-sp[disabled]{opacity:.55;cursor:default}
  dialog.az-dlg .az-ab{flex:1 1 100px;border:1px solid var(--line);
    background:var(--sheet);color:var(--soft);border-radius:11px;padding:0 14px;
    min-height:46px;font:600 12.5px var(--disp);cursor:pointer}
  dialog.az-dlg .az-fuss-note{margin:2px 0 10px;font:500 11.5px var(--body);
    color:var(--soft);line-height:1.55}
  dialog.az-dlg .az-meld{margin:10px 18px 0;padding:10px 12px;border-radius:11px;
    font:600 12.5px var(--body)}
  dialog.az-dlg .az-meld.ok{background:var(--pos-bg);color:var(--pos)}
  dialog.az-dlg .az-meld.fehler{background:var(--neg);color:#fff}
  dialog.az-dlg .az-leer{background:var(--pos-bg);color:var(--pos);
    border-radius:13px;padding:13px 14px;font:600 12.5px var(--body);
    line-height:1.5;margin-bottom:18px}
  dialog.az-dlg .az-konfig{flex:none;border:none;background:none;
    color:var(--teal-d);cursor:pointer;font:600 12.5px var(--disp);padding:12px 2px;
    min-height:46px;text-decoration:underline;white-space:nowrap}
  dialog.az-dlg .zd-fuss .zd-ok{flex:0 1 240px;margin-left:auto}

  /* N35 — Zeiträume-umstellen-Werkzeug */
  .sekopf-akt{display:flex;gap:16px;align-items:center}
  .zw-intro{margin:0 18px 12px;font:500 12.5px var(--body);color:var(--soft);
    line-height:1.55}
  .zw-row{margin:0 18px 10px;padding:11px 12px;background:var(--paper);
    border-radius:13px}
  .zw-lbl{font:600 12.5px var(--body);color:var(--ink);margin-bottom:8px;
    display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .zw-lbl .zw-typ{font:600 10px var(--mono);text-transform:uppercase;
    color:var(--soft);letter-spacing:.04em}
  .zw-lbl .zw-zu{font:600 10px var(--mono);color:var(--amber)}
  .zw-felder{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  /* N288 — die nativen `input[type=date]` sind hier raus (`datumwahl.js`
     statt Systemkalender). Der Chooser bringt das Mass der grossen
     Formularmasken mit (15 px, 44 px hoch); dieser Dialog ist eng — zwei
     Datumsgrenzen und ein Knopf je Zeile — und braucht sein kleineres Mass,
     sonst passt nur noch ein Feld je Zeile und Start und Ende stehen
     untereinander. Gehoert hierher und nicht als `style=` ans Element. */
  .zw-felder .datumwahl-knopf{
    font:600 12.5px var(--body); padding:9px 10px; min-height:42px;
    border-radius:10px; gap:6px;
  }
  .zw-b{border:1px solid var(--line);background:var(--sheet);color:var(--ink);
    border-radius:10px;padding:9px 12px;min-height:42px;font:600 12.5px var(--body);
    cursor:pointer;white-space:nowrap}
  .zw-b:hover{border-color:var(--teal);color:var(--teal-d)}
  .zw-b.teil{color:var(--amber)}
  .zw-teil{display:flex;gap:8px;align-items:center;margin-top:8px}
  .zw-teil label{font:600 10px var(--mono);text-transform:uppercase;color:var(--soft)}
  .zw-neu{margin:14px 18px 6px;padding-top:14px;border-top:1px solid var(--line)}
  .zw-abgl{margin:6px 18px 4px}
  .zw-abgl .zd-ok{width:100%;border-radius:12px;padding:14px;min-height:52px;
    border:none;font:600 14px var(--disp);cursor:pointer}
  .zw-erg{margin:10px 18px 0;font:500 12.5px var(--body);color:var(--ink);
    line-height:1.55;max-height:34vh;overflow:auto}
  .zw-erg .zw-move{color:var(--teal-d)}
  .zw-erg .zw-gf{color:var(--amber)}
  .zw-erg b{font-weight:700}
  /* N52 — Dialog-interne Meldung (Toast läge hinter dem modalen Dialog) */
  .zw-erg .zw-fehler{background:var(--neg);color:#fff;border-radius:10px;
    padding:9px 12px;font-weight:600}
  .zw-erg .zw-ok{background:var(--teal-l);color:var(--teal-d);border-radius:10px;
    padding:9px 12px;font-weight:600}
  .zw-leer{margin:2px 18px 10px;font:500 11.5px var(--mono);color:var(--soft);
    letter-spacing:.02em}
  /* Auf dem Handy einspaltig: die Wrapper verschwinden, die Zeilen behalten
     ihre bisherigen Ränder. Ab 900px zweispaltig — links die Zeiträume,
     rechts Neuanlegen/Abgleich/Bericht — damit der Dialog nicht so hoch wird. */
  .zw-body,.zw-links,.zw-rechts{display:contents}
  @media(min-width:900px){
    .immo-dlg.zw-breit{max-width:820px}
    .zw-breit .zw-body{display:grid;grid-template-columns:1fr 1fr;
      column-gap:22px;padding:0 18px;align-items:start}
    .zw-breit .zw-links,.zw-breit .zw-rechts{display:block;min-width:0}
    .zw-breit .zw-row,.zw-breit .zw-neu,.zw-breit .zw-abgl,
    .zw-breit .zw-erg,.zw-breit .zw-leer{margin-left:0;margin-right:0}
    .zw-breit .zw-neu{margin-top:0;padding-top:0;border-top:none}
    .zw-breit .zw-erg{max-height:46vh}
  }

  /* CCCXIII — Eintrags-Detail: Daten links, Beleg rechts. Auf dem Telefon
     stapelt sich alles (Daten oben, Beleg darunter), ab Tablet nebeneinander. */
  dialog.detail-dlg{max-width:min(1000px,calc(100vw - 24px));width:calc(100vw - 24px);
    height:min(92dvh,1080px);padding:0;background:var(--sheet);color:var(--ink);
    display:flex;flex-direction:column;overflow:hidden;border-radius:20px}
  dialog.detail-dlg::backdrop{background:rgba(22,38,44,.55)}
  .dd-kopf{display:flex;align-items:center;gap:10px;padding:16px 18px;flex:none;
    border-bottom:1px solid var(--line)}
  .dd-ikon{flex:none;display:inline-flex}.dd-ikon svg{width:22px;height:22px}
  .dd-t{flex:1;font:700 16px var(--disp);letter-spacing:-.015em;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-x{flex:none;border:none;background:var(--paper);width:38px;height:38px;
    border-radius:50%;font-size:20px;color:var(--ink);cursor:pointer;line-height:1}
  .dd-x:hover{background:var(--teal-l);color:var(--teal-d)}
  .dd-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
  .dd-links{flex:none;padding:16px 18px;display:flex;flex-direction:column;gap:16px}
  .dd-daten{display:flex;flex-direction:column;gap:1px;background:var(--paper);
    border-radius:14px;overflow:hidden}
  .dd-zeile{display:flex;gap:12px;justify-content:space-between;align-items:baseline;
    padding:11px 14px;background:var(--sheet)}
  .dd-l{font:500 12.5px var(--body);color:var(--soft);flex:none}
  .dd-v{font:600 13.5px var(--body);color:var(--ink);text-align:right;
    overflow-wrap:anywhere}
  .dd-belege{display:flex;flex-direction:column;gap:6px}
  .dd-sub{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.03em;
    color:var(--soft);margin-bottom:2px}
  .dd-beleg{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    border:1px solid var(--line);background:var(--sheet);border-radius:12px;
    padding:10px 12px;min-height:44px;cursor:pointer;font-family:var(--body)}
  /* Eingerückt heisst schmaler: mit `width:100%` lief der Info-Beleg um genau
     die Einrückung nach rechts aus der Karte heraus. */
  .dd-beleg.unter{margin-left:18px;width:calc(100% - 18px);border-style:dashed}
  .dd-beleg.an{border-color:var(--teal);background:var(--teal-l)}
  .dd-beleg .dd-bi{flex:none;display:inline-flex;color:var(--teal-d)}
  .dd-beleg .dd-bi svg{width:16px;height:16px}
  .dd-beleg .dd-bn{flex:1;min-width:0;font:600 12.5px var(--body);color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-beleg .dd-bj{flex:none;font:600 11px var(--mono);color:var(--soft)}
  .dd-keinbeleg{font:500 12.5px var(--body);color:var(--soft);line-height:1.5;
    padding:2px 0}
  /* CCCLXVII — direkt am Eintrag abfotografieren. Ohne Beleg ein sichtbarer
     Knopf, mit Beleg nur eine leise Zeile: der Weg soll da sein, ohne sich
     vorzudrängen. */
  .dd-scan{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
    max-width:100%;border:1px solid var(--line);background:var(--paper);
    color:var(--teal-d);border-radius:12px;padding:10px 14px;min-height:44px;
    font:600 12.5px var(--disp);cursor:pointer;text-align:left}
  .dd-scan:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
  .dd-scan .dd-si{flex:none;display:inline-flex}
  .dd-scan .dd-si svg{width:15px;height:15px}
  /* Leise heisst gedeckt, nicht klein: die Fläche bleibt fingergerecht. */
  .dd-scan.leise{border:none;background:none;padding:8px 2px;
    color:var(--soft);font:600 12px var(--body)}
  .dd-scan.leise:hover{background:none;color:var(--teal-d)}
  /* CCCLXXXII — mehrere Belegarten am Mietverhältnis: kleine Knopfreihe. */
  .dd-scanwahl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
  .dd-scanlabel{flex-basis:100%;font:600 10px var(--mono);letter-spacing:.08em;
    text-transform:uppercase;color:var(--soft)}
  /* CCCLXXXIX — Dokument-Checkliste je Mietverhältnis (Haken/fehlt/ersetzen). */
  .dd-checkliste{display:flex;flex-direction:column;gap:6px}
  .dd-check{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:11px;
    background:var(--paper);min-height:46px}
  .dd-check.da{background:var(--pos-bg)}
  .dd-ci{flex:none;width:22px;height:22px;border-radius:50%;display:flex;
    align-items:center;justify-content:center}
  .dd-ci.ok{background:var(--pos);color:#fff}
  .dd-ci.ok svg{width:13px;height:13px}
  .dd-check.fehlt .dd-ci{border:1.5px dashed #B4C4C1}
  /* N224 — zwei und mehr Aktionen passen nicht neben den Namen, ohne ihn
     abzuschneiden: Name oben, Aktionen darunter, umbrechend. Das galt zuerst
     nur für die Kaution; die Zeilen mit Vorlage + Druckern (N240/N264) hatten
     dasselbe Problem und quetschten ihren Namen auf null Breite — man sah nicht
     mehr, welches Dokument dort fehlt. Ein Muster, ein Name, beide Fälle. */
  .dd-check.zweizeilig{align-items:flex-start}
  .dd-zspalte{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding:2px 0}
  .dd-zaktionen{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .dd-cn{flex:1;min-width:0;text-align:left;border:none;background:none;cursor:pointer;
    font:600 13.5px var(--disp);color:var(--ink);padding:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  /* N223 — Jahr neben dem Dokumentnamen, z. B. bei einer Lohnsteuerbe-
     scheinigung, die jaehrlich neu dazukommt. */
  .dd-cn .dd-cj{margin-left:6px;font:500 11px var(--mono);color:var(--soft)}
  .dd-cn.leer{color:var(--soft);font-weight:500;cursor:default}
  .dd-cx{flex:none;border:none;background:none;color:var(--teal-d);cursor:pointer;
    font:600 11.5px var(--disp);text-decoration:underline;padding:8px 6px;min-height:44px}
  .dd-cx:hover{color:var(--teal)}
  /* N240 — Link zur leeren Vorlage neben „fehlt"-Zeilen mit Startbestand. */
  /* N264 — Drucken der leeren Vorlage, direkt neben „Vorlage". Nur das
     Symbol: der Zielort steht im Titel, die Zeile ist schon voll. */
  .dd-vdruck{flex:none;display:inline-flex;align-items:center;justify-content:center;
    border:1.5px solid #C3DAD2;background:var(--sheet);color:var(--teal-d);
    border-radius:9px;cursor:pointer;padding:0;width:34px;min-height:34px}
  .dd-vdruck:hover{background:var(--teal-l)}
  .dd-vdruck[disabled]{opacity:.55;cursor:default}
  .dd-vorlage{flex:none;border:none;background:none;color:var(--soft);cursor:pointer;
    font:600 11.5px var(--disp);text-decoration:underline;padding:8px 4px;min-height:44px}
  .dd-vorlage:hover{color:var(--teal-d)}
  .dd-cadd{flex:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid #C3DAD2;
    background:var(--sheet);color:var(--teal-d);border-radius:10px;cursor:pointer;
    font:600 11.5px var(--disp);padding:8px 11px;min-height:44px}
  .dd-cadd svg{width:15px;height:15px}
  /* Nur die Kamera, aber weiterhin ein volles Antippziel. */
  .dd-cadd.nurikon{min-width:44px;justify-content:center;padding:8px}
  .dd-cadd:hover{background:var(--teal-l)}
  .dd-aktionen{display:flex;flex-wrap:wrap;gap:8px}
  .dd-edit{align-self:flex-start;border:1px solid var(--line);background:var(--paper);
    color:var(--teal-d);border-radius:12px;padding:11px 16px;min-height:44px;
    font:600 13px var(--disp);cursor:pointer}
  .dd-edit:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
  /* min-width:0 ist Pflicht, nicht Kosmetik: als Flex-Element bekaeme diese
     Spalte sonst die Mindestbreite ihres laengsten unumbrechbaren Inhalts —
     der Ablagepfad ist genau das, und er schob die Vorschau aus dem Dialog. */
  .dd-rechts{flex:1;min-width:0;min-height:340px;padding:0 18px 18px;
    display:flex;flex-direction:column}
  .dd-rechts .beleg-flaeche{flex:1;min-height:0;overflow:auto;border-radius:14px;
    background:var(--paper);display:flex;flex-direction:column;gap:10px;
    align-items:center;padding:10px;-webkit-overflow-scrolling:touch}
  /* N232 - Ablagepfad + Dateiname ueber der Vorschau, egal welches Dokument.
     N280 - und zugleich der Weg ins gemeinsame Beleg-Fenster (umbenennen,
     Auslese, blaettern): die ganze Kopfzeile ist der Knopf. */
  .dd-vorschau-kopf{flex:none;padding:0 0 8px;min-width:0}
  .dd-vgross{display:block;width:100%;min-width:0;overflow:hidden;text-align:left;
    border:none;background:none;font-family:var(--body);cursor:pointer;
    padding:6px 2px;border-radius:10px}
  .dd-vgross:hover{background:var(--paper)}
  .dd-vorschau-kopf .dd-vn{display:block;font:600 13px var(--body);color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-vorschau-kopf .dd-vp{display:block;font:500 10.5px var(--mono);color:var(--soft);
    margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    direction:rtl;text-align:left}
  .dd-vlupe{display:block;margin-top:5px;font:600 11px var(--disp);
    letter-spacing:-.01em;color:var(--teal-d)}
  .dd-vlupe::before{content:"⤢";margin-right:5px}
  .dd-rechts .beleg-flaeche.klickbar{cursor:zoom-in}
  /* N333 — Antippen zoomt den Beleg IN dieser Ansicht auf: die Felder treten
     zur Seite, die Vorschau nimmt das ganze Blatt ein und scrollt durch alle
     Seiten. Vorher öffnete derselbe Tipp ein drittes, eigenes Fenster — der
     Nutzer sprang für einen genaueren Blick aus seiner Ansicht heraus. */
  .dd-body.zoom{overflow:hidden}
  .dd-body.zoom .dd-links{display:none}
  .dd-body.zoom .dd-rechts{flex:1;min-height:0;padding:12px 14px 14px}
  .dd-body.zoom .dd-rechts .beleg-flaeche{cursor:zoom-out;padding:8px}
  .dd-body.zoom .dd-rechts .beleg-bild{width:100%}
  @media (min-width:760px){
    .dd-body{flex-direction:row}
    .dd-links{width:340px;overflow:auto;border-right:1px solid var(--line)}
    .dd-rechts{padding:18px}
    .dd-body.zoom .dd-rechts{padding:18px}
  }

  /* CCCIV — Rubrik-Symbol in der Überschrift, in der Farbe der Rubrik */
  .sekopf .seikon{flex:none;display:inline-flex;align-items:center;
    color:var(--soft);align-self:center}
  .sekopf .seikon svg{width:20px;height:20px}
  /* N22 — Rubrik-Aktionen als einheitlicher teal Textlink: „Anlegen",
     „Bearbeiten" und der „Hinzufügen"-Zugang (Button ODER Datei-Label). */
  .sekopf button,.sekopf .seakt{border:none;background:none;color:var(--teal-d);
    cursor:pointer;font:600 12.5px var(--disp);padding:8px 4px;margin:-8px -4px;
    min-height:44px;display:inline-flex;align-items:center}
  .sekopf button:hover,.sekopf .seakt:hover{color:var(--teal)}
  .sekopf .voll-hinweis{flex:none;color:var(--soft);font:600 11px var(--mono);
    display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .sekopf .voll-hinweis::before{content:"✓";color:var(--pos);font-weight:700}
  .sekopf:first-child{margin-top:0}

  .liste{background:var(--sheet);border-radius:14px;overflow:hidden;margin-bottom:10px;
         box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .eintrag{display:flex;gap:12px;align-items:center;padding:13px 15px;width:100%;
           border:none;background:none;text-align:left;font-family:var(--body);
           color:inherit}
  .eintrag + .eintrag{border-top:1px solid var(--line)}
  .eintrag .sym{width:34px;height:34px;border-radius:10px;flex:none;display:flex;
                align-items:center;justify-content:center;background:#EDF1F0;
                color:var(--soft)}
  .eintrag .sym svg{width:20px;height:20px;display:block}
  .eintrag .et{flex:1;min-width:0}
  /* hyphens vor overflow-wrap: aus „Ankaufsdarlehen" wird ein getrenntes
     „Ankaufs-darlehen" statt eines Bruchs mitten im Wort. break-word bricht
     nur, wo eine Wortgrenze ist; anywhere zerschnitt jedes Wort. */
  .eintrag .en{display:block;font:600 14px var(--disp);letter-spacing:-.01em;
               hyphens:auto;overflow-wrap:break-word}
  /* Der Zustandshinweis läuft mit dem Namen mit, statt ihm Platz wegzunehmen —
     als eigene Spalte quetscht er den Namen auf schmalen Geräten Buchstabe
     für Buchstabe um. */
  .eintrag .en .chip{margin-left:6px;vertical-align:1px;font-size:10px}
  .eintrag .ed{display:block;font:400 12px var(--body);color:var(--soft);margin-top:3px;
               line-height:1.4;overflow-wrap:anywhere}
  .eintrag .ew{font:600 13px var(--mono);white-space:nowrap;flex:none;text-align:right}
  .eintrag .ew .ew-sub{display:block;font:600 10.5px var(--mono);color:var(--soft);
    margin-top:2px}
  .eintrag.klick{cursor:pointer}
  .eintrag.klick:hover{background:#F6F8F8}
  /* CLXXXVII — Löschen ist ein Ziel für den Daumen: 44x44. Die negativen
     Ränder halten die Zeile trotzdem so hoch wie zuvor — der Knopf greift in
     die Zeilenpolsterung hinein, statt sie zu vergrössern. */
  .eintrag .del{border:none;background:none;color:var(--soft);font:400 18px var(--body);
                cursor:pointer;padding:0;width:44px;height:44px;flex:none;
                margin:-5px -12px -5px 0;border-radius:11px}
  .eintrag .del:hover{color:var(--neg)}
  /* N19 — Mieter-Timeline: farbige Balken je Mietverhältnis, schraffierte
     Lücken für Leerstände, Jahres-Achse darunter. */
  .miet-timeline{margin:2px 2px 14px}
  .tl-track{position:relative;height:28px;background:#E3E9E9;border-radius:8px;overflow:hidden}
  .tl-seg{position:absolute;top:0;height:100%;border-radius:6px;min-width:3px}
  .tl-seg.leer{background:repeating-linear-gradient(45deg,#C9D3D3,#C9D3D3 5px,#DCE3E3 5px,#DCE3E3 10px)}
  .tl-achse{position:relative;height:15px;margin-top:5px}
  .tl-tick{position:absolute;transform:translateX(-50%);font:600 10px var(--mono);
    color:var(--soft);white-space:nowrap}
  .tl-tick:first-child{transform:translateX(0)}
  .tl-tick:last-child{transform:translateX(-100%)}
  .miet-dot{flex:none;width:14px;height:14px;border-radius:50%;align-self:center;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
  .miet-dot.leer{background:repeating-linear-gradient(45deg,#B9C6C6,#B9C6C6 3px,#DCE3E3 3px,#DCE3E3 6px)}
  .eintrag.leerstand{background:#F4F6F6}
  .eintrag.leerstand .en{color:var(--soft)}
  /* CCCLXIX/CCCLXXXI — Lageplan: Inline-Vorschau des ersten Plans (höhen-
     begrenzt), plus je Zeile zwei leise Aktionen (umbenennen, entfernen). */
  /* N4 — mehrere Pläne als kompakte Elemente NEBENEINANDER, jedes im
     Seitenverhältnis des Plans (nicht ganzseitig gedehnt), links bündig. */
  .lp-liste{display:flex;flex-wrap:wrap;gap:12px;padding:2px 0 2px}
  .lp-karte{position:relative;flex:0 0 auto;max-width:100%}
  .lp-vorschau{position:relative;display:block;border:none;padding:0;
    background:var(--paper);cursor:pointer;line-height:0;border-radius:12px;
    overflow:hidden;box-shadow:0 1px 3px rgba(22,38,44,.10)}
  /* Höhe fest, Breite aus dem Seitenverhältnis — Querformat wird breit-flach,
     Hochformat schmal-hoch; beide bleiben kompakt. */
  .lp-vorschau img{display:block;height:158px;width:auto;max-width:100%;
    object-fit:contain;background:var(--sheet)}
  /* N13 — auf iOS/schmal alle Pläne in EINER Zeile: zweiter/dritter klein
     rechts neben dem ersten, horizontal scrollbar statt Umbruch. */
  @media(max-width:520px){
    .lp-liste{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
      padding-bottom:6px;scroll-snap-type:x proximity}
    .lp-karte{scroll-snap-align:start}
    .lp-vorschau img{height:130px}
  }
  /* N4 — der Anzeigename als gedämpfte Pille UNTEN LINKS in der Ecke über dem
     Plan, damit sich Pläne (1.OG, DG …) auseinanderhalten lassen. */
  .lp-name{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);
    padding:4px 11px;border-radius:999px;background:rgba(15,20,22,.62);color:#fff;
    font:600 11.5px var(--mono);letter-spacing:.02em;line-height:1.35;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  /* Zwei leise Aktionen schweben oben rechts auf der Karte. */
  .lp-akte{position:absolute;top:9px;right:9px;display:flex;gap:5px}
  .lp-akt{width:34px;height:34px;border-radius:9px;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.88);color:var(--ink);font:400 15px var(--body);
    box-shadow:0 1px 3px rgba(22,38,44,.16)}
  .lp-akt:hover{background:#fff}
  .lp-akt.lp-weg:hover{color:var(--neg)}
  /* Vorschau nicht ladbar (ohne Cloud): kompaktes Kästchen mit Name statt Bild. */
  .lp-karte.lp-ohne-bild .lp-vorschau{width:210px;height:132px;display:flex;
    align-items:center;justify-content:center}
  .lp-karte.lp-ohne-bild .lp-vorschau img{display:none}
  .lp-karte.lp-ohne-bild .lp-name{position:static;background:var(--sheet);
    color:var(--soft);-webkit-backdrop-filter:none;backdrop-filter:none;max-width:none}
  .lp-eingabe{width:100%;border:1.5px solid var(--line);border-radius:10px;
    padding:11px 12px;font:500 15px var(--body);color:var(--ink);background:#fff}
  .lp-eingabe:focus{outline:none;border-color:var(--teal)}
  .leerzeile{font:400 13px var(--body);color:var(--soft);padding:16px 15px;text-align:center}
  .sehinweis{font:400 12.5px var(--body);color:var(--soft);line-height:1.5;
    margin:-2px 2px 12px;padding:11px 13px;background:var(--paper);border-radius:12px}
  .sehinweis strong{color:var(--ink);font-weight:600}

  /* CCCLXXX (a) — Anfangszählerstand-Rubrik unter den Abrechnungszeiträumen. Ruhig:
     eine einzelne Karte in der Blattfarbe, links ein gedecktes Symbol, rechts ein
     Pfeil, wenn es etwas zu tun gibt. Im erledigten Zustand ohne Pfeil, grüner
     Haken — dieselbe Sprache wie die übrigen Rubriken. */
  .erststand{display:flex;align-items:center;gap:12px;width:100%;
    background:var(--sheet);border-radius:14px;padding:13px 15px;margin-top:10px;
    text-align:left;font-family:var(--body);color:inherit;
    box-shadow:0 1px 2px rgba(22,38,44,.05)}
  button.erststand{border:none;cursor:pointer}
  button.erststand:hover{background:#F6F8F8}
  button.erststand:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .erststand .es-ik{width:34px;height:34px;border-radius:10px;flex:none;display:flex;
    align-items:center;justify-content:center;background:#EDF1F0;color:var(--soft)}
  .erststand .es-ik svg{width:20px;height:20px;display:block}
  .erststand .es-ik.ok{background:var(--pos-bg);color:var(--pos)}
  .erststand .es-tx{flex:1;min-width:0}
  .erststand .es-t{display:block;font:600 13.5px var(--disp);letter-spacing:-.01em}
  .erststand .es-d{display:block;font:400 12px var(--body);color:var(--soft);
    margin-top:3px;line-height:1.45;overflow-wrap:anywhere}
  .erststand .es-arr{flex:none;color:var(--soft);font:400 18px var(--body)}

  /* CCLXXVIII — Orange-Entwurf: ein aus einem Beleg vorläufig angelegter
     Datensatz. Linker Amber-Streifen + leicht getönter Grund, im Ton der
     gefüllten NK-Zeile, nur amber. Der Eintrag steht dabei als eigener Block
     mit Fußleiste (Marke + zwei Aktionen), nicht als schlichte Listenzeile. */
  .entwurf{background:var(--amber-bg);border-left:3px solid var(--amber);
           position:relative}
  .entwurf + .entwurf,.entwurf + .eintrag,.eintrag + .entwurf{
           border-top:1px solid var(--amber-li)}
  .entwurf .eintrag{background:none}
  .entwurf .eintrag.klick:hover{background:rgba(145,98,18,.06)}
  .entwurf .eintrag .sym{background:#EFE3C4;color:var(--amber)}
  .entfuss{display:flex;align-items:center;flex-wrap:wrap;gap:8px;
           padding:0 15px 12px 15px}
  .entfuss .marke{display:inline-flex;align-items:center;gap:5px;
           font:600 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;
           color:var(--amber);white-space:nowrap}
  .entfuss .marke .pt{width:7px;height:7px;border-radius:50%;
           background:var(--amber);flex:none}
  .entfuss .beleg{border:none;background:none;color:var(--amber);cursor:pointer;
           font:600 11.5px var(--body);text-decoration:underline;padding:6px 2px;
           min-height:36px}
  .entfuss .beleg:hover{color:var(--ink)}
  .entfuss .luecke{flex:1 1 auto;min-width:8px}
  .entfuss .ea{display:inline-flex;align-items:center;justify-content:center;gap:5px;
           border:none;border-radius:10px;cursor:pointer;min-height:40px;
           padding:8px 14px;font:600 12.5px var(--disp);white-space:nowrap}
  .entfuss .ea.ok{background:var(--pos);color:#fff}
  .entfuss .ea.ok:hover{background:#256640}
  .entfuss .ea.ok[disabled]{opacity:.6;cursor:default}
  .entfuss .ea.zurueck{background:transparent;color:var(--amber);
           box-shadow:inset 0 0 0 1.5px var(--amber-li)}
  .entfuss .ea.zurueck:hover{background:rgba(145,98,18,.08)}
  .add{width:100%;border:1.5px dashed #B4C4C1;background:transparent;color:var(--teal-d);
       border-radius:12px;padding:12px;font:600 13.5px var(--disp);cursor:pointer;
       min-height:44px;margin-bottom:4px}
  .add:hover{background:var(--teal-l)}
  /* CCCXC — kompakter „＋"-Knopf oben rechts am Rubrik-Titel statt eines
     vollbreiten Kastens, der die Seite in die Länge zog. 40px sichtbar, 44px
     tippbar (iOS) über die ::after-Fläche. */
  /* N10 — EIN einheitlicher „＋"-Stil für alle Rubriken (Lageplan wie Mieten):
     farblos-neutral, gut sichtbar, aber nicht dominant. Kein Teal-Grün mehr. */
  /* N22 — „hinzufügen" ist jetzt ein Textlink (.seakt, siehe .sekopf button),
     kein „+"-Kasten mehr; der alte .sekopf-add-Stil entfällt. */
  /* CCCXXVI — der Lageplan-Weg ist ein <label> über einem versteckten
     Datei-Feld: als Block, damit die Breite wie beim Knopf greift. */
  label.add{display:block;text-align:center}

  /* Stammdaten als Paarliste — Beschriftung links, Wert rechts */
  .paare{background:var(--sheet);border-radius:14px;padding:4px 15px;margin-bottom:10px;
         box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .paar{display:flex;justify-content:space-between;gap:14px;padding:11px 0;
        font:500 13.5px var(--body)}
  .paar + .paar{border-top:1px solid var(--line)}
  .paar .pl{color:var(--soft);flex:none}
  .paar .pv{font-family:var(--mono);font-weight:600;text-align:right;min-width:0;
            overflow-wrap:anywhere}
  .paar .pv.leer{color:var(--soft);font-weight:400;font-family:var(--body)}
  /* Gerechnete Zeilen treten zurück — sie sind Ergebnis, nicht Eingabe. */
  .paar .pv.abgeleitet{color:var(--teal-d)}
  /* Woher ein gerechneter Wert stammt („aus 5 Einheiten") — eine ruhige
     zweite Zeile unter dem Wert, im Fließtext statt in Mono. */
  .paar .pv .pq{display:block;font:400 11px var(--body);color:var(--soft);
                font-weight:400;margin-top:3px}
  /* CCLIV — weicht die manuell geführte Wohnfläche von den Einheiten ab, ein
     dezenter Hinweis in der Warnfarbe, kein Fehlerblock. */
  .fussnote.warn{color:var(--amber)}
  /* Freitext bekommt die ganze Zeilenbreite: nebeneinander bliebe für den
     Wortlaut aus dem Katasterauszug eine Spalte von vier Zeichen. */
  .paar.lang{flex-direction:column;align-items:flex-start;gap:4px}
  .paar.lang .pv{text-align:left;font-size:13px}
  /* CCCXXX — kompakte Zweiergruppen: zwei kurze Werte teilen sich eine Zeile
     und sparen so vertikale Höhe. Auf schmalen Geräten wieder gestapelt. */
  .paar.duo{gap:26px;align-items:stretch}
  .paar.duo .du{flex:1;min-width:0;display:flex;justify-content:space-between;
                align-items:baseline;gap:10px}
  @media(max-width:460px){
    .paar.duo{flex-direction:column;gap:0}
    .paar.duo .du{align-items:baseline}
    .paar.duo .du + .du{border-top:1px solid var(--line);
                        padding-top:11px;margin-top:11px}
  }
  /* CCCXXX — Konto & Rücklage und Nießbrauch als abgesetzte Blöcke: ein
     ruhiger Mono-Titel mit einer feinen Linie, die die Zeile ausklingen lässt. */
  .paar-trenn{display:flex;align-items:center;gap:12px;padding:16px 0 6px;
              font:600 10.5px var(--mono);letter-spacing:.07em;
              text-transform:uppercase;color:var(--soft)}
  .paar-trenn::after{content:"";flex:1;height:1px;background:var(--line)}
  /* CCCXXX/N210 — der Objektname als ruhige Zeile UNTER dem Titel. */
  .sekopf .setxt .secsub{display:block;font:500 12.5px var(--body);color:var(--soft);
    line-height:1.35;overflow-wrap:anywhere}
  .fussnote{font:400 12px var(--body);color:var(--soft);line-height:1.5;
            margin:-2px 2px 10px}

  dialog{border:none;border-radius:18px;padding:0;max-width:420px;width:calc(100% - 32px);
         background:var(--paper);box-shadow:0 30px 70px -20px rgba(22,38,44,.5);
         max-height:86dvh}
  dialog::backdrop{background:rgba(22,38,44,.45)}
  dialog .dh{font:700 17px var(--disp);letter-spacing:-.02em;padding:20px 20px 4px}
  dialog form{padding:12px 20px 20px;overflow-y:auto;max-height:calc(86dvh - 60px)}
  .zeile2{display:flex;gap:10px} .zeile2 > *{flex:1}

  /* CCCXXIII — Bearbeiten mit Beleg daneben. Ohne Beleg ist .dlg-pdf aus und
     der Dialog bleibt die schmale Standardmaske. */
  .dlg-pdf{display:none}
  dialog#dlg.mit-pdf{max-width:min(1000px,calc(100vw - 24px));
    width:calc(100vw - 24px);max-height:92dvh}
  dialog#dlg.mit-pdf .dlg-koerper{display:flex;flex-direction:column}
  dialog#dlg.mit-pdf form{max-height:none}
  dialog#dlg.mit-pdf .dlg-pdf{display:flex;padding:0 20px 20px}
  dialog#dlg.mit-pdf .dlg-pdf .beleg-flaeche{flex:1;min-height:260px;overflow:auto;
    border-radius:14px;background:var(--paper);display:flex;flex-direction:column;
    gap:10px;align-items:center;padding:10px;-webkit-overflow-scrolling:touch}
  @media (min-width:760px){
    dialog#dlg.mit-pdf .dlg-koerper{flex-direction:row;height:calc(92dvh - 56px)}
    dialog#dlg.mit-pdf form{width:360px;flex:none;max-height:none;
      border-right:1px solid var(--line)}
    dialog#dlg.mit-pdf .dlg-pdf{flex:1;padding:16px 20px;min-width:0}
  }

  /* CCCLI — die dialogeigenen Felder (Bewohner, Gemeinschafts-/Nutzfläche)
     liegen unter der .inp-Regel und müssen auf Touch ebenfalls auf 16px, sonst
     zoomt iOS beim Fokus hinein und die Seite bleibt vergrössert. */
  @media (pointer:coarse){
    .bwzeile input,.gfzeile input,.nfzeile input{font-size:16px}
  }

  /* N333 — der Bearbeiten-Dialog trägt auf dem Telefon denselben Rahmen wie
     die Detailansicht (`detail-dlg`): eingerückt, abgerundet, 92dvh hoch.
     Vorher (CCCL) füllte er randlos den ganzen Schirm — der Sprung aus dem
     Detail-Blatt ins Bearbeiten wirkte dadurch wie ein Seitenwechsel in eine
     fremde Ansicht, obwohl es dieselbe Seite ist. */
  @media (max-width:560px){
    /* NUR im offenen Zustand als Flex-Spalte — ohne [open] wuerde display:flex
       das UA-display:none eines geschlossenen <dialog> ueberschreiben und der
       leere Dialog legte sich als Block ueber den ersten Screen (CCCLII-Fix). */
    dialog#dlg[open]{
      margin:auto;width:calc(100vw - 24px);max-width:calc(100vw - 24px);
      height:min(92dvh,1080px);max-height:min(92dvh,1080px);border-radius:20px;
      display:flex;flex-direction:column;
      box-shadow:0 18px 40px rgba(22,38,44,.22);
    }
    dialog#dlg .dh{
      padding:16px 18px 12px;
      background:var(--paper);flex:none;
      box-shadow:0 1px 0 rgba(22,38,44,.08);
    }
    dialog#dlg .dlg-koerper{flex:1;min-height:0;display:flex;flex-direction:column}
    dialog#dlg form{
      flex:1;min-height:0;max-height:none;overflow-y:auto;
      padding-bottom:calc(20px + env(safe-area-inset-bottom));
    }
    /* Mit danebenliegendem Beleg (CCCXXIII): Felder oben, Beleg füllt den Rest. */
    dialog#dlg.mit-pdf form{flex:none}
    dialog#dlg.mit-pdf .dlg-pdf{
      flex:1;min-height:0;
      padding-bottom:calc(20px + env(safe-area-inset-bottom));
    }
  }

  .cloudbox{background:var(--sheet);border-radius:14px;padding:15px;margin-bottom:10px;
            box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .cloudbox .zeile{display:flex;gap:12px;align-items:center}
  .cloudbox .sym{width:42px;height:42px;border-radius:11px;flex:none;display:flex;
                 align-items:center;justify-content:center;font:600 16px var(--mono)}
  .cloudbox .sym.offen{background:var(--amber-bg);color:var(--amber)}
  .cloudbox .sym.fertig{background:var(--pos-bg);color:var(--pos)}
  /* N321 — Ladezustand der Ablage im Stil der KI-Erkennung (dasselbe ruhige
     Atmen statt eines drehenden Kreisels), Fehlerzustand im Nextcloud-
     Wolkensymbol statt der kargen Zeile mit blossem Hexagon-Zeichen. */
  .cloudbox .sym.laedt{background:var(--teal-l);color:var(--teal-d)}
  .cloudbox .sym.laedt svg{animation:ldn-atmen 2.6s ease-in-out infinite}
  .cloudbox .sym.laedt svg .wlk-funke{animation:ldn-funke 2.6s ease-in-out infinite}
  .cloudbox .sym.fehler{background:var(--amber-bg);color:var(--amber)}
  @media (prefers-reduced-motion:reduce){
    .cloudbox .sym.laedt svg,.cloudbox .sym.laedt svg .wlk-funke{animation:none}
  }
  .cloudbox .txt{flex:1;min-width:0}
  .cloudbox .t{display:block;font:600 14px var(--disp);letter-spacing:-.01em}
  .cloudbox .d{display:block;font:400 12px var(--body);color:var(--soft);margin-top:3px;
               line-height:1.45;word-break:break-word}
  .cloudbox .tat{margin-top:12px}
  .cloudbox .tat button,.cloudbox .tat a{display:block;width:100%;text-align:center;
    border:none;border-radius:11px;padding:12px;cursor:pointer;font:600 13.5px var(--disp);
    min-height:44px;background:var(--teal);color:#fff;text-decoration:none}
  .cloudbox .tat button:hover,.cloudbox .tat a:hover{background:var(--teal-d)}
  .cloudbox .tat button[disabled]{opacity:.6;cursor:default}
  /* Ist die Struktur da, ist das Nachlegen nur noch eine Nebensache:
     kleiner, rechts, ohne Farbfläche. */
  .cloudbox .tat.nebensache{margin-top:10px;text-align:right}
  .cloudbox .tat.nebensache button{display:inline-block;width:auto;background:none;
    color:var(--teal-d);padding:9px 12px;min-height:40px;font-size:12.5px;
    box-shadow:inset 0 0 0 1.5px var(--line)}
  .cloudbox .tat.nebensache button:hover{background:var(--teal-l)}
  .strukturliste{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
                 gap:6px;margin-top:12px}
  .strukturliste span{font:500 11px var(--mono);color:var(--soft);background:#F1F4F4;
    border-radius:8px;padding:7px 9px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .strukturliste span.eigen{background:var(--teal-l);color:var(--teal-d)}

  .gefahr-block{margin-top:30px;border-radius:16px;background:var(--sheet);padding:16px;
                box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .gefahr-block .gt{font:600 14px var(--disp);letter-spacing:-.01em;margin-bottom:6px}
  .gefahr-block p{font:400 12.5px var(--body);color:var(--soft);margin:0 0 14px;
                  line-height:1.5}
  .gefahr-block .btn + .btn{margin-top:8px}

  /* Untergruppen im Dialog: Bewohner, Jahresstände — eigener Block mit Luft,
     damit sie nicht wie ein weiteres Formularfeld wirken. */
  .block{margin:22px 0 16px}
  .block .bt{display:block;font:700 13px var(--disp);letter-spacing:-.01em;
             margin-bottom:5px}
  .block .bd{display:block;font:400 12px var(--body);color:var(--soft);
             line-height:1.5;margin-bottom:12px}
  .bwzeile{background:var(--sheet);border-radius:12px;padding:11px 12px;
           margin-bottom:8px;position:relative}
  .bwzeile input{width:100%;border:1.5px solid var(--line);border-radius:9px;
    padding:10px 11px;font:400 14px var(--body);color:var(--ink);background:#fff;
    margin-bottom:7px;min-height:44px}
  .bwzeile input:last-of-type{margin-bottom:0}
  .bwzeile input:focus{outline:none;border-color:var(--teal)}
  .bwzeile .weg{position:absolute;top:3px;right:3px;border:none;background:none;
    color:var(--soft);font:400 20px var(--body);cursor:pointer;
    width:44px;height:44px;border-radius:11px}
  .bwzeile .weg:hover{color:var(--neg);background:var(--paper)}
  .bwzeile .nm{padding-right:48px}
  /* CCCXXVII — Gemeinschaftsfläche: Name oben (breit), Fläche + Nutzer nebeneinander */
  .gfzeile{background:var(--sheet);border-radius:12px;padding:11px 12px;
    margin-bottom:8px;position:relative;display:flex;flex-wrap:wrap;gap:7px}
  .gfzeile input{border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;
    font:400 14px var(--body);color:var(--ink);background:#fff;min-height:44px;margin:0}
  .gfzeile input:focus{outline:none;border-color:var(--teal)}
  .gfzeile .nm{flex:1 1 100%;padding-right:48px}
  .gfzeile [name=gf_flaeche],.gfzeile [name=gf_personen]{flex:1 1 0;min-width:0}
  .gfzeile .weg{position:absolute;top:3px;right:3px;border:none;background:none;
    color:var(--soft);font:400 20px var(--body);cursor:pointer;
    width:44px;height:44px;border-radius:11px}
  .gfzeile .weg:hover{color:var(--neg);background:var(--paper)}
  /* CCCXXIX — Zusätzliche Nutzfläche: nur Name (breit) + Fläche, voll gerechnet */
  .nfzeile{background:var(--sheet);border-radius:12px;padding:11px 12px;
    margin-bottom:8px;position:relative;display:flex;flex-wrap:wrap;gap:7px}
  .nfzeile input{border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;
    font:400 14px var(--body);color:var(--ink);background:#fff;min-height:44px;margin:0}
  .nfzeile input:focus{outline:none;border-color:var(--teal)}
  .nfzeile .nm{flex:1 1 100%;padding-right:48px}
  .nfzeile [name=nf_flaeche]{flex:1 1 0;min-width:0}
  .nfzeile .weg{position:absolute;top:3px;right:3px;border:none;background:none;
    color:var(--soft);font:400 20px var(--body);cursor:pointer;
    width:44px;height:44px;border-radius:11px}
  .nfzeile .weg:hover{color:var(--neg);background:var(--paper)}
  .zusatz{width:100%;border:1.5px dashed #B4C4C1;background:transparent;
    color:var(--teal-d);border-radius:11px;padding:11px;font:600 13px var(--disp);
    cursor:pointer;min-height:44px}
  .zusatz:hover{background:var(--teal-l)}

  .jahre{background:var(--sheet);border-radius:12px;overflow:hidden;margin-bottom:12px}
  .jahr{padding:9px 10px;font:500 13px var(--body)}
  .jahr + .jahr{border-top:1px solid var(--line)}
  /* Die eigentliche Zeile bleibt eine flexe Reihe — die Zinszeile (CCXXXI)
     haengt sich als eigene, ruhigere Zeile darunter, statt die erste zu
     stauchen. */
  .jzeile{display:flex;align-items:center;gap:8px}
  .jzeile .jj{font:600 12px var(--mono);color:var(--soft);flex:none;width:36px}
  /* Der Betrag darf nie umbrechen — „240.000,00" und das € gehören zusammen. */
  .jzeile .jw{font:600 12.5px var(--mono);flex:1;text-align:right;white-space:nowrap}
  .jzeile .jq{font:500 10px var(--mono);letter-spacing:.02em;padding:4px 7px;
            border-radius:8px;background:#F1F4F4;color:var(--soft);flex:none;
            white-space:nowrap}
  .jahr.gemessen .jzeile .jq{background:var(--teal-l);color:var(--teal-d)}
  .jzeile .weg{border:none;background:none;color:var(--soft);font:400 18px var(--body);
    cursor:pointer;width:44px;height:44px;border-radius:11px;flex:none;
    margin:-6px -4px -6px 0}
  .jzeile .weg:hover{color:var(--neg);background:var(--paper)}
  .jz{font:400 11.5px var(--mono);color:var(--soft);text-align:right;
      margin-top:2px;padding-right:2px}
  .dlgnote{font:400 12px var(--body);color:var(--soft);line-height:1.5;
           margin:0 0 16px}

  /* N263 — der Foto-Weg über den Feldern. Gedämpftes Blau wie die anderen
     Beleg-Knöpfe (`.scanmini` in zeitraum.html), damit „hier kommt ein
     Dokument herein" überall dieselbe Farbe hat und sich vom teal-Speichern
     abhebt. Volle Breite, zwei Zeilen: der Untertitel sagt, was danach
     passiert — sonst wäre es nur ein Knopf mit unklarer Folge. */
  .scan-vorschlag{display:grid;grid-template-columns:auto 1fr;
    column-gap:12px;row-gap:2px;align-items:center;width:100%;
    border:1.5px solid #BBD4E5;background:#E8F1F7;color:#255676;
    border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;
    font-family:var(--body);margin:0 0 18px;min-height:44px}
  .scan-vorschlag:hover{background:#D8E8F2}
  .scan-vorschlag .sv-i{width:22px;height:22px;grid-row:1 / span 2}
  .scan-vorschlag .sv-t{font:600 13.5px var(--disp);letter-spacing:-.01em}
  .scan-vorschlag .sv-u{font:400 11.5px var(--body);color:#4A7391;
    line-height:1.4}
  /* N269 — die Vorschau der aufgenommenen Seiten in der ausgefüllten Maske:
     ohne sie wirkte der Scan wie spurlos verschwunden (Fund des Nutzers). */
  .sv-vorschau{margin:0 0 18px;border:1.5px solid #BBD4E5;background:#F3F8FB;
    border-radius:14px;padding:12px 14px}
  .sv-blaetter{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .sv-blatt{width:56px;height:74px;object-fit:cover;border-radius:8px;
    border:1px solid #BBD4E5;flex:none;background:#fff}
  /* N280 - der Dateiname gehoert zu den Seiten, die er benennt: sicht- und
     aenderbar direkt unter der Vorschau. Beim Anlegen aus einem Scan ist das
     die einzige Stelle dafuer - eine eigene Bestaetigungsmaske davor waere ein
     Klick zu viel, weil das gefuellte Formular ohnehin gleich danach kommt. */
  .sv-nlabel{display:block;margin-top:12px;font:600 10.5px var(--mono);
    letter-spacing:.05em;text-transform:uppercase;color:#4A7391}
  .sv-namefeld{display:block;width:100%;margin-top:6px;min-height:44px;
    border:1.5px solid #BBD4E5;border-radius:10px;background:var(--sheet);
    padding:11px 12px;font:500 13px var(--body);color:var(--ink)}
  .sv-namefeld:focus{outline:none;border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(15,110,92,.12)}
  .sv-nhinweis{display:block;margin-top:6px;font:400 11px var(--body);
    color:#4A7391;line-height:1.45}
  .sv-vzeile{display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin-top:10px}
  .sv-vanzahl{font:600 12.5px var(--body);color:#255676}
  .sv-vneu{border:none;background:none;color:var(--teal);cursor:pointer;
    font:600 12.5px var(--body);padding:8px 4px;min-height:44px}
  .sv-vneu:hover{text-decoration:underline}

  /* ---- CLXVIII: zwei Ebenen ------------------------------------------
     Der Weg zurück zum Haus steht ganz oben und sieht aus wie eine Karte,
     nicht wie ein Formularknopf — er führt eine Stufe hinauf, nicht weiter. */
  .hausweg{display:flex;align-items:center;gap:12px;width:100%;border:none;
    background:var(--sheet);border-radius:14px;padding:12px 14px;cursor:pointer;
    font-family:var(--body);color:inherit;text-align:left;margin-bottom:20px;
    min-height:56px;box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .hausweg:hover{background:#F6F8F8}
  .hausweg:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .hausweg .pfeil{font:400 20px var(--body);color:var(--soft);flex:none;
    width:22px;text-align:center}
  .hausweg .ic{width:38px;height:38px;border-radius:10px;overflow:hidden;flex:none}
  .hausweg .ic svg{width:100%;height:100%;display:block}
  .hausweg .ht{flex:1;min-width:0}
  .hausweg .hl{display:block;font:500 10.5px var(--mono);color:var(--soft);
    letter-spacing:.06em;text-transform:uppercase}
  .hausweg .hn{display:block;font:600 14.5px var(--disp);letter-spacing:-.01em;
    margin-top:3px;overflow-wrap:anywhere}

  /* ---- CLXIX: Einheiten als Blasen — dieselbe Sprache wie die Startseite.
     Grundform (CCCLXXVIII c) steht geteilt in immo.css; hier bleiben nur die
     objektseiten-eigenen Zustände: der freie Zustand ist grau (nicht amber wie
     auf der Startseite), die gewählte Blase trägt die Auszeichnungsfarbe. */
  .bubble.frei{background:#F1F4F4}
  /* Die gewählte Blase trägt die Auszeichnungsfarbe — eine Wahl, sichtbar
     ohne Häkchen. Steht NACH .frei, damit die Wahl den freien Grau-Ton schlägt. */
  .bubble.gewaehlt{background:var(--teal);box-shadow:none}
  .bubble.gewaehlt .bt{color:#fff}
  .bubble.gewaehlt .bf,.bubble.gewaehlt .bfrei{color:rgba(255,255,255,.8)}
  .feldnote{display:block;font:400 11.5px var(--body);color:var(--soft);
    line-height:1.5;margin-top:8px}
  /* ---- CXCIII: gedeckter Ja/Nein-Schalter, im Ton der Blasen ---- */
  .schalter{display:inline-flex;gap:4px;padding:4px;border-radius:999px;
    background:var(--paper);box-shadow:inset 0 1px 2px rgba(22,38,44,.06)}
  .schaltknopf{min-height:40px;min-width:72px;padding:8px 20px;border:none;
    border-radius:999px;background:transparent;color:var(--soft);
    font:600 13.5px var(--body);cursor:pointer;transition:background .12s,
    color .12s,box-shadow .12s}
  .schaltknopf:active{transform:scale(.97)}
  .schaltknopf:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .schaltknopf.an{background:var(--teal);color:#fff;
    box-shadow:0 1px 2px rgba(22,38,44,.12)}

  /* N20/N21 — grafischer Einstieg: Miete & Nebenkosten als gestapelte Säulen
     mit €/m²-Linie. Die Diagramm-Klassen sind seitenübergreifend (auch in
     nebenkosten.html/wertentwicklung.html) und gehören perspektivisch nach
     immo.css. */
  .diagramm-karte{background:var(--sheet);border-radius:16px;padding:16px 16px 14px}
  .chart{width:100%;max-width:560px;height:auto;display:block;overflow:visible}
  .chartleer{font:400 13px var(--body);color:var(--soft);text-align:center;
    padding:26px 8px}
  .legende{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
  .legende .le{display:flex;align-items:center;gap:6px;font:500 11.5px var(--body);
    color:var(--soft)}
  .legende .le i{width:11px;height:11px;border-radius:3px;flex:none}

  /* N32 — Objekt-Übersichtswerte rechts neben dem Diagramm (mobil darunter) */
  .diagramm-wrap{display:flex;flex-direction:column;gap:14px}
  .objekt-summen{background:var(--sheet);border-radius:16px;padding:12px 16px;
    display:flex;flex-direction:column}
  .os-grp{display:flex;flex-direction:column;padding:6px 0}
  .os-grp + .os-grp{border-top:1px solid var(--line)}
  .os-zeile{display:flex;justify-content:space-between;align-items:baseline;
    gap:12px;padding:5px 0}
  .os-l{font:500 12px var(--body);color:var(--soft)}
  .os-w{font:700 13.5px var(--mono);color:var(--ink);white-space:nowrap}
  .os-grp.jahr .os-w{color:var(--teal-d)}
  @media(min-width:680px){
    .diagramm-wrap{flex-direction:row;align-items:flex-start;gap:18px}
    .diagramm-wrap .diagramm-karte{flex:1;min-width:0}
    .objekt-summen{flex:none;width:214px;align-self:stretch;justify-content:center}
  }

  /* N31/N217 — Vermietet-Stempel neben „seit …", Karten ~30 % kompakter. */
  .einheit-block + .einheit-block{border-top:1px solid var(--line)}
  .eintrag.vermietet{background:#F1F8F3;box-shadow:inset 3px 0 0 var(--pos)}
  .eintrag.vermietet.klick:hover{background:#E8F3EC}
  .eintrag .ewwrap{display:flex;align-items:center;gap:10px;justify-content:flex-end}
  /* N217 — der Stempel ist jetzt eine INLINE-Zeile: „VERMIETET  seit 3 Monate". */
  .e-stempel{flex:none;display:none;flex-direction:row;align-items:center;
    gap:8px;pointer-events:none;user-select:none}
  .stempel-svg{display:block;opacity:.6}
  .e-seit{font:700 9px var(--mono);color:var(--pos);opacity:.85;
    letter-spacing:.02em;white-space:nowrap}
  .ed-seit{color:var(--pos);font-weight:600}
  /* N217 — enger padding, Timeline direkt unter dem Titel. */
  .eintrag{padding-top:9px;padding-bottom:9px}
  .einheit-tl{padding:0 15px 8px 61px}
  .miet-timeline.mini{margin:0}
  .miet-timeline.mini .tl-track{height:11px;border-radius:5px}
  .miet-timeline.mini .tl-seg{border-radius:4px}
  .miet-timeline.mini .tl-achse{height:14px;margin-top:4px}
  .miet-timeline.mini .tl-tick{font-size:10.5px;font-weight:600}
  /* N217 — kleine Punkte an den Achsen-Ticks (grafischer als Text allein). */
  .miet-timeline.mini .tl-tick::before{content:"";display:inline-block;
    width:4px;height:4px;border-radius:50%;background:var(--line);
    vertical-align:middle;margin:-2px 4px 0 0}
  @media(min-width:680px){
    .eintrag.vermietet .ewwrap{flex:1}
    .e-stempel{display:flex}
    .eintrag.vermietet .ed-seit{display:none}
  }
  /* N217 — Info-i und „+" im Einheiten-Kopf, kompakt. */
  .einheiten-kopf{align-items:center}
  .einheiten-kopf .einheit-i{border:none;background:none;color:var(--soft);
    font-size:15px;line-height:1;cursor:pointer;padding:4px 8px;margin-right:auto}
  .einheiten-kopf .einheit-i:hover{color:var(--teal-d)}
  .einheiten-kopf .plus{border:none;background:var(--teal-l);color:var(--teal-d);
    width:34px;height:34px;border-radius:11px;cursor:pointer;
    font:600 21px var(--body);line-height:1;display:inline-flex;
    align-items:center;justify-content:center;flex:none}
  .einheiten-kopf .plus:hover{background:var(--teal);color:#fff}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="back" id="back" aria-label="Zurück" title="Zurück"></button>
    <a class="barlogo" id="barlogo" href="index.html" aria-label="Zur Übersicht"></a>
    <div class="barwrap">
      <h1 id="titel">Objekt</h1>
      <div class="sub" id="sub">wird geladen …</div>
    </div>
  </div>

  <div class="scroll" id="inhalt"></div>

  <div data-nav></div>
</div>

<dialog id="dlg">
  <div class="dh" id="dlgTitel">Eintrag</div>
  <!-- Kein method="dialog": das schliesst den Dialog beim Absenden sofort,
       noch bevor der Handler die Antwort hat. Wird das Speichern abgelehnt —
       etwa weil die Einheit schon vermietet ist —, waren damit alle Eingaben
       weg. Geschlossen wird jetzt erst, wenn es geklappt hat. -->
  <!-- CCCXXIII — beim Bearbeiten steht der Beleg daneben: Felder links, PDF
       rechts. Ohne Beleg bleibt der Dialog die schmale Standardmaske. -->
  <div class="dlg-koerper">
    <form id="dlgForm"></form>
    <div class="dlg-pdf" id="dlgPdf"></div>
  </div>
</dialog>

<script type="module">
/* N216 — dieser Rumpf lädt die themenreinen Objekt-Module (public/assets/objekt/).
   Rendern, Dialoge, Formular-Fabrik und Klick-Delegation stehen dort — hier
   bleiben nur die drei üblichen Aufrufe: installNav, initHandlers, laden. */
import { installLogos, installNav } from './assets/immo.js';
import { laden } from './assets/objekt/laden.js';
import { initHandlers } from './assets/objekt/handlers.js';

installNav();
installLogos();
initHandlers();

await laden();
</script>
</body>
</html>
