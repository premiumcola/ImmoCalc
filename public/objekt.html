<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Objekt · ImmoCalc</title>
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F6E5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ImmoCalc">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/immo.css">
<style>
  .barlogo{width:34px;height:34px;border-radius:9px;overflow:hidden;flex:none;
           border:none;background:none;padding:0;cursor:pointer;display:block}
  .barlogo:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .banner{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;
          font:600 12px var(--mono);margin-bottom:18px;line-height:1.4}
  .banner .d{width:8px;height:8px;border-radius:50%;flex:none}
  .banner .days{margin-left:auto;font-weight:700;white-space:nowrap}
  .banner.pos{background:var(--pos-bg);color:var(--pos)} .banner.pos .d{background:var(--pos)}
  .banner.amber{background:var(--amber-bg);color:var(--amber)} .banner.amber .d{background:var(--amber)}
  .banner.neg{background:var(--neg-bg);color:var(--neg)} .banner.neg .d{background:var(--neg)}

  .sekopf{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
  .sekopf h2.sec{font:700 17px var(--disp);letter-spacing:-.015em;margin:0;flex:1}
  /* CCXCIX — Dokumentenbaum: Filter-Chips, farbige Äste, Dokumente als Früchte */
  .bfilter-leiste{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
  .bfilter{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 11px;
    min-height:38px;font:600 12.5px var(--body);cursor:pointer}
  .bfilter .bi{display:inline-flex;color:var(--bf,var(--soft))}
  .bfilter .bi svg{width:16px;height:16px}
  .bfilter .bz{font:600 11px var(--mono);color:var(--soft);background:var(--paper);
    border-radius:999px;padding:1px 6px}
  .bfilter.an{background:var(--bf,var(--teal));border-color:var(--bf,var(--teal));color:#fff}
  .bfilter.an .bi,.bfilter.an .bz{color:#fff}
  .bfilter.an .bz{background:rgba(255,255,255,.24)}
  .baum{display:flex;flex-direction:column;gap:10px}
  .zweig{background:var(--sheet);border-radius:14px;padding:12px 13px;
    border-left:4px solid var(--zw,var(--line))}
  .zkopf{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .zkopf .zi{display:inline-flex;color:var(--zw);flex:none}
  .zkopf .zi svg{width:19px;height:19px}
  .zkopf .zt{flex:1;min-width:0;display:flex;flex-direction:column}
  .zkopf .zn{font:700 14px var(--disp)}
  .zkopf .zo{font:500 11px var(--mono);color:var(--soft)}
  .zkopf .zz{font:600 11px var(--mono);color:var(--soft);white-space:nowrap}
  .fruechte{display:flex;flex-direction:column;gap:3px;
    border-left:1px dashed var(--line);margin-left:9px;padding-left:12px}
  .frucht{display:flex;align-items:center;gap:8px;padding:5px 0;min-height:32px}
  /* CCCXVII — untergeordneter Beleg: eingerückt, mit Anschluss-Linie */
  .frucht.kind{margin-left:16px;padding-left:12px;
    border-left:2px solid var(--line)}
  .frucht.kind .fn{font-size:12px;color:var(--soft)}
  .frucht .fp{width:9px;height:9px;border-radius:50%;border:1.5px solid;flex:none}
  .frucht .fn{flex:1;min-width:0;font:500 12.5px var(--body);color:var(--ink);
    cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frucht .fn:hover{text-decoration:underline}
  .frucht.offen .fn{color:var(--soft)}
  /* CCCXXI — Statuszeichen als Knopf (antippen zum Umhängen) */
  .frucht .fstatus{flex:none;display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:8px;border:1px solid transparent;
    background:none;cursor:pointer;padding:0}
  .frucht .fstatus.pos{color:var(--pos)}
  .frucht .fstatus.info{color:var(--soft)}
  .frucht .fstatus:hover{border-color:var(--line);background:var(--paper)}
  .frucht .fgrau{font:500 11px var(--mono);color:var(--soft);flex:none}
  .baum-legende{display:flex;flex-wrap:wrap;align-items:center;gap:5px 12px;
    margin:0 2px 10px;font:500 11px var(--body);color:var(--soft)}
  .baum-legende span{display:inline-flex;align-items:center;margin-right:2px}
  .baum-legende .bl-hak{color:var(--pos)}
  .baum-legende .bl-off{font:600 13px var(--mono);color:var(--soft)}
  .zd-loesen{display:block;width:calc(100% - 36px);margin:0 18px 12px;
    border:1px solid var(--neg);background:none;color:var(--neg);border-radius:11px;
    padding:9px;font:600 12px var(--disp);cursor:pointer}
  .zd-loesen:hover{background:var(--neg-bg)}
  .frucht .fzu{border:1px solid var(--line);background:var(--paper);color:var(--teal-d);
    border-radius:999px;padding:4px 10px;font:600 11.5px var(--disp);cursor:pointer;flex:none}
  .frucht .fzu:hover{background:var(--teal-l);border-color:var(--teal)}
  .mehrbtn{margin:8px 0 0 21px;border:none;background:none;color:var(--teal-d);
    font:600 12px var(--disp);cursor:pointer;padding:4px 0}
  .baumleer{font:500 12.5px var(--body);color:var(--soft);padding:10px 2px}

  /* CCCXII — Jahresstaffel einer wiederkehrenden Position */
  .eintrag.staffel{align-items:flex-start}
  .eintrag.staffel .en .stz{font:600 10.5px var(--mono);color:var(--soft);
    background:var(--paper);border-radius:99px;padding:1px 7px;margin-left:7px}
  .staffel-jahre{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .stjahr{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);
    background:var(--sheet);border-radius:9px;padding:4px 8px;cursor:pointer}
  .stjahr:hover{border-color:var(--teal);background:var(--teal-l)}
  .stjahr .sj{font:600 11px var(--mono);color:var(--ink)}
  .stjahr .sb{font:500 11px var(--body);color:var(--soft)}

  /* CCCIX/CCCX — Zuordnen-Dialog */
  .zuord-dlg{border:none;border-radius:18px;padding:0 0 4px;max-width:460px;
    width:calc(100vw - 28px);background:var(--sheet);color:var(--ink);
    box-shadow:0 18px 50px rgba(22,38,44,.25)}
  .zuord-dlg::backdrop{background:rgba(22,38,44,.45)}
  .zd-kopf{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
  .zd-t{font:700 15px var(--disp);flex:1}
  .zd-datei{margin:0 18px 12px;font:500 12.5px var(--mono);color:var(--soft);
    overflow-wrap:anywhere;line-height:1.5}
  .zd-block{padding:0 18px 14px}
  .zd-l{display:block;font:600 11px var(--mono);text-transform:uppercase;
    color:var(--soft);letter-spacing:.03em;margin-bottom:7px}
  .zd-chips{display:flex;flex-wrap:wrap;gap:6px}
  .zd-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 12px;
    min-height:40px;font:600 12.5px var(--body);cursor:pointer}
  .zd-chip .zi{display:inline-flex;color:var(--soft)}
  .zd-chip .zi svg{width:16px;height:16px}
  .zd-chip.an{background:var(--teal);border-color:var(--teal);color:#fff}
  .zd-chip.an .zi{color:#fff}
  .zd-hint{display:block;margin-top:8px;font:500 12px var(--body);color:var(--soft);
    line-height:1.5}
  .zd-x{border:none;background:var(--paper);width:32px;height:32px;border-radius:50%;
    font-size:18px;color:var(--ink);cursor:pointer;flex:none;line-height:1}
  .zd-fuss{display:flex;gap:10px;padding:4px 18px 18px}
  .zd-fuss button{flex:1;border-radius:12px;padding:13px;min-height:48px;border:none;
    font:600 14px var(--disp);cursor:pointer}
  .zd-ab{background:var(--paper);color:var(--ink)}
  .zd-ok{background:var(--teal);color:#fff}

  /* CCCXIII — Eintrags-Detail: Daten links, Beleg rechts. Auf dem Telefon
     stapelt sich alles (Daten oben, Beleg darunter), ab Tablet nebeneinander. */
  dialog.detail-dlg{max-width:min(1000px,calc(100vw - 24px));width:calc(100vw - 24px);
    height:min(92dvh,1080px);padding:0;background:var(--sheet);color:var(--ink);
    display:flex;flex-direction:column;overflow:hidden;border-radius:20px}
  dialog.detail-dlg::backdrop{background:rgba(22,38,44,.55)}
  .dd-kopf{display:flex;align-items:center;gap:10px;padding:16px 18px;flex:none;
    border-bottom:1px solid var(--line)}
  .dd-ikon{flex:none;display:inline-flex}.dd-ikon svg{width:22px;height:22px}
  .dd-t{flex:1;font:700 16px var(--disp);letter-spacing:-.015em;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-x{flex:none;border:none;background:var(--paper);width:38px;height:38px;
    border-radius:50%;font-size:20px;color:var(--ink);cursor:pointer;line-height:1}
  .dd-x:hover{background:var(--teal-l);color:var(--teal-d)}
  .dd-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
  .dd-links{flex:none;padding:16px 18px;display:flex;flex-direction:column;gap:16px}
  .dd-daten{display:flex;flex-direction:column;gap:1px;background:var(--paper);
    border-radius:14px;overflow:hidden}
  .dd-zeile{display:flex;gap:12px;justify-content:space-between;align-items:baseline;
    padding:11px 14px;background:var(--sheet)}
  .dd-l{font:500 12.5px var(--body);color:var(--soft);flex:none}
  .dd-v{font:600 13.5px var(--body);color:var(--ink);text-align:right;
    overflow-wrap:anywhere}
  .dd-belege{display:flex;flex-direction:column;gap:6px}
  .dd-sub{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.03em;
    color:var(--soft);margin-bottom:2px}
  .dd-beleg{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    border:1px solid var(--line);background:var(--sheet);border-radius:12px;
    padding:10px 12px;min-height:44px;cursor:pointer;font-family:var(--body)}
  .dd-beleg.unter{margin-left:18px;border-style:dashed}
  .dd-beleg.an{border-color:var(--teal);background:var(--teal-l)}
  .dd-beleg .dd-bi{flex:none;display:inline-flex;color:var(--teal-d)}
  .dd-beleg .dd-bi svg{width:16px;height:16px}
  .dd-beleg .dd-bn{flex:1;min-width:0;font:600 12.5px var(--body);color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-beleg .dd-bj{flex:none;font:600 11px var(--mono);color:var(--soft)}
  .dd-keinbeleg{font:500 12.5px var(--body);color:var(--soft);line-height:1.5;
    padding:2px 0}
  .dd-aktionen{display:flex;flex-wrap:wrap;gap:8px}
  .dd-edit{align-self:flex-start;border:1px solid var(--line);background:var(--paper);
    color:var(--teal-d);border-radius:12px;padding:11px 16px;min-height:44px;
    font:600 13px var(--disp);cursor:pointer}
  .dd-edit:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
  .dd-rechts{flex:1;min-height:340px;padding:0 18px 18px;display:flex}
  .dd-rechts .beleg-flaeche{flex:1;min-height:0;overflow:auto;border-radius:14px;
    background:var(--paper);display:flex;flex-direction:column;gap:10px;
    align-items:center;padding:10px;-webkit-overflow-scrolling:touch}
  @media (min-width:760px){
    .dd-body{flex-direction:row}
    .dd-links{width:340px;overflow:auto;border-right:1px solid var(--line)}
    .dd-rechts{padding:18px}
  }

  /* CCCIV — Rubrik-Symbol in der Überschrift, in der Farbe der Rubrik */
  .sekopf .seikon{flex:none;display:inline-flex;align-items:center;
    color:var(--soft);align-self:center}
  .sekopf .seikon svg{width:20px;height:20px}
  .sekopf button{border:none;background:none;color:var(--teal-d);cursor:pointer;
    font:600 12.5px var(--disp);padding:8px 4px;margin:-8px -4px;min-height:44px}
  .sekopf button:hover{color:var(--teal)}
  .sekopf .voll-hinweis{flex:none;color:var(--soft);font:600 11px var(--mono);
    display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .sekopf .voll-hinweis::before{content:"✓";color:var(--pos);font-weight:700}
  .sekopf:first-child{margin-top:0}

  .liste{background:var(--sheet);border-radius:14px;overflow:hidden;margin-bottom:10px;
         box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .eintrag{display:flex;gap:12px;align-items:center;padding:13px 15px;width:100%;
           border:none;background:none;text-align:left;font-family:var(--body);
           color:inherit}
  .eintrag + .eintrag{border-top:1px solid var(--line)}
  .eintrag .sym{width:34px;height:34px;border-radius:10px;flex:none;display:flex;
                align-items:center;justify-content:center;background:#EDF1F0;
                color:var(--soft)}
  .eintrag .sym svg{width:20px;height:20px;display:block}
  .eintrag .et{flex:1;min-width:0}
  /* hyphens vor overflow-wrap: aus „Ankaufsdarlehen" wird ein getrenntes
     „Ankaufs-darlehen" statt eines Bruchs mitten im Wort. break-word bricht
     nur, wo eine Wortgrenze ist; anywhere zerschnitt jedes Wort. */
  .eintrag .en{display:block;font:600 14px var(--disp);letter-spacing:-.01em;
               hyphens:auto;overflow-wrap:break-word}
  /* Der Zustandshinweis läuft mit dem Namen mit, statt ihm Platz wegzunehmen —
     als eigene Spalte quetscht er den Namen auf schmalen Geräten Buchstabe
     für Buchstabe um. */
  .eintrag .en .chip{margin-left:6px;vertical-align:1px;font-size:10px}
  .eintrag .ed{display:block;font:400 12px var(--body);color:var(--soft);margin-top:3px;
               line-height:1.4;overflow-wrap:anywhere}
  .eintrag .ew{font:600 13px var(--mono);white-space:nowrap;flex:none;text-align:right}
  .eintrag .ew .ew-sub{display:block;font:600 10.5px var(--mono);color:var(--soft);
    margin-top:2px}
  .eintrag.klick{cursor:pointer}
  .eintrag.klick:hover{background:#F6F8F8}
  /* CLXXXVII — Löschen ist ein Ziel für den Daumen: 44x44. Die negativen
     Ränder halten die Zeile trotzdem so hoch wie zuvor — der Knopf greift in
     die Zeilenpolsterung hinein, statt sie zu vergrössern. */
  .eintrag .del{border:none;background:none;color:var(--soft);font:400 18px var(--body);
                cursor:pointer;padding:0;width:44px;height:44px;flex:none;
                margin:-5px -12px -5px 0;border-radius:11px}
  .eintrag .del:hover{color:var(--neg)}
  .leerzeile{font:400 13px var(--body);color:var(--soft);padding:16px 15px;text-align:center}
  .sehinweis{font:400 12.5px var(--body);color:var(--soft);line-height:1.5;
    margin:-2px 2px 12px;padding:11px 13px;background:var(--paper);border-radius:12px}
  .sehinweis strong{color:var(--ink);font-weight:600}

  /* CCLXXVIII — Orange-Entwurf: ein aus einem Beleg vorläufig angelegter
     Datensatz. Linker Amber-Streifen + leicht getönter Grund, im Ton der
     gefüllten NK-Zeile, nur amber. Der Eintrag steht dabei als eigener Block
     mit Fußleiste (Marke + zwei Aktionen), nicht als schlichte Listenzeile. */
  .entwurf{background:var(--amber-bg);border-left:3px solid var(--amber);
           position:relative}
  .entwurf + .entwurf,.entwurf + .eintrag,.eintrag + .entwurf{
           border-top:1px solid var(--amber-li)}
  .entwurf .eintrag{background:none}
  .entwurf .eintrag.klick:hover{background:rgba(145,98,18,.06)}
  .entwurf .eintrag .sym{background:#EFE3C4;color:var(--amber)}
  .entfuss{display:flex;align-items:center;flex-wrap:wrap;gap:8px;
           padding:0 15px 12px 15px}
  .entfuss .marke{display:inline-flex;align-items:center;gap:5px;
           font:600 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;
           color:var(--amber);white-space:nowrap}
  .entfuss .marke .pt{width:7px;height:7px;border-radius:50%;
           background:var(--amber);flex:none}
  .entfuss .beleg{border:none;background:none;color:var(--amber);cursor:pointer;
           font:600 11.5px var(--body);text-decoration:underline;padding:6px 2px;
           min-height:36px}
  .entfuss .beleg:hover{color:var(--ink)}
  .entfuss .luecke{flex:1 1 auto;min-width:8px}
  .entfuss .ea{display:inline-flex;align-items:center;justify-content:center;gap:5px;
           border:none;border-radius:10px;cursor:pointer;min-height:40px;
           padding:8px 14px;font:600 12.5px var(--disp);white-space:nowrap}
  .entfuss .ea.ok{background:var(--pos);color:#fff}
  .entfuss .ea.ok:hover{background:#256640}
  .entfuss .ea.ok[disabled]{opacity:.6;cursor:default}
  .entfuss .ea.zurueck{background:transparent;color:var(--amber);
           box-shadow:inset 0 0 0 1.5px var(--amber-li)}
  .entfuss .ea.zurueck:hover{background:rgba(145,98,18,.08)}
  .add{width:100%;border:1.5px dashed #B4C4C1;background:transparent;color:var(--teal-d);
       border-radius:12px;padding:12px;font:600 13.5px var(--disp);cursor:pointer;
       min-height:44px;margin-bottom:4px}
  .add:hover{background:var(--teal-l)}

  /* Stammdaten als Paarliste — Beschriftung links, Wert rechts */
  .paare{background:var(--sheet);border-radius:14px;padding:4px 15px;margin-bottom:10px;
         box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .paar{display:flex;justify-content:space-between;gap:14px;padding:11px 0;
        font:500 13.5px var(--body)}
  .paar + .paar{border-top:1px solid var(--line)}
  .paar .pl{color:var(--soft);flex:none}
  .paar .pv{font-family:var(--mono);font-weight:600;text-align:right;min-width:0;
            overflow-wrap:anywhere}
  .paar .pv.leer{color:var(--soft);font-weight:400;font-family:var(--body)}
  /* Gerechnete Zeilen treten zurück — sie sind Ergebnis, nicht Eingabe. */
  .paar .pv.abgeleitet{color:var(--teal-d)}
  /* Woher ein gerechneter Wert stammt („aus 5 Einheiten") — eine ruhige
     zweite Zeile unter dem Wert, im Fließtext statt in Mono. */
  .paar .pv .pq{display:block;font:400 11px var(--body);color:var(--soft);
                font-weight:400;margin-top:3px}
  /* CCLIV — weicht die manuell geführte Wohnfläche von den Einheiten ab, ein
     dezenter Hinweis in der Warnfarbe, kein Fehlerblock. */
  .fussnote.warn{color:var(--amber)}
  /* Freitext bekommt die ganze Zeilenbreite: nebeneinander bliebe für den
     Wortlaut aus dem Katasterauszug eine Spalte von vier Zeichen. */
  .paar.lang{flex-direction:column;align-items:flex-start;gap:4px}
  .paar.lang .pv{text-align:left;font-size:13px}
  .fussnote{font:400 12px var(--body);color:var(--soft);line-height:1.5;
            margin:-2px 2px 10px}

  dialog{border:none;border-radius:18px;padding:0;max-width:420px;width:calc(100% - 32px);
         background:var(--paper);box-shadow:0 30px 70px -20px rgba(22,38,44,.5);
         max-height:86dvh}
  dialog::backdrop{background:rgba(22,38,44,.45)}
  dialog .dh{font:700 17px var(--disp);letter-spacing:-.02em;padding:20px 20px 4px}
  dialog form{padding:12px 20px 20px;overflow-y:auto;max-height:calc(86dvh - 60px)}
  .zeile2{display:flex;gap:10px} .zeile2 > *{flex:1}

  /* CCCXXIII — Bearbeiten mit Beleg daneben. Ohne Beleg ist .dlg-pdf aus und
     der Dialog bleibt die schmale Standardmaske. */
  .dlg-pdf{display:none}
  dialog#dlg.mit-pdf{max-width:min(1000px,calc(100vw - 24px));
    width:calc(100vw - 24px);max-height:92dvh}
  dialog#dlg.mit-pdf .dlg-koerper{display:flex;flex-direction:column}
  dialog#dlg.mit-pdf form{max-height:none}
  dialog#dlg.mit-pdf .dlg-pdf{display:flex;padding:0 20px 20px}
  dialog#dlg.mit-pdf .dlg-pdf .beleg-flaeche{flex:1;min-height:260px;overflow:auto;
    border-radius:14px;background:var(--paper);display:flex;flex-direction:column;
    gap:10px;align-items:center;padding:10px;-webkit-overflow-scrolling:touch}
  @media (min-width:760px){
    dialog#dlg.mit-pdf .dlg-koerper{flex-direction:row;height:calc(92dvh - 56px)}
    dialog#dlg.mit-pdf form{width:360px;flex:none;max-height:none;
      border-right:1px solid var(--line)}

  .cloudbox{background:var(--sheet);border-radius:14px;padding:15px;margin-bottom:10px;

  .cloudbox .tat button,.cloudbox .tat a{display:block;width:100%;text-align:center;

  .strukturliste{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));

  /* Untergruppen im Dialog: Bewohner, Jahresstände — eigener Block mit Luft,

  .bwzeile{background:var(--sheet);border-radius:12px;padding:11px 12px;

  .gfzeile{background:var(--sheet);border-radius:12px;padding:11px 12px;

  .gfzeile .weg:hover{color:var(--neg);background:var(--paper)}
  .zusatz{width:100%;border:1.5px dashed #B4C4C1;background:transparent;
    color:var(--teal-d);border-radius:11px;padding:11px;font:600 13px var(--disp);

  .jahre{background:var(--sheet);border-radius:12px;overflow:hidden;margin-bottom:12px}
  .jahr{padding:9px 10px;font:500 13px var(--body)}
  .jahr + .jahr{border-top:1px solid var(--line)}
  /* Die eigentliche Zeile bleibt eine flexe Reihe — die Zinszeile (CCXXXI)

  .jzeile .jj{font:600 12px var(--mono);color:var(--soft);flex:none;width:36px}

  .jahr.gemessen .jzeile .jq{background:var(--teal-l);color:var(--teal-d)}

  .jzeile .weg:hover{color:var(--neg);background:var(--paper)}
  .jz{font:400 11.5px var(--mono);color:var(--soft);text-align:right;

  .dlgnote{font:400 12px var(--body);color:var(--soft);line-height:1.5;
           margin:0 0 16px}

  /* ---- CLXVIII: zwei Ebenen ------------------------------------------
     Der Weg zurück zum Haus steht ganz oben und sieht aus wie eine Karte,

  .hausweg{display:flex;align-items:center;gap:12px;width:100%;border:none;

  /* ---- CLXIX: Einheiten als Blasen — dieselbe Sprache wie die Startseite */
  .bubbles{display:flex;flex-wrap:wrap;gap:6px}

  .bubble.gewaehlt{background:var(--teal);box-shadow:none}

<body>
<div class="app">
  <div class="bar">
    <button class="back" id="back">Zurück</button>
    <a class="barlogo" id="barlogo" href="index.html" aria-label="Zur Übersicht"></a>
    <div class="barwrap">
      <h1 id="titel">Objekt</h1>
      <div class="sub" id="sub">wird geladen …</div>
    </div>
  </div>

  <div class="scroll" id="inhalt"></div>

  <div data-nav></div>
</div>

<dialog id="dlg">
  <div class="dh" id="dlgTitel">Eintrag</div>
  <!-- Kein method="dialog": das schliesst den Dialog beim Absenden sofort,
       noch bevor der Handler die Antwort hat. Wird das Speichern abgelehnt —
       etwa weil die Einheit schon vermietet ist —, waren damit alle Eingaben
       weg. Geschlossen wird jetzt erst, wenn es geklappt hat. -->
  <!-- CCCXXIII — beim Bearbeiten steht der Beleg daneben: Felder links, PDF
       rechts. Ohne Beleg bleibt der Dialog die schmale Standardmaske. -->
  <div class="dlg-koerper">
    <form id="dlgForm"></form>
    <div class="dlg-pdf" id="dlgPdf"></div>
  </div>
</dialog>

<script type="module">
import { installLogos, installNav, logoSvg, api, eur, eurVoll, esc, fristKlasse,
         fristText, melde, frage, wahl, schiebeFrage, promille, installHilfe,
         belegAnsehen, belegSeitenLaden }
  from './assets/immo.js';
import { kostenIcon } from './assets/kostenicons.js';
import { auswahlfeld } from './assets/auswahl.js';
installNav();

/* Lesbare Eingabe (Tausenderpunkte, IBAN in Vierergruppen, Steuernummer).
   Bewusst dynamisch geladen: fehlt die Datei, bleiben es schlichte Felder —
   die Seite muss deswegen nicht ausfallen. */
let eingabe = null;
try {
  eingabe = await import('./assets/eingabe.js');
} catch {
  eingabe = null;
}

installLogos();

/* Ein Grundstück ist ein eigener Fall, kein Haus mit weniger Feldern: keine
   Einheiten, keine Nebenkostenabrechnung, dafür Kataster und Grundsteuer.
   Erkannt wird es am Objekttyp. */
const GRUNDSTUECK = 'lg-grundstueck';
const istGrundstueck = () => Boolean(objekt) && objekt.typ === GRUNDSTUECK;

const anfrage = new URLSearchParams(location.search);
const slug = anfrage.get('o');
/* CLXVIII — dieselbe Seite, zwei Ebenen: ohne `e` das ganze Haus, mit `e` die
   eine Einheit im Fokus. Als zweite Datei wären Mietverhältnis, Kontakte und
   Abrechnung ein zweites Mal zu pflegen und liefen mit der Zeit auseinander. */
const fokusWunsch = anfrage.get('e');
const inhalt = document.getElementById('inhalt');
const titel = document.getElementById('titel');
const sub = document.getElementById('sub');
const dlg = document.getElementById('dlg');

const hausUrl = () => `objekt.html?o=${encodeURIComponent(slug)}`;
const einheitUrl = id => `${hausUrl()}&e=${id}`;

/* Aus dem Fokus führt „Zurück" immer ans Haus — auch wenn man über einen Link
   direkt in der Einheit gelandet ist und es gar keine Historie gibt. */
document.getElementById('back').addEventListener('click', () => {
  if (fokus) { location.href = hausUrl(); return; }
  return history.length > 1 ? history.back() : location.href = 'index.html';
});

/* Zahlungsturnus kommt aus der API — die Bereiche haben unterschiedliche
   sinnvolle Auswahlen, und die soll nicht doppelt gepflegt werden. */
const turnusCache = new Map();
async function turnusOptionen(bereich) {
  if (!turnusCache.has(bereich)) {
    try {
      turnusCache.set(bereich, await api(`/turnus/${bereich}`));
    } catch {
      turnusCache.set(bereich, { optionen: [], vorgabe: '' });
    }
  }
  return turnusCache.get(bereich);
}

const proTurnus = { monatlich: '/ M', vierteljaehrlich: '/ Q', halbjaehrlich: '/ HJ',
                    jaehrlich: '/ J', einmalig: 'einm.' };
const kuerzel = t => proTurnus[t] || '/ J';
/* Wie oft im Jahr gezahlt wird — Grundlage für Monats- und Jahresgrößen. */
const proJahr = t => ({ monatlich: 12, vierteljaehrlich: 4,
                        halbjaehrlich: 2 }[t] || 1);

/* ---- CXLIX: Darlehen oder Bausparvertrag --------------------------------
   Beide hängen an derselben Immobilie und kosten dieselbe Rate im Monat —
   gerechnet werden sie umgekehrt. Beim Darlehen sinkt die Restschuld, beim
   Bausparvertrag wächst das Guthaben. Deshalb entscheidet die Vertragsart
   ganz oben, wie die Maske darunter aussieht; die Regeln dazu stehen in
   `api/app/vermoegen.py`, hier wird nur gefragt und gezeigt. */
const VERTRAGSARTEN = ['Darlehen', 'Bausparvertrag'];
const istBausparer = art =>
  String(art || '').trim().toLowerCase().startsWith('bauspar');

function kreditFelder(art, werte = {}) {
  const bauspar = istBausparer(art);
  return [
    { k: 'art', l: 'Vertragsart', typ: 'auswahl', werte: VERTRAGSARTEN,
      vorgabe: 'Darlehen', ohneLeer: true, umbau: true, lex: 'bausparvertrag',
      note: bauspar
        ? 'Beim Bausparvertrag wird gespart, nicht getilgt: eingetragen '
          + 'werden Bausparsumme und Guthaben.'
        : 'Beim Darlehen wird getilgt: eingetragen wird die Restschuld.' },
    { k: 'bezeichnung', l: 'Bezeichnung', typ: 'text', pflicht: true },
    { k: 'bank', l: bauspar ? 'Bausparkasse' : 'Bank', typ: 'text' },
    { k: 'darlehensnummer', l: bauspar ? 'Vertragsnummer' : 'Darlehensnummer',
      typ: 'text' },
    ...(bauspar ? [
      { k: 'bausparsumme', l: 'Bausparsumme', typ: 'number', schritt: '0.01',
        geld: true },
      { k: 'angespart', l: 'Bisher angespart', typ: 'number', schritt: '0.01',
        geld: true, note: (werte.uebernommen
          ? 'Aus der bisherigen Restschuld vorgeschlagen — prüfe den Betrag, '
            + 'bevor du speicherst. '
          : '')
          + 'Was noch zu sparen ist, ergibt sich als Differenz zur '
          + 'Bausparsumme.' },
    ] : [
      { k: 'urspruenglich', l: 'Ursprungsbetrag', typ: 'number', schritt: '0.01',
        geld: true },
      { k: 'restschuld', l: 'Restschuld bei Beginn', typ: 'number',
        schritt: '0.01', geld: true, lex: 'restschuld' },
      /* CXLVIII — zwei Wege zum selben Satz. Wer den Zinssatz nicht kennt,
         liest den monatlichen Zinsanteil aus dem Kontoauszug ab; die Kopplung
         rechnet ihn in den Satz um (und umgekehrt). Gespeichert wird nur der
         Zinssatz — ein zweites Feld am Modell wäre eine zweite Wahrheit,
         deshalb `hilfe: true`. Beim Bausparvertrag gibt es nichts
         umzurechnen: dort fällt kein Zins an, dort kommt welcher dazu. */
    ]),
    { k: 'zinssatz', l: bauspar ? 'Guthabenzins' : 'Zinssatz', typ: 'number',
      schritt: '0.01', einheit: '%', lex: bauspar ? null : 'sollzins' },
    ...(bauspar ? [] : [
      { k: 'zins_monat', l: 'Zinsanteil je Monat', typ: 'number',
        schritt: '0.01', geld: true, hilfe: true,
        note: 'Eines von beidem genügt — das andere ergibt sich aus der '
            + 'Restschuld.' },
    ]),
    { k: 'rate_monatlich', l: bauspar ? 'Sparbeitrag je Turnus'
                                      : 'Rate je Turnus',
      typ: 'number', schritt: '0.01', geld: true,
      lex: bauspar ? null : 'annuitaet' },
    { k: 'turnus', l: 'Zahlungsturnus', typ: 'turnus' },
    { k: 'beginn', l: 'Beginn', typ: 'date' },
    ...(bauspar ? [] : [
      { k: 'zinsbindung_bis', l: 'Zinsbindung bis', typ: 'date',
        lex: 'zinsbindung' },
      // CCXXX — der Satz, der ab Ende der Bindung gilt, wenn schon bekannt.
      // Optional: bleibt er leer, rechnet ImmoCalc wie bisher mit dem
      // gebundenen Zinssatz weiter.
      { k: 'zinssatz_variabel', l: 'Anschlusszins ab Bindungsende (variabel)',
        typ: 'number', schritt: '0.01', einheit: '%', lex: 'anschlusszins' },
    ]),
    { k: 'notiz', l: 'Notiz', typ: 'text' },
  ];
}

/* Was ein Vertrag heute wert ist — als Schuld oder als Guthaben. */
function kreditStandText(e) {
  if (istBausparer(e.art)) {
    const gespart = e.guthaben_aktuell ?? e.angespart ?? 0;
    return e.bausparsumme
      ? `${eurVoll(gespart)} von ${eurVoll(e.bausparsumme)}`
      : (gespart ? `Guthaben ${eurVoll(gespart)}` : '');
  }
  return restText(e);
}

/* Welche Felder ein Formular zeigt. Kredite hängen von der Vertragsart ab, die
   Stammdaten vom Nießbrauch-Schalter (CCCI) — beide bauen sich beim Umschalten
   im Formular selbst um. */
const felderFuer = (bereich, werte = {}, absicht = bereich) =>
  absicht === 'stamm' ? stammfelder(werte.niessbrauch_aktiv)
  : bereich === 'kredite' ? kreditFelder(werte.art, werte)
  : cfgFuer(bereich).felder;

/* Wird ein Vertrag von Darlehen auf Bausparvertrag umgestellt, ist der Betrag
   derselbe und seine Bedeutung eine andere: aus der Restschuld wird das
   Guthaben. Genau dieser Fall steht heute in der Datenbank — der „LBS
   Bausparer" lief als Kredit. Der Betrag wird deshalb angeboten, nicht
   ersetzt: er steht sichtbar im Feld und wird erst mit „Speichern" übernommen.
   Umgekehrt gibt es nichts anzubieten — ein Guthaben ist keine Schuld. */
function uebernahmeAnbieten(werte) {
  if (istBausparer(werte.art) && werte.angespart == null && werte.restschuld) {
    return { ...werte, angespart: werte.restschuld, uebernommen: true };
  }
  return werte;
}

/* Welche Felder hat welcher Bereich — steuert Liste, Formular und Symbol. */
const BEREICHE = {
  mieten: {
    titel: 'Mieten & Mieter', einzahl: 'Mietverhältnis', ikon: 'Miete',
    felder: [
      { k: 'einheit', l: 'Einheit', typ: 'einheit' },
      { k: 'partei', l: 'Mieter / Partei', typ: 'text' },
      { k: 'kaltmiete', l: 'Kaltmiete', typ: 'number', schritt: '0.01', geld: true },
      { k: 'nebenkosten_vz', l: 'NK-Vorauszahlung', typ: 'number', schritt: '0.01',
        geld: true },
      { k: 'stellplatz', l: 'Stellplatzmiete', typ: 'number', schritt: '0.01',
        geld: true },
      { k: 'sonstige', l: 'Sonstige Einnahmen', typ: 'number', schritt: '0.01',
        geld: true },
      { k: 'turnus', l: 'Zahlungsturnus', typ: 'turnus' },
      { k: 'ab_datum', l: 'Gültig ab', typ: 'date', pflicht: true },
      { k: 'bis_datum', l: 'Beendet am', typ: 'date' },
      // CCLXVI — die Kontaktdaten (E-Mail, Telefon, Anschrift) werden nicht
      // mehr am Mietverhältnis abgefragt, sondern je Bewohner (siehe
      // bewohnerZeile). Die Spalten Miete.email/telefon/anschrift bleiben im
      // Modell bestehen — Altbestand bleibt gültig, es wird nur nicht mehr
      // hier eingegeben.
      { k: 'personen', l: 'Personen im Haushalt', typ: 'number', schritt: '1',
        lex: 'personen-im-haushalt' },
      { k: 'kaution', l: 'Kaution', typ: 'number', schritt: '0.01', geld: true,
        lex: 'kaution' },
      { k: 'notiz', l: 'Notiz', typ: 'text' },
    ],
    name: e => e.partei || e.einheit || 'Mietverhältnis',
    /* Die Mailadresse steht nicht in der Zeile — sie bricht auf dem Handy
       mitten im Wort um. Ein Zeichen genügt als Auskunft, ob sie da ist.
       Bei mehreren Bewohnern zählt, wie viele erreichbar sind. */
    /* Im Fokus steht die Einheit schon in der Kopfzeile — sie ein zweites Mal
       in jede Zeile zu schreiben, sagt nichts Neues. */
    detail: (e, imFokus = false) => [

    /* Beendete Mietverhältnisse bleiben als Historie stehen, treten aber

   die beim Erwerb einmalig anfallen (Notar, Grunderwerbsteuer, Grundbuch,
   Makler …). Technisch eine Zahlung mit fester Kategorie „Erwerbsnebenkosten"
   und Turnus „einmalig" — deshalb ein eigenes Kürzel, keine /Jahr-Angabe. Die
   Rubrik teilt sich den Zahlungs-Endpunkt (siehe RUBRIK_ENDPUNKT). */
const ERWERB_ARTEN = ['Notar', 'Grunderwerbsteuer', 'Grundbuch / Grundschuld',

  ikon: 'Erwerbsnebenkosten',

    // ohneLeer + Vorgabe: eine Erwerbsnebenkosten-Art gibt es immer — sonst
    // liesse sich (ohne Auswahl) ein Posten ohne Art speichern (auswahl.js
    // meldet den Wert erst bei Nutzer-Auswahl zurück).
    { k: 'art', l: 'Art', typ: 'auswahl', werte: ERWERB_ARTEN, ohneLeer: true,
      vorgabe: ERWERB_ARTEN[0], pflicht: true },

  name: e => e.art || 'Erwerbsnebenkosten',

  wert: e => eurVoll(e.betrag || 0),
};

// Rubriken, die keinen eigenen Endpunkt haben, sondern auf einem anderen
// aufsetzen (Erwerbsnebenkosten sind Zahlungen einer festen Kategorie).
const RUBRIK_ENDPUNKT = { erwerbskosten: 'zahlungen' };
const endpunktBereich = b => RUBRIK_ENDPUNKT[b] || b;
// Feste Feldwerte, die eine Pseudo-Rubrik beim Speichern immer mitschickt.
const RUBRIK_FESTWERTE = {
  erwerbskosten: { kategorie: 'Erwerbsnebenkosten', turnus: 'einmalig',
                   absetzbar: false },
};
const ERWERB_KATEGORIE = 'Erwerbsnebenkosten';

/** Die Beschreibung eines Bereichs — beim Grundstück in seiner Sprache.
    „Steuer & Zahlungen" heisst dort schlicht „Finanzamt" (CCCIV). */
const cfgFuer = (bereich) => {
  if (bereich === 'erwerbskosten') return ERWERB;
  if (!istGrundstueck()) return BEREICHE[bereich];
  if (bereich === 'mieten') return { ...BEREICHE.mieten, ...PACHT };
  if (bereich === 'zahlungen') {
    return { ...BEREICHE.zahlungen, titel: 'Finanzamt', ikon: 'Finanzamt' };
  }
  return BEREICHE[bereich];
};

/* Beim Grundstück gibt es keine Wohnfläche und kein Hauskonto — die Zeilen
   stehen dort nicht ausgegraut herum, sie kommen gar nicht erst vor. Der
   Verkehrswert wandert in den Grundstücksblock. */
// CCXCVII — ein landwirtschaftliches Grundstück braucht vieles nicht: keine
// Straße (es ist ein Flurstück), keine AfA (Grund und Boden wird nicht
// abgeschrieben), kein Rücklagenkonto und kein Hauskonto. Diese Zeilen kommen
// dort gar nicht erst vor — der Verkehrswert wandert in den Grundstücksblock.
const OHNE_BEIM_GRUNDSTUECK = new Set([
  'flaeche', 'verkehrswert', 'grundstueck_flaeche',
  'strasse', 'afa_basis_uebernommen',
  'ruecklage_saldo', 'ruecklage_monatlich',
  'bank', 'iban', 'kontoinhaber']);
/* Die Stammfelder — typ- und zustandsabhängig (CCCI). `aktiv` ist der aktuelle
   Nießbrauch-Zustand: er entscheidet, ob Berechtigter und Frist mitkommen. Für
   das Formular übergibt der Aufrufer den Stand aus dem Schalter; für die Ansicht
   den gespeicherten Wert. Der Berechtigte bekommt die Eigentümer als Auswahl. */
function stammfelder(aktiv = objekt?.niessbrauch_aktiv) {
  let felder = istGrundstueck()
    ? STAMMFELDER.filter(f => !OHNE_BEIM_GRUNDSTUECK.has(f.k))
    : STAMMFELDER;
  felder = felder
    .filter(f => !(f.nurWennNiessbrauch && !aktiv))
    .map(f => f.k === 'niessbrauch_berechtigt'
      ? { ...f, werte: objektEigentuemer } : f);
  return felder;
}

const datum = s => s ? new Date(s).toLocaleDateString('de-DE') : '';

/* Datum als ISO-Tag ohne Umweg über UTC — `toISOString` verschiebt in
   Mitteleuropa auf den Vortag und macht aus dem 1. den 31. */
const isoDatum = d => `${d.getFullYear()}-${String(d.getMonth() + 1)
  .padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const tagDavor = iso => {
  const d = new Date(`${iso}T12:00:00`);
  d.setDate(d.getDate() - 1);
  return isoDatum(d);
};
const ersterNaechsterMonat = () => {
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + 1);
  return isoDatum(d);
};

/* Zinssatz deutsch: 2,75 statt 2.75 — zwei Nachkommastellen, mehr nie. */
const prozent = n => Number(n).toLocaleString('de-DE', { maximumFractionDigits: 2 });

/* Wer ist erreichbar: der Hauptkontakt am Mietverhältnis und die Bewohner,
   die eine eigene Mailadresse haben. */
function kontaktText(e) {
  const extra = (e.bewohner || []).filter(b => b.email).length;
  if (!e.email && !extra) return '✉ fehlt';
  const zahl = (e.email ? 1 : 0) + extra;
  return zahl === 1 ? '✉ hinterlegt' : `✉ ${zahl} Adressen`;
}

/* Die Restschuld, die heute gilt. Ohne Cent: zwischen zwei Jahresständen ist
   sie gerechnet, da wäre eine Angabe auf den Cent nur vorgetäuschte Schärfe. */
function restText(e) {
  const rest = e.restschuld_aktuell ?? e.restschuld;
  return rest ? `Rest ${eurVoll(rest)}` : '';
}

/* IBAN in Vierergruppen, egal wie sie gespeichert wurde: „DE42 7635 0000 …".
   Die letzte Gruppe darf kürzer sein. */
const ibanSchoen = s => String(s || '').replace(/\s+/g, '').toUpperCase()
  .replace(/(.{4})/g, '$1 ').trim();

function stammwert(f, o) {
  const v = o[f.k];
  if (f.typ === 'schalter' || f.typ === 'ja_nein') return v ? 'Ja' : 'Nein';
  if (v == null || v === '') return null;
  if (f.typ === 'date') return datum(v);
  if (f.iban) return ibanSchoen(v);
  // `voll`: ein Kaufpreis oder Verkehrswert ist ein runder Betrag — die zwei
  // Nachkommastellen sind dort nur Rauschen. Der Grundsteuer-Messbetrag (1,43 €)
  // trägt sie dagegen bewusst.
  if (f.geld) return f.voll ? eurVoll(v) : eur(v);
  if (f.einheit) return `${Number(v).toLocaleString('de-DE')} ${f.einheit}`;
  return String(v);
}

let objekt = null;
let daten = null;
/* Die Einheiten des Hauses — gebraucht von der Hausebene, vom Fokus und von
   den Blasen im Mietformular. Ein Grundstück hat keine. */
let einheiten = [];
/* Die Einheit, auf die gerade geschaut wird — null heisst: das ganze Haus. */
let fokus = null;
/* CCXXIX — Grundschulden auf diesem Objekt. Nur am Haus gepflegt, nicht in
   der Einheiten-Ansicht — wie die Kredite auch. */
let grundschulden = [];
/* CCCI — die Eigentümer-Namen dieses Objekts, für die Nießbrauch-Auswahl. */
let objektEigentuemer = [];
/* CCCIX — die geladenen Bereiche, damit der Zuordnen-Dialog die vorhandenen
   Einträge einer Rubrik anbieten kann. */
let bereicheDaten = {};

const flaecheText = f => `${Number(f).toLocaleString('de-DE',
  { maximumFractionDigits: 1 })} m²`;

/* Auf welche Einheit ein Mietverhältnis zeigt. Spiegelt `verteilung.bezuege`:
   ohne Angabe gehört es bei genau einer Einheit zu dieser — sonst nirgendwohin. */
const zuEinheit = m => (m.einheit || '').trim()
  || (einheiten.length === 1 ? einheiten[0].bezeichnung : '');

function bannerHtml(z) {
  if (!z || z.frist_tage == null) return '';
  const k = fristKlasse(z.frist_tage);
  const tage = z.frist_tage < 0
    ? `${Math.abs(z.frist_tage)} Tage über`
    : `noch ${z.frist_tage} Tage`;
  return `<div class="banner ${k}"><span class="d"></span>
      <span>Frist § 556 BGB · ${esc(z.label)}</span>
      <span class="days">${tage}</span></div>`;
}

/* Was nach einem Update noch nachzutragen wäre — ruhig, nie als Fehler. */
function nachpflegeHtml(n) {
  if (!n || !n.anzahl) return '';
  return `<div class="merker"><span class="hi">!</span><span class="ht">
      <span class="t">${n.anzahl === 1 ? 'Eine Angabe fehlt noch'
                                        : `${n.anzahl} Angaben fehlen noch`}</span>
      <span class="d">${esc(n.text)}. Nichts davon ist dringend — die
        Abrechnung läuft auch ohne. Ergänzen kannst du es jederzeit.</span>
    </span></div>`;
}

function kennzahlenHtml(v, jahresmiete, restschuld, guthaben) {
  if (!v) return '';
  // Die Restschuld kommt aus den fortgeschriebenen Krediten dieser Seite.
  // Stünde hier der eingetragene Stand, widerspräche die Kennzahl oben der
  // Kreditzeile weiter unten.
  const rest = restschuld != null ? Math.round(restschuld * 100) / 100
                                  : v.restschuld;
  // CXLIX — ein Bausparguthaben ist Guthaben, keine Schuld: es kommt zum
  // Eigenkapital hinzu, statt es zu drücken.
  const gespart = guthaben != null ? Math.round(guthaben * 100) / 100
                                   : (v.bauspar_guthaben || 0);
  const eigen = v.wert != null
    ? Math.round((v.wert - rest + gespart) * 100) / 100 : null;
  const zellen = [];
  if (v.wert != null)
    zellen.push(['kv', eur(v.wert), istGrundstueck() ? 'Grundstückswert'
                                                     : (v.wertquelle || 'Wert')]);
  if (rest) zellen.push(['kv neg', eur(rest), 'Restschuld']);
  if (gespart) zellen.push(['kv pos', eur(gespart), 'Bausparguthaben']);
  if (eigen != null)
    zellen.push([`kv ${eigen >= 0 ? 'pos' : 'neg'}`, eur(eigen), 'Eigenkapital']);
  if (jahresmiete) zellen.push(['kv', eur(jahresmiete),
    istGrundstueck() ? 'Pacht pro Jahr' : 'Miete pro Jahr']);
  if (!zellen.length) return '';
  return `<div class="kennzahlen">${zellen.map(([k, w, l]) =>
    `<div class="kennzahl"><span class="${k}">${w}</span>
       <span class="kl">${esc(l)}</span></div>`).join('')}</div>`;
}

/* CCLXVII — ein fachliches Label in der Übersicht trägt denselben ?-Platzhalter
   wie im Formular. `installHilfe(inhalt)` macht nach dem Rendern ein Icon
   daraus. Triviale Zeilen bekommen kein `lex` und bleiben schmucklos. */
const paarLabel = (label, lex) => `${esc(label)}${
  lex ? ` <span data-hilfe="${esc(lex)}"></span>` : ''}`;

function paarZeile(label, wert, { abgeleitet = false, lang = false,
                                  lex = null } = {}) {
  // `lang` gilt für die Beschriftung, nicht nur den Wert — ein langes Label
  // wie „Übernommene AfA-Bemessung (vom Vorbesitzer)" drückt die Wertspalte
  // sonst auf null Breite, und „nicht erfasst" bricht Buchstabe für
  // Buchstabe um (Fund bei CCXXXV). Deshalb gilt die gestapelte Form auch,
  // wenn noch kein Wert erfasst ist.
  return `<div class="paar${lang ? ' lang' : ''}">
    <span class="pl">${paarLabel(label, lex)}</span>
    <span class="pv${wert ? (abgeleitet ? ' abgeleitet' : '') : ' leer'}"
      >${wert ? esc(wert) : 'nicht erfasst'}</span></div>`;
}

/* Eine gerechnete Zeile mit Herkunftsangabe — „Wohnfläche · 205 m² · aus 5
   Einheiten". Die Herkunft steht ruhig unter dem Wert. */
function paarAbgeleitet(label, wert, quelle = null, lex = null) {
  return `<div class="paar">
    <span class="pl">${paarLabel(label, lex)}</span>
    <span class="pv ${wert ? 'abgeleitet' : 'leer'}">${wert ? esc(wert)
      : 'nicht erfasst'}${quelle ? `<span class="pq">${esc(quelle)}</span>`
                                 : ''}</span></div>`;
}

/* CCLIV — Wohnfläche und Stellplätze eines Objekts kommen aus den Einheiten,
   nicht mehr aus einer eigenen Objektangabe. Bevorzugt die vom Backend
   gelieferten Summen (Single Source of Truth); fehlen sie (noch nicht
   deployt), summiert es die geladenen Einheiten selbst. */
function flaechenSummen() {
  if (daten && daten.wohnflaeche_summe != null) {
    return { wohn: daten.wohnflaeche_summe,
             stell: daten.stellplaetze_summe || 0,
             mit: daten.einheiten_mit_flaeche || 0 };
  }
  const mitFlaeche = einheiten.filter(e => e.flaeche);
  return {
    wohn: mitFlaeche.reduce((sum, e) => sum + (e.flaeche || 0), 0),
    stell: einheiten.reduce((sum, e) => sum + (e.stellplaetze || 0), 0),
    mit: mitFlaeche.length,
  };
}

/* Die gerechneten Flächenzeilen, die im Stammdatenblock die Stelle der
   früheren manuellen „Gesamtfläche" einnehmen. */
function wohnflaecheRows(o, s) {
  const anzahl = einheiten.length;
  const einheitWort = n => `${n} Einheit${n === 1 ? '' : 'en'}`;
  const rows = [];
  if (s.mit) {
    const quelle = s.mit === anzahl ? `aus ${einheitWort(anzahl)}`
                                    : `aus ${s.mit} von ${einheitWort(anzahl)}`;
    rows.push(paarAbgeleitet('Wohnfläche', flaecheText(s.wohn), quelle,
                             'wohnflaeche'));
  } else if (o.flaeche) {
    // Noch keine Einheitenfläche erfasst — dann ist die manuelle Angabe alles,
    // was es gibt, und steht schlicht als Wohnfläche da.
    rows.push(paarAbgeleitet('Wohnfläche', flaecheText(o.flaeche),
                             'manuell — noch keine Einheitenfläche erfasst',
                             'wohnflaeche'));
  } else {
    rows.push(paarAbgeleitet('Wohnfläche', null,
      anzahl ? 'in den Einheiten noch keine Fläche erfasst'
             : 'noch keine Einheit erfasst', 'wohnflaeche'));
  }
  if (s.stell) {
    rows.push(paarAbgeleitet('Stellplätze', String(s.stell),
                             `aus ${einheitWort(anzahl)}`, 'stellplatz'));
  }
  return rows;
}

/* Dezenter Hinweis, wenn die manuell geführte Wohnfläche von der aus den
   Einheiten berechneten abweicht. */
function flaecheWarnung(manuell, s) {
  if (!manuell || !s.mit || Math.abs(manuell - s.wohn) < 0.05) return '';
  return `<div class="fussnote warn">Manuell eingetragene Wohnfläche
    ${esc(flaecheText(manuell))} weicht von der Summe der Einheiten
    (${esc(flaecheText(s.wohn))}) ab. Maßgeblich ist die aus den Einheiten
    berechnete Fläche.</div>`;
}

function stammHtml(o) {
  const s = flaechenSummen();
  const zeilen = [];
  for (const f of stammfelder()) {
    // Die frühere manuelle Fläche wird zu den gerechneten Zeilen aus den
    // Einheiten; beim Grundstück kommt `flaeche` gar nicht erst vor.
    if (f.k === 'flaeche') { zeilen.push(...wohnflaecheRows(o, s)); continue; }
    zeilen.push(paarZeile(f.l, stammwert(f, o), { lang: f.lang, lex: f.lex }));
  }
  return `<div class="sekopf"><span class="seikon">${kostenIcon('Haus')}</span><h2 class="sec">Stammdaten</h2>
      <button data-stamm="1">Bearbeiten</button></div>
    <div class="paare">${zeilen.join('')}</div>
    ${flaecheWarnung(o.flaeche, s)}`;
}

/* Preis je m² und Grundsteuer werden gerechnet, nicht gepflegt: sie stünden
   sonst irgendwann im Widerspruch zu den Zahlen, aus denen sie stammen. */
function grundstueckHtml(o, pachtJahr = 0) {
  if (!istGrundstueck()) return '';
  const zeilen = GRUNDFELDER
    .map(f => paarZeile(f.l, stammwert(f, o), { lang: f.lang })).join('');
  const abgeleitet = [];
  // Grundstückswert aus dem geschätzten m²-Preis × Fläche (CCXCVII).
  if (o.grundstueck_m2_preis && o.grundstueck_flaeche) {
    abgeleitet.push(['Grundstückswert (errechnet)',
      eur(o.grundstueck_m2_preis * o.grundstueck_flaeche)]);
  } else if (o.verkehrswert) {
    abgeleitet.push(['Grundstückswert', eur(o.verkehrswert)]);
  }
  // Grundsteuer als Rechenkette in der Reihenfolge, in der sie entsteht (CCXCVI):
  // Grundsteuerwert × Steuermesszahl = Steuermessbetrag × Hebesatz = Jahr.
  if (o.grundsteuerwert && o.grundsteuer_messbetrag) {
    const promille = o.grundsteuer_messbetrag / o.grundsteuerwert * 1000;
    abgeleitet.push(['Steuermesszahl (rechnerisch)',
      `${promille.toLocaleString('de-DE', { maximumFractionDigits: 2 })} ‰`]);
  }
  const grundsteuerJahr = (o.grundsteuer_messbetrag && o.grundsteuer_hebesatz)
    ? o.grundsteuer_messbetrag * o.grundsteuer_hebesatz / 100 : 0;
  if (grundsteuerJahr) {
    abgeleitet.push([`Grundsteuer im Jahr (× Hebesatz ${o.grundsteuer_hebesatz} %)`,
      eur(grundsteuerJahr)]);
  }
  // CCCIII — statt eines eigenen NK-Zeitraums die kleine Rechnung direkt:
  // NK-Höhe = Grundsteuer/Jahr, Ertrag = Pacht/Jahr − Grundsteuer/Jahr.
  const ertrag = [];
  if (pachtJahr) ertrag.push(['Pacht im Jahr', eur(pachtJahr)]);
  if (grundsteuerJahr) {
    ertrag.push(['Nebenkosten im Jahr (Grundsteuer)', eur(grundsteuerJahr)]);
  }
  // Ertrag nur, wenn es Pacht gibt — ohne Einnahme ist die Grundsteuer bloß
  // eine Ausgabe, kein „Ertrag".
  if (pachtJahr) {
    ertrag.push(['Ertrag im Jahr', eur(pachtJahr - grundsteuerJahr)]);
  }
  const kette = (o.grundsteuerwert || o.grundsteuer_messbetrag)
    ? `<div class="fussnote">So entsteht die Grundsteuer: <strong>Grundsteuerwert</strong>
       (vom Finanzamt) × Steuermesszahl = <strong>Steuermessbetrag</strong> (vom
       Finanzamt) × <strong>Hebesatz</strong> (von der Gemeinde) =
       Grundsteuer&nbsp;im&nbsp;Jahr. Der Hebesatz steht nicht auf dem
       Finanzamts-Bescheid, sondern auf dem Grundsteuerbescheid der Stadt.</div>`
    : '';
  const ertragBlock = ertrag.length
    ? `<div class="sekopf"><span class="seikon" style="color:var(--pos)">${kostenIcon('Miete')}</span><h2 class="sec">Pacht &amp; Ertrag</h2></div>
       <div class="paare">${ertrag.map(([l, w], i) =>
         paarZeile(l, w, { abgeleitet: i < ertrag.length - 1 })).join('')}</div>
       <div class="fussnote">Beim verpachteten Grundstück ist die Grundsteuer die
         einzige Nebenkostenposition — sie wird auf den Pächter umgelegt. Der
         Ertrag ist die Pacht abzüglich der Grundsteuer.</div>`
    : '';
  return `<div class="sekopf"><span class="seikon" style="color:var(--teal-d)">${kostenIcon('Grundstück')}</span><h2 class="sec">Grundstück</h2>
      <button data-grund="1">Bearbeiten</button></div>
    <div class="paare">${zeilen}${
      abgeleitet.map(([l, w]) => paarZeile(l, w, { abgeleitet: true })).join('')}</div>
    ${kette}
    ${ertragBlock}`;
}

/* CCVIII — die WEG-Ebene. Beim Grundstück gibt es sie nicht (keine Mieter, keine
   Hausverwaltung). Ist das Objekt keine WEG, steht hier nur der Hinweis, wie man
   es einschaltet; ist es eine, stehen Hausgeld, Rücklagenzuführung und
   Verwalter. Der Wirtschaftsplan hat vorerst keinen eigenen Datensatz — Platz
   dafür schafft die Notiz am Verwalter und die Fussnote. */
function wegHtml(o) {
  if (istGrundstueck()) return '';
  if (!o.weg) {
    return `<div class="sekopf"><h2 class="sec">WEG-Ebene</h2>
        <button data-weg="1">Einrichten</button></div>
      <div class="fussnote">Ist diese Wohnung Teil einer
        Wohnungseigentümergemeinschaft, verteilt die Hausverwaltung die
        Nebenkosten. Schalte die WEG-Ebene ein: du trägst dann die fertigen
        Werte je Mieter direkt ein und pflegst hier Hausgeld und
        Wirtschaftsplan.</div>`;
  }
  const zeilen = WEGFELDER
    .filter(f => f.k !== 'weg')
    // Der Verwaltername ist oft lang — als eigene Zeilenbreite statt eines
    // Bruchs mitten im Wort in der schmalen rechten Spalte.
    .map(f => paarZeile(f.l, stammwert(f, o),
                        { lang: f.k === 'weg_verwalter' })).join('');
  const jahr = o.hausgeld_monatlich
    ? paarZeile('Hausgeld im Jahr', eurVoll(o.hausgeld_monatlich * 12),
                { abgeleitet: true })
    : '';
  return `<div class="sekopf"><h2 class="sec">WEG-Ebene</h2>
      <button data-weg="1">Bearbeiten</button></div>
    <div class="paare">${zeilen}${jahr}</div>
    <div class="fussnote">Die Hausverwaltung verteilt die Nebenkosten auf die
      Mieter — in der Abrechnung trägst du die Werte vom Zettel je Mieter direkt
      ein, ImmoCalc verteilt sie nicht selbst. Das Hausgeld zählt zu deinen
      Eigentümerkosten und steht in der Wertentwicklung.</div>`;
}

/* CCLXXVIII — welcher Bereich welchen Entwurfstyp am Backend hat. Nur diese
   Bereiche können vorläufige (orange) Einträge tragen; alles andere ignoriert
   `vorlaeufig` einfach. */
const ENTWURF_TYP = { mieten: 'miete', versicherungen: 'versicherung',
                      kredite: 'kredit', notarvertraege: 'notarvertrag',
                      zahlungen: 'zahlung', erwerbskosten: 'zahlung' };
// Rubrik (Frontend) → Eintragstyp (Backend `an_typ`), inkl. Nebenkosten. Die
// Detailansicht (CCCXIII) holt darüber die Belege eines Eintrags.
// Erwerbsnebenkosten sind Zahlungen — dieselbe Typkennung wie „zahlungen".
const AN_TYP = { ...ENTWURF_TYP, nebenkosten: 'kostenposition',
                 erwerbskosten: 'zahlung' };
// CCCXXIV — zwischen welchen Rubriken sich ein Eintrag umklassifizieren lässt
// (der „Erwerb/Steuer"-Cluster). Der Wert ist zugleich der Bereich und das
// Backend-Ziel.
const UMKLASS_ZIELE = [
  { wert: 'erwerbskosten', titel: 'Einmalige Erwerbsnebenkosten' },
  { wert: 'zahlungen', titel: 'Finanzamt' },
  { wert: 'notarvertraege', titel: 'Notarverträge' },
];
const kannUmklassifizieren = b => UMKLASS_ZIELE.some(z => z.wert === b);

/* Die schlichte Listenzeile — der gemeinsame Kern von normaler und
   vorläufiger Darstellung. */
function eintragZeile(cfg, bereich, e, imFokus, { mitDel = true } = {}) {
  const marke = cfg.chip ? cfg.chip(e) : null;
  const beschreibung = cfg.detail(e, imFokus);
  return `<div class="eintrag klick" data-edit="${bereich}:${e.id}"
      ${cfg.matt && cfg.matt(e) ? 'style="opacity:.62"' : ''}>
    <span class="sym">${kostenIcon(cfg.ikon)}</span>
    <span class="et">
      <span class="en">${esc(cfg.name(e))}${marke
        ? ` <span class="chip ${marke[0]}">${esc(marke[1])}</span>` : ''}</span>
      ${beschreibung ? `<span class="ed">${esc(beschreibung)}</span>` : ''}
    </span>
    <span class="ew">${cfg.wert(e)}</span>
    ${mitDel
      ? `<button class="del" data-del="${bereich}:${e.id}" aria-label="löschen">×</button>`
      : ''}
  </div>`;
}

/* Ein vorläufiger Datensatz: derselbe Kern, aber in Amber gerahmt und mit
   Fußleiste — „Entwurf aus Beleg", optional der Belegblick, und die zwei
   Entscheidungen Bestätigen / Zurück zum Prüfen. */
function entwurfZeile(cfg, bereich, e, imFokus) {
  const typ = ENTWURF_TYP[bereich];
  const beleg = e.quelle_dokument_id
    ? `<button class="beleg" data-beleg="${e.quelle_dokument_id}">aus Beleg</button>`
    : '';
  return `<div class="entwurf">
    ${eintragZeile(cfg, bereich, e, imFokus, { mitDel: false })}
    <div class="entfuss">
      <span class="marke"><span class="pt"></span>Entwurf aus Beleg</span>
      ${beleg}
      <span class="luecke"></span>
      <button class="ea ok" data-ok="${typ}:${e.id}">✓ Bestätigen</button>
      <button class="ea zurueck" data-zurueck="${typ}:${e.id}">↩ Zurück zum Prüfen</button>
    </div>
  </div>`;
}

/* CCCIV — jede Rubrik trägt ihr Symbol in der Überschrift, in der Farbe der
   Rubrik. Dieselbe Zuordnung nutzt der Dokumentenbaum, damit oben und unten
   dieselbe Sprache gesprochen wird. */
const RUBRIKFARBE = {
  notarvertraege: 'var(--teal)', zahlungen: 'var(--amber)',
  mieten: 'var(--pos)', versicherungen: 'var(--soft)',
  kredite: 'var(--neg)', grundstueck: 'var(--teal-d)',
  erwerbskosten: 'var(--amber)',
};
const sekopfHtml = (titel, ikon = '', knopf = '', farbe = '') =>
  `<div class="sekopf">${ikon
      ? `<span class="seikon"${farbe ? ` style="color:${farbe}"` : ''}
         >${kostenIcon(ikon)}</span>` : ''}
    <h2 class="sec">${esc(titel)}</h2>${knopf}</div>`;

/* CCCXII — Wiederkehrendes staffeln statt stapeln: zehn Grundsteuerbescheide
   sind zehn Jahre derselben Sache, nicht zehn Sachen. Sie stehen deshalb als
   EINE Zeile mit einer Jahresstaffel darunter; jedes Jahr bleibt einzeln
   anklickbar. Entwürfe (orange) bleiben eigenständig — sie wollen erst
   bestätigt werden. */
function staffelHtml(cfg, bereich, art, gruppe) {
  const nachJahr = [...gruppe].sort((a, b) => (b.jahr || 0) - (a.jahr || 0));
  const neuestes = nachJahr[0];
  const jahre = nachJahr.map(e => `
    <button class="stjahr" data-edit="${bereich}:${e.id}"
            title="${esc(cfg.name(e))} ${e.jahr || ''} öffnen">
      <span class="sj">${e.jahr || '—'}</span>
      <span class="sb">${eur(e.betrag || 0)}</span></button>`).join('');
  return `<div class="eintrag staffel">
      <span class="sym">${kostenIcon(art)}</span>
      <span class="et">
        <span class="en">${esc(art)}
          <span class="stz">${gruppe.length} Jahre</span></span>
        <span class="ed">zuletzt ${neuestes.jahr || '—'} · ${
          esc(cfg.detail ? cfg.detail(neuestes) : '')}</span>
        <span class="staffel-jahre">${jahre}</span>
      </span>
      <span class="ew">${cfg.wert ? cfg.wert(neuestes) : eur(neuestes.betrag || 0)}</span>
    </div>`;
}

function abschnitt(bereich, eintraege, { imFokus = false, kopf = '',
                                        vorspann = '' } = {}) {
  const cfg = cfgFuer(bereich);
  const istEntwurf = e => e && e.vorlaeufig === true && ENTWURF_TYP[bereich];
  let zeilen;
  if (!eintraege.length) {
    zeilen = `<div class="leerzeile">Noch nichts erfasst</div>`;
  } else if (bereich === 'zahlungen') {
    // Nach Art gruppieren; nur was mehrfach vorkommt, wird gestaffelt.
    const gruppen = new Map();
    const einzeln = [];
    for (const e of eintraege) {
      if (istEntwurf(e)) { einzeln.push(e); continue; }
      const art = (e.art || 'Zahlung').trim();
      if (!gruppen.has(art)) gruppen.set(art, []);
      gruppen.get(art).push(e);
    }
    const teile = [];
    for (const [art, gruppe] of gruppen) {
      teile.push(gruppe.length > 1
        ? staffelHtml(cfg, bereich, art, gruppe)
        : eintragZeile(cfg, bereich, gruppe[0], imFokus));
    }
    for (const e of einzeln) teile.push(entwurfZeile(cfg, bereich, e, imFokus));
    zeilen = teile.join('');
  } else {
    zeilen = eintraege.map(e => istEntwurf(e)
      ? entwurfZeile(cfg, bereich, e, imFokus)
      : eintragZeile(cfg, bereich, e, imFokus)).join('');
  }

  return `${sekopfHtml(kopf || cfg.titel, cfg.ikon, '', RUBRIKFARBE[bereich])}
    ${vorspann}
    <div class="liste">${zeilen}</div>
    <button class="add" data-add="${bereich}">＋ ${esc(cfg.einzahl)} hinzufügen</button>`;
}

/* ---- CXLI/CLXVIII: die Einheiten des Hauses und ihr Fokus ---------------- */

// CCCXXVII/CCCXXVIII — die für Miete und Verteilung maßgebliche Fläche einer
// Einheit: die Wohn-/Nutzfläche plus anteilig mitgenutzte Gemeinschaftsflächen
// (Fläche ÷ Zahl der Nutzer). Solange keine Gemeinschaftsflächen erfasst sind,
// ist es schlicht die Wohnfläche — der Bestand bleibt damit unverändert.
function effektiveFlaeche(e) {
  const wohn = Number(e.flaeche) || 0;
  const gemein = (e.gemeinflaechen || []).reduce((s, g) => {
    const f = Number(g.flaeche) || 0;
    const p = Number(g.personen) || 0;
    return s + (p > 0 ? f / p : 0);
  }, 0);
  return wohn + gemein;
}

// Kaltmiete je m² (monatlich) — null, wenn Fläche oder Miete fehlen (CCCXXVIII).
function qmMiete(e) {
  const f = effektiveFlaeche(e);
  return e.vermietet && e.kaltmiete && f > 0 ? e.kaltmiete / f : null;
}

function einheitDetail(e) {
  return [e.nutzungsart,
          e.flaeche ? flaecheText(e.flaeche) : '',
          e.stellplaetze ? (e.stellplaetze > 1 ? `${e.stellplaetze} Stellplätze`
                                               : '1 Stellplatz') : '',
          e.mieter].filter(Boolean).join(' · ');
}

/* Die Zeile führt eine Ebene tiefer — angetippt wird sie ganz, nicht ein
   Pfeilchen am Rand. */
function einheitenHtml() {
  if (istGrundstueck()) return '';
  const zeilen = einheiten.length
    ? einheiten.map(e => `<div class="eintrag klick" data-einheit="${e.id}">
        <span class="sym">${kostenIcon('Miete')}</span>
        <span class="et">
          <span class="en">${esc(e.bezeichnung)}${e.vermietet ? ''
            : ' <span class="chip amber">frei</span>'}${
            e.nk_abrechnung === false
              ? ' <span class="chip">nicht in NK</span>' : ''}</span>
          ${einheitDetail(e) ? `<span class="ed">${esc(einheitDetail(e))}</span>` : ''}
        </span>
        <span class="ew">${e.vermietet && e.kaltmiete
          ? `${eur(e.kaltmiete)} / M${qmMiete(e)
              ? `<span class="ew-sub">${eur(qmMiete(e))} / m²</span>` : ''}`
          : ''}</span>
        <button class="del" data-einheit-weg="${e.id}" aria-label="löschen">×</button>
      </div>`).join('')
    : `<div class="leerzeile">Noch keine Einheit erfasst</div>`;

  return `<div class="sekopf"><h2 class="sec">Einheiten</h2></div>
    <div class="liste">${zeilen}</div>
    <button class="add" data-einheit-neu="1">＋ Einheit hinzufügen</button>
    ${einheiten.length ? `<div class="fussnote">Eine Einheit antippen: dort
      stehen Mieter, Kontakt und Nebenkosten dieser Wohnung. Alles Übergeordnete
      — Stammdaten, Eigentümer, Kredite, Versicherungen, Steuer und Ablage —
      bleibt hier am Haus.</div>` : ''}`;
}

function hausWegHtml() {
  return `<button class="hausweg" data-haus="1">
      <span class="pfeil" aria-hidden="true">‹</span>
      <span class="ic">${logoSvg(objekt.typ)}</span>
      <span class="ht"><span class="hl">Zurück zum Haus</span>
        <span class="hn">${esc(objekt.name)}</span></span>
    </button>`;
}

/* Die Einheit selbst — ohne ihre Bezeichnung: die steht schon in der Kopfzeile. */
function einheitStammHtml(e) {
  // Der NK-Schalter (CXCIII) ist ein bool — als „true"-Zeile stünde er nur im
  // Weg. Die Teilnahme ist der Normalfall und bleibt still; nur der Ausschluss
  // wird als eigener Hinweis gezeigt.
  const zeilen = EINHEITFELDER
    .filter(f => f.k !== 'bezeichnung' && f.k !== 'nk_abrechnung')
    .map(f => paarZeile(f.l, stammwert(f, e), { lex: f.lex })).join('');
  const aus = e.nk_abrechnung === false
    ? `<div class="merker"><span class="hi">i</span><span class="ht">
         <span class="t">Nicht Teil der Nebenkostenabrechnung</span>
         <span class="d">Diese Einheit zählt in keinem Verteilungsschlüssel mit
           — selbstgenutzt, separat abgerechnet oder mit eigenem Zähler.
           „Bearbeiten" schaltet die Teilnahme wieder ein.</span>
       </span></div>` : '';
  return `<div class="sekopf"><h2 class="sec">Einheit</h2>
      <button data-einheit-edit="${e.id}">Bearbeiten</button></div>
    <div class="paare">${zeilen}</div>${aus}`;
}

/* Im Fokus zählt, was diese Wohnung einbringt — Wert und Restschuld gehören
   dem ganzen Haus und stehen deshalb nur dort. Ein Verkehrswert je Einheit
   liesse sich heute nirgends pflegen. */
function einheitKennzahlen(e, eigene) {
  const laufende = eigene.filter(m => !m.beendet && !m.geplant);
  const monat = (m, feld) => (m[feld] || 0) * proJahr(m.turnus) / 12;
  const kalt = laufende.reduce((s, m) => s + monat(m, 'kaltmiete')
    + monat(m, 'stellplatz') + monat(m, 'sonstige'), 0);
  const nk = laufende.reduce((s, m) => s + monat(m, 'nebenkosten_vz'), 0);
  const zellen = [];
  if (kalt) zellen.push(['kv', eur(kalt), 'Miete / Monat']);
  if (nk) zellen.push(['kv', eur(nk), 'NK-Vorauszahlung']);
  if (kalt && effektiveFlaeche(e)) zellen.push(['kv', eur(kalt / effektiveFlaeche(e)), 'je m²']);
  if (!zellen.length) return '';
  return `<div class="kennzahlen">${zellen.map(([k, w, l]) =>
    `<div class="kennzahl"><span class="${k}">${w}</span>
       <span class="kl">${esc(l)}</span></div>`).join('')}</div>`;
}

function eigentuemerHtml(stand) {
  if (!stand) return '';
  // CLXI — ein Anteil zeigt aufs ganze Haus oder auf eine Einheit. Die Einheit
  // steht als Auszeichnung am Namen, damit „mir gehört Wohnung 2" sichtbar ist.
  // Bestandszeilen kennen nur `tausendstel`; neue tragen `promille`.
  const zeilen = stand.anteile.length
    ? stand.anteile.map(a => `<div class="eintrag">
        <span class="sym">${kostenIcon('Eigentümer')}</span>
        <span class="et"><span class="en">${esc(a.name)}${a.einheit
            ? ` <span class="chip teal">${esc(a.einheit)}</span>` : ''}</span>
          <span class="ed">${esc([a.einheit ? '' : a.rolle, a.notiz]
            .filter(Boolean).join(' · '))}</span>
        </span>
        <span class="ew">${promille(a.promille ?? a.tausendstel ?? 0)}</span>
        <button class="del" data-anteil="${a.id}" aria-label="entfernen">×</button>
      </div>`).join('')
    : `<div class="leerzeile">Noch kein Eigentümer zugeordnet</div>`;

  // Warnung analog zu `parteien_ohne_einheit`: erst das Haus (der „Rest"),
  // dann jede Einheit, deren Anteile nicht aufgehen.
  const probleme = [];
  if (stand.objekt_noetig && stand.frei !== 0) {
    probleme.push(stand.frei > 0
      ? `Am Haus fehlen noch ${promille(stand.frei)}`
      : `Am Haus sind ${promille(-stand.frei)} zu viel verteilt`);
  } else if (!stand.objekt_noetig && stand.vergeben > 0) {
    probleme.push(`${promille(stand.vergeben)} am Haus, obwohl schon jede Einheit `
      + `einzeln zugeordnet ist`);
  }
  for (const es of (stand.einheiten_stand || [])) {
    if (es.stimmig) continue;
    probleme.push(es.unbekannt
      ? `„${es.einheit}" gibt es als Einheit nicht (mehr)`
      : (es.frei > 0
          ? `In „${es.einheit}" fehlen noch ${promille(es.frei)}`
          : `In „${es.einheit}" sind ${promille(-es.frei)} zu viel verteilt`));
  }
  const rest = !stand.stimmig
    ? `<div class="merker"><span class="hi">!</span><span class="ht">
         <span class="t">Zurechnung geht noch nicht auf</span>
         <span class="d">${probleme.length
            ? esc(probleme.join(' · ')) + '. '
            : ''}Je Haus und je Einheit sollten 1000 ‰ verteilt sein. Eine
           Nachkommastelle genügt — 333,3 dreimal gilt als vollständig.
           Einheit-Anteile haben Vorrang für ihre Einheit, der Haus-Anteil
           deckt den Rest.</span>
       </span></div>` : '';

  // CCCXXII — „Zuordnen" nur, wenn es überhaupt noch freie ‰ gibt. Ist alles
  // verteilt, wäre der Knopf eine Sackgasse (jede Zuweisung überbucht) —
  // stattdessen ein ruhiger Hinweis. Wird später etwas frei, kommt er zurück.
  const freiObjekt = stand.objekt_noetig === false ? 0 : (stand.frei || 0);
  const freiEinheit = (stand.einheiten_stand || [])
    .reduce((m, es) => Math.max(m, es.frei || 0), 0);
  const platz = Math.max(freiObjekt, freiEinheit) > 0.05;
  const kopfKnopf = platz
    ? `<button data-anteil-neu="1">Zuordnen</button>`
    : `<span class="voll-hinweis" title="Erst einen Anteil verkleinern oder entfernen, dann wird wieder etwas frei">Alle 1000 ‰ verteilt</span>`;

  return `<div class="sekopf"><span class="seikon">${kostenIcon('Eigentümer')}</span><h2 class="sec">Eigentümer</h2>
      ${kopfKnopf}</div>
    <div class="liste">${zeilen}</div>${rest}`;
}

async function laden() {
  if (!slug) {
    inhalt.innerHTML = `<div class="empty"><div class="big">Kein Objekt gewählt</div>
      <p>Zurück zur Übersicht und eine Immobilie antippen.</p></div>`;
    return;
  }
  let det;
  try {
    det = await api(`/objekte/${encodeURIComponent(slug)}`);
  } catch (fehler) {
    inhalt.innerHTML = `<div class="empty"><div class="big">Objekt nicht gefunden</div>
      <p>${esc(String(fehler.message || 'Die Daten konnten nicht geladen werden.'))}</p></div>`;
    return;
  }

  // Die Nebenabrufe duerfen einzeln danebengehen — dass eine Versicherungsliste
  // hakt, heisst nicht, dass es das Objekt nicht gibt. Fehlende Bereiche bleiben
  // leer, gemeldet wird einmal am Ende.
  const luecken = [];
  const zweig = async (was, ruf, ersatz) => {
    try { return await ruf(); }
    catch (fehler) { luecken.push(`${was}: ${fehler.message || fehler}`); return ersatz; }
  };
  const [bereiche, anteile, vermoegen, einheitenRoh, grundschuldenRoh] = await Promise.all([
    Promise.all(Object.keys(BEREICHE).map(async b =>
      [b, await zweig(BEREICHE[b].titel,
                      () => api(`/objekte/${encodeURIComponent(slug)}/${b}`), [])]))
      .then(Object.fromEntries),
    zweig('Eigentümer', () => api(`/objekte/${encodeURIComponent(slug)}/anteile`), null),
    zweig('Vermögen',
          async () => (await api('/vermoegen')).objekte.find(z => z.slug === slug),
          null),
    zweig('Einheiten',
          () => api(`/objekte/${encodeURIComponent(slug)}/einheiten`), []),
    zweig('Grundschulden',
          () => api(`/objekte/${encodeURIComponent(slug)}/grundschulden`), []),
  ]);
  if (luecken.length) melde(`Nicht alles konnte geladen werden — ${luecken[0]}`, 'neg');

  objekt = det.objekt;
  daten = det;
  // Ein Grundstück hat keine Einheiten — dort darf die zweite Ebene gar nicht
  // erst auftauchen, auch nicht über einen alten Link.
  einheiten = istGrundstueck() ? [] : (einheitenRoh || []);
  grundschulden = grundschuldenRoh || [];
  bereicheDaten = bereiche || {};
  objektEigentuemer = [...new Set((anteile?.anteile || [])
    .map(a => a.name).filter(Boolean))];
  fokus = fokusWunsch
    ? (einheiten.find(e => String(e.id) === String(fokusWunsch)) || null)
    : null;
  if (fokusWunsch && !fokus) {
    melde('Diese Einheit gibt es nicht mehr — hier steht das ganze Haus.', '');
  }

  titel.textContent = fokus ? fokus.bezeichnung : objekt.name;
  document.getElementById('barlogo').innerHTML = logoSvg(objekt.typ);
  // Der Ort enthaelt oft schon die Einheitenzahl ("Mixed-Use · 7 Einheiten") —
  // dann nicht zusaetzlich zaehlen, sonst steht es doppelt und die Zeile bricht um.
  const ortText = (objekt.ort || objekt.strasse || '').trim();
  if (fokus) {
    // Im Fokus beschreibt die Unterzeile die Einheit. Das Haus steht in der
    // Karte darunter — hier stünde es ein zweites Mal.
    sub.textContent = [fokus.nutzungsart,
                       fokus.flaeche ? flaecheText(fokus.flaeche) : '',
                       fokus.mieter].filter(Boolean).join(' · ') || 'Einheit';
  } else if (istGrundstueck()) {
    // Einheiten gibt es hier nicht; was das Grundstück ausmacht, ist seine
    // Fläche und wofür sie genutzt wird.
    const flaeche = objekt.grundstueck_flaeche
      ? `${Number(objekt.grundstueck_flaeche).toLocaleString('de-DE')} m²` : '';
    sub.textContent = [ortText, objekt.grundstueck_nutzungsart, flaeche]
      .filter(Boolean).join(' · ') || 'Grundstück';
  } else {
    sub.textContent = /einheit|wohnung/i.test(ortText) || !ortText
      ? (ortText || `${det.einheiten.length} Einheit${det.einheiten.length === 1 ? '' : 'en'}`)
      : `${ortText} · ${det.einheiten.length} Einheit${det.einheiten.length === 1 ? '' : 'en'}`;
  }

  const laufend = det.zeitraeume.find(z => z.status === 'in Arbeit');
  const zr = det.zeitraeume.length
    ? det.zeitraeume.map(z => {
        // Beim Grundstück gilt keine § 556-Mietrechtsfrist — dort steht ein
        // neutraler Zustand statt „noch X Tage" (CCC).
        const chip = z.status !== 'in Arbeit'
          ? '<span class="chip">abgeschlossen</span>'
          : istGrundstueck()
            ? '<span class="chip">in Arbeit</span>'
            : `<span class="chip ${fristKlasse(z.frist_tage)}">${esc(fristText(z.frist_tage) || 'in Arbeit')}</span>`;
        return `<button class="eintrag klick" data-zeitraum="${z.id}"
                        style="cursor:pointer">
            <span class="et">
              <span class="en">${esc(z.label)}</span>
              <span class="ed">${esc(z.typ)}</span></span>${chip}
            <span class="ew" style="color:var(--soft);font-family:var(--body)">›</span>
          </button>`;
      }).join('')
    : `<div class="leerzeile">Noch kein Abrechnungszeitraum</div>`;

  // Was heute läuft: beendete Stände zählen nicht, geplante noch nicht.
  const jahresmiete = (bereiche.mieten || [])
    .filter(m => !m.beendet && !m.geplant)
    .reduce((s, m) => s + (m.kaltmiete || 0) * proJahr(m.turnus), 0);

  // Schulden und Guthaben getrennt: `restschuld_aktuell` ist beim
  // Bausparvertrag 0 und `guthaben_aktuell` beim Darlehen — die API trennt
  // beides, damit hier nichts zusammenfällt, was gegensätzlich ist.
  const restschuld = (bereiche.kredite || []).reduce(
    (s, k) => s + (k.restschuld_aktuell ?? k.restschuld ?? 0), 0);
  const guthaben = (bereiche.kredite || []).reduce(
    (s, k) => s + (k.guthaben_aktuell || 0), 0);

  // Ein Grundstück rechnet keine Mieter-Nebenkosten ab: § 556-Frist und
  // Abrechnungszeiträume gehören nicht hierher. Die Grundsteuer ist so gering,
  // dass sie ohne eigenen Zeitraum direkt im Grundstücksblock verrechnet wird
  // (CCCIII, ersetzt CCC).
  const zeitraumBlock = istGrundstueck() ? '' : `
    <div class="sekopf"><h2 class="sec">Abrechnungszeiträume</h2>
      ${fokus ? '' : '<button data-zeitraum-neu="1">Anlegen</button>'}</div>
    <div class="liste">${zr}</div>
    ${fokus ? `<div class="fussnote">Abgerechnet wird immer das ganze Haus;
      im Zeitraum steht, was davon auf diese Einheit entfällt.</div>` : ''}`;

  if (fokus) {
    // CLXVIII — im Fokus zählen die Mieterthemen. Stammdaten, Eigentümer,
    // Kredite, Versicherungen, Steuer und Ablage gehören dem Haus und werden
    // hier bewusst nicht wiederholt.
    const eigene = (bereiche.mieten || [])
      .filter(m => zuEinheit(m) === fokus.bezeichnung);
    inhalt.innerHTML = `
      ${hausWegHtml()}
      ${bannerHtml(laufend)}
      ${einheitKennzahlen(fokus, eigene)}
      ${einheitStammHtml(fokus)}
      ${abschnitt('mieten', eigene, { imFokus: true })}
      ${zeitraumBlock}`;
    // Die ?-Icons an Wohnfläche, Terrasse, Nebenfläche und Stellplätzen dieser
    // Einheit brauchen dieselbe Verdrahtung wie die Hausansicht.
    installHilfe(inhalt);
    return;
  }

  // Mietverhältnisse, die auf keine Einheit zeigen. Sie fallen aus der
  // Kostenverteilung (Fund XCII) — deshalb stehen sie am Haus, nicht im
  // Nirgendwo. Gibt es überhaupt keine Einheiten, ist das der Normalfall und
  // die Liste heisst schlicht „Mieten & Mieter".
  const bekannt = new Set(einheiten.map(e => e.bezeichnung));
  const heimatlos = (bereiche.mieten || []).filter(m => !bekannt.has(zuEinheit(m)));
  const mietBlock = !einheiten.length
    ? abschnitt('mieten', bereiche.mieten)
    : (heimatlos.length ? abschnitt('mieten', heimatlos, {
        kopf: 'Ohne Einheit',
        vorspann: `<div class="merker"><span class="hi">!</span><span class="ht">
            <span class="t">${heimatlos.length === 1
              ? 'Ein Mietverhältnis gehört zu keiner Einheit'
              : `${heimatlos.length} Mietverhältnisse gehören zu keiner Einheit`}</span>
            <span class="d">Ohne Einheit fällt die Partei aus der
              Kostenverteilung: sie bekommt keine Kosten und ihre Vorauszahlung
              voll erstattet. Eintrag öffnen und die Einheit antippen.</span>
          </span></div>`,
      }) : '');

  // CCCXIX — die Zahlungen teilen sich auf: das Finanzamt (Steuern u. Ä.) und
  // die einmaligen Erwerbsnebenkosten stehen in getrennten Rubriken.
  const erwerbZahlungen = (bereiche.zahlungen || [])
    .filter(z => z.kategorie === ERWERB_KATEGORIE);
  const finanzZahlungen = (bereiche.zahlungen || [])
    .filter(z => z.kategorie !== ERWERB_KATEGORIE);

  inhalt.innerHTML = `
    ${istGrundstueck() ? '' : bannerHtml(laufend)}
    ${nachpflegeHtml(det.nachpflege)}
    ${kennzahlenHtml(vermoegen, jahresmiete, restschuld, guthaben)}
    ${einheitenHtml()}
    ${zeitraumBlock}
    ${grundstueckHtml(objekt, jahresmiete)}
    ${stammHtml(objekt)}
    ${wegHtml(objekt)}
    <div class="sekopf"><span class="seikon">${kostenIcon('Dokument')}</span><h2 class="sec">Dokumentenablage</h2></div>
    <div id="cloudbereich"><div class="cloudbox"><div class="zeile">
      <span class="sym offen">…</span>
      <span class="txt"><span class="t">wird geprüft …</span></span>
    </div></div></div>
    ${eigentuemerHtml(anteile)}
    ${istGrundstueck()
      // CCCIV — beim Grundstück in der logischen Reihenfolge: erst der
      // Erwerb (Notarverträge), dann das Finanzamt, dann die Erträge, zuletzt
      // die einmaligen Erwerbsnebenkosten (CCCXIX).
      ? `${abschnitt('notarvertraege', bereiche.notarvertraege)}
         ${abschnitt('zahlungen', finanzZahlungen)}
         ${mietBlock}
         ${abschnitt('erwerbskosten', erwerbZahlungen)}`
      // CCCXXXII — sinnvolle Reihenfolge: erst die Mieten (das Kerngeschäft),
      // dann der Erwerbs-/Finanzierungs-Cluster (Notar, Grundschulden, einmalige
      // Erwerbsnebenkosten), dann Versicherungen und Kredite, das Finanzamt
      // (Steuer) zuletzt.
      : `${mietBlock}
         ${abschnitt('notarvertraege', bereiche.notarvertraege)}
         ${grundschuldenHtml()}
         ${abschnitt('erwerbskosten', erwerbZahlungen)}
         ${abschnitt('versicherungen', bereiche.versicherungen, {
           vorspann: `<p class="sehinweis">Gebäude- und Haftpflichtversicherung laufen
             als jährliche Kostenart über die <strong>Nebenkosten</strong> — hier stehen
             nur <strong>zusätzliche</strong> Policen (z. B. Rechtsschutz, Elementar).</p>` })}
         ${abschnitt('kredite', bereiche.kredite)}
         ${abschnitt('zahlungen', finanzZahlungen)}`}
    <div class="gefahr-block">
      <div class="gt">Sicherung und Löschen</div>
      <p>Die Sicherung enthält alle Daten dieser Immobilie und lässt sich
         wieder einlesen. Beim Löschen wird sie zusätzlich in die Nextcloud
         geschrieben — die dort abgelegten Unterlagen bleiben unberührt.</p>
      <button class="btn leise" data-export="1">Sicherung herunterladen</button>
      <button class="btn gefahr" data-loeschen="1">Immobilie löschen</button>
    </div>`;

  installHilfe(inhalt);
  cloudZeigen();
}

/* ---- CCXCIX — der Dokumentenbaum -----------------------------------------
   Die Ablage als Gliederung: je Kategorie ein Ast in seiner Farbe und mit dem
   Symbol der Rubrik, darunter „wie Früchte" die Dokumente. Grau = hängt noch an
   keinem Eintrag; von dort lässt es sich zuordnen. Oben Filter-Chips mit
   denselben Symbolen — sie zeigen nur, was es wirklich gibt. */
// Vorschlag der Zielrubrik beim Zuordnen, abgeleitet aus dem echten Ordner
// (CCCXVI). Der Dialog lässt sie ohnehin ändern.
const ORDNER_RUBRIK = {
  '60_Nebenkosten': 'nebenkosten', '70_Steuer_Finanzamt': 'zahlungen',
  '40_Kauf_Eigentum_Finanzierung': 'notarvertraege',
  '50_Pacht_und_Paechter': 'mieten', '20_Mietvertraege_Vermietung': 'mieten',
  '01_Allgemein_Hauskonto': 'versicherungen',
};
// Farbe/Symbol je Ordner — an der Zahl (10_/40_/60_ …) festgemacht.
const ORDNER_FARBE = {
  '10': '#5C6B70', '20': 'var(--pos)', '30': '#5C6B70',
  '40': 'var(--teal)', '50': 'var(--pos)', '55': '#5C6B70',
  '60': 'var(--teal-d)', '70': 'var(--amber)', '80': '#5C6B70',
  '98': '#8A9599', '99': '#8A9599', '01': 'var(--soft)', '': 'var(--neg)',
};
const ORDNER_IKON = {
  '10': 'Dokument', '20': 'Miete', '30': 'Korrespondenz',
  '40': 'Notarvertrag', '50': 'Miete', '60': 'Nebenkosten',
  '70': 'Finanzamt', '80': 'Haus', '99': 'Dokument', '01': 'Versicherung',
  '': 'Dokument',
};
// CCCXXXII-c — klarere Anzeige-Namen für Ordner, deren echter Name nicht sagt,
// was drin liegt (Cloud-Ordnername bleibt unangetastet). Grobe Ordner tragen
// die Rubriken, die sie bündeln, damit Filter und Rubrik zueinander passen.
const ORDNER_ANZEIGE = {
  '01_Allgemein_Hauskonto': 'Allgemein & Versicherungen',
  '40_Kauf_Eigentum_Finanzierung': 'Kauf · Notar · Kredite · Grundschuld',
  '50_Bauphase_Projekte': 'Bauphase & Instandhaltung',
};
const ordnerTitel = a => ORDNER_ANZEIGE[a.ordner] || a.titel;
const ordnerNr = o => (o || '').slice(0, 2).match(/^\d\d$/) ? o.slice(0, 2) : '';
const ordnerFarbe = o => ORDNER_FARBE[ordnerNr(o)] || 'var(--soft)';
const ordnerIkon = o => ORDNER_IKON[ordnerNr(o)] || 'Dokument';
// Statuszeichen im Baum (CCCXXI): der Haken für „einem Eintrag zugeordnet",
// ein kleines Belegblatt für „als Beleg angehängt" (statt des ⊙-Kreises).
const HAKEN_ICON = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none"
  stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
  stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4 4 10-10.5"/></svg>`;
const BELEG_ICON = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none"
  stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
  stroke-linejoin="round" aria-hidden="true">
  <path d="M7 3.5h6l4 4V19a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"/>
  <path d="M13 3.5V8h4M8.5 12.5h7M8.5 15.5h5"/></svg>`;
const PRO_AST = 10;                     // so viele Früchte je Ast, dann „mehr"
let baumDaten = null;
let baumFilter = '';                    // '' = alle Äste
