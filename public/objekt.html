  let zeilen;
  let timelineHtml = '';
  if (!eintraege.length) {
    zeilen = `<div class="leerzeile">Noch nichts erfasst</div>`;
  } else if (bereich === 'mieten') {
    // N19 — Timeline + farbige Zeilen + erkannte Leerstände als eigene Zeilen.
    const mo = mietModell(eintraege);
    if (mo) {
      timelineHtml = mietTimelineHtml(mo);
      const gemischt = [
        ...mo.mieten.map(m => ({ t: m.ab_datum, html: mietZeile(cfg, m, imFokus) })),
        ...mo.leerstaende.map(x => ({ t: x.von, html: leerstandZeile(x) })),
      ].sort((a, b) => a.t.localeCompare(b.t));       // chronologisch …
      const entwuerfe = eintraege.filter(istEntwurf)
        .map(e => entwurfZeile(cfg, bereich, e, imFokus)).join('');
      zeilen = entwuerfe + gemischt.reverse().map(x => x.html).join('');  // … neueste oben
    } else {
      zeilen = eintraege.map(e => istEntwurf(e)
        ? entwurfZeile(cfg, bereich, e, imFokus)
        : eintragZeile(cfg, bereich, e, imFokus)).join('');
    }
  } else if (bereich === 'zahlungen') {
    // Nach Art gruppieren; nur was mehrfach vorkommt, wird gestaffelt.
    const gruppen = new Map();
    const einzeln = [];
    for (const e of eintraege) {
      if (istEntwurf(e)) { einzeln.push(e); continue; }
      const art = (e.art || 'Zahlung').trim();
      if (!gruppen.has(art)) gruppen.set(art, []);
      gruppen.get(art).push(e);
    }
    const teile = [];
    for (const [art, gruppe] of gruppen) {
      teile.push(gruppe.length > 1
        ? staffelHtml(cfg, bereich, art, gruppe)
        : eintragZeile(cfg, bereich, gruppe[0], imFokus));
    }
    for (const e of einzeln) teile.push(entwurfZeile(cfg, bereich, e, imFokus));
    zeilen = teile.join('');
  } else {
    zeilen = eintraege.map(e => istEntwurf(e)
      ? entwurfZeile(cfg, bereich, e, imFokus)
      : eintragZeile(cfg, bereich, e, imFokus)).join('');
  }

  // N3 — Mietverhältnisse (auch Vormietverhältnisse) lassen sich JEDERZEIT
  // hinzufügen; ein laufendes muss dafür nicht beendet werden. Rücknahme der
  // CCCLXXXIX-Sperre — der „＋" oben rechts im Titel bleibt immer aktiv (CCCXC).
  // N22 — der „hinzufügen"-Zugang ist ein Textlink im selben Stil wie
  // „Anlegen"/„Bearbeiten" der übrigen Rubriken, kein eigener „＋"-Kasten.
  const kopfAdd = `<button class="seakt" data-add="${bereich}"
       aria-label="${esc(cfg.einzahl)} hinzufügen"
       title="${esc(cfg.einzahl)} hinzufügen">Hinzufügen</button>`;
  return `${sekopfHtml(kopf || cfg.titel, cfg.ikon, kopfAdd, RUBRIKFARBE[bereich])}
    ${timelineHtml}${vorspann}
    <div class="liste">${zeilen}</div>`;
}

/* ---- CXLI/CLXVIII: die Einheiten des Hauses und ihr Fokus ---------------- */

// CCCXXVII/CCCXXVIII — die für Miete und Verteilung maßgebliche Fläche einer
// Einheit: die Wohn-/Nutzfläche plus anteilig mitgenutzte Gemeinschaftsflächen
// (Fläche ÷ Zahl der Nutzer). Solange keine Gemeinschaftsflächen erfasst sind,
// ist es schlicht die Wohnfläche — der Bestand bleibt damit unverändert.
function effektiveFlaeche(e) {
  const wohn = Number(e.flaeche) || 0;
  // CCCXXIX — benannte Zusatz-Nutzflächen zählen voll (ungeteilt) mit.
  const nutz = (e.nutzflaechen || []).reduce((s, n) =>
    s + (Number(n.flaeche) || 0), 0);
  const gemein = (e.gemeinflaechen || []).reduce((s, g) => {
    const f = Number(g.flaeche) || 0;
    const p = Number(g.personen) || 0;
    return s + (p > 0 ? f / p : 0);
  }, 0);
  return wohn + nutz + gemein;
}

// Kaltmiete je m² (monatlich) — null, wenn Fläche oder Miete fehlen (CCCXXVIII).
function qmMiete(e) {
  const f = effektiveFlaeche(e);
  return e.vermietet && e.kaltmiete && f > 0 ? e.kaltmiete / f : null;
}

// CCCXXXIII — die aus Flächen × €/m² hergeleitete Kaltmiete (monatlich). Je
// Flächenart zählt nur der Term, dessen €/m²-Ansatz gesetzt ist:
//   (flaeche + Σnutz) × miete_qm_wohn      Wohn-/Nutzfläche inkl. voller Zusatz
// + nebenflaeche       × miete_qm_neben     Nebenfläche
// + Σ(gemein ÷ Pers.)  × miete_qm_gemein    anteilige Gemeinschaftsfläche
// Null, wenn kein Ansatz gesetzt ist — dann gibt es nichts vorzuschlagen. Der
// Wert ist ein überschreibbarer Vorschlag; gespeichert wird die tatsächliche
// Kaltmiete am Mietverhältnis, nicht an der Einheit.
function hergeleiteteKaltmiete(e) {
  const gesetzt = v => v != null && v !== '';
  const wohn = (Number(e.flaeche) || 0)
    + (e.nutzflaechen || []).reduce((s, n) => s + (Number(n.flaeche) || 0), 0);
  const neben = Number(e.nebenflaeche) || 0;
  const gemein = (e.gemeinflaechen || []).reduce((s, g) => {
    const f = Number(g.flaeche) || 0;
    const p = Number(g.personen) || 0;
    return s + (p > 0 ? f / p : 0);
  }, 0);
  let summe = 0, hat = false;
  if (gesetzt(e.miete_qm_wohn)) { summe += wohn * Number(e.miete_qm_wohn); hat = true; }
  if (gesetzt(e.miete_qm_neben)) { summe += neben * Number(e.miete_qm_neben); hat = true; }
  if (gesetzt(e.miete_qm_gemein)) { summe += gemein * Number(e.miete_qm_gemein); hat = true; }
  return hat ? Math.round(summe * 100) / 100 : null;
}

function einheitDetail(e) {
  return [e.nutzungsart,
          e.flaeche ? flaecheText(e.flaeche) : '',
          e.stellplaetze ? (e.stellplaetze > 1 ? `${e.stellplaetze} Stellplätze`
                                               : '1 Stellplatz') : '',
          e.mieter].filter(Boolean).join(' · ');
}

/* N31 — das aktuell laufende Mietverhältnis einer Einheit: ab_datum ≤ heute,
   kein Enddatum oder Enddatum ≥ heute, nicht geplant. Bei mehreren das jüngste.
   Grundlage für Vermietet-Status, laufende Mietdauer und die Objekt-Summen. */
function laufendeMiete(e) {
  const heute = _heuteIso();
  return (bereicheDaten.mieten || [])
    .filter(m => m && m.ab_datum && !m.geplant && zuEinheit(m) === e.bezeichnung
      && m.ab_datum <= heute && (!m.bis_datum || m.bis_datum >= heute))
    .sort((a, b) => b.ab_datum.localeCompare(a.ab_datum))[0] || null;
}

/* N53 — Beginn der DURCHGEHENDEN Mietzeit desselben Mieters. Eine Mieterhöhung
   (auch eine geplante) ist ein eigener Vertrag, der nahtlos an den vorigen
   anschließt (altes Ende = neuer Beginn − 1 Tag). Für „seit X" zählt nicht der
   jüngste Vertrag, sondern der erste einer solchen Kette gleicher Partei ohne
   Leerstands-Lücke. Bei echter Lücke (Auszug, später wieder eingezogen) bricht
   die Kette — das ist dann keine bloße Erhöhung mehr. */
function mietzeitBeginn(e, lm) {
  const mieten = (bereicheDaten.mieten || [])
    .filter(m => m && m.ab_datum && zuEinheit(m) === e.bezeichnung
      && m.partei === lm.partei)
    .sort((a, b) => a.ab_datum.localeCompare(b.ab_datum));
  let beginn = lm.ab_datum;
  for (let weiter = true; weiter;) {
    weiter = false;
    // Vertrag, dessen Ende nahtlos vor `beginn` liegt (bis == beginn−1 oder
    // beginn, also keine Lücke). Von mehreren Anschlüssen den frühesten nehmen.
    const grenze = _tagPlus(beginn, -1);
    const vor = mieten.filter(m => m.bis_datum && m.ab_datum < beginn
      && m.bis_datum >= grenze);
    if (vor.length) { beginn = vor[0].ab_datum; weiter = true; }
  }
  return beginn;
}

/* N31 — angeschrägter Gummistempel „VERMIETET": zwei gerundete Rahmen und der
   Schriftzug, leicht gedreht und transparent im Pos-Grün. Reines Inline-SVG. */
function vermietetStempel() {
  // N36 — die viewBox muss die -7°-Drehung fassen (gedrehte Höhe ~47 statt 32),
  // sonst ragen die Rahmen-Ecken aus dem Kasten und der Text darunter überlappt.
  return `<svg class="stempel-svg" viewBox="0 0 134 52" width="116" height="45"
       role="img" aria-label="Vermietet">
      <g transform="rotate(-7 67 26)" fill="none" style="stroke:var(--pos)">
        <rect x="4" y="10" width="126" height="32" rx="7" style="stroke-width:2.2"/>
        <rect x="8.5" y="14.5" width="117" height="23" rx="4.5" style="stroke-width:1"/>
        <text x="67" y="31" text-anchor="middle"
          style="fill:var(--pos);stroke:none;font:800 14px var(--disp);letter-spacing:1.4px">VERMIETET</text>
      </g>
    </svg>`;
}

/* N33 — kompakte Vermietungs-Timeline EINER Einheit (Balken + Leerstand-Lücken),
   dieselbe Sprache wie N19, nur schlanker. Ohne Mietverhältnisse: nichts. */
function miniMietTimelineHtml(eintraege) {
  const mo = mietModell(eintraege);
  if (!mo) return '';
  return `<div class="einheit-tl">${mietTimelineHtml(mo, true)}</div>`;
}

/* N32 — die vier Objekt-Kennzahlen rechts neben dem Diagramm: Miete/Monat und
   NK/Monat (Summe der laufenden Verhältnisse, jeder Turnus auf Monat normiert),
   daraus Ertrag/Jahr und NK-Pauschale/Jahr. */
function objektSummenHtml() {
  let mMonat = 0, nkMonat = 0;
  for (const e of einheiten) {
    const lm = laufendeMiete(e);
    if (!lm) continue;
    const f = proJahr(lm.turnus) / 12;   // Turnus → Monatsbetrag
    mMonat += (lm.kaltmiete || 0) * f;
    nkMonat += (lm.nebenkosten_vz || 0) * f;
  }
  const zeile = (l, w) =>
    `<div class="os-zeile"><span class="os-l">${l}</span><span class="os-w">${eur(w)}</span></div>`;
  return `<div class="objekt-summen">
      <div class="os-grp monat">
        ${zeile('Miete / Monat', mMonat)}
        ${zeile('Nebenkosten / Monat', nkMonat)}
      </div>
      <div class="os-grp jahr">
        ${zeile('Ertrag / Jahr', mMonat * 12)}
        ${zeile('NK-Pauschale / Jahr', nkMonat * 12)}
      </div>
    </div>`;
}

/* Die Zeile führt eine Ebene tiefer — angetippt wird sie ganz, nicht ein
   Pfeilchen am Rand. N31 setzt den Vermietet-Stempel und die grüne Tönung,
   N33 hängt die Mini-Timeline unter jede Zeile. */
function einheitenHtml() {
  if (istGrundstueck()) return '';
  const alleMieten = bereicheDaten.mieten || [];
  const zeilen = einheiten.length
    ? einheiten.map(e => {
        const lm = laufendeMiete(e);
        const vermietet = !!(e.vermietet || lm);
        const seit = lm ? _dauerText(mietzeitBeginn(e, lm), _heuteIso()) : '';
        const stempel = vermietet
          ? `<span class="e-stempel">${vermietetStempel()}${seit
              ? `<span class="e-seit">seit ${esc(seit)}</span>` : ''}</span>`
          : '';
        const detail = einheitDetail(e);
        // Der Trenner „·" gehört IN die ed-seit-Spanne — auf dem Desktop ist die
        // Dauer dort verborgen (sie steht im Stempel), sonst bliebe ein loser „·".
        const seitSpan = seit
          ? `<span class="ed-seit">${detail ? ' · ' : ''}seit ${esc(seit)}</span>` : '';
        const detailZeile = (detail || seit)
          ? `<span class="ed">${esc(detail)}${seitSpan}</span>`
          : '';
        const wert = e.vermietet && e.kaltmiete
          ? `${eur(e.kaltmiete)} / M${qmMiete(e)
              ? `<span class="ew-sub">${eur(qmMiete(e))} / m²</span>` : ''}`
          : '';
        const chips = `${vermietet ? '' : ' <span class="chip amber">frei</span>'}${
          e.nk_abrechnung === false ? ' <span class="chip">nicht in NK</span>' : ''}`;
        const tl = miniMietTimelineHtml(alleMieten.filter(m => zuEinheit(m) === e.bezeichnung));
        return `<div class="einheit-block">
          <div class="eintrag klick${vermietet ? ' vermietet' : ''}" data-einheit="${e.id}">
            <span class="sym">${kostenIcon('Miete')}</span>
            <span class="et">
              <span class="en">${esc(e.bezeichnung)}${chips}</span>
              ${detailZeile}
            </span>
            ${stempel}
            <span class="ewwrap">
              <span class="ew">${wert}</span>
              <button class="del" data-einheit-weg="${e.id}" aria-label="löschen">×</button>
            </span>
          </div>
          ${tl}
        </div>`;
      }).join('')
    : `<div class="leerzeile">Noch keine Einheit erfasst</div>`;

  return `<div class="sekopf"><h2 class="sec">Einheiten</h2>
      <button class="seakt" data-einheit-neu="1" aria-label="Einheit hinzufügen"
        title="Einheit hinzufügen">Hinzufügen</button></div>
    <div class="liste">${zeilen}</div>
    ${einheiten.length ? `<div class="fussnote">Eine Einheit antippen: dort
      stehen Mieter, Kontakt und Nebenkosten dieser Wohnung. Alles Übergeordnete
      — Stammdaten, Eigentümer, Kredite, Versicherungen, Steuer und Ablage —
      bleibt hier am Haus.</div>` : ''}`;
}

/* CCCXXVII/CCCXXIX — die erfassten Zusatz- und Gemeinschaftsflächen als Zeilen,
   gefolgt von der effektiven Gesamtfläche. Ohne erfasste Flächen bleibt es leer,
   dann steht nur die Basis-Wohnfläche wie bisher. */
function flaechenZeilenHtml(e) {
  const num = n => Number(n).toLocaleString('de-DE', { maximumFractionDigits: 2 });
  const nutz = (e.nutzflaechen || []).filter(n => Number(n.flaeche) > 0);
  const gemein = (e.gemeinflaechen || []).filter(g => Number(g.flaeche) > 0);
  if (!nutz.length && !gemein.length) return '';
  let out = '';
  for (const n of nutz) {
    out += paarZeile(n.bezeichnung || 'Zusatzfläche',
      `${num(n.flaeche)} m² · voll`, {});
  }
  for (const g of gemein) {
    const f = Number(g.flaeche) || 0;
    const p = Number(g.personen) || 0;
    const anteil = p > 0 ? f / p : 0;
    out += paarZeile(g.bezeichnung || 'Gemeinschaftsfläche',
      `${num(f)} m² ÷ ${p || '?'} = ${num(anteil)} m²`, {});
  }
  out += paarZeile('Effektive Fläche', `${num(effektiveFlaeche(e))} m²`,
    { abgeleitet: true });
  return out;
}

/* Die Einheit selbst — ohne ihre Bezeichnung: die steht schon in der Kopfzeile. */
function einheitStammHtml(e) {
  // Der NK-Schalter (CXCIII) ist ein bool — als „true"-Zeile stünde er nur im
  // Weg. Die Teilnahme ist der Normalfall und bleibt still; nur der Ausschluss
  // wird als eigener Hinweis gezeigt.
  // CCCXXIX — direkt unter der Basis-Wohnfläche folgen die Zusatz- und
  // Gemeinschaftsflächen und die effektive Gesamtfläche.
  const flaechen = flaechenZeilenHtml(e);
  // CCCXLII — leere Felder (Verkehrswert, Terrasse, Nebenfläche, Stellplätze=0)
  // erscheinen nicht mehr als „nicht erfasst"-Zeile, sondern werden schlicht
  // weggelassen. Die Flächenaufstellung bleibt an der Wohnfläche hängen.
  const zeilen = EINHEITFELDER
    .filter(f => f.k !== 'bezeichnung' && f.k !== 'nk_abrechnung'
      // CCCLVI — der Einheiten-Verkehrswert erscheint nur im Modus „je Einheit";
      // erfasst man den Wert für das ganze Objekt, entfällt die Zeile hier.
      && !(f.k === 'verkehrswert' && !istEinheitswert(objekt)))
    .map(f => (feldLeer(f, e[f.k]) ? '' : paarZeile(f.l, stammwert(f, e), { lex: f.lex }))
      + (f.k === 'flaeche' ? flaechen : '')).join('');
  // CCCXXXIII — sind €/m²-Ansätze gesetzt, folgt die daraus hergeleitete
  // Kaltmiete als klar als „Vorschlag" markierte, abgeleitete Zeile. Sie steht
  // hier nur zur Auskunft; übernommen wird sie erst im Miet-Formular.
  const vorschlag = hergeleiteteKaltmiete(e);
  const mietZeile = vorschlag != null
    ? paarZeile('Hergeleitete Kaltmiete (Vorschlag)', `${eur(vorschlag)} / M`,
        { abgeleitet: true, lang: true })
    : '';
  const aus = e.nk_abrechnung === false
    ? `<div class="merker"><span class="hi">i</span><span class="ht">
         <span class="t">Nicht Teil der Nebenkostenabrechnung</span>
         <span class="d">Diese Einheit zählt in keinem Verteilungsschlüssel mit
           — selbstgenutzt, separat abgerechnet oder mit eigenem Zähler.
           „Bearbeiten" schaltet die Teilnahme wieder ein.</span>
       </span></div>` : '';
  return `<div class="sekopf"><h2 class="sec">Einheit</h2>
      <button data-einheit-edit="${e.id}">Bearbeiten</button></div>
    <div class="paare">${zeilen}${mietZeile}</div>${aus}
    ${lageplanHtml(e)}`;
}

/* CCCXXVI / CCCLXIX / CCCLXXXI — Lagepläne je Einheit.

   Vorhandene öffnen als Bild-Vorschau über den bestehenden Dokument-Inhalt
   (belegAnsehen). Der ZUERST hinterlegte Plan bekommt zusätzlich eine kleine,
   höhenbegrenzte Inline-Vorschau (über denselben Weg wie das Ansehen: das
   serverseitig gerenderte Bild als Blob, `lageplanVorschauFuellen`). Je Zeile
   zwei leise Aktionen: umbenennen (✎, nur Anzeigename) und entfernen (×, nur
   der Eintrag — die Cloud-Datei bleibt).

   Der Upload läuft über den change-Handler auf `inhalt`: ein Foto geht durch
   dieselbe Aufbereitung wie die Belege (zuschneiden, drehen, klein als PDF),
   ein fertiges PDF unverändert (POST /api/einheiten/{id}/lageplan). */
/* Der Anzeigename eines Plans, aufgeräumt für die Beschriftung: ohne Endung und
   ohne die Ablage-Vorsilben (ohne-Jahr_, Jahr_, Lageplan …). Frisch umbenannt
   ist er schon kurz („1.OG"); bei Alt-Uploads bleibt wenigstens der Kern übrig. */
function planLabel(p) {
  return ((p.dateiname || 'Lageplan')
    .replace(/\.[a-z0-9]+$/i, '')
    .replace(/^ohne-jahr[ _-]+/i, '')
    .replace(/^(?:19|20)\d{2}[ _-]+/, '')
    .replace(/^lageplan[ _-]*/i, '')
    .trim()) || 'Lageplan';
}

/* Ein Plan als Karte: höhenbegrenzte Vorschau mit dem Namen sanft überlagert,
   dazu die zwei leisen Aktionen (umbenennen ✎, entfernen ×) oben rechts. Jeder
   Plan bekommt seine eigene Vorschau — so lassen sich 1.OG, DG … auseinander
   halten (CCCLXXXV). */
function lageplanKarte(p, e) {
  const label = planLabel(p);
  return `<div class="lp-karte" data-lp-karte="${p.id}">
      <button class="lp-vorschau klick" data-lageplan="${p.id}"
        aria-label="Lageplan „${esc(label)}“ ansehen">
        <img data-lp-bild="${p.id}" alt="">
        <span class="lp-name">${esc(label)}</span>
      </button>
      <span class="lp-akte">
        <button class="lp-akt" data-lageplan-rename="${p.id}" data-e="${e.id}"
          data-name="${esc(label)}" title="Umbenennen"
          aria-label="Lageplan umbenennen">✎</button>
        <button class="lp-akt lp-weg" data-lageplan-weg="${p.id}" data-e="${e.id}"
          title="Entfernen" aria-label="Lageplan entfernen">×</button>
      </span>
    </div>`;
}
function lageplanHtml(e) {
  const plaene = e.lageplaene || [];
  // N4 — Kopf über den gemeinsamen sekopfHtml-Helfer (bündig + gleiche
  // Icon-Ausrichtung/-Farbe wie die anderen Rubriken, kein Sonderweg mehr).
  const add = `<label class="seakt" title="Lageplan aufnehmen oder hochladen"
        aria-label="Lageplan aufnehmen oder hochladen">Hinzufügen
        <input type="file" accept="image/*,application/pdf" capture="environment"
               data-lageplan-neu="${e.id}" hidden></label>`;
  const kopf = sekopfHtml('Lageplan', 'Grundstück', add, RUBRIKFARBE.grundstueck);
  // N4 — Pläne als kompakte Elemente im Seitenverhältnis nebeneinander (Flex),
  // nicht als ganzseitige Kästen untereinander.
  const inhalt = plaene.length
    ? `<div class="lp-liste">${plaene.map(p => lageplanKarte(p, e)).join('')}</div>`
    : `<div class="liste"><div class="leerzeile">Noch kein Lageplan hinterlegt</div></div>`;
  return `${kopf}${inhalt}`;
}

/* Die Inline-Vorschau des ersten Plans: das Bild über denselben Weg holen, über
   den ein Lageplan angesehen wird (serverseitig gerendert, auch für PDF), als
   Object-URL setzen. Alte URLs werden beim erneuten Rendern freigegeben. */
let lageplanVorschauUrls = [];
function lageplanVorschauAufraeumen() {
  lageplanVorschauUrls.forEach(u => URL.revokeObjectURL(u));
  lageplanVorschauUrls = [];
}
async function lageplanVorschauFuellen(root) {
  const bilder = [...root.querySelectorAll('[data-lp-bild]')];
  await Promise.all(bilder.map(async bild => {
    try {
      const antwort = await fetch(`/api/dokumente/${bild.dataset.lpBild}/vorschau?seite=0`);
      if (!antwort.ok) throw new Error(String(antwort.status));
      const adr = URL.createObjectURL(await antwort.blob());
      lageplanVorschauUrls.push(adr);
      bild.src = adr;
    } catch {
      // Ohne Cloud-Anbindung (oder wenn sich der Plan nicht rendern lässt) bleibt
      // die Karte stehen — nur das Bild wird eingeklappt, Name und Aktionen
      // (umbenennen/entfernen) bleiben erreichbar.
      bild.closest('.lp-karte')?.classList.add('lp-ohne-bild');
    }
  }));
}

/* CCCLXXXI — kleiner Umbenennen-Dialog: nur der Anzeigename. Die Datei in der
   Nextcloud wird nicht berührt (das erledigt der Endpunkt), hier wird bloss der
   Name erfragt. Im Stil des Zuordnen-Dialogs, damit nichts Neues nötig ist. */
function lageplanUmbenennen(einheitId, id, name) {
  const dlg = document.createElement('dialog');
  dlg.className = 'immo-dlg zuord-dlg';
  document.body.appendChild(dlg);
  dlg.addEventListener('close', () => dlg.remove());
  dlg.innerHTML = `
    <div class="zd-kopf">
      <span class="zd-t">Lageplan umbenennen</span>
      <button class="zd-x" data-nein aria-label="Schließen">×</button>
    </div>
    <div class="zd-block">
      <span class="zd-l">Anzeigename</span>
      <input class="lp-eingabe" type="text" value="${esc(name || '')}"
             maxlength="120" aria-label="Anzeigename des Lageplans">
      <span class="zd-hint">Nur die Bezeichnung in der App ändert sich — die
        Datei in der Nextcloud bleibt, wo sie liegt.</span>
    </div>
    <div class="zd-fuss">
      <button class="zd-ab" data-nein>Abbrechen</button>
      <button class="zd-ok" data-ja>Speichern</button>
    </div>`;
  const feld = dlg.querySelector('.lp-eingabe');
  const speichern = async () => {
    const wert = feld.value.trim();
    if (!wert) return feld.focus();
    dlg.close();
    try {
      await api(`/einheiten/${einheitId}/lageplan/${id}`,
                { method: 'PATCH', body: { name: wert } });
    } catch (fehler) {
      return melde(String(fehler.message || 'Umbenennen ging nicht.'), 'neg');
    }
    return laden();
  };
  dlg.addEventListener('click', e => {
    if (e.target.closest('[data-nein]')) return dlg.close();
    if (e.target.closest('[data-ja]')) return speichern();
  });
  feld.addEventListener('keydown', e => { if (e.key === 'Enter') speichern(); });
  dlg.showModal();
  feld.focus();
  feld.select();
}

/* N9 — beim Anlegen direkt einen Zusatztitel (z. B. „Bad", „DG") vergeben; er
   fließt in Datei- und Anzeigenamen. Liefert den Titel (auch leer „") oder
   null (abgebrochen). */
function lageplanTitelAbfragen() {
  return new Promise(fertig => {
    const dlg = document.createElement('dialog');
    dlg.className = 'immo-dlg zuord-dlg';
    document.body.appendChild(dlg);
    let ok = false;
    dlg.addEventListener('close', () => { dlg.remove(); if (!ok) fertig(null); });
    dlg.innerHTML = `
      <div class="zd-kopf">
        <span class="zd-t">Lageplan hinzufügen</span>
        <button class="zd-x" data-nein aria-label="Schließen">×</button>
      </div>
      <div class="zd-block">
        <span class="zd-l">Zusatztitel (optional)</span>
        <input class="lp-eingabe" type="text" placeholder="z. B. Bad, DG, Grundriss …"
               maxlength="80" aria-label="Zusatztitel des Lageplans">
        <span class="zd-hint">Kommt in den Datei- und Anzeigenamen. Leer lassen ist ok.</span>
      </div>
      <div class="zd-fuss">
        <button class="zd-ab" data-nein>Abbrechen</button>
        <button class="zd-ok" data-ja>Hochladen</button>
      </div>`;
    const feld = dlg.querySelector('.lp-eingabe');
    const weiter = () => { ok = true; const w = feld.value.trim(); dlg.close(); fertig(w); };
    dlg.addEventListener('click', e => {
      if (e.target.closest('[data-nein]')) return dlg.close();
      if (e.target.closest('[data-ja]')) return weiter();
    });
    feld.addEventListener('keydown', e => { if (e.key === 'Enter') weiter(); });
    dlg.showModal();
    feld.focus();
  });
}

/* N20/N21 — grafischer Einstieg statt Kennzahlen-Kacheln: der Miet- und
   Nebenkostenverlauf aus den Mietverhältnissen. Ein Mietverhältnis steuert
   seinen Monatsbetrag (Turnus normalisiert) zu jedem Monat bei, den es abdeckt
   (ab_datum … bis_datum ||heute). Ein Monat ohne aktives Verhältnis bleibt leer
   — das ist der Leerstand und wird als solcher gezeigt.

   `flaeche` ist der Teiler für die €/m²-Linie: im Fokus die effektive Fläche
   der Einheit, am Haus die Summe über alle Einheiten (Ø €/m²). Ist sie 0,
   entfällt die Linie.

   Bis ~24 Monate monatlich; wird die Historie länger als 30 Monate, wird auf
   Quartale verdichtet (Ø Monatsbetrag je Quartal) und auf die letzten drei
   Jahre begrenzt — sonst quetschen sich zu viele Säulen ins Bild. */
const MONATS_KURZ = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun',
                     'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];

function mietVerlauf(mieten, flaeche) {
  // Geplante zählen noch nicht; beendete gehören zur Historie und bleiben drin.
  const aktive = (mieten || []).filter(m => !m.geplant && m.ab_datum);
  if (!aktive.length) return [];

  const idx = s => { const d = new Date(s); return d.getFullYear() * 12 + d.getMonth(); };
  const heute = new Date();
  const endM = heute.getFullYear() * 12 + heute.getMonth();
  let startM = Math.min(...aktive.map(m => idx(m.ab_datum)));
  if (startM > endM) startM = endM;

  const faktor = m => proJahr(m.turnus) / 12;  // Turnus auf Monatsbetrag
  const monate = [];
  for (let mm = startM; mm <= endM; mm++) {
    let miete = 0, nk = 0;
    for (const m of aktive) {
      const a = idx(m.ab_datum);
      const b = m.bis_datum ? idx(m.bis_datum) : endM;
      if (mm >= a && mm <= b) {
        const f = faktor(m);
        miete += (m.kaltmiete || 0) * f;
        nk += (m.nebenkosten_vz || 0) * f;
      }
    }
    monate.push({ m: mm, miete, nk });
  }

  const punkt = (miete, nk, label) => ({
    miete, nk, label,
    qm: flaeche > 0 ? miete / flaeche : null,
  });

  if (monate.length > 30) {
    // Auf Quartale verdichten: Ø Monatsbetrag je Quartal, letzte 12 Quartale.
    const eimer = new Map();
    for (const b of monate) {
      const y = Math.floor(b.m / 12), q = Math.floor((b.m % 12) / 3);
      const key = y * 4 + q;
      const e = eimer.get(key) || { y, q, miete: 0, nk: 0, n: 0 };
      e.miete += b.miete; e.nk += b.nk; e.n++;
      eimer.set(key, e);
    }
    const quartale = [...eimer.values()].sort((a, b) => (a.y * 4 + a.q) - (b.y * 4 + b.q))
      .slice(-12);
    return quartale.map(e =>
      punkt(e.miete / e.n, e.nk / e.n, `Q${e.q + 1}/${String(e.y).slice(2)}`));
  }

  // Monatlich, höchstens die letzten 24 Monate.
  return monate.slice(-24).map(b => {
    const y = Math.floor(b.m / 12), mo = b.m % 12;
    const label = mo === 0 ? `${MONATS_KURZ[mo]} ${String(y).slice(2)}` : MONATS_KURZ[mo];
    return punkt(b.miete, b.nk, label);
  });
}

/* Der Diagramm-Block: Überschrift, Säulen+Linie, Legende. Bei fehlenden Daten
   zeigt mietChart selbst einen ruhigen Leer-Hinweis; dann entfällt die Legende. */
function mietDiagrammHtml(mieten, flaeche, uebersicht = '') {
  const punkte = mietVerlauf(mieten, flaeche);
  const svg = mietChart(punkte, { format: eur });
  const hatWerte = punkte.some(p => (p.miete || 0) + (p.nk || 0) > 0);
  const leg = hatWerte ? legende([
    { name: 'Kaltmiete', farbe: '#0F6E5C' },
    { name: 'Nebenkosten', farbe: '#916212' },
    { name: '€ / m²', farbe: '#16262C' },
  ]) : '';
  const karte = `<div class="diagramm-karte">${svg}${leg}</div>`;
  // N32 — auf der Hausebene stehen die vier Objekt-Summen rechts daneben.
  const koerper = uebersicht
    ? `<div class="diagramm-wrap">${karte}${uebersicht}</div>`
    : karte;
  return `<div class="sekopf"><span class="seikon">${kostenIcon('Miete')}</span>
      <h2 class="sec">Miete &amp; Nebenkosten</h2></div>
    ${koerper}`;
}

function eigentuemerHtml(stand) {
  if (!stand) return '';
  // CLXI — ein Anteil zeigt aufs ganze Haus oder auf eine Einheit. Die Einheit
  // steht als Auszeichnung am Namen, damit „mir gehört Wohnung 2" sichtbar ist.
  // Bestandszeilen kennen nur `tausendstel`; neue tragen `promille`.
  const zeilen = stand.anteile.length
    ? stand.anteile.map(a => `<div class="eintrag">
        <span class="sym">${kostenIcon('Eigentümer')}</span>
        <span class="et"><span class="en">${esc(a.name)}${a.einheit
            ? ` <span class="chip teal">${esc(a.einheit)}</span>` : ''}</span>
          <span class="ed">${esc([a.einheit ? '' : a.rolle, a.notiz]
            .filter(Boolean).join(' · '))}</span>
        </span>
        <span class="ew">${promille(a.promille ?? a.tausendstel ?? 0)}</span>
        <button class="del" data-anteil="${a.id}" aria-label="entfernen">×</button>
      </div>`).join('')
    : `<div class="leerzeile">Noch kein Eigentümer zugeordnet</div>`;

  // Warnung analog zu `parteien_ohne_einheit`: erst das Haus (der „Rest"),
  // dann jede Einheit, deren Anteile nicht aufgehen.
  const probleme = [];
  if (stand.objekt_noetig && stand.frei !== 0) {
    probleme.push(stand.frei > 0
      ? `Am Haus fehlen noch ${promille(stand.frei)}`
      : `Am Haus sind ${promille(-stand.frei)} zu viel verteilt`);
  } else if (!stand.objekt_noetig && stand.vergeben > 0) {
    probleme.push(`${promille(stand.vergeben)} am Haus, obwohl schon jede Einheit `
      + `einzeln zugeordnet ist`);
  }
  for (const es of (stand.einheiten_stand || [])) {
    if (es.stimmig) continue;
    probleme.push(es.unbekannt
      ? `„${es.einheit}" gibt es als Einheit nicht (mehr)`
      : (es.frei > 0
          ? `In „${es.einheit}" fehlen noch ${promille(es.frei)}`
          : `In „${es.einheit}" sind ${promille(-es.frei)} zu viel verteilt`));
  }
  const rest = !stand.stimmig
    ? `<div class="merker"><span class="hi">!</span><span class="ht">
         <span class="t">Zurechnung geht noch nicht auf</span>
         <span class="d">${probleme.length
            ? esc(probleme.join(' · ')) + '. '
            : ''}Je Haus und je Einheit sollten 1000 ‰ verteilt sein. Eine
           Nachkommastelle genügt — 333,3 dreimal gilt als vollständig.
           Einheit-Anteile haben Vorrang für ihre Einheit, der Haus-Anteil
           deckt den Rest.</span>
       </span></div>` : '';

  // CCCXXII — „Zuordnen" nur, wenn es überhaupt noch freie ‰ gibt. Ist alles
  // verteilt, wäre der Knopf eine Sackgasse (jede Zuweisung überbucht) —
  // stattdessen ein ruhiger Hinweis. Wird später etwas frei, kommt er zurück.
  const freiObjekt = stand.objekt_noetig === false ? 0 : (stand.frei || 0);
  const freiEinheit = (stand.einheiten_stand || [])
    .reduce((m, es) => Math.max(m, es.frei || 0), 0);
  const platz = Math.max(freiObjekt, freiEinheit) > 0.05;
  const kopfKnopf = platz
    ? `<button data-anteil-neu="1">Zuordnen</button>`
    : `<span class="voll-hinweis" title="Erst einen Anteil verkleinern oder entfernen, dann wird wieder etwas frei">Alle 1000 ‰ verteilt</span>`;

  return `<div class="sekopf"><span class="seikon">${kostenIcon('Eigentümer')}</span><h2 class="sec">Eigentümer</h2>
      ${kopfKnopf}</div>
    <div class="liste">${zeilen}</div>${rest}`;
}

async function laden() {
  // Beim Neuaufbau die Object-URLs der Lageplan-Vorschau freigeben.
  lageplanVorschauAufraeumen();
  if (!slug) {
    inhalt.innerHTML = `<div class="empty"><div class="big">Kein Objekt gewählt</div>
      <p>Zurück zur Übersicht und eine Immobilie antippen.</p></div>`;
    return;
  }
  let det;
  try {
    det = await api(`/objekte/${encodeURIComponent(slug)}`);
  } catch (fehler) {
    inhalt.innerHTML = `<div class="empty"><div class="big">Objekt nicht gefunden</div>
      <p>${esc(String(fehler.message || 'Die Daten konnten nicht geladen werden.'))}</p></div>`;
    return;
  }

  // Die Nebenabrufe duerfen einzeln danebengehen — dass eine Versicherungsliste
  // hakt, heisst nicht, dass es das Objekt nicht gibt. Fehlende Bereiche bleiben
  // leer, gemeldet wird einmal am Ende.
  const luecken = [];
  const zweig = async (was, ruf, ersatz) => {
    try { return await ruf(); }
    catch (fehler) { luecken.push(`${was}: ${fehler.message || fehler}`); return ersatz; }
  };
  const [bereiche, anteile, vermoegen, einheitenRoh, grundschuldenRoh,
         eigentuemerAlle, zaehlerRoh] = await Promise.all([
    Promise.all(Object.keys(BEREICHE).map(async b =>
      [b, await zweig(BEREICHE[b].titel,
                      () => api(`/objekte/${encodeURIComponent(slug)}/${b}`), [])]))
      .then(Object.fromEntries),
    zweig('Eigentümer', () => api(`/objekte/${encodeURIComponent(slug)}/anteile`), null),
    zweig('Vermögen',
          async () => (await api('/vermoegen')).objekte.find(z => z.slug === slug),
          null),
    zweig('Einheiten',
          () => api(`/objekte/${encodeURIComponent(slug)}/einheiten`), []),
    zweig('Grundschulden',
          () => api(`/objekte/${encodeURIComponent(slug)}/grundschulden`), []),
    // CCCXXXV — alle Personen für die Nießbrauch-Auswahl; darf leer bleiben.
    zweig('Eigentümerliste', () => api('/eigentuemer'), []),
    // CCCLXXX (a) — Zähler des Objekts für die Anfangszählerstand-Rubrik. Beiwerk:
    // scheitert der Abruf, bleibt die Rubrik einfach weg.
    zweig('Zähler', () => api(`/objekte/${encodeURIComponent(slug)}/zaehler`), []),
  ]);
  if (luecken.length) melde(`Nicht alles konnte geladen werden — ${luecken[0]}`, 'neg');

  setObjekt(det.objekt);
  daten = det;
  // Ein Grundstück hat keine Einheiten — dort darf die zweite Ebene gar nicht
  // erst auftauchen, auch nicht über einen alten Link.
  einheiten = istGrundstueck() ? [] : (einheitenRoh || []);
  grundschulden = grundschuldenRoh || [];
  bereicheDaten = bereiche || {};
  zaehlerListe = Array.isArray(zaehlerRoh) ? zaehlerRoh : [];
  setObjektEigentuemer([...new Set((anteile?.anteile || [])
    .map(a => a.name).filter(Boolean))]);
  // CCCXXXV — Namen aller app-weit geführten Eigentümer (Personen).
  setAlleEigentuemer([...new Set((Array.isArray(eigentuemerAlle) ? eigentuemerAlle : [])
    .map(e => e && e.name).filter(Boolean))]);
  fokus = fokusWunsch
    ? (einheiten.find(e => String(e.id) === String(fokusWunsch)) || null)
    : null;
  if (fokusWunsch && !fokus) {
    melde('Diese Einheit gibt es nicht mehr — hier steht das ganze Haus.', '');
  }

  // N70 — im Kopf steht der kanonische Immobilientitel „(Ort) Straße", nie ein
  // versehentlich als `name` gespeicherter Einheitenname („Wohnung 1.OG").
  // Im Einheiten-Fokus zeigt der Kopf weiterhin die Einheit.
  titel.textContent = fokus ? fokus.bezeichnung : (objekt.titel || objekt.name);
  document.getElementById('barlogo').innerHTML = logoSvg(objekt.typ);
  // Der Ort enthaelt oft schon die Einheitenzahl ("Mixed-Use · 7 Einheiten") —
  // dann nicht zusaetzlich zaehlen, sonst steht es doppelt und die Zeile bricht um.
  const ortText = (objekt.ort || objekt.strasse || '').trim();
  if (fokus) {
    // Im Fokus beschreibt die Unterzeile die Einheit. Das Haus steht in der
    // Karte darunter — hier stünde es ein zweites Mal.
    sub.textContent = [fokus.nutzungsart,
                       fokus.flaeche ? flaecheText(fokus.flaeche) : '',
                       fokus.mieter].filter(Boolean).join(' · ') || 'Einheit';
  } else if (istGrundstueck()) {
    // CCCXXXVI — der Objektname allein sagt beim Grundstück wenig. Die Unterzeile
    // trägt deshalb die Flurnummer: Ort · Gemarkung · Flur · Nutzungsart · Fläche.
    // Einzeilig gekürzt (siehe #sub im <style>), damit nichts umbricht.
    const flaeche = objekt.grundstueck_flaeche
      ? `${Number(objekt.grundstueck_flaeche).toLocaleString('de-DE')} m²` : '';
    sub.textContent = [ortText,
                       objekt.gemarkung && `Gemarkung ${objekt.gemarkung}`,
                       objekt.flurstueck && `Flur ${objekt.flurstueck}`,
                       objekt.grundstueck_nutzungsart, flaeche]
      .filter(Boolean).join(' · ') || 'Grundstück';
  } else {
    sub.textContent = /einheit|wohnung/i.test(ortText) || !ortText
      ? (ortText || `${det.einheiten.length} Einheit${det.einheiten.length === 1 ? '' : 'en'}`)
      : `${ortText} · ${det.einheiten.length} Einheit${det.einheiten.length === 1 ? '' : 'en'}`;
  }

  const laufend = det.zeitraeume.find(z => z.status === 'in Arbeit');
  // N… — leere Zeiträume (0 Kostenpositionen) blenden wir aus: sie sind
  // automatisch beim Verknüpfen von Belegen entstanden (alle mit Status
  // „in Arbeit") und drängen sich sonst (2010–2024) in die Liste. Sichtbar
  // bleibt, was Positionen hat — plus der EINE aktuelle Arbeitsstand, der
  // jüngste offene Zeitraum, damit man immer eine laufende Abrechnung hat.
  // Die verborgenen (mit Belegen) bietet ein dezenter Aufklapper an, damit sie
  // erreichbar bleiben. Kein Löschen, reine Anzeige-Logik.
  const arbeitsstand = det.zeitraeume
    .filter(z => z.status === 'in Arbeit')
    .reduce((a, z) => (a && a.ende >= z.ende ? a : z), null);
  const sichtbar = det.zeitraeume.filter(z =>
    (z.positionen || 0) > 0 || (arbeitsstand && z.id === arbeitsstand.id));
  const verborgen = det.zeitraeume.filter(z => !sichtbar.includes(z));
  const zeitraumEintrag = (z, alt) => {
    // Beim Grundstück gilt keine § 556-Mietrechtsfrist — dort steht ein
    // neutraler Zustand statt „noch X Tage" (CCC). Verborgene tragen statt der
    // Frist ihre Belegzahl, damit klar ist, warum sie hier angeboten werden.
    const chip = alt
      ? `<span class="chip">${z.belege || 0} Beleg${z.belege === 1 ? '' : 'e'}</span>`
      : z.status !== 'in Arbeit'
        ? '<span class="chip">abgeschlossen</span>'
        : istGrundstueck()
          ? '<span class="chip">in Arbeit</span>'
          : `<span class="chip ${fristKlasse(z.frist_tage)}">${esc(fristText(z.frist_tage) || 'in Arbeit')}</span>`;
    // N49 — Stand je Zeitraum: erfasste NK (Σ Positionen) und, wenn vorhanden,
    // die eingezahlten Abschläge samt Prozent + über-/unterlaufen. Nur an
    // sichtbaren (bearbeiteten) Zeiträumen; bei verborgenen wäre es 0.
    const k = z.kosten_summe || 0, a = z.abschlag_summe || 0;
    let stand = '';
    if (!alt && (k || a)) {
      const teile = [`NK erfasst <b>${eur(k)}</b>`];
      if (a > 0) {
        const pct = Math.round(k / a * 100);
        const farbe = k > a ? 'var(--neg)' : 'var(--pos)';
        teile.push(`Abschläge ${eur(a)}`,
          `<b style="color:${farbe}">${pct}%${k > a ? ' · über' : ''}</b>`);
      }
      stand = `<span class="ed" style="margin-top:3px;font-family:var(--mono);font-size:11px">${teile.join(' · ')}</span>`;
    }
    return `<button class="eintrag klick" data-zeitraum="${z.id}"
                    style="cursor:pointer${alt ? ';opacity:.66' : ''}">
        <span class="et">
          <span class="en">${z.jahr ? `Abrechnungszeitraum ${z.jahr}` : esc(z.label)}</span>
          <span class="ed">${z.jahr ? `${esc(z.label)} · ${esc(z.typ)}` : esc(z.typ)}</span>
          ${stand}</span>${chip}
        <span class="ew" style="color:var(--soft);font-family:var(--body)">›</span>
      </button>`;
  };
  const aufklapper = verborgen.length
    ? `<button class="eintrag klick" data-alte-zeitraeume="1"
              style="cursor:pointer;color:var(--soft)">
        <span class="et">
          <span class="en" style="font-weight:500;color:var(--soft)">${verborgen.length} ${verborgen.length === 1 ? 'Zeitraum' : 'Zeiträume'} mit Belegen, ohne Positionen</span>
          <span class="ed" data-alte-label>Anzeigen</span></span>
        <span class="ew" data-alte-pfeil style="color:var(--soft);font-family:var(--body)">▾</span>
      </button>
      <div data-alte-liste hidden>${verborgen.map(z => zeitraumEintrag(z, true)).join('')}</div>`
    : '';
  const zr = det.zeitraeume.length
    ? (sichtbar.map(z => zeitraumEintrag(z, false)).join('') + aufklapper)
      || `<div class="leerzeile">Noch kein Abrechnungszeitraum</div>`
    : `<div class="leerzeile">Noch kein Abrechnungszeitraum</div>`;

  // Was heute läuft: beendete Stände zählen nicht, geplante noch nicht.
  const jahresmiete = (bereiche.mieten || [])
    .filter(m => !m.beendet && !m.geplant)
    .reduce((s, m) => s + (m.kaltmiete || 0) * proJahr(m.turnus), 0);

  // Schulden und Guthaben getrennt: `restschuld_aktuell` ist beim
  // Bausparvertrag 0 und `guthaben_aktuell` beim Darlehen — die API trennt
  // beides, damit hier nichts zusammenfällt, was gegensätzlich ist.
  const restschuld = (bereiche.kredite || []).reduce(
    (s, k) => s + (k.restschuld_aktuell ?? k.restschuld ?? 0), 0);
  const guthaben = (bereiche.kredite || []).reduce(
    (s, k) => s + (k.guthaben_aktuell || 0), 0);

  // Ein Grundstück rechnet keine Mieter-Nebenkosten ab: § 556-Frist und
  // Abrechnungszeiträume gehören nicht hierher. Die Grundsteuer ist so gering,
  // dass sie ohne eigenen Zeitraum direkt im Grundstücksblock verrechnet wird
  // (CCCIII, ersetzt CCC).
  // Die Zähler-Konfig (samt Anfangsstand-Erfassung) liegt in zeitraum.html und
  // ist über einen Abrechnungszeitraum erreichbar — bevorzugt der laufende.
  const erststandZielId = (laufend && laufend.id != null) ? laufend.id
    : (det.zeitraeume[0] && det.zeitraeume[0].id != null ? det.zeitraeume[0].id : null);
  const zeitraumBlock = istGrundstueck() ? '' : `
    <div class="sekopf"><h2 class="sec">Abrechnungszeiträume</h2>
      ${fokus ? '' : `<span class="sekopf-akt">
        <button data-zeitraum-werkzeug="1">Umstellen</button>
        <button data-zeitraum-neu="1">Anlegen</button></span>`}</div>
    <div class="liste">${zr}</div>
    ${fokus ? `<div class="fussnote">Abgerechnet wird immer das ganze Haus;
      im Zeitraum steht, was davon auf diese Einheit entfällt.</div>` : ''}
    ${erststandHtml(erststandZielId)}`;

  if (fokus) {
    // CLXVIII — im Fokus zählen die Mieterthemen. Stammdaten, Eigentümer,
    // Kredite, Versicherungen, Steuer und Ablage gehören dem Haus und werden
    // hier bewusst nicht wiederholt.
    const eigene = (bereiche.mieten || [])
      .filter(m => zuEinheit(m) === fokus.bezeichnung);
    // CCCXLVI — keine zweite „Zurück zum Haus"-Titelkarte mehr: die Kopfzeile
    // bezieht sich auf die Einheit (das aktuelle Element), und „‹ Zurück" oben
    // führt ohnehin ans Haus. Die geschachtelte Titelzeile entfällt.
    // N20 — kein penetranter § 556-Fristbanner mehr oben in der Einheit; die
    // Frist steht weiterhin an den Abrechnungszeiträumen. Statt der drei
    // Kennzahl-Kacheln der grafische Einstieg: Miete/NK-Verlauf mit €/m²-Linie.
    inhalt.innerHTML = `
      ${mietDiagrammHtml(eigene, effektiveFlaeche(fokus))}
      ${einheitStammHtml(fokus)}
      ${abschnitt('mieten', eigene, { imFokus: true })}
      ${zeitraumBlock}`;
    // Die ?-Icons an Wohnfläche, Terrasse, Nebenfläche und Stellplätzen dieser
    // Einheit brauchen dieselbe Verdrahtung wie die Hausansicht.
    installHilfe(inhalt);
    // Die Inline-Vorschau des ersten Lageplans nachladen (asynchron, stört den
    // Aufbau der Seite nicht).
    lageplanVorschauFuellen(inhalt);
    return;
  }

  // Mietverhältnisse, die auf keine Einheit zeigen. Sie fallen aus der
  // Kostenverteilung (Fund XCII) — deshalb stehen sie am Haus, nicht im
  // Nirgendwo. Gibt es überhaupt keine Einheiten, ist das der Normalfall und
  // die Liste heisst schlicht „Mieten & Mieter".
  const bekannt = new Set(einheiten.map(e => e.bezeichnung));
  const heimatlos = (bereiche.mieten || []).filter(m => !bekannt.has(zuEinheit(m)));
  const mietBlock = !einheiten.length
    ? abschnitt('mieten', bereiche.mieten)
    : (heimatlos.length ? abschnitt('mieten', heimatlos, {
        kopf: 'Ohne Einheit',
        vorspann: `<div class="merker"><span class="hi">!</span><span class="ht">
            <span class="t">${heimatlos.length === 1
              ? 'Ein Mietverhältnis gehört zu keiner Einheit'
              : `${heimatlos.length} Mietverhältnisse gehören zu keiner Einheit`}</span>
            <span class="d">Ohne Einheit fällt die Partei aus der
              Kostenverteilung: sie bekommt keine Kosten und ihre Vorauszahlung
              voll erstattet. Eintrag öffnen und die Einheit antippen.</span>
          </span></div>`,
      }) : '');

  // CCCXIX — die Zahlungen teilen sich auf: das Finanzamt (Steuern u. Ä.) und
  // die einmaligen Erwerbsnebenkosten stehen in getrennten Rubriken.
  const erwerbZahlungen = (bereiche.zahlungen || [])
    .filter(z => z.kategorie === ERWERB_KATEGORIE);
  const finanzZahlungen = (bereiche.zahlungen || [])
    .filter(z => z.kategorie !== ERWERB_KATEGORIE);

  // Gemeinsame Bausteine — Ablage/Cloud und der Sicherungs-/Löschblock stehen in
  // beiden Ansichten gleich.
  const ablageBlock = `
    <div class="sekopf ablage-kopf"><span class="seikon">${kostenIcon('Dokument')}</span><h2 class="sec">Dokumentenablage</h2></div>
    <div class="ablage-pfad" id="ablagePfad"></div>
    <div id="cloudbereich"><div class="cloudbox"><div class="zeile">
      <span class="sym offen">…</span>
      <span class="txt"><span class="t">wird geprüft …</span></span>
    </div></div></div>`;
  const gefahrBlock = `
    <div class="gefahr-block">
      <div class="gt">Sicherung und Löschen</div>
      <p>Die Sicherung enthält alle Daten dieser Immobilie und lässt sich
         wieder einlesen. Beim Löschen wird sie zusätzlich in die Nextcloud
         geschrieben — die dort abgelegten Unterlagen bleiben unberührt.</p>
      <button class="btn leise" data-export="1">Sicherung herunterladen</button>
      <button class="btn gefahr" data-loeschen="1">Immobilie löschen</button>
    </div>`;

  if (istGrundstueck()) {
    // CCCXXXVI — das Grundstück in drei logischen Blöcken, von grob nach fein:
    //   A) Stammdaten — was es ist (Objektart, Adresse+Flur, Fläche, Nutzungsart,
    //      Grundstückswert).
    //   B) Erwerb & Kosten — wie erworben (Erwerbsart, Kaufpreis/-datum) und die
    //      Rubriken Notar, einmalige Erwerbsnebenkosten, Finanzamt/Grundsteuer.
    //   C) Nutzung & Pacht — die Pacht und die kleine Ertragsrechnung.
    // Eigentümer und Ablage folgen den drei Blöcken.
    inhalt.innerHTML = `
      ${nachpflegeHtml(det.nachpflege)}
      ${kennzahlenHtml(vermoegen, jahresmiete, restschuld, guthaben)}
      ${grundStammHtml(objekt)}
      ${erwerbKopfHtml(objekt)}
      ${abschnitt('notarvertraege', bereiche.notarvertraege)}
      ${abschnitt('erwerbskosten', erwerbZahlungen)}
      ${grundsteuerHtml(objekt)}
      ${abschnitt('zahlungen', finanzZahlungen)}
      ${mietBlock}
      ${pachtErtragHtml(objekt, jahresmiete)}
      ${eigentuemerHtml(anteile)}
      ${ablageBlock}
      ${gefahrBlock}`;
    installHilfe(inhalt);
    cloudZeigen();
    return;
  }

  // N21 — grafischer Einstieg GANZ OBEN: Miete/NK über alle Einheiten summiert,
  // die €/m²-Linie über die effektive Gesamtfläche (Ø €/m²). Der obere
  // KPI-Streifen entfällt: Verkehrswert und Eigenkapital gehören in die
  // Eigentümerübersicht, die Jahresmiete steckt jetzt im Diagramm. Die
  // §-556-Fristleiste ist oben raus (die Frist steht an den Zeiträumen), und der
  // „Angaben fehlen noch"-Hinweis rückt zu den sonstigen Hinweisen nach unten.
  // Reihenfolge: Chart → Einheiten → Abrechnungszeiträume → Stammdaten →
  // Dokumente/sonstige Hinweise.
  const gesamtFlaeche = einheiten.reduce((s, e) => s + effektiveFlaeche(e), 0);

  inhalt.innerHTML = `
    ${mietDiagrammHtml(bereiche.mieten, gesamtFlaeche, objektSummenHtml())}
    ${einheitenHtml()}
    ${zeitraumBlock}
    ${stammHtml(objekt)}
    ${wegHtml(objekt)}
    ${ablageBlock}
    ${eigentuemerHtml(anteile)}
    ${mietBlock}
    ${abschnitt('notarvertraege', bereiche.notarvertraege)}
    ${grundschuldenHtml()}
    ${abschnitt('erwerbskosten', erwerbZahlungen)}
    ${abschnitt('versicherungen', bereiche.versicherungen, {
      vorspann: `<p class="sehinweis">Gebäude- und Haftpflichtversicherung laufen
        als jährliche Kostenart über die <strong>Nebenkosten</strong> — hier stehen
        nur <strong>zusätzliche</strong> Policen (z. B. Rechtsschutz, Elementar).</p>` })}
    ${abschnitt('kredite', bereiche.kredite)}
    ${abschnitt('zahlungen', finanzZahlungen)}
    ${nachpflegeHtml(det.nachpflege)}
    ${gefahrBlock}`;

  installHilfe(inhalt);
  cloudZeigen();
}

/* ---- CCCIX/CCCX/CCCXI — Zuordnen-Dialog -----------------------------------
   Drei Fragen in einem Blatt: Wohin gehört das Dokument (Rubrik)? Wird daraus
   eine Kostenposition oder ist es nur ein Info-Beleg? Und hängt es an einem
   bestehenden Eintrag (z. B. die Bestätigung an ihrem Kaufvertrag)? */
const RUBRIK_WAHL = [
  { wert: 'notarvertraege', titel: 'Notarverträge', ikon: 'Notarvertrag',
    typ: 'notarvertrag', wiederkehrend: false },
  { wert: 'zahlungen', titel: 'Finanzamt', ikon: 'Finanzamt',
    typ: 'zahlung', wiederkehrend: true },
  { wert: 'nebenkosten', titel: 'Nebenkosten', ikon: 'Nebenkosten',
    typ: 'kostenposition', wiederkehrend: true },
  // CCCXIX — dritte Belegart: einmalige Erwerbsnebenkosten (Notar, Makler …).
  { wert: 'erwerbskosten', titel: 'Erwerbsnebenkosten', ikon: 'Erwerbsnebenkosten',
    typ: 'zahlung', wiederkehrend: false },
  { wert: 'mieten', titel: 'Pacht & Erträge', ikon: 'Miete',
    typ: 'miete', wiederkehrend: true, nurHaus: false },
  { wert: 'versicherungen', titel: 'Versicherungen', ikon: 'Versicherung',
    typ: 'versicherung', wiederkehrend: true, nurHaus: true },
  { wert: 'kredite', titel: 'Kredite', ikon: 'Kredit',
    typ: 'kredit', wiederkehrend: true, nurHaus: true },
];

function zuordnenDialog(dok, vorgabe, umhaengen = false) {
  const wahlen = RUBRIK_WAHL.filter(r => !(r.nurHaus && istGrundstueck()));
  let rubrik = vorgabe && wahlen.some(r => r.wert === vorgabe) ? vorgabe
    : (wahlen[0] && wahlen[0].wert);
  let art = 'position';
  let anId = '';

  return new Promise(fertig => {
    const dlg = document.createElement('dialog');
    dlg.className = 'immo-dlg zuord-dlg';
    document.body.appendChild(dlg);
    dlg.addEventListener('close', () => dlg.remove());
    dlg.addEventListener('cancel', () => fertig(null));

    const male = () => {
      const cfg = wahlen.find(r => r.wert === rubrik) || wahlen[0];
      // Bestehende Einträge derselben Rubrik — daran lässt sich anhängen.
      // Erwerbsnebenkosten und Finanzamt teilen sich die Zahlungen und werden
      // über die Kategorie auseinandergehalten (CCCXIX).
      const roh = cfg.wert === 'erwerbskosten'
        ? (bereicheDaten.zahlungen || []).filter(z => z.kategorie === ERWERB_KATEGORIE)
        : cfg.wert === 'zahlungen'
          ? (bereicheDaten.zahlungen || []).filter(z => z.kategorie !== ERWERB_KATEGORIE)
          : (bereicheDaten[cfg.wert] || []);
      const eintraege = roh.map(e => ({
        id: e.id,
        text: (cfgFuer(cfg.wert)?.name?.(e)) || e.art || e.bezeichnung || `#${e.id}`,
      }));
      dlg.innerHTML = `
        <div class="zd-kopf">
          <span class="zd-t">${umhaengen ? 'Umhängen' : 'Zuordnen'}</span>
          <button class="zd-x" data-nein aria-label="Schließen">×</button>
        </div>
        <p class="zd-datei">${esc(dok.dateiname)}</p>
        ${umhaengen ? `<button class="zd-loesen" data-entfernen>Zuordnung ganz lösen
          — Beleg wieder offen</button>` : ''}

        <div class="zd-block"><span class="zd-l">Wohin gehört es?</span>
          <div class="zd-chips">${wahlen.map(r => `
            <button class="zd-chip${r.wert === rubrik ? ' an' : ''}" data-rubrik="${r.wert}">
              <span class="zi">${kostenIcon(r.ikon)}</span>${esc(r.titel)}</button>`).join('')}
          </div></div>

        <div class="zd-block"><span class="zd-l">Was ist es?</span>
          <div class="zd-chips">
            <button class="zd-chip${art === 'position' ? ' an' : ''}" data-art="position"
              ${cfg.wiederkehrend ? '' : ''}>Kostenposition (mit Betrag)</button>
            <button class="zd-chip${art === 'beleg' ? ' an' : ''}" data-art="beleg"
              >Nur Beleg (Information)</button>
          </div>
          <span class="zd-hint">${art === 'position'
            ? (cfg.wiederkehrend
                ? 'Wiederkehrend — trägt einen Betrag je Jahr/Turnus.'
                : 'Einmalig — trägt einen Betrag (z. B. Kaufpreis).')
            : 'Hängt ohne Betrag als Information am Eintrag, z. B. eine Bestätigung.'}</span>
        </div>

        ${eintraege.length ? `<div class="zd-block">
          <span class="zd-l">An einen bestehenden Eintrag hängen?</span>
          <div class="zd-chips">
            <button class="zd-chip${!anId ? ' an' : ''}" data-an="">neuer Eintrag</button>
            ${eintraege.map(e => `<button class="zd-chip${String(anId) === String(e.id)
              ? ' an' : ''}" data-an="${e.id}">${esc(e.text)}</button>`).join('')}
          </div></div>` : ''}

        <div class="zd-fuss">
          <button class="zd-ab" data-nein>Abbrechen</button>
          <button class="zd-ok" data-ja>Zuordnen</button>
        </div>`;
    };

    dlg.addEventListener('click', e => {
      const r = e.target.closest('[data-rubrik]');
      if (r) { rubrik = r.dataset.rubrik; anId = ''; male(); return; }
      const a = e.target.closest('[data-art]');
      if (a) { art = a.dataset.art; male(); return; }
      const an = e.target.closest('[data-an]');
      if (an) { anId = an.dataset.an; male(); return; }
      if (e.target.closest('[data-entfernen]')) { fertig({ entfernen: true }); dlg.close(); return; }
      if (e.target.closest('[data-nein]')) { fertig(null); dlg.close(); return; }
      if (e.target.closest('[data-ja]')) {
        const cfg = wahlen.find(x => x.wert === rubrik) || wahlen[0];
        fertig({ ziel: rubrik, art,
                 an_typ: anId ? cfg.typ : null, an_id: anId ? Number(anId) : null });
        dlg.close();
      }
    });
    male();
    dlg.showModal();
  });
}

/* ---- CCCXIII — Eintrags-Detailansicht: Daten links, Beleg rechts -----------
   Klick auf einen Eintrag (z. B. Grundsteuer) öffnet nicht mehr direkt das
   Formular, sondern eine geteilte Ansicht wie im Dokumentenmodus: links die
   Felder des Eintrags und seine Belege (Hauptbeleg + eingerückt die Info-
   Belege), rechts das PDF. Ein Beleg antippen tauscht die Vorschau, „Bearbeiten"
   führt ins bewährte Formular. Auf dem Telefon stapelt sich alles. */

async function eintragDetail(bereich, id) {
  const cfg = cfgFuer(bereich);
  const typ = AN_TYP[bereich];
  let eintrag;
  try {
    eintrag = (await api(`/objekte/${encodeURIComponent(slug)}/${endpunktBereich(bereich)}`))
      .find(x => String(x.id) === String(id));
  } catch { eintrag = null; }
  if (!eintrag) return;

  // Belege des Eintrags (nur für Typen, die das Backend kennt). Fällt der
  // Endpunkt aus (z. B. API noch nicht neu gebaut), bleibt wenigstens der
  // Quell-Beleg des Eintrags — sein `quelle_dokument_id` liegt schon vor.
  let belege = { haupt: null, unter: [] };
  if (typ) {
    try {
      belege = await api(`/dokumente/objekt/${encodeURIComponent(slug)}/eintrag/${typ}/${id}/belege`);
    } catch {
      if (eintrag.quelle_dokument_id) {
        belege = { haupt: { id: eintrag.quelle_dokument_id,
          dateiname: eintrag.beleg_dateiname || 'Beleg', jahr: eintrag.jahr },
          unter: [] };
      }
    }
  }
  const alle = [belege.haupt, ...(belege.unter || [])].filter(Boolean);

  // Felder als ruhige Zusammenfassung — dieselbe Beschreibung wie das Formular.
  const felder = felderFuer(bereich, eintrag).filter(f => !f.hilfe && f.typ !== 'block');
  const datenHtml = felder.map(f => {
    const t = feldWertText(f, eintrag[f.k]);
    return `<div class="dd-zeile"><span class="dd-l">${feldLabel(f)}</span>
      <span class="dd-v">${esc(t)}</span></div>`;
  }).join('');

  const belegItem = (d, unter) => `<button class="dd-beleg${unter ? ' unter' : ''}"
      data-doc="${d.id}" data-name="${esc(d.dateiname)}">
      <span class="dd-bi">${unter ? BELEG_ICON : HAKEN_ICON}</span>
      <span class="dd-bn">${esc(d.dateiname)}</span>
      ${d.jahr ? `<span class="dd-bj">${d.jahr}</span>` : ''}</button>`;
  // CCCLXVII — den Beleg gleich hier abfotografieren. Fehlt er, steht der Weg
  // als Knopf unter dem Hinweis; ist schon einer da, bleibt nur eine leise
  // Zeile für den nächsten. Nur für Rubriken, die das Backend als Ziel kennt.
  const scanWort = SCAN_WORT[bereich] || 'Beleg';
  // CCCLXXXIX — beim Mietverhältnis sind es Dokumente (Mietvertrag, Übergaben,
  // Kaution), keine „Belege".
  const dokLabel = bereich === 'mieten' ? 'Zugehörige Dokumente' : 'Belege';
  const typen = SCAN_TYPEN[bereich];
  // Welcher Belegtyp abfotografiert wird — bei mehreren Typen setzt ihn der Klick.
  let gewaehltWort = typen ? typen[0][0] : scanWort;
  const scanFeldHtml = `<input type="file" accept="image/*,application/pdf"
       capture="environment" multiple hidden data-scanfeld>`;
  const scanText = alle.length ? `Weiteren ${scanWort} abfotografieren`
                               : `${scanWort} abfotografieren`;
  const scanKnopf = (voll, kurz, leise) => `<button type="button" data-scan
       data-wort="${esc(voll)}" class="dd-scan${leise ? ' leise' : ''}"
       ><span class="dd-si">${KAMERA_ICON}</span
       ><span class="dd-st">${esc(kurz)}</span></button>`;
  const scanHtml = !typ ? ''
    : typen
      ? `<div class="dd-scanwahl"><span class="dd-scanlabel">Abfotografieren</span>${
          typen.map(([voll, kurz]) => scanKnopf(voll, kurz, true)).join('')
        }</div>${scanFeldHtml}`
      : scanKnopf(scanWort, scanText, alle.length) + scanFeldHtml;
  // CCCLXXXIX — beim Mietverhältnis eine Checkliste je Dokumentart in logischer
  // Reihenfolge: grüner Haken + Name (antippen zeigt es, „Ersetzen" tauscht) wo
  // vorhanden, sonst „fehlt" mit Aufnehmen-Knopf. So bleibt es EIN Dokument je Art.
  const mietChecklistHtml = () => {
    // Trennzeichen-blind vergleichen: der Dateiname trägt „Übergabeprotokoll
    // Einzug" als „…Miete-Übergabeprotokoll-Einzug" (Leerzeichen → Bindestrich,
    // vorangestelltes Kürzel), der Wahlname hat Leerzeichen. Ohne das Entfernen
    // aller Nicht-Buchstaben fiele jedes Übergabeprotokoll auf „Mietvertrag"
    // zurück und verschwände aus seiner Zeile.
    const norm = s => (s || '').toLowerCase().replace(/[^0-9a-zäöüß]+/g, '');
    // Unerkanntes (z. B. Alt-„Miete") gilt als Mietvertrag (das Hauptdokument).
    const typVon = d =>
      (typen.find(([voll]) => norm(d.dateiname).includes(norm(voll))) || [])[0] || 'Mietvertrag';
    return `<div class="dd-checkliste">${typen.map(([voll, kurz]) => {
      const da = alle.find(d => typVon(d) === voll);
      return da
        ? `<div class="dd-check da">
             <span class="dd-ci ok">${HAKEN_ICON}</span>
             <button class="dd-cn" data-doc="${da.id}" data-name="${esc(da.dateiname)}"
               >${esc(kurz)}</button>
             <button class="dd-cx" data-scan data-wort="${esc(voll)}"
               title="${esc(kurz)} ersetzen" aria-label="${esc(kurz)} ersetzen">Ersetzen</button>
           </div>`
        : `<div class="dd-check fehlt">
             <span class="dd-ci"></span>
             <span class="dd-cn leer">${esc(kurz)}</span>
             <button class="dd-cadd" data-scan data-wort="${esc(voll)}"
               aria-label="${esc(kurz)} aufnehmen">${KAMERA_ICON}<span>aufnehmen</span></button>
           </div>`;
    }).join('')}</div>${scanFeldHtml}`;
  };
  const belegeHtml = (bereich === 'mieten' && typen)
    ? mietChecklistHtml()
    : (alle.length
        ? (belege.haupt ? belegItem(belege.haupt, false) : '')
          + (belege.unter || []).map(d => belegItem(d, true)).join('')
        : `<div class="dd-keinbeleg">Noch kein Beleg
            hinterlegt — hier abfotografieren oder über den Dokumentenbaum oben anhängen.</div>`)
      + scanHtml;

  const dlg = document.createElement('dialog');
  dlg.className = 'immo-dlg detail-dlg';
  document.body.appendChild(dlg);
  // Jeder Beleg-Wechsel liefert ein eigenes Array von Object-URLs (es füllt
  // sich asynchron). Wir merken die Arrays und geben beim Schließen alles frei.
  const adressListen = [];
  dlg.addEventListener('close', () => {
    for (const liste of adressListen) liste.forEach(a => URL.revokeObjectURL(a));
    dlg.remove();
  });

  dlg.innerHTML = `
    <div class="dd-kopf">
      <span class="dd-ikon" style="color:${RUBRIKFARBE[bereich] || 'var(--teal)'}"
        >${kostenIcon(cfg.ikon)}</span>
      <span class="dd-t">${esc(cfg.name(eintrag))}</span>
      <button class="dd-x" data-zu aria-label="Schließen">×</button>
    </div>
    <div class="dd-body">
      <div class="dd-links">
        <div class="dd-daten">${datenHtml}</div>
        <div class="dd-aktionen">
          <button class="dd-edit" data-bearbeiten>✎ Bearbeiten</button>
          ${kannUmklassifizieren(bereich)
            ? `<button class="dd-edit" data-umklass>⇄ Rubrik ändern</button>` : ''}
        </div>
        <div class="dd-belege"><span class="dd-sub">${esc(dokLabel)}</span>${belegeHtml}</div>
      </div>
      <div class="dd-rechts">
        <div class="beleg-flaeche"><div class="beleg-blatt leer">${alle.length
          ? 'Tippe ein Dokument an, um es anzusehen.'
          : 'Kein Dokument zum Anzeigen.'}</div></div>
      </div>
    </div>`;
  // Fachbegriffe in der Zusammenfassung bekommen dasselbe ?-Icon wie im Formular.
  installHilfe(dlg);

  const flaeche = dlg.querySelector('.beleg-flaeche');
  // Der gerade gezeigte Beleg — er wandert beim „Bearbeiten" mit in die Maske.
  let aktuellerBeleg = null;
  const zeigeDoc = (docId, name) => {
    aktuellerBeleg = { id: Number(docId), dateiname: name };
    dlg.querySelectorAll('.dd-beleg').forEach(b =>
      b.classList.toggle('an', b.dataset.doc === String(docId)));
    adressListen.push(belegSeitenLaden(`/api/dokumente/${docId}`, flaeche,
      name || 'Beleg', `/api/dokumente/${docId}/inhalt`));
  };
  // CCCLXXXIX — das PDF wird NICHT mehr automatisch geladen; es erscheint erst,
  // wenn man ein Dokument antippt (zeigeDoc). Das hielt die Ansicht ruhig, statt
  // gleich das ganze Blatt einzublenden.

  /* CCCLXVII — die Aufnahmen laufen durch die gemeinsame Choreografie
     (`belegscan.js`): zuschneiden, mehrseitig als PDF ablegen, Textschicht
     nachtragen.

     Die Detailansicht schliesst dafür zuerst. Sie steht als `showModal()` in
     der obersten Ebene des Browsers — die Scanner-Oberfläche läge sonst
     dahinter und liesse sich nicht bedienen (kein z-index hilft dagegen).
     Danach wird sie mit dem frischen Beleg neu aufgebaut; der Nutzer landet
     wieder genau dort, wo er losgegangen ist. */
  const scanFeld = dlg.querySelector('[data-scanfeld]');
  if (scanFeld) scanFeld.addEventListener('change', async () => {
    const dateien = [...scanFeld.files];
    scanFeld.value = '';
    if (!dateien.length) return;
    dlg.close();
    let ergebnis;
    try {
      ergebnis = await belegScannen(dateien, {
        objekt: slug, kategorie: SCAN_KATEGORIE[bereich] || 'Sonstiges',
        jahr: scanJahr(eintrag), beschreibung: gewaehltWort,
        anTyp: typ, anId: id, titel: `${gewaehltWort} · ${cfg.name(eintrag)}`,
      });
    } catch (fehler) {
      // Die Ansicht bleibt bewusst zu: der Melder sitzt unter einem modalen
      // Dialog (oberste Browser-Ebene schlägt jeden z-index) und wäre sonst
      // nicht zu lesen. Der Eintrag ist einen Tipp entfernt.
      return melde(String(fehler.message || 'Der Beleg wurde nicht abgelegt.'),
                   'neg');
    }
    if (!ergebnis) return eintragDetail(bereich, id);   // abgebrochen
    // Kein Erfolgs-Toast: der frische Beleg steht gleich in der Liste und
    // sagt dasselbe — nur sichtbar und dauerhaft.
    await laden();
    return eintragDetail(bereich, id);
  });

  dlg.addEventListener('click', e => {
    if (e.target === dlg || e.target.closest('[data-zu]')) { dlg.close(); return; }
    const scanBtn = e.target.closest('[data-scan]');
    if (scanBtn) { gewaehltWort = scanBtn.dataset.wort || gewaehltWort; scanFeld.click(); return; }
    const b = e.target.closest('[data-doc]');
    if (b) { zeigeDoc(b.dataset.doc, b.dataset.name); return; }
    if (e.target.closest('[data-bearbeiten]')) {
      dlg.close();
      oeffneEintragFormular(bereich, eintrag, aktuellerBeleg);
      return;
    }
    if (e.target.closest('[data-umklass]')) {
      const ziele = UMKLASS_ZIELE.filter(z => z.wert !== bereich);
      wahl('Rubrik ändern', `„${cfg.name(eintrag)}" gehört eigentlich zu …`,
           ziele.map(z => ({ wert: z.wert, text: z.titel }))).then(async gewaehlt => {
        if (!gewaehlt) return;
        try {
          await api(`/dokumente/eintrag/${AN_TYP[bereich]}/${id}/umklassifizieren`,
                    { method: 'POST', body: { ziel: gewaehlt } });
        } catch (fehler) {
          return melde(String(fehler.message || 'Konnte nicht geändert werden.'), 'neg');
        }
        dlg.close();
        const titel = (UMKLASS_ZIELE.find(z => z.wert === gewaehlt) || {}).titel;
        melde(`Eintrag nach „${titel}" verschoben`, 'pos');
        await laden();
      });
    }
  });
  dlg.showModal();
}

/* Das bewährte Bearbeiten-Formular — aus der Detailansicht heraus erreichbar
   und weiterhin der direkte Weg für Rubriken ohne Belegbezug. */
function oeffneEintragFormular(bereich, eintrag, beleg = null) {
  const extra = bereich === 'mieten' ? mietExtra(eintrag)
              : bereich === 'kredite' ? kreditExtra(eintrag) : '';
  const cfg = cfgFuer(bereich);
  // CCCXXIII — hat der Eintrag einen Beleg, steht er beim Bearbeiten daneben.
  const dok = beleg && beleg.id ? beleg
    : (eintrag.quelle_dokument_id
        ? { id: eintrag.quelle_dokument_id, dateiname: eintrag.beleg_dateiname }
        : null);
  return formular({ titel: `${cfg.einzahl} bearbeiten`,
                    felder: felderFuer(bereich, eintrag), bereich,
                    werte: eintrag, absicht: 'eintrag', extra, beleg: dok });
}

/* Die Ordnerstruktur lässt sich jederzeit nachträglich anlegen — auch wenn
   das Objekt längst existiert und Nextcloud erst später verbunden wurde. */
async function cloudZeigen() {
  const ziel = document.getElementById('cloudbereich');
  if (!ziel) return;
  let s;
  try {
    s = await api(`/nextcloud/objekte/${encodeURIComponent(slug)}/status`);
  } catch (fehler) {
    // Frueher verschwand der ganze Block hier kommentarlos — dann sah es aus,
    // als gaebe es die Dokumentenablage gar nicht.
    ziel.innerHTML = `<div class="cloudbox"><div class="zeile">
        <span class="sym offen">⬡</span>
        <span class="txt">
          <span class="t">Status der Ablage nicht abrufbar</span>
          <span class="d">${esc(String(fehler.message || fehler))}</span>
        </span></div>
        <div class="tat nebensache"><button data-cloud="status">Nochmal prüfen</button></div>
      </div>`;
    return;
  }

  if (s.angelegt) {
    // CCCXVI — schlank: nur „Ordner verknüpft", darunter die Filter und die
    // Dateiübersicht. Fehlende Unterordner legt ImmoCalc still selbst an; die
    // Ordner-Chipliste und der Knopf sind weg (wenig gewinnbringend).
    // CCCXXXI — der verknüpfte Pfad steht klein/kursiv direkt unter dem
    // Dokumentenablage-Header; die frühere „Ordner verknüpft"-Box entfällt.
    const pfadEl = document.getElementById('ablagePfad');
    if (pfadEl) pfadEl.textContent = s.ordner || '';
    ziel.innerHTML = `<div id="dokbaum"></div>`;
    // Fehlt ein Unterordner der Vorlage, wird er im Hintergrund angelegt —
    // ohne Knopf. Erst prüfen (fehlend?), dann nur bei Bedarf anlegen.
    ordnerAutoAnlegen();
    baumZeigen();
    return;
  }

  if (!s.cloud_verbunden) {
    ziel.innerHTML = `<div class="cloudbox"><div class="zeile">
        <span class="sym offen">⬡</span>
        <span class="txt">
          <span class="t">Nextcloud ist noch nicht verbunden</span>
          <span class="d">Das Objekt ist gespeichert. Sobald du die Verbindung
            einrichtest, kannst du die Ordnerstruktur hier nachträglich anlegen.</span>
        </span></div>
        <div class="tat"><a href="settings.html">Verbindung einrichten</a></div>
      </div>`;
    return;
  }

  if (!s.home) {
    ziel.innerHTML = `<div class="cloudbox"><div class="zeile">
        <span class="sym offen">▣</span>
        <span class="txt">
          <span class="t">Kein Home-Ordner gewählt</span>
          <span class="d">Wähle den Ordner, unter dem die Immobilien liegen.</span>
        </span></div>
        <div class="tat"><a href="settings.html">Home-Ordner wählen</a></div>
      </div>`;
    return;
  }

  ziel.innerHTML = `<div class="cloudbox"><div class="zeile">
      <span class="sym offen">＋</span>
      <span class="txt">
        <span class="t">Ordnerstruktur noch nicht angelegt</span>
        <span class="d">Wird angelegt unter <b>${esc(s.vorschlag)}</b> —
          vorhandene Ordner und Dateien bleiben unberührt.</span>
      </span></div>
      <div class="tat"><button data-cloud="struktur">Ordnerstruktur anlegen</button></div>
    </div>`;
}

/* CCCXVI — fehlt ein Unterordner der Vorlage, legt ImmoCalc ihn still an
   (kein Knopf). Nur wenn wirklich etwas fehlt, geht eine Anfrage raus; danach
   frischt sich der Baum auf, damit neue Ordner sofort sichtbar sind. */
async function ordnerAutoAnlegen() {
  try {
    const s = await api(`/nextcloud/objekte/${encodeURIComponent(slug)}/ordner`);
    if ((s.fehlend || []).length) {
      await api(`/nextcloud/objekte/${encodeURIComponent(slug)}/struktur`,
                { method: 'POST' });
      baumZeigen();
    }
  } catch { /* Ordner nicht lesbar — der Baum zeigt trotzdem, was da ist */ }
}

/* ---- Formular: eine Fabrik für alle Bereiche ---- */

/* CXLVII — welches Zeichen rechts im Eingabefeld steht. Geld ist immer Euro,
   alles andere sagt es selbst („m²", „%"). Leer heisst: schmuckloses Feld. */
const feldEinheit = f => (f.geld ? '€' : f.einheit) || '';

/* Beschriftung eines Feldes — bei echten Fachbegriffen (`f.lex`) mit einem
   ?-Hilfe-Platzhalter. `installHilfe` macht nach dem Rendern ein anklickbares
   Icon daraus. Triviale Felder (Name, Betrag, Bank) tragen kein `lex`. */
const feldLabel = f => `${esc(f.l)}${
  f.lex ? ` <span data-hilfe="${esc(f.lex)}"></span>` : ''}`;

async function feldHtml(f, bereich, wert) {
  const id = `f_${f.k}`;
  if (f.typ === 'auswahl') {
    // Kein natives <select>: die aufgeklappte Liste zeichnete sonst das
    // Betriebssystem. Der wirkliche Wert steht im versteckten Feld, damit
    // `ausFormular` ihn wie bei jedem anderen Feld findet.
    // Beschriftung ohne `for`: den Knopf baut auswahl.js selbst und gibt ihm
    // eine eigene id — die Verknüpfung läuft über aria-label.
    // `ohneLeer`: eine Vertragsart gibt es immer — „nicht gewählt" wäre dort
    // keine mögliche Antwort, sondern eine Lücke im Datenmodell.
    const werte = f.ohneLeer ? f.werte : ['', ...f.werte];
    const gesetzt = wert ?? f.vorgabe ?? '';
    return `<div class="field"><label>${feldLabel(f)}</label>
      <input type="hidden" id="${id}" name="${f.k}" value="${esc(gesetzt)}">
      <div data-auswahl="${esc(f.k)}" data-label="${esc(f.l)}"
           ${f.umbau ? 'data-umbau="1"' : ''}
           data-optionen="${esc(JSON.stringify(werte))}"></div>
      ${f.note ? `<span class="feldnote">${esc(f.note)}</span>` : ''}</div>`;
  }
  if (f.typ === 'einheit') {
    // CLXIX — die Einheit wird angetippt, nicht getippt. Freitext liess einen
    // Tippfehler durch, und die Partei fiel stumm aus der Kostenverteilung
    // (Fund XCII). Ohne erfasste Einheiten bleibt es ein Textfeld: sonst
    // liesse sich an einem Bestandsobjekt gar kein Mietverhältnis anlegen.
    if (!einheiten.length) {
      return `<div class="field"><label for="${id}">${esc(f.l)}</label>
        <input class="inp" id="${id}" name="${f.k}" type="text"
               value="${esc(wert ?? '')}"></div>`;
    }
    const gewaehlt = wert ?? (einheiten.length === 1
      ? einheiten[0].bezeichnung : '');
    const blasen = einheiten.map(e => {
      const an = e.bezeichnung === gewaehlt;
      return `<button type="button" class="bubble${an ? ' gewaehlt' : ''}${
          e.vermietet ? '' : ' frei'}" data-wahl="${esc(e.bezeichnung)}"
          aria-pressed="${an}">
        <span class="bt">${esc(e.bezeichnung)}</span>
        ${e.flaeche ? `<span class="bf">${flaecheText(e.flaeche)}</span>` : ''}
        ${e.vermietet ? '' : '<span class="bfrei">frei</span>'}
      </button>`;
    }).join('');
    return `<div class="field"><label>${esc(f.l)}</label>
      <input type="hidden" id="${id}" name="${f.k}" value="${esc(gewaehlt)}">
      <div class="bubbles" data-wahlfeld="${esc(f.k)}" role="group"
           aria-label="${esc(f.l)}">${blasen}</div>
      <span class="feldnote">Antippen statt tippen — nur so findet die
        Kostenverteilung die Einheit wieder.</span></div>`;
  }
  if (f.typ === 'anteileinheit') {
    // CLXI — worauf ein Eigentümer-Anteil zeigt: das ganze Haus oder eine
    // Einheit. „Ganzes Haus" steht als erste Blase und ist vorgewählt — der
    // gewachsene Fall bleibt der Normalfall. Dieselbe Blasen-Verdrahtung wie
    // bei der Einheitenwahl der Miete (data-wahl/data-wahlfeld).
    const gewaehlt = wert ?? '';
    const blase = (w, text, extra) => {
      const an = w === gewaehlt;
      return `<button type="button" class="bubble${an ? ' gewaehlt' : ''}"
          data-wahl="${esc(w)}" aria-pressed="${an}">
        <span class="bt">${esc(text)}</span>${extra || ''}</button>`;
    };
    const blasen = blase('', 'Ganzes Haus')
      + einheiten.map(e => blase(e.bezeichnung, e.bezeichnung,
          e.flaeche ? `<span class="bf">${flaecheText(e.flaeche)}</span>` : '')).join('');
    return `<div class="field"><label>${esc(f.l)}</label>
      <input type="hidden" id="${id}" name="${f.k}" value="${esc(gewaehlt)}">
      <div class="bubbles" data-wahlfeld="${esc(f.k)}" role="group"
           aria-label="${esc(f.l)}">${blasen}</div>
      <span class="feldnote">Gehört dem Eigentümer nur eine Wohnung, hier die
        Einheit wählen — sonst „Ganzes Haus". Einheit-Anteile haben Vorrang für
        ihre Einheit, der Haus-Anteil deckt den Rest.</span></div>`;
  }
  // Turnus und Auswahllisten tragen dasselbe eigene Auswahlfeld wie `auswahl`
  // — ein natives <select> zeichnet sonst das Betriebssystem und fällt aus dem
  // Design der Seite (blaue Kästen, eckige Liste).
  if (f.typ === 'turnus') {
    const { optionen, vorgabe } = await turnusOptionen(bereich);
    const gewaehlt = wert ?? f.vorgabe ?? vorgabe;
    return `<div class="field"><label>${feldLabel(f)}</label>
      <input type="hidden" id="${id}" name="${f.k}" value="${esc(gewaehlt)}">
      <div data-auswahl="${esc(f.k)}" data-label="${esc(f.l)}"
           data-optionen="${esc(JSON.stringify(optionen))}"></div>
      ${f.note ? `<span class="feldnote">${esc(f.note)}</span>` : ''}</div>`;
  }
  if (f.typ === 'select') {
    return `<div class="field"><label>${feldLabel(f)}</label>
      <input type="hidden" id="${id}" name="${f.k}" value="${esc(wert ?? '')}">
      <div data-auswahl="${esc(f.k)}" data-label="${esc(f.l)}"
           data-optionen="${esc(JSON.stringify(f.werte))}"></div>
      ${f.note ? `<span class="feldnote">${esc(f.note)}</span>` : ''}</div>`;
  }
  if (f.typ === 'ja_nein') {
    const ja = wert === undefined ? true : Boolean(wert);
    return `<div class="field"><label for="${id}">${esc(f.l)}</label>
      <select class="inp" id="${id}" name="${f.k}">
        <option value="ja" ${ja ? 'selected' : ''}>ja</option>
        <option value="nein" ${ja ? '' : 'selected'}>nein</option>
      </select></div>`;
  }
  if (f.typ === 'schalter') {
    // CXCIII — ein gedeckter Ja/Nein-Schalter im Stil der Seite, kein natives
    // Kästchen. Er borgt sich die Blasen-Verdrahtung (data-wahl/-wahlfeld): der
    // echte Wert steht im versteckten Feld, `ausFormular` liest ihn als bool.
    const ja = wert == null ? (f.vorgabe == null ? true : Boolean(f.vorgabe))
                            : Boolean(wert);
    const knopf = (w, an, text) => `<button type="button"
        class="schaltknopf${an ? ' an' : ''}" data-wahl="${w}"
        aria-pressed="${an}">${text}</button>`;
    return `<div class="field"><label>${feldLabel(f)}</label>
      <input type="hidden" id="${id}" name="${f.k}" value="${ja ? 'ja' : 'nein'}">
      <div class="schalter" data-wahlfeld="${esc(f.k)}" role="group"
           ${f.umbau ? 'data-umbau="1"' : ''} aria-label="${esc(f.l)}">
        ${knopf('ja', ja, 'Ja')}${knopf('nein', !ja, 'Nein')}
      </div>
      ${f.note ? `<span class="feldnote">${esc(f.note)}</span>` : ''}</div>`;
  }
  const v = wert == null ? (f.vorgabe != null ? f.vorgabe : '') : wert;
  // Felder mit Einheit sind Textfelder: ein <input type="number"> nimmt keine
  // Tausenderpunkte an und stellte seine Pfeilchen genau dorthin, wo das
  // Zeichen sitzt. Die Zifferntastatur bleibt über inputmode erhalten.
  const einheit = feldEinheit(f);
  const typ = einheit ? 'text' : f.typ;
  const zusatz = einheit ? 'inputmode="decimal"'
                         : (f.schritt ? `step="${f.schritt}"` : '');
  return `<div class="field"><label for="${id}">${feldLabel(f)}</label>
    <input class="inp" id="${id}" name="${f.k}" type="${typ}" ${zusatz}
           value="${esc(v)}" ${f.pflicht ? 'required' : ''}>
    ${f.note ? `<span class="feldnote" id="n_${f.k}">${esc(f.note)}</span>` : ''}</div>`;
}

/* Lesbare Eingabe anhängen — und beim Schliessen wieder lösen, sonst häufen
   sich die Beobachter mit jedem geöffneten Dialog. */
let formate = [];

function formateLoesen() {
  for (const f of formate) {
    try { f.zerstoere(); } catch { /* schon weg */ }
  }
  formate = [];
}

function formateSetzen(form, felder) {
  formateLoesen();
  if (!eingabe) return;
  for (const f of felder) {
    const el = form.elements[f.k];
    if (!el || el.tagName !== 'INPUT') continue;
    const einheit = feldEinheit(f);
    const bauer = einheit ? feld => eingabe.geldFeld(feld, einheit)
                : f.iban ? eingabe.ibanFeld
                : f.steuer ? eingabe.steuernummerFeld : null;
    if (typeof bauer !== 'function') continue;
    try {
      const griff = bauer(el);
      if (griff && typeof griff.zerstoere === 'function') formate.push(griff);
    } catch { /* eine Formatierung ist kein Muss */ }
  }
}

/* Auswahlfelder im eigenen Design — je Dialog neu gebaut und beim Schliessen
   wieder abgeräumt, wie die Formatierungen darüber. */
let auswahlen = [];

function auswahlLoesen() {
  for (const a of auswahlen) {
    try { a.zerstoere(); } catch { /* schon weg */ }
  }
  auswahlen = [];
}

function auswahlSetzen(form) {
  auswahlLoesen();
  for (const halter of form.querySelectorAll('[data-auswahl]')) {
    const feld = form.elements[halter.dataset.auswahl];
    if (!feld) continue;
    // Reine Zeichenketten (Nutzungsart, Erwerbsart …) oder Wert/Text-Paare
    // (Turnus: „jaehrlich" heisst „jährlich").
    const optionen = JSON.parse(halter.dataset.optionen)
      .map(w => (w && typeof w === 'object')
        ? { wert: w.wert, text: w.text }
        : { wert: w, text: w || 'nicht gewählt' });
    auswahlen.push(auswahlfeld(halter, {
      optionen, wert: feld.value, label: halter.dataset.label,
      aenderung: neu => {
        feld.value = neu;
        // Ein Feld, das die Maske umstellt (die Vertragsart), baut das
        // Formular neu — aber erst im nächsten Anlauf: sonst zöge sich das
        // Auswahlfeld sein eigenes DOM unter den Füssen weg.
        if (halter.dataset.umbau && dialogUmbau) setTimeout(dialogUmbau, 0);
      },
    }));
  }
}

/* CXLVIII — Zinssatz und Zinsanteil je Monat halten sich gegenseitig aktuell.
   Wer den Satz kennt, tippt ihn; wer nur den Zinsanteil aus dem Kontoauszug
   hat, tippt den — beides führt zum selben Ergebnis. Gespeichert wird der
   Zinssatz.

   Die Regel dahinter steht in `api/app/vermoegen.py` (`monatszins` und
   `zinssatz_aus_monatszins`) und ist dort geprüft; hier wird sie nur
   angezeigt, damit die Zahl schon während des Tippens dasteht. Wer sie ändert,
   ändert sie an beiden Stellen. */
const ZINSTEXT = {
  ja: 'Eines von beidem genügt — das andere ergibt sich aus der Restschuld.',
  nein: 'Ohne Restschuld lässt sich das nicht umrechnen — trag sie oben ein.',
};

function zinsKopplung(form) {
  const satz = form.querySelector('#f_zinssatz');
  const monat = form.querySelector('#f_zins_monat');
  const rest = form.querySelector('#f_restschuld');
  const note = form.querySelector('#n_zins_monat');
  if (!satz || !monat || !rest) return;
  // Das Nachtragen im anderen Feld ist keine Eingabe des Nutzers.
  let rechnet = false;
