let baumMehr = new Set();               // Äste, die alles zeigen

async function baumZeigen() {
  const ziel = document.getElementById('dokbaum');
  if (!ziel) return;
  try {
    baumDaten = await api(`/dokumente/objekt/${encodeURIComponent(slug)}/baum`);
  } catch { ziel.innerHTML = ''; return; }
  baumMalen();
}

function baumMalen() {
  const ziel = document.getElementById('dokbaum');
  if (!ziel || !baumDaten) return;
  const aeste = baumDaten.aeste || [];
  if (!aeste.length) {
    ziel.innerHTML = `<div class="baumleer">Noch keine Dokumente in der Ablage
      dieser Immobilie.</div>`;
    return;
  }
  const chip = (wert, text, ikon, farbe, zahl) => `
    <button class="bfilter${baumFilter === wert ? ' an' : ''}" data-bfilter="${esc(wert)}"
            ${farbe ? `style="--bf:${farbe}"` : ''}>
      ${ikon ? `<span class="bi">${kostenIcon(ikon)}</span>` : ''}${esc(text)}
      <span class="bz">${zahl}</span></button>`;

  const filter = [chip('', 'Alle', 'Dokument', 'var(--ink)', baumDaten.gesamt)]
    .concat(aeste.map(a => chip(a.ordner, ordnerTitel(a), ordnerIkon(a.ordner),
                                ordnerFarbe(a.ordner), a.anzahl))).join('');

  // Eine Frucht (Dokument) — optional eingerückt als Kind einer Hauptdatei.
  // Ist es zugeordnet, ist das Statuszeichen ein Knopf: antippen zum Umhängen.
  const frucht = (d, farbe, kind = false) => `
      <div class="frucht${d.zugeordnet ? '' : ' offen'}${kind ? ' kind' : ''}"
           data-dok="${d.id}">
        <span class="fp" style="background:${d.zugeordnet ? farbe : 'transparent'};
              border-color:${farbe}"></span>
        <span class="fn" data-beleg="${d.id}"
              data-name="${esc(d.dateiname)}">${esc(d.dateiname)}</span>
        ${d.zugeordnet
          ? `<button class="fstatus${d.info ? ' info' : ' pos'}"
               data-umhaengen="${d.id}" data-rubrik="${esc(ORDNER_RUBRIK[a_ordner] || '')}"
               title="${d.info ? 'Als Beleg angehängt' : 'Einem Eintrag zugeordnet'}
 — antippen zum Umhängen">${d.info ? BELEG_ICON : HAKEN_ICON}</button>`
          : `<button class="fzu" data-zuordnen="${d.id}"
               data-rubrik="${esc(ORDNER_RUBRIK[a_ordner] || '')}"
               title="Diesem Beleg einen Eintrag anlegen">zuordnen</button>`}
      </div>`;

  let a_ordner = '';
  const gezeigt = baumFilter ? aeste.filter(a => a.ordner === baumFilter) : aeste;
  const zweige = gezeigt.map(a => {
    a_ordner = a.ordner;
    const farbe = ordnerFarbe(a.ordner);
    // CCCXVII — Kinder (Info-Belege) unter ihre Hauptdatei einrücken, aber nur,
    // wenn die Hauptdatei im selben Ordner liegt. Liegt sie woanders, steht das
    // Kind eigenständig hier (sonst verschwände es aus dem Baum).
    const idsHier = new Set(a.dokumente.map(d => d.id));
    const kinderVon = new Map();
    for (const d of a.dokumente) if (d.unter && idsHier.has(d.unter)) {
      if (!kinderVon.has(d.unter)) kinderVon.set(d.unter, []);
      kinderVon.get(d.unter).push(d);
    }
    const oberste = a.dokumente.filter(d => !d.unter || !idsHier.has(d.unter));
    const alle = baumMehr.has(a.ordner);
    const docs = alle ? oberste : oberste.slice(0, PRO_AST);
    const fruechte = docs.map(d =>
      frucht(d, farbe) + (kinderVon.get(d.id) || [])
        .map(k => frucht(k, farbe, true)).join('')).join('');
    const rest = oberste.length - docs.length;
    return `<section class="zweig" style="--zw:${farbe}">
      <div class="zkopf">
        <span class="zi">${kostenIcon(ordnerIkon(a.ordner))}</span>
        <span class="zt"><span class="zn">${esc(ordnerTitel(a))}</span>
          <span class="zo">${esc(a.ordner || 'im Hauptordner')}</span></span>
        <span class="zz">${a.offen ? `${a.offen} offen` : 'alles zugeordnet'}</span>
      </div>
      <div class="fruechte">${fruechte}</div>
      ${rest > 0 ? `<button class="mehrbtn" data-bmehr="${esc(a.ordner)}"
          >… ${rest} weitere zeigen</button>` : ''}
    </section>`;
  }).join('');

  ziel.innerHTML = `<div class="bfilter-leiste">${filter}</div>
    <div class="baum-legende">
      <span class="bl-hak">${HAKEN_ICON}</span> einem Eintrag zugeordnet
      <span class="bl-bel">${BELEG_ICON}</span> als Beleg angehängt
      <span class="bl-off">○</span> noch offen — antippen zum Zuordnen
    </div>
    <div class="baum">${zweige}</div>`;
}

/* ---- CCCIX/CCCX/CCCXI — Zuordnen-Dialog -----------------------------------
   Drei Fragen in einem Blatt: Wohin gehört das Dokument (Rubrik)? Wird daraus
   eine Kostenposition oder ist es nur ein Info-Beleg? Und hängt es an einem
   bestehenden Eintrag (z. B. die Bestätigung an ihrem Kaufvertrag)? */
const RUBRIK_WAHL = [
  { wert: 'notarvertraege', titel: 'Notarverträge', ikon: 'Notarvertrag',
    typ: 'notarvertrag', wiederkehrend: false },
  { wert: 'zahlungen', titel: 'Finanzamt', ikon: 'Finanzamt',
    typ: 'zahlung', wiederkehrend: true },
  { wert: 'nebenkosten', titel: 'Nebenkosten', ikon: 'Nebenkosten',
    typ: 'kostenposition', wiederkehrend: true },
  // CCCXIX — dritte Belegart: einmalige Erwerbsnebenkosten (Notar, Makler …).
  { wert: 'erwerbskosten', titel: 'Erwerbsnebenkosten', ikon: 'Erwerbsnebenkosten',
    typ: 'zahlung', wiederkehrend: false },
  { wert: 'mieten', titel: 'Pacht & Erträge', ikon: 'Miete',
    typ: 'miete', wiederkehrend: true, nurHaus: false },
  { wert: 'versicherungen', titel: 'Versicherungen', ikon: 'Versicherung',
    typ: 'versicherung', wiederkehrend: true, nurHaus: true },
  { wert: 'kredite', titel: 'Kredite', ikon: 'Kredit',
    typ: 'kredit', wiederkehrend: true, nurHaus: true },
];

function zuordnenDialog(dok, vorgabe, umhaengen = false) {
  const wahlen = RUBRIK_WAHL.filter(r => !(r.nurHaus && istGrundstueck()));
  let rubrik = vorgabe && wahlen.some(r => r.wert === vorgabe) ? vorgabe
    : (wahlen[0] && wahlen[0].wert);
  let art = 'position';
  let anId = '';

  return new Promise(fertig => {
    const dlg = document.createElement('dialog');
    dlg.className = 'immo-dlg zuord-dlg';
    document.body.appendChild(dlg);
    dlg.addEventListener('close', () => dlg.remove());
    dlg.addEventListener('cancel', () => fertig(null));

    const male = () => {
      const cfg = wahlen.find(r => r.wert === rubrik) || wahlen[0];
      // Bestehende Einträge derselben Rubrik — daran lässt sich anhängen.
      // Erwerbsnebenkosten und Finanzamt teilen sich die Zahlungen und werden
      // über die Kategorie auseinandergehalten (CCCXIX).
      const roh = cfg.wert === 'erwerbskosten'
        ? (bereicheDaten.zahlungen || []).filter(z => z.kategorie === ERWERB_KATEGORIE)
        : cfg.wert === 'zahlungen'
          ? (bereicheDaten.zahlungen || []).filter(z => z.kategorie !== ERWERB_KATEGORIE)
          : (bereicheDaten[cfg.wert] || []);
      const eintraege = roh.map(e => ({
        id: e.id,
        text: (cfgFuer(cfg.wert)?.name?.(e)) || e.art || e.bezeichnung || `#${e.id}`,
      }));
      dlg.innerHTML = `
        <div class="zd-kopf">
          <span class="zd-t">${umhaengen ? 'Umhängen' : 'Zuordnen'}</span>
          <button class="zd-x" data-nein aria-label="Schließen">×</button>
        </div>
        <p class="zd-datei">${esc(dok.dateiname)}</p>
        ${umhaengen ? `<button class="zd-loesen" data-entfernen>Zuordnung ganz lösen
          — Beleg wieder offen</button>` : ''}

        <div class="zd-block"><span class="zd-l">Wohin gehört es?</span>
          <div class="zd-chips">${wahlen.map(r => `
            <button class="zd-chip${r.wert === rubrik ? ' an' : ''}" data-rubrik="${r.wert}">
              <span class="zi">${kostenIcon(r.ikon)}</span>${esc(r.titel)}</button>`).join('')}
          </div></div>

        <div class="zd-block"><span class="zd-l">Was ist es?</span>
          <div class="zd-chips">
            <button class="zd-chip${art === 'position' ? ' an' : ''}" data-art="position"
              ${cfg.wiederkehrend ? '' : ''}>Kostenposition (mit Betrag)</button>
            <button class="zd-chip${art === 'beleg' ? ' an' : ''}" data-art="beleg"
              >Nur Beleg (Information)</button>
          </div>
          <span class="zd-hint">${art === 'position'
            ? (cfg.wiederkehrend
                ? 'Wiederkehrend — trägt einen Betrag je Jahr/Turnus.'
                : 'Einmalig — trägt einen Betrag (z. B. Kaufpreis).')
            : 'Hängt ohne Betrag als Information am Eintrag, z. B. eine Bestätigung.'}</span>
        </div>

        ${eintraege.length ? `<div class="zd-block">
          <span class="zd-l">An einen bestehenden Eintrag hängen?</span>
          <div class="zd-chips">
            <button class="zd-chip${!anId ? ' an' : ''}" data-an="">neuer Eintrag</button>
            ${eintraege.map(e => `<button class="zd-chip${String(anId) === String(e.id)
              ? ' an' : ''}" data-an="${e.id}">${esc(e.text)}</button>`).join('')}
          </div></div>` : ''}

        <div class="zd-fuss">
          <button class="zd-ab" data-nein>Abbrechen</button>
          <button class="zd-ok" data-ja>Zuordnen</button>
        </div>`;
    };

    dlg.addEventListener('click', e => {
      const r = e.target.closest('[data-rubrik]');
      if (r) { rubrik = r.dataset.rubrik; anId = ''; male(); return; }
      const a = e.target.closest('[data-art]');
      if (a) { art = a.dataset.art; male(); return; }
      const an = e.target.closest('[data-an]');
      if (an) { anId = an.dataset.an; male(); return; }
      if (e.target.closest('[data-entfernen]')) { fertig({ entfernen: true }); dlg.close(); return; }
      if (e.target.closest('[data-nein]')) { fertig(null); dlg.close(); return; }
      if (e.target.closest('[data-ja]')) {
        const cfg = wahlen.find(x => x.wert === rubrik) || wahlen[0];
        fertig({ ziel: rubrik, art,
                 an_typ: anId ? cfg.typ : null, an_id: anId ? Number(anId) : null });
        dlg.close();
      }
    });
    male();
    dlg.showModal();
  });
}

/* ---- CCCXIII — Eintrags-Detailansicht: Daten links, Beleg rechts -----------
   Klick auf einen Eintrag (z. B. Grundsteuer) öffnet nicht mehr direkt das
   Formular, sondern eine geteilte Ansicht wie im Dokumentenmodus: links die
   Felder des Eintrags und seine Belege (Hauptbeleg + eingerückt die Info-
   Belege), rechts das PDF. Ein Beleg antippen tauscht die Vorschau, „Bearbeiten"
   führt ins bewährte Formular. Auf dem Telefon stapelt sich alles. */
function feldWertText(f, wert) {
  if (wert == null || wert === '') return '—';
  if (f.typ === 'ja_nein' || f.typ === 'schalter') return wert ? 'Ja' : 'Nein';
  if (f.typ === 'number') {
    if (f.geld) return f.voll ? eurVoll(wert) : eur(wert);
    // Jahreszahlen ohne Tausenderpunkt (2025, nicht 2.025).
    if (/jahr/i.test(f.k)) return String(wert);
    const zahl = Number(wert);
    const txt = Number.isFinite(zahl) ? zahl.toLocaleString('de-DE') : String(wert);
    return f.einheit ? `${txt} ${f.einheit}` : txt;
  }
  if (f.typ === 'date') {
    const d = new Date(wert);
    return isNaN(d) ? String(wert) : d.toLocaleDateString('de-DE');
  }
  return String(wert);
}

async function eintragDetail(bereich, id) {
  const cfg = cfgFuer(bereich);
  const typ = AN_TYP[bereich];
  let eintrag;
  try {
    eintrag = (await api(`/objekte/${encodeURIComponent(slug)}/${endpunktBereich(bereich)}`))
      .find(x => String(x.id) === String(id));
  } catch { eintrag = null; }
  if (!eintrag) return;

  // Belege des Eintrags (nur für Typen, die das Backend kennt). Fällt der
  // Endpunkt aus (z. B. API noch nicht neu gebaut), bleibt wenigstens der
  // Quell-Beleg des Eintrags — sein `quelle_dokument_id` liegt schon vor.
  let belege = { haupt: null, unter: [] };
  if (typ) {
    try {
      belege = await api(`/dokumente/objekt/${encodeURIComponent(slug)}/eintrag/${typ}/${id}/belege`);
    } catch {
      if (eintrag.quelle_dokument_id) {
        belege = { haupt: { id: eintrag.quelle_dokument_id,
          dateiname: eintrag.beleg_dateiname || 'Beleg', jahr: eintrag.jahr },
          unter: [] };
      }
    }
  }
  const alle = [belege.haupt, ...(belege.unter || [])].filter(Boolean);

  // Felder als ruhige Zusammenfassung — dieselbe Beschreibung wie das Formular.
  const felder = felderFuer(bereich, eintrag).filter(f => !f.hilfe && f.typ !== 'block');
  const datenHtml = felder.map(f => {
    const t = feldWertText(f, eintrag[f.k]);
    return `<div class="dd-zeile"><span class="dd-l">${esc(f.l)}</span>
      <span class="dd-v">${esc(t)}</span></div>`;
  }).join('');

  const belegItem = (d, unter) => `<button class="dd-beleg${unter ? ' unter' : ''}"
      data-doc="${d.id}" data-name="${esc(d.dateiname)}">
      <span class="dd-bi">${unter ? BELEG_ICON : HAKEN_ICON}</span>
      <span class="dd-bn">${esc(d.dateiname)}</span>
      ${d.jahr ? `<span class="dd-bj">${d.jahr}</span>` : ''}</button>`;
  const belegeHtml = alle.length
    ? (belege.haupt ? belegItem(belege.haupt, false) : '')
      + (belege.unter || []).map(d => belegItem(d, true)).join('')
    : `<div class="dd-keinbeleg">Noch kein Beleg hinterlegt — über den
        Dokumentenbaum oben lässt sich einer anhängen.</div>`;

  const dlg = document.createElement('dialog');
  dlg.className = 'immo-dlg detail-dlg';
  document.body.appendChild(dlg);
  // Jeder Beleg-Wechsel liefert ein eigenes Array von Object-URLs (es füllt
  // sich asynchron). Wir merken die Arrays und geben beim Schließen alles frei.
  const adressListen = [];
  dlg.addEventListener('close', () => {
    for (const liste of adressListen) liste.forEach(a => URL.revokeObjectURL(a));
    dlg.remove();
  });

  dlg.innerHTML = `
    <div class="dd-kopf">
      <span class="dd-ikon" style="color:${RUBRIKFARBE[bereich] || 'var(--teal)'}"
        >${kostenIcon(cfg.ikon)}</span>
      <span class="dd-t">${esc(cfg.name(eintrag))}</span>
      <button class="dd-x" data-zu aria-label="Schließen">×</button>
    </div>
    <div class="dd-body">
      <div class="dd-links">
        <div class="dd-daten">${datenHtml}</div>
        <div class="dd-belege"><span class="dd-sub">Belege</span>${belegeHtml}</div>
        <div class="dd-aktionen">
          <button class="dd-edit" data-bearbeiten>✎ Bearbeiten</button>
          ${kannUmklassifizieren(bereich)
            ? `<button class="dd-edit" data-umklass>⇄ Rubrik ändern</button>` : ''}
        </div>
      </div>
      <div class="dd-rechts">
        <div class="beleg-flaeche">${alle.length
          ? '<div class="beleg-blatt lade">Beleg wird geholt …</div>'
          : '<div class="beleg-blatt leer">Kein Beleg zum Anzeigen.</div>'}</div>
      </div>
    </div>`;

  const flaeche = dlg.querySelector('.beleg-flaeche');
  // Der gerade gezeigte Beleg — er wandert beim „Bearbeiten" mit in die Maske.
  let aktuellerBeleg = null;
  const zeigeDoc = (docId, name) => {
    aktuellerBeleg = { id: Number(docId), dateiname: name };
    dlg.querySelectorAll('.dd-beleg').forEach(b =>
      b.classList.toggle('an', b.dataset.doc === String(docId)));
    adressListen.push(belegSeitenLaden(`/api/dokumente/${docId}`, flaeche,
      name || 'Beleg', `/api/dokumente/${docId}/inhalt`));
  };
  if (alle.length) {
    const erst = belege.haupt || alle[0];
    zeigeDoc(erst.id, erst.dateiname);
  }

  dlg.addEventListener('click', e => {
    if (e.target === dlg || e.target.closest('[data-zu]')) { dlg.close(); return; }
    const b = e.target.closest('[data-doc]');
    if (b) { zeigeDoc(b.dataset.doc, b.dataset.name); return; }
    if (e.target.closest('[data-bearbeiten]')) {
      dlg.close();
      oeffneEintragFormular(bereich, eintrag, aktuellerBeleg);
      return;
    }
    if (e.target.closest('[data-umklass]')) {
      const ziele = UMKLASS_ZIELE.filter(z => z.wert !== bereich);
      wahl('Rubrik ändern', `„${cfg.name(eintrag)}" gehört eigentlich zu …`,
           ziele.map(z => ({ wert: z.wert, text: z.titel }))).then(async gewaehlt => {
        if (!gewaehlt) return;
        try {
          await api(`/dokumente/eintrag/${AN_TYP[bereich]}/${id}/umklassifizieren`,
                    { method: 'POST', body: { ziel: gewaehlt } });
        } catch (fehler) {
          return melde(String(fehler.message || 'Konnte nicht geändert werden.'), 'neg');
        }
        dlg.close();
        const titel = (UMKLASS_ZIELE.find(z => z.wert === gewaehlt) || {}).titel;
        melde(`Eintrag nach „${titel}" verschoben`, 'pos');
        await laden();
      });
    }
  });
  dlg.showModal();
}

/* Das bewährte Bearbeiten-Formular — aus der Detailansicht heraus erreichbar
   und weiterhin der direkte Weg für Rubriken ohne Belegbezug. */
function oeffneEintragFormular(bereich, eintrag, beleg = null) {
  const extra = bereich === 'mieten' ? mietExtra(eintrag)
              : bereich === 'kredite' ? kreditExtra(eintrag) : '';
  const cfg = cfgFuer(bereich);
  // CCCXXIII — hat der Eintrag einen Beleg, steht er beim Bearbeiten daneben.
  const dok = beleg && beleg.id ? beleg
    : (eintrag.quelle_dokument_id
        ? { id: eintrag.quelle_dokument_id, dateiname: eintrag.beleg_dateiname }
        : null);
  return formular({ titel: `${cfg.einzahl} bearbeiten`,
                    felder: felderFuer(bereich, eintrag), bereich,
                    werte: eintrag, absicht: 'eintrag', extra, beleg: dok });
}

/* Die Ordnerstruktur lässt sich jederzeit nachträglich anlegen — auch wenn
   das Objekt längst existiert und Nextcloud erst später verbunden wurde. */
async function cloudZeigen() {
  const ziel = document.getElementById('cloudbereich');
  if (!ziel) return;
  let s;
  try {
    s = await api(`/nextcloud/objekte/${encodeURIComponent(slug)}/status`);
  } catch (fehler) {
    // Frueher verschwand der ganze Block hier kommentarlos — dann sah es aus,
    // als gaebe es die Dokumentenablage gar nicht.
    ziel.innerHTML = `<div class="cloudbox"><div class="zeile">
        <span class="sym offen">⬡</span>
        <span class="txt">
          <span class="t">Status der Ablage nicht abrufbar</span>
          <span class="d">${esc(String(fehler.message || fehler))}</span>
        </span></div>
        <div class="tat nebensache"><button data-cloud="status">Nochmal prüfen</button></div>
      </div>`;
    return;
  }

  if (s.angelegt) {
    // CCCXVI — schlank: nur „Ordner verknüpft", darunter die Filter und die
    // Dateiübersicht. Fehlende Unterordner legt ImmoCalc still selbst an; die
    // Ordner-Chipliste und der Knopf sind weg (wenig gewinnbringend).
    ziel.innerHTML = `<div class="cloudbox schlank"><div class="zeile">
        <span class="sym fertig">✓</span>
        <span class="txt">
          <span class="t">Ordner verknüpft</span>
          <span class="d">${esc(s.ordner)}</span>
        </span></div>
      </div>
      <div id="dokbaum"></div>`;
    // Fehlt ein Unterordner der Vorlage, wird er im Hintergrund angelegt —
    // ohne Knopf. Erst prüfen (fehlend?), dann nur bei Bedarf anlegen.
    ordnerAutoAnlegen();
    baumZeigen();
    return;
  }

  if (!s.cloud_verbunden) {
    ziel.innerHTML = `<div class="cloudbox"><div class="zeile">
        <span class="sym offen">⬡</span>
        <span class="txt">
          <span class="t">Nextcloud ist noch nicht verbunden</span>
          <span class="d">Das Objekt ist gespeichert. Sobald du die Verbindung
            einrichtest, kannst du die Ordnerstruktur hier nachträglich anlegen.</span>
        </span></div>
        <div class="tat"><a href="settings.html">Verbindung einrichten</a></div>
      </div>`;
    return;
  }

  if (!s.home) {
    ziel.innerHTML = `<div class="cloudbox"><div class="zeile">
        <span class="sym offen">▣</span>
        <span class="txt">
          <span class="t">Kein Home-Ordner gewählt</span>
          <span class="d">Wähle den Ordner, unter dem die Immobilien liegen.</span>
        </span></div>
        <div class="tat"><a href="settings.html">Home-Ordner wählen</a></div>
      </div>`;
    return;
  }

  ziel.innerHTML = `<div class="cloudbox"><div class="zeile">
      <span class="sym offen">＋</span>
      <span class="txt">
        <span class="t">Ordnerstruktur noch nicht angelegt</span>
        <span class="d">Wird angelegt unter <b>${esc(s.vorschlag)}</b> —
          vorhandene Ordner und Dateien bleiben unberührt.</span>
      </span></div>
      <div class="tat"><button data-cloud="struktur">Ordnerstruktur anlegen</button></div>
    </div>`;
}

/* CCCXVI — fehlt ein Unterordner der Vorlage, legt ImmoCalc ihn still an
   (kein Knopf). Nur wenn wirklich etwas fehlt, geht eine Anfrage raus; danach
   frischt sich der Baum auf, damit neue Ordner sofort sichtbar sind. */
async function ordnerAutoAnlegen() {
  try {
    const s = await api(`/nextcloud/objekte/${encodeURIComponent(slug)}/ordner`);
    if ((s.fehlend || []).length) {
      await api(`/nextcloud/objekte/${encodeURIComponent(slug)}/struktur`,
                { method: 'POST' });
      baumZeigen();
    }
  } catch { /* Ordner nicht lesbar — der Baum zeigt trotzdem, was da ist */ }
}

/* ---- Formular: eine Fabrik für alle Bereiche ---- */

/* CXLVII — welches Zeichen rechts im Eingabefeld steht. Geld ist immer Euro,
   alles andere sagt es selbst („m²", „%"). Leer heisst: schmuckloses Feld. */
const feldEinheit = f => (f.geld ? '€' : f.einheit) || '';

/* Beschriftung eines Feldes — bei echten Fachbegriffen (`f.lex`) mit einem
   ?-Hilfe-Platzhalter. `installHilfe` macht nach dem Rendern ein anklickbares
   Icon daraus. Triviale Felder (Name, Betrag, Bank) tragen kein `lex`. */
const feldLabel = f => `${esc(f.l)}${
  f.lex ? ` <span data-hilfe="${esc(f.lex)}"></span>` : ''}`;

async function feldHtml(f, bereich, wert) {
  const id = `f_${f.k}`;
  if (f.typ === 'auswahl') {
    // Kein natives <select>: die aufgeklappte Liste zeichnete sonst das
    // Betriebssystem. Der wirkliche Wert steht im versteckten Feld, damit
    // `ausFormular` ihn wie bei jedem anderen Feld findet.
    // Beschriftung ohne `for`: den Knopf baut auswahl.js selbst und gibt ihm
    // eine eigene id — die Verknüpfung läuft über aria-label.
    // `ohneLeer`: eine Vertragsart gibt es immer — „nicht gewählt" wäre dort
    // keine mögliche Antwort, sondern eine Lücke im Datenmodell.
    const werte = f.ohneLeer ? f.werte : ['', ...f.werte];
    const gesetzt = wert ?? f.vorgabe ?? '';
    return `<div class="field"><label>${feldLabel(f)}</label>
      <input type="hidden" id="${id}" name="${f.k}" value="${esc(gesetzt)}">
      <div data-auswahl="${esc(f.k)}" data-label="${esc(f.l)}"
           ${f.umbau ? 'data-umbau="1"' : ''}
           data-optionen="${esc(JSON.stringify(werte))}"></div>
      ${f.note ? `<span class="feldnote">${esc(f.note)}</span>` : ''}</div>`;
  }
  if (f.typ === 'einheit') {
    // CLXIX — die Einheit wird angetippt, nicht getippt. Freitext liess einen
    // Tippfehler durch, und die Partei fiel stumm aus der Kostenverteilung
    // (Fund XCII). Ohne erfasste Einheiten bleibt es ein Textfeld: sonst
    // liesse sich an einem Bestandsobjekt gar kein Mietverhältnis anlegen.
    if (!einheiten.length) {
      return `<div class="field"><label for="${id}">${esc(f.l)}</label>
        <input class="inp" id="${id}" name="${f.k}" type="text"
               value="${esc(wert ?? '')}"></div>`;
    }
    const gewaehlt = wert ?? (einheiten.length === 1
      ? einheiten[0].bezeichnung : '');
    const blasen = einheiten.map(e => {
      const an = e.bezeichnung === gewaehlt;
      return `<button type="button" class="bubble${an ? ' gewaehlt' : ''}${
          e.vermietet ? '' : ' frei'}" data-wahl="${esc(e.bezeichnung)}"
          aria-pressed="${an}">
        <span class="bt">${esc(e.bezeichnung)}</span>
        ${e.flaeche ? `<span class="bf">${flaecheText(e.flaeche)}</span>` : ''}
        ${e.vermietet ? '' : '<span class="bfrei">frei</span>'}
      </button>`;
    }).join('');
    return `<div class="field"><label>${esc(f.l)}</label>
      <input type="hidden" id="${id}" name="${f.k}" value="${esc(gewaehlt)}">
      <div class="bubbles" data-wahlfeld="${esc(f.k)}" role="group"
           aria-label="${esc(f.l)}">${blasen}</div>
      <span class="feldnote">Antippen statt tippen — nur so findet die
        Kostenverteilung die Einheit wieder.</span></div>`;
  }
  if (f.typ === 'anteileinheit') {
    // CLXI — worauf ein Eigentümer-Anteil zeigt: das ganze Haus oder eine
    // Einheit. „Ganzes Haus" steht als erste Blase und ist vorgewählt — der
    // gewachsene Fall bleibt der Normalfall. Dieselbe Blasen-Verdrahtung wie
    // bei der Einheitenwahl der Miete (data-wahl/data-wahlfeld).
    const gewaehlt = wert ?? '';
    const blase = (w, text, extra) => {
      const an = w === gewaehlt;
      return `<button type="button" class="bubble${an ? ' gewaehlt' : ''}"
          data-wahl="${esc(w)}" aria-pressed="${an}">
        <span class="bt">${esc(text)}</span>${extra || ''}</button>`;
    };
    const blasen = blase('', 'Ganzes Haus')
      + einheiten.map(e => blase(e.bezeichnung, e.bezeichnung,
          e.flaeche ? `<span class="bf">${flaecheText(e.flaeche)}</span>` : '')).join('');
    return `<div class="field"><label>${esc(f.l)}</label>
      <input type="hidden" id="${id}" name="${f.k}" value="${esc(gewaehlt)}">
      <div class="bubbles" data-wahlfeld="${esc(f.k)}" role="group"
           aria-label="${esc(f.l)}">${blasen}</div>
      <span class="feldnote">Gehört dem Eigentümer nur eine Wohnung, hier die
        Einheit wählen — sonst „Ganzes Haus". Einheit-Anteile haben Vorrang für
        ihre Einheit, der Haus-Anteil deckt den Rest.</span></div>`;
  }
  // Turnus und Auswahllisten tragen dasselbe eigene Auswahlfeld wie `auswahl`
  // — ein natives <select> zeichnet sonst das Betriebssystem und fällt aus dem
  // Design der Seite (blaue Kästen, eckige Liste).
  if (f.typ === 'turnus') {
    const { optionen, vorgabe } = await turnusOptionen(bereich);
    const gewaehlt = wert ?? f.vorgabe ?? vorgabe;
    return `<div class="field"><label>${feldLabel(f)}</label>
      <input type="hidden" id="${id}" name="${f.k}" value="${esc(gewaehlt)}">
      <div data-auswahl="${esc(f.k)}" data-label="${esc(f.l)}"
           data-optionen="${esc(JSON.stringify(optionen))}"></div>
      ${f.note ? `<span class="feldnote">${esc(f.note)}</span>` : ''}</div>`;
  }
  if (f.typ === 'select') {
    return `<div class="field"><label>${feldLabel(f)}</label>
      <input type="hidden" id="${id}" name="${f.k}" value="${esc(wert ?? '')}">
      <div data-auswahl="${esc(f.k)}" data-label="${esc(f.l)}"
           data-optionen="${esc(JSON.stringify(f.werte))}"></div>
      ${f.note ? `<span class="feldnote">${esc(f.note)}</span>` : ''}</div>`;
  }
  if (f.typ === 'ja_nein') {
    const ja = wert === undefined ? true : Boolean(wert);
    return `<div class="field"><label for="${id}">${esc(f.l)}</label>
      <select class="inp" id="${id}" name="${f.k}">
        <option value="ja" ${ja ? 'selected' : ''}>ja</option>
        <option value="nein" ${ja ? '' : 'selected'}>nein</option>
      </select></div>`;
  }
  if (f.typ === 'schalter') {
    // CXCIII — ein gedeckter Ja/Nein-Schalter im Stil der Seite, kein natives
    // Kästchen. Er borgt sich die Blasen-Verdrahtung (data-wahl/-wahlfeld): der
    // echte Wert steht im versteckten Feld, `ausFormular` liest ihn als bool.
    const ja = wert == null ? (f.vorgabe == null ? true : Boolean(f.vorgabe))
                            : Boolean(wert);
    const knopf = (w, an, text) => `<button type="button"
        class="schaltknopf${an ? ' an' : ''}" data-wahl="${w}"
        aria-pressed="${an}">${text}</button>`;
    return `<div class="field"><label>${feldLabel(f)}</label>
      <input type="hidden" id="${id}" name="${f.k}" value="${ja ? 'ja' : 'nein'}">
      <div class="schalter" data-wahlfeld="${esc(f.k)}" role="group"
           ${f.umbau ? 'data-umbau="1"' : ''} aria-label="${esc(f.l)}">
        ${knopf('ja', ja, 'Ja')}${knopf('nein', !ja, 'Nein')}
      </div>
      ${f.note ? `<span class="feldnote">${esc(f.note)}</span>` : ''}</div>`;
  }
  const v = wert == null ? (f.vorgabe != null ? f.vorgabe : '') : wert;
  // Felder mit Einheit sind Textfelder: ein <input type="number"> nimmt keine
  // Tausenderpunkte an und stellte seine Pfeilchen genau dorthin, wo das
  // Zeichen sitzt. Die Zifferntastatur bleibt über inputmode erhalten.
  const einheit = feldEinheit(f);
  const typ = einheit ? 'text' : f.typ;
  const zusatz = einheit ? 'inputmode="decimal"'
                         : (f.schritt ? `step="${f.schritt}"` : '');
  return `<div class="field"><label for="${id}">${feldLabel(f)}</label>
    <input class="inp" id="${id}" name="${f.k}" type="${typ}" ${zusatz}
           value="${esc(v)}" ${f.pflicht ? 'required' : ''}>
    ${f.note ? `<span class="feldnote" id="n_${f.k}">${esc(f.note)}</span>` : ''}</div>`;
}

/* Lesbare Eingabe anhängen — und beim Schliessen wieder lösen, sonst häufen
   sich die Beobachter mit jedem geöffneten Dialog. */
let formate = [];

function formateLoesen() {
  for (const f of formate) {
    try { f.zerstoere(); } catch { /* schon weg */ }
  }
  formate = [];
}

function formateSetzen(form, felder) {
  formateLoesen();
  if (!eingabe) return;
  for (const f of felder) {
    const el = form.elements[f.k];
    if (!el || el.tagName !== 'INPUT') continue;
    const einheit = feldEinheit(f);
    const bauer = einheit ? feld => eingabe.geldFeld(feld, einheit)
                : f.iban ? eingabe.ibanFeld
                : f.steuer ? eingabe.steuernummerFeld : null;
    if (typeof bauer !== 'function') continue;
    try {
      const griff = bauer(el);
      if (griff && typeof griff.zerstoere === 'function') formate.push(griff);
    } catch { /* eine Formatierung ist kein Muss */ }
  }
}

/* Auswahlfelder im eigenen Design — je Dialog neu gebaut und beim Schliessen
   wieder abgeräumt, wie die Formatierungen darüber. */
let auswahlen = [];

function auswahlLoesen() {
  for (const a of auswahlen) {
    try { a.zerstoere(); } catch { /* schon weg */ }
  }
  auswahlen = [];
}

function auswahlSetzen(form) {
  auswahlLoesen();
  for (const halter of form.querySelectorAll('[data-auswahl]')) {
    const feld = form.elements[halter.dataset.auswahl];
    if (!feld) continue;
    // Reine Zeichenketten (Nutzungsart, Erwerbsart …) oder Wert/Text-Paare
    // (Turnus: „jaehrlich" heisst „jährlich").
    const optionen = JSON.parse(halter.dataset.optionen)
      .map(w => (w && typeof w === 'object')
        ? { wert: w.wert, text: w.text }
        : { wert: w, text: w || 'nicht gewählt' });
    auswahlen.push(auswahlfeld(halter, {
      optionen, wert: feld.value, label: halter.dataset.label,
      aenderung: neu => {
        feld.value = neu;
        // Ein Feld, das die Maske umstellt (die Vertragsart), baut das
        // Formular neu — aber erst im nächsten Anlauf: sonst zöge sich das
        // Auswahlfeld sein eigenes DOM unter den Füssen weg.
        if (halter.dataset.umbau && dialogUmbau) setTimeout(dialogUmbau, 0);
      },
    }));
  }
}

/* CXLVIII — Zinssatz und Zinsanteil je Monat halten sich gegenseitig aktuell.
   Wer den Satz kennt, tippt ihn; wer nur den Zinsanteil aus dem Kontoauszug
   hat, tippt den — beides führt zum selben Ergebnis. Gespeichert wird der
   Zinssatz.

   Die Regel dahinter steht in `api/app/vermoegen.py` (`monatszins` und
   `zinssatz_aus_monatszins`) und ist dort geprüft; hier wird sie nur
   angezeigt, damit die Zahl schon während des Tippens dasteht. Wer sie ändert,
   ändert sie an beiden Stellen. */
const ZINSTEXT = {
  ja: 'Eines von beidem genügt — das andere ergibt sich aus der Restschuld.',
  nein: 'Ohne Restschuld lässt sich das nicht umrechnen — trag sie oben ein.',
};

function zinsKopplung(form) {
  const satz = form.querySelector('#f_zinssatz');
  const monat = form.querySelector('#f_zins_monat');
  const rest = form.querySelector('#f_restschuld');
  const note = form.querySelector('#n_zins_monat');
  if (!satz || !monat || !rest) return;
  // Das Nachtragen im anderen Feld ist keine Eingabe des Nutzers.
  let rechnet = false;

  /* Die Restschuld, auf die sich beide Felder beziehen — null, solange keine
     eingetragen ist. */
  const basis = () => {
    const r = zahlAus(rest);
    return r && r > 0 ? r : null;
  };

  const setze = (feld, wert) => {
    rechnet = true;
    feld.value = wert == null ? '' : String(wert);
    rechnet = false;
  };
  const auf2 = n => Math.round(n * 100) / 100;

  function ausSatz() {
    const r = basis();
    const s = zahlAus(satz);
    setze(monat, r == null || s == null ? null : auf2(r * s / 100 / 12));
  }

  /* Umgekehrt nur, wenn wirklich etwas dasteht: ein geleertes Hilfsfeld soll
     keinen eingetragenen Zinssatz mitnehmen. */
  function ausMonat() {
    const r = basis();
    const m = zahlAus(monat);
    if (r == null || m == null) return;
    setze(satz, auf2(m * 12 / r * 100));
  }

  /* Die fehlende Restschuld wird erst zum Thema, wenn wirklich etwas
     umzurechnen wäre — ein frisch geöffnetes Formular wird nicht gleich
     ermahnt. */
  function melde() {
    if (!note) return;
    const angefangen = zahlAus(satz) != null || zahlAus(monat) != null;
    note.textContent = !basis() && angefangen ? ZINSTEXT.nein : ZINSTEXT.ja;
  }

  const beiEingabe = rechnung => () => {
    if (rechnet) return;
    rechnung();
    melde();
  };

  satz.addEventListener('input', beiEingabe(ausSatz));
  monat.addEventListener('input', beiEingabe(ausMonat));
  // Ändert sich die Restschuld, gilt weiter der Zinssatz — er ist das
  // Gespeicherte, der Zinsanteil folgt ihm.
  rest.addEventListener('input', beiEingabe(ausSatz));

  melde();
  ausSatz();
}

/* Die Felder, die gerade im Dialog stehen. Beim Speichern wird genau das
   ausgelesen, was auch gezeigt wurde — bei den Verträgen hängt das an der
   Vertragsart und lässt sich nicht aus dem Bereich allein ableiten. */
let dialogFelder = [];
/* Baut den offenen Dialog mit anderen Feldern neu auf, ohne das Eingetippte
   zu verlieren. Gesetzt von `formular`, gerufen vom Auswahlfeld mit `umbau`. */
let dialogUmbau = null;

// CCCXXIII — die PDF-Spalte des Bearbeiten-Dialogs sauber wieder abräumen,
// sobald er schliesst: Klasse weg (nächste schmale Maske bleibt schmal),
// Object-URLs freigeben, Inhalt leeren.
if (!dlg._pdfWired) {
  dlg._pdfWired = true;
  dlg.addEventListener('close', () => {
    (dlg._pdfUrls || []).forEach(u => URL.revokeObjectURL(u));
    dlg._pdfUrls = [];
    dlg.classList.remove('mit-pdf');
    const p = document.getElementById('dlgPdf');
    p.innerHTML = '';
    delete p.dataset.docId;
  });
}

async function formular(einst) {
  const { titel: dtitel, felder, bereich, werte = {}, absicht,
          hinweis = '', extra = '', knopf = 'Speichern', beleg = null } = einst;
  const form = document.getElementById('dlgForm');
  // Beleg daneben (CCCXXIII): nur laden, wenn sich das Dokument ändert — sonst
  // flackerte die Vorschau bei jedem reaktiven Umbau des Formulars.
  const pdf = document.getElementById('dlgPdf');
  if (beleg && beleg.id) {
    dlg.classList.add('mit-pdf');
    if (pdf.dataset.docId !== String(beleg.id)) {
      (dlg._pdfUrls || []).forEach(u => URL.revokeObjectURL(u));
      pdf.innerHTML = '<div class="beleg-flaeche"></div>';
      dlg._pdfUrls = belegSeitenLaden(`/api/dokumente/${beleg.id}`,
        pdf.querySelector('.beleg-flaeche'), beleg.dateiname || 'Beleg',
        `/api/dokumente/${beleg.id}/inhalt`);
      pdf.dataset.docId = String(beleg.id);
    }
  } else {
    dlg.classList.remove('mit-pdf');
    (dlg._pdfUrls || []).forEach(u => URL.revokeObjectURL(u));
    dlg._pdfUrls = [];
    pdf.innerHTML = '';
    delete pdf.dataset.docId;
  }
  const html = await Promise.all(
    felder.map(f => feldHtml(f, bereich, werte[f.k])));
  document.getElementById('dlgTitel').textContent = dtitel;
  // Abbrechen ist bewusst type="button": als Submit-Knopf loeste es den
  // submit-Handler aus und speicherte. Die Abfrage darauf lief ins Leere,
  // weil returnValue am <dialog> haengt, nicht am <form>.
  form.innerHTML = (hinweis ? `<p class="dlgnote">${esc(hinweis)}</p>` : '')
    + html.join('') + extra +
    `<button class="btn" value="ok">${esc(knopf)}</button>
     <button class="btn leise" type="button" data-abbruch
             style="margin-top:8px">Abbrechen</button>`;
  form.dataset.absicht = absicht;
  form.dataset.bereich = bereich || '';
  form.dataset.id = werte.id || '';
  delete form.dataset.vorgaenger;   // sonst endet beim nächsten Mal ein fremder Stand
  dialogFelder = felder;
  dialogUmbau = async () => {
    // Das schon Eingetippte überlebt den Umbau — nur die Felder wechseln.
    const stand = bereich === 'kredite'
      ? uebernahmeAnbieten({ ...werte, ...ausFormular(form, felder) })
      : { ...werte, ...ausFormular(form, felder) };
    await formular({ ...einst, felder: felderFuer(bereich, stand, absicht),
                     werte: stand });
  };
  formateSetzen(form, felder);
  auswahlSetzen(form);
  zinsKopplung(form);
  installHilfe(form);
  // Ein zweiter showModal-Aufruf auf einem offenen Dialog wirft — der Wechsel
  // von der Miete zur Erhöhung tauscht nur den Inhalt aus.
  if (!dlg.open) dlg.showModal();
  form.scrollTop = 0;
}

/* Was wirklich im Feld steht — auch wenn es "1.250.000" anzeigt.
   `data-wert` hat Vorrang: dort legt die Formatierung den rohen Wert ab. */
function zahlAus(el) {
  const roh = el.dataset.wert != null && el.dataset.wert !== ''
    ? el.dataset.wert : el.value;
  const text = String(roh ?? '').replace(/[^\d,.-]/g, '');
  if (text === '') return null;
  const komma = text.lastIndexOf(',');
  const sauber = komma >= 0
    ? `${text.slice(0, komma).replace(/\./g, '')}.${text.slice(komma + 1).replace(/\D/g, '')}`
    // Ein einzelner Punkt mit ein bis zwei Stellen dahinter ist ein
    // Dezimalpunkt (so kommt der Wert aus der API), sonst Tausendertrennung.
    : (/^-?\d+\.\d{1,2}$/.test(text) ? text : text.replace(/\./g, ''));
  const zahl = Number(sauber);
  return Number.isFinite(zahl) ? zahl : null;
}

function ausFormular(form, felder) {
  const werte = {};
  for (const f of felder) {
    // Hilfsfelder helfen beim Ausfüllen und werden nicht gespeichert — der
    // Zinsanteil je Monat steckt schon im Zinssatz.
    if (f.hilfe) continue;
    const el = form.elements[f.k];
    if (!el) continue;
    if (f.typ === 'ja_nein' || f.typ === 'schalter') {
      werte[f.k] = el.value === 'ja'; continue;
    }
    // Leeren heisst hier wirklich leeren — sonst liesse sich ein einmal
    // gesetztes Enddatum nie wieder entfernen.
    if (f.typ === 'number') { werte[f.k] = zahlAus(el); continue; }
    if (el.value === '') { werte[f.k] = f.typ === 'date' ? null : ''; continue; }
    werte[f.k] = el.value;
  }
  return werte;
}

function bewohnerZeile(b) {

function bewohnerBlock(liste) {

/* CCCXXVII — Gemeinschaftsflächen einer Einheit: eine mitgenutzte Fläche und
   von wie vielen sie genutzt wird. Sie zählt geteilt durch die Nutzerzahl zur
   Einheitsfläche (Verteilung + €/m²). Seltener Fall — deshalb eingeklappt bis
   zum ersten Eintrag. */
function gemeinZeile(g = {}) {
  return `<div class="gfzeile">
    <button type="button" class="weg" data-gf-weg aria-label="Fläche entfernen">×</button>
    <input class="nm" name="gf_bezeichnung" type="text" placeholder="z. B. Treppenhaus"
           value="${esc(g.bezeichnung || '')}">
    <input name="gf_flaeche" type="number" step="0.01" inputmode="decimal"
           placeholder="m²" value="${g.flaeche ?? ''}">
    <input name="gf_personen" type="number" step="1" inputmode="numeric"
           placeholder="Nutzer" value="${g.personen ?? ''}">
  </div>`;
}

function gemeinBlock(liste) {
  return `<div class="block" id="gemeinblock">
    <span class="bt">Gemeinschaftsflächen (anteilig)</span>
    <span class="bd">Selten nötig: eine mitgenutzte Fläche (z. B. Treppenhaus,
      Waschküche) und von wie vielen Personen sie genutzt wird. Sie zählt geteilt
      durch die Nutzerzahl zur Wohnfläche dieser Einheit — für die Verteilung und
      die Quadratmetermiete.</span>
    ${(liste || []).map(gemeinZeile).join('')}
    <button type="button" class="zusatz" data-gf-neu>＋ Gemeinschaftsfläche</button>
  </div>`;
}

/** Die Gemeinschaftsflächen-Zeilen als Liste — leere (ohne Fläche) fallen weg. */
function gemeinAusFormular(form) {
  return [...form.querySelectorAll('.gfzeile')].map(z => ({
    bezeichnung: z.querySelector('[name=gf_bezeichnung]').value.trim(),
    flaeche: Number(z.querySelector('[name=gf_flaeche]').value.replace(',', '.')) || 0,
    personen: Number(z.querySelector('[name=gf_personen]').value) || 0,
  })).filter(g => g.flaeche > 0);
}

/* Was im Dialog steht, mit dem Bestand abgleichen: geändert, neu, entfernt. */
async function bewohnerSpeichern(form, miete_id) {
  const block = form.querySelector('#bewohnerblock');
  if (!block || !miete_id) return;
  for (const bid of bewohnerWeg) {
    await api(`/bewohner/${bid}`, { method: 'DELETE' });
  }
  bewohnerWeg = [];
  for (const zeile of block.querySelectorAll('.bwzeile')) {
    const daten = {
      name: zeile.querySelector('[name=bw_name]').value.trim(),
      email: zeile.querySelector('[name=bw_email]').value.trim(),
      telefon: zeile.querySelector('[name=bw_telefon]').value.trim(),
      anschrift: zeile.querySelector('[name=bw_anschrift]').value.trim(),
    };
    if (zeile.dataset.bid) {
      await api(`/bewohner/${zeile.dataset.bid}`, { method: 'PATCH', body: daten });
    } else if (daten.name || daten.email || daten.telefon || daten.anschrift) {
      await api(`/mieten/${miete_id}/bewohner`, { method: 'POST', body: daten });
    }
  }
}

/* ---- Jahresstände eines Kredits ---- */

/* Das Feld heisst weiter `restschuld` — so heisst die Spalte, und beim
   Bausparvertrag steht dort der Sparstand (siehe `models.Kreditstand`).
   Gefragt wird trotzdem nach dem, was auf dem Auszug steht. */
const standFelder = bauspar => [
  { k: 'jahr', l: 'Jahr', typ: 'number', pflicht: true,
    vorgabe: new Date().getFullYear() - 1 },
  { k: 'restschuld', l: bauspar ? 'Sparstand am 31.12.'
                                : 'Restschuld am 31.12.',
    typ: 'number', schritt: '0.01', geld: true, pflicht: true },
  // CCXXXI — was laut Kontoauszug tatsächlich an Zinsen floss, neben der
  // Kalkulation aus Rate und Zinssatz. Optional: ohne Angabe zeigt der
  // Verlauf weiter nur die gerechnete Zahl.
  { k: 'zinsen_ist', l: bauspar ? 'Erhaltene Zinsen lt. Kontoauszug'
                                : 'Gezahlte Zinsen lt. Kontoauszug',
    typ: 'number', schritt: '0.01', geld: true },
];

/* CCXXXI — Zinsen je Jahr: was laut Kontoauszug wirklich anfiel (`zinsen_ist`)
   neben dem, was aus Rate und Zinssatz gerechnet ist (`zinsen_kalk`). Fehlt
   der Ist-Wert, bleibt nur die Kalkulation stehen; fehlen beide, bleibt die
   Zeile ganz weg — eine leere Zinszeile wäre nur Rauschen. */
function zinsZeile(j) {
  if (j.zinsen_ist == null && j.zinsen_kalk == null) return '';
  const teile = [];
  if (j.zinsen_ist != null) teile.push(`ist ${eur(j.zinsen_ist)}`);
  if (j.zinsen_kalk != null) teile.push(`kalk ${eur(j.zinsen_kalk)}`);
  return `<div class="jz">Zinsen: ${teile.join(' · ')}</div>`;
}

function verlaufBlock(s) {
  const bauspar = istBausparer(s.art);
  const zeilen = (s.verlauf || []).map(j => `<div class="jahr${
      j.eingetragen ? ' gemessen' : ''}">
      <div class="jzeile">
        <span class="jj">${j.jahr}</span>
        <span class="jw">${eur(j.restschuld)}</span>
        <span class="jq">${j.eingetragen ? 'eingetragen' : 'gerechnet'}</span>
        ${j.eingetragen ? `<button type="button" class="weg"
            data-stand-weg="${(s.staende.find(x => x.jahr === j.jahr) || {}).id}"
            aria-label="Stand entfernen">×</button>`
          : '<span class="weg" aria-hidden="true"></span>'}
      </div>
      ${zinsZeile(j)}
    </div>`).join('');
  return `<div class="block">
    <span class="bt">Verlauf</span>
    <span class="bd">Grün hinterlegt ist, was du eingetragen hast. Die Jahre
      dazwischen rechnet die App aus ${bauspar ? 'Sparbeitrag und Guthabenzins'
                                              : 'Rate und Zinssatz'}.</span>
    ${zeilen ? `<div class="jahre">${zeilen}</div>`
             : '<div class="bd">Noch kein Stand eingetragen.</div>'}
  </div>`;
}

/* ---- Zusatzblöcke der Formulare ---- */

function mietExtra(eintrag) {
  // Ein Acker hat keine Bewohner. Die Staffelung des Pachtzinses schon —
  // die läuft über denselben Weg wie eine Mieterhöhung.
  const pacht = istGrundstueck();
  const kopf = pacht ? 'Pachterhöhung' : 'Mieterhöhung';
  const kopien = (eintrag ? eintrag.bewohner : []) || [];
  return (pacht ? '' : bewohnerBlock(kopien)) + (eintrag ? `<div class="block">
      <span class="bt">${kopf}</span>
      <span class="bd">Eine beschlossene Erhöhung lässt sich schon jetzt
        eintragen. Sie steht als „geplant" in der Liste, bis sie wirksam wird;
        der heutige Stand endet automatisch am Tag davor.</span>
      <button type="button" class="zusatz"
              data-erhoehung="${eintrag.id}">＋ ${kopf} planen</button>
    </div>` : '');
}

function kreditExtra(eintrag) {
  if (!eintrag) return '';
  const s = eintrag.stand || {};
  const bauspar = istBausparer(eintrag.art);
  const gemessen = s.stand_jahr
    ? `Zuletzt eingetragen zum 31.12.${s.stand_jahr}: ${eur(s.stand_wert)} —
       heute fortgeschrieben ${eur(s.stand)}.`
    : (bauspar
        ? `Trage den Sparstand zum 31.12. ein, wie er auf dem Kontoauszug
           steht. Dazwischen rechnet ImmoCalc aus Sparbeitrag und
           Guthabenzins weiter.`
        : `Trage die Restschuld zum 31.12. ein, wie sie im Kontoauszug steht.
           Dazwischen rechnet ImmoCalc aus Rate und Zinssatz weiter.`);
  // Beim Bausparvertrag zählt, was noch fehlt — das ist die Zahl, die der
  // Nutzer im Kopf hat: 140.000 Bausparsumme, 45.000 gespart, Rest offen.
  const rest = bauspar && s.noch_zu_sparen != null
    ? (s.zuteilungsreif
        ? ` Die Bausparsumme ist erreicht — der Vertrag ist zuteilungsreif.`
        : ` Bis zur Bausparsumme fehlen noch ${eur(s.noch_zu_sparen)}.`)
    : '';
  const zins = bauspar
    ? (s.habenzins_monat ? ` Das Guthaben bringt zurzeit
        ${eur(s.habenzins_monat)} im Monat an Zinsen.` : '')
    : (s.zins_monat ? ` Davon gehen zurzeit ${eur(s.zins_monat)} im Monat
        an Zinsen weg.` : '');
  return `<div class="block">
    <span class="bt">${bauspar ? 'Sparstand' : 'Restschuld'}</span>
    <span class="bd">${gemessen}${rest}${zins}</span>
    <button type="button" class="zusatz"
            data-staende="${eintrag.id}">Jahresstände pflegen</button>
  </div>`;
}

/* ---- CCXXIX: Grundschulden ------------------------------------------------
   Eine eigene Liste, kein Eintrag in BEREICHE: die Endpunkte liegen anders
   (`/objekte/{slug}/grundschulden`, `/grundschulden/{id}`, nicht der
   generische `/stammdaten/{bereich}/{id}`-Weg) — wie bei den Einheiten.

   Die Zuordnung zu Krediten ist eine Mehrfachauswahl, und zwar
   objektübergreifend: eine Grundschuld auf diesem Grundstück kann einen
   Kredit an einem ganz anderen Objekt sichern. Gelöst als Reihe ankreuzbarer
   Blasen (`data-gs-kredit`) statt eines nativen multiselect — jede Blase
   trägt ihren Zustand selbst, ohne die übrigen abzuwählen; das unterscheidet
   sie von den Einheiten-Blasen (`data-wahl`/`data-wahlfeld`), die immer nur
   eine Auswahl zulassen. */
const GRUNDSCHULDFELDER = [
  { k: 'betrag', l: 'Betrag', typ: 'number', schritt: '0.01', geld: true,
    voll: true, pflicht: true },
  { k: 'rang', l: 'Rang', typ: 'number', schritt: '1', lex: 'rang' },
  { k: 'grundbuch_blatt', l: 'Grundbuchblatt', typ: 'text', lex: 'grundbuch' },
  { k: 'glaeubiger', l: 'Gläubiger', typ: 'text' },
  { k: 'brief', l: 'Briefgrundschuld', typ: 'schalter', vorgabe: false,
    lex: 'brief-buchgrundschuld',
    note: 'Aus: Buchgrundschuld — kein Grundschuldbrief ausgestellt.' },
  { k: 'notiz', l: 'Notiz', typ: 'text' },
];

const grundschuldName = g =>
  g.glaeubiger || (g.grundbuch_blatt ? `Blatt ${g.grundbuch_blatt}` : 'Grundschuld');

const grundschuldDetail = g => [
  g.rang != null && g.rang !== '' ? `Rang ${g.rang}` : '',
  g.grundbuch_blatt ? `Blatt ${g.grundbuch_blatt}` : '',
  g.brief ? 'Brief' : 'Buch',
  (g.kredit_ids || []).length
    ? `sichert ${g.kredit_ids.length} Kredit${g.kredit_ids.length === 1 ? '' : 'e'}`
    : 'sichert keinen Kredit',
].filter(Boolean).join(' · ');

/** Alle Kredite über alle Objekte — eine Grundschuld kann anderswo sichern. */
async function grundschuldKrediteListe() {
  try { return await api('/grundschulden/kredit-auswahl'); }
  catch { return []; }
}

function grundschuldKreditBlock(kreditListe, ausgewaehlt) {
  if (!kreditListe.length) {
    return `<div class="block">
      <span class="bt">Gesicherte Kredite</span>
      <span class="bd">Noch kein Kredit angelegt — lege zuerst einen an, um
        ihn hier zu verknüpfen.</span>
    </div>`;
  }
  const gewaehlt = new Set(ausgewaehlt.map(String));
  const blasen = kreditListe.map(k => {
    const an = gewaehlt.has(String(k.id));
    return `<button type="button" class="bubble${an ? ' gewaehlt' : ''}"
        data-gs-kredit="${k.id}" aria-pressed="${an}">

  return `<div class="block">

    <span class="bd">Eine Grundschuld kann auch einen Kredit an einem anderen

      Mehrfachauswahl möglich.</span>
    <div class="bubbles" role="group"
         aria-label="Gesicherte Kredite">${blasen}</div>
  </div>`;
}

async function grundschuldFormular(g = null) {
  const kreditListe = await grundschuldKrediteListe();
  await formular({

    hinweis: 'Rang und Grundbuchblatt stehen im Grundbuchauszug. Eine '

function grundschuldenHtml() {
  const zeilen = grundschulden.length

/* ---- CLXXVI: Kappungsgrenze nach § 558 Abs. 3 BGB -----------------------
   Wie viel eine Erhöhung binnen drei Jahren zulegen darf, hängt an der
   Gemeinde: 20 %, in Gebieten mit angespanntem Wohnungsmarkt 15 %. Welche
   Gemeinden das sind und wie gerechnet wird, steht in
   `api/app/kappungsgrenze.py` — hier wird nur gefragt und gezeigt.

   Gewarnt, nicht verboten: eine Erhöhung nach Modernisierung (§ 559 BGB)
   fällt gar nicht unter die Grenze, und über Ausnahmen entscheidet nicht
   diese Seite. Gespeichert wird deshalb in jedem Fall. */
async function kappungWachen(mid) {
  const form = document.getElementById('dlgForm');
  const feld = form.querySelector('#f_kaltmiete');
  const abFeld = form.querySelector('#f_ab_datum');
  if (!feld || !feld.closest('.field')) return;

  const halter = document.createElement('div');
  // Eigener Abstand nach unten: sonst klebt die Fundstelle an der
  // Beschriftung des nächsten Feldes.
  halter.style.margin = '-4px 0 18px';
  feld.closest('.field').insertAdjacentElement('afterend', halter);

  let lauf = 0;
  async function zeigen() {
    const frage = new URLSearchParams();
    const neu = zahlAus(feld);
    if (neu != null && neu > 0) frage.set('neu', String(neu));
    if (abFeld && abFeld.value) frage.set('ab', abFeld.value);
    const nummer = ++lauf;
    let s;
    try {
      s = await api(`/mieten/${mid}/kappungsgrenze?${frage}`);
    } catch {
      return;                    // ohne Auskunft lieber nichts behaupten
    }
    // Eine ältere Antwort darf eine neuere nicht überschreiben, und ein
    // umgebautes Formular hat den Platz gar nicht mehr.
    if (nummer !== lauf || !halter.isConnected) return;
    // Die Fundstelle steht immer, aber leise: sie gehört zur Auskunft, ist
    // aber nicht die Nachricht. Die Warnung selbst bleibt kurz.
    const quelle = `<span class="feldnote">Grundlage: ${esc(s.fundstelle)}.
      ${s.ueberschritten ? 'Eine Erhöhung nach Modernisierung (§ 559 BGB) '
        + 'fällt nicht darunter — eintragen lässt sie sich trotzdem.' : ''}</span>`;
    halter.innerHTML = (s.ueberschritten
      ? `<div class="merker" style="margin-top:10px">
           <span class="hi">!</span><span class="ht">
           <span class="t">${esc(s.titel)}</span>
           <span class="d">${esc(s.text)}</span></span></div>`
      : `<span class="feldnote">${esc(s.text)}</span>`) + quelle;
  }

  let warten = null;
  const spaeter = () => {
    clearTimeout(warten);
    warten = setTimeout(zeigen, 350);
  };
  feld.addEventListener('input', spaeter);
  if (abFeld) abFeld.addEventListener('change', spaeter);
  await zeigen();
}

/* Eine geplante Erhöhung ist ein neuer Mietstand derselben Partei — nicht ein
   geänderter alter. So bleibt nachvollziehbar, was wann galt. */
async function erhoehungFormular(mid) {
  let alt;
  try {
    alt = (await api(`/objekte/${encodeURIComponent(slug)}/mieten`))
      .find(x => String(x.id) === String(mid));
  } catch (fehler) {
    return melde(String(fehler.message || fehler), 'neg');
  }
  if (!alt) return;
  const pacht = istGrundstueck();
  const bewohner = (alt.bewohner || []).map(b => ({ ...b, id: null }));
  await formular({
    titel: pacht ? 'Pachterhöhung planen' : 'Mieterhöhung planen',
    hinweis: `Trage ${pacht ? 'den neuen Pachtzins' : 'die neue Miete'} und `
      + 'den Tag ein, ab dem er gilt. Der bisherige Stand läuft bis zum Tag '
      + 'davor weiter und bleibt als Historie erhalten.',
    felder: cfgFuer('mieten').felder, bereich: 'mieten', absicht: 'eintrag',
    werte: { ...alt, id: '', ab_datum: ersterNaechsterMonat(), bis_datum: null },
    extra: pacht ? '' : bewohnerBlock(bewohner), knopf: 'Erhöhung planen',
  });
  document.getElementById('dlgForm').dataset.vorgaenger = mid;
  // Beim Pachtzins gibt es keine Kappungsgrenze — § 558 BGB gilt für
  // Wohnraum, nicht für Grund und Boden.
  if (!pacht) await kappungWachen(mid);
}

async function standFormular(kid) {

dlg.addEventListener('close', () => {
  formateLoesen();
  auswahlLoesen();
  dialogUmbau = null;      // sonst baut ein später Klick einen toten Dialog um
});

document.getElementById('dlgForm').addEventListener('click', async e => {
  if (e.target.closest('[data-abbruch]')) return dlg.close('abbruch');

  // CCXXIX — Mehrfachauswahl der gesicherten Kredite: jede Blase schaltet
  // nur sich selbst, im Unterschied zu den Einzelauswahl-Blasen unten.
  const gsKredit = e.target.closest('[data-gs-kredit]');
  if (gsKredit) {
    const an = !gsKredit.classList.contains('gewaehlt');
    gsKredit.classList.toggle('gewaehlt', an);
    gsKredit.setAttribute('aria-pressed', String(an));
    return;
  }

  const wahl = e.target.closest('[data-wahl]');
  if (wahl) {
    const gruppe = wahl.closest('[data-wahlfeld]');
    const form = document.getElementById('dlgForm');
    form.elements[gruppe.dataset.wahlfeld].value = wahl.dataset.wahl;
    // Blasen (Einheitenwahl) und der Ja/Nein-Schalter (CXCIII) teilen sich
    // diese Verdrahtung — jeder trägt seine eigene Aktiv-Klasse.
    for (const knopf of gruppe.querySelectorAll('[data-wahl]')) {
      const an = knopf === wahl;
      knopf.classList.toggle(
        knopf.classList.contains('schaltknopf') ? 'an' : 'gewaehlt', an);
      knopf.setAttribute('aria-pressed', String(an));
    }
    // Ein Schalter mit Umbau (CCCI: Nießbrauch) baut das Formular neu auf, sobald
    // er umgelegt wird — dann kommen/gehen die abhängigen Felder.
    if (gruppe.dataset.umbau && dialogUmbau) setTimeout(dialogUmbau, 0);
    return;
  }

  const weg = e.target.closest('[data-bw-weg]');
  if (weg) {
    // Erst beim Speichern wirklich löschen — bis dahin nur gemerkt.
    const zeile = weg.closest('.bwzeile');
    if (zeile.dataset.bid) bewohnerWeg.push(zeile.dataset.bid);
    zeile.remove();
    return;
  }
  if (e.target.closest('[data-bw-neu]')) {
    e.target.closest('[data-bw-neu]').insertAdjacentHTML('beforebegin',
      bewohnerZeile({}));
    return;
  }

  // CCCXXVII — Gemeinschaftsflächen-Zeilen hinzufügen/entfernen.
  const gfWeg = e.target.closest('[data-gf-weg]');
  if (gfWeg) { gfWeg.closest('.gfzeile').remove(); return; }
  if (e.target.closest('[data-gf-neu]')) {
    e.target.closest('[data-gf-neu]').insertAdjacentHTML('beforebegin', gemeinZeile({}));
    return;
  }

  const standWeg = e.target.closest('[data-stand-weg]');
  if (standWeg) {
    const kid = document.getElementById('dlgForm').dataset.id;
    try {
      await api(`/kreditstaende/${standWeg.dataset.standWeg}`, { method: 'DELETE' });
    } catch (fehler) {
      return melde(String(fehler.message || fehler), 'neg');
    }
    await laden();
    return standFormular(kid);
  }

  const staende = e.target.closest('[data-staende]');
  if (staende) return standFormular(staende.dataset.staende);

  const erhoehung = e.target.closest('[data-erhoehung]');
  if (erhoehung) return erhoehungFormular(erhoehung.dataset.erhoehung);
});

document.getElementById('dlgForm').addEventListener('submit', async e => {
  // Der Dialog schliesst sich nicht mehr von selbst (siehe Kommentar am
  // <form>): erst wenn gespeichert ist, geht er zu. Schlaegt es fehl, bleibt
  // alles Eingetippte stehen und laesst sich verbessern.
  e.preventDefault();
  const form = e.target;
  const { absicht, bereich, id } = form.dataset;
  const knopf = form.querySelector('button[value="ok"]');
  const beschriftung = knopf ? knopf.textContent : '';
  if (knopf) { knopf.disabled = true; knopf.textContent = 'Wird gespeichert …'; }

  try {
    if (absicht === 'stamm') {
      // dialogFelder statt stammfelder(): nur die tatsächlich gezeigten Felder,
      // inkl. der beim Nießbrauch-Umschalten dazugekommenen (CCCI).
      await api(`/objekte/${encodeURIComponent(slug)}`,
                { method: 'PATCH', body: ausFormular(form, dialogFelder) });
    } else if (absicht === 'grund') {
      await api(`/objekte/${encodeURIComponent(slug)}`,
                { method: 'PATCH', body: ausFormular(form, GRUNDFELDER) });
    } else if (absicht === 'weg') {
      await api(`/objekte/${encodeURIComponent(slug)}`,
                { method: 'PATCH', body: ausFormular(form, WEGFELDER) });
    } else if (absicht === 'anteil') {
      const werte = ausFormular(form, ANTEILFELDER);
      await api(`/objekte/${encodeURIComponent(slug)}/anteile`, {
        method: 'POST',
        body: { eigentuemer_id: Number(werte.eigentuemer_id),
                promille: Number(werte.promille) || 1000,
                einheit: werte.einheit || '',
                notiz: werte.notiz || '' },
      });
    } else if (absicht === 'einheit') {
      const werte = { ...ausFormular(form, EINHEITFELDER),
                      gemeinflaechen: gemeinAusFormular(form) };
      if (id) {
        await api(`/einheiten/${id}`, { method: 'PATCH', body: werte });
      } else {
        await api(`/objekte/${encodeURIComponent(slug)}/einheiten`,
                  { method: 'POST', body: werte });
      }
    } else if (absicht === 'zeitraum') {
      const werte = ausFormular(form, ZEITRAUMFELDER);
      await api(`/objekte/${encodeURIComponent(slug)}/zeitraeume`,
                { method: 'POST', body: { jahr: Number(werte.jahr) } });
    } else if (absicht === 'stand') {
      const werte = ausFormular(form, dialogFelder);
      await api(`/kredite/${id}/staende`, {
        method: 'POST',
        body: { jahr: Number(werte.jahr), restschuld: werte.restschuld || 0,
                ...(werte.zinsen_ist != null ? { zinsen_ist: werte.zinsen_ist } : {}) },
      });
      await laden();
      // Gleich weiter: Jahresstände werden meist mehrere auf einmal gepflegt.
      return standFormular(id);
    } else if (absicht === 'grundschuld') {
      const werte = ausFormular(form, GRUNDSCHULDFELDER);
      // Immer mitgeschickt, nie weggelassen: die Blasen zeigen den Stand, den
      // der Nutzer gerade bestätigt hat — „unangetastet lassen" gibt es in
      // dieser Maske nicht, hier wird stets neu gesetzt.
      const kredit_ids = [...form.querySelectorAll('[data-gs-kredit].gewaehlt')]
        .map(b => Number(b.dataset.gsKredit));
      const body = { ...werte, kredit_ids };
      if (id) {
        await api(`/grundschulden/${id}`, { method: 'PATCH', body });
      } else {
        await api(`/objekte/${encodeURIComponent(slug)}/grundschulden`,
                  { method: 'POST', body });
      }
    } else {
      // Nicht `cfgFuer(bereich).felder`: bei den Verträgen entscheidet die
      // Vertragsart, welche Felder überhaupt dastanden.
      // Pseudo-Rubriken (Erwerbsnebenkosten) schicken feste Werte mit und
      // sprechen den geteilten Endpunkt an (CCCXIX).
      const werte = { ...ausFormular(form, dialogFelder),
                      ...(RUBRIK_FESTWERTE[bereich] || {}) };
      const ep = endpunktBereich(bereich);
      let miete_id = id;
      if (id) {
        await api(`/stammdaten/${ep}/${id}`, { method: 'PATCH', body: werte });
      } else {
        const neu = await api(`/objekte/${encodeURIComponent(slug)}/${ep}`,
                              { method: 'POST', body: werte });
        miete_id = neu.id;
      }
      if (bereich === 'mieten') {
        await bewohnerSpeichern(form, miete_id);
        // Die Erhöhung löst den bisherigen Stand ab — er endet am Tag davor.
        if (form.dataset.vorgaenger && werte.ab_datum) {
          await api(`/stammdaten/mieten/${form.dataset.vorgaenger}`, {
            method: 'PATCH', body: { bis_datum: tagDavor(werte.ab_datum) } });
        }
      }
    }
    dlg.close();
    await laden();
  } catch (fehler) {
    melde(String(fehler.message || 'Konnte nicht gespeichert werden.'), 'neg');
  } finally {
    if (knopf) { knopf.disabled = false; knopf.textContent = beschriftung; }
  }
});

const ZEITRAUMFELDER = [
  { k: 'jahr', l: 'Abrechnungsjahr', typ: 'number', pflicht: true,
    vorgabe: new Date().getFullYear() - 1 },
];

let ANTEILFELDER = [];

async function anteilFormular() {
  let eigner = [];
  try { eigner = await api('/eigentuemer'); } catch { /* leer behandeln */ }
  if (!eigner.length) {
    const hin = await frage('Noch kein Eigentümer angelegt',
      'Eigentümer werden einmal zentral gepflegt und dann den Immobilien '
      + 'zugeordnet. Jetzt in den Einstellungen anlegen?',
      { knopf: 'Zu den Einstellungen' });
    if (hin) location.href = 'settings.html#eigentuemer';
    return;
  }
  ANTEILFELDER = [
    { k: 'eigentuemer_id', l: 'Eigentümer', typ: 'select',
      werte: eigner.map(e => e.name) },
    // Die Einheitenwahl nur, wenn es überhaupt Einheiten gibt — ein
    // Grundstück oder ein Objekt ohne erfasste Einheiten kennt nur den
    // Haus-Anteil.
    ...(einheiten.length
      ? [{ k: 'einheit', l: 'Gehört dem Eigentümer', typ: 'anteileinheit' }]
      : []),
    { k: 'promille', l: 'Anteil in Tausendstel (‰)', typ: 'number', schritt: '0.1',
      vorgabe: 1000, pflicht: true },
    { k: 'notiz', l: 'Notiz', typ: 'text' },
  ];
  await formular({ titel: 'Eigentümer zuordnen', felder: ANTEILFELDER,
                   absicht: 'anteil' });
  // Der Name im Auswahlfeld muss zur ID werden — die Reihenfolge ist dieselbe.
  const feld = document.getElementById('f_eigentuemer_id');
  eigner.forEach((e, i) => { feld.options[i].value = e.id; });
}

inhalt.addEventListener('click', async e => {
  if (e.target.closest('[data-haus]')) {
    location.href = hausUrl();
    return;
  }

  /* ---- Dokumentenbaum (CCXCIX) ---- */
  const bf = e.target.closest('[data-bfilter]');
  if (bf) {
    const wert = bf.dataset.bfilter;
    baumFilter = (baumFilter === wert) ? '' : wert;
    baumMalen();
    return;
  }
  const bm = e.target.closest('[data-bmehr]');
  if (bm) { baumMehr.add(bm.dataset.bmehr); baumMalen(); return; }
  // CCCXXI — auf das Statuszeichen eines zugeordneten Belegs tippen: umhängen.
  // Erst die alte Zuordnung lösen, dann den Zuordnen-Dialog wie sonst.
  const um = e.target.closest('[data-umhaengen]');
  if (um) {
    const dokId = Number(um.dataset.umhaengen);
    const dok = (baumDaten?.aeste || []).flatMap(a => a.dokumente)
      .find(d => d.id === dokId) || { dateiname: 'Dokument' };
    const wahl = await zuordnenDialog(dok, um.dataset.rubrik || '', true);
    if (!wahl) return;
    try {
      await api(`/dokumente/${dokId}/loese-zuordnung`, { method: 'POST' });
      if (wahl.entfernen) {
        melde('Zuordnung gelöst — der Beleg ist wieder offen', '');
      } else {
        const r = await api(`/dokumente/${dokId}/zuordnen`,
                            { method: 'POST', body: wahl });
        const wo = (r.angelegt || []).map(a => a.wo).filter(Boolean).join(' · ');
        melde(wo ? `Umgehängt: ${wo}` : 'Neu zugeordnet', 'pos');
      }
      await laden();
    } catch (fehler) { melde(fehler.message || 'Umhängen fehlgeschlagen', 'neg'); }
    return;
  }

  const zu = e.target.closest('[data-zuordnen]');
  if (zu) {
    const dokId = Number(zu.dataset.zuordnen);
    const dok = (baumDaten?.aeste || []).flatMap(a => a.dokumente)
      .find(d => d.id === dokId) || { dateiname: 'Dokument' };
    const wahl = await zuordnenDialog(dok, zu.dataset.rubrik || '');
    if (!wahl) return;
    zu.disabled = true; zu.textContent = '…';
    try {
      const r = await api(`/dokumente/${dokId}/zuordnen`,
                          { method: 'POST', body: wahl });
      const wo = (r.angelegt || []).map(a => a.wo).filter(Boolean).join(' · ');
      melde(wo ? `Angelegt: ${wo} — unten als Entwurf bestätigen`
                : 'Aus diesem Beleg liess sich kein Eintrag ableiten', wo ? 'pos' : '');
      await laden();
    } catch (fehler) {
      zu.disabled = false; zu.textContent = 'zuordnen';
      melde(fehler.message || 'Zuordnen fehlgeschlagen', 'neg');
    }
    return;
  }

  const einheitWeg = e.target.closest('[data-einheit-weg]');
  if (einheitWeg) {
    e.stopPropagation();
    const eintrag = einheiten.find(x =>
      String(x.id) === einheitWeg.dataset.einheitWeg);
    const ja = await frage(`„${eintrag ? eintrag.bezeichnung : 'Einheit'}“ entfernen?`,
      'Die Einheit wird gelöscht. Mietverhältnisse, die daran hängen, müssen '
      + 'vorher weg — sonst gehörten sie zu keiner Wohnung mehr.',
      { knopf: 'Entfernen', gefahr: true });
    if (!ja) return;
    try {
      await api(`/einheiten/${einheitWeg.dataset.einheitWeg}`, { method: 'DELETE' });
    } catch (fehler) {
      return melde(String(fehler.message || 'Konnte nicht entfernt werden.'), 'neg');
    }
    return laden();
  }

  const einheitEdit = e.target.closest('[data-einheit-edit]');
  if (einheitEdit) {
    const eintrag = einheiten.find(x =>
      String(x.id) === einheitEdit.dataset.einheitEdit);
    if (!eintrag) return;
    return formular({ titel: 'Einheit bearbeiten', felder: EINHEITFELDER,
                      werte: eintrag, absicht: 'einheit',
                      extra: gemeinBlock(eintrag.gemeinflaechen || []) });
  }

  if (e.target.closest('[data-einheit-neu]')) {
    return formular({ titel: 'Einheit anlegen', felder: EINHEITFELDER,
                      absicht: 'einheit', knopf: 'Anlegen',
                      extra: gemeinBlock([]),
                      hinweis: 'Wohnung, Büro oder Stellplatz — die Bezeichnung '
                        + 'steht später auf den Mietverhältnissen und in der '
                        + 'Abrechnung.' });
  }

  const einheit = e.target.closest('[data-einheit]');
  if (einheit) {
    location.href = einheitUrl(einheit.dataset.einheit);
    return;
  }

  const zeitraum = e.target.closest('[data-zeitraum]');
  if (zeitraum) {
    location.href = `zeitraum.html?z=${zeitraum.dataset.zeitraum}`;
    return;
  }

  if (e.target.closest('[data-zeitraum-neu]')) {
    return formular({ titel: 'Abrechnungszeitraum anlegen', felder: ZEITRAUMFELDER,
                      absicht: 'zeitraum' });
  }

  if (e.target.closest('[data-stamm]')) {
    return formular({ titel: 'Stammdaten bearbeiten', felder: stammfelder(),
                      werte: objekt, absicht: 'stamm' });
  }

  if (e.target.closest('[data-grund]')) {
    return formular({ titel: 'Grundstück bearbeiten', felder: GRUNDFELDER,
                      werte: objekt, absicht: 'grund',
                      hinweis: 'Reihenfolge der Grundsteuer: Grundsteuerwert '
                        + '(Finanzamt) × Steuermesszahl = Steuermessbetrag '
                        + '(Finanzamt) × Hebesatz (Gemeinde) = Grundsteuer/Jahr. '
                        + 'Der Grundstückswert ist der Marktwert und steht nicht '
                        + 'im Bescheid.' });
  }

  if (e.target.closest('[data-weg]')) {
    return formular({ titel: 'WEG-Ebene bearbeiten', felder: WEGFELDER,
                      werte: objekt, absicht: 'weg',
                      hinweis: 'Ist die Wohnung Teil einer '
                        + 'Wohnungseigentümergemeinschaft, verteilt die '
                        + 'Hausverwaltung die Nebenkosten. ImmoCalc verteilt '
                        + 'dann nicht selbst — du trägst die fertigen Werte je '
                        + 'Mieter direkt ein. Hausgeld ist ein '
                        + 'Eigentümerkosten.' });
  }

  if (e.target.closest('[data-anteil-neu]')) return anteilFormular();

  const anteilWeg = e.target.closest('[data-anteil]');
  if (anteilWeg) {
    const ja = await frage('Zuordnung entfernen?',
      'Der Eigentümer bleibt erhalten — nur die Beteiligung an dieser '
      + 'Immobilie wird gelöst.', { knopf: 'Entfernen', gefahr: true });
    if (!ja) return;
    try {
      await api(`/anteile/${anteilWeg.dataset.anteil}`, { method: 'DELETE' });
    } catch (fehler) {
      return melde(String(fehler.message || 'Konnte nicht entfernt werden.'), 'neg');
    }
    return laden();
  }

  const cloud = e.target.closest('[data-cloud]');
  if (cloud && cloud.dataset.cloud === 'status') return cloudZeigen();
  if (cloud) {
    cloud.disabled = true;
    cloud.textContent = 'Lege an …';
    try {
      const antwort = await api(
        `/nextcloud/objekte/${encodeURIComponent(slug)}/struktur`, { method: 'POST' });
      cloud.textContent = antwort.neu_angelegt.length
        ? `${antwort.neu_angelegt.length} Ordner angelegt`
        : 'Alles schon vorhanden';
      setTimeout(cloudZeigen, 1600);
    } catch (fehler) {
      cloud.disabled = false;
      cloud.textContent = 'Fehlgeschlagen — nochmal';
      melde(String(fehler.message || fehler), 'neg');
    }
    return;
  }

  if (e.target.closest('[data-export]')) {
    location.href = `/api/objekte/${encodeURIComponent(slug)}/export`;
    return;
  }

  const weg = e.target.closest('[data-loeschen]');
  if (weg) {
    // Schieben statt klicken: Löschen ist nicht rückgängig zu machen, und ein
    // zweiter Klick an derselben Stelle passiert zu leicht aus Versehen.
    const ja = await schiebeFrage(`„${objekt.name}“ löschen`,
      'Alle Eingaben zu dieser Immobilie werden entfernt. Die Unterlagen in '
      + 'der Nextcloud bleiben bestehen; eine Sicherung wird vorher dort '
      + 'abgelegt.', 'Zum Löschen schieben');
    if (!ja) return;
    weg.disabled = true;
    weg.textContent = 'Sichere und lösche …';
    try {
      const antwort = await api(`/objekte/${encodeURIComponent(slug)}`,
                                { method: 'DELETE' });
      // Erst melden, dann zurück: sonst wäre die Bestätigung schon weg,
      // bevor sie jemand gelesen hat.
      melde(antwort.sicherung?.gesichert
        ? `„${antwort.name}“ gelöscht · Sicherung: ${antwort.sicherung.pfad}`
        : `„${antwort.name}“ gelöscht — ohne Sicherung in der Nextcloud `
          + `(${antwort.sicherung?.grund || 'kein Grund genannt'})`,
        antwort.sicherung?.gesichert ? 'pos' : '');
      setTimeout(() => { location.href = 'index.html'; }, 2600);
    } catch (fehler) {
      weg.disabled = false;
      weg.textContent = 'Immobilie löschen';
      melde(String(fehler.message || fehler), 'neg');
    }
    return;
  }

  // CCLXXVIII — Orange-Entwürfe: den Beleg ansehen, bestätigen, verwerfen.
  const beleg = e.target.closest('[data-beleg]');
  if (beleg) {
    e.stopPropagation();
    belegAnsehen(`/api/dokumente/${beleg.dataset.beleg}/inhalt`, 'Beleg');
    return;
  }

  const ok = e.target.closest('[data-ok]');
  if (ok) {
    e.stopPropagation();
    const [typ, id] = ok.dataset.ok.split(':');
    ok.disabled = true;
    try {
      await api(`/entwuerfe/${typ}/${id}/bestaetigen`, { method: 'POST' });
    } catch (fehler) {
      ok.disabled = false;
      return melde(String(fehler.message || 'Konnte nicht bestätigt werden.'), 'neg');
    }
    return laden();
  }

  const zurueck = e.target.closest('[data-zurueck]');
  if (zurueck) {
    e.stopPropagation();
    const [typ, id] = zurueck.dataset.zurueck.split(':');
    const ja = await frage('Zurück zum Prüfen?',
      'Der Entwurf wird verworfen. Der Beleg bleibt erhalten und geht zurück in '
      + 'den Prüfmodus, wo du ihn neu zuordnen kannst.',
      { knopf: 'Verwerfen', gefahr: true });
    if (!ja) return;
    try {
      await api(`/entwuerfe/${typ}/${id}/verwerfen`, { method: 'POST' });
    } catch (fehler) {
      return melde(String(fehler.message || 'Konnte nicht verworfen werden.'), 'neg');
    }
    return laden();
  }

  const del = e.target.closest('[data-del]');
  if (del) {
    e.stopPropagation();
    const [bereich, id] = del.dataset.del.split(':');
    const ja = await frage(`${cfgFuer(bereich).einzahl} löschen?`,
      'Der Eintrag wird entfernt. Rückgängig machen lässt sich das nicht.',
      { knopf: 'Löschen', gefahr: true });
    if (!ja) return;
    try {
      await api(`/stammdaten/${endpunktBereich(bereich)}/${id}`, { method: 'DELETE' });
    } catch (fehler) {
      return melde(String(fehler.message || 'Konnte nicht gelöscht werden.'), 'neg');
    }
    return laden();
  }

  const add = e.target.closest('[data-add]');
  if (add) {
    const bereich = add.dataset.add;
    const cfg = cfgFuer(bereich);
    // Im Fokus ist die Einheit schon entschieden — die Blase steht vorgewählt da.
    const werte = bereich === 'mieten' && fokus
      ? { einheit: fokus.bezeichnung } : {};
    return formular({ titel: `${cfg.einzahl} hinzufügen`,
                      felder: felderFuer(bereich, werte), bereich, werte,
                      absicht: 'eintrag',
                      extra: bereich === 'mieten' ? mietExtra(null) : '' });
  }

  // CCCXIII — Klick auf einen Eintrag öffnet die Detailansicht (Daten links,
  // Beleg rechts). Das Bearbeiten-Formular ist von dort aus erreichbar.
  const edit = e.target.closest('[data-edit]');
  if (edit) {
    const [bereich, id] = edit.dataset.edit.split(':');
    return eintragDetail(bereich, id);
  }

  // CCXXIX — Grundschulden hängen nicht an BEREICHE (eigene Endpunkte), daher
  // eigene data-Attribute statt data-add/-edit/-del.
  if (e.target.closest('[data-gs-neu]')) return grundschuldFormular(null);

  const gsEdit = e.target.closest('[data-gs-edit]');
  if (gsEdit) {
    const g = grundschulden.find(x => String(x.id) === gsEdit.dataset.gsEdit);
    return g ? grundschuldFormular(g) : undefined;
  }

  const gsWeg = e.target.closest('[data-gs-weg]');
  if (gsWeg) {
    e.stopPropagation();
    const ja = await frage('Grundschuld löschen?',
      'Der Eintrag wird entfernt. Rückgängig machen lässt sich das nicht.',
      { knopf: 'Löschen', gefahr: true });
    if (!ja) return;
    try {
