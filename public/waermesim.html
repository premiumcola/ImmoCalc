<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wärme-Simulation · ImmoCalc</title>
<link rel="stylesheet" href="assets/immo.css">
<style>
  /* N340f — Werkzeug auf Zeit: eine Seite, ein Modul, danach spurlos weg.
     Deshalb steht der Stil hier und nicht in immo.css. */
  .wz-kopf{margin:0 0 16px}
  .wz-kopf h2{font:700 19px var(--disp);letter-spacing:-.02em;margin:0 0 6px}
  .wz-kopf p{font:400 13.5px var(--body);color:var(--soft);margin:0 0 4px;line-height:1.5}
  .wz-kopf b{color:var(--amber)}
  .wz-hinweis{font-size:12.5px !important;color:var(--teal-d) !important}

  .wz-frei,.wz-lane{background:var(--sheet);border-radius:16px;padding:14px 14px 10px;
    margin-bottom:12px;box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .wz-frei{background:var(--paper);border:1.5px dashed var(--line)}
  .wz-lane.bereit{outline:2px dashed var(--teal);outline-offset:2px}
  .wz-frei h3,.wz-lane h3{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    font:700 15px var(--disp);letter-spacing:-.01em;margin:0 0 10px}
  .wz-frei h3 span,.wz-lane h3 span{font:500 11.5px var(--mono);color:var(--soft)}
  .wz-lane h3 .wz-zahl{margin-left:auto}
  .wz-leer{font:400 13px var(--body);color:var(--soft);margin:2px 0 6px}

  .wz-liste{display:flex;flex-direction:column;gap:8px;min-height:44px}
  /* N340j — vorher hingen die Kärtchen randlos auf der Fläche, kaum vom
     Hintergrund zu unterscheiden. Jetzt eigenes Blatt: heller als der Grund,
     echte Kante, sichtbarer Schatten — jedes Gerät ein klar umrissenes Ding. */
  .wz-karte{display:flex;align-items:center;gap:10px;background:var(--sheet);
    border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    cursor:grab;box-shadow:0 1px 3px rgba(22,38,44,.07);
    -webkit-tap-highlight-color:transparent}
  .wz-frei .wz-karte{background:var(--sheet)}
  .wz-lane .wz-karte{background:var(--paper)}
  .wz-karte:hover{border-color:#C3CDCE;box-shadow:0 2px 6px rgba(22,38,44,.1)}
  .wz-karte.auf{outline:2px solid var(--teal);outline-offset:1px;
    border-color:var(--teal);background:var(--teal-l);
    box-shadow:0 3px 10px rgba(15,110,92,.18)}
  .wz-karte.mahnt{border-left:3px solid var(--amber);
    box-shadow:0 1px 3px rgba(145,98,18,.14)}
  /* Der Griff: gross genug zum Treffen (44 px), damit das Namensfeld daneben
     ungestört getippt werden kann. */
  .wz-nr{flex:none;min-width:56px;min-height:44px;border:none;border-radius:10px;
    background:var(--sheet);color:var(--teal-d);font:700 13px var(--mono);
    cursor:grab;-webkit-tap-highlight-color:transparent}
  .wz-karte.auf .wz-nr{background:var(--teal);color:#fff}
  .wz-mitte{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .wz-name{width:100%;box-sizing:border-box;border:1px solid var(--line);
    border-radius:9px;background:var(--paper);padding:9px 10px;min-height:40px;
    font:500 16px var(--body);color:var(--ink)}
  .wz-name:focus{outline:none;border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(15,110,92,.12)}
  .wz-meta{font:500 10.5px var(--mono);color:var(--soft)}
  /* Der Jahresverlauf: ein Balken je Jahr, darunter Wert und Kurzjahr.
     Fehlende Jahre bleiben als blasse Spalte stehen — eine Lücke soll man
     sehen, nicht übersehen. */
  .wz-verlauf{display:flex;gap:4px;align-items:flex-end;margin-top:5px;
    max-width:210px}
  .wz-vj{display:flex;flex-direction:column;align-items:center;gap:1px;flex:1;
    min-width:0}
  .wz-vj i{display:block;width:100%;max-width:26px;border-radius:3px 3px 0 0;
    background:var(--teal);opacity:.75}
  .wz-vj b{font:600 9.5px var(--mono);color:var(--ink);line-height:1}
  .wz-vj em{font:500 9px var(--mono);color:var(--soft);font-style:normal}
  .wz-vj.leer i{background:var(--line);height:2px}
  .wz-vj.leer b{color:var(--line)}
  .wz-faktor{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .wz-faktor label{font:600 9.5px var(--mono);letter-spacing:.07em;
    text-transform:uppercase;color:var(--soft)}
  .wz-faktor input{width:74px;box-sizing:border-box;border:1px solid var(--line);
    border-radius:9px;background:var(--paper);padding:8px;min-height:40px;
    text-align:right;font:600 16px var(--mono);color:var(--ink)}
  .wz-faktor.kwh{font:600 11px var(--mono);color:var(--soft);align-self:center}
  /* N340i — am Rechner wird gearbeitet, nicht getippt: die Seite nutzt die
     ganze Breite, die Lanes stehen nebeneinander statt untereinander, und die
     Kärtchen werden schmaler statt länger. So sieht man alle Einheiten und den
     Vorrat gleichzeitig — beim Zuordnen ist genau das der Punkt. */
  @media (min-width:900px){
    .scroll .wrap{max-width:1500px}
    .wz-kopf{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
    .wz-kopf h2{margin:0}
    .wz-kopf p{margin:0;flex:1;min-width:280px}
    /* Vorrat links, Einheiten rechts daneben — der Weg des Kärtchens ist damit
       kurz und in einem Blickfeld. */
    #inhalt{display:grid;grid-template-columns:minmax(420px,460px) 1fr;
      gap:16px;align-items:start}
    .wz-kopf{grid-column:1/-1}
    .wz-frei{position:sticky;top:8px;max-height:calc(100dvh - 120px);
      overflow:auto;margin-bottom:0}
    .wz-lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
      gap:12px;align-content:start}
    .wz-lane{margin-bottom:0}
    .wz-liste{gap:7px}
  }
  @media (min-width:1600px){
    #inhalt{grid-template-columns:minmax(460px,520px) 1fr}
  }

  /* N340l — die Simulation: eigener Block NACH dem Zähler-Konfigurator, als
     eigenes Grid ausserhalb von #inhalt. Erst innerhalb desselben Grids wie
     die fixierte „Noch nicht zugeordnet"-Spalte platziert, überlappte deren
     Sticky-Panel die Tabelle darunter — Grid-Zeilen richten sich nach dem
     höchsten Element einer Reihe, und die Sticky-Spalte blieb dadurch länger
     sichtbar, als die Nachbarspalte tatsächlich Platz beanspruchte. */
  #wsim-wrap{margin-top:22px}
  .wsim-titel{font:700 17px var(--disp);letter-spacing:-.02em;margin:0 0 6px}
  .wsim-hinweis{font:400 13px var(--body);color:var(--soft);margin:0 0 12px;
    line-height:1.5}
  .wsim-jahre{display:inline-flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .wsim-jahrknopf{min-height:38px;padding:0 14px;border:1px solid var(--line);
    border-radius:10px;background:var(--sheet);color:var(--ink);
    font:600 13px var(--mono);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .wsim-jahrknopf:hover{border-color:#C3CDCE}
  .wsim-jahrknopf.an{background:var(--teal);border-color:var(--teal);color:#fff}
  .wsim-lade,.wsim-leer{font:400 13.5px var(--body);color:var(--soft);
    padding:14px 2px}
  .wsim-soll{background:var(--paper);border-radius:12px;padding:12px 14px;
    font:400 13.5px var(--body);color:var(--ink);line-height:1.5;margin:0 0 12px}
  .wsim-soll b{font-weight:700}
  .wsim-treffer{color:var(--teal-d);font-weight:600}
  .wsim-abw{color:var(--amber);font-weight:600}
  .wsim-quelle{font:400 12px var(--mono);color:var(--soft);margin:0 0 12px;
    line-height:1.6}
  .wsim-quelle a,.wsim-alleq a{color:var(--teal-d);text-decoration:none;
    border-bottom:1px solid currentColor}
  .wsim-quelle a:hover,.wsim-alleq a:hover{color:var(--teal)}
  .wsim-alleq{margin-top:22px;border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;background:var(--sheet)}
  .wsim-alleq summary{font:600 13px var(--body);color:var(--ink);cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .wsim-alleq ul{list-style:none;margin:10px 0 0;padding:0;display:flex;
    flex-direction:column;gap:6px}
  .wsim-alleq li{font:400 12.5px var(--body);color:var(--soft);line-height:1.5}
  .wsim-alleq li b{color:var(--ink);font:600 12.5px var(--mono);margin-right:6px}
  .wsim-nochoffen{color:var(--amber)}
  .wsim-luecke{font-style:italic}
  .wsim-tabelle{background:var(--sheet);border:1px solid var(--line);
    border-radius:14px;overflow:hidden}
  .wsim-kopf,.wsim-zeile{display:grid;
    grid-template-columns:1fr 90px 90px 90px;gap:8px;align-items:center;
    padding:10px 14px}
  .wsim-kopf{font:600 10.5px var(--mono);letter-spacing:.06em;
    text-transform:uppercase;color:var(--soft);background:var(--paper)}
  .wsim-kopf span:nth-child(2),.wsim-kopf span:nth-child(3){text-align:right}
  .wsim-zeile{border-top:1px solid var(--line);font:500 13.5px var(--body)}
  .wsim-zeile:first-of-type{border-top:none}
  .wsim-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wsim-vorjahr{text-align:right;color:var(--soft);font:500 13px var(--mono)}
  .wsim-jetzt{text-align:right;font:700 13.5px var(--mono);color:var(--ink)}
  .wsim-diff{text-align:right;font:600 12px var(--mono);color:var(--soft)}
  .wsim-diff.auf{color:var(--neg)}
  .wsim-diff.ab{color:var(--teal-d)}
  .wsim-zeile:last-child{background:var(--paper);font-weight:700}
  @media (max-width:480px){
    .wsim-kopf,.wsim-zeile{grid-template-columns:1fr 70px 70px 60px;
      padding:9px 10px;font-size:12px}
  }

  /* N340n — Warmwasser-Statistik: Verhältnis zu den Heizkosten je Jahr, dazu
     die Vollständigkeitsliste der gefundenen Warmwasserzähler. */
  #wsim-ww{margin-top:24px}
  .wsim-wwtitel{font:700 15px var(--disp);letter-spacing:-.01em;margin:18px 0 4px}
  .wsim-wwtitel:first-child{margin-top:0}
  .wsim-wwbalken{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .wsim-wwzeile{display:grid;
    grid-template-columns:56px 1fr 62px 190px;gap:10px;align-items:start}
  .wsim-wwjahr{font:600 12px var(--mono);color:var(--soft)}
  .wsim-wwspur{height:16px;border-radius:8px;background:var(--paper);overflow:hidden}
  .wsim-wwfuellung{display:block;height:100%;border-radius:8px;
    background:var(--teal);opacity:.8}
  .wsim-wwproz{text-align:right;font:700 12.5px var(--mono);color:var(--ink)}
  .wsim-wwbetrag{font:500 11px var(--mono);color:var(--soft);white-space:nowrap}
  .wsim-wwliste{list-style:none;margin:8px 0 0;padding:0;display:flex;
    flex-direction:column;gap:6px}
  .wsim-wwliste li{font:400 13px var(--body);color:var(--ink);
    background:var(--sheet);border:1px solid var(--line);border-radius:10px;
    padding:9px 12px}
  .wsim-wwliste b{font-family:var(--mono);font-size:12.5px;color:var(--teal-d)}
  .wsim-wwhinweis{font:400 12.5px var(--body);color:var(--soft);
    line-height:1.5;margin:8px 0 0}
  @media (max-width:480px){
    .wsim-wwzeile{grid-template-columns:44px 1fr 44px;grid-template-areas:
      "jahr spur proz" "betrag betrag betrag"}
    .wsim-wwjahr{grid-area:jahr}.wsim-wwspur{grid-area:spur}
    .wsim-wwproz{grid-area:proz}
    .wsim-wwbetrag{grid-area:betrag;text-align:right}
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="titel">
      <h1>Wärme-Simulation</h1>
      <p class="sub">Laufer Str. 5 · Zähler konfigurieren</p>
    </div>
  </header>
  <div class="scroll"><div class="wrap" id="inhalt"></div><div class="wrap" id="wsim-wrap"></div></div>
  <div data-nav></div>
</div>
<script type="module">
  import { installNav } from './assets/immo.js';
  import { start } from './assets/waermesim/konfig.js';
  installNav();
  start();
</script>
</body>
</html>
