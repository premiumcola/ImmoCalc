<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PV Amortisation · ImmoCalc</title>
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F6E5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ImmoCalc">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/immo.css">
<style>
  /* ------------------------------------------------------------------
     Nur strom.html (N83). immo.css wird hier nicht angefasst; was sich
     spaeter als seitenuebergreifend erweist, wandert dann dorthin.
     ------------------------------------------------------------------ */
  .filter{display:flex;gap:8px;margin-bottom:14px}
  .filter > div{flex:1;min-width:0}

  .karte{background:var(--sheet);border-radius:16px;padding:16px 16px 6px;
         margin-bottom:14px;box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .karte.eng{padding-bottom:16px}
  .karte h3{font:600 13px var(--disp);letter-spacing:-.01em;margin:0 0 4px;
            color:var(--ink)}
  .karte .hh{display:flex;align-items:baseline;justify-content:space-between;
             gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .karte .hint{font:400 12px var(--body);color:var(--soft);line-height:1.5;
               margin:0 0 14px;max-width:600px}

  /* Eingabe-Raster: auf breiten Schirmen mehrspaltig, auf dem iPhone eine
     Spalte. minmax verhindert, dass ein langes Label die Spalte sprengt. */
  .raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
          gap:12px 14px}
  .raster .field{margin-bottom:2px}
  /* N112 - ein Feld ueber die volle Breite (Eigentuemer-Anteile). Ohne eigene
     Zeile schob es sich vorher ueber die Kacheln darunter. */
  .field.breit{display:block;width:100%;margin:0 0 16px}
  .field.breit input{width:100%;box-sizing:border-box}
  .field .einheit{font-weight:400;text-transform:none;letter-spacing:0;
                  color:var(--soft)}

  /* Quellen-Zeile: Menge + Preis nebeneinander, Kosten als Chip rechts. */
  .quelle{display:grid;grid-template-columns:1fr 1fr auto;gap:12px 14px;
          align-items:end;padding:12px 0;border-top:1px solid var(--line)}
  .quelle:first-of-type{border-top:none}
  .quelle .qname{grid-column:1/-1;font:600 12.5px var(--disp);color:var(--ink);
                 display:flex;align-items:center;gap:8px}
  .quelle .qkosten{justify-self:end;align-self:end;text-align:right;min-width:92px}
  .quelle .qkosten .kl{display:block;font:600 9px var(--mono);letter-spacing:.07em;
                       text-transform:uppercase;color:var(--soft)}
  .quelle .qkosten .kv{display:block;font:700 15px var(--disp);
                       letter-spacing:-.02em;color:var(--ink);margin-top:3px}
  @media(max-width:439px){
    .quelle{grid-template-columns:1fr 1fr}
    .quelle .qkosten{grid-column:1/-1;justify-self:start;text-align:left;
                     display:flex;align-items:baseline;gap:8px}
    .quelle .qkosten .kv{margin-top:0}
  }

  /* Ergebnis: die beiden Verbrauchsgruppen nebeneinander. */
  .gruppen{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
           gap:12px}
  .gr{background:var(--paper);border-radius:14px;padding:14px}
  .gr .gt{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
          margin-bottom:10px}
  .gr .gn{font:600 13px var(--disp);letter-spacing:-.01em;color:var(--ink)}
  .gr .gs{font:700 18px var(--disp);letter-spacing:-.02em;color:var(--teal-d)}
  .gr .zeile{display:flex;align-items:baseline;justify-content:space-between;
             gap:10px;padding:6px 0;font:500 12.5px var(--body);color:var(--soft)}
  .gr .zeile b{font:600 12.5px var(--body);color:var(--ink)}
  .gr .zeile .kwhx{font:400 11px var(--mono);color:var(--soft)}

  /* Kennzahlen (PV-Ergebnis). */
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
       gap:10px;margin-top:4px}
  .kpi .k{background:var(--paper);border-radius:14px;padding:12px 13px}
  .kpi .kl{display:block;font:600 9px var(--mono);letter-spacing:.07em;
           text-transform:uppercase;color:var(--soft)}
  .kpi .kv{display:block;font:700 16px var(--disp);letter-spacing:-.02em;
           margin-top:6px;color:var(--ink)}
  .kpi .kv.pos{color:var(--pos)}
  .kpi .knote{display:block;font:400 10.5px var(--body);color:var(--soft);
              margin-top:4px;line-height:1.35}

  /* Eigentuemer-Verteilung. */
  .eig{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
       gap:12px}
  .eig .ez{background:var(--paper);border-radius:14px;padding:14px}
  .eig .eanteil{display:inline-block;font:600 11px var(--mono);color:var(--teal-d);
                background:var(--teal-l);border-radius:999px;padding:3px 10px;
                margin-bottom:10px}
  .eig .ezeile{display:flex;align-items:baseline;justify-content:space-between;
               gap:10px;padding:5px 0;font:500 12.5px var(--body);color:var(--soft)}
  .eig .ezeile b{font:700 14px var(--disp);color:var(--ink);letter-spacing:-.01em}

  /* Rest-Chip / abgeleitete Werte an einer Karte. */
  .abgeleitet{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
  .abgeleitet .chip{font:600 11px var(--mono)}

  .warnung{display:flex;gap:10px;align-items:flex-start;background:var(--amber-bg);
           color:var(--amber);border-radius:12px;padding:12px 14px;margin-bottom:14px;
           font:500 12.5px var(--body);line-height:1.5}
  .warnung .wi{font-size:15px;line-height:1.3;flex:none}

  .chartleer{font:400 13px var(--body);color:var(--soft);text-align:center;
             padding:22px 8px}

  /* N139 — die Karte, die sich auf das oben gewählte Jahr bezieht, sagt das
     auch: ein ruhiger Chip neben der Überschrift statt eines Satzes. */
  .jahrchip{font:600 10px var(--mono);letter-spacing:.07em;text-transform:uppercase;
            color:var(--teal-d);background:var(--teal-l);border-radius:999px;
            padding:4px 10px;white-space:nowrap}

  /* Verweis auf eine andere Seite (E-Tankstelle verwalten). */
  .verweis{display:inline-flex;align-items:center;gap:8px;box-sizing:border-box;
           min-height:44px;padding:11px 14px;margin:2px 0 14px;
           background:var(--paper);border-radius:12px;text-decoration:none;
           font:600 12.5px var(--body);color:var(--teal-d)}
  .verweis:hover{background:var(--teal-l)}

  /* N139 — PV-Eigentümer: je Person eine Zeile, Haken links, Tausendstel
     rechts. Die Zeile ist 44 px hoch, damit sie sich am iPhone treffen lässt. */
  .pa-zeile{display:flex;align-items:center;gap:12px;min-height:44px;
            padding:9px 12px;margin-bottom:8px;background:var(--paper);
            border-radius:12px}
  .pa-zeile input[type=checkbox]{width:20px;height:20px;flex:none;margin:0;
            accent-color:var(--teal)}
  .pa-name{flex:1;min-width:0;font:600 13px var(--disp);letter-spacing:-.01em;
           color:var(--ink);cursor:pointer}
  .pa-obj{display:block;font:400 11px var(--body);color:var(--soft);
          letter-spacing:0;margin-top:3px}
  .pa-wert{width:92px;flex:none;text-align:right}
  .pa-summe{display:flex;align-items:baseline;justify-content:space-between;
            gap:12px;padding:4px 12px 0;font:500 12.5px var(--body);
            color:var(--soft)}
  .pa-summe b{font:700 15px var(--disp);letter-spacing:-.02em;color:var(--ink)}
  /* Ein Hinweis, keine Sperre: gespeichert wird trotzdem. */
  .pa-hinweis{background:var(--amber-bg);color:var(--amber);border-radius:12px;
              padding:10px 13px;margin:10px 0 2px;line-height:1.5;
              font:500 12.5px var(--body)}

  /* ---- N127 Verlauf: Grafik, Legende, Jahrestabelle ---------------------- */
  .chart{width:100%;max-width:560px;height:auto;display:block;overflow:visible;
         margin:2px auto 10px}

  .legende{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 16px;
           font:500 11.5px var(--body);color:var(--soft)}
  .legende span{display:inline-flex;align-items:center;gap:7px}
  .legende i{width:11px;height:11px;border-radius:4px;flex:none}
  .legende i.schraffur{background:repeating-linear-gradient(45deg,
    #916212 0 2px, #FFF 2px 4px)}
  .legende i.prognose{background:rgba(178,66,41,.22);
                      box-shadow:inset 0 0 0 1.5px rgba(178,66,41,.55)}

  /* Sieben Geldspalten passen auf dem iPhone nicht nebeneinander — die Tabelle
     scrollt in ihrem eigenen Rahmen, die Seite selbst nie. */
  .tabrahmen{overflow-x:auto;-webkit-overflow-scrolling:touch;
             border-radius:12px;background:var(--paper);margin:0 0 14px}
  .jt{border-collapse:collapse;width:100%;min-width:520px}
  .jt th{font:600 9px var(--mono);letter-spacing:.07em;text-transform:uppercase;
         color:var(--soft);text-align:right;padding:11px 12px 9px;
         white-space:nowrap}
  .jt th:first-child{text-align:left}
  .jt td{font:500 12.5px var(--mono);color:var(--ink);text-align:right;
         padding:10px 12px;white-space:nowrap;
         border-top:1px solid rgba(22,38,44,.07)}
  .jt td:first-child{text-align:left;font:600 13px var(--disp);
                     letter-spacing:-.01em}
  .jt td.leise{color:var(--soft)}
  .jt td.summe{font-weight:700;color:var(--teal-d)}
  .jt .plus{color:var(--pos);font-weight:600}
  /* Der Hinweis erscheint nur, wenn die Tabelle wirklich nicht ganz passt —
     gemessen, nicht geraten (siehe `verlaufZeigen`). */
  .scrollhinweis{display:none;font:400 11.5px var(--body);color:var(--soft);
                 margin:-8px 0 14px}
  .scrollhinweis.zeigen{display:block}
  .jt tfoot td{font-weight:700;color:var(--ink);
               border-top:1.5px solid var(--line)}

  .verlaufleer{background:var(--paper);border-radius:14px;padding:18px 16px;
               margin-bottom:14px;font:400 13px var(--body);color:var(--soft);
               line-height:1.6}
  .verlaufleer p{margin:0 0 8px}
  .verlaufleer p:last-child{margin:0}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <a href="index.html" aria-label="Zur Übersicht" class="applogo-link"><img src="icons/icon.svg" alt="" class="applogo"></a>
    <div class="barwrap">
      <h1>PV Amortisation</h1>
      <div class="sub" id="sub">wird geladen …</div>
    </div>
  </div>

  <div class="scroll">
    <div class="filter">
      <div id="objekt"></div>
      <div id="jahr"></div>
    </div>
    <div id="inhalt"></div>
  </div>

  <div data-nav></div>
</div>

<script type="module">
/* N83 — Strom/PV je Objekt und Jahr. Strom ist zu vielschichtig für einen
   Betrag: drei Zählerstände ergeben zwei Verbrauchsgruppen (WG-Wohnungen und
   Büro/Studio = Rest), auf die die Quellen Netz/Solar/Akku verteilt werden;
   dazu die PV-Anlage mit Ertrag und Anschaffung, verteilt auf die Eigentümer
   (5/6 + 1/6). Gerechnet wird im Backend (app/strom.py); diese Seite pflegt die
   Eingaben und zeigt das Ergebnis live. Externe Stromlieferanten-Belege laufen
   weiter normal über die Belegeingabe — die sind hier nicht gemeint. */
import { api, eur, esc, melde, promille, installNav } from './assets/immo.js';
installNav();
import { auswahlfeld } from './assets/auswahl.js';

const sub = document.getElementById('sub');
const inhalt = document.getElementById('inhalt');
const kwh = n => (n ?? 0).toLocaleString('de-DE', { maximumFractionDigits: 0 }) + ' kWh';

/* Die Eingabefelder — dieselbe Liste, aus der die Maske gebaut und die Werte
   ausgelesen werden. Der dritte Eintrag ist die Einheit, der vierte der `step`.

   N139 trennt zwei Welten: STAMMDATEN gehören der Anlage (`data-stamm`,
   gespeichert unter /pv/stammdaten, jahresunabhängig), JAHRESWERTE gehören dem
   oben gewählten Jahr (`data-feld`, gespeichert unter /strom/{jahr}). Die
   Anlage wurde einmal gekauft, nicht jedes Jahr neu. */
const F_STAMM = [
  ['anschaffung_eur', 'Anschaffung (Investment)', '€', 1],
  ['vorlauf_ertrag_eur', 'Bereits abgetragen', '€', 1],
  ['kwp', 'Anlagenleistung', 'kWp', 0.01],
];
const F_JAHR = [
  ['pv_produktion_kwh', 'PV-Produktion', 'kWh', 1],
  ['einspeisung_kwh', 'Einspeisung', 'kWh', 1],
  ['verguetung_eur', 'Vergütung (0 = rechnen)', '€', 0.01],
];
// N87/N89 — die E-Tankstelle gehört zur PV-Anlage: der geladene Strom wird der
// ladenden Person berechnet und fließt der Anlage zu (Amortisation). Der Satz
// kann sich von Jahr zu Jahr ändern und hängt deshalb am Jahr.
const F_TANKEN = [
  ['tanken_preis', 'Preis je kWh (E-Auto)', '€', 0.01],
];

function feldHtml(name, label, einheit, step, art = 'feld') {
  return `<div class="field">
    <label for="f_${name}">${esc(label)} <span class="einheit">(${esc(einheit)})</span></label>
    <input class="inp" type="number" inputmode="decimal" step="${step}" min="0"
           id="f_${name}" data-${art}="${name}">
  </div>`;
}

/* Ein Datumsfeld — dasselbe Aussehen, nur ohne Einheit und ohne step. */
function datumHtml(name, label) {
  return `<div class="field">
    <label for="f_${name}">${esc(label)}</label>
    <input class="inp" type="date" id="f_${name}" data-stammdatum="${name}">
  </div>`;
}

/* Der Seitenaufbau (N139): erst der Verlauf — die eine Frage, um die es geht —,
   dann die Stammdaten der Anlage, danach das gewählte Jahr, die E-Tankstelle
   und zuletzt, wem die Anlage gehört.

   N121 — Zählerstände und die Aufteilung auf die Einheiten sind in den
   Nebenkostenbereich gezogen (Zeitraum → Zählerstände) und stehen deshalb
   nicht mehr hier. */
function skelett() {
  const jahr = jahrWahl.wert();
  return `
    <div class="karte" id="verlauf">
      <div class="hh"><h3>Verlauf</h3></div>
      <p class="hint">Die Anschaffung steht als negativer Betrag da und wird
        Jahr für Jahr aufgefressen: von der Direktnutzung (PV-Strom, den die
        Mieter bezahlt haben), der Einspeisevergütung und dem E-Tanken. Alle
        Werte kommen live aus den Nebenkostenjahren. Durchstößt der Balken die
        Nulllinie, ist die Anlage amortisiert.</p>
      <div class="kpi" id="vKpi"></div>
      <div id="vGrafik"></div>
      <div id="vTabelle"></div>
      <div class="eig" id="vEig"></div>
    </div>

    <!-- N139 — die Anlage wurde einmal gekauft, nicht jedes Jahr neu. Diese
         Angaben gelten für alle Jahre und ändern sich oben nicht mit. -->
    <div class="karte eng">
      <div class="hh"><h3>Stammdaten der Anlage</h3></div>
      <p class="hint">Gelten für alle Jahre — die Jahresauswahl oben ändert
        hier nichts. „Bereits abgetragen" ist, was die Anlage eingebracht hat,
        bevor der erste Abrechnungszeitraum begann: ein einmaliger Betrag, der
        im Verlauf auf die erste Zeile zählt und nicht in die Prognose eingeht.</p>
      <div class="raster">
        ${F_STAMM.map(f => feldHtml(...f, 'stamm')).join('')}
        ${datumHtml('inbetriebnahme', 'Inbetriebnahme')}
      </div>
    </div>

    <div class="karte">
      <div class="hh"><h3>PV im Jahr</h3><span class="jahrchip">${jahr}</span></div>
      <p class="hint">Diese Werte gehören zum oben gewählten Jahr ${jahr}.
        Eigenverbrauch = Produktion − Einspeisung. Ohne eigenen Betrag folgt die
        Vergütung den EEG-Stufen (0–10 kWp 8,2 ct, 10–40 kWp 7,1 ct) auf Basis
        der Anlagenleistung aus den Stammdaten.</p>
      <div class="raster">
        ${F_JAHR.map(f => feldHtml(...f)).join('')}
      </div>
      <div class="kpi" id="pv"></div>
    </div>

    <!-- N132/N139 — Nutzer und Abrechnungen der Tankstelle haben eine eigene
         Seite; hier steht nur, was zur Anlage gehört: der Satz und was zufließt. -->
    <div class="karte">
      <div class="hh"><h3>E-Tankstelle</h3><span class="jahrchip">${jahr}</span></div>
      <p class="hint">Der E-Auto-Strom gehört der PV-Anlage: er wird der
        ladenden Person berechnet und zahlt auf die Amortisation ein.</p>
      <div class="raster">
        ${F_TANKEN.map(f => feldHtml(...f)).join('')}
      </div>
      <div class="kpi" id="tank"></div>
      <a class="verweis" id="tankLink" href="tankstelle.html">
        Nutzer und Abrechnungen verwalten →</a>
    </div>

    <div class="karte">
      <div class="hh"><h3>PV-Eigentümer</h3></div>
      <p class="hint">Die PV-Anlage ist ein eigenes Investment: sie kann anderen
        gehören als das Haus. Zugeordnet wird aus den vorhandenen Eigentümern,
        die Anteile werden in Tausendsteln (‰) vergeben. Niemand angehakt =
        Vorgabe 5/6 + 1/6.</p>
      <!-- N112c/N139 — je Person eine Zeile; gespeichert wird in den
           Stammdaten der Anlage, nicht mehr am Jahr. -->
      <div id="pvAnteile"></div>
      <div class="eig" id="eig"></div>
    </div>

    <div id="warnungen"></div>`;
}

/* Werte der JAHRESfelder als Objekt (leeres Feld = 0). */
function werteAusForm() {
  const werte = {};
  inhalt.querySelectorAll('input[data-feld]').forEach(el => {
    const v = parseFloat(el.value);
    werte[el.dataset.feld] = Number.isFinite(v) ? v : 0;
  });
  return werte;
}

/* N139 — die STAMMDATEN der Anlage: Zahlen, Datum und die Eigentümer-Anteile.
   Ein leeres Datum wird nicht mitgeschickt (nicht mitgeschickt = unverändert),
   damit ein Tippfehler im Zahlenfeld nicht nebenbei das Datum löscht. */
function stammAusForm() {
  const werte = {};
  inhalt.querySelectorAll('input[data-stamm]').forEach(el => {
    const v = parseFloat(el.value);
    werte[el.dataset.stamm] = Number.isFinite(v) ? v : 0;
  });
  const d = inhalt.querySelector('[data-stammdatum]');
  if (d && d.value) werte.inbetriebnahme = d.value;
  werte.anteile = pvAnteileAusForm();
  return werte;
}

/* Eingaben in die Maske schreiben. 0 bleibt leer, damit die Maske nicht mit
   Nullen zugestellt ist und man gleich lostippen kann. */
function formFuellen(werte) {
  inhalt.querySelectorAll('input[data-feld]').forEach(el => {
    const v = werte[el.dataset.feld];
    el.value = (v == null || v === 0) ? '' : v;
  });
}

function stammFuellen(s) {
  inhalt.querySelectorAll('input[data-stamm]').forEach(el => {
    const v = s[el.dataset.stamm];
    el.value = (v == null || v === 0) ? '' : v;
  });
  const d = inhalt.querySelector('[data-stammdatum]');
  if (d) d.value = s.inbetriebnahme || '';
}


/* Das Engine-Ergebnis in die Karten schreiben (Inputs bleiben unberührt). */
function ergebnisZeigen(r) {
  const pv = r.pv;
  document.getElementById('pv').innerHTML = `
    <div class="k"><span class="kl">Eigenverbrauch</span><span class="kv">${kwh(pv.eigenverbrauch_kwh)}</span></div>
    <div class="k"><span class="kl">Satz</span><span class="kv">${(pv.satz_ct ?? 0).toLocaleString('de-DE', { maximumFractionDigits: 2 })} ct</span></div>
    <div class="k"><span class="kl">Einspeisevergütung</span><span class="kv">${eur(pv.einspeiseverguetung)}</span></div>
    <div class="k"><span class="kl">Ersparnis Zukauf <span class="kh">rechnerisch,
      kein Ertrag</span></span><span class="kv">${eur(pv.eigenverbrauch_ersparnis)}</span></div>`;

  tankZeigen((r.tankstelle || {}).preis || 0);

  document.getElementById('eig').innerHTML = r.eigentuemer.map(e => `
    <div class="ez">
      <span class="eanteil">${esc(e.anteil)}</span>
      <div class="ezeile"><span>Investitions-Ertrag</span><b>${eur(e.investitions_ertrag ?? 0)}</b></div>
      <div class="ezeile"><span>PV-Ertrag (kalkul.)</span><b>${eur(e.ertrag)}</b></div>
      <div class="ezeile"><span>Anschaffung</span><b>${eur(e.anschaffung)}</b></div>
    </div>`).join('');

  const w = document.getElementById('warnungen');
  w.innerHTML = (r.warnungen || []).map(t =>
    `<div class="warnung"><span class="wi" aria-hidden="true">⚠</span><span>${esc(t)}</span></div>`).join('');
}

/* ---------------------------------------------------------------------------
   N127 — der Amortisationsverlauf.

   Die Grafik zeigt nicht die Erträge nach oben, sondern die Anschaffung als
   negativen Betrag, der Jahr für Jahr aufgefressen wird. Je Jahr eine Säule:
   der noch offene Rest hängt in Rot unter der Nulllinie, und was ihn in diesem
   Jahr kleiner gemacht hat, sitzt als Ertragsblock darunter — Direktnutzung
   voll, Einspeisevergütung schraffiert (bleibt auch ohne Farbe lesbar),
   E-Tanken und der einmalige Vorlauf in eigenen Tönen. Durchstößt die Säule
   die Nulllinie, ist die Anlage amortisiert und der Überschuss steht in Grün
   darüber. Prognosejahre sind blass und gestrichelt umrandet, damit auf einen
   Blick klar ist, was gemessen und was gerechnet ist.

   Alles Inline-SVG von Hand — es gibt in diesem Projekt keine Chart-Bibliothek.
   --------------------------------------------------------------------------- */
const C_DIREKT = '#0F6E5C', C_EINSP = '#916212', C_TANK = '#7A9E94',
      C_VOR = '#5C6B70', C_OFFEN = '#B24229', C_PLUS = '#2E7D4F';

/* Die Ertragsanteile einer Säule, von unten nach oben gestapelt. */
const V_TEILE = [
  ['vorlauf', C_VOR],
  ['pv_strom', C_DIREKT],
  ['einspeisung', 'url(#pvSchraffur)'],
  ['tanken', C_TANK],
];

const eur0 = n => Math.round(n || 0).toLocaleString('de-DE') + ' €';
const negativ = t => t.replace('-', '−');

function verlaufGrafik(v) {
  const prog = (v.prognose && v.prognose.jahre) || [];
  const reihe = [
    ...v.jahre.map(z => ({ ...z, geschaetzt: false })),
    ...prog.map(z => ({ ...z, vorlauf: 0, pv_strom: 0, einspeisung: 0,
                        tanken: 0, geschaetzt: true })),
  ];
  const ansch = v.anschaffung;
  if (!reihe.length || !ansch) return '';

  const B = 380, H = 238;
  // Die Achsenspalte wächst mit der Beschriftung: „−36.000 €" braucht mehr
  // Platz als „−900 €" — sonst hängt die Zahl links aus der Zeichnung heraus.
  const bodenText = negativ(eur0(-ansch));
  const achse = Math.max(46, Math.round(12 + bodenText.length * 5.8));
  const xl = achse, xr = B - 6, yo = 16, yu = H - 44;
  // Der „Stand" ist kumulierter Ertrag minus Anschaffung: er startet bei
  // −Anschaffung und wandert nach oben durch die Null.
  const stand = z => (z.kumuliert || 0) - ansch;
  const maxPlus = Math.max(...reihe.map(stand), ansch * 0.09);
  const spanne = ansch + maxPlus;
  const y = w => yu - ((w + ansch) / spanne) * (yu - yo);
  const yNull = y(0);
  const slot = (xr - xl) / reihe.length;
  const bw = Math.max(3, Math.min(42, slot * 0.62));
  const rx = Math.min(4, bw / 3).toFixed(1);
  const jederNte = Math.ceil(reihe.length / 9);

  let clips = '', saeulen = '', jahrLabels = '', vorher = -ansch;
  let letztesLabel = -Infinity;
  reihe.forEach((z, i) => {
    const x = xl + slot * i + (slot - bw) / 2;
    const nachher = stand(z);
    const yV = y(vorher), yN = y(nachher);        // yV liegt tiefer als yN
    const oben = Math.min(yN, yNull), unten = Math.max(yV, yNull);
    const blass = z.geschaetzt ? ' opacity=".24"' : '';
    let inhalt = '';
    // Noch offener Rest — hängt unter der Nulllinie.
    if (nachher < 0 && yN - yNull > 0.3) {
      inhalt += `<rect x="${x}" y="${yNull.toFixed(1)}" width="${bw}"
        height="${(yN - yNull).toFixed(1)}" fill="${C_OFFEN}"${blass}/>`;
    }
    // Überschuss aus den Vorjahren — steht über der Nulllinie.
    if (vorher > 0 && yNull - yV > 0.3) {
      inhalt += `<rect x="${x}" y="${yV.toFixed(1)}" width="${bw}"
        height="${(yNull - yV).toFixed(1)}" fill="${C_PLUS}"${blass}/>`;
    }
    // Was dieses Jahr eingebracht hat — der Bissen aus dem Balken.
    const block = yV - yN;
    if (block > 0.3) {
      if (z.geschaetzt) {
        inhalt += `<rect x="${x + .75}" y="${(yN + .75).toFixed(1)}"
          width="${Math.max(1, bw - 1.5)}" height="${Math.max(1, block - 1.5).toFixed(1)}"
          fill="${C_PLUS}" fill-opacity=".16" stroke="${C_OFFEN}"
          stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="3 2.5"/>`;
      } else {
        let boden = yV;
        V_TEILE.forEach(([feld, fuellung]) => {
          const h = z.summe > 0 ? block * ((z[feld] || 0) / z.summe) : 0;
          if (h < 0.3) return;
          boden -= h;
          inhalt += `<rect x="${x}" y="${boden.toFixed(1)}" width="${bw}"
            height="${h.toFixed(1)}" fill="${fuellung}"/>`;
        });
      }
    }
    clips += `<clipPath id="pvc${i}"><rect x="${x}" y="${oben.toFixed(1)}"
      width="${bw}" height="${Math.max(.5, unten - oben).toFixed(1)}"
      rx="${rx}"/></clipPath>`;
    saeulen += `<g clip-path="url(#pvc${i})">${inhalt}</g>`;
    // Jede n-te Jahreszahl, dazu die letzte — aber nur, wenn sie der vorigen
    // nicht auf die Pelle rückt.
    const letzte = i === reihe.length - 1;
    if ((i % jederNte === 0 || letzte) && i - letztesLabel >= jederNte) {
      letztesLabel = i;
      jahrLabels += `<text x="${(x + bw / 2).toFixed(1)}" y="${yu + 17}"
        class="ax${z.geschaetzt ? ' blass' : ''}">${z.jahr}</text>`;
    }
    vorher = nachher;
  });

  // Trennstrich zwischen Erfasstem und Prognose.
  const grenze = prog.length ? `<line x1="${(xl + slot * v.jahre.length).toFixed(1)}"
    y1="${yo}" x2="${(xl + slot * v.jahre.length).toFixed(1)}" y2="${yu + 4}"
    stroke="#5C6B70" stroke-opacity=".35" stroke-width="1" stroke-dasharray="3 3"/>` : '';

  return `<svg viewBox="0 0 ${B} ${H}" class="chart" role="img"
      aria-label="Amortisationsverlauf der PV-Anlage">
    <defs>
      <pattern id="pvSchraffur" width="6" height="6" patternUnits="userSpaceOnUse"
               patternTransform="rotate(45)">
        <rect width="6" height="6" fill="${C_EINSP}"/>
        <line x1="0" y1="0" x2="0" y2="6" stroke="#FFF" stroke-width="2.4"
              stroke-opacity=".8"/>
      </pattern>
      ${clips}
    </defs>
    <style>
      .ax{font:500 10px var(--body);fill:var(--soft);text-anchor:middle}
      .ax.blass{fill-opacity:.6}
      .ay{font:500 9.5px var(--mono);fill:var(--soft);text-anchor:end}
    </style>
    <line x1="${xl}" y1="${yu}" x2="${xr}" y2="${yu}" stroke="${C_OFFEN}"
          stroke-opacity=".35" stroke-width="1" stroke-dasharray="4 3"/>
    ${grenze}
    ${saeulen}
    ${jahrLabels}
    <line x1="${achse - 4}" y1="${yNull.toFixed(1)}" x2="${xr}"
          y2="${yNull.toFixed(1)}" stroke="#16262C" stroke-width="1.2"/>
    <text x="${achse - 8}" y="${(yNull - 4).toFixed(1)}" class="ay">0 €</text>
    <text x="${achse - 8}" y="${yu + 4}" class="ay">${bodenText}</text>
  </svg>`;
}

/* Nur zeigen, was in der Zeichnung auch vorkommt — eine Legende mit Farben
   ohne Balken wäre eine Behauptung. */
function verlaufLegende(v) {
  const hat = feld => v.jahre.some(z => (z[feld] || 0) > 0);
  const eintraege = [
    [hat('pv_strom'), `style="background:${C_DIREKT}"`, 'Direktnutzung'],
    [hat('einspeisung'), 'class="schraffur"', 'Einspeisevergütung'],
    [hat('tanken'), `style="background:${C_TANK}"`, 'E-Tanken'],
    [hat('vorlauf'), `style="background:${C_VOR}"`, 'Vorlauf'],
    [hat('offen'), `style="background:${C_OFFEN}"`, 'noch offen'],
    [hat('ueberschuss'), `style="background:${C_PLUS}"`, 'amortisiert'],
    [!!v.prognose, 'class="prognose"', 'Prognose'],
  ].filter(([zeigen]) => zeigen);
  return `<div class="legende">${eintraege.map(([, attr, text]) =>
    `<span><i ${attr}></i>${text}</span>`).join('')}</div>`;
}

function verlaufTabelle(v) {
  const mitVorlauf = (v.vorlauf || 0) > 0;
  const kopf = ['Jahr', ...(mitVorlauf ? ['Vorlauf'] : []), 'PV-Strom',
                'Einspeisung', 'E-Tanken', 'Summe', 'kumuliert', 'noch offen'];
  const zeilen = v.jahre.map(z => `<tr>
      <td>${z.jahr}</td>
      ${mitVorlauf ? `<td class="leise">${z.vorlauf ? eur(z.vorlauf) : '—'}</td>` : ''}
      <td class="leise">${z.pv_strom ? eur(z.pv_strom) : '—'}</td>
      <td class="leise">${z.einspeisung ? eur(z.einspeisung) : '—'}</td>
      <td class="leise">${z.tanken ? eur(z.tanken) : '—'}</td>
      <td class="summe">${eur(z.summe)}</td>
      <td>${eur(z.kumuliert)}</td>
      <td>${z.offen ? eur(z.offen)
        : (z.ueberschuss ? `<span class="plus">+ ${eur(z.ueberschuss)}</span>`
          : eur(0))}</td>
    </tr>`).join('');
  return `<div class="tabrahmen"><table class="jt">
    <thead><tr>${kopf.map(t => `<th>${t}</th>`).join('')}</tr></thead>
    <tbody>${zeilen}</tbody>
    <tfoot><tr>
      <td>Σ</td>${mitVorlauf ? `<td>${eur(v.vorlauf)}</td>` : ''}
      <td>${eur(v.jahre.reduce((s, z) => s + z.pv_strom, 0))}</td>
      <td>${eur(v.jahre.reduce((s, z) => s + z.einspeisung, 0))}</td>
      <td>${eur(v.jahre.reduce((s, z) => s + z.tanken, 0))}</td>
      <td class="summe">${eur(v.kumuliert)}</td>
      <td>${eur(v.kumuliert)}</td>
      <td>${eur(v.rest)}</td>
    </tr></tfoot>
  </table></div>
  <p class="scrollhinweis">Seitlich wischen für alle Spalten.</p>`;
}

function verlaufKpi(v) {
  // Die Jahreszahl bleibt der große Wert; „geschätzt, noch 25 Jahre" steht als
  // eigene Zeile darunter — sonst sprengt der Zusatz die Kachel.
  const zusatz = v.break_even_geschaetzt
    ? `<span class="knote">geschätzt · noch ${v.break_even_in_jahren} Jahre</span>`
    : `<span class="knote">${v.break_even_jahr ? 'erreicht'
        : 'Prognose ab dem zweiten Ertragsjahr'}</span>`;
  return `
    <div class="k"><span class="kl">Anschaffung</span><span class="kv">${eur(v.anschaffung)}</span></div>
    <div class="k"><span class="kl">Bisher abgetragen</span><span class="kv pos">${eur(v.kumuliert)}</span></div>
    <div class="k"><span class="kl">Noch offen</span><span class="kv">${eur(v.rest)}</span></div>
    <div class="k"><span class="kl">Amortisiert</span><span class="kv">${
      v.amortisiert_prozent == null ? '—'
        : v.amortisiert_prozent.toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' %'}</span></div>
    <div class="k"><span class="kl">Break-even</span><span class="kv">${
      v.break_even_jahr || '—'}</span>${zusatz}</div>`;
}

async function verlaufZeigen() {
  const kpi = document.getElementById('vKpi');
  if (!kpi || !objektSlug) return;
  const grafik = document.getElementById('vGrafik');
  const tabelle = document.getElementById('vTabelle');
  const eig = document.getElementById('vEig');
  let v;
  try {
    v = await api(`/objekte/${encodeURIComponent(objektSlug)}/pv/verlauf`);
  } catch {
    kpi.innerHTML = '';
    grafik.innerHTML = '<div class="verlaufleer"><p>Der Verlauf ist nach dem '
      + 'nächsten Deploy verfügbar.</p></div>';
    tabelle.innerHTML = eig.innerHTML = '';
    return;
  }
  const hinweise = (v.warnungen || []).map(t => `<p>${esc(t)}</p>`).join('');
  kpi.innerHTML = v.anschaffung ? verlaufKpi(v) : '';
  if (!v.anschaffung || !v.kumuliert) {
    // Ruhige Aussage statt einer leeren Fläche.
    grafik.innerHTML = `<div class="verlaufleer">${hinweise
      || '<p>Für diese Anlage ist noch nichts zu zeigen.</p>'}</div>`;
    tabelle.innerHTML = eig.innerHTML = '';
    return;
  }
  grafik.innerHTML = verlaufGrafik(v) + verlaufLegende(v)
    + (hinweise ? `<div class="verlaufleer">${hinweise}</div>` : '');
  tabelle.innerHTML = verlaufTabelle(v);
  const rahmen = tabelle.querySelector('.tabrahmen');
  const hinweis = tabelle.querySelector('.scrollhinweis');
  if (rahmen && hinweis) {
    hinweis.classList.toggle('zeigen',
      rahmen.scrollWidth - rahmen.clientWidth > 2);
  }
  eig.innerHTML = (v.eigentuemer || []).map(e => `
    <div class="ez"><span class="eanteil">${esc(e.anteil)}</span>
      <div class="ezeile"><span>Bisher zugeflossen</span><b>${eur(e.betrag)}</b></div>
    </div>`).join('');
}

/* Was der Anlage aus der E-Tankstelle zufließt: die erfassten Ladungen des
   gewählten Jahres. Nutzer und Abrechnungen werden auf `tankstelle.html`
   verwaltet — hier steht nur die Summe (N132/N139). */
async function tankZeigen(satz) {
  const ziel = document.getElementById('tank');
  if (!ziel || !objektSlug) return;
  let d = {};
  try {
    d = await api(`/objekte/${encodeURIComponent(objektSlug)}/tankstelle/${jahrWahl.wert()}`);
  } catch {
    d = {};                       // keine Ladungen erfasst — dann eben Null
  }
  ziel.innerHTML = `
    <div class="k"><span class="kl">Satz</span><span class="kv">${eur(satz)}/kWh</span></div>
    <div class="k"><span class="kl">Geladen</span><span class="kv">${kwh(d.kwh_gesamt || 0)}</span></div>
    <div class="k"><span class="kl">Ladungen</span><span class="kv">${(d.ladungen || []).length}</span></div>
    <div class="k"><span class="kl">Zufluss</span><span class="kv pos">${eur(d.betrag_gesamt || 0)}</span></div>`;
}

/* N112c/N139 — die PV-Anteile je Person: zugeordnet wird aus derselben
   Eigentümer-Liste wie überall, die Tausendstel stehen daneben. Gespeichert
   wird in den Stammdaten der Anlage ({Name: ‰}), nicht mehr am Jahr — die
   Anlage kann anderen gehören als das Haus. */
async function pvAnteileZeigen() {
  const ziel = document.getElementById('pvAnteile');
  if (!ziel || !objektSlug) return;
  let d;
  try {
    d = await api(`/objekte/${encodeURIComponent(objektSlug)}/pv/eigentuemer`);
  } catch {
    ziel.innerHTML = '<p class="hint">Personen nicht ladbar.</p>';
    return;
  }
  const gesetzt = d.pv_anteile || {};
  const zeilen = (d.personen || []).map((p, i) => {
    const wert = gesetzt[p.name];
    return `<div class="pa-zeile">
      <input type="checkbox" id="pa${i}" data-pv-person="${esc(p.name)}"${
        wert ? ' checked' : ''}>
      <label class="pa-name" for="pa${i}">${esc(p.name)}${p.am_objekt != null
        ? `<span class="pa-obj">am Objekt ${promille(p.am_objekt)}</span>` : ''}</label>
      <input class="inp pa-wert" type="number" step="0.1" min="0" max="1000"
        data-pv-wert="${esc(p.name)}" value="${wert ?? ''}" placeholder="‰"
        data-vorschlag="${p.am_objekt ?? ''}"
        aria-label="Anteil ${esc(p.name)} in Tausendsteln">
    </div>`;
  }).join('');
  ziel.innerHTML = zeilen
    ? `${zeilen}<div class="pa-summe"><span>Vergeben</span>
        <b id="paSumme">${promille(d.anteile_summe || 0)}</b></div>
       <div id="paHinweis"></div>`
    : '<p class="hint">Noch keine Personen angelegt — lege sie unter '
      + 'Eigentümer an, dann lassen sie sich hier zuordnen.</p>';
  anteileSummeZeigen();
  // Beides: `change` fängt den Haken, `input` jede getippte Ziffer — sonst
  // ginge ein Wert verloren, wenn das Feld nie den Fokus verliert.
  ziel.querySelectorAll('[data-pv-person],[data-pv-wert]').forEach(el => {
    el.addEventListener('change', anteilGeaendert);
    el.addEventListener('input', anteilGeaendert);
  });
}

/* Haken gesetzt und noch kein Wert: den Objekt-Anteil als Vorschlag eintragen —
   meist stimmt er, und wenn nicht, ist er schnell überschrieben. */
function anteilGeaendert(e) {
  const cb = e.target.closest('[data-pv-person]');
  if (cb && cb.checked) {
    const feld = document.querySelector(
      `[data-pv-wert="${CSS.escape(cb.dataset.pvPerson)}"]`);
    if (feld && !feld.value && feld.dataset.vorschlag) {
      feld.value = feld.dataset.vorschlag;
    }
  }
  anteileSummeZeigen();
  stammAngestossen();
}

/* Die Summe der vergebenen Tausendstel — und ein ruhiger Hinweis, wenn sie
   nicht 1000 ‰ ergibt. Ein Hinweis, keine Sperre: gespeichert wird trotzdem. */
function anteileSummeZeigen() {
  const anzeige = document.getElementById('paSumme');
  if (!anzeige) return;
  const paare = pvAnteilePaare();
  const summe = Object.values(paare).reduce((s, v) => s + v, 0);
  anzeige.textContent = promille(summe);
  const hinweis = document.getElementById('paHinweis');
  if (!hinweis) return;
  const offen = Math.round((1000 - summe) * 10) / 10;
  hinweis.innerHTML = (!summe || Math.abs(offen) <= 0.5) ? '' :
    `<div class="pa-hinweis">Vergeben sind ${promille(summe)} statt 1000 ‰ —
      ${offen > 0 ? `${promille(offen)} fehlen noch`
        : `${promille(-offen)} zu viel`}.</div>`;
}

/* Die gesetzten Anteile aus der Auswahl einsammeln (nur angehakte mit Wert). */
function pvAnteilePaare() {
  const paare = {};
  document.querySelectorAll('[data-pv-person]').forEach(cb => {
    if (!cb.checked) return;
    const feld = document.querySelector(
      `[data-pv-wert="${CSS.escape(cb.dataset.pvPerson)}"]`);
    const v = parseFloat(String(feld?.value || '').replace(',', '.'));
    if (Number.isFinite(v) && v > 0) paare[cb.dataset.pvPerson] = v;
  });
  return paare;
}

function pvAnteileAusForm() {
  const paare = pvAnteilePaare();
  return Object.keys(paare).length ? JSON.stringify(paare) : '';
}

let objektSlug = '';
let speicherZeit = null;
let letzteWerte = '';
let stammZeit = null;
let letzteStamm = '';

async function rechnen() {
  if (!objektSlug) return;
  try {
    const r = await api(`/objekte/${encodeURIComponent(objektSlug)}/strom/${jahrWahl.wert()}/rechnung`);
    ergebnisZeigen(r);
    verlaufZeigen();           // N127 — läuft über alle Jahre, nebenher
  } catch (fehler) {
    melde(String(fehler.message || fehler), 'neg');
  }
}

/* Nach jeder Eingabe: kurz warten, dann speichern und neu rechnen. Das
   Sammeln vermeidet einen Schreibvorgang je Tastendruck.

   Objekt und Jahr werden zusammen mit den Werten eingefroren und NICHT erst
   beim Feuern gelesen: wer innerhalb der 550 ms das Objekt wechselt, hätte
   sonst die Zahlen der einen Anlage in den Datensatz der anderen geschrieben.
   Passt der eingefrorene Stand beim Feuern nicht mehr zur Auswahl, wird gar
   nicht geschrieben — `laden()` räumt den offenen Lauf ohnehin ab. */
function angestossen() {
  const werte = werteAusForm();
  const stempel = JSON.stringify(werte);
  if (stempel === letzteWerte) return;
  const slug = objektSlug;
  const jahr = jahrWahl.wert();
  clearTimeout(speicherZeit);
  speicherZeit = setTimeout(async () => {
    speicherZeit = null;
    if (slug !== objektSlug || jahr !== jahrWahl.wert()) return;
    letzteWerte = stempel;
    try {
      await api(`/objekte/${encodeURIComponent(slug)}/strom/${jahr}`,
                { method: 'PUT', body: werte });
      if (slug !== objektSlug || jahr !== jahrWahl.wert()) return;
      await rechnen();
    } catch (fehler) {
      melde(String(fehler.message || fehler), 'neg');
    }
  }, 550);
}

/* N139 — dasselbe für die STAMMDATEN, nur ohne Jahr: sie gehören der Anlage.
   Der Jahreswechsel oben rührt sie nicht an. */
function stammAngestossen() {
  const werte = stammAusForm();
  const stempel = JSON.stringify(werte);
  if (stempel === letzteStamm) return;
  const slug = objektSlug;
  clearTimeout(stammZeit);
  stammZeit = setTimeout(async () => {
    stammZeit = null;
    if (slug !== objektSlug) return;
    letzteStamm = stempel;
    try {
      await api(`/objekte/${encodeURIComponent(slug)}/pv/stammdaten`,
                { method: 'PUT', body: werte });
      if (slug !== objektSlug) return;
      await rechnen();            // Anschaffung und Anteile gehen mit ein
    } catch (fehler) {
      melde(String(fehler.message || fehler), 'neg');
    }
  }, 550);
}

async function laden() {
  // Ein noch offener Speicherlauf gehört zum alten Objekt/Jahr — abräumen,
  // bevor die Maske neu gefüllt wird. Sonst schriebe er die eben verlassenen
  // Werte in den gerade gewählten Datensatz.
  clearTimeout(speicherZeit);
  clearTimeout(stammZeit);
  speicherZeit = stammZeit = null;
  if (!objektSlug) {
    inhalt.innerHTML = `<div class="karte"><div class="chartleer">
      Kein Objekt vorhanden. Lege zuerst ein Objekt an.</div></div>`;
    sub.textContent = 'kein Objekt';
    return;
  }
  inhalt.innerHTML = skelett();
  inhalt.querySelectorAll('input[data-feld]').forEach(el =>
    el.addEventListener('input', angestossen));
  inhalt.querySelectorAll('input[data-stamm],input[data-stammdatum]').forEach(el =>
    el.addEventListener('input', stammAngestossen));
  const link = document.getElementById('tankLink');
  if (link) link.href = `tankstelle.html?objekt=${encodeURIComponent(objektSlug)}`;

  let werte, stamm;
  try {
    [werte, stamm] = await Promise.all([
      api(`/objekte/${encodeURIComponent(objektSlug)}/strom/${jahrWahl.wert()}`),
      api(`/objekte/${encodeURIComponent(objektSlug)}/pv/stammdaten`),
    ]);
  } catch (fehler) {
    inhalt.innerHTML = `<div class="empty"><div class="big">Keine Verbindung</div>
      <p>Die Stromdaten konnten nicht geladen werden.</p></div>`;
    return;
  }
  formFuellen(werte);
  stammFuellen(stamm);
  await pvAnteileZeigen();
  letzteWerte = JSON.stringify(werteAusForm());
  letzteStamm = JSON.stringify(stammAusForm());
  await rechnen();
}

/* ---- Kopf: Objekt- und Jahr-Auswahl ---- */
const jetzt = new Date().getFullYear();
const jahrWahl = auswahlfeld(document.getElementById('jahr'), {
  label: 'Jahr',
  optionen: Array.from({ length: 6 }, (_, i) => jetzt - i)
    .map(j => ({ wert: String(j), text: String(j) })),
  wert: String(jetzt),
  aenderung: () => laden(),
});

const objektWahl = auswahlfeld(document.getElementById('objekt'), {
  label: 'Objekt',
  optionen: [{ wert: '', text: '—' }],
  wert: '',
  aenderung: (wert) => { objektSlug = wert; laden(); },
});

let objekte = [];
try {
  objekte = await api('/objekte');
} catch {
  sub.textContent = 'API nicht erreichbar';
}

// N106 - PV ist ein Add-on einzelner Immobilien, keine Eigenschaft aller.
// Zur Wahl stehen deshalb nur Objekte MIT PV-Anlage (`hat_pv` aus dem
// Objekt-Endpunkt). Ist noch keines markiert, bleiben alle waehlbar - sonst
// koennte man die erste Anlage nirgends anlegen.
const mitPv = objekte.filter(o => o.hat_pv);
const wahl = mitPv.length ? mitPv : objekte;

if (wahl.length) {
  // N110 - von der Objektkachel aus (?objekt=slug) direkt bei der richtigen
  // Anlage landen, statt erst wieder waehlen zu muessen.
  const ausUrl = new URLSearchParams(location.search).get('objekt');
  objektSlug = (ausUrl && wahl.some(o => o.slug === ausUrl)) ? ausUrl : wahl[0].slug;
  objektWahl.fuelle(wahl.map(o => ({ wert: o.slug, text: o.titel || o.name })),
                    objektSlug);
  sub.textContent = mitPv.length
    ? `${mitPv.length} ${mitPv.length === 1 ? 'Anlage' : 'Anlagen'}`
    : 'Noch keine PV-Anlage erfasst';
  await laden();
} else {
  await laden();
}
</script>
