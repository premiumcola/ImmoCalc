<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PV Amortisation · ImmoCalc</title>
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F6E5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ImmoCalc">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/immo.css">
<style>
  /* ------------------------------------------------------------------
     Nur strom.html (N83). immo.css wird hier nicht angefasst; was sich
     spaeter als seitenuebergreifend erweist, wandert dann dorthin.
     ------------------------------------------------------------------ */
  .filter{display:flex;gap:8px;margin-bottom:14px}
  .filter > div{flex:1;min-width:0}

  .karte{background:var(--sheet);border-radius:16px;padding:16px 16px 6px;
         margin-bottom:14px;box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .karte.eng{padding-bottom:16px}
  .karte h3{font:600 13px var(--disp);letter-spacing:-.01em;margin:0 0 4px;
            color:var(--ink)}
  .karte .hh{display:flex;align-items:baseline;justify-content:space-between;
             gap:10px;flex-wrap:wrap;margin-bottom:14px}
  /* „＋" oben rechts (N204) — derselbe ruhige Teal-Chip wie in tankstelle.html,
     34 px sichtbar, 44 px tippbar (iOS) über ::after. Ausgegraut, sobald alle
     1000 ‰ vergeben sind. */
  .karte .hh .plus{flex:none;align-self:center;border:none;background:var(--teal-l);
    color:var(--teal-d);width:34px;height:34px;border-radius:11px;cursor:pointer;
    font:600 21px var(--body);line-height:1;display:inline-flex;
    align-items:center;justify-content:center;position:relative}
  .karte .hh .plus::after{content:"";position:absolute;inset:-5px}
  .karte .hh .plus:hover{background:var(--teal);color:#fff}
  .karte .hh .plus:disabled{background:var(--paper);color:var(--soft);
    cursor:not-allowed}
  .karte .hh .plus:disabled:hover{background:var(--paper);color:var(--soft)}
  .karte .hint b{font-weight:600;color:var(--ink)}
  .karte .hint{font:400 12px var(--body);color:var(--soft);line-height:1.5;
               margin:0 0 14px;max-width:600px}

  /* Eingabe-Raster: auf breiten Schirmen mehrspaltig, auf dem iPhone eine
     Spalte. minmax verhindert, dass ein langes Label die Spalte sprengt. */
  .raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
          gap:12px 14px}
  /* Bricht eine Beschriftung um, darf das Eingabefeld darunter nicht
     mitrutschen — sonst fluchten die Kanten einer Zeile nicht mehr. Das Label
     wächst, das Feld sitzt bündig am unteren Rand. */
  .raster .field{margin-bottom:2px;display:flex;flex-direction:column}
  .raster .field label{flex:1 0 auto}
  /* N112 - ein Feld ueber die volle Breite (Eigentuemer-Anteile). Ohne eigene
     Zeile schob es sich vorher ueber die Kacheln darunter. */
  .field.breit{display:block;width:100%;margin:0 0 16px}
  .field.breit input{width:100%;box-sizing:border-box}
  .field .einheit{font-weight:400;text-transform:none;letter-spacing:0;
                  color:var(--soft)}

  /* N153 — der Startbetrag der Amortisation: ein eigener ruhiger Block mit drei
     Beträgen nach denselben Quellen wie die Jahre danach und der geltenden
     Summe daneben. Die drei stehen auch auf 390 px nebeneinander — nebeneinander
     liest man sie als eine Aufteilung, untereinander als drei Angaben. */
  .vorlauf{background:var(--paper);border-radius:14px;padding:14px 15px;
           margin:2px 0 16px}
  .vorlauf .vk{display:flex;align-items:baseline;justify-content:space-between;
               gap:8px 12px;flex-wrap:wrap}
  .vorlauf .vt{font:600 13px var(--disp);letter-spacing:-.01em;color:var(--ink)}
  .vorlauf .vs{font:700 17px var(--disp);letter-spacing:-.02em;
               color:var(--teal-d);white-space:nowrap}
  .vorlauf .vz,.vorlauf .vf{font:400 11.5px var(--body);color:var(--soft);
                            line-height:1.55;max-width:600px}
  .vorlauf .vz{margin:7px 0 13px}
  .vorlauf .vf{margin:11px 0 0}
  .vraster{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .vraster .field{margin:0;display:flex;flex-direction:column}
  /* Bricht ein Label um, bleiben die Felder trotzdem auf einer Linie. */
  .vraster .field label{flex:1 0 auto;font-size:9.5px;letter-spacing:.04em;
                        margin-bottom:6px}
  .vraster .inp{padding-left:10px;padding-right:10px;background:var(--sheet)}

  /* Quellen-Zeile: Menge + Preis nebeneinander, Kosten als Chip rechts. */
  .quelle{display:grid;grid-template-columns:1fr 1fr auto;gap:12px 14px;
          align-items:end;padding:12px 0;border-top:1px solid var(--line)}
  .quelle:first-of-type{border-top:none}
  .quelle .qname{grid-column:1/-1;font:600 12.5px var(--disp);color:var(--ink);
                 display:flex;align-items:center;gap:8px}
  .quelle .qkosten{justify-self:end;align-self:end;text-align:right;min-width:92px}
  .quelle .qkosten .kl{display:block;font:600 9px var(--mono);letter-spacing:.07em;
                       text-transform:uppercase;color:var(--soft)}
  .quelle .qkosten .kv{display:block;font:700 15px var(--disp);
                       letter-spacing:-.02em;color:var(--ink);margin-top:3px}
  @media(max-width:439px){
    .quelle{grid-template-columns:1fr 1fr}
    .quelle .qkosten{grid-column:1/-1;justify-self:start;text-align:left;
                     display:flex;align-items:baseline;gap:8px}
    .quelle .qkosten .kv{margin-top:0}
  }

  /* Ergebnis: die beiden Verbrauchsgruppen nebeneinander. */
  .gruppen{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
           gap:12px}
  .gr{background:var(--paper);border-radius:14px;padding:14px}
  .gr .gt{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
          margin-bottom:10px}
  .gr .gn{font:600 13px var(--disp);letter-spacing:-.01em;color:var(--ink)}
  .gr .gs{font:700 18px var(--disp);letter-spacing:-.02em;color:var(--teal-d)}
  .gr .zeile{display:flex;align-items:baseline;justify-content:space-between;
             gap:10px;padding:6px 0;font:500 12.5px var(--body);color:var(--soft)}
  .gr .zeile b{font:600 12.5px var(--body);color:var(--ink)}
  .gr .zeile .kwhx{font:400 11px var(--mono);color:var(--soft)}

  /* Kennzahlen (PV-Ergebnis). */
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
       gap:10px;margin-top:4px}
  .kpi .k{background:var(--paper);border-radius:14px;padding:12px 13px}
  .kpi .kl{display:block;font:600 9px var(--mono);letter-spacing:.07em;
           text-transform:uppercase;color:var(--soft)}
  .kpi .kv{display:block;font:700 16px var(--disp);letter-spacing:-.02em;
           margin-top:6px;color:var(--ink)}
  .kpi .kv.pos{color:var(--pos)}
  .kpi .knote{display:block;font:400 10.5px var(--body);color:var(--soft);
              margin-top:4px;line-height:1.35}
  /* Zusatz in der Kachel-Beschriftung („rechnerisch, kein Ertrag"). Als
     inline-Element klebte er am Label und erbte dessen Versalien. */
  .kpi .kh{display:block;font:400 10px var(--body);text-transform:none;
           letter-spacing:0;color:var(--soft);margin-top:3px}

  /* Rest-Chip / abgeleitete Werte an einer Karte. */
  .abgeleitet{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
  .abgeleitet .chip{font:600 11px var(--mono)}

  .warnung{display:flex;gap:10px;align-items:flex-start;background:var(--amber-bg);
           color:var(--amber);border-radius:12px;padding:12px 14px;margin-bottom:14px;
           font:500 12.5px var(--body);line-height:1.5}
  .warnung .wi{font-size:15px;line-height:1.3;flex:none}

  .chartleer{font:400 13px var(--body);color:var(--soft);text-align:center;
             padding:22px 8px}

  /* N160 — Verbrauchsseite und Erzeugerseite als eigene Blöcke: getrennt
     beschriftet liest niemand mehr die eine Zahl als die andere. */
  .fgruppe{margin:0 0 18px}
  .fgruppe .fgt{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 9px;
                font:600 12.5px var(--disp);letter-spacing:-.01em;
                color:var(--ink)}
  .fgruppe .fgt em{font:500 9px var(--mono);letter-spacing:.07em;
                   font-style:normal;text-transform:uppercase;
                   color:var(--teal-d);background:var(--teal-l);
                   border-radius:999px;padding:4px 9px}

  /* N154 — die Hinweise aus den eigenen Zahlen. Ruhig, keine Signalfarbe: das
     ist kein Alarm, sondern ein Hebel. */
  .tipps{background:var(--paper);border-radius:14px;padding:15px;
         margin:14px 0 16px;max-width:640px}
  .tipps .tt{display:block;font:600 13px var(--disp);letter-spacing:-.01em;
             color:var(--ink);margin-bottom:11px}
  .tipps .tz{display:flex;gap:11px;align-items:flex-start;padding:11px 0;
             border-top:1px solid rgba(22,38,44,.08);
             font:400 12px var(--body);color:var(--soft);line-height:1.65}
  .tipps .tz:first-of-type{border-top:none;padding-top:0}
  .tipps .tz b{display:block;font:600 12.5px var(--disp);letter-spacing:-.01em;
               color:var(--ink);margin-bottom:2px}
  .tipps .ti{flex:none;margin-top:1px;color:var(--teal)}

  /* ---- N131 SolarEdge-Screenshot lesen ---------------------------------- */
  /* N153b — die Ablagefläche: der Screenshot lässt sich hineinziehen, der Knopf
     bleibt der Weg auf dem Handy. Knopf und Satz stehen in einem Flex-Fluss und
     können sich damit auf keiner Breite überlagern: der Knopf gibt nie nach
     (`flex:none`), der Satz bricht um und rutscht ab 500 px in eine eigene
     Zeile. Beide haben rundum Luft, nichts sitzt absolut. */
  .se{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;
      box-sizing:border-box;margin:0 0 16px;padding:14px 15px;
      border:1.5px dashed rgba(22,38,44,.16);border-radius:14px;
      background:var(--paper);transition:background .15s,border-color .15s}
  .se.dran{background:var(--teal-l);border-color:var(--teal);border-style:solid}
  .se .btn{flex:none;width:auto;min-height:44px;padding:11px 16px;font-size:13px;
           display:inline-flex;align-items:center;gap:9px;background:var(--sheet)}
  .se .btn svg{flex:none}
  .se .btn[disabled]{opacity:.55;cursor:default}
  .se-note{flex:1 1 260px;min-width:0;margin:0;font:400 11.5px var(--body);
           color:var(--soft);line-height:1.55}
  .se-note b{display:block;font:600 12.5px var(--disp);letter-spacing:-.01em;
             color:var(--ink);margin-bottom:3px}

  /* N155 — das gelesene Bild bleibt als Beleg stehen. */
  .sebild{display:flex;gap:13px;align-items:flex-start;background:var(--paper);
          border-radius:14px;padding:12px;margin:0 0 16px;max-width:620px}
  .sebild img{flex:none;width:86px;height:86px;object-fit:cover;
              border-radius:11px;background:var(--sheet)}
  .sebt{min-width:0;font:400 11.5px var(--body);color:var(--soft);
        line-height:1.55}
  .sebt b{display:block;font:600 12.5px var(--disp);letter-spacing:-.01em;
          color:var(--ink);margin-bottom:4px;overflow-wrap:anywhere}
  /* N161 — abgelegt-Zustand: ruhige grüne Bestätigung mit Haken. */
  .se-abgelegt{display:inline-flex;align-items:baseline;gap:6px;
               color:var(--teal-d);font-weight:600;overflow-wrap:anywhere}
  .se-abgelegt .hk{flex:none;font-size:12px}

  /* Die Prüfansicht — nichts wird übernommen, bevor sie bestätigt ist. */
  /* Auf breiten Schirmen bleibt die Gegenüberstellung ein Block, statt sich
     über die ganze Kartenbreite zu spannen — sonst steht der erkannte Wert
     einen halben Meter neben seiner Bezeichnung. */
  .se-pruef{background:var(--paper);border-radius:14px;padding:15px;margin:0 0 16px;
            max-width:620px}
  .se-pruef .set{display:block;font:600 13px var(--disp);letter-spacing:-.01em;
                 color:var(--ink);margin:0 0 7px}
  .se-pruef .seh{font:400 12px var(--body);color:var(--soft);line-height:1.6;
                 margin:0 0 14px}
  .se-pruef .warnung{margin:0 0 10px}
  /* Zwei Spalten: links die Bezeichnung (darf umbrechen), rechts alt → neu
     (bricht nie). So bleibt die Gegenüberstellung auch auf 390 px lesbar. */
  .se-zeile{display:grid;grid-template-columns:1fr auto;gap:3px 12px;
            align-items:baseline;padding:10px 0;
            border-top:1px solid rgba(22,38,44,.08)}
  .se-zeile:first-of-type{border-top:none;padding-top:0}
  .se-n{font:600 12.5px var(--disp);letter-spacing:-.01em;color:var(--ink);
        min-width:0;overflow-wrap:anywhere}
  .se-w{justify-self:end;text-align:right;white-space:nowrap;
        font:500 12.5px var(--mono)}
  .se-w .alt{color:var(--soft)}
  .se-w .pf{color:var(--soft);margin:0 6px}
  .se-w .neu{font-weight:600;color:var(--teal-d)}
  .se-w .neu.leer{font-weight:500;color:var(--soft)}
  .se-sub{grid-column:1/-1;font:400 10.5px var(--mono);color:var(--soft)}
  .se-fuss{margin:12px 0 0;font:400 11.5px var(--body);color:var(--soft);
           line-height:1.55}
  .se-knoepfe{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .se-knoepfe .btn{flex:1 1 150px;width:auto;min-height:44px}

  /* N139 — die Karte, die sich auf das oben gewählte Jahr bezieht, sagt das
     auch: ein ruhiger Chip neben der Überschrift statt eines Satzes. */
  .jahrchip{font:600 10px var(--mono);letter-spacing:.07em;text-transform:uppercase;
            color:var(--teal-d);background:var(--teal-l);border-radius:999px;
            padding:4px 10px;white-space:nowrap}

  /* Verweis auf eine andere Seite (E-Tankstelle verwalten). */
  .verweis{display:inline-flex;align-items:center;gap:8px;box-sizing:border-box;
           min-height:44px;padding:11px 14px;margin:2px 0 14px;
           background:var(--paper);border-radius:12px;text-decoration:none;
           font:600 12.5px var(--body);color:var(--teal-d)}
  .verweis:hover{background:var(--teal-l)}

  /* N149 — PV-Eigentümer: in der Liste steht nur, wer wirklich zugeordnet ist.
     Wer nichts hält, steht in der Auswahl darunter — dieselbe Sprache wie
     „Anteil zuweisen" auf der Eigentümer-Seite: Zeile mit ‰ und ×, darunter
     ein Weg zum Hinzufügen. */
  .pa-zeile{display:flex;align-items:center;gap:10px;min-height:52px;
            padding:8px 8px 8px 14px;margin-bottom:8px;background:var(--paper);
            border-radius:12px}
  .pa-name{flex:1;min-width:0;font:600 13px var(--disp);letter-spacing:-.01em;
           color:var(--ink);overflow-wrap:anywhere}
  .pa-obj{display:block;font:400 11px var(--body);color:var(--soft);
          letter-spacing:0;margin-top:3px}
  /* Der investierte Betrag dieses Anteils (N204): ‰ × Gesamt-Anschaffung.
     Ruhige Zahl vor dem ‰-Chip, rechtsbündig, damit die Beträge fluchten. */
  .pa-invest{flex:none;font:700 13px var(--disp);color:var(--ink);
             letter-spacing:-.01em;white-space:nowrap;text-align:right}
  /* Der Anteil als Chip — dieselbe Auszeichnung wie in der Verteilung darunter. */
  .pa-wert{flex:none;font:600 11px var(--mono);color:var(--teal-d);
           background:var(--teal-l);border-radius:999px;padding:5px 11px;
           white-space:nowrap}
  .pa-weg{flex:none;width:44px;height:44px;padding:0;border:none;background:none;
          border-radius:12px;color:var(--soft);font:400 20px var(--body);
          line-height:1;cursor:pointer}
  .pa-weg:hover{background:var(--neg-bg);color:var(--neg)}
  .pa-summe{display:flex;align-items:baseline;justify-content:space-between;
            gap:12px;padding:6px 12px 0;margin-bottom:14px;
            font:500 12.5px var(--body);color:var(--soft)}
  .pa-summe b{font:700 15px var(--disp);letter-spacing:-.02em;color:var(--ink)}
  /* Leerzustand: eine ruhige Fläche mit Erklärung statt eines leeren Lochs. */
  .pa-leer{background:var(--paper);border-radius:12px;padding:14px 15px;
           font:400 12.5px var(--body);color:var(--soft);line-height:1.55}
  /* Hinzufügen: Person, ‰, Knopf. Auf dem iPhone steht die Auswahl in einer
     eigenen Zeile, darunter teilen sich Feld und Knopf die Breite; ab
     Tablet-Breite passt alles nebeneinander. */
  .pa-neu{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
          margin:16px 0 14px}
  .pa-neu .pa-person{flex:1 1 100%;min-width:0}
  /* Breit genug für „166,667" — auf Touch-Geräten rechnet die App mit 16 px. */
  .pa-neu .pa-neuwert{flex:0 0 100px;width:100px;padding-left:10px;
                      padding-right:10px;text-align:right}
  /* Die Einheit steht neben dem Feld, nicht darin: getippt wird nur die Zahl. */
  .pa-neu .pa-einheit{flex:none;margin:0 2px 0 -3px;
                      font:600 13px var(--mono);color:var(--soft)}
  .pa-neu .pa-add{flex:1 1 auto;width:auto;padding:12px 20px;font-size:14px}
  @media(min-width:680px){
    .pa-neu .pa-person{flex:1 1 200px}
    .pa-neu .pa-add{flex:0 0 auto}
  }
  /* Ein Hinweis, keine Sperre: gespeichert wird trotzdem. */
  .pa-hinweis{background:var(--amber-bg);color:var(--amber);border-radius:12px;
              padding:10px 13px;margin:10px 0 2px;line-height:1.5;
              font:500 12.5px var(--body)}

  /* ---- N127 Verlauf: Grafik, Legende, Jahrestabelle ---------------------- */
  .chart{width:100%;max-width:560px;height:auto;display:block;overflow:visible;
         margin:2px auto 10px}

  .legende{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 16px;
           font:500 11.5px var(--body);color:var(--soft)}
  .legende span{display:inline-flex;align-items:center;gap:7px}
  .legende i{width:11px;height:11px;border-radius:4px;flex:none}
  .legende i.schraffur{background:repeating-linear-gradient(45deg,
    #916212 0 2px, #FFF 2px 4px)}
  .legende i.prognose{background:rgba(178,66,41,.22);
                      box-shadow:inset 0 0 0 1.5px rgba(178,66,41,.55)}
  /* N153 — der Satz zum aufgeteilten Vorlauf, direkt unter der Legende. */
  .legendennote{margin:-6px 0 16px;font:400 11.5px var(--body);
                color:var(--soft);line-height:1.55;max-width:600px}

  /* ---- N200 Kategorien: Ringdiagramm neben der Kurve + Prozent-Aufteilung --
     Kurve und Ring stehen auf breiten Schirmen nebeneinander, auf dem iPhone
     untereinander. Der Ring zeigt die kWh je Kategorie (die Fläche), seine
     Legende das € daneben — so wird sichtbar, dass die Einspeisung viele kWh zu
     wenig € bringt, E-Tanken und Direktnutzung weniger kWh zu mehr € je kWh. */
  .verlaufkopf{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;
               margin:0 0 8px}
  .vk-kurve{flex:1 1 320px;min-width:0}
  .vk-ring{flex:0 1 236px;min-width:198px;margin:0 auto}
  @media(max-width:520px){.vk-ring{flex:1 1 100%}}
  .vk-ring .rt{display:block;font:600 12.5px var(--disp);letter-spacing:-.01em;
               color:var(--ink);margin:0 0 8px;text-align:center}

  .kringel{width:100%;max-width:210px;height:auto;display:block;margin:0 auto 12px}
  .kringel .km-z{font:700 16px var(--disp);fill:var(--ink);text-anchor:middle;
                 letter-spacing:-.02em}
  .kringel .km-l{font:600 7.5px var(--mono);fill:var(--soft);text-anchor:middle;
                 letter-spacing:.06em}

  /* Die Ring-Legende: je Kategorie oben Chip · Name · € (eine Zeile), darunter
     kWh · €/kWh. So bleibt auch in der schmalen Spalte alles überlappungsfrei —
     ein Name, der umbricht, schiebt das € nicht in die kWh-Zeile. */
  .kleg{display:flex;flex-direction:column;gap:12px;margin:0}
  .kleg .kz{display:flex;flex-direction:column;gap:3px;min-width:0}
  .kleg .kzt{display:flex;align-items:baseline;gap:8px;min-width:0}
  .kleg .ki{width:11px;height:11px;border-radius:4px;flex:none;
            position:relative;top:2px}
  .kleg .ki.schraffur{background:repeating-linear-gradient(45deg,
    #916212 0 2px, #FFF 2px 4px)}
  /* Am Bindestrich umbrechen („PV-Eigenverbrauch"), nicht mitten im Wort. */
  .kleg .kn{flex:1;min-width:0;font:600 12px var(--disp);letter-spacing:-.01em;
            color:var(--ink)}
  .kleg .kv{flex:none;font:700 13px var(--disp);color:var(--ink);
            letter-spacing:-.02em;white-space:nowrap}
  .kleg .ksub{padding-left:19px;font:400 10.5px var(--mono);color:var(--soft)}

  /* Point 2 — woraus sich die Amortisation zusammensetzt: % je Kategorie,
     darunter kWh und €. Ein ruhiger Balken, dieselben Farben wie Kurve und
     Ring. */
  .katanteil{background:var(--paper);border-radius:14px;padding:15px;
             margin:2px 0 16px;max-width:640px}
  .katanteil .kt{display:block;font:600 13px var(--disp);letter-spacing:-.01em;
                 color:var(--ink);margin-bottom:13px}
  .katzeile{margin:13px 0 0}
  .katzeile:first-of-type{margin-top:0}
  .katzeile .kk{display:flex;align-items:baseline;justify-content:space-between;
                gap:10px;margin-bottom:6px}
  .katzeile .kl{display:inline-flex;align-items:center;gap:8px;min-width:0;
                font:600 12.5px var(--disp);letter-spacing:-.01em;color:var(--ink)}
  .katzeile .kl i{width:10px;height:10px;border-radius:3px;flex:none}
  .katzeile .kl i.schraffur{background:repeating-linear-gradient(45deg,
    #916212 0 2px, #FFF 2px 4px)}
  .katzeile .kp{flex:none;font:700 14px var(--disp);letter-spacing:-.02em;
                color:var(--teal-d)}
  .katzeile .kp.leer{color:var(--soft);font-weight:600;font-size:12.5px}
  .katzeile .kbar{height:8px;border-radius:999px;background:rgba(22,38,44,.09)}
  .katzeile .kbar > i{display:block;height:100%;border-radius:999px;min-width:3px}
  .katzeile .kmeta{display:flex;gap:4px 14px;flex-wrap:wrap;margin-top:6px;
                   font:400 11px var(--body);color:var(--soft)}
  .katzeile .kmeta b{font-weight:600;color:var(--ink)}
  .katnote{margin:13px 0 0;font:400 11.5px var(--body);color:var(--soft);
           line-height:1.55}

  /* Sieben Geldspalten passen auf dem iPhone nicht nebeneinander — die Tabelle
     scrollt in ihrem eigenen Rahmen, die Seite selbst nie. */
  .tabrahmen{overflow-x:auto;-webkit-overflow-scrolling:touch;
             border-radius:12px;background:var(--paper);margin:0 0 14px}
  .jt{border-collapse:collapse;width:100%;min-width:460px}
  .jt th{font:600 9px var(--mono);letter-spacing:.07em;text-transform:uppercase;
         color:var(--soft);text-align:right;padding:11px 12px 9px;
         white-space:nowrap}
  .jt th:first-child{text-align:left}
  .jt td{font:500 12.5px var(--mono);color:var(--ink);text-align:right;
         padding:10px 12px;white-space:nowrap;
         border-top:1px solid rgba(22,38,44,.07)}
  .jt td:first-child{text-align:left;font:600 13px var(--disp);
                     letter-spacing:-.01em}
  .jt td.leise{color:var(--soft)}
  /* N153b — die Zeile vor der ersten Abrechnung: das Jahr allein sagt nicht,
     warum dort ein Betrag steht, für den es keine Abrechnung gibt. */
  .jt .vorab{display:block;font:500 9px var(--mono);letter-spacing:.05em;
             text-transform:uppercase;color:var(--soft);margin-top:3px}
  /* N174 — der Vorlauf ohne Aufschlüsselung steht in der PV-Strom-Spalte; der
     Hinweis sagt leise, dass die Herkunft dort nicht getrennt ist. */
  .jt .unauf{display:block;font:500 8.5px var(--mono);letter-spacing:.04em;
             text-transform:uppercase;color:var(--soft);margin-top:2px}
  .jt td.summe{font-weight:700;color:var(--teal-d)}
  .jt .plus{color:var(--pos);font-weight:600}
  /* Der Hinweis erscheint nur, wenn die Tabelle wirklich nicht ganz passt —
     gemessen, nicht geraten (siehe `verlaufZeigen`). */
  .scrollhinweis{display:none;font:400 11.5px var(--body);color:var(--soft);
                 margin:-8px 0 14px}
  .scrollhinweis.zeigen{display:block}
  .jt tfoot td{font-weight:700;color:var(--ink);
               border-top:1.5px solid var(--line)}

  .verlaufleer{background:var(--paper);border-radius:14px;padding:18px 16px;
               margin-bottom:14px;font:400 13px var(--body);color:var(--soft);
               line-height:1.6}
  .verlaufleer p{margin:0 0 8px}
  .verlaufleer p:last-child{margin:0}

  /* ---- N183: Erklärtexte in Info-Popups -------------------------------
     Dieselbe Mechanik und Optik wie auf der E-Tankstelle (tankstelle.html,
     N181): statt einer Textwand am Kartenanfang steht ein kleines i hinter dem
     Titel. Eine Karte unter dem Icon auf dem Desktop, ein Blatt von unten auf
     dem iPhone, Escape/Klick daneben/„Verstanden" schließt. Kein neuer Text —
     nur ein anderer Ort. */
  .titelinfo{display:flex;align-items:center;gap:1px;min-width:0}
  .tinfo{display:inline-flex;align-items:center;justify-content:center;
         width:44px;height:44px;margin:-13px -10px -13px -4px;padding:0;border:none;
         background:none;color:var(--soft);cursor:pointer;border-radius:50%;
         flex:none;-webkit-tap-highlight-color:transparent}
  .tinfo svg{width:17px;height:17px;display:block}
  .tinfo:hover{color:var(--teal-d)}
  .tinfo:focus-visible{outline:2px solid var(--teal-d);outline-offset:2px}
  /* Die zwei Blöcke „Verbrauchsseite" / „Erzeugerseite" tragen ihr i in der
     Untertitel-Zeile (.fgt, auf der Grundlinie ausgerichtet) — dort sitzt das
     Icon mittig zur Textzeile statt auf der Grundlinie. */
  .fgt .tinfo{margin:-13px -8px -13px 1px;align-self:center}
  .tinfo-overlay{position:fixed;inset:0;z-index:1200;background:transparent}
  .tinfo-card{position:fixed;z-index:1201;background:var(--sheet);
              border-radius:14px;box-shadow:0 22px 55px -14px rgba(22,38,44,.45);
              padding:16px 18px;width:320px;max-width:calc(100vw - 24px);
              color:var(--ink)}
  .tinfo-titel{font:700 15px var(--disp);letter-spacing:-.01em;margin-bottom:7px}
  .tinfo-text{font:400 13px/1.6 var(--body);color:var(--ink);margin:0 0 13px}
  .tinfo-ok{min-height:40px;padding:0 16px;border:none;border-radius:10px;
            background:var(--teal-l);color:var(--teal-d);cursor:pointer;
            font:600 12.5px var(--disp)}
  .tinfo-ok:hover{background:var(--teal);color:#fff}
  @media(max-width:700px){
    .tinfo-overlay.sheet{background:rgba(22,38,44,.35)}
    .tinfo-card.sheet{left:0;right:0;bottom:0;top:auto;width:auto;max-width:none;
      border-radius:18px 18px 0 0;
      padding:20px 20px calc(20px + env(safe-area-inset-bottom));
      animation:tinfo-auf .18s ease-out}
    .tinfo-ok{min-height:44px;width:100%}
  }
  @keyframes tinfo-auf{from{transform:translateY(100%)}to{transform:translateY(0)}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <a href="index.html" aria-label="Zur Übersicht" class="applogo-link"><img src="icons/icon.svg" alt="" class="applogo"></a>
    <div class="barwrap">
      <h1>PV Amortisation</h1>
      <div class="sub" id="sub">wird geladen …</div>
    </div>
  </div>

  <div class="scroll">
    <div class="filter">
      <div id="objekt"></div>
      <div id="jahr"></div>
    </div>
    <div id="inhalt"></div>
  </div>

  <div data-nav></div>
</div>

<script type="module">
/* N83 — Strom/PV je Objekt und Jahr. Strom ist zu vielschichtig für einen
   Betrag: drei Zählerstände ergeben zwei Verbrauchsgruppen (WG-Wohnungen und
   Büro/Studio = Rest), auf die die Quellen Netz/Solar/Akku verteilt werden;
   dazu die PV-Anlage mit Ertrag und Anschaffung, verteilt auf die Eigentümer
   (5/6 + 1/6). Gerechnet wird im Backend (app/strom.py); diese Seite pflegt die
   Eingaben und zeigt das Ergebnis live. Externe Stromlieferanten-Belege laufen
   weiter normal über die Belegeingabe — die sind hier nicht gemeint. */
import { api, eur, esc, frage, melde, promille, installNav } from './assets/immo.js';
installNav();
import { auswahlfeld } from './assets/auswahl.js';

const sub = document.getElementById('sub');
const inhalt = document.getElementById('inhalt');
const kwh = n => (n ?? 0).toLocaleString('de-DE', { maximumFractionDigits: 0 }) + ' kWh';

/* =======================================================================
   N183 — Erklärtexte in Info-Popups. Die längeren Fließtexte am Anfang der
   Karten wandern hinter ein kleines i am jeweiligen Titel; ein Tap zeigt den
   Text als Popover. Dieselbe Mechanik und Optik wie auf der E-Tankstelle
   (tankstelle.html, N181): Karte unter dem Icon auf dem Desktop, Blatt von
   unten auf dem iPhone, Escape/Klick daneben schließt. Die Texte sind
   unverändert — nur ihr Ort ändert sich; die Ansicht bleibt ruhig ohne die
   Wand. Kurze Feld-Hinweise und dynamische Status-Texte bleiben, wo sie sind.
   ======================================================================= */
const INFO_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true"><circle cx="12" cy="12" r="10"/>
    <line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;

const INFOS = {
  verlauf: { titel: 'Verlauf', text:
    'Die Anschaffung steht als negativer Betrag da und wird Jahr für Jahr '
    + 'aufgefressen: von der Direktnutzung (PV-Strom, den die Mieter bezahlt '
    + 'haben), der Einspeisevergütung und dem E-Tanken. Diese Werte kommen live '
    + 'aus den Nebenkostenjahren; der Balken davor ist der Vorlauf aus den '
    + 'Stammdaten — die Zeit vor der ersten Abrechnung. Durchstößt der Balken '
    + 'die Nulllinie, ist die Anlage amortisiert.' },
  verbrauchsseite: { titel: 'Verbrauchsseite', text:
    'Woher der im Haus verbrauchte Strom kam. Aus diesen drei Mengen zieht die '
    + 'Stromkette im Nebenkostenzeitraum ihre Anteile, und aus ihnen kommt die '
    + 'Autarkiequote.' },
  erzeugerseite: { titel: 'Erzeugerseite', text:
    'Was die Anlage produziert hat und wie viel davon wirklich ins Netz ging — '
    + 'dafür zahlt der Netzbetreiber. In Verbrauch und Autarkie geht diese Seite '
    + 'nicht ein. Ohne eigenen Betrag folgt die Vergütung den EEG-Stufen '
    + '(0–10 kWp 8,2 ct, 10–40 kWp 7,1 ct) auf Basis der Anlagenleistung aus '
    + 'den Stammdaten.' },
  tankstelle: { titel: 'E-Tankstelle', text:
    'Der E-Auto-Strom gehört der PV-Anlage: er wird der ladenden Person '
    + 'berechnet und zahlt auf die Amortisation ein. Der Satz je kWh wird aus '
    + 'den Stromkosten des Abrechnungszeitraums abgeleitet — Netzstrom zum '
    + 'Durchschnittspreis des Netzbezugs, eigener Strom 10 % darunter. Er steht '
    + 'bei der E-Tankstelle.' },
  eigentuemer: { titel: 'PV-Eigentümer', text:
    'Die PV-Anlage ist ein eigenes Investment: sie kann anderen gehören als das '
    + 'Haus. Zugeordnet wird aus den vorhandenen Eigentümern, die Anteile werden '
    + 'in Tausendsteln (‰) vergeben. Ohne Zuordnung gilt die Vorgabe 5/6 + 1/6.' },
};

/* Das i-Icon als String — ein echter <button> mit aria-label, 44 px Touch-Ziel,
   per Tastatur bedienbar. */
function infoKnopf(key) {
  const i = INFOS[key];
  if (!i) return '';
  return `<button type="button" class="tinfo" data-info="${key}"
    aria-label="${esc(i.titel)}: Erklärung anzeigen"
    title="Erklärung anzeigen">${INFO_ICON}</button>`;
}

let infoOffen = null;
function infoEsc(e) {
  if (e.key !== 'Escape' || !infoOffen) return;
  e.preventDefault();
  e.stopPropagation();
  infoSchliessen();
}
function infoSchliessen() {
  if (!infoOffen) return;
  document.removeEventListener('keydown', infoEsc, true);
  infoOffen.remove();
  infoOffen = null;
}
function infoOeffnen(anker, key) {
  const eintrag = INFOS[key];
  if (!eintrag) return;
  infoSchliessen();
  const sheet = window.matchMedia('(max-width:700px)').matches;
  const overlay = document.createElement('div');
  overlay.className = 'tinfo-overlay' + (sheet ? ' sheet' : '');
  const card = document.createElement('div');
  card.className = 'tinfo-card' + (sheet ? ' sheet' : '');
  card.setAttribute('role', 'dialog');
  card.setAttribute('aria-label', eintrag.titel);
  card.innerHTML = `<div class="tinfo-titel">${esc(eintrag.titel)}</div>
    <p class="tinfo-text">${esc(eintrag.text)}</p>
    <button type="button" class="tinfo-ok" data-info-zu>Verstanden</button>`;
  overlay.appendChild(card);
  document.body.appendChild(overlay);
  // Auf dem Desktop dockt die Karte unter dem Icon an — und klappt darüber, wenn
  // unten kein Platz ist; am Rand wird sie ins Fenster gezogen (wie tankstelle).
  if (!sheet) {
    const r = anker.getBoundingClientRect();
    const cw = card.offsetWidth, ch = card.offsetHeight;
    const left = Math.max(12, Math.min(r.left, window.innerWidth - cw - 12));
    let top = r.bottom + 8;
    if (top + ch > window.innerHeight - 12) top = Math.max(12, r.top - ch - 8);
    card.style.left = `${left}px`;
    card.style.top = `${top}px`;
  }
  overlay.addEventListener('click', e => { if (e.target === overlay) infoSchliessen(); });
  document.addEventListener('keydown', infoEsc, true);
  infoOffen = overlay;
  card.querySelector('.tinfo-ok').focus();
}

/* Ein Fänger am Dokument — das i sitzt in den Titeln, die bei jedem Neuzeichnen
   ersetzt werden; ein Lauscher je Knopf ginge dabei verloren. */
document.addEventListener('click', e => {
  const inf = e.target.closest('[data-info]');
  if (inf) { e.preventDefault(); e.stopPropagation(); return infoOeffnen(inf, inf.dataset.info); }
  const infZu = e.target.closest('[data-info-zu]');
  if (infZu) return infoSchliessen();
});

/* Die Eingabefelder — dieselbe Liste, aus der die Maske gebaut und die Werte
   ausgelesen werden. Der dritte Eintrag ist die Einheit, der vierte der `step`.

   N139 trennt zwei Welten: STAMMDATEN gehören der Anlage (`data-stamm`,
   gespeichert unter /pv/stammdaten, jahresunabhängig), JAHRESWERTE gehören dem
   oben gewählten Jahr (`data-feld`, gespeichert unter /strom/{jahr}). Die
   Anlage wurde einmal gekauft, nicht jedes Jahr neu. */
const F_STAMM = [
  ['anschaffung_eur', 'Anschaffung', '€', 1],
  ['kwp', 'Anlagenleistung', 'kWp', 0.01],
];
/* N153 — „bereits abgetragen" war ein einziges Feld. Der Startbetrag wird jetzt
   nach denselben Quellen eingetragen wie die Jahre danach; damit hat der
   Verlauf auch am Anfang eine Herkunft. Reihenfolge und Bezeichnungen wie in
   der Grafik und der Jahrestabelle. */
const F_VORLAUF = [
  // Ohne Einheit am Label: die drei stehen nebeneinander, die Währung sagt die
  // Summe daneben einmal — dreimal „(€)" wäre dieselbe Information dreifach.
  ['vorlauf_pv_strom_eur', 'PV-Strom', '', 1],
  ['vorlauf_einspeisung_eur', 'Einspeisung', '', 1],
  ['vorlauf_tanken_eur', 'E-Tanken', '', 1],
];
/* N131/N160 — zwei Seiten, zwei Aufgaben, deshalb zwei Blöcke statt eines
   Rasters: die VERBRAUCHSSEITE ist maßgeblich (Verteilung, Kosten, Autarkie),
   die ERZEUGERSEITE trägt allein die Einspeisevergütung. Beides in einem Raster
   war genau der Grund, warum die Erzeugerzahl für die Verbrauchszahl gehalten
   wurde. */
const F_JAHR_VERBRAUCH = [
  ['netz_kwh', 'Verbrauch Netz', 'kWh', 1],
  ['solar_kwh', 'Verbrauch PV', 'kWh', 1],
  ['akku_kwh', 'Verbrauch Akku', 'kWh', 1],
];
const F_JAHR_ERZEUGUNG = [
  ['pv_produktion_kwh', 'PV-Produktion', 'kWh', 1],
  ['einspeisung_kwh', 'Einspeisung', 'kWh', 1],
  ['verguetung_eur', 'Vergütung', '€', 0.01],
];
function feldHtml(name, label, einheit, step, art = 'feld') {
  const zusatz = einheit
    ? ` <span class="einheit">(${esc(einheit)})</span>` : '';
  return `<div class="field">
    <label for="f_${name}">${esc(label)}${zusatz}</label>
    <input class="inp" type="number" inputmode="decimal" step="${step}" min="0"
           id="f_${name}" data-${art}="${name}">
  </div>`;
}

/* Ein Datumsfeld — dasselbe Aussehen, nur ohne Einheit und ohne step. */
function datumHtml(name, label) {
  return `<div class="field">
    <label for="f_${name}">${esc(label)}</label>
    <input class="inp" type="date" id="f_${name}" data-stammdatum="${name}">
  </div>`;
}

/* Der Seitenaufbau (N139): erst der Verlauf — die eine Frage, um die es geht —,
   dann die Stammdaten der Anlage, danach das gewählte Jahr, die E-Tankstelle
   und zuletzt, wem die Anlage gehört.

   N121 — Zählerstände und die Aufteilung auf die Einheiten sind in den
   Nebenkostenbereich gezogen (Zeitraum → Zählerstände) und stehen deshalb
   nicht mehr hier. */
function skelett() {
  const jahr = jahrWahl.wert();
  return `
    <div class="karte" id="verlauf">
      <div class="hh"><span class="titelinfo"><h3>Verlauf</h3>
        ${infoKnopf('verlauf')}</span></div>
      <div class="kpi" id="vKpi"></div>
      <div id="vGrafik"></div>
      <div id="vTabelle"></div>
    </div>

    <!-- N139 — die Anlage wurde einmal gekauft, nicht jedes Jahr neu. Diese
         Angaben gelten für alle Jahre und ändern sich oben nicht mit. -->
    <div class="karte eng">
      <div class="hh"><h3>Stammdaten der Anlage</h3></div>
      <p class="hint">Gelten für alle Jahre — die Jahresauswahl oben ändert
        hier nichts.</p>
      <div class="raster">
        ${F_STAMM.map(f => feldHtml(...f, 'stamm')).join('')}
        ${datumHtml('inbetriebnahme', 'Inbetriebnahme')}
      </div>

      <!-- N153 — der Startbetrag der Amortisation, aufgeschlüsselt nach
           denselben Quellen wie die Jahre danach. -->
      <div class="vorlauf">
        <div class="vk">
          <span class="vt">Bereits abgetragen</span>
          <span class="vs" id="vorlaufSumme">—</span>
        </div>
        <p class="vz" id="vorlaufZeit"></p>
        <div class="vraster">
          ${F_VORLAUF.map(f => feldHtml(...f, 'stamm')).join('')}
        </div>
        <p class="vf" id="vorlaufFuss"></p>
      </div>
    </div>

    <div class="karte">
      <div class="hh"><h3>PV im Jahr</h3><span class="jahrchip">${jahr}</span></div>
      <!-- N160 — zwei Seiten, zwei Aufgaben. Maßgeblich für Verbrauch, Kosten
           und Autarkie ist die Verbrauchsseite; die Produktionsseite trägt
           allein die Einspeisevergütung. -->
      <p class="hint">Diese Werte gehören zum oben gewählten Jahr ${jahr}.</p>
      <!-- N131 — statt abzutippen den SolarEdge-Screenshot lesen lassen. Die
           Handeingabe darunter bleibt immer der Weg, der sicher funktioniert. -->
      <div class="se" data-se-zone>
        <button type="button" class="btn leise" data-se-waehlen>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="3.5"/>
            <circle cx="8.6" cy="10.2" r="1.5"/>
            <path d="M4 17.2l4.6-4.6 3 3L15 12l5 5.2"/>
          </svg>Screenshot lesen</button>
        <input type="file" accept="image/*" data-se-datei hidden>
        <p class="se-note"><b>Bild hierher ziehen oder auswählen</b>Die
          SolarEdge-Ansicht mit den Balken „Produktion" und „Verbrauch". Die
          erkannten Zahlen werden erst gezeigt und eingetragen, nachdem du sie
          bestätigt hast.</p>
      </div>
      <div id="seBild"></div>
      <div id="seBox"></div>
      <div class="fgruppe">
        <span class="fgt">Verbrauchsseite <em>maßgeblich</em>${
          infoKnopf('verbrauchsseite')}</span>
        <div class="raster">
          ${F_JAHR_VERBRAUCH.map(f => feldHtml(...f)).join('')}
        </div>
      </div>
      <div class="fgruppe">
        <span class="fgt">Erzeugerseite <em>Einspeisevergütung</em>${
          infoKnopf('erzeugerseite')}</span>
        <div class="raster">
          ${F_JAHR_ERZEUGUNG.map(f => feldHtml(...f)).join('')}
        </div>
      </div>
      <div class="kpi" id="pv"></div>
      <!-- N154 — was sich aus den eigenen Zahlen an Hebeln ablesen lässt.
           Steht nichts drin, wofür es Daten gibt, bleibt der Block leer. -->
      <div id="tipps"></div>
    </div>

    <!-- N132/N139 — Nutzer und Abrechnungen der Tankstelle haben eine eigene
         Seite; hier steht nur, was zur Anlage gehört: der Satz und was zufließt. -->
    <div class="karte">
      <div class="hh"><span class="titelinfo"><h3>E-Tankstelle</h3>
        ${infoKnopf('tankstelle')}</span><span class="jahrchip">${jahr}</span></div>
      <div class="kpi" id="tank"></div>
      <a class="verweis" id="tankLink" href="tankstelle.html">
        Nutzer und Abrechnungen verwalten →</a>
    </div>

    <div class="karte">
      <div class="hh"><span class="titelinfo"><h3>PV-Eigentümer</h3>
        ${infoKnopf('eigentuemer')}</span>
        <button class="plus" id="pvPlus" type="button" data-pv-add
                aria-label="Anteil zuordnen" title="Anteil zuordnen">＋</button></div>
      <!-- N204 — jede Zeile trägt Investitions-€ und ‰; hinzugefügt wird über
           das „＋" oben rechts, das ausgraut, sobald alle 1000 ‰ vergeben sind.
           Gespeichert wird in den Stammdaten der Anlage, nicht am Jahr. -->
      <div id="pvAnteile"></div>
    </div>

    <div id="warnungen"></div>`;
}

/* Werte der JAHRESfelder als Objekt (leeres Feld = 0). */
function werteAusForm() {
  const werte = {};
  inhalt.querySelectorAll('input[data-feld]').forEach(el => {
    const v = parseFloat(el.value);
    werte[el.dataset.feld] = Number.isFinite(v) ? v : 0;
  });
  return werte;
}

/* N139 — die STAMMDATEN der Anlage: Zahlen, Datum und die Eigentümer-Anteile.
   Ein leeres Datum wird nicht mitgeschickt (nicht mitgeschickt = unverändert),
   damit ein Tippfehler im Zahlenfeld nicht nebenbei das Datum löscht. */
function stammAusForm() {
  const werte = {};
  inhalt.querySelectorAll('input[data-stamm]').forEach(el => {
    const v = parseFloat(el.value);
    werte[el.dataset.stamm] = Number.isFinite(v) ? v : 0;
  });
  const d = inhalt.querySelector('[data-stammdatum]');
  if (d && d.value) werte.inbetriebnahme = d.value;
  // Nur wenn die Zuordnung wirklich geladen ist — sonst schriebe ein Tippen im
  // Zahlenfeld eine leere Zuordnung über die gepflegte.
  if (pvGeladen) werte.anteile = pvAnteileJson();
  return werte;
}

/* Eingaben in die Maske schreiben. 0 bleibt leer, damit die Maske nicht mit
   Nullen zugestellt ist und man gleich lostippen kann. */
function formFuellen(werte) {
  inhalt.querySelectorAll('input[data-feld]').forEach(el => {
    const v = werte[el.dataset.feld];
    el.value = (v == null || v === 0) ? '' : v;
  });
}

function stammFuellen(s) {
  inhalt.querySelectorAll('input[data-stamm]').forEach(el => {
    const v = s[el.dataset.stamm];
    el.value = (v == null || v === 0) ? '' : v;
  });
  const d = inhalt.querySelector('[data-stammdatum]');
  if (d) d.value = s.inbetriebnahme || '';
}

/* ---------------------------------------------------------------------------
   N153 — der Startbetrag der Amortisation.

   Die Jahre nach der ersten Abrechnung zeigen im Verlauf schon, woher der
   Ertrag kam. Beim Startbetrag stand bisher nur eine Gesamtzahl — der Anfang
   des Verlaufs war damit die einzige Stelle ohne Herkunft.
   --------------------------------------------------------------------------- */

/* Der zuletzt gelesene Stammdatensatz — für den alten Gesamtwert und die
   Grenze, bis zu der der Vorlauf zählt. */
let stammStand = {};

const datumDe = d => d.toLocaleDateString('de-DE',
  { day: '2-digit', month: '2-digit', year: 'numeric' });

function tag(iso) {
  if (!iso) return null;
  const d = new Date(`${iso}T00:00:00`);
  return Number.isNaN(d.getTime()) ? null : d;
}

/* „2023 und 2024" / „2023, 2024 und 2025" — höchstens eine Handvoll, sonst
   wird aus dem Hinweis eine Aufzählung. */
function jahreText(von, bis) {
  if (bis - von > 6) return '';
  const jahre = [];
  for (let j = von; j <= bis; j++) jahre.push(j);
  if (!jahre.length) return '';
  return jahre.length === 1 ? String(jahre[0])
    : `${jahre.slice(0, -1).join(', ')} und ${jahre[jahre.length - 1]}`;
}

/* Welcher Zeitraum gemeint ist, steht nirgends im Code: `vorlauf_bis` ist der
   Beginn des ersten Abrechnungszeitraums, die Inbetriebnahme der Anfang. */
function vorlaufZeitraum() {
  const bis = tag(stammStand.vorlauf_bis);
  if (!bis) return 'Gemeint ist alles, was die Anlage eingebracht hat, bevor '
    + 'die erste Nebenkostenabrechnung begann.';
  const vortag = new Date(bis);
  vortag.setDate(bis.getDate() - 1);
  const feld = inhalt.querySelector('[data-stammdatum]');
  const start = tag((feld && feld.value) || stammStand.inbetriebnahme);
  const jahre = start && start <= vortag
    ? jahreText(start.getFullYear(), vortag.getFullYear()) : '';
  return 'Gemeint ist die Zeit vor dem ersten Abrechnungszeitraum: '
    + (start ? `von der Inbetriebnahme am ${datumDe(start)} ` : 'alles ')
    + `bis zum ${datumDe(vortag)}${jahre ? ` — also ${jahre}` : ''}.`;
}

/* „Es passiert nichts" darf es hier nicht geben: kam der Startbetrag nicht so
   an, wie er abgeschickt wurde, wird das gesagt — ein stumm verschluckter
   Fehler ist schlimmer als ein sichtbarer. */
function vorlaufPruefen(gesendet, antwort) {
  const summe = F_VORLAUF.reduce((s, [name]) => s + (gesendet[name] || 0), 0);
  if (!summe) return;
  if (antwort.vorlauf_summe == null
      || Math.abs(antwort.vorlauf_summe - summe) > 0.005) {
    melde('Der Startbetrag kam nicht an — bitte die Seite neu laden', 'neg');
  }
}

function vorlaufWerte() {
  return F_VORLAUF.map(([name]) => {
    const el = inhalt.querySelector(`input[data-stamm="${name}"]`);
    const v = parseFloat(el ? el.value : '');
    return Number.isFinite(v) ? v : 0;
  });
}

/* Die Vorrang-Regel — dieselbe wie im Backend (`_vorlauf`): steht in einem der
   drei Felder etwas, gilt IHRE Summe als Vorlauf. Sonst gilt weiterhin der
   früher eingetragene Gesamtwert. So bleibt der bestehende Wert gültig, bis
   die Aufteilung dasteht — und es entstehen keine zwei Wahrheiten. */
function vorlaufZeigen() {
  const summeZiel = document.getElementById('vorlaufSumme');
  if (!summeZiel) return;
  const werte = vorlaufWerte();
  const aufgeteilt = werte.some(w => w !== 0);
  const gesamt = stammStand.vorlauf_ertrag_eur || 0;
  const gilt = aufgeteilt ? werte.reduce((s, w) => s + w, 0) : gesamt;
  summeZiel.textContent = gilt ? eur(gilt) : '—';
  document.getElementById('vorlaufZeit').textContent = vorlaufZeitraum();
  document.getElementById('vorlaufFuss').textContent = aufgeteilt
    ? 'Diese Summe steht im Verlauf als eigener Balken VOR dem ersten '
      + 'Abrechnungsjahr — nach denselben Quellen aufgeteilt wie die Jahre '
      + 'danach, und voll in der Amortisation.'
    : (gesamt
      ? `Bisher steht hier nur der Gesamtwert ${eur(gesamt)}. Er gilt weiter, `
        + 'solange die Aufteilung leer ist — im Verlauf dann als ein Balken '
        + 'ohne Herkunft.'
      : 'Leer lassen, wenn die Anlage vor der ersten Abrechnung noch nichts '
        + 'eingebracht hat.');
}

/* ---------------------------------------------------------------------------
   N131 — den SolarEdge-Screenshot lesen lassen.

   Der Nutzer liest seine Zahlen in der SolarEdge-Oberfläche ab. Statt sie
   abzutippen, lädt er den Screenshot hoch: `POST /api/solaredge/lesen` gibt die
   erkannten Werte zurück und speichert nichts.

   Übernommen wird trotzdem nichts von allein. Die 100-%-Prüfung im Backend
   fängt einen einzelnen falsch gelesenen Anteil ab — ein VERTAUSCHTES Paar
   (24/50/26 statt 26/50/24) ergibt aber weiterhin 100 % und fällt nicht auf.
   Beim Nutzer wären das über 200 kWh Unterschied im zugekauften Strom. Deshalb
   steht zwischen Lesen und Eintragen die Prüfansicht: erkannt neben gespeichert,
   mit dem Hinweis, worauf zu schauen ist.

   Was das Bild nicht hergibt, kommt als `null` (nicht als 0) und wird nicht
   geschrieben — das Feld behält, was drinsteht. Die Umrechnung MWh → kWh und
   Prozent → kWh macht das Backend; hier wird nur auf ganze kWh gerundet, weil
   die Felder in ganzen kWh geführt werden.
   --------------------------------------------------------------------------- */

/* Feld · Bezeichnung · Herkunft im Bild · Menge · Anteil. Aus derselben Liste
   entsteht die Prüfansicht und die Übernahme. */
const SE_ZEILEN = [
  ['pv_produktion_kwh', 'PV-Produktion', 'Balken „Produktion"',
   d => d.produktion_kwh, () => null],
  ['einspeisung_kwh', 'Einspeisung', '„Ins Netz"',
   d => (d.produktion_kwh_je_anteil || {}).netz, d => d.produktion_netz_prozent],
  ['netz_kwh', 'Verbrauch Netz', '„Vom Netz"',
   d => (d.verbrauch_kwh_je_anteil || {}).netz, d => d.verbrauch_netz_prozent],
  ['solar_kwh', 'Verbrauch PV', '„Aus PV-Energie"',
   d => (d.verbrauch_kwh_je_anteil || {}).pv, d => d.verbrauch_pv_prozent],
  ['akku_kwh', 'Verbrauch Akku', '„Vom Speicher"',
   d => (d.verbrauch_kwh_je_anteil || {}).speicher,
   d => d.verbrauch_speicher_prozent],
];

const SE_HINWEIS = 'Bitte die Reihenfolge Netz · PV · Speicher mit dem Bild '
  + 'vergleichen: zwei vertauschte Anteile ergeben zusammen weiterhin 100 % '
  + 'und fallen keiner Prüfung auf. Erst mit „Übernehmen" wandern die Zahlen '
  + 'in die Felder.';

// Was die letzte Erkennung an übernehmbaren Werten hergab ({Feld: kWh}).
let seWerte = {};

const seProzent = p => p == null ? ''
  : p.toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' %';

/* Der aktuelle Stand eines Feldes — das, wogegen der erkannte Wert steht. */
function seJetzt(feld) {
  const el = inhalt.querySelector(`input[data-feld="${feld}"]`);
  const v = parseFloat(el ? el.value : '');
  return Number.isFinite(v) ? v : 0;
}

function seZeile(feld, name, herkunft, wert, anteil) {
  const erkannt = wert != null;
  const rechts = erkannt
    ? `<span class="alt">${kwh(seJetzt(feld))}</span><span class="pf"
       aria-hidden="true">→</span><span class="neu">${kwh(wert)}</span>`
    : `<span class="neu leer">nicht erkannt</span>`;
  const sub = [herkunft, seProzent(anteil)].filter(Boolean).join(' · ');
  return `<div class="se-zeile">
    <span class="se-n">${esc(name)}</span>
    <span class="se-w">${rechts}</span>
    <span class="se-sub">${esc(sub)}</span>
  </div>`;
}

/* Die Prüfansicht bauen — und dabei merken, was übernommen werden darf. */
function sePruefung(d) {
  seWerte = {};
  const zeilen = SE_ZEILEN.map(([feld, name, herkunft, menge, anteil]) => {
    const roh = menge(d);
    const wert = roh == null ? null : Math.round(roh);
    if (wert != null) seWerte[feld] = wert;
    return seZeile(feld, name, herkunft, wert, anteil(d));
  }).join('');

  const etwas = Object.keys(seWerte).length > 0;
  // Kam gar nichts durch, sagen Hinweis und Warnungen alle dasselbe — dann
  // steht der Satz genau einmal da. Erst wenn etwas erkannt wurde, tragen die
  // Warnungen eigene Information (Anteile ≠ 100 %, fehlende Einheit).
  const erklaerung = etwas ? esc(SE_HINWEIS)
    : esc(d.hinweis || 'Aus dem Bild kam nichts Übernehmbares — bitte die Werte '
          + 'unten von Hand eintragen.');
  const warnungen = etwas ? (d.warnungen || []).map(t =>
    `<div class="warnung"><span class="wi" aria-hidden="true">⚠</span>
      <span>${esc(t)}</span></div>`).join('') : '';
  const zusatz = (etwas && d.hinweis) ? `<p class="seh">${esc(d.hinweis)}</p>` : '';
  const gesamt = d.verbrauch_kwh != null
    ? `<p class="se-fuss">Verbrauch laut Screenshot: <b>${kwh(d.verbrauch_kwh)}</b>
       — daraus kommen die drei Anteile.</p>` : '';

  return `<div class="se-pruef">
    <span class="set">${etwas ? 'Erkannte Werte prüfen' : 'Nichts erkannt'}</span>
    ${zusatz}
    <p class="seh">${erklaerung}</p>
    ${warnungen}
    ${zeilen}
    ${gesamt}
    <div class="se-knoepfe">
      ${etwas ? '<button type="button" class="btn" data-se-ok>Übernehmen</button>'
        : ''}
      <button type="button" class="btn leise" data-se-weg>${
        etwas ? 'Verwerfen' : 'Schließen'}</button>
    </div>
  </div>`;
}

/* Eine ruhige Aussage, wenn das Lesen gar nicht erst zustande kam. Die
   Handeingabe darunter bleibt unberührt — sie ist der Weg, der immer geht. */
function seFehler(text) {
  seWerte = {};
  return `<div class="se-pruef">
    <span class="set">Screenshot nicht gelesen</span>
    <p class="seh">${esc(text)} Die Werte lassen sich unten von Hand eintragen.</p>
    <div class="se-knoepfe">
      <button type="button" class="btn leise" data-se-weg>Schließen</button>
    </div>
  </div>`;
}

/* Das Bild hochladen. `api()` schickt JSON — hier geht ein multipart-Paket
   direkt an `fetch`, wie überall, wo eine Datei hochgeladen wird. */
async function seLesen(datei) {
  const box = document.getElementById('seBox');
  const knopf = inhalt.querySelector('[data-se-waehlen]');
  if (!box) return;
  // Das Bild bleibt stehen, egal wie das Lesen ausgeht: klappt es nicht, trägt
  // der Nutzer von Hand ein — der Beleg gehört dann erst recht dazu.
  seBildMerken(datei);
  box.innerHTML = '<div class="se-pruef"><span class="set">Der Screenshot '
    + 'wird gelesen …</span><p class="seh">Das dauert ein paar Sekunden.</p></div>';
  if (knopf) knopf.disabled = true;
  try {
    const paket = new FormData();
    paket.append('datei', datei, datei.name || 'solaredge.png');
    const antwort = await fetch('/api/solaredge/lesen',
                                { method: 'POST', body: paket });
    if (!antwort.ok) {
      const grund = await antwort.json().then(k => k.detail).catch(() => null);
      box.innerHTML = seFehler(grund || `Fehler ${antwort.status}.`);
      return;
    }
    box.innerHTML = sePruefung(await antwort.json());
  } catch (fehler) {
    box.innerHTML = seFehler(String(fehler.message || fehler));
  } finally {
    if (knopf) knopf.disabled = false;
  }
}

/* Bestätigt: die erkannten Werte in die Felder schreiben und speichern lassen.
   Nur, was erkannt wurde — ein nicht gelesener Wert behält seinen Stand.

   N161 — beim Übernehmen wandert der Screenshot zusätzlich als Beleg in die
   Nextcloud (`seScreenshotAblegen`). Das ist eine Zugabe: klappt es nicht (keine
   Cloud), bleibt die Übernahme der Zahlen davon unberührt. */
function seUebernehmen() {
  const felder = Object.keys(seWerte);
  if (!felder.length) return;
  felder.forEach(feld => {
    const el = inhalt.querySelector(`input[data-feld="${feld}"]`);
    if (el) el.value = seWerte[feld] === 0 ? '' : seWerte[feld];
  });
  seSchliessen();
  angestossen();
  melde(`${felder.length} ${felder.length === 1 ? 'Wert' : 'Werte'} übernommen`,
        'pos');
  seScreenshotAblegen();       // der Beleg wandert in die Nextcloud (Zugabe)
}

/* N161 — den gemerkten Screenshot als Beleg ablegen lassen. Ein multipart-Paket
   direkt an `fetch` (wie beim Lesen), weil `api()` JSON schickt. Der Ausgang
   steht ehrlich in der Vorschau: „abgelegt" oder der ruhige Grund, warum nicht.
   Nie ein roter Fehler — die Zahlen sind längst gespeichert. */
async function seScreenshotAblegen() {
  const schluessel = seSchluessel();
  const bild = seBilder.get(schluessel);
  if (!bild || !bild.datei || bild.abgelegt) return;
  const slug = objektSlug, jahr = jahrWahl.wert();
  try {
    const paket = new FormData();
    paket.append('datei', bild.datei, bild.name || 'solaredge.png');
    const antwort = await fetch(
      `/api/solaredge/objekte/${encodeURIComponent(slug)}/${jahr}/screenshot`,
      { method: 'POST', body: paket });
    const d = await antwort.json().catch(() => ({}));
    if (schluessel !== seSchluessel()) return;   // Objekt/Jahr inzwischen gewechselt
    if (antwort.ok && d.abgelegt) {
      bild.abgelegt = true;
      bild.pfad = d.pfad || '';
      bild.grund = '';
      melde('Screenshot in der Nextcloud abgelegt', 'pos');
    } else {
      bild.grund = d.grund || d.detail || `Ablage fehlgeschlagen (${antwort.status})`;
    }
  } catch (fehler) {
    if (schluessel !== seSchluessel()) return;
    bild.grund = String(fehler.message || fehler);
  }
  seBildZeigen();
}

function seSchliessen() {
  seWerte = {};
  const box = document.getElementById('seBox');
  if (box) box.innerHTML = '';
}

/* Ein Lauscher am Behälter: die Karte wird bei jedem Jahreswechsel neu
   gezeichnet, ein Lauscher je Knopf ginge dabei verloren. */
inhalt.addEventListener('click', e => {
  if (e.target.closest('[data-se-waehlen]')) {
    const datei = inhalt.querySelector('[data-se-datei]');
    if (datei) datei.click();
  } else if (e.target.closest('[data-se-ok]')) {
    seUebernehmen();
  } else if (e.target.closest('[data-se-weg]')) {
    seSchliessen();
  }
});

inhalt.addEventListener('change', e => {
  const feld = e.target.closest('[data-se-datei]');
  if (!feld || !feld.files || !feld.files.length) return;
  const datei = feld.files[0];
  feld.value = '';            // damit dasselbe Bild erneut gewählt werden kann
  seLesen(datei);
});

/* ---------------------------------------------------------------------------
   N155 — das gelesene Bild bleibt stehen.

   Der Screenshot ist der Beleg der eingetragenen Zahlen; verschwindet er nach
   dem Auslesen, steht später niemand mehr die Herkunft. Er bleibt deshalb als
   Vorschau sichtbar, ein neues Bild ersetzt ihn.

   N161 — beim Übernehmen wird der Screenshot zusätzlich dauerhaft in der
   Nextcloud abgelegt (`seScreenshotAblegen`, `routers/solaredge.py`). Die
   Vorschau sagt ehrlich, in welchem Zustand er ist: noch nicht abgelegt (vor dem
   Übernehmen), abgelegt (mit Pfad) oder — ohne eingerichtete Cloud — der ruhige
   Grund, warum die Ablage entfiel.
   --------------------------------------------------------------------------- */
const seBilder = new Map();  // `${slug}|${jahr}` → {url, name, datei, abgelegt, pfad, grund}

const seSchluessel = () => `${objektSlug}|${jahrWahl.wert()}`;

function seBildMerken(datei) {
  const schluessel = seSchluessel();
  const alt = seBilder.get(schluessel);
  if (alt) URL.revokeObjectURL(alt.url);     // das ersetzte Bild freigeben
  // Die Datei bleibt gemerkt: beim Übernehmen wird sie in die Nextcloud gelegt.
  seBilder.set(schluessel, { url: URL.createObjectURL(datei),
                             name: datei.name || 'Screenshot', datei,
                             abgelegt: false, pfad: '', grund: '' });
  seBildZeigen();
}

/* Der kurze Cloud-Pfad für die Bestätigung — Objektordner weg, nur der Ort
   darunter („60_Nebenkosten/2025/…"), sonst läuft die Zeile in die Breite. */
function seKurzpfad(pfad) {
  const teile = (pfad || '').split('/').filter(Boolean);
  return teile.slice(-3).join('/');
}

function seBildZeigen() {
  const ziel = document.getElementById('seBild');
  if (!ziel) return;
  const bild = seBilder.get(seSchluessel());
  if (!bild) { ziel.innerHTML = ''; return; }
  let stand;
  if (bild.abgelegt) {
    const wo = bild.pfad ? ` · ${esc(seKurzpfad(bild.pfad))}` : '';
    stand = `<span class="se-abgelegt"><span class="hk" aria-hidden="true">✓</span>
      In der Nextcloud abgelegt${wo}</span>`;
  } else if (bild.grund) {
    stand = `<span>Beleg der eingetragenen Zahlen. Nicht abgelegt: ${esc(bild.grund)}</span>`;
  } else {
    stand = `<span>Beleg der eingetragenen Zahlen. Ein neues Bild auf die Fläche
      darüber ersetzt dieses. Beim Übernehmen wird er dauerhaft in der Nextcloud
      abgelegt.</span>`;
  }
  ziel.innerHTML = `<div class="sebild">
    <img src="${bild.url}" alt="Gelesener Screenshot: ${esc(bild.name)}">
    <div class="sebt"><b>${esc(bild.name)}</b>${stand}</div>
  </div>`;
}

/* ---------------------------------------------------------------------------
   N153b — den Screenshot hineinziehen.

   Der Knopf bleibt (auf dem Handy führt kein anderer Weg zum Ziel); am Rechner
   ist Ziehen der kürzere. Am Ablauf ändert das nichts: hochladen → erkannte
   Werte ZUR PRÜFUNG zeigen → erst „Übernehmen" schreibt. Diese Bestätigung ist
   das Einzige, was ein vertauschtes Netz/Speicher-Paar abfängt.

   Ohne `preventDefault` im `dragover` öffnet der Browser das fallengelassene
   Bild einfach im Tab — die Seite wäre samt getippter Eingaben weg. Deshalb
   wird auch NEBEN der Fläche abgefangen und dort schlicht nichts getan.
   --------------------------------------------------------------------------- */
const seZielTreffer = e => e.target instanceof Element
  && !!e.target.closest('[data-se-zone]');

function seZielAn(an) {
  const zone = inhalt.querySelector('[data-se-zone]');
  if (zone) zone.classList.toggle('dran', an);
}

/* Angenommen wird genau ein Bild. Alles andere wird gesagt, nicht geschluckt. */
function seAusAblage(dt) {
  const dateien = Array.from((dt && dt.files) || []);
  if (!dateien.length) return melde('Da war keine Datei dabei', 'neg');
  if (dateien.length > 1) return melde('Bitte nur ein Bild auf einmal', 'neg');
  if (!/^image\//.test(dateien[0].type || '')) {
    return melde('Nur Bilder — ein Screenshot der SolarEdge-Ansicht', 'neg');
  }
  seLesen(dateien[0]);
}

['dragenter', 'dragover'].forEach(art => document.addEventListener(art, e => {
  e.preventDefault();
  const treffer = seZielTreffer(e);
  if (e.dataTransfer) e.dataTransfer.dropEffect = treffer ? 'copy' : 'none';
  seZielAn(treffer);
}));

// Beim Wechsel zwischen Kindelementen feuert `dragleave` ständig — die Fläche
// darf erst dunkeln, wenn der Zeiger sie wirklich verlassen hat.
document.addEventListener('dragleave', e => {
  const bleibt = e.relatedTarget instanceof Element
    && !!e.relatedTarget.closest('[data-se-zone]');
  if (!bleibt) seZielAn(false);
});

document.addEventListener('drop', e => {
  e.preventDefault();
  const treffer = seZielTreffer(e);
  seZielAn(false);
  if (treffer) seAusAblage(e.dataTransfer);
});


const prozent = n => n == null ? '—'
  : n.toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' %';

/* N154/N160 — maßgeblich ist die VERBRAUCHSSEITE: 10.800 kWh, davon 24 % Netz,
   50 % PV, 26 % Speicher. Daraus kommt die Autarkie (8.208 von 10.800 = 76 %).

   Die frühere Kachel „Eigenverbrauch" (Produktion − Einspeisung, 8.375 kWh) ist
   ersatzlos weg: sie misst die Erzeugerseite, stand aber neben Verbrauchszahlen
   und wurde genau deshalb verwechselt. Die Produktionsseite hat auf dieser
   Seite nur eine Aufgabe — sie sagt, wie viel wirklich ins Netz ging, und trägt
   damit die Einspeisevergütung. Jetzt gibt es nur noch EINE Zahl für „selbst
   gedeckt", und sie kommt aus der Quelle, die der Nutzer als maßgeblich
   benannt hat. */
function autarkieKacheln(a) {
  if (!a) return '';
  return `
    <div class="k"><span class="kl">Autarkie <span class="kh">Anteil des
      Verbrauchs aus eigener Anlage</span></span>
      <span class="kv pos">${prozent(a.prozent)}</span>
      <span class="knote">${kwh(a.eigen_kwh)} von ${kwh(a.verbrauch_kwh)}</span></div>
    <div class="k"><span class="kl">Selbst gedeckt <span class="kh">PV +
      Speicher</span></span><span class="kv">${kwh(a.eigen_kwh)}</span>
      <span class="knote">${kwh(a.solar_kwh)} PV · ${kwh(a.akku_kwh)} Speicher</span></div>
    <div class="k"><span class="kl">Zugekauft <span class="kh">vom Netz</span></span>
      <span class="kv">${kwh(a.netz_kwh)}</span></div>`;
}

/* Das Engine-Ergebnis in die Karten schreiben (Inputs bleiben unberührt). */
function ergebnisZeigen(r) {
  const pv = r.pv;
  document.getElementById('pv').innerHTML = `
    ${autarkieKacheln(r.autarkie)}
    <div class="k"><span class="kl">Satz</span><span class="kv">${(pv.satz_ct ?? 0).toLocaleString('de-DE', { maximumFractionDigits: 2 })} ct</span></div>
    <div class="k"><span class="kl">Einspeisevergütung</span><span class="kv">${eur(pv.einspeiseverguetung)}</span></div>
    <div class="k"><span class="kl">Ersparnis Zukauf <span class="kh">rechnerisch,
      kein Ertrag</span></span><span class="kv">${eur(pv.eigenverbrauch_ersparnis)}</span></div>`;

  tippsZeigen(r);
  tankZeigen();

  const w = document.getElementById('warnungen');
  w.innerHTML = (r.warnungen || []).map(t =>
    `<div class="warnung"><span class="wi" aria-hidden="true">⚠</span><span>${esc(t)}</span></div>`).join('');
}

/* ---------------------------------------------------------------------------
   N154 — wo noch etwas zu holen ist.

   Jeder Hinweis steht auf ERFASSTEN Zahlen dieses Jahres und nennt sie. Fehlt
   die Grundlage, fällt der Hinweis weg — ein Tipp auf einer erfundenen Annahme
   ist schlechter als kein Tipp. Deshalb keine Ratgeberprosa: rechnen, beziffern,
   sonst schweigen.
   --------------------------------------------------------------------------- */
const ct = n => n.toLocaleString('de-DE', { minimumFractionDigits: 2,
                                            maximumFractionDigits: 2 }) + ' ct';
const round1 = n => Math.round(n * 10) / 10;

function tippIcon(pfad) {
  return `<svg class="ti" viewBox="0 0 24 24" width="19" height="19" fill="none"
    stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
    stroke-linejoin="round" aria-hidden="true">${pfad}</svg>`;
}

const I_BLITZ = '<path d="M13 3 5.5 13.5H11l-.5 7.5L18.5 10.5H12.5L13 3Z"/>';
const I_STECKER = '<path d="M9 3v5M15 3v5"/><path d="M6 8h12v2.5a6 6 0 0 1-12 0V8Z"/><path d="M12 16.5V21"/>';
const I_AKKU = '<rect x="3" y="7.5" width="15.5" height="9" rx="2.5"/><path d="M21 11v2"/><path d="M8 12h5.5"/>';

function tippListe(r) {
  const q = r.quellen || {};
  const netzPreis = (q.netz || {}).preis || 0;
  const solarPreis = (q.solar || {}).preis || 0;
  const akku = (q.akku || {}).kwh || 0;
  const a = r.autarkie || {};
  const pv = r.pv || {};
  const tipps = [];

  // 1) Der stärkste Hebel: eine selbst verbrauchte kWh ist mehr wert als eine
  //    eingespeiste. Nur mit beiden Preisen und tatsächlicher Einspeisung.
  const satz = pv.satz_ct || 0;
  if (pv.einspeisung_kwh > 0 && satz > 0 && netzPreis > 0
      && netzPreis * 100 > satz) {
    const unterschied = netzPreis * 100 - satz;
    tipps.push([I_BLITZ,
      `<b>Selbst verbrauchen schlägt einspeisen.</b> Eingespeist bringt
       ${ct(satz)} je kWh, zugekauft kostet ${ct(netzPreis * 100)} — jede kWh,
       die im Haus bleibt, ist ${ct(unterschied)} mehr wert. Bei
       ${kwh(pv.einspeisung_kwh)} Einspeisung sind das rechnerisch bis zu
       ${eur(pv.einspeisung_kwh * unterschied / 100)} im Jahr.`]);
  }

  // 2) Was das E-Auto aus dem Netz gezogen hat — die Zahl trägt der Nutzer
  //    selbst ein (`eauto_extern_kwh`), sie steht nicht in der Wallbox-Wolke.
  const extern = jahresSatz.eauto_extern_kwh || 0;
  if (extern > 0 && netzPreis > solarPreis && solarPreis > 0) {
    tipps.push([I_STECKER,
      `<b>Das E-Auto lud ${kwh(extern)} aus dem Netz.</b> Zum Satz des eigenen
       Stroms (${ct(solarPreis * 100)} statt ${ct(netzPreis * 100)}) wären das
       ${eur(extern * (netzPreis - solarPreis))} weniger — tagsüber laden
       verschiebt genau diese Menge.`]);
  }

  // 3) Was der Speicher in die Nacht rettet. Ohne ihn käme dieselbe Menge aus
  //    dem Netz — deshalb steht die Quote ohne Speicher daneben.
  if (akku > 0 && a.verbrauch_kwh > 0) {
    const ohne = round1((a.eigen_kwh - akku) / a.verbrauch_kwh * 100);
    tipps.push([I_AKKU,
      `<b>Der Speicher rettet ${kwh(akku)} in die Nacht.</b> Ohne ihn läge die
       Autarkie bei ${prozent(ohne)} statt ${prozent(a.prozent)} — je mehr
       Verbrauch in die Sonnenstunden wandert, desto weniger muss er leisten.`]);
  }
  return tipps;
}

function tippsZeigen(r) {
  const ziel = document.getElementById('tipps');
  if (!ziel) return;
  const tipps = tippListe(r);
  ziel.innerHTML = !tipps.length ? '' : `<div class="tipps">
    <span class="tt">Wo noch etwas zu holen ist</span>
    ${tipps.map(([icon, text]) =>
      `<div class="tz">${tippIcon(icon)}<span>${text}</span></div>`).join('')}
  </div>`;
}

/* ---------------------------------------------------------------------------
   N127 — der Amortisationsverlauf.

   Die Grafik zeigt nicht die Erträge nach oben, sondern die Anschaffung als
   negativen Betrag, der Jahr für Jahr aufgefressen wird. Je Jahr eine Säule:
   der noch offene Rest hängt in Rot unter der Nulllinie, und was ihn in diesem
   Jahr kleiner gemacht hat, sitzt als Ertragsblock darunter — Direktnutzung
   voll, Einspeisevergütung schraffiert (bleibt auch ohne Farbe lesbar),
   E-Tanken und der einmalige Vorlauf in eigenen Tönen. Durchstößt die Säule
   die Nulllinie, ist die Anlage amortisiert und der Überschuss steht in Grün
   darüber. Prognosejahre sind blass und gestrichelt umrandet, damit auf einen
   Blick klar ist, was gemessen und was gerechnet ist.

   Alles Inline-SVG von Hand — es gibt in diesem Projekt keine Chart-Bibliothek.
   --------------------------------------------------------------------------- */
const C_DIREKT = '#0F6E5C', C_EINSP = '#916212', C_TANK = '#7A9E94',
      C_VOR = '#5C6B70', C_OFFEN = '#B24229', C_PLUS = '#2E7D4F';

/* Die Ertragsquellen einer Säule, von unten nach oben gestapelt. */
const V_QUELLEN = [
  ['pv_strom', C_DIREKT],
  ['einspeisung', 'url(#pvSchraffur)'],
  ['tanken', C_TANK],
];

/* Die Blöcke einer Säule: erst der Vorlauf, dann das Jahr selbst.
   N153 — ist die Herkunft des Vorlaufs gepflegt (`vorlauf_teile`), wird er nach
   DENSELBEN Quellen aufgeteilt wie die Jahre danach, in denselben Farben und
   derselben Schraffur. Sonst bleibt er ein Block in seinem eigenen Ton. */
function saeulenBloecke(z) {
  const t = z.vorlauf_teile;
  const quellen = daten => V_QUELLEN.map(([feld, fuellung]) =>
    [daten[feld] || 0, fuellung]);
  return [t ? quellen(t) : [[z.vorlauf || 0, C_VOR]], quellen(z)];
}

const bloeckeSumme = liste => liste.reduce((s, [wert]) => s + wert, 0);

const eur0 = n => Math.round(n || 0).toLocaleString('de-DE') + ' €';
const negativ = t => t.replace('-', '−');

function verlaufGrafik(v) {
  const prog = (v.prognose && v.prognose.jahre) || [];
  const reihe = [
    ...v.jahre.map(z => ({ ...z, geschaetzt: false })),
    ...prog.map(z => ({ ...z, vorlauf: 0, pv_strom: 0, einspeisung: 0,
                        tanken: 0, geschaetzt: true })),
  ];
  const ansch = v.anschaffung;
  if (!reihe.length || !ansch) return '';

  const B = 380, H = 238;
  // Die Achsenspalte wächst mit der Beschriftung: „−36.000 €" braucht mehr
  // Platz als „−900 €" — sonst hängt die Zahl links aus der Zeichnung heraus.
  const bodenText = negativ(eur0(-ansch));
  const achse = Math.max(46, Math.round(12 + bodenText.length * 5.8));
  const xl = achse, xr = B - 6, yo = 16, yu = H - 44;
  // Der „Stand" ist kumulierter Ertrag minus Anschaffung: er startet bei
  // −Anschaffung und wandert nach oben durch die Null.
  const stand = z => (z.kumuliert || 0) - ansch;
  const maxPlus = Math.max(...reihe.map(stand), ansch * 0.09);
  const spanne = ansch + maxPlus;
  const y = w => yu - ((w + ansch) / spanne) * (yu - yo);
  const yNull = y(0);
  const slot = (xr - xl) / reihe.length;
  const bw = Math.max(3, Math.min(42, slot * 0.62));
  const rx = Math.min(4, bw / 3).toFixed(1);
  const jederNte = Math.ceil(reihe.length / 9);

  let clips = '', saeulen = '', jahrLabels = '', vorher = -ansch;
  let letztesLabel = -Infinity;
  reihe.forEach((z, i) => {
    const x = xl + slot * i + (slot - bw) / 2;
    const nachher = stand(z);
    const yV = y(vorher), yN = y(nachher);        // yV liegt tiefer als yN
    const oben = Math.min(yN, yNull), unten = Math.max(yV, yNull);
    const blass = z.geschaetzt ? ' opacity=".24"' : '';
    let inhalt = '';
    // Noch offener Rest — hängt unter der Nulllinie.
    if (nachher < 0 && yN - yNull > 0.3) {
      inhalt += `<rect x="${x}" y="${yNull.toFixed(1)}" width="${bw}"
        height="${(yN - yNull).toFixed(1)}" fill="${C_OFFEN}"${blass}/>`;
    }
    // Überschuss aus den Vorjahren — steht über der Nulllinie.
    if (vorher > 0 && yNull - yV > 0.3) {
      inhalt += `<rect x="${x}" y="${yV.toFixed(1)}" width="${bw}"
        height="${(yNull - yV).toFixed(1)}" fill="${C_PLUS}"${blass}/>`;
    }
    // Was dieses Jahr eingebracht hat — der Bissen aus dem Balken.
    const block = yV - yN;
    if (block > 0.3) {
      if (z.geschaetzt) {
        inhalt += `<rect x="${x + .75}" y="${(yN + .75).toFixed(1)}"
          width="${Math.max(1, bw - 1.5)}" height="${Math.max(1, block - 1.5).toFixed(1)}"
          fill="${C_PLUS}" fill-opacity=".16" stroke="${C_OFFEN}"
          stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="3 2.5"/>`;
      } else {
        const [vorBloecke, jahrBloecke] = saeulenBloecke(z);
        let boden = yV;
        const stapeln = ([wert, fuellung]) => {
          const h = z.summe > 0 ? block * (wert / z.summe) : 0;
          if (h < 0.3) return;
          boden -= h;
          inhalt += `<rect x="${x}" y="${boden.toFixed(1)}" width="${bw}"
            height="${h.toFixed(1)}" fill="${fuellung}"/>`;
        };
        vorBloecke.forEach(stapeln);
        const vorlaufKante = boden;       // Oberkante des Vorlaufs
        jahrBloecke.forEach(stapeln);
        // Ist der Vorlauf nach denselben Quellen aufgeteilt, hätten seine
        // Blöcke dieselbe Farbe wie die des Jahres — ein Haarstrich sagt, wo
        // der Vorsprung endet und das erste Abrechnungsjahr anfängt.
        if (z.vorlauf_teile && bloeckeSumme(vorBloecke) > 0
            && bloeckeSumme(jahrBloecke) > 0 && yV - vorlaufKante > 1.5) {
          inhalt += `<line x1="${x}" y1="${vorlaufKante.toFixed(1)}"
            x2="${(x + bw).toFixed(1)}" y2="${vorlaufKante.toFixed(1)}" stroke="#FFF"
            stroke-opacity=".85" stroke-width="1.2"/>`;
        }
      }
    }
    clips += `<clipPath id="pvc${i}"><rect x="${x}" y="${oben.toFixed(1)}"
      width="${bw}" height="${Math.max(.5, unten - oben).toFixed(1)}"
      rx="${rx}"/></clipPath>`;
    saeulen += `<g clip-path="url(#pvc${i})">${inhalt}</g>`;
    // Jede n-te Jahreszahl, dazu die letzte — aber nur, wenn sie der vorigen
    // nicht auf die Pelle rückt.
    const letzte = i === reihe.length - 1;
    if ((i % jederNte === 0 || letzte) && i - letztesLabel >= jederNte) {
      letztesLabel = i;
      jahrLabels += `<text x="${(x + bw / 2).toFixed(1)}" y="${yu + 17}"
        class="ax${z.geschaetzt ? ' blass' : ''}">${z.jahr}</text>`;
    }
    vorher = nachher;
  });

  // Trennstrich zwischen Erfasstem und Prognose.
  const grenze = prog.length ? `<line x1="${(xl + slot * v.jahre.length).toFixed(1)}"
    y1="${yo}" x2="${(xl + slot * v.jahre.length).toFixed(1)}" y2="${yu + 4}"
    stroke="#5C6B70" stroke-opacity=".35" stroke-width="1" stroke-dasharray="3 3"/>` : '';

  return `<svg viewBox="0 0 ${B} ${H}" class="chart" role="img"
      aria-label="Amortisationsverlauf der PV-Anlage">
    <defs>
      <pattern id="pvSchraffur" width="6" height="6" patternUnits="userSpaceOnUse"
               patternTransform="rotate(45)">
        <rect width="6" height="6" fill="${C_EINSP}"/>
        <line x1="0" y1="0" x2="0" y2="6" stroke="#FFF" stroke-width="2.4"
              stroke-opacity=".8"/>
      </pattern>
      ${clips}
    </defs>
    <style>
      .ax{font:500 10px var(--body);fill:var(--soft);text-anchor:middle}
      .ax.blass{fill-opacity:.6}
      .ay{font:500 9.5px var(--mono);fill:var(--soft);text-anchor:end}
    </style>
    <line x1="${xl}" y1="${yu}" x2="${xr}" y2="${yu}" stroke="${C_OFFEN}"
          stroke-opacity=".35" stroke-width="1" stroke-dasharray="4 3"/>
    ${grenze}
    ${saeulen}
    ${jahrLabels}
    <line x1="${achse - 4}" y1="${yNull.toFixed(1)}" x2="${xr}"
          y2="${yNull.toFixed(1)}" stroke="#16262C" stroke-width="1.2"/>
    <text x="${achse - 8}" y="${(yNull - 4).toFixed(1)}" class="ay">0 €</text>
    <text x="${achse - 8}" y="${yu + 4}" class="ay">${bodenText}</text>
  </svg>`;
}

/* Nur zeigen, was in der Zeichnung auch vorkommt — eine Legende mit Farben
   ohne Balken wäre eine Behauptung. */
function verlaufLegende(v) {
  // N153 — der aufgeschlüsselte Vorlauf zählt für die Legende wie ein Jahr: er
  // erscheint in denselben Farben und braucht deshalb dieselben Einträge.
  const teile = v.vorlauf_teile || {};
  const hat = feld => v.jahre.some(z => (z[feld] || 0) > 0)
    || (teile[feld] || 0) > 0;
  const eintraege = [
    [hat('pv_strom'), `style="background:${C_DIREKT}"`, 'Direktnutzung'],
    [hat('einspeisung'), 'class="schraffur"', 'Einspeisevergütung'],
    [hat('tanken'), `style="background:${C_TANK}"`, 'E-Tanken'],
    [(v.vorlauf || 0) > 0 && !v.vorlauf_aufgeschluesselt,
     `style="background:${C_VOR}"`, 'Vorlauf — Herkunft nicht aufgeschlüsselt'],
    [hat('offen'), `style="background:${C_OFFEN}"`, 'noch offen'],
    [hat('ueberschuss'), `style="background:${C_PLUS}"`, 'amortisiert'],
    [!!v.prognose, 'class="prognose"', 'Prognose'],
  ].filter(([zeigen]) => zeigen);
  // Der Vorlaufbalken steht in denselben Farben da wie die Abrechnungsjahre —
  // ohne einen Satz dazu wäre nicht zu sehen, dass er aus der Zeit davor kommt.
  const note = (v.vorlauf || 0) > 0 && v.vorlauf_jahr != null
    ? `<p class="legendennote">Der Balken ${v.vorlauf_jahr} ist der Vorlauf
       (${eur(v.vorlauf)}): die Zeit vor der ersten Abrechnung${
        v.vorlauf_aufgeschluesselt
          ? ', nach denselben Quellen aufgeteilt wie die Jahre danach'
          : ' — die Herkunft ist dort nicht aufgeschlüsselt'}.</p>` : '';
  return `<div class="legende">${eintraege.map(([, attr, text]) =>
    `<span><i ${attr}></i>${text}</span>`).join('')}</div>${note}`;
}

function verlaufTabelle(v) {
  // N174 — keine eigene Vorlauf-Spalte mehr. Der Vorlauf des ersten Jahres wird
  // in dieselben Quellenspalten aufgeschlüsselt wie die Jahre danach: sein
  // PV-Strom-Anteil in die PV-Strom-Spalte, seine Einspeisung in die
  // Einspeisung-Spalte, sein E-Tanken in die E-Tanken-Spalte. Ist er nur als
  // Gesamtbetrag gepflegt, steht er in PV-Strom mit dem Hinweis, dass er nicht
  // aufgeschlüsselt ist — statt eine Spalte wieder einzuführen.
  const kopf = ['Jahr', 'PV-Strom', 'Einspeisung', 'E-Tanken',
                'Summe', 'kumuliert', 'noch offen'];
  const roherVorlauf = z => z.jahr === v.vorlauf_jahr && (z.vorlauf || 0) > 0
    && !z.vorlauf_teile;
  const zelle = (z, feld) => {
    let wert = z[feld] || 0;
    if (z.jahr === v.vorlauf_jahr) {
      if (z.vorlauf_teile) wert += z.vorlauf_teile[feld] || 0;
      else if (feld === 'pv_strom') wert += z.vorlauf || 0;
    }
    return wert;
  };
  const geld = (z, feld) => {
    const w = zelle(z, feld);
    const hinweis = feld === 'pv_strom' && roherVorlauf(z)
      ? '<span class="unauf">nicht aufgeschlüsselt</span>' : '';
    return (w ? eur(w) : '—') + hinweis;
  };
  const summe = feld => v.jahre.reduce((s, z) => s + zelle(z, feld), 0);
  const zeilen = v.jahre.map(z => `<tr>
      <td>${z.jahr}${z.jahr === v.vorlauf_jahr
        ? '<span class="vorab">vor der Abrechnung</span>' : ''}</td>
      <td class="leise">${geld(z, 'pv_strom')}</td>
      <td class="leise">${geld(z, 'einspeisung')}</td>
      <td class="leise">${geld(z, 'tanken')}</td>
      <td class="summe">${eur(z.summe)}</td>
      <td>${eur(z.kumuliert)}</td>
      <td>${z.offen ? eur(z.offen)
        : (z.ueberschuss ? `<span class="plus">+ ${eur(z.ueberschuss)}</span>`
          : eur(0))}</td>
    </tr>`).join('');
  return `<div class="tabrahmen"><table class="jt">
    <thead><tr>${kopf.map(t => `<th>${t}</th>`).join('')}</tr></thead>
    <tbody>${zeilen}</tbody>
    <tfoot><tr>
      <td>Σ</td>
      <td>${eur(summe('pv_strom'))}</td>
      <td>${eur(summe('einspeisung'))}</td>
      <td>${eur(summe('tanken'))}</td>
      <td class="summe">${eur(v.kumuliert)}</td>
      <td>${eur(v.kumuliert)}</td>
      <td>${eur(v.rest)}</td>
    </tr></tfoot>
  </table></div>
  <p class="scrollhinweis">Seitlich wischen für alle Spalten.</p>`;
}

function verlaufKpi(v) {
  // Die Jahreszahl bleibt der große Wert; „geschätzt, noch 25 Jahre" steht als
  // eigene Zeile darunter — sonst sprengt der Zusatz die Kachel.
  const zusatz = v.break_even_geschaetzt
    ? `<span class="knote">geschätzt · noch ${v.break_even_in_jahren} Jahre</span>`
    : `<span class="knote">${v.break_even_jahr ? 'erreicht'
        : 'Prognose ab dem zweiten Ertragsjahr'}</span>`;
  return `
