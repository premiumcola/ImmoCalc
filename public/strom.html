<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PV Amortisation · ImmoCalc</title>
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F6E5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ImmoCalc">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/immo.css">
<style>
  /* ------------------------------------------------------------------
     Nur strom.html (N83). immo.css wird hier nicht angefasst; was sich
     spaeter als seitenuebergreifend erweist, wandert dann dorthin.
     ------------------------------------------------------------------ */
  .filter{display:flex;gap:8px;margin-bottom:14px}
  .filter > div{flex:1;min-width:0}

  .karte{background:var(--sheet);border-radius:16px;padding:16px 16px 6px;
         margin-bottom:14px;box-shadow:0 1px 2px rgba(22,38,44,.05)}
  .karte.eng{padding-bottom:16px}
  .karte h3{font:600 13px var(--disp);letter-spacing:-.01em;margin:0 0 4px;
            color:var(--ink)}
  .karte .hh{display:flex;align-items:baseline;justify-content:space-between;
             gap:10px;flex-wrap:wrap;margin-bottom:14px}
  /* „＋" oben rechts (N204) — derselbe ruhige Teal-Chip wie in tankstelle.html,
     34 px sichtbar, 44 px tippbar (iOS) über ::after. Ausgegraut, sobald alle
     1000 ‰ vergeben sind. */
  .karte .hh .plus{flex:none;align-self:center;border:none;background:var(--teal-l);
    color:var(--teal-d);width:34px;height:34px;border-radius:11px;cursor:pointer;
    font:600 21px var(--body);line-height:1;display:inline-flex;
    align-items:center;justify-content:center;position:relative}
  .karte .hh .plus::after{content:"";position:absolute;inset:-5px}
  .karte .hh .plus:hover{background:var(--teal);color:#fff}
  .karte .hh .plus:disabled{background:var(--paper);color:var(--soft);
    cursor:not-allowed}
  .karte .hh .plus:disabled:hover{background:var(--paper);color:var(--soft)}
  .karte .hint b{font-weight:600;color:var(--ink)}
  .karte .hint{font:400 12px var(--body);color:var(--soft);line-height:1.5;
               margin:0 0 14px;max-width:600px}

  /* Eingabe-Raster: auf breiten Schirmen mehrspaltig, auf dem iPhone eine
     Spalte. minmax verhindert, dass ein langes Label die Spalte sprengt. */
  .raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
          gap:12px 14px}
  /* Bricht eine Beschriftung um, darf das Eingabefeld darunter nicht
     mitrutschen — sonst fluchten die Kanten einer Zeile nicht mehr. Das Label
     wächst, das Feld sitzt bündig am unteren Rand. */
  .raster .field{margin-bottom:2px;display:flex;flex-direction:column}
  .raster .field label{flex:1 0 auto}
  /* N112 - ein Feld ueber die volle Breite (Eigentuemer-Anteile). Ohne eigene
     Zeile schob es sich vorher ueber die Kacheln darunter. */
  .field.breit{display:block;width:100%;margin:0 0 16px}
  .field.breit input{width:100%;box-sizing:border-box}
  .field .einheit{font-weight:400;text-transform:none;letter-spacing:0;
                  color:var(--soft)}

  /* N153 — der Startbetrag der Amortisation: ein eigener ruhiger Block mit drei
     Beträgen nach denselben Quellen wie die Jahre danach und der geltenden
     Summe daneben. Die drei stehen auch auf 390 px nebeneinander — nebeneinander
     liest man sie als eine Aufteilung, untereinander als drei Angaben. */
  .vorlauf{background:var(--paper);border-radius:14px;padding:14px 15px;
           margin:2px 0 16px}
  .vorlauf .vk{display:flex;align-items:baseline;justify-content:space-between;
               gap:8px 12px;flex-wrap:wrap}
  .vorlauf .vt{font:600 13px var(--disp);letter-spacing:-.01em;color:var(--ink)}
  .vorlauf .vs{font:700 17px var(--disp);letter-spacing:-.02em;
               color:var(--teal-d);white-space:nowrap}
  .vorlauf .vz,.vorlauf .vf{font:400 11.5px var(--body);color:var(--soft);
                            line-height:1.55;max-width:600px}
  .vorlauf .vz{margin:7px 0 13px}
  .vorlauf .vf{margin:11px 0 0}
  .vraster{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .vraster .field{margin:0;display:flex;flex-direction:column}
  /* Bricht ein Label um, bleiben die Felder trotzdem auf einer Linie. */
  .vraster .field label{flex:1 0 auto;font-size:9.5px;letter-spacing:.04em;
                        margin-bottom:6px}
  .vraster .inp{padding-left:10px;padding-right:10px;background:var(--sheet)}

  /* Quellen-Zeile: Menge + Preis nebeneinander, Kosten als Chip rechts. */
  .quelle{display:grid;grid-template-columns:1fr 1fr auto;gap:12px 14px;
          align-items:end;padding:12px 0;border-top:1px solid var(--line)}
  .quelle:first-of-type{border-top:none}
  .quelle .qname{grid-column:1/-1;font:600 12.5px var(--disp);color:var(--ink);
                 display:flex;align-items:center;gap:8px}
  .quelle .qkosten{justify-self:end;align-self:end;text-align:right;min-width:92px}
  .quelle .qkosten .kl{display:block;font:600 9px var(--mono);letter-spacing:.07em;
                       text-transform:uppercase;color:var(--soft)}
  .quelle .qkosten .kv{display:block;font:700 15px var(--disp);
                       letter-spacing:-.02em;color:var(--ink);margin-top:3px}
  @media(max-width:439px){
    .quelle{grid-template-columns:1fr 1fr}
    .quelle .qkosten{grid-column:1/-1;justify-self:start;text-align:left;
                     display:flex;align-items:baseline;gap:8px}
    .quelle .qkosten .kv{margin-top:0}
  }

  /* Ergebnis: die beiden Verbrauchsgruppen nebeneinander. */
  .gruppen{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
           gap:12px}
  .gr{background:var(--paper);border-radius:14px;padding:14px}
  .gr .gt{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
          margin-bottom:10px}
  .gr .gn{font:600 13px var(--disp);letter-spacing:-.01em;color:var(--ink)}
  .gr .gs{font:700 18px var(--disp);letter-spacing:-.02em;color:var(--teal-d)}
  .gr .zeile{display:flex;align-items:baseline;justify-content:space-between;
             gap:10px;padding:6px 0;font:500 12.5px var(--body);color:var(--soft)}
  .gr .zeile b{font:600 12.5px var(--body);color:var(--ink)}
  .gr .zeile .kwhx{font:400 11px var(--mono);color:var(--soft)}

  /* Kennzahlen (PV-Ergebnis). */
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
       gap:10px;margin-top:4px}
  .kpi .k{background:var(--paper);border-radius:14px;padding:12px 13px}
  .kpi .kl{display:block;font:600 9px var(--mono);letter-spacing:.07em;
           text-transform:uppercase;color:var(--soft)}
  .kpi .kv{display:block;font:700 16px var(--disp);letter-spacing:-.02em;
           margin-top:6px;color:var(--ink)}
  .kpi .kv.pos{color:var(--pos)}
  .kpi .knote{display:block;font:400 10.5px var(--body);color:var(--soft);
              margin-top:4px;line-height:1.35}
  /* Zusatz in der Kachel-Beschriftung („rechnerisch, kein Ertrag"). Als
     inline-Element klebte er am Label und erbte dessen Versalien. */
  .kpi .kh{display:block;font:400 10px var(--body);text-transform:none;
           letter-spacing:0;color:var(--soft);margin-top:3px}

  /* Rest-Chip / abgeleitete Werte an einer Karte. */
  .abgeleitet{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
  .abgeleitet .chip{font:600 11px var(--mono)}

  .warnung{display:flex;gap:10px;align-items:flex-start;background:var(--amber-bg);
           color:var(--amber);border-radius:12px;padding:12px 14px;margin-bottom:14px;
           font:500 12.5px var(--body);line-height:1.5}
  .warnung .wi{font-size:15px;line-height:1.3;flex:none}

  .chartleer{font:400 13px var(--body);color:var(--soft);text-align:center;
             padding:22px 8px}

  /* N160 — Verbrauchsseite und Erzeugerseite als eigene Blöcke: getrennt
     beschriftet liest niemand mehr die eine Zahl als die andere. */
  .fgruppe{margin:0 0 18px}
  .fgruppe .fgt{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 9px;
                font:600 12.5px var(--disp);letter-spacing:-.01em;
                color:var(--ink)}
  .fgruppe .fgt em{font:500 9px var(--mono);letter-spacing:.07em;
                   font-style:normal;text-transform:uppercase;
                   color:var(--teal-d);background:var(--teal-l);
                   border-radius:999px;padding:4px 9px}

  /* N154 — die Hinweise aus den eigenen Zahlen. Ruhig, keine Signalfarbe: das
     ist kein Alarm, sondern ein Hebel. */
  .tipps{background:var(--paper);border-radius:14px;padding:15px;
         margin:14px 0 16px;max-width:640px}
  .tipps .tt{display:block;font:600 13px var(--disp);letter-spacing:-.01em;
             color:var(--ink);margin-bottom:11px}
  .tipps .tz{display:flex;gap:11px;align-items:flex-start;padding:11px 0;
             border-top:1px solid rgba(22,38,44,.08);
             font:400 12px var(--body);color:var(--soft);line-height:1.65}
  .tipps .tz:first-of-type{border-top:none;padding-top:0}
  .tipps .tz b{display:block;font:600 12.5px var(--disp);letter-spacing:-.01em;
               color:var(--ink);margin-bottom:2px}
  .tipps .ti{flex:none;margin-top:1px;color:var(--teal)}

  /* ---- N131 SolarEdge-Screenshot lesen ---------------------------------- */
  /* N153b — die Ablagefläche: der Screenshot lässt sich hineinziehen, der Knopf
     bleibt der Weg auf dem Handy. Knopf und Satz stehen in einem Flex-Fluss und
     können sich damit auf keiner Breite überlagern: der Knopf gibt nie nach
     (`flex:none`), der Satz bricht um und rutscht ab 500 px in eine eigene
     Zeile. Beide haben rundum Luft, nichts sitzt absolut. */
  .se{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;
      box-sizing:border-box;margin:0 0 16px;padding:14px 15px;
      border:1.5px dashed rgba(22,38,44,.16);border-radius:14px;
      background:var(--paper);transition:background .15s,border-color .15s}
  .se.dran{background:var(--teal-l);border-color:var(--teal);border-style:solid}
  .se .btn{flex:none;width:auto;min-height:44px;padding:11px 16px;font-size:13px;
           display:inline-flex;align-items:center;gap:9px;background:var(--sheet)}
  .se .btn svg{flex:none}
  .se .btn[disabled]{opacity:.55;cursor:default}
  .se-note{flex:1 1 260px;min-width:0;margin:0;font:400 11.5px var(--body);
           color:var(--soft);line-height:1.55}
  .se-note b{display:block;font:600 12.5px var(--disp);letter-spacing:-.01em;
             color:var(--ink);margin-bottom:3px}

  /* N155 — das gelesene Bild bleibt als Beleg stehen. */
  .sebild{display:flex;gap:13px;align-items:flex-start;background:var(--paper);
          border-radius:14px;padding:12px;margin:0 0 16px;max-width:620px}
  .sebild img{flex:none;width:86px;height:86px;object-fit:cover;
              border-radius:11px;background:var(--sheet)}
  .sebt{min-width:0;font:400 11.5px var(--body);color:var(--soft);
        line-height:1.55}
  .sebt b{display:block;font:600 12.5px var(--disp);letter-spacing:-.01em;
          color:var(--ink);margin-bottom:4px;overflow-wrap:anywhere}
  /* N161 — abgelegt-Zustand: ruhige grüne Bestätigung mit Haken. */
  .se-abgelegt{display:inline-flex;align-items:baseline;gap:6px;
               color:var(--teal-d);font-weight:600;overflow-wrap:anywhere}
  .se-abgelegt .hk{flex:none;font-size:12px}

  /* Die Prüfansicht — nichts wird übernommen, bevor sie bestätigt ist. */
  /* Auf breiten Schirmen bleibt die Gegenüberstellung ein Block, statt sich
     über die ganze Kartenbreite zu spannen — sonst steht der erkannte Wert
     einen halben Meter neben seiner Bezeichnung. */
  .se-pruef{background:var(--paper);border-radius:14px;padding:15px;margin:0 0 16px;
            max-width:620px}
  .se-pruef .set{display:block;font:600 13px var(--disp);letter-spacing:-.01em;
                 color:var(--ink);margin:0 0 7px}
  .se-pruef .seh{font:400 12px var(--body);color:var(--soft);line-height:1.6;
                 margin:0 0 14px}
  .se-pruef .warnung{margin:0 0 10px}
  /* Zwei Spalten: links die Bezeichnung (darf umbrechen), rechts alt → neu
     (bricht nie). So bleibt die Gegenüberstellung auch auf 390 px lesbar. */
  .se-zeile{display:grid;grid-template-columns:1fr auto;gap:3px 12px;
            align-items:baseline;padding:10px 0;
            border-top:1px solid rgba(22,38,44,.08)}
  .se-zeile:first-of-type{border-top:none;padding-top:0}
  .se-n{font:600 12.5px var(--disp);letter-spacing:-.01em;color:var(--ink);
        min-width:0;overflow-wrap:anywhere}
  .se-w{justify-self:end;text-align:right;white-space:nowrap;
        font:500 12.5px var(--mono)}
  .se-w .alt{color:var(--soft)}
  .se-w .pf{color:var(--soft);margin:0 6px}
  .se-w .neu{font-weight:600;color:var(--teal-d)}
  .se-w .neu.leer{font-weight:500;color:var(--soft)}
  .se-sub{grid-column:1/-1;font:400 10.5px var(--mono);color:var(--soft)}
  .se-fuss{margin:12px 0 0;font:400 11.5px var(--body);color:var(--soft);
           line-height:1.55}
  .se-knoepfe{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .se-knoepfe .btn{flex:1 1 150px;width:auto;min-height:44px}

  /* N139 — die Karte, die sich auf das oben gewählte Jahr bezieht, sagt das
     auch: ein ruhiger Chip neben der Überschrift statt eines Satzes. */
  .jahrchip{font:600 10px var(--mono);letter-spacing:.07em;text-transform:uppercase;
            color:var(--teal-d);background:var(--teal-l);border-radius:999px;
            padding:4px 10px;white-space:nowrap}

  /* Verweis auf eine andere Seite (E-Tankstelle verwalten). */
  .verweis{display:inline-flex;align-items:center;gap:8px;box-sizing:border-box;
           min-height:44px;padding:11px 14px;margin:2px 0 14px;
           background:var(--paper);border-radius:12px;text-decoration:none;
           font:600 12.5px var(--body);color:var(--teal-d)}
  .verweis:hover{background:var(--teal-l)}

  /* N149 — PV-Eigentümer: in der Liste steht nur, wer wirklich zugeordnet ist.
     Wer nichts hält, steht in der Auswahl darunter — dieselbe Sprache wie
     „Anteil zuweisen" auf der Eigentümer-Seite: Zeile mit ‰ und ×, darunter
     ein Weg zum Hinzufügen. */
  .pa-zeile{display:flex;align-items:center;gap:10px;min-height:52px;
            padding:8px 8px 8px 14px;margin-bottom:8px;background:var(--paper);
            border-radius:12px}
  .pa-name{flex:1;min-width:0;font:600 13px var(--disp);letter-spacing:-.01em;
           color:var(--ink);overflow-wrap:anywhere}
  .pa-obj{display:block;font:400 11px var(--body);color:var(--soft);
          letter-spacing:0;margin-top:3px}
  /* Der investierte Betrag dieses Anteils (N204): ‰ × Gesamt-Anschaffung.
     Ruhige Zahl vor dem ‰-Chip, rechtsbündig, damit die Beträge fluchten. */
  .pa-invest{flex:none;font:700 13px var(--disp);color:var(--ink);
             letter-spacing:-.01em;white-space:nowrap;text-align:right}
  /* Der Anteil als Chip — dieselbe Auszeichnung wie in der Verteilung darunter. */
  .pa-wert{flex:none;font:600 11px var(--mono);color:var(--teal-d);
           background:var(--teal-l);border-radius:999px;padding:5px 11px;
           white-space:nowrap}
  .pa-weg{flex:none;width:44px;height:44px;padding:0;border:none;background:none;
          border-radius:12px;color:var(--soft);font:400 20px var(--body);
          line-height:1;cursor:pointer}
  .pa-weg:hover{background:var(--neg-bg);color:var(--neg)}
  .pa-summe{display:flex;align-items:baseline;justify-content:space-between;
            gap:12px;padding:6px 12px 0;margin-bottom:14px;
            font:500 12.5px var(--body);color:var(--soft)}
  .pa-summe b{font:700 15px var(--disp);letter-spacing:-.02em;color:var(--ink)}
  /* Leerzustand: eine ruhige Fläche mit Erklärung statt eines leeren Lochs. */
  .pa-leer{background:var(--paper);border-radius:12px;padding:14px 15px;
           font:400 12.5px var(--body);color:var(--soft);line-height:1.55}
  /* Hinzufügen: Person, ‰, Knopf. Auf dem iPhone steht die Auswahl in einer
     eigenen Zeile, darunter teilen sich Feld und Knopf die Breite; ab
     Tablet-Breite passt alles nebeneinander. */
  .pa-neu{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
          margin:16px 0 14px}
  .pa-neu .pa-person{flex:1 1 100%;min-width:0}
  /* Breit genug für „166,667" — auf Touch-Geräten rechnet die App mit 16 px. */
  .pa-neu .pa-neuwert{flex:0 0 100px;width:100px;padding-left:10px;
                      padding-right:10px;text-align:right}
  /* Die Einheit steht neben dem Feld, nicht darin: getippt wird nur die Zahl. */
  .pa-neu .pa-einheit{flex:none;margin:0 2px 0 -3px;
                      font:600 13px var(--mono);color:var(--soft)}
  .pa-neu .pa-add{flex:1 1 auto;width:auto;padding:12px 20px;font-size:14px}
  @media(min-width:680px){
    .pa-neu .pa-person{flex:1 1 200px}
    .pa-neu .pa-add{flex:0 0 auto}
  }
  /* Ein Hinweis, keine Sperre: gespeichert wird trotzdem. */
  .pa-hinweis{background:var(--amber-bg);color:var(--amber);border-radius:12px;
              padding:10px 13px;margin:10px 0 2px;line-height:1.5;
              font:500 12.5px var(--body)}

  /* N308 — die jährliche PV-Eigentümer-Abrechnung, getrennt von der ‰-Liste
     darüber durch einen Kartenkopf im selben Stil wie „PV im Jahr"/
     „E-Tankstelle" oben (Titel + Jahr-Chip). */
  .pa-jahrkopf{display:flex;align-items:baseline;justify-content:space-between;
               gap:10px;margin:18px 0 10px;padding-top:14px;
               border-top:1px solid var(--paper)}
  .pa-jahrt{font:600 12.5px var(--disp);letter-spacing:-.01em;color:var(--ink)}
  .pj-row{background:var(--paper);border-radius:12px;padding:12px 14px;
          margin-bottom:8px}
  .pj-kopf{display:flex;align-items:baseline;justify-content:space-between;
           gap:10px}
  .pj-name{font:600 13px var(--disp);letter-spacing:-.01em;color:var(--ink)}
  .pj-betrag{flex:none;font:700 15px var(--disp);letter-spacing:-.02em;
             color:var(--ink)}
  .pj-kum{display:block;font:400 11px var(--body);color:var(--soft);
          margin-top:2px}
  .pj-send{display:flex;flex-direction:column;align-items:center;gap:2px;
           width:100%;box-sizing:border-box;min-height:48px;padding:9px 14px;
           margin-top:10px}
  .pj-send .bs-t{font:600 11px var(--mono);letter-spacing:.02em;opacity:.9}
  .pj-send .bs-e{font:800 15px var(--disp);letter-spacing:-.02em}
  .pj-send:disabled{opacity:.5;cursor:default}
  .pj-chip{display:inline-flex;margin-top:10px}

  /* ---- N127 Verlauf: Grafik, Legende, Jahrestabelle ---------------------- */
  .chart{width:100%;max-width:560px;height:auto;display:block;overflow:visible;
         margin:2px auto 10px}

  .legende{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 16px;
           font:500 11.5px var(--body);color:var(--soft)}
  .legende span{display:inline-flex;align-items:center;gap:7px}
  .legende i{width:11px;height:11px;border-radius:4px;flex:none}
  .legende i.schraffur{background:repeating-linear-gradient(45deg,
    #916212 0 2px, #FFF 2px 4px)}
  .legende i.prognose{background:rgba(178,66,41,.22);
                      box-shadow:inset 0 0 0 1.5px rgba(178,66,41,.55)}
  /* N153 — der Satz zum aufgeteilten Vorlauf, direkt unter der Legende. */
  .legendennote{margin:-6px 0 16px;font:400 11.5px var(--body);
                color:var(--soft);line-height:1.55;max-width:600px}

  /* ---- N200 Kategorien: Ringdiagramm neben der Kurve + Prozent-Aufteilung --
     Kurve und Ring stehen auf breiten Schirmen nebeneinander, auf dem iPhone
     untereinander. Der Ring zeigt die kWh je Kategorie (die Fläche), seine
     Legende das € daneben — so wird sichtbar, dass die Einspeisung viele kWh zu
     wenig € bringt, E-Tanken und Direktnutzung weniger kWh zu mehr € je kWh. */
  .verlaufkopf{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;
               margin:0 0 8px}
  .vk-kurve{flex:1 1 320px;min-width:0}
  .vk-ring{flex:0 1 236px;min-width:198px;margin:0 auto}
  @media(max-width:520px){.vk-ring{flex:1 1 100%}}
  .vk-ring .rt{display:block;font:600 12.5px var(--disp);letter-spacing:-.01em;
               color:var(--ink);margin:0 0 8px;text-align:center}

  .kringel{width:100%;max-width:210px;height:auto;display:block;margin:0 auto 12px}
  .kringel .km-z{font:700 16px var(--disp);fill:var(--ink);text-anchor:middle;
                 letter-spacing:-.02em}
  .kringel .km-l{font:600 7.5px var(--mono);fill:var(--soft);text-anchor:middle;
                 letter-spacing:.06em}

  /* Die Ring-Legende: je Kategorie oben Chip · Name · € (eine Zeile), darunter
     kWh · €/kWh. So bleibt auch in der schmalen Spalte alles überlappungsfrei —
     ein Name, der umbricht, schiebt das € nicht in die kWh-Zeile. */
  .kleg{display:flex;flex-direction:column;gap:12px;margin:0}
  .kleg .kz{display:flex;flex-direction:column;gap:3px;min-width:0}
  .kleg .kzt{display:flex;align-items:baseline;gap:8px;min-width:0}
  .kleg .ki{width:11px;height:11px;border-radius:4px;flex:none;
            position:relative;top:2px}
  .kleg .ki.schraffur{background:repeating-linear-gradient(45deg,
    #916212 0 2px, #FFF 2px 4px)}
  /* Am Bindestrich umbrechen („PV-Eigenverbrauch"), nicht mitten im Wort. */
  .kleg .kn{flex:1;min-width:0;font:600 12px var(--disp);letter-spacing:-.01em;
            color:var(--ink)}
  .kleg .kv{flex:none;font:700 13px var(--disp);color:var(--ink);
            letter-spacing:-.02em;white-space:nowrap}
  .kleg .ksub{padding-left:19px;font:400 10.5px var(--mono);color:var(--soft)}

  /* Point 2 — woraus sich die Amortisation zusammensetzt: % je Kategorie,
     darunter kWh und €. Ein ruhiger Balken, dieselben Farben wie Kurve und
     Ring. */
  .katanteil{background:var(--paper);border-radius:14px;padding:15px;
             margin:2px 0 16px;max-width:640px}
  .katanteil .kt{display:block;font:600 13px var(--disp);letter-spacing:-.01em;
                 color:var(--ink);margin-bottom:13px}
  .katzeile{margin:13px 0 0}
  .katzeile:first-of-type{margin-top:0}
  .katzeile .kk{display:flex;align-items:baseline;justify-content:space-between;
                gap:10px;margin-bottom:6px}
  .katzeile .kl{display:inline-flex;align-items:center;gap:8px;min-width:0;
                font:600 12.5px var(--disp);letter-spacing:-.01em;color:var(--ink)}
  .katzeile .kl i{width:10px;height:10px;border-radius:3px;flex:none}
  .katzeile .kl i.schraffur{background:repeating-linear-gradient(45deg,
    #916212 0 2px, #FFF 2px 4px)}
  .katzeile .kp{flex:none;font:700 14px var(--disp);letter-spacing:-.02em;
                color:var(--teal-d)}
  .katzeile .kp.leer{color:var(--soft);font-weight:600;font-size:12.5px}
  .katzeile .kbar{height:8px;border-radius:999px;background:rgba(22,38,44,.09)}
  .katzeile .kbar > i{display:block;height:100%;border-radius:999px;min-width:3px}
  .katzeile .kmeta{display:flex;gap:4px 14px;flex-wrap:wrap;margin-top:6px;
                   font:400 11px var(--body);color:var(--soft)}
  .katzeile .kmeta b{font-weight:600;color:var(--ink)}
  .katnote{margin:13px 0 0;font:400 11.5px var(--body);color:var(--soft);
           line-height:1.55}

  /* Sieben Geldspalten passen auf dem iPhone nicht nebeneinander — die Tabelle
     scrollt in ihrem eigenen Rahmen, die Seite selbst nie. */
  .tabrahmen{overflow-x:auto;-webkit-overflow-scrolling:touch;
             border-radius:12px;background:var(--paper);margin:0 0 14px}
  .jt{border-collapse:collapse;width:100%;min-width:460px}
  .jt th{font:600 9px var(--mono);letter-spacing:.07em;text-transform:uppercase;
         color:var(--soft);text-align:right;padding:11px 12px 9px;
         white-space:nowrap}
  .jt th:first-child{text-align:left}
  .jt td{font:500 12.5px var(--mono);color:var(--ink);text-align:right;
         padding:10px 12px;white-space:nowrap;
         border-top:1px solid rgba(22,38,44,.07)}
  .jt td:first-child{text-align:left;font:600 13px var(--disp);
                     letter-spacing:-.01em}
  .jt td.leise{color:var(--soft)}
  /* N153b — die Zeile vor der ersten Abrechnung: das Jahr allein sagt nicht,
     warum dort ein Betrag steht, für den es keine Abrechnung gibt. */
  .jt .vorab{display:block;font:500 9px var(--mono);letter-spacing:.05em;
             text-transform:uppercase;color:var(--soft);margin-top:3px}
  /* N174 — der Vorlauf ohne Aufschlüsselung steht in der PV-Strom-Spalte; der
     Hinweis sagt leise, dass die Herkunft dort nicht getrennt ist. */
  .jt .unauf{display:block;font:500 8.5px var(--mono);letter-spacing:.04em;
             text-transform:uppercase;color:var(--soft);margin-top:2px}
  .jt td.summe{font-weight:700;color:var(--teal-d)}
  .jt .plus{color:var(--pos);font-weight:600}
  /* Der Hinweis erscheint nur, wenn die Tabelle wirklich nicht ganz passt —
     gemessen, nicht geraten (siehe `verlaufZeigen`). */
  .scrollhinweis{display:none;font:400 11.5px var(--body);color:var(--soft);
                 margin:-8px 0 14px}
  .scrollhinweis.zeigen{display:block}
  .jt tfoot td{font-weight:700;color:var(--ink);
               border-top:1.5px solid var(--line)}

  .verlaufleer{background:var(--paper);border-radius:14px;padding:18px 16px;
               margin-bottom:14px;font:400 13px var(--body);color:var(--soft);
               line-height:1.6}
  .verlaufleer p{margin:0 0 8px}
  .verlaufleer p:last-child{margin:0}

  /* ---- N183: Erklärtexte in Info-Popups -------------------------------
     Dieselbe Mechanik und Optik wie auf der E-Tankstelle (tankstelle.html,
     N181): statt einer Textwand am Kartenanfang steht ein kleines i hinter dem
     Titel. Eine Karte unter dem Icon auf dem Desktop, ein Blatt von unten auf
     dem iPhone, Escape/Klick daneben/„Verstanden" schließt. Kein neuer Text —
     nur ein anderer Ort. */
  .titelinfo{display:flex;align-items:center;gap:1px;min-width:0}
  .tinfo{display:inline-flex;align-items:center;justify-content:center;
         width:44px;height:44px;margin:-13px -10px -13px -4px;padding:0;border:none;
         background:none;color:var(--soft);cursor:pointer;border-radius:50%;
         flex:none;-webkit-tap-highlight-color:transparent}
  .tinfo svg{width:17px;height:17px;display:block}
  .tinfo:hover{color:var(--teal-d)}
  .tinfo:focus-visible{outline:2px solid var(--teal-d);outline-offset:2px}
  /* Die zwei Blöcke „Verbrauchsseite" / „Erzeugerseite" tragen ihr i in der
     Untertitel-Zeile (.fgt, auf der Grundlinie ausgerichtet) — dort sitzt das
     Icon mittig zur Textzeile statt auf der Grundlinie. */
  .fgt .tinfo{margin:-13px -8px -13px 1px;align-self:center}
  .tinfo-overlay{position:fixed;inset:0;z-index:1200;background:transparent}
  .tinfo-card{position:fixed;z-index:1201;background:var(--sheet);
              border-radius:14px;box-shadow:0 22px 55px -14px rgba(22,38,44,.45);
              padding:16px 18px;width:320px;max-width:calc(100vw - 24px);
              color:var(--ink)}
  .tinfo-titel{font:700 15px var(--disp);letter-spacing:-.01em;margin-bottom:7px}
  .tinfo-text{font:400 13px/1.6 var(--body);color:var(--ink);margin:0 0 13px}
  .tinfo-ok{min-height:40px;padding:0 16px;border:none;border-radius:10px;
            background:var(--teal-l);color:var(--teal-d);cursor:pointer;
            font:600 12.5px var(--disp)}
  .tinfo-ok:hover{background:var(--teal);color:#fff}
  @media(max-width:700px){
    .tinfo-overlay.sheet{background:rgba(22,38,44,.35)}
    .tinfo-card.sheet{left:0;right:0;bottom:0;top:auto;width:auto;max-width:none;
      border-radius:18px 18px 0 0;
      padding:20px 20px calc(20px + env(safe-area-inset-bottom));
      animation:tinfo-auf .18s ease-out}
    .tinfo-ok{min-height:44px;width:100%}
  }
  @keyframes tinfo-auf{from{transform:translateY(100%)}to{transform:translateY(0)}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <a href="index.html" aria-label="Zur Übersicht" class="applogo-link"><img src="icons/icon.svg" alt="" class="applogo"></a>
    <div class="barwrap">
      <h1>PV Amortisation</h1>
      <div class="sub" id="sub">wird geladen …</div>
    </div>
  </div>

  <div class="scroll">
    <div class="filter">
      <div id="objekt"></div>
      <div id="jahr"></div>
    </div>
    <div id="inhalt"></div>
  </div>

  <div data-nav></div>
</div>

<script type="module">
/* N83/N215 — Strom/PV je Objekt und Jahr. Strom ist zu vielschichtig für
   einen Betrag: drei Zählerstände ergeben zwei Verbrauchsgruppen
   (WG-Wohnungen und Büro/Studio = Rest), auf die die Quellen Netz/Solar/
   Akku verteilt werden; dazu die PV-Anlage mit Ertrag und Anschaffung,
   verteilt auf die Eigentümer (5/6 + 1/6). Gerechnet wird im Backend
   (app/strom.py); diese Seite pflegt die Eingaben und zeigt das Ergebnis
   live. Externe Stromlieferanten-Belege laufen weiter normal über die
   Belegeingabe — die sind hier nicht gemeint.

   N215 — die Fachlogik ist auf `./assets/strom/*.js` verteilt
   (siehe dort _TOPICS.md). Dieses Skript orchestriert nur noch: Skelett
   rendern, Formulare füllen, Objekt-/Jahreswechsel behandeln. */
import { api, esc, installNav, kreuzAnbringen } from './assets/immo.js';
import { auswahlfeld } from './assets/auswahl.js';
import { kostenIcon } from './assets/kostenicons.js';
import { S, inhalt, sub } from './assets/strom/state.js';
import { infoKnopf } from './assets/strom/info.js';
import { feldHtml, datumHtml } from './assets/strom/felder.js';
import { F_STAMM, F_VORLAUF, stammAusForm, stammFuellen, vorlaufZeigen,
         stammAngestossen, stammAnsichtZeigen } from './assets/strom/stammdaten.js';
import { F_JAHR_VERBRAUCH, F_JAHR_ERZEUGUNG, werteAusForm, formFuellen,
         angestossen, rechnen } from './assets/strom/jahre.js';
import { seBildZeigen } from './assets/strom/solaredge.js';
import { pvAnteileLaden } from './assets/strom/eigentuemer.js';
import { pvJahresabrechnungZeigen } from './assets/strom/jahresabrechnung.js';

installNav();

/* --------------------------------------------------------------------------
   Der Seitenaufbau (N139): erst der Verlauf — die eine Frage, um die es
   geht —, dann die Stammdaten der Anlage, danach das gewählte Jahr, die
   E-Tankstelle und zuletzt, wem die Anlage gehört.

   N121 — Zählerstände und die Aufteilung auf die Einheiten sind in den
   Nebenkostenbereich gezogen (Zeitraum → Zählerstände) und stehen deshalb
   nicht mehr hier.
   -------------------------------------------------------------------------- */
function skelett() {
  const jahr = S.jahrWahl.wert();
  return `
    <div class="karte" id="verlauf">
      <div class="hh"><span class="titelinfo"><h3>Verlauf</h3>
        ${infoKnopf('verlauf')}</span></div>
      <div class="kpi" id="vKpi"></div>
      <div id="vGrafik"></div>
      <div id="vTabelle"></div>
    </div>

    <!-- N139/N425 — die Anlage wurde einmal gekauft, nicht jedes Jahr neu.
         Diese Angaben gelten für alle Jahre und ändern sich oben nicht mit.
         Dieselbe Anzeigeform wie die Stammdaten jedes Objekts (.sekopf/.paare,
         immo.css): eine ruhige, lesbare Liste statt dauerhaft offener
         Eingabefelder — bearbeitet wird über den eigenen Dialog. -->
    <div class="karte eng">
      <div class="sekopf">
        <span class="seikon">${kostenIcon('Strom')}</span>
        <div class="setxt"><h2 class="sec">Stammdaten der Anlage</h2></div>
        <button type="button" data-stamm-bearbeiten>Bearbeiten</button>
      </div>
      <p class="hint">Gelten für alle Jahre — die Jahresauswahl oben ändert
        hier nichts.</p>
      <div class="paare" id="pvStammAnzeige"></div>

      <!-- N153 — der Startbetrag der Amortisation, aufgeschlüsselt nach
           denselben Quellen wie die Jahre danach. Die Aufteilung selbst
           pflegt man im Bearbeiten-Dialog; hier steht nur das Ergebnis. -->
      <div class="vorlauf">
        <div class="vk">
          <span class="vt">Bereits abgetragen</span>
          <span class="vs" id="vorlaufSumme">—</span>
        </div>
        <p class="vz" id="vorlaufZeit"></p>
        <p class="vf" id="vorlaufFuss"></p>
      </div>

      <dialog id="pvStammDlg" class="immo-dlg">
        <div class="dt">Stammdaten der Anlage</div>
        <div class="raster">
          ${F_STAMM.map(f => feldHtml(...f, 'stamm')).join('')}
          ${datumHtml('inbetriebnahme', 'Inbetriebnahme')}
        </div>
        <p class="hint">Was die Anlage vor der ersten Abrechnung eingebracht
          hat, nach denselben Quellen wie die Jahre danach — leer lassen, wenn
          sie vorher noch nichts eingebracht hat.</p>
        <div class="vraster">
          ${F_VORLAUF.map(f => feldHtml(...f, 'stamm')).join('')}
        </div>
      </dialog>
    </div>

    <div class="karte">
      <div class="hh"><h3>PV im Jahr</h3><span class="jahrchip">${jahr}</span></div>
      <!-- N160 — zwei Seiten, zwei Aufgaben. Maßgeblich für Verbrauch, Kosten
           und Autarkie ist die Verbrauchsseite; die Produktionsseite trägt
           allein die Einspeisevergütung. -->
      <p class="hint">Diese Werte gehören zum oben gewählten Jahr ${jahr}.</p>
      <!-- N131 — statt abzutippen den SolarEdge-Screenshot lesen lassen. Die
           Handeingabe darunter bleibt immer der Weg, der sicher funktioniert. -->
      <div class="se" data-se-zone>
        <button type="button" class="btn leise" data-se-waehlen>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="3.5"/>
            <circle cx="8.6" cy="10.2" r="1.5"/>
            <path d="M4 17.2l4.6-4.6 3 3L15 12l5 5.2"/>
          </svg>Screenshot lesen</button>
        <input type="file" accept="image/*" data-se-datei hidden>
        <p class="se-note"><b>Bild hierher ziehen oder auswählen</b>Die
          SolarEdge-Ansicht mit den Balken „Produktion" und „Verbrauch". Die
          erkannten Zahlen werden erst gezeigt und eingetragen, nachdem du sie
          bestätigt hast.</p>
      </div>
      <div id="seBild"></div>
      <div id="seBox"></div>
      <div class="fgruppe">
        <span class="fgt">Verbrauchsseite <em>maßgeblich</em>${
          infoKnopf('verbrauchsseite')}</span>
        <div class="raster">
          ${F_JAHR_VERBRAUCH.map(f => feldHtml(...f)).join('')}
        </div>
      </div>
      <div class="fgruppe">
        <span class="fgt">Erzeugerseite <em>Einspeisevergütung</em>${
          infoKnopf('erzeugerseite')}</span>
        <div class="raster">
          ${F_JAHR_ERZEUGUNG.map(f => feldHtml(...f)).join('')}
        </div>
      </div>
      <div class="kpi" id="pv"></div>
      <!-- N154 — was sich aus den eigenen Zahlen an Hebeln ablesen lässt.
           Steht nichts drin, wofür es Daten gibt, bleibt der Block leer. -->
      <div id="tipps"></div>
    </div>

    <!-- N132/N139 — Nutzer und Abrechnungen der Tankstelle haben eine eigene
         Seite; hier steht nur, was zur Anlage gehört: der Satz und was
         zufließt. -->
    <div class="karte">
      <div class="hh"><span class="titelinfo"><h3>E-Tankstelle</h3>
        ${infoKnopf('tankstelle')}</span><span class="jahrchip">${jahr}</span></div>
      <div class="kpi" id="tank"></div>
      <a class="verweis" id="tankLink" href="tankstelle.html">
        Nutzer und Abrechnungen verwalten →</a>
    </div>

    <div class="karte">
      <div class="hh"><span class="titelinfo"><h3>PV-Eigentümer</h3>
        ${infoKnopf('eigentuemer')}</span>
        <button class="plus" id="pvPlus" type="button" data-pv-add
                aria-label="Anteil zuordnen" title="Anteil zuordnen">＋</button></div>
      <!-- N204 — jede Zeile trägt Investitions-€ und ‰; hinzugefügt wird über
           das „＋" oben rechts, das ausgraut, sobald alle 1000 ‰ vergeben sind.
           Gespeichert wird in den Stammdaten der Anlage, nicht am Jahr. -->
      <div id="pvAnteile"></div>

      <!-- N308 — die jährliche Abrechnung statt eines nur kumulierten Standes:
           was die Anlage GENAU in diesem Jahr abgetragen hat, je Eigentümer,
           mit Versand nach demselben Muster wie die E-Tankstelle. Dasselbe
           Jahr wie die übrigen Karten oben — keine zweite Jahresauswahl. -->
      <div class="pa-jahrkopf">
        <span class="pa-jahrt">Jahresabrechnung</span>
        <span class="jahrchip">${jahr}</span>
      </div>
      <div id="pvJahresabrechnung"></div>
    </div>

    <div id="warnungen"></div>`;
}

async function laden() {
  // Ein noch offener Speicherlauf gehört zum alten Objekt/Jahr — abräumen,
  // bevor die Maske neu gefüllt wird. Sonst schriebe er die eben verlassenen
  // Werte in den gerade gewählten Datensatz.
  clearTimeout(S.speicherZeit);
  clearTimeout(S.stammZeit);
  S.speicherZeit = S.stammZeit = null;
  if (!S.objektSlug) {
    inhalt.innerHTML = `<div class="karte"><div class="chartleer">
      Kein Objekt vorhanden. Lege zuerst ein Objekt an.</div></div>`;
    sub.textContent = 'kein Objekt';
    return;
  }
  inhalt.innerHTML = skelett();
  S.seWerte = {};       // eine offene Prüfansicht gehört zum verlassenen Jahr
  inhalt.querySelectorAll('input[data-feld]').forEach(el =>
    el.addEventListener('input', angestossen));
  inhalt.querySelectorAll('input[data-stamm],input[data-stammdatum]').forEach(el =>
    el.addEventListener('input', stammAngestossen));
  // N425 — der Bearbeiten-Dialog der Stammdaten: er entsteht dynamisch (über
  // `inhalt.innerHTML`) NACH dem `DOMContentLoaded`-Durchlauf, der sonst jedem
  // <dialog> sein Kreuz mitgibt (`immo.js dialogeNachruesten`) — hier deshalb
  // von Hand. Bleibt ein Kind von `inhalt`, damit `stammAusForm`/`stammFuellen`
  // seine Felder wie gehabt über `inhalt.querySelectorAll` finden.
  const stammDlg = document.getElementById('pvStammDlg');
  if (stammDlg) {
    kreuzAnbringen(stammDlg);
    document.querySelector('[data-stamm-bearbeiten]')
      ?.addEventListener('click', () => stammDlg.showModal());
    stammDlg.addEventListener('click', e => { if (e.target === stammDlg) stammDlg.close(); });
    stammDlg.addEventListener('close', stammAnsichtZeigen);
  }
  const link = document.getElementById('tankLink');
  if (link) link.href = `tankstelle.html?objekt=${encodeURIComponent(S.objektSlug)}`;

  let werte, stamm;
  try {
    [werte, stamm] = await Promise.all([
      api(`/objekte/${encodeURIComponent(S.objektSlug)}/strom/${S.jahrWahl.wert()}`),
      api(`/objekte/${encodeURIComponent(S.objektSlug)}/pv/stammdaten`),
    ]);
  } catch (fehler) {
    inhalt.innerHTML = `<div class="empty"><div class="big">Keine Verbindung</div>
      <p>Die Stromdaten konnten nicht geladen werden.</p></div>`;
    return;
  }
  S.jahresSatz = werte;
  S.stammStand = stamm;
  formFuellen(werte);
  stammFuellen(stamm);
  stammAnsichtZeigen();
  vorlaufZeigen();
  seBildZeigen();               // ein schon gelesener Beleg bleibt sichtbar
  await pvAnteileLaden();
  await pvJahresabrechnungZeigen();
  S.letzteWerte = JSON.stringify(werteAusForm());
  S.letzteStamm = JSON.stringify(stammAusForm());
  await rechnen();
}

/* ---- Kopf: Objekt- und Jahr-Auswahl ---- */
const jetzt = new Date().getFullYear();
S.jahrWahl = auswahlfeld(document.getElementById('jahr'), {
  label: 'Jahr',
  optionen: Array.from({ length: 6 }, (_, i) => jetzt - i)
    .map(j => ({ wert: String(j), text: String(j) })),
  wert: String(jetzt),
  aenderung: () => laden(),
});

const objektWahl = auswahlfeld(document.getElementById('objekt'), {
  label: 'Objekt',
  optionen: [{ wert: '', text: '—' }],
  wert: '',
  aenderung: (wert) => { S.objektSlug = wert; laden(); },
});

let objekte = [];
try {
  objekte = await api('/objekte');
} catch {
  sub.textContent = 'API nicht erreichbar';
}

// N106 - PV ist ein Add-on einzelner Immobilien, keine Eigenschaft aller.
// Zur Wahl stehen deshalb nur Objekte MIT PV-Anlage (`hat_pv` aus dem
// Objekt-Endpunkt). Ist noch keines markiert, bleiben alle waehlbar - sonst
// koennte man die erste Anlage nirgends anlegen.
const mitPv = objekte.filter(o => o.hat_pv);
const wahl = mitPv.length ? mitPv : objekte;

// N213 — landet der Nutzer über ?objekt=<slug> auf einem Objekt, das keine
// PV-Anlage hat (Standard-Modell, kein `hat_pv`), zeigt die Seite einen
// klaren Leerzustand statt still die erste PV-Anlage einzublenden — sonst
// stünde plötzlich „Laufer Str. 5", obwohl der Nutzer eine andere Immobilie
// aufgerufen hat.
const ausUrl = new URLSearchParams(location.search).get('objekt');
const nichtPvUrl = ausUrl && objekte.some(o => o.slug === ausUrl)
                            && !wahl.some(o => o.slug === ausUrl);
if (nichtPvUrl) {
  const gemeint = objekte.find(o => o.slug === ausUrl);
  sub.textContent = gemeint ? (gemeint.titel || gemeint.name) : '';
  inhalt.innerHTML = `<div class="empty">
      <div class="big">Für diese Immobilie nicht relevant</div>
      <p>Diese Seite gehört zur PV-Anlage — sie erscheint nur bei Objekten,
      die eine PV-Anlage tragen. „${esc((gemeint && (gemeint.titel || gemeint.name)) || '')}"
      ist ohne PV geführt. Wähle oben eine Immobilie mit Anlage oder lege am
      Objekt eine PV-Anlage an.</p></div>`;
  if (wahl.length) {
    objektWahl.fuelle(wahl.map(o => ({ wert: o.slug, text: o.titel || o.name })), '');
  }
} else if (wahl.length) {
  // N110 - von der Objektkachel aus (?objekt=slug) direkt bei der richtigen
  // Anlage landen, statt erst wieder waehlen zu muessen.
  S.objektSlug = (ausUrl && wahl.some(o => o.slug === ausUrl)) ? ausUrl : wahl[0].slug;
  objektWahl.fuelle(wahl.map(o => ({ wert: o.slug, text: o.titel || o.name })),
                    S.objektSlug);
  sub.textContent = mitPv.length
    ? `${mitPv.length} ${mitPv.length === 1 ? 'Anlage' : 'Anlagen'}`
    : 'Noch keine PV-Anlage erfasst';
  await laden();
} else {
  await laden();
}
</script>
