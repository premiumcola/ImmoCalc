# =============================================================================
# ImmoCalc — Stack-Definition
#
# ACHTUNG, WICHTIG: Das hier ist NICHT die Datei, aus der die laufende App
# gestartet wird. Der Server läuft seit dem 23.08.2026 aus
#
#     premiumcola/devBox  →  immocalc/docker-compose.yml
#
# Diese Datei hier ist eine ABBILDUNG davon für Entwicklung und Nachschlagen.
# Weichen beide voneinander ab, gilt die Datei im devBox-Repo — nicht diese.
# Wer etwas an der laufenden Umgebung ändern will, ändert sie DORT.
#
# Der Weg dahin: GitHub Actions baut aus diesem Repo nach
# ghcr.io/premiumcola/immocalc-{api,dashboard}, Watchtower auf dem Unraid
# pollt die Registry und rollt neue Images selbstständig aus. Auf dem Server
# wird nichts gebaut, deshalb hier `image:` und kein `build:` mehr.
#
# KEIN ./public-Mount mehr: das Frontend steckt im Dashboard-Image. Eine
# Änderung an public/ ist also NICHT mehr sofort live — sie braucht den Weg
# über CI und Watchtower. Für die Entwicklung holt
# docker-compose.override.yml.example den Mount lokal zurück, ohne die
# Produktion anzufassen (siehe README.md).
# =============================================================================

name: immocalc

services:

  api:
    image: ghcr.io/premiumcola/immocalc-api:latest
    container_name: immocalc-api
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      DB_PATH: /data/immocalc.db
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      # N264 — Druckdienst (CUPS) im Haus. Leer = keine Druckknoepfe.
      DRUCKDIENST: ${DRUCKDIENST:-192.168.178.10:631}
    # ANTHROPIC_API_KEY steht bewusst NIRGENDS im Klartext im Repo. Die Datei
    # liegt nur auf dem Server. `required:false`, damit dieselbe Datei auch auf
    # einer Maschine ohne diesen Pfad startet (Entwicklung) statt abzubrechen.
    # STAND: die Datei existiert, der Schlüssel darin ist LEER — die
    # KI-Beleg-Auslese läuft deshalb aktuell ins Leere (siehe MIGRATION.md).
    env_file:
      - path: /mnt/user/appdata/immocalc-live/immocalc.env
        required: false
    volumes:
      # In Benutzung ist der ALTE Pfad (`immocalc-live`). Der Umzug nach
      # /mnt/user/appdata/immocalc/data ist ein bewusst getrennter, noch
      # offener Folgeschritt — siehe MIGRATION.md. Hier steht deshalb die
      # Realität, nicht das Ziel.
      - ${DATA_DIR:-/mnt/user/appdata/immocalc-live/data}:/data
    labels:
      net.unraid.docker.managed: composeman
      net.unraid.docker.shell: /bin/sh
      # Icon liefert der Dashboard-Container aus (public/ steckt in dessen
      # Image und ist ohnehin veroeffentlicht) — api selbst hat keinen Port.
      net.unraid.docker.icon: "http://192.168.178.10:${DASHBOARD_PORT:-8091}/icons/icon-api-512.png"
      com.centurylinklabs.watchtower.enable: "true"
      net.premiumcola.status: "http://immocalc-api:8000/status"

  dashboard:
    image: ghcr.io/premiumcola/immocalc-dashboard:latest
    container_name: immocalc-dashboard
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${DASHBOARD_PORT:-8091}:80"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_UPSTREAM: api:8000
    labels:
      net.unraid.docker.managed: composeman
      net.unraid.docker.shell: /bin/sh
      net.unraid.docker.icon: "http://192.168.178.10:${DASHBOARD_PORT:-8091}/icons/icon-512.png"
      net.unraid.docker.webui: "http://[IP]:[PORT:8091]"
      com.centurylinklabs.watchtower.enable: "true"

volumes: {}
